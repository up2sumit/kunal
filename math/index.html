he equation 8² + 16² − 19² = (?)³ − 257?", "o": ["6", "8", "9", "2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "64 + 256 − 361 = (?)³ − 257, so −41 = (?)³ − 257 and (?)³ = 216 = 6³. So ? = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0328", "ch": 6, "page": 44, "ansPage": 44, "srcNo": "Number System Q327", "exam": "", "q": "What is the value of (256)^(1/2) − (1331)^(1/3) + 23 × 13?", "o": ["305", "304", "302", "309"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "(256)^(1/2) = 16 and (1331)^(1/3) = 11, and 23 × 13 = 299. So 16 − 11 + 299 = 304.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0329", "ch": 6, "page": 44, "ansPage": 44, "srcNo": "Number System Q328", "exam": "", "q": "Find the value of the given expression √(20 − √(20 − √(20 − ... ∞))).", "o": ["5", "2", "6", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let x = √(20 − √(20 − ...)). Then x² = 20 − x, so x² + x − 20 = 0, which factors as (x − 4)(x + 5) = 0. Since x is positive, x = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-032", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0330", "ch": 6, "page": 44, "ansPage": 45, "srcNo": "Number System Q329", "exam": "", "q": "If a : b = b : c, then the value of a⁶ : b⁶ is ______.", "o": ["b³ = ac", "a² : b²", "a³ : c³", "a³ : b³"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "a : b = b : c gives b² = ac. Then b⁶ = a³c³ and a⁶ : b⁶ = a⁶ : (a³c³) = a³ : c³.", "tip": "", "status": "note", "note": "Option (a) 'b³ = ac' is as printed; it is not a ratio and is not the answer.", "void": false}, {"id": "MTH-0331", "ch": 6, "page": 45, "ansPage": 45, "srcNo": "Number System Q330", "exam": "", "q": "Solve ((82 × 82) − (18 × 18))^0.5.", "o": ["20", "100", "80", "40"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "(82)² − (18)² = (82 + 18)(82 − 18) = 100 × 64. The square root is 10 × 8 = 80.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0332", "ch": 6, "page": 45, "ansPage": 45, "srcNo": "Number System Q331", "exam": "", "q": "Simplify: [5(a⁶ − b⁶)³ + 5(b⁶ − c⁶)³ + 5(c⁶ − a⁶)³] / [2(a³ − b³)³ + 2(b³ − c³)³ + 2(c³ − a³)³]", "o": ["(5/2)(a³ − b³)(b³ − c³)(c³ + a³)", "(5/2)(a³ − b³)(b³ + c³)(c³ + a³)", "(5/2)(a³ + b³)(b³ − c³)(c³ − a³)", "(5/2)(a³ + b³)(b³ + c³)(c³ + a³)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If x + y + z = 0 then x³ + y³ + z³ = 3xyz. Both the numerator and denominator have three terms that sum to zero, so the ratio is (5/2) × [3(a⁶−b⁶)(b⁶−c⁶)(c⁶−a⁶)]/[3(a³−b³)(b³−c³)(c³−a³)]. Using a⁶ − b⁶ = (a³ − b³)(a³ + b³) etc., the ratio becomes (5/2)(a³ + b³)(b³ + c³)(c³ + a³).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0333", "ch": 6, "page": 45, "ansPage": 45, "srcNo": "Number System Q332", "exam": "", "q": "If 6^(⁴√x) + 8^(⁴√x) = 10^(⁴√x), then the value of x is ______.", "o": ["8", "2", "16", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Try x = 16 so that ⁴√16 = 2: 6² + 8² = 36 + 64 = 100 = 10². So x = 16.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-033", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0334", "ch": 6, "page": 45, "ansPage": 45, "srcNo": "Number System Q333", "exam": "", "q": "If 21^(√x) + 20^(√x) = 29^(√x), find the value of x.", "o": ["3", "2", "4", "0"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Take x = 4 so that √x = 2: 21² + 20² = 441 + 400 = 841 = 29². So x = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-034", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0335", "ch": 6, "page": 45, "ansPage": 45, "srcNo": "Number System Q334", "exam": "", "q": "Find the value of √(2 + √3) + √(2 − √3).", "o": ["6", "√6", "2√3", "2√2"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let x = √(2 + √3) + √(2 − √3). Then x² = (2 + √3) + (2 − √3) + 2√((2 + √3)(2 − √3)) = 4 + 2√1 = 6. So x = √6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0336", "ch": 6, "page": 45, "ansPage": 45, "srcNo": "Number System Q335", "exam": "", "q": "If √(1 + √3/2) − √(1 − √3/2) = c, what is the value of c?", "o": ["4", "2", "3", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "1 + √3/2 = (2 + √3)/2 = (4 + 2√3)/4 = ((√3 + 1)/2)², and 1 − √3/2 = ((√3 − 1)/2)². So c = (√3 + 1)/2 − (√3 − 1)/2 = 2/2 = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0337", "ch": 6, "page": 45, "ansPage": 46, "srcNo": "Number System Q336", "exam": "", "q": "If a = (√3 + √2)/(√3 − √2) and b = (√3 − √2)/(√3 + √2), what is the value of a² + b² − ab?", "o": ["97", "(2√3) + 2", "(4√6) + 1", "98"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Rationalising, a = 5 + 2√6 and b = 5 − 2√6. So a + b = 10 and ab = 25 − 24 = 1. Then a² + b² − ab = (a + b)² − 2ab − ab = 100 − 3 = 97.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0338", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q337", "exam": "", "q": "If P = 7 + 4√3 and PQ = 1, what is the value of 1/P² + 1/Q²?", "o": ["196", "194", "206", "182"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Q = 1/P = 7 − 4√3 and 1/P = Q, 1/Q = P. So 1/P² + 1/Q² = Q² + P² = (7 − 4√3)² + (7 + 4√3)² = 2(49 + 48) = 194.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0339", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q338", "exam": "", "q": "√(11 + 2√18) is nearest to which of the following?", "o": ["3.8", "4.1", "4.4", "4.8"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "11 + 2√18 = 9 + 2 + 2 × 3 × √2 = (3 + √2)². So √(11 + 2√18) = 3 + √2 = 3 + 1.414 = 4.414, which is nearest to 4.4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0340", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q339", "exam": "", "q": "√(9 − 2√(11 − 6√2)) is nearest to which of the following?", "o": ["2.4", "2.7", "2.9", "2.1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "11 − 6√2 = 9 + 2 − 2 × 3 × √2 = (3 − √2)², so √(11 − 6√2) = 3 − √2. Then 9 − 2(3 − √2) = 3 + 2√2 = (√2 + 1)², so the value is √2 + 1 = 2.414, which is nearest to 2.4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-035", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0341", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q340", "exam": "", "q": "If a = (2 + √3)/(2 − √3) and b = (2 − √3)/(2 + √3), find the value of a² + b² + ab.", "o": ["195", "185", "196", "186"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Rationalising, a = 7 + 4√3 and b = 7 − 4√3. Then a + b = 14 and ab = 49 − 48 = 1. So a² + b² + ab = (a + b)² − ab = 196 − 1 = 195.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-036", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0342", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q341", "exam": "", "q": "What is the value of (√5 − √3) ÷ (√5 + √3)?", "o": ["4 − √15", "6 − 2√15", "8 − 2√15", "4 + √15"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Rationalising: (√5 − √3)²/((√5)² − (√3)²) = (5 + 3 − 2√15)/2 = (8 − 2√15)/2 = 4 − √15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0343", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q342", "exam": "", "q": "Find the value of √(8 + √1681).", "o": ["5", "6", "4", "7"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "√1681 = 41, so √(8 + 41) = √49 = 7.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-028", "first": false, "kind": "exact", "of": "MTH-0320"}}, {"id": "MTH-0344", "ch": 6, "page": 46, "ansPage": 46, "srcNo": "Number System Q343", "exam": "", "q": "If x = √(−√3 + √(3 + 8√(7 + 4√3))), where x > 0, find the value of x.", "o": ["2", "4", "1", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "7 + 4√3 = (2 + √3)², so 8√(7 + 4√3) = 16 + 8√3. Then 3 + 16 + 8√3 = 19 + 8√3 = (4 + √3)², whose root is 4 + √3. So −√3 + 4 + √3 = 4 and x = √4 = 2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-029", "first": false, "kind": "exact", "of": "MTH-0321"}}, {"id": "MTH-0345", "ch": 6, "page": 46, "ansPage": 47, "srcNo": "Number System Q344", "exam": "", "q": "From the equation (5)² + (6)² + (30)² = (x)², find the value of x.", "o": ["53", "37", "41", "31"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "25 + 36 + 900 = 961 = x², so x = 31.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-030", "first": false, "kind": "exact", "of": "MTH-0323"}}, {"id": "MTH-0346", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q345", "exam": "", "q": "Find the value of (√1.24 × √2.79)/(√2.64 × √5.94).", "o": ["31/44", "33/31", "31/66", "33/64"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The expression equals √31 × √31/(√66 × √66) = 31/66.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-031", "first": false, "kind": "exact", "of": "MTH-0324"}}, {"id": "MTH-0347", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q346", "exam": "", "q": "What number can replace the question mark in (0.064)^123 ÷ 0.16^47 × 0.4^34 × 0.4^29 = (0.4)^?", "o": ["320", "341", "338", "350"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "(0.064)^123 = (0.4³)^123 = 0.4^369 and 0.16^47 = (0.4²)^47 = 0.4^94. So 0.4^(369 − 94 + 34 + 29) = 0.4^338, and ? = 338.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0348", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q347", "exam": "", "q": "Find the value of the given expression √(20 − √(20 − √(20 − ... ∞))).", "o": ["5", "2", "6", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let x be the value. Then x² = 20 − x, so x² + x − 20 = 0 and (x − 4)(x + 5) = 0. Hence x = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-032", "first": false, "kind": "exact", "of": "MTH-0329"}}, {"id": "MTH-0349", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q348", "exam": "", "q": "If 6^(⁴√x) + 8^(⁴√x) = 10^(⁴√x), then the value of x is ______.", "o": ["8", "2", "16", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Putting x = 16 gives ⁴√16 = 2: 6² + 8² = 100 = 10². So x = 16.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-033", "first": false, "kind": "exact", "of": "MTH-0333"}}, {"id": "MTH-0350", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q349", "exam": "", "q": "If 21^(√x) + 20^(√x) = 29^(√x), find the value of x.", "o": ["3", "2", "4", "0"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "With x = 4, √x = 2 and 21² + 20² = 441 + 400 = 841 = 29². So x = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-034", "first": false, "kind": "exact", "of": "MTH-0334"}}, {"id": "MTH-0351", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q350", "exam": "", "q": "√(9 − 2√(11 − 6√2)) is nearest to which of the following?", "o": ["2.4", "2.7", "2.9", "2.1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "√(11 − 6√2) = 3 − √2, so 9 − 2(3 − √2) = 3 + 2√2 = (√2 + 1)². The value is √2 + 1 = 2.414, nearest to 2.4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-035", "first": false, "kind": "exact", "of": "MTH-0340"}}, {"id": "MTH-0352", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q351", "exam": "", "q": "If a = (2 + √3)/(2 − √3) and b = (2 − √3)/(2 + √3), find the value of a² + b² + ab.", "o": ["195", "185", "196", "186"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "a = 7 + 4√3 and b = 7 − 4√3, so a + b = 14 and ab = 1. Then a² + b² + ab = 196 − 1 = 195.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-036", "first": false, "kind": "exact", "of": "MTH-0341"}}, {"id": "MTH-0353", "ch": 6, "page": 47, "ansPage": 47, "srcNo": "Number System Q352", "exam": "14.09.2020 S-I", "q": "0.6̄ + 0.8̄ + 0.92̄ + 0.3̄ (each recurring) is equal to ______.", "o": ["31/10", "31/11", "32/11", "32/12"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "0.6̄ = 6/9, 0.8̄ = 8/9, 0.9̄2̄ = 92/99 and 0.3̄ = 3/9. Over 99: (66 + 88 + 92 + 33)/99 = 279/99 = 31/11.", "tip": "", "status": "note", "note": "The overbars in the source are hard to read; the printed solution treats each decimal as a fully recurring decimal, as written here.", "void": false}, {"id": "MTH-0354", "ch": 7, "page": 48, "ansPage": 48, "srcNo": "Algebra Q1", "exam": "22.05.2024 S-I", "q": "The pair of equations a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0 will have a unique solution if ______.", "o": ["a₁/a₂ = b₁/b₂", "a₁/a₂ ≠ b₁/b₂", "a₁/a₂ = b₁/b₂ ≠ c₁/c₂", "a₁/a₂ = b₁/b₂ = c₁/c₂"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Two linear equations have a unique solution when the lines intersect at a single point, which happens when the ratio of the coefficients of x and y differs: a₁/a₂ ≠ b₁/b₂.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0355", "ch": 7, "page": 48, "ansPage": 48, "srcNo": "Algebra Q2", "exam": "22.05.2024 S-I", "q": "The pair of equations a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0 will have infinitely many solutions if ______.", "o": ["a₁/a₂ = b₁/b₂", "a₁/a₂ ≠ b₁/b₂", "a₁/a₂ = b₁/b₂ = c₁/c₂", "a₁/a₂ = b₁/b₂ ≠ c₁/c₂"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The equations have infinitely many solutions when the two lines coincide, which needs a₁/a₂ = b₁/b₂ = c₁/c₂.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0356", "ch": 7, "page": 48, "ansPage": 48, "srcNo": "Algebra Q3", "exam": "22.05.2024 S-II", "q": "The pair of equations x + 2y = 3 and 5x + ky = 15 has infinitely many solutions. The value of k is ______.", "o": ["6", "20", "10", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For infinitely many solutions the lines must coincide, so one equation must be a multiple of the other. Multiplying x + 2y = 3 by 5 gives 5x + 10y = 15, so k = 10.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0357", "ch": 7, "page": 48, "ansPage": 48, "srcNo": "Algebra Q4", "exam": "22.05.2024 S-II", "q": "If the pair of equations kx − y = 2 and 6x − 2y = 3 has exactly one solution, then the value of k is ______.", "o": ["= 0", "= 3", "≠ 0", "≠ 3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A unique solution needs a₁/a₂ ≠ b₁/b₂. Here a₁ = k, b₁ = −1, a₂ = 6, b₂ = −2, so k/6 ≠ −1/−2 = 1/2, giving k ≠ 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0358", "ch": 7, "page": 48, "ansPage": 48, "srcNo": "Algebra Q5", "exam": "09.06.2024 S-I", "q": "For the equation 4x + 3y = a, if x = 1 and y = 2, what is the value of a?", "o": ["7", "10", "4", "3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Substituting x = 1 and y = 2: 4 × 1 + 3 × 2 = 4 + 6 = 10, so a = 10.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-037", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0359", "ch": 7, "page": 48, "ansPage": 48, "srcNo": "Algebra Q6", "exam": "09.06.2024 S-I", "q": "For what value of k will the pair of equations 5x + 2y = k and 10x + 4y = 3 have infinitely many solutions?", "o": ["5/2", "1/2", "3/2", "1/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For infinitely many solutions, 5/10 = 2/4 = k/3. So 1/2 = k/3 and k = 3/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0360", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q7", "exam": "09.06.2024 S-I", "q": "The remainder when the polynomial (x² − 2x + 1) is divided by (x − 1) is ______.", "o": ["1", "2", "0", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x² − 2x + 1 = (x − 1)², so division by (x − 1) gives quotient x − 1 and remainder 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0361", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q8", "exam": "09.06.2024 S-I", "q": "If the pair of equations 2x + 3y = 5 and 4x + ky = 10 has infinitely many solutions, then the value of k will be ______.", "o": ["3", "6", "0", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For infinitely many solutions, a₁/a₂ = b₁/b₂ = c₁/c₂: 2/4 = 3/k = 5/10. From 2/4 = 3/k we get k = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0362", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q9", "exam": "23.05.2024 S-II", "q": "If x = 1 and y = 6 is a solution of 8x − ay + a² = 0, then a = ______.", "o": ["−2, −4", "2, 4", "−2, 4", "2, −4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Substituting x = 1, y = 6: 8 − 6a + a² = 0, so a² − 6a + 8 = 0, which factors as (a − 2)(a − 4) = 0. Hence a = 2 or 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0363", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q10", "exam": "23.05.2024 S-II", "q": "If the graphs of two linear equations are shown as in the figure (two parallel lines on the x-y axes), how many solutions are possible?", "o": ["No solution", "Infinitely many solutions", "Two solutions", "Some solutions"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If two lines intersect, there is exactly one solution. If they are parallel, there is no solution. The figure shows two parallel lines, so there is no solution.", "tip": "", "status": "note", "note": "The question depends on a figure of two parallel lines drawn on x-y axes; the figure is described here in words.", "void": false}, {"id": "MTH-0364", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q11", "exam": "23.05.2024 S-II", "q": "In the linear equation 3x + 2y = 4, if y = −1, then the value of x is ______.", "o": ["2", "−2", "3", "−3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Put y = −1: 3x + 2(−1) = 4, so 3x = 6 and x = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0365", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q12", "exam": "23.05.2024 S-II", "q": "If the solution of the pair of equations 3x − 2y = 1 is x = 1 and y = k, then the value of k is ______.", "o": ["2", "1", "0", "4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Substituting x = 1 and y = k: 3(1) − 2k = 1, so 2k = 2 and k = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0366", "ch": 7, "page": 49, "ansPage": 49, "srcNo": "Algebra Q13", "exam": "23.05.2024 S-II", "q": "If aq ≠ bp, then the pair of equations ax + by = c and px + qy = r will have ______.", "o": ["One solution", "No solution", "Many solutions", "May or may not have a solution"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If aq ≠ bp, then a/p ≠ b/q, so the lines intersect at exactly one point and the pair has only one solution.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-038", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0367", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q14", "exam": "23.05.2024 S-II", "q": "In the equation 2x − 3y = 14, if x = 1, what is the value of y?", "o": ["−3", "4", "−4", "5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Putting x = 1: 2 − 3y = 14, so −3y = 12 and y = −4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-039", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0368", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q15", "exam": "23.05.2024 S-I", "q": "If 2x + 3y = 13 and 4x − y = 5, the values of x and y are ______.", "o": ["x = 2, y = 3", "x = 3, y = −2", "x = −3, y = −2", "x = −2, y = −3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Multiply the second equation by 3: 12x − 3y = 15. Adding to 2x + 3y = 13 gives 14x = 28, so x = 2. Then 4 + 3y = 13 gives y = 3.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-040", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0369", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q16", "exam": "23.05.2024 S-I", "q": "In a linear equation mx + by + n = 0 in two variables x and y, the maximum number of possible solutions is ______.", "o": ["1", "2", "Infinite", "None"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A linear equation in two variables represents a straight line, and a line has infinitely many points. Each point is a solution of the equation.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0370", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q17", "exam": "23.05.2024 S-I", "q": "If the solution of 2x + by = 8 and ax − 3y = −4 is x = 1 and y = 2, then the values of a and b are ______.", "o": ["a = 2, b = 3", "a = −2, b = 3", "a = 2, b = −3", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the first equation: 2(1) + 2b = 8, so b = 3. In the second: a(1) − 3(2) = −4, so a = 2. Hence a = 2 and b = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0371", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q18", "exam": "23.05.2024 S-I", "q": "A pair of equations is called dependent if it has ______.", "o": ["Infinitely many solutions", "One and only one solution", "No solution", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A pair of linear equations is called dependent (consistent) when it has infinitely many solutions, i.e. the two lines coincide.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0372", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q19", "exam": "23.05.2024 S-I", "q": "The pair of equations a₁x + b₁y = c₁ and a₂x + b₂y = c₂ will have no solution if ______.", "o": ["a₁/a₂ = b₁/b₂", "a₁/a₂ ≠ b₁/b₂", "a₁/a₂ = b₁/b₂ = c₁/c₂", "a₁/a₂ = b₁/b₂ ≠ c₁/c₂"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If a₁/a₂ ≠ b₁/b₂ there is a unique solution; if a₁/a₂ = b₁/b₂ = c₁/c₂ there are infinitely many; if a₁/a₂ = b₁/b₂ ≠ c₁/c₂ there is no solution (parallel lines).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0373", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q20", "exam": "23.05.2024 S-I", "q": "The number of solutions common to the equations x = 5 and x = −4 is ______.", "o": ["Two (2)", "One (1)", "Infinite", "None of the above / no solution"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The two equations give two different values of the same variable x, which cannot both hold at once. So there is no common solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0374", "ch": 7, "page": 50, "ansPage": 50, "srcNo": "Algebra Q21", "exam": "23.05.2024 S-I", "q": "If 2x + y = 7 and 3x + 2y = 12, then the value of x + y is ______.", "o": ["5", "−5", "7", "−7"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Multiply the first by 2: 4x + 2y = 14. Subtract 3x + 2y = 12 to get x = 2. Then 4 + y = 7 gives y = 3. So x + y = 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0375", "ch": 7, "page": 51, "ansPage": 51, "srcNo": "Algebra Q22", "exam": "23.05.2024 S-I", "q": "A pair of equations that has no solution is called ______.", "o": ["Consistent", "Inconsistent", "Dependent", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A pair of equations with no solution is called inconsistent. A consistent pair has a unique solution or infinitely many solutions (the dependent case).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0376", "ch": 7, "page": 51, "ansPage": 51, "srcNo": "Algebra Q23", "exam": "23.05.2024 S-I", "q": "The pair of equations 6x − 2y − 3 = 0 and px − y − 2 = 0 will have a unique solution if the value of p is ______.", "o": ["≠ 3", "= 0", "≠ 0", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For a unique solution a₁/a₂ ≠ b₁/b₂. Here a₁ = 6, b₁ = −2, a₂ = p, b₂ = −1, so 6/p ≠ −2/−1 = 2, which gives p ≠ 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0377", "ch": 7, "page": 51, "ansPage": 51, "srcNo": "Algebra Q24", "exam": "24.05.2024 S-I", "q": "If a pair of linear equations in two variables is consistent, then the lines represented by the equations will be ______.", "o": ["Intersecting lines", "Parallel lines", "Always coincident", "Intersecting or coincident lines"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A consistent pair has either a unique solution (the lines intersect) or infinitely many solutions (the lines coincide).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0378", "ch": 7, "page": 51, "ansPage": 51, "srcNo": "Algebra Q25", "exam": "24.05.2024 S-I", "q": "If the graphs of the pair of equations a₁x + b₁y = c₁ and a₂x + b₂y = c₂ intersect each other at one definite point, then the solutions of the pair will be ______.", "o": ["Infinite", "One and only one", "No solution", "All of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If the lines intersect at one definite point, the coordinates of that point form the only solution of the pair, so the pair has a unique solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0379", "ch": 7, "page": 51, "ansPage": 51, "srcNo": "Algebra Q26", "exam": "24.05.2024 S-I", "q": "The lines representing the pair of equations 2x − 3y − 2 = 0 and 4x − 4y − 5 = 0 will be ______.", "o": ["Intersecting", "Parallel", "Coincident", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "a₁/a₂ = 2/4 = 1/2 and b₁/b₂ = −3/−4 = 3/4. Since a₁/a₂ ≠ b₁/b₂, the lines intersect.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0380", "ch": 7, "page": 51, "ansPage": 51, "srcNo": "Algebra Q27", "exam": "22.05.2024 S-II", "q": "How can the linear equation x − 4 = 0 be shown on graph paper?", "o": ["A straight line", "A point", "By infinitely many lines", "By two lines"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x − 4 = 0 means x = 4, a line parallel to the y-axis passing through (4, 0), (4, 1), (4, 2), (4, −3) and so on. It is represented by a single straight line.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0381", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q28", "exam": "22.05.2024 S-II", "q": "The general form of a linear equation in two variables is ax + by + c = 0, where ______.", "o": ["a ≠ 0, b ≠ 0", "a = 0; b ≠ 0", "a ≠ 0; b = 0", "a = 0; c = 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If a = 0 the equation reduces to by + c = 0, and if b = 0 it reduces to ax + c = 0, each of which has only one variable. For a true equation in two variables, both a ≠ 0 and b ≠ 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0382", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q29", "exam": "22.05.2024 S-II", "q": "If (x + 4) is a factor of a polynomial, then a zero of that polynomial is ______.", "o": ["4", "−4", "3", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If (x + 4) is a factor, then x + 4 = 0 gives x = −4, which is a zero of the polynomial.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0383", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q30", "exam": "22.05.2024 S-II", "q": "If y = 29 for the equation y = 5 − 6x, what is the value of x?", "o": ["−4", "5", "−6", "−1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Substitute y = 29: 29 = 5 − 6x, so −6x = 24 and x = −4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0384", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q31", "exam": "22.05.2024 S-II", "q": "A consistent pair of equations has ______ solution(s).", "o": ["No", "Infinitely many", "One and only one", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The book states that a consistent pair means it has at least one solution, and that if the two lines meet at a single point the pair has one and only one solution.", "tip": "", "status": "note", "note": "A consistent pair can also have infinitely many solutions (when the lines coincide). The printed key (c) follows the book's convention that the consistent pair, in the sense of intersecting lines, has a unique solution. Printed key retained, flagged for review.", "void": false, "dup": {"group": "DUP-041", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0385", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q32", "exam": "22.05.2024 S-II", "q": "If a pair of equations has infinitely many solutions, the pair of equations is called ______.", "o": ["Dependent", "Inconsistent", "Consistent", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A pair of linear equations whose lines coincide has infinitely many solutions; such a pair is called dependent.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0386", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q33", "exam": "22.05.2024 S-II", "q": "For what value of k will the pair of equations x + 2y − 7 = 0 and 2x + ky = 14 be consistent (coincident)?", "o": ["4", "1", "3", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For coincident lines, a₁/a₂ = b₁/b₂ = c₁/c₂: 1/2 = 2/k = −7/−14 = 1/2. So 2/k = 1/2 and k = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0387", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q34", "exam": "22.05.2024 S-II", "q": "When the polynomial p(x) = 5x² + 3x + 1 is divided by q(x) = 2x, the degree of the quotient will be ______.", "o": ["1", "2", "3", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Dividing 5x² + 3x + 1 by 2x gives a quotient 5x/2 + 3/2 (with remainder 1). The highest power of x in the quotient is 1, so the degree is 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0388", "ch": 7, "page": 52, "ansPage": 52, "srcNo": "Algebra Q35", "exam": "22.05.2024 S-II", "q": "For the equation 3x + 4y − 9 = 0, if x = 5, what is the value of y?", "o": ["4", "3", "−9", "−3/2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Put x = 5: 15 + 4y − 9 = 0, so 4y = −6 and y = −3/2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-042", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0389", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q36", "exam": "22.05.2024 S-I", "q": "A pair of linear equations that has no solution is called a ______ pair.", "o": ["Inconsistent", "Consistent", "Dependent", "Intersecting"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "When the lines are parallel (they never meet), the pair has no solution. Such a pair is called inconsistent.", "tip": "", "status": "note", "note": "Option (d) is printed as a one-word Hindi term meaning 'intersecting at one (point)'.", "void": false, "dup": {"group": "DUP-043", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0390", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q37", "exam": "22.05.2024 S-II", "q": "If a = bq + r, with a = 30 and b = 5, then (q, r) = ?", "o": ["(6, 0)", "(2, 3)", "(0, 6)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "This is Euclid's division lemma a = bq + r with 0 ≤ r < b. Dividing 30 by 5 gives quotient 6 and remainder 0, so (q, r) = (6, 0).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0391", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q38", "exam": "22.05.2024 S-I", "q": "How many linear equations are satisfied by x = 2 and y = −2?", "o": ["One", "Two", "Three", "Infinite"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Infinitely many linear equations pass through the point (2, −2), for example x + y = 0, x − y = 4 and 2x + y = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0392", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q39", "exam": "22.05.2024 S-I", "q": "If (−2, 2), (0, 0) and (2, −2) are solutions of a linear equation, the equation will be ______.", "o": ["y = −x", "y = x", "y = 2x", "x = 2y"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For (−2, 2): y = −x gives 2 = −(−2) = 2. For (0, 0): 0 = 0. For (2, −2): −2 = −2. All three points satisfy y = −x.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0393", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q40", "exam": "22.05.2024 S-I", "q": "In which form can y = −4 be written?", "o": ["0·x + 1·y + 4 = 0", "0·x + 1·y − 4 = 0", "1·x + 0·y + 4 = 0", "1·x + 0·y − 4 = 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "y = −4 means y + 4 = 0, which can be written as 0·x + 1·y + 4 = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0394", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q41", "exam": "22.05.2024 S-I", "q": "What will the graphical representation of the linear equations x + 2y = 3 and 2x + 4y + 7 = 0 be?", "o": ["Parallel lines", "Intersecting lines", "Coincident lines", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Multiplying x + 2y = 3 by 2 gives 2x + 4y = 6. Comparing with 2x + 4y + 7 = 0, the coefficients of x and y are the same but the constants differ. So the lines are parallel and never intersect.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0395", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q42", "exam": "22.05.2024 S-I", "q": "If the graphs of a pair of equations a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0 coincide, the pair has ______.", "o": ["No solution", "One and only one solution", "Infinitely many solutions", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If the graphs coincide, every point of the line is a common solution, so the pair has infinitely many solutions.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0396", "ch": 7, "page": 53, "ansPage": 53, "srcNo": "Algebra Q43", "exam": "22.05.2024 S-I", "q": "Which of the following is the product of the zeroes of the polynomial 4x² − 4x + 1?", "o": ["4", "−1", "−4", "1/4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For ax² + bx + c, the product of the zeroes is c/a. Here a = 4, b = −4, c = 1, so the product is 1/4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0397", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q44", "exam": "22.05.2024 S-I", "q": "Which of the following are the zeroes of the polynomial 9x² − 4?", "o": ["2/3, −2/3", "4, −4", "9, −9", "3/2, −3/2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Set 9x² − 4 = 0, so x² = 4/9 and x = ±2/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0398", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q45", "exam": "22.05.2024 S-I", "q": "Which of the following is a zero of the polynomial 2x² − 5x − 3?", "o": ["−4/2", "−1/4", "−1/2", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "2x² − 5x − 3 = 2x² − 6x + x − 3 = 2x(x − 3) + 1(x − 3) = (2x + 1)(x − 3). So the zeroes are −1/2 and 3. Among the options, −1/2 is a zero.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0399", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q46", "exam": "22.05.2024 S-I", "q": "The graph of the equation 2x + 3y = 5 will be ______.", "o": ["A curve", "A straight line", "A circle", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The graph of a linear equation in two variables is always a straight line. The equation can be written as y = mx + c.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0400", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q47", "exam": "22.05.2024 S-I", "q": "If the sum of two numbers is 35 and their difference is 13, the two numbers are ______.", "o": ["20, 15", "23, 12", "24, −11", "24, 11"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the numbers be x and y. x + y = 35 and x − y = 13. Adding gives 2x = 48, so x = 24, and then y = 11. The numbers are 24 and 11.", "tip": "", "status": "note", "note": "Options (c) and (d) differ only by the sign of the second number, which is hard to read in the scan; (d) is taken as '24, 11' from the printed solution.", "void": false}, {"id": "MTH-0401", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q48", "exam": "22.05.2024 S-I", "q": "A pair of equations that has a unique solution is called a ______ pair.", "o": ["Inconsistent", "Consistent", "Dependent", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A pair of linear equations that has a unique solution is called consistent: there is exactly one set of values of the two variables that satisfies both equations.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0402", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q49", "exam": "22.05.2024 S-I", "q": "If a pair of linear equations has no solution, the pair is called ______.", "o": ["Dependent", "Consistent", "Inconsistent", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A pair of linear equations with no solution is called inconsistent.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0403", "ch": 7, "page": 54, "ansPage": 54, "srcNo": "Algebra Q50", "exam": "18.09.2023 S-V", "q": "If the pair of equations 2x + 3y = 5 and 4x + ky = 10 has infinitely many solutions, the value of k is ______.", "o": ["3", "6", "0", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For infinitely many solutions, a₁/a₂ = b₁/b₂ = c₁/c₂: 2/4 = 3/k = 5/10. So 3/k = 1/2 and k = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0404", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q51", "exam": "18.09.2023 S-V", "q": "If the pair of equations kx − y = 2 and 6x − 2y = 3 has only one solution, the value of k is ______.", "o": ["= 0", "= 3", "≠ 0", "≠ 3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A unique solution needs a₁/a₂ ≠ b₁/b₂. Here k/6 ≠ −1/−2 = 1/2, so k ≠ 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0405", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q52", "exam": "18.09.2023 S-V", "q": "For the equation 3x + 4y − 9 = 0, if x = 5, what is the value of y?", "o": ["4", "3", "−9", "−3/2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Put x = 5: 15 + 4y − 9 = 0, so 4y = −6 and y = −3/2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-042", "first": false, "kind": "exact", "of": "MTH-0388"}}, {"id": "MTH-0406", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q53", "exam": "18.09.2023 S-V", "q": "A consistent pair of equations has ______ solution(s).", "o": ["No", "Infinitely many", "One and only one", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The book states that a consistent pair has a unique (one and only one) solution when a₁/a₂ ≠ b₁/b₂.", "tip": "", "status": "note", "note": "A consistent pair can also have infinitely many solutions. Printed key (c) follows the book's convention (see Q31).", "void": false, "dup": {"group": "DUP-041", "first": false, "kind": "exact", "of": "MTH-0384"}}, {"id": "MTH-0407", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q54", "exam": "05.09.2023 S-IV", "q": "A consistent pair of equations has ______ solution(s).", "o": ["No", "Infinitely many", "One and only one", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If a₁/a₂ ≠ b₁/b₂ for a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0, the pair is consistent and has only one solution.", "tip": "", "status": "note", "note": "Same question as Q31 and Q53; printed key (c) retained.", "void": false, "dup": {"group": "DUP-041", "first": false, "kind": "exact", "of": "MTH-0384"}}, {"id": "MTH-0408", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q55", "exam": "05.09.2023 S-IV", "q": "How many solutions are possible for 3x + y = 243 and 243x − y = 3?", "o": ["0", "1", "2", "Infinite"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "a₁ = 3, b₁ = 1 and a₂ = 243, b₂ = −1. a₁/a₂ = 1/81 and b₁/b₂ = −1, so a₁/a₂ ≠ b₁/b₂ and the pair has exactly one solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0409", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q56", "exam": "05.09.2023 S-IV", "q": "Which solutions of the quadratic equation 2x² − 5x − 3 = 0 are NOT possible?", "o": ["3", "2", "4", "Both b and c"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "2x² − 5x − 3 = (2x + 1)(x − 3) = 0, so x = −1/2 or x = 3. Hence 2 and 4 are not solutions, and the answer is 'both b and c'.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0410", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q57", "exam": "05.09.2023 S-IV", "q": "If 2x + 3y = 13 and 4x − y = 5, the values of x and y are ______.", "o": ["x = 2, y = 3", "x = 3, y = −2", "x = −3, y = 2", "x = −2, y = −3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "4x − y = 5 and 2x + 3y = 13. Multiply the first by 3 and add: 12x − 3y + 2x + 3y = 15 + 13, giving 14x = 28, x = 2. Then y = 4x − 5 = 3.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-040", "first": false, "kind": "exact", "of": "MTH-0368"}}, {"id": "MTH-0411", "ch": 7, "page": 55, "ansPage": 55, "srcNo": "Algebra Q58", "exam": "05.09.2023 S-IV", "q": "If α and β are the roots of 3x² + 8x + 2 = 0, then α³ + β³ = ______.", "o": ["−46/3", "368/27", "−368/27", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "α + β = −8/3 and αβ = 2/3. Then α³ + β³ = (α + β)³ − 3αβ(α + β) = −512/27 − 3 × (2/3) × (−8/3) = −512/27 + 16/3 = −512/27 + 144/27 = −368/27.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0412", "ch": 7, "page": 56, "ansPage": 56, "srcNo": "Algebra Q59", "exam": "05.09.2023 S-III", "q": "If aq ≠ bp, then the pair of equations ax + by = c and px + qy = r will have ______.", "o": ["One solution", "No solution", "Many solutions", "May or may not have a solution"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "aq ≠ bp means a/p ≠ b/q, so the two lines intersect at exactly one point and the pair has one solution.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-038", "first": false, "kind": "exact", "of": "MTH-0366"}}, {"id": "MTH-0413", "ch": 7, "page": 56, "ansPage": 56, "srcNo": "Algebra Q60", "exam": "05.09.2023 S-III", "q": "The pair of equations 6x − 2y − 3 = 0 and px − y − 2 = 0 has a unique solution if p is ______.", "o": ["≠ 3", "0", "≠ 0", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For a unique solution a₁/a₂ ≠ b₁/b₂. Here a₁ = 6, b₁ = −2, a₂ = p, b₂ = −1, so 6/p ≠ 2, which gives p ≠ 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0414", "ch": 7, "page": 56, "ansPage": 56, "srcNo": "Algebra Q61", "exam": "05.09.2023 S-III", "q": "If a pair of equations has infinitely many solutions, the pair is called ______.", "o": ["Dependent", "Inconsistent", "Consistent", "None of these"], "key": {"printed": [2, 0], "verified": [2, 0], "official": null}, "e": "A pair of linear equations that has infinitely many solutions is consistent, and because the two equations then represent the same line, it is also called dependent. For infinitely many solutions a₁/a₂ = b₁/b₂ = c₁/c₂.", "tip": "", "status": "disputed", "note": "The printed key is (c) 'consistent'. The same question at Q32 has key (a) 'dependent'. Both are true descriptions of a pair with infinitely many solutions, so (a) and (c) are both recorded as accepted. Repeated elsewhere in the PDF with a different answer.", "void": false, "dup": {"group": "DUP-044", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "MTH-0415", "ch": 7, "page": 56, "ansPage": 56, "srcNo": "Algebra Q62", "exam": "05.09.2023 S-III", "q": "What kind of lines will the graphical representation of the pair of equations x + 2y = 4 and 2x + 4y = 12 be?", "o": ["Intersecting lines", "Parallel lines", "Coincident lines", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Here a₁/a₂ = 1/2, b₁/b₂ = 2/4 = 1/2 and c₁/c₂ = −4/−12 = 1/3. Since a₁/a₂ = b₁/b₂ ≠ c₁/c₂, the lines are parallel.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0416", "ch": 7, "page": 56, "ansPage": 57, "srcNo": "Algebra Q63", "exam": "05.09.2023 S-III", "q": "In a test of 50 questions, 2 marks are given for each correct answer and −1/2 mark for each wrong answer. A candidate attempted all the questions and scored 40 marks. How many questions did the candidate answer correctly?", "o": ["24", "26", "22", "20"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let x be the number of correct answers; the wrong answers are 50 − x. Then 2x − (1/2)(50 − x) = 40, so 2x − 25 + x/2 = 40, giving 5x/2 = 65 and x = 26.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0417", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q64", "exam": "04.09.2023 S-II", "q": "Which of the following is NOT a polynomial?", "o": ["2x² − 3x + √5", "√3x² − 2√3x − 5", "x + 1/x", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x + 1/x = x + x⁻¹ contains a negative power of x. A polynomial must have only non-negative integer powers of the variable, so x + 1/x is not a polynomial.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-045", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0418", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q65", "exam": "04.09.2023 S-II", "q": "If a pair of linear equations in two variables is consistent, the lines represented by the pair will be ______.", "o": ["Intersecting lines", "Parallel lines", "Always coincident", "Intersecting or coincident lines"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A consistent pair has a solution: a unique one when the lines intersect, or infinitely many when the lines coincide.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0419", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q66", "exam": "04.09.2023 S-II", "q": "What will be the solution of the pair a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0 if a₁/a₂ ≠ b₁/b₂?", "o": ["No solution", "Unique solution", "Infinitely many solutions", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If a₁/a₂ ≠ b₁/b₂, the two lines intersect at exactly one point, so the pair has a unique solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0420", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q67", "exam": "04.09.2023 S-II", "q": "For the equation 4x + 3y = a, if x = 1 and y = 2, what is the value of a?", "o": ["7", "10", "4", "3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "4(1) + 3(2) = 4 + 6 = 10, so a = 10.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-037", "first": false, "kind": "exact", "of": "MTH-0358"}}, {"id": "MTH-0421", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q68", "exam": "04.09.2023 S-II", "q": "A pair of equations is called dependent if it has ______ solutions.", "o": ["Infinitely many", "One and only one", "No", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A pair of linear equations is dependent when the two equations represent the same line, so it has infinitely many solutions.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0422", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q69", "exam": "04.09.2023 S-II", "q": "The pair of equations a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0 has infinitely many solutions if ______.", "o": ["a₁/a₂ = b₁/b₂", "a₁/a₂ ≠ b₁/b₂", "a₁/a₂ = b₁/b₂ = c₁/c₂", "a₁/a₂ = b₁/b₂ ≠ c₁/c₂"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The lines coincide, giving infinitely many solutions, when a₁/a₂ = b₁/b₂ = c₁/c₂.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0423", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q70", "exam": "04.09.2023 S-I", "q": "Which of the following is the general form of a cubic polynomial?", "o": ["ax² + bx + c", "ax³ + bx² + cx + d", "ax² + bx² + c", "ax⁴ + bx³ + cx² + d"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A cubic polynomial has degree 3, so its general form is ax³ + bx² + cx + d with a ≠ 0. Option (a) is quadratic and option (d) has degree 4.", "tip": "", "status": "note", "note": "Option (c) is printed as 'ax² + bx² + c' in the source.", "void": false}, {"id": "MTH-0424", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q71", "exam": "04.09.2023 S-I", "q": "A pair of equations whose graphs are parallel to each other is called ______.", "o": ["Inconsistent", "Consistent", "Dependent", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If the lines are parallel they never meet, so the pair has no solution and is called inconsistent.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0425", "ch": 7, "page": 57, "ansPage": 57, "srcNo": "Algebra Q72", "exam": "04.09.2023 S-I", "q": "If a pair of equations has infinitely many solutions, the pair is called ______.", "o": ["Inconsistent", "Consistent", "Dependent", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "When two linear equations in two variables coincide, they have infinitely many common points. Such a pair is called dependent.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different answer.", "void": false, "dup": {"group": "DUP-044", "first": false, "kind": "exact", "of": "MTH-0414", "keyConflict": true}}, {"id": "MTH-0426", "ch": 7, "page": 58, "ansPage": 58, "srcNo": "Algebra Q73", "exam": "04.09.2023 S-I", "q": "If (x − 2) is a factor of the polynomial x² + ax + 2b and a + b = −2, then the values of a and b are ______.", "o": ["a = −1, b = −3", "a = 1, b = 3", "a = −3, b = 1", "a = 5, b = −3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Since (x − 2) is a factor, x = 2 is a zero: 4 + 2a + 2b = 0, so a + b = −2. Check option (c): a = −3, b = 1 gives −3 + 1 = −2, which satisfies it.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0427", "ch": 7, "page": 58, "ansPage": 58, "srcNo": "Algebra Q74", "exam": "04.09.2023 S-I", "q": "For what value of k will the pair of equations x + 2y − 3 = 0 and 5x + ky + 7 = 0 have no solution?", "o": ["3", "10", "1", "−1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "There is no solution when a₁/a₂ = b₁/b₂ ≠ c₁/c₂. Here 1/5 = 2/k gives k = 10, and c₁/c₂ = −3/7 differs, so the pair has no solution for k = 10.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0428", "ch": 7, "page": 58, "ansPage": 58, "srcNo": "Algebra Q75", "exam": "04.09.2023 S-I", "q": "The graphs of a pair of equations will intersect if the pair has ______.", "o": ["No solution", "Two solutions", "One solution", "Many solutions"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If the graphs of two linear equations intersect at a point, that point is the unique solution of the pair, so the pair has one solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0429", "ch": 7, "page": 58, "ansPage": 58, "srcNo": "Algebra Q76", "exam": "04.09.2023 S-I", "q": "If the solution of 2x + by = 8 and ax − 3y = −4 is x = 1 and y = 2, the values of a and b are ______.", "o": ["a = 2, b = 3", "a = −2, b = 3", "a = 2, b = −3", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "From 2x + by = 8: 2 + 2b = 8, so b = 3. From ax − 3y = −4: a − 6 = −4, so a = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0430", "ch": 7, "page": 58, "ansPage": 58, "srcNo": "Algebra Q77", "exam": "04.09.2023 S-I", "q": "A pair of equations that has a unique solution is called ______.", "o": ["Inconsistent", "Consistent", "Dependent", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If a₁/a₂ ≠ b₁/b₂ the pair has a unique solution, and such a pair is called consistent.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0431", "ch": 7, "page": 58, "ansPage": 58, "srcNo": "Algebra Q78", "exam": "04.09.2023 S-I", "q": "If the graphs of a₁x + b₁y = c₁ and a₂x + b₂y = c₂ intersect each other at a definite point, the solutions of the pair are ______.", "o": ["Infinite", "One and only one", "No solution", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If the lines intersect at a definite point, that point is the only common solution, so the pair has one and only one solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0432", "ch": 7, "page": 58, "ansPage": 59, "srcNo": "Algebra Q79", "exam": "04.09.2023 S-I", "q": "If the graphs of the pair of equations a₁x + b₁y = c₁ and a₂x + b₂y = c₂ coincide, the solutions of the pair will be ______.", "o": ["No solution", "One and only one", "Infinitely many", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If the graphs coincide, every point on the line is a common solution, so the pair has infinitely many solutions.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0433", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q80", "exam": "18.09.2023 S-V", "q": "A pair of linear equations that has no solution is called a ______ pair.", "o": ["Inconsistent", "Consistent", "Dependent", "Intersecting"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "When a₁/a₂ = b₁/b₂ ≠ c₁/c₂, the lines are parallel and the pair has no solution. Such a pair is called inconsistent.", "tip": "", "status": "note", "note": "Option (d) is printed as a one-word Hindi term meaning 'intersecting at one (point)'.", "void": false, "dup": {"group": "DUP-043", "first": false, "kind": "exact", "of": "MTH-0389"}}, {"id": "MTH-0434", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q81", "exam": "18.09.2023 S-V", "q": "In the equation 2x − 3y = 14, if x = 1, what is the value of y?", "o": ["−3", "4", "−4", "5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Put x = 1: 2 − 3y = 14, so −3y = 12 and y = −4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-039", "first": false, "kind": "exact", "of": "MTH-0367"}}, {"id": "MTH-0435", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q82", "exam": "05.09.2023 S-IV", "q": "What type of graph will the polynomial ax² + x + c have?", "o": ["Circular", "Triangular", "Parabolic", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The graph of a quadratic polynomial is a parabola. So ax² + x + c (a ≠ 0) has a parabolic graph.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0436", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q83", "exam": "14.09.2020 S-I", "q": "A two-digit number, when written in reverse and subtracted from the original number, gives 36. If the sum of the digits is 10, the original number is ______.", "o": ["37", "73", "36", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the tens digit be x and the units digit y. Then x + y = 10 and (10x + y) − (10y + x) = 36, so 9x − 9y = 36 and x − y = 4. Solving, x = 7 and y = 3, so the number is 73.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0437", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q84", "exam": "14.09.2020 S-I", "q": "For what value of m will the equations 6x − 9y = m and 2x − 3y = 4 have infinitely many solutions?", "o": ["10", "−12", "12", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For infinitely many solutions 6/2 = −9/−3 = m/4, so 3 = m/4 and m = 12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0438", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q85", "exam": "14.09.2020 S-I", "q": "In a parking space, a total of 20 motorcycles and cars were parked. If the total number of tyres was found to be 70, the number of cars in the parking place was ______.", "o": ["5", "10", "15", "20"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the number of cars be x, so the number of motorcycles is 20 − x. Tyres: 4x + 2(20 − x) = 70, so 2x + 40 = 70 and x = 15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0439", "ch": 7, "page": 59, "ansPage": 59, "srcNo": "Algebra Q86", "exam": "14.09.2020 S-I", "q": "If x + y = p and xy = q, then the value of 1/x³ + 1/y³ will be ______.", "o": ["(p³ − 3)/q²", "(p³ − 3p)/q³", "(p³ − 3pq)/q³", "(q³ − 3pq)/p²"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x³ + y³ = (x + y)³ − 3xy(x + y) = p³ − 3pq. And 1/x³ + 1/y³ = (x³ + y³)/(xy)³ = (p³ − 3pq)/q³.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0440", "ch": 7, "page": 60, "ansPage": 60, "srcNo": "Algebra Q87", "exam": "14.09.2020 S-I", "q": "If 2^(a+b) = 8 and 8^(a−b) = 2, which of the following is correct?", "o": ["a = 5/4, b = 4/3", "b = 5/4, a = 4/3", "a = 5/3, b = 4/5", "a = 5/3, b = 4/3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "2^(a+b) = 2³ gives a + b = 3. 8^(a−b) = 2 gives 2^(3(a−b)) = 2¹, so a − b = 1/3. Adding: 2a = 10/3, so a = 5/3, and then b = 3 − 5/3 = 4/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0441", "ch": 7, "page": 60, "ansPage": 60, "srcNo": "Algebra Q88", "exam": "11.09.2020 S-I", "q": "If (a² + b²)³ = (a³ + b³)² and ab ≠ 0, then the numerical value of a/b + b/a is ______.", "o": ["Greater than 2/2", "Smaller than −2/−2", "Equal to 3/2", "Equal to 2/3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Expanding, a⁶ + b⁶ + 3a²b²(a² + b²) = a⁶ + b⁶ + 2a³b³, so 3a²b²(a² + b²) = 2a³b³. Hence (a² + b²)/(ab) = 2/3, that is a/b + b/a = 2/3.", "tip": "", "status": "note", "note": "Options (a) and (b) are printed as '2/2' and '−2/−2' (that is, 1 and 1) in the source scan, apparently because the Hindi and English labels were merged.", "void": false}, {"id": "MTH-0442", "ch": 7, "page": 60, "ansPage": 60, "srcNo": "Algebra Q89", "exam": "11.09.2020 S-I", "q": "If a + b + c = 0 and a² + b² + c² = 1, then the value of a⁴ + b⁴ + c⁴ is ______.", "o": ["1/4", "3/8", "1/2", "3/4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "From a + b + c = 0, squaring gives a² + b² + c² + 2(ab + bc + ca) = 0, so ab + bc + ca = −1/2. Squaring again: a²b² + b²c² + c²a² + 2abc(a + b + c) = 1/4, so a²b² + b²c² + c²a² = 1/4. Also (a² + b² + c²)² = 1 gives a⁴ + b⁴ + c⁴ + 2 × 1/4 = 1, so a⁴ + b⁴ + c⁴ = 1/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0443", "ch": 7, "page": 60, "ansPage": 60, "srcNo": "Algebra Q90", "exam": "11.09.2020 S-I", "q": "The family of lines given by the equation a(3x + 4y + 6) + b(x + y + 2) = 0 passes through the fixed point ______.", "o": ["(−2, 0)", "(0, 2)", "(−1, −1)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The family passes through the intersection of 3x + 4y + 6 = 0 and x + y + 2 = 0. Multiply the second by 3: 3x + 3y + 6 = 0. Subtract from the first: y = 0. Then x + 2 = 0, so x = −2. The fixed point is (−2, 0).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0444", "ch": 7, "page": 60, "ansPage": 60, "srcNo": "Algebra Q91", "exam": "11.09.2020 S-I", "q": "If the system of equations 2x₁ − x₂ = h and −6x₁ + 3x₂ = k is consistent, then h and k satisfy ______.", "o": ["k = −3h", "k = 3h", "k ≠ −3h", "k ≠ 3h"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For the system to be consistent (infinitely many solutions), 2/−6 = −1/3 = h/k. So h/k = −1/3, which gives k = −3h.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0445", "ch": 7, "page": 60, "ansPage": 61, "srcNo": "Algebra Q92", "exam": "11.09.2020 S-I", "q": "The system of linear equations 3ax + 4by + 5c = 0 and 12ax + 16by + 20c = 0 has ______.", "o": ["A unique solution", "No solution", "Two solutions", "Infinitely many solutions"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "3a/12a = 4b/16b = 5c/20c = 1/4. All three ratios are equal, so the two equations represent the same line and the system has infinitely many solutions.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0446", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q93", "exam": "", "q": "The equation that has −3 as a solution is ______.", "o": ["x + 3 = 1", "8 + 2x = 3", "10 + 3x = 1", "2x + 1 = 3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Test x = −3 in each: (a) −3 + 3 = 0 ≠ 1. (b) 8 − 6 = 2 ≠ 3. (c) 10 − 9 = 1 ✓. (d) −6 + 1 = −5 ≠ 3. So the answer is (c).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0447", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q94", "exam": "", "q": "The value of y for which the expressions (y − 15) and (2y + 1) become equal is ______.", "o": ["0", "16", "8", "−16"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "y − 15 = 2y + 1, so y = −16.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0448", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q95", "exam": "", "q": "The equation that cannot be solved in integers is ______.", "o": ["5y − 3 = −18", "3x − 9 = 0", "3x + 8 = 3 + x", "9y + 8 = 4y − 7"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "(a) 5y = −15, y = −3 (integer). (b) 3x = 9, x = 3 (integer). (c) 2x = −5, x = −5/2 (not an integer). (d) 5y = −15, y = −3 (integer).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0449", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q96", "exam": "", "q": "Which of the following numbers satisfies the equation −6 + x = −12?", "o": ["2", "6", "−6", "−2"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "−6 + x = −12 gives x = −12 + 6 = −6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0450", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q97", "exam": "", "q": "The pair of linear equations 7x − 3y = 4 and 14x + 4y = 5 has ______.", "o": ["One solution", "Two solutions", "Many solutions", "No solution"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "a₁/a₂ = 7/14 = 1/2 and b₁/b₂ = −3/4. Since a₁/a₂ ≠ b₁/b₂, the pair has a unique solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0451", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q98", "exam": "", "q": "The sum of a two-digit number and the number obtained by reversing the order of its digits is 99. If the digits differ by 3, the number is ______.", "o": ["99", "30", "36", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the tens digit be x and the units digit be y, with x < y. Then (10x + y) + (10y + x) = 99 gives x + y = 9, and y − x = 3. So y = 6 and x = 3, and the number is 36.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0452", "ch": 7, "page": 61, "ansPage": 61, "srcNo": "Algebra Q99", "exam": "", "q": "Find the value of the expression a² + b² + 3ab at a = 1 and b = −2.", "o": ["1", "−1", "0", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "(1)² + (−2)² + 3(1)(−2) = 1 + 4 − 6 = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0453", "ch": 7, "page": 62, "ansPage": 62, "srcNo": "Algebra Q100", "exam": "", "q": "For any two non-zero integers x and y, x³ ÷ y³ is equal to ______.", "o": ["(x/y)^0", "(x/y)³", "(x/y)^6", "(x/y)^9"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "x³ ÷ y³ = x³/y³ = (x/y)³.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0454", "ch": 7, "page": 62, "ansPage": 62, "srcNo": "Algebra Q101", "exam": "Haryana TGT 2020", "q": "A certain number of men can do a work in 60 days. If there were 8 men fewer, it could be finished in 10 days more. The number of men is ______.", "o": ["14 men", "28 men", "56 men", "112 men"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the number of men be x. The work is the same: 60x = 70(x − 8), so 60x = 70x − 560, giving 10x = 560 and x = 56.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0455", "ch": 7, "page": 62, "ansPage": 62, "srcNo": "Algebra Q102", "exam": "Haryana TGT 2019", "q": "The sum of the ages of a father and his son is 45 years. Five years ago, the product of their ages (in years) was 124. The present age of the father is ______.", "o": ["9 years", "45 years", "36 years", "54 years"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the father's age be x, so the son's is 45 − x. Five years ago: (x − 5)(40 − x) = 124, so 40x − x² − 200 + 5x = 124, giving x² − 45x + 324 = 0, i.e. (x − 36)(x − 9) = 0. Hence x = 36 or 9, and the father is 36.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0456", "ch": 7, "page": 62, "ansPage": 62, "srcNo": "Algebra Q103", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The sum of two numbers is 50. The fraction obtained by dividing the larger number by the smaller is 3/2. The numbers are ______.", "o": ["25, 25", "10, 40", "15, 35", "20, 30"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the numbers be x (smaller) and y (larger). x + y = 50 and y/x = 3/2, so y = 3x/2. Then x + 3x/2 = 50, so 5x/2 = 50 and x = 20. The other number is 30.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0457", "ch": 7, "page": 62, "ansPage": 62, "srcNo": "Algebra Q104", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "A two-digit number is such that the product of its digits is 12. When 36 is added to the number, the digits interchange their places. The number is ______.", "o": ["62", "35", "26", "48"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the digits be x (tens) and y (units): xy = 12 and (10y + x)... Adding 36 to 10x + y... Taking the number as 10y + x with units digit x: (10y + x) + 36 = 10x + y gives x − y = 4. With xy = 12, y(y + 4) = 12, so y² + 4y − 12 = 0, (y + 6)(y − 2) = 0, so y = 2 and x = 6. The number is 10 × 2 + 6 = 26.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0458", "ch": 7, "page": 62, "ansPage": 63, "srcNo": "Algebra Q105", "exam": "TGT 2001", "q": "36 boys and girls together do a work for which they are paid ₹166. If each girl is paid ₹5 and each boy ₹4, the separate numbers of boys and girls are ______.", "o": ["20, 16", "22, 14", "24, 16", "18, 18"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the number of boys be x and of girls y. x + y = 36 and 4x + 5y = 166. Multiplying the first by 4 and subtracting: y = 166 − 144 = 22, and x = 14. So there are 14 boys and 22 girls, which matches option (b) read as 22 and 14.", "tip": "", "status": "note", "note": "The option (b) lists '22, 14' while the solution gives boys = 14 and girls = 22; the numbers match as a pair.", "void": false}, {"id": "MTH-0459", "ch": 7, "page": 63, "ansPage": 63, "srcNo": "Algebra Q106", "exam": "TGT 2013", "q": "The solution of (6x + 7)/(3x + 2) = (4x + 5)/(2x + 3) is ______.", "o": ["x = 1", "x = −9/11", "x = −11/9", "x = 3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Cross-multiply: (6x + 7)(2x + 3) = (3x + 2)(4x + 5). So 12x² + 18x + 14x + 21 = 12x² + 15x + 8x + 10, giving 32x + 21 = 23x + 10, so 9x = −11 and x = −11/9.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0460", "ch": 7, "page": 63, "ansPage": 63, "srcNo": "Algebra Q107", "exam": "TGT 2004", "q": "The system of equations 3x − 4y = 12 and 6x − 8y = 48 has ______.", "o": ["1 solution", "2 solutions", "Infinite number of solutions", "No solution"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Here a₁/a₂ = 3/6 = 1/2 and b₁/b₂ = −4/−8 = 1/2, but c₁/c₂ = 12/48 = 1/4. Since a₁/a₂ = b₁/b₂ ≠ c₁/c₂, the lines are parallel and there is no solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0461", "ch": 7, "page": 63, "ansPage": 63, "srcNo": "Algebra Q108", "exam": "TGT 2004", "q": "Hema gets 3 marks for each right answer and loses 2 marks for each wrong answer. She attempts 30 questions and obtains 40 marks. The number of questions done correctly is ______.", "o": ["20", "25", "26", "27"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let x be the number of correct answers. Then 3x − 2(30 − x) = 40, so 5x − 60 = 40, giving x = 20.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0462", "ch": 7, "page": 63, "ansPage": 63, "srcNo": "Algebra Q109", "exam": "", "q": "If 5x + 3y = 15 and 2xy = 6, then the value of 5x − 3y is ______.", "o": ["3√5", "3√4", "3√3", "3√2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "(5x − 3y)² = (5x + 3y)² − 4(5x)(3y) = 225 − 60xy. With xy = 3, this is 225 − 180 = 45. So 5x − 3y = √45 = 3√5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0463", "ch": 7, "page": 63, "ansPage": 63, "srcNo": "Algebra Q110", "exam": "", "q": "If 4x² + y² = 40 and xy = 6, find the value of 2x + y.", "o": ["4", "8", "6", "5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "(2x + y)² = 4x² + y² + 4xy = 40 + 24 = 64, so 2x + y = 8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0464", "ch": 7, "page": 63, "ansPage": 63, "srcNo": "Algebra Q111", "exam": "", "q": "For which value of m will the equations 18x − 72y + 13 = 0 and 7x − my − 17 = 0 have no solution?", "o": ["24", "12", "9", "28"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For no solution a₁/a₂ = b₁/b₂ ≠ c₁/c₂. 18/7 = −72/−m gives m = 72 × 7/18 = 28. The ratio c₁/c₂ = 13/−17 differs, so there is no solution for m = 28.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0465", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q112", "exam": "", "q": "If 5(1 − x/5) − (5 − x) − (1/200) of (20 − x) = 0.08, what is the value of x?", "o": ["36", "24", "9", "18"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "5(1 − x/5) = 5 − x, and subtracting (5 − x) leaves 0. So −(1/200)(20 − x) = 0.08, which gives 20 − x = −16 and x = 36.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0466", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q113", "exam": "", "q": "Simplify (3x + 2y)² − (3x − 2y)².", "o": ["9x² − 4y²", "12xy", "18x² − 8y²", "24xy"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Using a² − b² = (a + b)(a − b): (3x + 2y + 3x − 2y)(3x + 2y − 3x + 2y) = (6x)(4y) = 24xy.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0467", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q114", "exam": "", "q": "If (a + b + c) = 13 and (ab + bc + ca) = 54, find the value of (a² + b² + c²).", "o": ["61", "63", "65", "59"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "(a + b + c)² = a² + b² + c² + 2(ab + bc + ca), so 169 = a² + b² + c² + 108 and a² + b² + c² = 61.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0468", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q115", "exam": "", "q": "If x + y + 3 = 0, find the value of x³ + y³ − 9xy + 9.", "o": ["18", "−36", "36", "−18"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "x + y = −3. Cubing, x³ + y³ + 3xy(x + y) = −27, so x³ + y³ − 9xy = −27. Adding 9 gives −18.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0469", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q116", "exam": "", "q": "If x + 1/x = 1, then what is the value of (x² + 7x + 1)/(x² + 11x + 1)?", "o": ["1/3", "2/3", "3/4", "1/4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Divide the numerator and denominator by x: (x + 7 + 1/x)/(x + 11 + 1/x) = (1 + 7)/(1 + 11) = 8/12 = 2/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0470", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q117", "exam": "", "q": "If (a³ + b³ + c³ − 3abc) = 405 and (a − b)² + (b − c)² + (c − a)² = 54, find the value of (a + b + c).", "o": ["27", "9", "15", "45"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca) = (a + b + c) × (1/2)[(a − b)² + (b − c)² + (c − a)²] = (a + b + c) × 27. So (a + b + c) = 405/27 = 15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0471", "ch": 7, "page": 64, "ansPage": 64, "srcNo": "Algebra Q118", "exam": "", "q": "If (2x + 3y) : (4x − 7y) = 3 : 5, what is the value of x : y?", "o": ["18 : 1", "4 : 11", "11 : 4", "1 : 18"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "(2x + 3y)/(4x − 7y) = 3/5 gives 10x + 15y = 12x − 21y, so 2x = 36y and x/y = 18, i.e. x : y = 18 : 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0472", "ch": 7, "page": 65, "ansPage": 65, "srcNo": "Algebra Q119", "exam": "", "q": "What is the solution of the following system of linear equations?\n3x − 9y + 4z = 5\n2x − 7y + z = 12\n3x − z = 0", "o": ["x = 143/150, y = 31/30, z = 143/51", "x = 143/150, y = 31/37, z = 143/50", "x = 143/150, y = 31/30, z = 143/50", "x = 137/150, y = 31/30, z = 143/50"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "From 3x − z = 0, z = 3x, so x : z = 1 : 3. Only options (b) and (c) have this ratio. Substituting x = 143/150 and z = 143/50 into the second equation: 2 × 143/150 + 7y... gives 7y = 217/30, so y = 31/30. Hence option (c).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0473", "ch": 8, "page": 65, "ansPage": 65, "srcNo": "Algebra Q120", "exam": "09.06.2024 S-I", "q": "If −3 is a zero of the polynomial (k − 1)x² + kx + 1, what is the value of k?", "o": ["2/3", "4/3", "−2/3", "−4/3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Put x = −3: (k − 1)(9) + k(−3) + 1 = 0, so 9k − 9 − 3k + 1 = 0, giving 6k = 8 and k = 4/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0474", "ch": 8, "page": 65, "ansPage": 65, "srcNo": "Algebra Q121", "exam": "09.06.2024 S-I", "q": "If two zeros of the polynomial x³ + x² − 7x − 7 are √7 and −√7, the third zero is ______.", "o": ["1", "−3", "3", "−1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For a cubic x³ + x² − 7x − 7, the sum of the zeros is −(coefficient of x²)/(coefficient of x³) = −1. So √7 + (−√7) + k = −1, giving k = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0475", "ch": 8, "page": 65, "ansPage": 65, "srcNo": "Algebra Q122", "exam": "09.06.2024 S-I", "q": "If the sum of the zeros of the polynomial f(x) = 2x³ − 3kx² + 4x − 5 is 6, what is the value of k?", "o": ["4", "−4", "2", "−2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Sum of zeros = −(−3k)/2 = 3k/2. Setting 3k/2 = 6 gives k = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0476", "ch": 8, "page": 65, "ansPage": 65, "srcNo": "Algebra Q123", "exam": "09.06.2024 S-I", "q": "What is the product of the zeros of the polynomial p(x) = x³ + 4x² + x − 6?", "o": ["6", "−6", "4", "−4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For a cubic ax³ + bx² + cx + d, the product of the zeros is −d/a = −(−6)/1 = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0477", "ch": 8, "page": 65, "ansPage": 66, "srcNo": "Algebra Q124", "exam": "09.06.2024 S-I", "q": "The quadratic equation x² + bx + d = 0 has one root 2, and the roots of x² + bx + 12 = 0 are equal. Then d = ______.", "o": ["8", "−8", "16", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Since x = 2 is a root of x² + bx + d = 0: 4 + 2b + d = 0 ...(iii). The roots of x² + bx + 12 = 0 are equal, so b² − 4 × 12 = 0, giving b² = 48 and b = ±4√3. Then d = −4 − 2b = −4 ∓ 8√3, which is none of the given options.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0478", "ch": 8, "page": 66, "ansPage": 66, "srcNo": "Algebra Q125", "exam": "09.06.2024 S-I", "q": "If one root of the quadratic equation ax² + bx + c = 0 is three times the other, then ______.", "o": ["b² = 3ac", "3b² = 16ac", "16b² = 3ac", "b² = 16ac"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the roots be α and 3α. Sum: 4α = −b/a, so α = −b/(4a). Product: 3α² = c/a, so 3b²/(16a²) = c/a, which gives 3b² = 16ac.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0479", "ch": 8, "page": 66, "ansPage": 66, "srcNo": "Algebra Q126", "exam": "09.06.2024 S-I", "q": "If one root of the quadratic equation x² + bx + 12 = 0 is 2 and the roots of x² + bx + d = 0 are equal, then the value of d is ______.", "o": ["8", "−8", "16", "−16"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Put x = 2 in x² + bx + 12 = 0: 4 + 2b + 12 = 0, so b = −8. For equal roots of x² − 8x + d = 0: b² − 4ac = 0, so 64 − 4d = 0 and d = 16.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0480", "ch": 8, "page": 66, "ansPage": 66, "srcNo": "Algebra Q127", "exam": "23.05.2024 S-II", "q": "If y is the root of the quadratic equation x² − 4x + 4 = 0, find the value of 8y.", "o": ["16", "24", "64", "8"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x² − 4x + 4 = (x − 2)² = 0, so the root is 2. Then 8y = 8 × 2 = 16.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0481", "ch": 8, "page": 66, "ansPage": 66, "srcNo": "Algebra Q128", "exam": "23.05.2024 S-II", "q": "If α and β are the roots of 3x² + 8x + 2 = 0, then α³ + β³ = ______.", "o": ["−46/3", "386/27", "−368/27", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "α + β = −8/3 and αβ = 2/3. α³ + β³ = (α + β)³ − 3αβ(α + β) = −512/27 + 16/3 = −512/27 + 144/27 = −368/27.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0482", "ch": 8, "page": 66, "ansPage": 66, "srcNo": "Algebra Q129", "exam": "23.05.2024 S-II", "q": "Which quadratic polynomial has zeros whose sum is 3 and product is −10?", "o": ["x² − 3x − 10", "−x² − 3x + 10", "Both", "None of these"], "key": {"printed": [0]
