<script>/* Pure logic for the CBT mock test: no DOM access, so it can be unit-tested in Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AOTLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const LETTERS = 'ABCDEFGH';
  const WEAK_ACCURACY = 60; // percent: below this a chapter is flagged for revision

  function validateBank(bank) {
    const errors = [];
    if (!bank || !Array.isArray(bank.questions) || !Array.isArray(bank.chapters)) {
      return ['Question bank is missing or malformed.'];
    }
    const ids = new Set();
    const chapterIds = new Set(bank.chapters.map((c) => c.id));
    const counts = {};
    for (const q of bank.questions) {
      if (!q.id || ids.has(q.id)) errors.push('Duplicate or missing id: ' + q.id);
      ids.add(q.id);
      if (!chapterIds.has(q.ch)) errors.push(q.id + ': unknown chapter ' + q.ch);
      counts[q.ch] = (counts[q.ch] || 0) + 1;
      if (!q.q || !String(q.q).trim()) errors.push(q.id + ': empty question');
      if (!Array.isArray(q.o) || q.o.length < 2 || q.o.some((o) => !String(o).trim())) errors.push(q.id + ': invalid options');
      if (!q.e || !String(q.e).trim()) errors.push(q.id + ': missing explanation');
      const key = q.key || {};
      if (q.void) continue;
      for (const mode of ['printed', 'verified']) {
        const arr = key[mode];
        if (!Array.isArray(arr)) errors.push(q.id + ': key.' + mode + ' missing');
        else if (arr.some((i) => !Number.isInteger(i) || i < 0 || i >= (q.o || []).length)) errors.push(q.id + ': key.' + mode + ' out of range');
      }
      if (!key.verified || !key.verified.length) errors.push(q.id + ': no usable answer key');
    }
    for (const c of bank.chapters) {
      if ((counts[c.id] || 0) !== c.count) errors.push('Chapter ' + c.id + ' count mismatch: header ' + c.count + ' vs actual ' + (counts[c.id] || 0));
    }
    if (bank.meta && bank.meta.total !== bank.questions.length) errors.push('meta.total does not match question count');
    return errors;
  }

  /** Accepted option indices for scoring under a key mode ('printed' | 'verified'). */
  function keysFor(q, mode) {
    const k = q.key[mode === 'verified' ? 'verified' : 'printed'];
    return k && k.length ? k : q.key.verified;
  }

  function shuffle(arr, rng) {
    const a = arr.slice();
    const rand = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** Questions of the chosen chapters in bank order; optionally keep only the first copy of each repeated question. */
  function buildPool(bank, chapterIds, skipRepeats) {
    const want = new Set(chapterIds);
    const seen = new Set();
    const out = [];
    for (const q of bank.questions) {
      if (!want.has(q.ch) || q.void) continue; // void = no valid option in the source
      if (skipRepeats && q.dup) {
        if (seen.has(q.dup.group)) continue;
        seen.add(q.dup.group);
      }
      out.push(q);
    }
    return out;
  }

  /** Choose ids for a test. The master bank is never modified. */
  function pickQuestions(pool, opts) {
    const n = Math.max(1, Math.min(pool.length, opts.count || pool.length));
    const src = opts.random ? shuffle(pool, opts.rng) : pool;
    return src.slice(0, n).map((q) => q.id);
  }

  /** nv: not visited, na: visited but not answered, a: answered, m: marked, am: answered and marked. */
  function statusOf(sess, id) {
    const answered = sess.resp[id] !== undefined;
    const marked = !!sess.mark[id];
    if (answered && marked) return 'am';
    if (marked) return 'm';
    if (answered) return 'a';
    return sess.vis[id] ? 'na' : 'nv';
  }

  function countStatuses(sess) {
    const c = { nv: 0, na: 0, a: 0, m: 0, am: 0 };
    for (const id of sess.qids) c[statusOf(sess, id)]++;
    return c;
  }

  function evaluate(sess, byId, keyMode) {
    const rows = sess.qids.map((id, i) => {
      const q = byId.get(id);
      const r = sess.resp[id];
      const attempted = r !== undefined;
      const keys = keysFor(q, keyMode);
      return { n: i + 1, q, chosen: r, attempted, correct: attempted && keys.includes(r), keys, marked: !!sess.mark[id] };
    });
    const total = rows.length;
    const attempted = rows.filter((r) => r.attempted).length;
    const correct = rows.filter((r) => r.correct).length;
    const incorrect = attempted - correct;
    const mc = sess.marks.c, mn = sess.marks.n;
    const score = Math.round((correct * mc - incorrect * mn) * 100) / 100;
    const perChapter = {};
    for (const r of rows) {
      const c = (perChapter[r.q.ch] = perChapter[r.q.ch] || { ch: r.q.ch, total: 0, attempted: 0, correct: 0, incorrect: 0, unattempted: 0, marks: 0 });
      c.total++;
      if (!r.attempted) c.unattempted++;
      else if (r.correct) { c.attempted++; c.correct++; c.marks += mc; }
      else { c.attempted++; c.incorrect++; c.marks -= mn; }
    }
    for (const c of Object.values(perChapter)) {
      c.marks = Math.round(c.marks * 100) / 100;
      c.accuracy = c.attempted ? Math.round((c.correct / c.attempted) * 1000) / 10 : null;
    }
    return {
      rows, total, attempted, unattempted: total - attempted, correct, incorrect,
      accuracy: attempted ? Math.round((correct / attempted) * 1000) / 10 : 0,
      score, maxScore: Math.round(total * mc * 100) / 100, perChapter,
    };
  }

  /** Chapters to revise: attempted with accuracy below the threshold, weakest first. Unattempted chapters are listed separately. */
  function weakChapters(perChapter) {
    const list = Object.values(perChapter);
    return {
      weak: list.filter((c) => c.attempted > 0 && c.accuracy < WEAK_ACCURACY).sort((a, b) => a.accuracy - b.accuracy),
      untouched: list.filter((c) => c.attempted === 0),
    };
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const p = (x) => String(x).padStart(2, '0');
    return (h ? p(h) + ':' : '') + p(m) + ':' + p(s);
  }

  function readableBank(bank) {
    const out = [bank.meta.title, 'Source: ' + bank.meta.source, 'Total questions: ' + bank.questions.length, ''];
    for (const c of bank.chapters) {
      out.push('=== Chapter ' + c.id + ': ' + c.name + ' (' + c.count + ' questions) ===', '');
      for (const q of bank.questions.filter((x) => x.ch === c.id)) {
        out.push(q.id + '  [PDF p.' + q.page + ', source Q' + q.srcNo + ']', q.q);
        q.o.forEach((o, i) => out.push('  (' + LETTERS[i] + ') ' + o));
        const fmt = (a) => a.map((i) => '(' + LETTERS[i] + ')').join(', ');
        out.push('Printed answer: ' + (q.key.printed.length ? fmt(q.key.printed) : 'none printed'));
        if (JSON.stringify(q.key.printed) !== JSON.stringify(q.key.verified)) out.push('Verified answer: ' + fmt(q.key.verified));
        out.push('Explanation: ' + q.e);
        if (q.tip) out.push('Tip: ' + q.tip);
        if (q.note) out.push('Review note: ' + q.note);
        out.push('');
      }
    }
    return out.join('\n');
  }

  return { LETTERS, WEAK_ACCURACY, validateBank, keysFor, shuffle, buildPool, pickQuestions, statusOf, countStatuses, evaluate, weakChapters, fmtTime, readableBank };
});
</script>
<script>/* Mathematics – CBT mock test UI. All data comes from window.AOT_BANK; scoring/selection logic lives in logic.js. */
(function () {
  'use strict';

  const LS_KEY = 'mathcbt.v1';
  const HISTORY_MAX = 20;
  const STATUS_LABEL = { nv: 'Not Visited', na: 'Not Answered', a: 'Answered', m: 'Marked for Review', am: 'Answered & Marked for Review' };
  const $ = (s, r) => (r || document).querySelector(s);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, v);
      }
    }

      if (c == null || c === false) continue;
      if (c.nodeType) e.append(c);
      else if (typeof c === 'string' && c.indexOf('^') !== -1) e.append(...rich(c));

  const EXP = /\^(\([^()]*\)|[+\-−]?[A-Za-z0-9]+(?:\.[0-9]+)?)/g;

      out.push(sup);
      last = EXP.lastIndex;

  }
  const say = (m) => { $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = m; }, 30); };
  const pct = (x) => (x == null ? '–' : x.toFixed(1).replace(/\.0$/, '') + '%');

  /* ---------- bank validation ---------- */
  const bankErrors = L.validateBank(BANK);
  const byId = new Map((BANK && BANK.questions ? BANK.questions : []).map((q) => [q.id, q]));
  const chapterById = new Map((BANK && BANK.chapters ? BANK.chapters : []).map((c) => [c.id, c]));

  /* ---------- storage ---------- */
  let storageOK = true;
  const DEFAULT_SETTINGS = { mode: 'practice', keyMode: 'printed', marksC: 1, marksN: 0, random: false, skipRepeats: false, custom: false, customN: 50, minutes: null, chapters: [] };
  function freshStore() { return { v: 1, settings: Object.assign({}, DEFAULT_SETTINGS, { chapters: BANK.chapters.map((c) => c.id) }), history: [], attempted: {}, session: null }; }
  function validSession(s) {

    base.settings = s;
    base.history = (Array.isArray(o.history) ? o.history : []).filter(validSession).slice(0, HISTORY_MAX);
    const att = {};
    for (const [id, v] of Object.entries(o.attempted || {})) if (byId.has(id) && v && typeof v === 'object') att[id] = { n: +v.n || 1, c: v.c ? 1 : 0 };
    base.attempted = att;

  }

  function setBack(view) {
    const b = $('#back'); if (!b) return;
    if (view === 'dashboard') { b.textContent = '‹ Subjects'; b.setAttribute('href', '../'); b.onclick = null; return; }
    b.textContent = view === 'test' ? '‹ Exit test' : '‹ Dashboard';
    b.setAttribute('href', '#');
    b.onclick = async (e) => {
      e.preventDefault();
      if (view === 'test' && !(await confirmDialog({ title: 'Leave this test?', body: ['Your answers are saved and you can resume from the dashboard.', store.session && store.session.endAt ? 'The timer keeps running while you are away.' : ''].filter(Boolean), ok: 'Leave test', cancel: 'Stay' }))) return;
      renderDashboard();
    };
  }
  function show(view) {
    for (const v of ['dashboard', 'test', 'result']) $('#view-' + v).hidden = v !== view;
    if (view !== 'test') stopTimer();
    $('#topbar-right').replaceChildren();
    setBack(view);
    try {
      if (!popping) {
        if (view === 'dashboard') { if (location.hash) history.replaceState(null, '', location.pathname + location.search); }
        else if (location.hash !== '#' + view) history.pushState(null, '', '#' + view);
      }
    } catch (e) { /* history is optional */ }
    window.scrollTo(0, 0);
    $('#main').focus({ preventScroll: true });
  }
  window.addEventListener('popstate', () => {
    const onApp = !$('#view-test').hidden || !$('#view-result').hidden;
    if (onApp && location.hash !== '#test' && location.hash !== '#result') { popping = true; try { renderDashboard(); } finally { popping = false; } }
  });

  /* ================= DASHBOARD ================= */
  function chapterProgress() {
    const out = {};
    for (const c of BANK.chapters) out[c.id] = { att: 0, ok: 0 };
    for (const [id, v] of Object.entries(store.attempted)) { const q = byId.get(id); out[q.ch].att++; out[q.ch].ok += v.c; }
    return out;
  }
  function currentPool() {
    const S = store.settings;
    return L.buildPool(BANK, S.chapters, S.skipRepeats);
  }

  function renderDashboard() {
    show('dashboard');
    document.title = 'Mathematics – Practice Mock Test';
    const root = $('#view-dashboard');
    const S = store.settings;
    const prog = chapterProgress();
    const attemptedN = Object.keys(store.attempted).length;
    root.replaceChildren();

    root.append(h('h1', null, 'Mathematics – Practice Mock Test'),
      h('p', { class: 'hint' }, 'Questions are the Mathematics MCQs from the Bihar STET chapterwise solved-papers PDF, with explanations in English. Works fully offline.'));

    root.append(presetsCard());
    if (BANK.meta.coverage) root.append(h('div', { class: 'notice warn' }, h('strong', null, 'Partial question bank. '), BANK.meta.coverage));
    if (store.session) {
      const s = store.session;
      const answered = Object.keys(s.resp).length;
      root.append(h('div', { class: 'notice' },
        h('strong', null, 'You have a test in progress. '),
        `${s.mode === 'mock' ? 'Full mock' : 'Practice'} test, ${answered} of ${s.qids.length} answered. `,
        s.endAt ? 'The timer keeps running while you are away. ' : '',
        h('div', { class: 'btn-row', style: 'margin-top:8px' },
          h('button', { class: 'btn primary', onclick: resumeTest }, 'Resume test'),
          h('button', { class: 'btn', onclick: discardSession }, 'Discard it'))));
    }
    if (!storageOK) root.append(h('div', { class: 'notice warn' }, 'Progress cannot be saved in this browser session (private window or blocked storage). Use Export progress to keep your results.'));

    root.append(h('div', { class: 'grid stats' },
      stat(BANK.questions.length, 'Total questions'),
      stat(BANK.chapters.length, 'Chapters'),
      stat(attemptedN, 'Attempted so far'),
      stat(BANK.questions.length - attemptedN, 'Not yet attempted')));

    // builder
    const chapRows = BANK.chapters.map((c) => {
      const p = prog[c.id];
      return h('tr', null,
        h('td', null, h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'ch-' + c.id, checked: S.chapters.includes(c.id), onchange: onChapterToggle }),
          h('span', null, h('strong', null, 'Ch ' + c.id + '. '), c.name))),
        h('td', { class: 'num' }, c.count),
        h('td', { class: 'num' }, p.att ? `${p.att}` : '0'),
        h('td', { class: 'num' }, p.att ? pct((p.ok / p.att) * 100) : '–'));
    });
    const builder = h('div', { class: 'card', id: 'builder' },
      h('h2', null, 'Build your test'),
      h('fieldset', null, h('legend', null, '1. Chapters'),
        h('div', { class: 'btn-row', style: 'margin-bottom:8px' },
          h('button', { class: 'btn small', type: 'button', onclick: () => setChapters(BANK.chapters.map((c) => c.id)) }, 'Select all chapters'),
          h('button', { class: 'btn small', type: 'button', onclick: () => setChapters([]) }, 'Clear')),
        h('div', { class: 'table-wrap' }, h('table', null,
          h('thead', null, h('tr', null, h('th', null, 'Chapter'), h('th', { class: 'num' }, 'Questions'), h('th', { class: 'num' }, 'Attempted'), h('th', { class: 'num' }, 'Last-attempt accuracy'))),
          h('tbody', null, chapRows)))),
      h('fieldset', null, h('legend', null, '2. Mode'),
        radio('mode', 'practice', 'Practice mode – no timer; the correct answer and explanation appear as soon as you answer a question.', S.mode === 'practice'),
        radio('mode', 'mock', 'Full mock test – timed; correct answers stay hidden until you submit.', S.mode === 'mock')),
      h('fieldset', null, h('legend', null, '3. Length and order'),
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'custom', checked: S.custom, onchange: onField }), h('span', null, 'Custom length (use only some of the selected questions)')),
        h('div', { class: 'field', style: 'margin-top:8px' }, h('label', { for: 'customN' }, 'Number of questions'), h('input', { type: 'number', id: 'customN', min: 1, step: 1, value: S.customN, oninput: onField })),
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'random', checked: S.random, onchange: onField }), h('span', null, 'Randomise question order (off = bank order; options are never shuffled)')),
        h('label', { class: 'chk', style: 'margin-top:6px' }, h('input', { type: 'checkbox', id: 'skipRepeats', checked: S.skipRepeats, onchange: onField }), h('span', null, 'Skip repeated copies of the same question (keeps the first copy in your selection)')),
        h('p', { class: 'hint', id: 'lenHint', style: 'margin-top:6px' })),
      h('fieldset', null, h('legend', null, '4. Time and marking'),
        h('div', { class: 'inline' },
          h('div', { class: 'field' }, h('label', { for: 'minutes' }, 'Duration (minutes, full mock only)'), h('input', { type: 'number', id: 'minutes', min: 1, step: 1, oninput: onField })),
          h('div', { class: 'field' }, h('label', { for: 'marksC' }, 'Marks per correct answer'), h('input', { type: 'number', id: 'marksC', min: 0, step: 0.25, value: S.marksC, oninput: onField })),
          h('div', { class: 'field' }, h('label', { for: 'marksN' }, 'Negative marks per wrong answer'), h('input', { type: 'number', id: 'marksN', min: 0, step: 0.25, value: S.marksN, oninput: onField }))),
        h('p', { class: 'hint' }, 'The source does not specify negative marking, so it defaults to 0. Default duration is 1 minute per question.'),
        h('div', { class: 'field' }, h('label', { for: 'keyMode' }, 'Answer key used for scoring'),
          h('select', { id: 'keyMode', onchange: onField },
            h('option', { value: 'printed', selected: S.keyMode === 'printed' }, "Book's printed key (as published)"),
            h('option', { value: 'verified', selected: S.keyMode === 'verified' }, 'Verified key (replaces answers flagged as wrong)'))),
        h('p', { class: 'hint' }, 'A small number of printed answers look wrong. Both keys are always shown in the explanation; this only changes how marks are counted.')),
      h('p', { id: 'sumLine', style: 'font-weight:700' }),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', id: 'startBtn', onclick: onStart }, 'Start test')));

    const side = h('div', { class: 'grid' },
      h('div', { class: 'card' },
        h('details', { class: 'instr', open: true },
          h('summary', null, 'Instructions'),
          h('ul', null,
            h('li', null, 'Pick a mode, choose chapters, then press Start test.'),
            h('li', null, 'Choosing an option saves it immediately. Save & Next moves on; Previous goes back; Clear Response removes your answer.'),
            h('li', null, 'Mark for Review & Next flags a question to revisit. A question that is answered and marked is still counted as answered.'),
            h('li', null, 'Palette colours: grey = not visited, red = visited but not answered, green = answered, purple circle = marked for review, purple circle with a tick = answered and marked.'),
            h('li', null, 'In a full mock the timer counts down and the test submits automatically at zero. In practice mode there is no timer.'),
            h('li', null, 'After submitting you see your score, chapter-wise performance, every correct answer with its English explanation, and can retry the questions you got wrong.'),
            h('li', null, 'Your progress is saved in this browser only. Use Export progress / Import progress to move it to another device.')))),
      h('div', { class: 'card' }, h('h2', null, 'Recent attempts'), recentAttempts()),
      h('div', { class: 'card' }, h('h2', null, 'Data tools'),
        h('p', { class: 'hint' }, 'Local browser storage is per browser and per device, is cleared if you wipe site data, and holds roughly 5 MB. Export a backup regularly. Your question bank is never changed by any of these actions.'),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn small', onclick: exportProgress }, 'Export progress (JSON)'),
          h('button', { class: 'btn small', onclick: () => $('#importFile').click() }, 'Import progress'),
          h('button', { class: 'btn small', onclick: () => download('math_question_bank.json', JSON.stringify(BANK, null, 1), 'application/json') }, 'Export question bank (JSON)'),
          h('button', { class: 'btn small', onclick: () => download('math_question_bank_english.txt', L.readableBank(BANK), 'text/plain') }, 'Export readable English bank (TXT)'),
          h('button', { class: 'btn small danger', onclick: resetAll }, 'Reset my progress')),
        h('input', { type: 'file', id: 'importFile', accept: 'application/json,.json', hidden: true, onchange: importProgress })));

    root.append(h('div', { class: 'grid two-col' }, builder, side));
    refreshSummary();
  }

  function presetsCard() {
    const bestWeak = (() => {
      const p = chapterProgress();
      const list = BANK.chapters.filter((c) => p[c.id].att >= 3).map((c) => ({ c, acc: p[c.id].ok / p[c.id].att })).sort((a, b) => a.acc - b.acc);
      return list.length && list[0].acc < 0.7 ? list[0].c : null;
    })();
    const tile = (title, sub, onclick, primary) => h('button', { class: 'tile' + (primary ? ' primary' : ''), type: 'button', onclick }, h('strong', null, title), h('span', null, sub));
    return h('div', { class: 'card presets' },
      h('h2', null, 'Start now'),
      h('div', { class: 'tiles' },
        tile('Quick practice', '20 random questions, instant answers, no timer', () => startPreset('quick'), true),
        tile('Full mock test', 'Up to 100 questions, timed, answers after submit', () => startPreset('mock')),
        bestWeak ? tile('Fix my weak chapter', 'Ch ' + bestWeak.id + ': ' + bestWeak.name, () => startPreset('weak', bestWeak.id)) : tile('Practice by chapter', 'Pick chapters below', () => { const b = document.getElementById('builder'); if (b) b.scrollIntoView({ behavior: 'smooth' }); })),
      h('p', { class: 'hint' }, 'Want to choose chapters, length or marking? Use "Build your test" below.'));
  }
  async function startPreset(kind, chapterId) {
    const S = store.settings;
    const all = chapterId ? [chapterId] : BANK.chapters.map((c) => c.id);
    const pool = L.buildPool(BANK, all, true);
    if (!pool.length) return;
    if (store.session && !(await confirmDialog({ title: 'Replace the test in progress?', body: 'Starting a new test will discard the unfinished one.', ok: 'Start new test', danger: true }))) return;
    const n = Math.min(kind === 'mock' ? 100 : 20, pool.length);
    beginSession({ mode: kind === 'mock' ? 'mock' : 'practice', keyMode: S.keyMode, minutes: n, marksC: S.marksC, marksN: S.marksN, qids: L.pickQuestions(pool, { count: n, random: true }) });
  }
  const stat = (n, label) => h('div', { class: 'stat' }, h('b', null, n.toLocaleString()), h('span', null, label));
  const radio = (name, value, text, checked) => h('label', { class: 'radio-line' }, h('input', { type: 'radio', name, value, checked, onchange: onField }), h('span', null, text));

  function recentAttempts() {
    if (!store.history.length) return h('p', { class: 'hint' }, 'No finished tests yet.');
    return h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'When'), h('th', null, 'Mode'), h('th', { class: 'num' }, 'Score'), h('th', null, ''))),
      h('tbody', null, store.history.slice(0, 8).map((x) => {
        const ev = L.evaluate(x, byId, x.keyMode);
        return h('tr', null,
          h('td', null, new Date(x.submittedAt).toLocaleString()),
          h('td', null, x.mode === 'mock' ? 'Mock' : 'Practice'),
          h('td', { class: 'num' }, `${ev.score}/${ev.maxScore}`),
          h('td', null, h('button', { class: 'btn small', onclick: () => showResult(x.id) }, 'View')));
      }))));
  }

  function setChapters(ids) { store.settings.chapters = ids; save(); for (const c of BANK.chapters) { const b = $('#ch-' + c.id); if (b) b.checked = ids.includes(c.id); } refreshSummary(); }
  function onChapterToggle() { store.settings.chapters = BANK.chapters.filter((c) => $('#ch-' + c.id).checked).map((c) => c.id); save(); refreshSummary(); }
  function num(id, dflt, min) { const v = parseFloat($('#' + id).value); return Number.isFinite(v) && v >= min ? v : dflt; }
  function onField() {
    const S = store.settings;
    S.mode = (document.querySelector('input[name=mode]:checked') || {}).value || 'practice';
    S.custom = $('#custom').checked; S.random = $('#random').checked; S.skipRepeats = $('#skipRepeats').checked; S.keyMode = $('#keyMode').value;
    S.customN = Math.max(1, Math.floor(num('customN', S.customN, 1)));
    S.marksC = num('marksC', S.marksC, 0); S.marksN = num('marksN', S.marksN, 0);
    const mv = parseFloat($('#minutes').value);
    S.minutes = Number.isFinite(mv) && mv >= 1 ? Math.floor(mv) : null;
    save(); refreshSummary();
  }
  function plan() {
    const S = store.settings, pool = currentPool();
    const n = S.custom ? Math.min(S.customN, pool.length) : pool.length;
    const minutes = S.minutes || Math.max(1, n);
    return { S, pool, n, minutes };
  }
  function refreshSummary() {
    const { S, pool, n, minutes } = plan();
    $('#customN').disabled = !S.custom;
    $('#minutes').disabled = S.mode !== 'mock';
    $('#minutes').placeholder = String(Math.max(1, n));
    if (document.activeElement !== $('#minutes')) $('#minutes').value = S.minutes || '';
    const lens = S.custom && pool.length > 0
      ? (S.random ? `${n} questions will be sampled at random from ${pool.length} available.` : `The first ${n} of ${pool.length} available questions (in bank order) will be used. Turn on randomise to sample across them.`)
      : `${pool.length} questions available in the selected chapters.`;
    $('#lenHint').textContent = lens;
    $('#sumLine').textContent = pool.length ? `This test: ${n} question${n === 1 ? '' : 's'} from ${S.chapters.length} chapter${S.chapters.length === 1 ? '' : 's'}; ${S.mode === 'mock' ? minutes + ' minutes' : 'no timer'}; ${S.marksC} mark per correct, −${S.marksN} per wrong.` : 'Select at least one chapter to start.';
    $('#startBtn').disabled = pool.length === 0;
  }

  async function onStart() {
    const { S, pool, n, minutes } = plan();
    if (!pool.length) return;
    if (store.session && !(await confirmDialog({ title: 'Replace the test in progress?', body: 'Starting a new test will discard the unfinished one.', ok: 'Start new test', danger: true }))) return;
    const qids = L.pickQuestions(pool, { count: n, random: S.random });
    beginSession({ mode: S.mode, keyMode: S.keyMode, minutes, marksC: S.marksC, marksN: S.marksN, qids });
  }
  function beginSession(o) {
    const now = Date.now();
    store.session = {
      id: 'T' + now.toString(36), startedAt: now, mode: o.mode, keyMode: o.keyMode,
      durationSec: o.mode === 'mock' ? o.minutes * 60 : null, endAt: o.mode === 'mock' ? now + o.minutes * 60000 : null,
      marks: { c: o.marksC, n: o.marksN }, qids: o.qids, idx: 0, resp: {}, vis: {}, mark: {}, revealed: {}, done: false,
    };
    save(); renderTest({ focusQ: true });
  }
  function resumeTest() {
    const s = store.session;
    if (s.endAt && Date.now() >= s.endAt) { submitTest('timeout'); return; }
    renderTest({ focusQ: true });
  }
  async function discardSession() {
    if (await confirmDialog({ title: 'Discard this test?', body: 'Your answers in the unfinished test will be lost.', ok: 'Discard', danger: true })) { store.session = null; save(); renderDashboard(); }
  }
  async function resetAll() {
    if (!(await confirmDialog({ title: 'Reset all progress?', body: 'This clears your attempts, results and settings stored in this browser. The question bank is not affected. Export first if you want a backup.', ok: 'Reset progress', danger: true }))) return;
    store = freshStore(); save(); renderDashboard(); say('Progress reset.');
  }
  function exportProgress() {
    download('math_progress_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app: 'math-cbt', version: 1, exportedAt: new Date().toISOString(), store }), 'application/json');
  }
  function importProgress(ev) {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let obj;
      try { obj = JSON.parse(r.result); } catch (e) { obj = null; }
      if (!obj || obj.app !== 'math-cbt' || !obj.store) { await confirmDialog({ title: 'Could not import', body: 'This file is not an exported progress file from this app.', hideCancel: true }); return; }
      if (await confirmDialog({ title: 'Replace current progress?', body: 'Importing replaces the progress stored in this browser with the contents of the file.', ok: 'Import', danger: true })) {
        store = normalizeStore(obj.store); save(); renderDashboard(); say('Progress imported.');
      }
    };
    r.readAsText(f);
  }

  /* ================= TEST ================= */
  const sess = () => store.session;
  const curQ = () => byId.get(sess().qids[sess().idx]);

  function renderTest(opts) {
    opts = opts || {};
    const s = sess();
    show('test');
    const root = $('#view-test');
    const q = curQ();
    s.vis[q.id] = true;
    document.title = `Q${s.idx + 1}/${s.qids.length} – Mathematics Mock`;
    const practice = s.mode === 'practice';
    const revealed = practice && s.revealed[q.id];
    const keys = L.keysFor(q, s.keyMode);
    const chosen = s.resp[q.id];
    const sections = [...new Set(s.qids.map((id) => byId.get(id).ch))];

    // top bar
    const right = $('#topbar-right');
    right.append(practice ? h('span', { class: 'pill' }, 'Practice mode – no timer') : h('span', { class: 'timer', id: 'timer', role: 'timer', 'aria-label': 'Time remaining' }, '--:--'),
      h('button', { class: 'btn small', onclick: () => submitTest('manual') }, 'Submit Test'));

    const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Chapters in this test' }, sections.map((c) => {
      const cnt = s.qids.filter((id) => byId.get(id).ch === c).length;
      return h('button', { class: 'tab', role: 'tab', 'aria-selected': String(c === q.ch), title: chapterById.get(c).name, onclick: () => go(s.qids.findIndex((id) => byId.get(id).ch === c)) }, `Ch ${c} (${cnt})`);
    }));

    const optList = h('ul', { class: 'opts', role: 'radiogroup', 'aria-labelledby': 'qtext' }, q.o.map((o, i) => {
      const isSel = chosen === i;
      const cls = 'opt' + (isSel ? ' sel' : '') + (revealed ? ' locked' + (keys.includes(i) ? ' right' : isSel ? ' wrong' : '') : '');
      const tag = revealed ? (keys.includes(i) ? '✓ Correct' : isSel ? '✗ Your answer' : '') : '';
      return h('li', null, h('label', { class: cls },
        h('input', { type: 'radio', name: 'opt', id: 'opt-' + i, value: i, checked: isSel, disabled: revealed, onchange: () => choose(i) }),
        h('span', { class: 'ol' }, L.LETTERS[i] + '.'), h('span', null, o), tag ? h('span', { class: 'tag' }, tag) : null));
    }));

    const marked = !!s.mark[q.id];
    const last = s.idx === s.qids.length - 1;
    const actions = h('div', { class: 'actions' },
      h('button', { class: 'btn', disabled: s.idx === 0, onclick: () => go(s.idx - 1) }, 'Previous'),
      h('button', { class: 'btn review grow', onclick: markNext }, marked ? 'Unmark & Next' : 'Mark for Review & Next'),
      h('button', { class: 'btn', disabled: chosen === undefined, onclick: clearResp }, 'Clear Response'),
      h('button', { class: 'btn success grow', onclick: saveNext }, last ? 'Save' : 'Save & Next'));

    const card = h('div', { class: 'card' },
      h('div', { class: 'qhead' },
        h('span', { class: 'qnum' }, `Question ${s.idx + 1} of ${s.qids.length}`),
        h('span', { class: 'qmeta' }, `Ch ${q.ch} · ${q.id} · PDF p.${q.page} · source Q${q.srcNo}`)),
      h('div', { class: 'qtext', id: 'qtext', tabindex: '-1' }, q.q),
      optList,
      revealed ? feedbackBlock(q, keys, chosen) : null,
      actions);

    root.replaceChildren(tabs, h('div', { class: 'test-layout' }, card, paletteBlock(s, q)));
    if (!practice) startTimer();
    if (opts.focusQ) $('#qtext').focus({ preventScroll: false });
    else if (opts.focusOpt != null && !revealed) { const el = $('#opt-' + opts.focusOpt); if (el) el.focus(); }
    else if (revealed && opts.focusFeedback) { const f = $('#feedback'); if (f) f.focus(); }
  }

  function keyText(q, idxs) { return idxs.map((i) => `(${L.LETTERS[i]}) ${q.o[i]}`).join(' or '); }
  function feedbackBlock(q, keys, chosen) {
    const ok = keys.includes(chosen);
    const differs = JSON.stringify(q.key.printed) !== JSON.stringify(q.key.verified) || q.key.official != null;
    return h('div', { class: 'feedback ' + (ok ? 'good' : 'badf'), id: 'feedback', tabindex: '-1', role: 'status' },
      h('h3', null, ok ? 'Correct' : 'Incorrect – correct answer: ' + keyText(q, keys)),
      differs ? h('p', { class: 'hint' },
        `Book's printed key: ${q.key.printed.length ? keyText(q, q.key.printed) : 'none printed'}. Verified answer: ${keyText(q, q.key.verified)}.`
        + (q.key.official != null ? ` Answer the exam body accepted (per the book): ${keyText(q, [q.key.official])}.` : '')) : null,
      h('p', null, h('strong', null, 'Explanation: '), q.e),
      q.tip ? h('p', null, h('strong', null, 'Tip: '), q.tip) : null,
      q.note ? h('div', { class: 'flagnote' }, h('strong', null, 'Review note: '), q.note) : null);
  }

  function paletteBlock(s, cur) {
    const c = L.countStatuses(s);
    const legend = h('div', { class: 'legend' },
      ...[['nv', 'Not Visited'], ['na', 'Not Answered'], ['a', 'Answered'], ['m', 'Marked for Review'], ['am', 'Answered & Marked']].map(([k, t]) =>
        h('div', null, h('span', { class: 'sw pq ' + k }, c[k]), h('span', null, t))));
    const order = [...new Set(s.qids.map((id) => byId.get(id).ch))];
    const groups = order.map((ch) => {
      const idxs = s.qids.map((id, i) => i).filter((i) => byId.get(s.qids[i]).ch === ch);
      const grid = h('div', { class: 'pgrid', role: 'group', 'aria-label': 'Chapter ' + ch + ' questions' }, idxs.map((i) => {
        const st = L.statusOf(s, s.qids[i]);
        return h('button', { class: 'pq ' + st + (i === s.idx ? ' cur' : ''), 'aria-label': `Question ${i + 1}, ${STATUS_LABEL[st]}`, 'aria-current': i === s.idx ? 'true' : null, onclick: () => go(i) }, String(i + 1));
      }));
      return h('div', { class: 'pgroup' }, h('div', { class: 'pal-title' }, `Ch ${ch}: ${chapterById.get(ch).name}`), grid);
    });
    const pal = h('aside', { class: 'pal' + (paletteOpen ? ' open' : ''), 'aria-label': 'Question palette' },
      h('button', { class: 'btn pal-toggle', 'aria-expanded': String(paletteOpen), onclick: (e) => { paletteOpen = !paletteOpen; pal.classList.toggle('open', paletteOpen); e.currentTarget.setAttribute('aria-expanded', String(paletteOpen)); } },
        `Question palette – ${c.a + c.am} of ${s.qids.length} answered`),
      h('div', { class: 'pal-body' }, legend,
        ...groups,
        h('div', { class: 'btn-row', style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: () => submitTest('manual') }, 'Submit Test'))));
    return pal;
  }
  let paletteOpen = false;

  function go(i) { const s = sess(); if (i < 0 || i >= s.qids.length) return; s.idx = i; save(); renderTest({ focusQ: true }); }
  function choose(i) {
    const s = sess(), q = curQ();
    s.resp[q.id] = i;
    if (s.mode === 'practice') s.revealed[q.id] = true;
    save(); renderTest({ focusOpt: i, focusFeedback: true });
  }
  function clearResp() {
    const s = sess(), q = curQ();
    delete s.resp[q.id]; delete s.revealed[q.id];
    save(); renderTest({ focusQ: true }); say('Response cleared.');
  }
  function saveNext() {
    const s = sess();
    if (s.idx < s.qids.length - 1) go(s.idx + 1);
    else say('This is the last question. Use Submit Test when you are done.');
  }
  function markNext() {
    const s = sess(), q = curQ();
    if (s.mark[q.id]) delete s.mark[q.id]; else s.mark[q.id] = true;
    save();
    if (s.idx < s.qids.length - 1) go(s.idx + 1); else renderTest({ focusQ: true });
  }

  let lastSaid = null;
  function startTimer() {
    stopTimer();
    const s = sess();
    if (!s || s.endAt == null) return;
    const t = $('#timer');
    const tick = () => {
      const rem = Math.ceil((s.endAt - Date.now()) / 1000);
      if (t) { t.textContent = L.fmtTime(rem); t.className = 'timer' + (rem <= 60 ? ' crit' : rem <= 300 ? ' warn' : ''); }
      if (rem <= 0) { stopTimer(); submitTest('timeout'); return; }
      if (rem % 300 === 0 && rem !== lastSaid) { lastSaid = rem; say(`${rem / 60} minutes remaining.`); }
    };
    tick();
    timerId = setInterval(tick, 500);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && timerId && sess() && sess().endAt && Date.now() >= sess().endAt) submitTest('timeout'); });

  async function submitTest(reason) {
    const s = sess();
    if (!s || submitting) return;
    if (reason === 'timeout') { const d = $('#dlg'); if (d.open) d.close('cancel'); }
    else {
      const c = L.countStatuses(s);
      const left = s.endAt ? Math.max(0, Math.round((s.endAt - Date.now()) / 1000)) : null;
      const ok = await confirmDialog({
        title: 'Submit test?',
        body: [h('div', { class: 'sumgrid' },
          h('span', null, 'Total questions'), h('b', null, s.qids.length),
          h('span', null, 'Answered'), h('b', null, c.a + c.am),
          h('span', null, 'Not answered'), h('b', null, c.na + c.nv + c.m),
          h('span', null, 'Marked for review'), h('b', null, c.m + c.am),
          left != null ? h('span', null, 'Time left') : null, left != null ? h('b', null, L.fmtTime(left)) : null),
          h('p', { class: 'hint', style: 'margin-top:8px' }, 'You cannot change answers after submitting.')],
        ok: 'Submit test', danger: true,
      });
      if (!ok || !sess() || sess().id !== s.id) return;
    }
    submitting = true;
    try {
      stopTimer();
      s.done = true; s.submittedAt = Date.now(); s.reason = reason;
      const copy = JSON.parse(JSON.stringify(s));
      store.history.unshift(copy);
      store.history.length = Math.min(store.history.length, HISTORY_MAX);
      const ev = L.evaluate(copy, byId, copy.keyMode);
      for (const r of ev.rows) if (r.attempted) { const p = store.attempted[r.q.id]; store.attempted[r.q.id] = { n: (p ? p.n : 0) + 1, c: r.correct ? 1 : 0 }; }
      store.session = null;
      save();
      showResult(copy.id, reason === 'timeout' ? 'Time is up – your test was submitted automatically.' : '');
    } finally { submitting = false; }
  }

  /* ================= RESULT ================= */
  let resultView = { id: null, filter: 'all', keyMode: null };
  function showResult(id, notice) {
    const x = store.history.find((e) => e.id === id);
    if (!x) { renderDashboard(); return; }
    if (resultView.id !== id) resultView = { id, filter: 'all', keyMode: x.keyMode };
    renderResult(notice);
  }
  function renderResult(notice) {
    show('result');
    const x = store.history.find((e) => e.id === resultView.id);
    const ev = L.evaluate(x, byId, resultView.keyMode);
    const root = $('#view-result');
    document.title = 'Results – Mathematics Mock';
    const spent = Math.max(0, Math.round((x.submittedAt - x.startedAt) / 1000));
    const timeTaken = x.durationSec ? Math.min(spent, x.durationSec) : spent;
    const { weak, untouched } = L.weakChapters(ev.perChapter);
    const incorrectRows = ev.rows.filter((r) => r.attempted && !r.correct);
    const disputedInTest = ev.rows.filter((r) => JSON.stringify(r.q.key.printed) !== JSON.stringify(r.q.key.verified)).length;

    const filters = [
      ['all', 'All', ev.rows.length], ['incorrect', 'Incorrect', incorrectRows.length],
      ['unattempted', 'Unattempted', ev.unattempted], ['marked', 'Marked for review', ev.rows.filter((r) => r.marked).length], ['correct', 'Correct', ev.correct]];
    const shown = ev.rows.filter((r) => ({ all: true, incorrect: r.attempted && !r.correct, unattempted: !r.attempted, marked: r.marked, correct: r.correct })[resultView.filter]);

    root.replaceChildren(...[
      h('h1', null, 'Your results'),
      notice ? h('div', { class: 'notice warn', role: 'status' }, notice) : null,
      h('p', { class: 'hint' }, `${x.mode === 'mock' ? 'Full mock test' : 'Practice test'} · submitted ${new Date(x.submittedAt).toLocaleString()}`),
      h('div', { class: 'score-hero' },
        stat2(`${ev.score} / ${ev.maxScore}`, 'Score', 'big'),
        stat2(pct(ev.accuracy), 'Accuracy (of attempted)', 'big'),
        stat2(ev.total, 'Total questions'), stat2(ev.attempted, 'Attempted'), stat2(ev.unattempted, 'Unattempted'),
        stat2(ev.correct, 'Correct', 'good-t'), stat2(ev.incorrect, 'Incorrect', 'bad-t'), stat2(L.fmtTime(timeTaken), 'Time taken')),
      h('div', { class: 'card', style: 'margin-bottom:12px' },
        h('div', { class: 'inline' },
          h('div', { class: 'field', style: 'margin:0' }, h('label', { for: 'rkey' }, 'Answer key used for scoring'),
            h('select', { id: 'rkey', onchange: (e) => { resultView.keyMode = e.target.value; renderResult(); } },
              h('option', { value: 'printed', selected: resultView.keyMode === 'printed' }, "Book's printed key"),
              h('option', { value: 'verified', selected: resultView.keyMode === 'verified' }, 'Verified key'))),
          h('span', { class: 'hint' }, `Marks: +${x.marks.c} per correct, −${x.marks.n} per wrong. ${disputedInTest} question${disputedInTest === 1 ? '' : 's'} in this test have a printed key that differs from the verified answer; switch the key to see the effect.`))),
      h('div', { class: 'card', style: 'margin-bottom:12px' },
        h('h2', null, 'Chapter-wise performance'),
        h('div', { class: 'table-wrap' }, h('table', null,
          h('thead', null, h('tr', null, h('th', null, 'Chapter'), h('th', { class: 'num' }, 'Qs'), h('th', { class: 'num' }, 'Attempted'), h('th', { class: 'num' }, 'Correct'), h('th', { class: 'num' }, 'Wrong'), h('th', { class: 'num' }, 'Skipped'), h('th', { class: 'num' }, 'Marks'), h('th', null, 'Accuracy'))),
          h('tbody', null, Object.values(ev.perChapter).sort((a, b) => a.ch - b.ch).map((c) => h('tr', null,
            h('td', null, `Ch ${c.ch}. ${chapterById.get(c.ch).name}`), h('td', { class: 'num' }, c.total), h('td', { class: 'num' }, c.attempted), h('td', { class: 'num' }, c.correct), h('td', { class: 'num' }, c.incorrect), h('td', { class: 'num' }, c.unattempted), h('td', { class: 'num' }, c.marks),
            h('td', null, c.accuracy == null ? h('span', { class: 'hint' }, 'not attempted') : h('div', { class: 'inline', style: 'gap:8px' }, h('div', { class: 'bar' + (c.accuracy < L.WEAK_ACCURACY ? ' weak' : ''), style: 'width:90px' }, h('i', { style: `width:${c.accuracy}%` })), pct(c.accuracy)))))))),
        h('h3', { style: 'margin-top:14px' }, 'Recommended chapters for revision'),
        weak.length || untouched.length
          ? h('ul', null,
            weak.map((c) => h('li', null, h('strong', null, `Ch ${c.ch}. ${chapterById.get(c.ch).name}`), ` – accuracy ${pct(c.accuracy)} (below ${L.WEAK_ACCURACY}%)`)),
            untouched.map((c) => h('li', null, `Ch ${c.ch}. ${chapterById.get(c.ch).name}`, h('span', { class: 'hint' }, ' – no question attempted'))))
          : h('p', null, `No weak chapters: every attempted chapter is at or above ${L.WEAK_ACCURACY}% accuracy.`),
        h('div', { class: 'btn-row', style: 'margin-top:10px' },
          h('button', { class: 'btn primary', disabled: !incorrectRows.length, onclick: () => reattempt(incorrectRows.map((r) => r.q.id), x) }, `Reattempt incorrect questions (${incorrectRows.length})`),
          h('button', { class: 'btn', onclick: () => chapterPractice(weak.length ? weak : Object.values(ev.perChapter)) }, 'Chapter-wise practice'),
          h('button', { class: 'btn', onclick: renderDashboard }, 'Back to dashboard'))),
      h('h2', null, 'Question review'),
      h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter questions' }, filters.map(([k, t, n]) =>
        h('button', { class: 'chip', 'aria-pressed': String(resultView.filter === k), onclick: () => { resultView.filter = k; renderResult(); } }, `${t} (${n})`))),
      shown.length ? shown.map((r) => reviewCard(r)) : h('p', { class: 'hint' }, 'No questions in this filter.')].flat(Infinity).filter(Boolean));
  }
  const stat2 = (v, label, cls) => h('div', { class: 'stat' }, h('b', { class: cls || '' }, String(v)), h('span', null, label));

  function reviewCard(r) {
    const q = r.q;
    const st = !r.attempted ? ['Unattempted', 'un'] : r.correct ? ['Correct', 'ok'] : ['Incorrect', 'bad'];
    const differs = JSON.stringify(q.key.printed) !== JSON.stringify(q.key.verified) || q.key.official != null;
    return h('article', { class: 'card rcard' },
      h('div', { class: 'qhead' },
        h('span', null, h('span', { class: 'qnum' }, `Q${r.n}`), ' ', h('span', { class: 'badge ' + st[1] }, st[0]), r.marked ? h('span', { class: 'badge mk' }, 'Marked') : null, q.status === 'disputed' || q.status === 'missing' ? h('span', { class: 'badge wn' }, 'Key under review') : null),
        h('span', { class: 'qmeta' }, `Ch ${q.ch} · ${q.id} · PDF p.${q.page} · source Q${q.srcNo}`)),
      h('div', { class: 'qtext' }, q.q),
      h('ul', { class: 'opts' }, q.o.map((o, i) => {
        const right = r.keys.includes(i), mine = r.chosen === i;
        return h('li', null, h('div', { class: 'opt locked' + (right ? ' right' : mine ? ' wrong' : '') },
          h('span', { class: 'ol' }, L.LETTERS[i] + '.'), h('span', null, o),
          h('span', { class: 'tag' }, [right ? '✓ Correct' : '', mine ? (right ? '(your answer)' : '✗ Your answer') : ''].filter(Boolean).join(' '))));
      })),
      h('p', { style: 'margin-top:8px' }, h('strong', null, 'Your answer: '), r.attempted ? `(${L.LETTERS[r.chosen]}) ${q.o[r.chosen]}` : 'not attempted', ' · ', h('strong', null, 'Correct answer: '), keyText(q, r.keys)),
      differs ? h('p', { class: 'hint' }, `Book's printed key: ${q.key.printed.length ? keyText(q, q.key.printed) : 'none printed'}. Verified answer: ${keyText(q, q.key.verified)}.` + (q.key.official != null ? ` Answer the exam body accepted (per the book): ${keyText(q, [q.key.official])}.` : '')) : null,
      h('p', null, h('strong', null, 'Explanation: '), q.e),
      q.tip ? h('p', null, h('strong', null, 'Tip: '), q.tip) : null,
      q.note ? h('div', { class: 'flagnote' }, h('strong', null, 'Review note: '), q.note) : null);
  }

  function reattempt(ids, from) {
    if (store.session) { confirmDialog({ title: 'Finish or discard your current test first', body: 'You have an unfinished test. Resume or discard it from the dashboard before starting another.', hideCancel: true }); return; }
    beginSession({ mode: 'practice', keyMode: resultView.keyMode || from.keyMode, minutes: 1, marksC: from.marks.c, marksN: from.marks.n, qids: ids });
  }
  function chapterPractice(list) {
    store.settings.chapters = list.map((c) => c.ch).sort((a, b) => a - b);
    store.settings.mode = 'practice'; store.settings.custom = false;
    save(); renderDashboard();
    say('Weak chapters selected. Choose options and press Start test.');
  }

  /* ================= BOOT ================= */
  function decorate() {
    const t = document.querySelector('.brand-title'); if (t) t.textContent = BRAND.name;
    const m = document.querySelector('.brand-mark'); if (m) m.textContent = BRAND.mark;
    const f = document.getElementById('foot');
    if (f) f.replaceChildren(
      h('span', null, 'Source: ' + BANK.meta.source + '. Last updated ' + BANK.meta.generated + '.'),
      h('span', null, 'Answer keys are those printed in the book. Questions marked "key under review" show a separate verified answer. English text is not human-reviewed.'),
      h('a', { href: REPORT_URL, target: '_blank', rel: 'noopener' }, 'Report an error in a question'),
      h('a', { href: '../' }, 'All subjects'));
    try {
      const l = document.createElement('link'); l.rel = 'icon';
      l.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0e4a5b"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">' + BRAND.mark + '</text></svg>');
      document.head.appendChild(l);
    } catch (e) { /* icon is optional */ }
  }
  function boot() {
    decorate();
    if (bankErrors.length) {
      showBanner('The question bank failed validation, so the test is disabled. First problems: ' + bankErrors.slice(0, 8).join(' | '), true);
      $('#view-dashboard').hidden = false;
      $('#view-dashboard').replaceChildren(h('h1', null, 'Question bank error'), h('p', null, `${bankErrors.length} problem(s) found. Rebuild the data file and reload.`));
      return;
    }
    if (!storageOK) showBanner('Browser storage is unavailable here, so progress will not be saved between visits. Use Export progress to keep your results.');
    renderDashboard();
  }
  window.AOTApp = { renderDashboard, store: () => store }; // for debugging/tests
  boot();
})();
</script></body></html>
