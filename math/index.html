ansPage": 117, "srcNo": "Business Maths Q181", "exam": "", "q": "If interest is compounded annually, a sum of money in a bank account doubles in 7 years. How many years will it take for the money to become 8 times?", "o": ["21", "35", "28", "14"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "8 = 2³, and doubling takes 7 years, so 8 times takes 3 × 7 = 21 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0766", "ch": 12, "page": 117, "ansPage": 118, "srcNo": "Business Maths Q182", "exam": "", "q": "A sum of money at a certain rate of annually compounded interest becomes 3 times itself in 13 years. In how many years will it become 9 times itself at the same rate of compound interest?", "o": ["32 years", "20 years", "30 years", "26 years"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "3 times in 13 years. 9 = 3², so 9 times takes 2 × 13 = 26 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0767", "ch": 12, "page": 118, "ansPage": 118, "srcNo": "Business Maths Q183", "exam": "", "q": "For an amount of ₹85,000 over 2 years, the difference between the compound interest (annually compounded) and the simple interest is ₹850. Find the annual rate of interest.", "o": ["10%", "12%", "5%", "8%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For 2 years the difference = P(R/100)². So 850 = 85000(R/100)², giving R² = 100 and R = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0768", "ch": 12, "page": 118, "ansPage": 118, "srcNo": "Business Maths Q184", "exam": "", "q": "The difference between the compound interest and the simple interest on a sum of ₹x at 8% per annum for two years is ₹19.20. What is the value of x?", "o": ["2,500", "3,200", "2,800", "3,000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Difference = x(8/100)² = 19.20, so x = 19.20 × 100 × 100/(8 × 8) = ₹3000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0769", "ch": 12, "page": 118, "ansPage": 118, "srcNo": "Business Maths Q185", "exam": "", "q": "The difference between the compound interest and the simple interest on a sum of ₹x at 8.5% per annum for two years is ₹28.90. What is the value of x?", "o": ["₹3500", "₹4500", "₹3800", "₹4000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Difference D = P(R/100)², so 28.90 = x(8.5/100)². Then x = 2890 × 100/(8.5 × 8.5) = ₹4000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0770", "ch": 12, "page": 118, "ansPage": 118, "srcNo": "Business Maths Q186", "exam": "", "q": "For 2 years at 12% per annum, the difference between the compound interest and the simple interest on ₹x is ₹43.20. What is the value of x?", "o": ["2,800", "2,400", "3,000", "2,500"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For 2 years at R%, P × (R/100)² = D. So x = D × (100/R)² = 43.20 × 100²/12² = 432000/144 = ₹3000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0771", "ch": 12, "page": 118, "ansPage": 119, "srcNo": "Business Maths Q187", "exam": "", "q": "For a certain sum, at 5% annual interest, the difference between the compound interest (CI, annually) and the simple interest (SI) in 2 years is ₹25.00. Find the sum.", "o": ["₹7,500", "₹12,000", "₹8,000", "₹10,000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "SI = P × 5 × 2/100 = P/10. CI = P[(1.05)² − 1] = 41P/400. CI − SI = 41P/400 − P/10 = P/400 = 25, so P = ₹10,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0772", "ch": 12, "page": 119, "ansPage": 119, "srcNo": "Business Maths Q188", "exam": "", "q": "The simple interest on a certain sum at 3% per annum for 3 years is ₹315. What is the compound interest on the same sum at 4% per annum, compounded annually, for 2 years?", "o": ["₹228.48", "₹204", "₹285.6", "₹326.6"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "P = SI × 100/(R × T) = 315 × 100/9 = ₹3500. CI = 3500[(1.04)² − 1] = 3500 × (1.0816 − 1) = 3500 × 0.0816 = ₹285.60.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0773", "ch": 12, "page": 119, "ansPage": 119, "srcNo": "Business Maths Q189", "exam": "", "q": "Amit borrowed ₹25,000 at simple interest. Bhola borrowed the same amount at compound interest (compounded annually). At the end of 2 years, Bhola had to pay ₹160 more interest than Amit. Find the annual rate of interest.", "o": ["16/25 %", "8/25 %", "8%", "3 1/8 %"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The difference between CI and SI for 2 years = P(R/100)². So 160 = 25000(R/100)², giving R² = 160 × 10000/25000 = 64 and R = 8%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0774", "ch": 12, "page": 119, "ansPage": 119, "srcNo": "Business Maths Q190", "exam": "", "q": "An equal sum is invested at compound interest and at simple interest. After 2 years the compound interest plan and the simple interest plan give ₹3360 and ₹2800 respectively. If the interest rate is 40%, what is the sum (in ₹)?", "o": ["₹3500", "₹4500", "₹2500", "₹5500"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the principal be ₹x. Simple interest for 2 years at 40% = x × 40 × 2/100 = 2800, so 80x = 280000 and x = ₹3500.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source. The printed solution uses only the simple-interest figure (₹2800) to find the principal.", "void": false}, {"id": "MTH-0775", "ch": 12, "page": 119, "ansPage": 119, "srcNo": "Business Maths Q191", "exam": "", "q": "If interest is compounded annually, a sum invested at a certain rate of interest amounts to ₹3,600 in 2 years and ₹6,480 in 4 years. Find the sum invested.", "o": ["₹2,400", "₹3,600", "₹2,500", "₹2,000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the sum be ₹x. 3600 = x(1 + r/100)² and 6480 = x(1 + r/100)⁴. Dividing, 6480/3600 = (1 + r/100)² = 1.8, and 3600 = x × 1.8, so x = ₹2000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0776", "ch": 12, "page": 119, "ansPage": 119, "srcNo": "Business Maths Q192", "exam": "", "q": "A person borrowed a sum at 8% per annum simple interest. In 8 years, the interest received was ₹5,490 less than the sum borrowed. The sum borrowed was ______.", "o": ["₹15,500", "₹15,250", "₹14,280", "₹15,600"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the sum be 100%. Interest for 8 years at 8% = 64%. The interest is ₹5490 less than the sum, so 100% − 64% = 36% = ₹5490. Then 1% = ₹152.50 and 100% = ₹15,250.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0777", "ch": 13, "page": 120, "ansPage": 120, "srcNo": "Business Maths Q193", "exam": "09.06.2024 S-I", "q": "A table is available for ₹450 cash, or ₹210 paid at once and the balance in two monthly instalments of ₹125 each. What is the rate of interest in the instalment plan?", "o": ["33.8%", "33.5%", "34.8%", "34%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Cash value = ₹450. Cash down payment = ₹210. Balance = 450 − 210 = ₹240. Let the rate be r%. After one month ₹125 is paid, and after two months another ₹125. The present values must equal the balance: 240 + 240 × (r/100)(2/12) = (125 + 125 × (r/100)(1/12)) + 125, which gives (2/5 − 5/48)r = 10, so r = 2400/71 ≈ 33.8%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0778", "ch": 13, "page": 120, "ansPage": 120, "srcNo": "Business Maths Q194", "exam": "09.06.2024 S-I", "q": "A cooking stove is available for ₹520 paid at once and four monthly instalments of ₹520 each. If the rate of interest is 25% per annum, the cash price of the stove will be ______.", "o": ["₹2600", "₹2500", "₹2580", "₹2540"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the cash price be ₹x, so the balance is x − 520. For equal monthly instalments, each instalment = P(1 + nr/100)/(n + n(n − 1)/2 × r/100) with n = 4, r = 25/12 % per month. Putting the instalment as ₹520 and solving gives x − 520 = 1980, so x = ₹2500.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source; it is rebuilt from the printed solution.", "void": false}, {"id": "MTH-0779", "ch": 13, "page": 120, "ansPage": 120, "srcNo": "Business Maths Q195", "exam": "23.05.2024 S-II", "q": "A computer is available for ₹34000 cash, or ₹20000 paid at once and the rest in 5 equal monthly instalments. If the interest charged in the instalment plan is 30% per annum, the amount of each instalment will be ______.", "o": ["₹2000", "₹4000", "₹3500", "₹3000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Balance = 34000 − 20000 = ₹14000. Monthly interest = 30/12 = 2.5%. The equal-instalment formula gives each instalment = 14000 × 0.025 × (1.025)⁵/((1.025)⁵ − 1) ≈ 14000 × 0.025 × 1.1314/0.1314 ≈ ₹3000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0780", "ch": 13, "page": 120, "ansPage": 120, "srcNo": "Business Maths Q196", "exam": "23.05.2024 S-II", "q": "A TV set is sold for ₹20000 cash, or ₹6000 immediately and ₹16800 six months later. What is the rate of interest in the instalment plan?", "o": ["30%", "35%", "40%", "25%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Balance after the down payment = 20000 − 6000 = ₹14000. Interest = 16800 − 14000 = ₹2800 for 6 months (0.5 year). Rate = 2800 × 100/(14000 × 0.5) = 40%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0781", "ch": 13, "page": 120, "ansPage": 120, "srcNo": "Business Maths Q197", "exam": "23.05.2024 S-I", "q": "A fan is marked at ₹1940. It is available for ₹420 paid at once and three equal monthly instalments. If the instalment plan carries 16% per annum interest, each instalment will be ______.", "o": ["₹520", "₹540", "₹620", "₹560"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "After the down payment, the balance = 1940 − 420 = ₹1520. The monthly rate = 16/12 = 4/3 % = 4/300. Let each instalment be ₹x; the present value of the three instalments equals 1520: x[1/(1 + 4/300) + 1/(1 + 4/300)² + 1/(1 + 4/300)³] = 1520. Using 0.9868, 0.9738 and 0.9609: x × 2.9215 = 1520, so x ≈ ₹520.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-063", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0782", "ch": 13, "page": 121, "ansPage": 121, "srcNo": "Business Maths Q198", "exam": "23.05.2024 S-I", "q": "A washing machine costs ₹12000. The company takes ₹5200 immediately and the rest in equal instalments. If the rate of interest is 12% per annum and each monthly instalment is ₹1400, the number of instalments will be ______.", "o": ["4", "5", "6", "3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Balance = 12000 − 5200 = ₹6800. Monthly rate = 1%. Each instalment = P(1 + nr/100)/(n + n(n − 1)/2 × r/100), so 1400 = 6800(1 + n/100)/(n + n(n − 1)/200). This gives 7n² + 1325n − 6800 = 0, i.e. 7n(n − 5) + 1360(n − 5) = 0, so n = 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0783", "ch": 13, "page": 121, "ansPage": 121, "srcNo": "Business Maths Q199", "exam": "24.05.2024 S-I", "q": "A camera is sold for ₹2500 paid at once and ₹2100 paid 3 months later. If the rate of interest charged is 20% per annum, the cash price of the camera is ______.", "o": ["₹4500", "₹4600", "₹4700", "₹4400"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the cash price be P. After the ₹2500 down payment the balance is P − 2500, which is cleared three months (1/4 year) later by ₹2100 including simple interest: 2100 = (P − 2500)(1 + 20/400), so P − 2500 = 2000 and P = ₹4500.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source; it is rebuilt from the printed solution.", "void": false}, {"id": "MTH-0784", "ch": 13, "page": 121, "ansPage": 121, "srcNo": "Business Maths Q200", "exam": "24.05.2024 S-I", "q": "A dealer sells a microwave oven for ₹5800 cash. A customer buys it for ₹1800 cash down and three equal quarterly instalments. If the dealer charges 12% per annum interest, what will be the amount of each instalment?", "o": ["₹1650", "₹1660", "₹1619.04", "₹1670"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Balance = 5800 − 1800 = ₹4000. Using the equal-instalment formula as in the printed solution, the instalment = 4000(1 + 3 × 12/100)/(3 + (3 × 4/2)(12/100)) = 4000 × 1.36/3.36 = ₹1619.04.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source (the type of interest is not fully legible). The printed solution applies the equal-instalment formula and obtains ₹1619.04.", "void": false}, {"id": "MTH-0785", "ch": 13, "page": 122, "ansPage": 122, "srcNo": "Business Maths Q201", "exam": "22.05.2024 S-II", "q": "A juicer is available for ₹3500 cash, or ₹1500 paid at once and three equal quarterly instalments. The dealer charges 12% per annum interest compounded quarterly. Each instalment will be nearest to (in ₹) ______.", "o": ["₹706", "₹725", "₹710", "₹750"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Balance = 3500 − 1500 = ₹2000. Quarterly rate = 12/4 = 3%. Let each instalment be a. The present values: a/1.03 + a/1.03² + a/1.03³ = 2000, so a = 2000/(0.97087 + 0.94260 + 0.91514) = 2000/2.8286 ≈ ₹707 (the printed solution rounds to ₹706).", "tip": "", "status": "note", "note": "The exact value is about ₹707; the printed solution and key give ₹706, which is the listed option.", "void": false}, {"id": "MTH-0786", "ch": 13, "page": 122, "ansPage": 122, "srcNo": "Business Maths Q202", "exam": "22.05.2024 S-II", "q": "A table is available for ₹2000 cash, or ₹600 paid at once and ₹1500 paid two months later. What is the rate of interest in the instalment plan?", "o": ["43.5%", "42.85%", "44.5%", "41.4%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Cash price = ₹2000. Down payment = ₹600, so the balance = ₹1400. The interest for 2 months = 1500 − 1400 = ₹100. Rate = 100 × 100 × 12/(1400 × 2) = 42.85%.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source. It is rebuilt from the printed solution, which treats ₹1500 as the amount paid after two months.", "void": false}, {"id": "MTH-0787", "ch": 13, "page": 122, "ansPage": 122, "srcNo": "Business Maths Q203", "exam": "22.05.2024 S-II", "q": "A cycle is sold for ₹500 paid at once and an instalment of ₹610 one month later. If interest is charged at 20% per annum, what is the cash price of the cycle?", "o": ["₹1100", "₹1110", "₹1200", "₹1122"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Advance payment = ₹500. The instalment one month later = ₹610. 610 = (Principal) × (1 + 20/1200), so principal = 610 × 1200/1220 = ₹600. Cash price = 500 + 600 = ₹1100.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0788", "ch": 13, "page": 122, "ansPage": 122, "srcNo": "Business Maths Q204", "exam": "22.05.2024 S-I", "q": "A refrigerator of cash value ₹12000 is available for ₹3600 paid at once and two equal half-yearly instalments. If the dealer charges 20% per annum interest compounded half-yearly, each instalment will be ______.", "o": ["₹4800", "₹4840", "₹4860", "₹4880"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Balance = 12000 − 3600 = ₹8400. Half-yearly rate = 10%. EMI = P r(1 + r)ⁿ/((1 + r)ⁿ − 1) with n = 2: 8400 × 0.1 × 1.21/0.21 = 840 × 1.21/0.21 = ₹4840.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0789", "ch": 13, "page": 123, "ansPage": 123, "srcNo": "Business Maths Q205", "exam": "22.05.2024 S-I", "q": "A scooter is sold for ₹11000 paid at once and two equal instalments of ₹6250. If the interest rate is 25% per annum compounded annually, the cash price of the scooter is ______.", "o": ["₹20000", "₹23500", "₹21000", "₹21500"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The present value of the two instalments = 6250/(1.25) + 6250/(1.25)² = 5000 + 4000 = ₹9000. Cash price = 11000 + 9000 = ₹20000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0790", "ch": 13, "page": 123, "ansPage": 123, "srcNo": "Business Maths Q206", "exam": "18.09.2023 S-V", "q": "A loan of ₹1025 is repaid in two equal annual instalments. If the compound interest rate is 5% per annum, each instalment will be ______.", "o": ["₹540", "₹551.25", "₹550", "₹560"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "1025 = x/1.05 + x/(1.05)² = x(20/21 + 400/441) = x × 820/441. So x = 1025 × 441/820 = ₹551.25.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0791", "ch": 13, "page": 123, "ansPage": 123, "srcNo": "Business Maths Q207", "exam": "18.09.2023 S-V", "q": "A table costs ₹450 cash, or ₹210 paid at once and then ₹125 in two monthly instalments. What is the rate of interest in the instalment plan?", "o": ["33.80%", "33.50%", "34.80%", "34%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The cash balance = 450 − 210 = ₹240. Total interest paid = 210 + 2 × 125 − 450 = ₹10. The principal for the first month = 450 − 210 = ₹240; for the second month = 240 − 125 = ₹115. Total principal for one month each = 240 + 115 = ₹355. Rate = 100 × 10/(355 × 1/12) = 1000 × 12/355 = 33.80%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0792", "ch": 13, "page": 123, "ansPage": 123, "srcNo": "Business Maths Q208", "exam": "04.09.2023 S-II", "q": "A sum was borrowed and repaid in two equal annual instalments. If each instalment is ₹882 and the rate of interest is 5% per annum compounded annually, how much was borrowed?", "o": ["₹1640", "₹1620", "₹1680", "₹1780"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Borrowed amount = 882/(1.05) + 882/(1.05)² = 840 + 800 = ₹1640.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0793", "ch": 13, "page": 123, "ansPage": 123, "srcNo": "Business Maths Q209", "exam": "04.09.2023 S-I", "q": "A person borrowed some money and repaid it in two equal annual instalments of ₹8820 each. If the compound interest rate is 5% per annum, the amount borrowed was ______.", "o": ["₹17400", "₹16000", "₹16400", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The amount borrowed = 8820/1.05 + 8820/(1.05)² = 8400 + 8000 = ₹16400.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0794", "ch": 13, "page": 123, "ansPage": 124, "srcNo": "Business Maths Q210", "exam": "18.09.2023 S-V", "q": "A computer is available for ₹34000 cash, or ₹20000 paid at once and the rest in 5 equal monthly instalments. If the interest charged in the instalment plan is 30% per annum, each instalment will be ______.", "o": ["₹2000", "₹4000", "₹35000", "₹3000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Balance = 34000 − 20000 = ₹14000. The monthly rate = 30/12 = 2.5%. Let each instalment be ₹x; the present values of the five instalments add up to 14000. Summing the geometric series gives x ≈ ₹3111, which is nearest to ₹3000.", "tip": "", "status": "note", "note": "The exact value is about ₹3111; the printed solution rounds this to ₹3000, the nearest option.", "void": false}, {"id": "MTH-0795", "ch": 13, "page": 124, "ansPage": 124, "srcNo": "Business Maths Q211", "exam": "05.09.2023 S-IV", "q": "A washing machine of cash value ₹15000 is bought under an instalment plan in which ₹2250 is paid at once and the rest in two equal half-yearly instalments. If the interest rate is 8% per annum compounded half-yearly, each instalment is ______.", "o": ["₹6760", "₹6740", "₹6860", "₹6840"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Balance = 15000 − 2250 = ₹12750. The rate per half-year = 4%. 12750 = x/1.04 + x/(1.04)² = x(25/26 + 625/676) = x × 1275/676, so x = 12750 × 676/1275 = ₹6760.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0796", "ch": 13, "page": 124, "ansPage": 124, "srcNo": "Business Maths Q212", "exam": "05.09.2023 S-IV", "q": "A cooking stove is available for ₹520 paid at once and ₹520 per month in four instalments. If the rate of interest is 25% per annum, the cash price of the stove will be ______.", "o": ["₹2600", "₹2580", "₹2500", "₹2540"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the cash price be ₹x, so the balance is x − 520. For equal monthly instalments, each instalment = P(1 + nr/100)/(n + n(n − 1)/2 × r/100) with n = 4 and r = 25/12 % per month. Putting the instalment as ₹520 gives 26x = 65000 and x = ₹2500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0797", "ch": 13, "page": 124, "ansPage": 125, "srcNo": "Business Maths Q213", "exam": "05.09.2023 S-III", "q": "A fan is marked at ₹1940. It is available for ₹420 paid at once and three equal monthly instalments. If the instalment plan carries 16% per annum interest, each instalment will be ______.", "o": ["₹520", "₹540", "₹620", "₹560"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Balance = 1940 − 420 = ₹1520. The monthly rate = 16/12 = 4/3 %. The present value of three equal monthly instalments of x is 1520: x(0.9868 + 0.9738 + 0.9609) ≈ 2.92x = 1520, so x ≈ ₹520.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-063", "first": false, "kind": "exact", "of": "MTH-0781"}}, {"id": "MTH-0798", "ch": 13, "page": 125, "ansPage": 125, "srcNo": "Business Maths Q214", "exam": "05.09.2023 S-III", "q": "A mixer is bought for ₹360 paid at once and three equal instalments of ₹390 each. If the rate of interest is 16% per annum, what is the cash value of the mixer?", "o": ["₹1560", "₹1660", "₹1500", "₹1600"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The monthly rate = 16/12 = 4/3 %. Present value of the instalments = 390[1/(1 + 4/300) + 1/(1 + 4/300)² + 1/(1 + 4/300)³] = 390 × 2.92 = ₹1138.8. Cash value = 1138.8 + 360 = ₹1498.8 ≈ ₹1500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0799", "ch": 13, "page": 125, "ansPage": 125, "srcNo": "Business Maths Q215", "exam": "05.09.2023 S-III", "q": "A dealer sells a microwave oven for ₹5800 cash. A customer buys it for ₹1800 cash down and three annual instalments. If the dealer charges 12% annual interest compounded annually, find the amount of each instalment.", "o": ["₹1650", "₹1660", "₹1665.40", "₹1670"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Balance = 5800 − 1800 = ₹4000. 4000 = x[1/1.12 + 1/(1.12)² + 1/(1.12)³] = x × 2.4018, so x = 4000/2.4018 ≈ ₹1665.40. (As printed: 400 = x[25/28 + 625/784 + 15625/21952].)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0800", "ch": 13, "page": 125, "ansPage": 125, "srcNo": "Business Maths Q216", "exam": "04.09.2023 S-II", "q": "A sewing machine is available for ₹2600 cash, or ₹1000 paid at once and three quarterly instalments of ₹550. What is the rate of interest in the instalment plan?", "o": ["20 1/21 %", "19 1/21 %", "18%", "19%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Balance = 2600 − 1000 = ₹1600. Total paid in instalments = 550 × 3 = ₹1650, so the interest = ₹50. Principal outstanding: first period ₹1600, second ₹1050, third ₹500, total ₹3150 for one period each. Rate per year = 50 × 100 × 4/3150 ... using the printed working, rate = 50 × 100/(3150 × 1/12) × ... = 400/21 = 19 1/21 %.", "tip": "", "status": "note", "note": "The printed working uses a one-month period in the denominator and reaches 400/21 = 19 1/21 %; the printed key is (b).", "void": false}, {"id": "MTH-0801", "ch": 13, "page": 125, "ansPage": 126, "srcNo": "Business Maths Q217", "exam": "04.09.2023 S-I", "q": "A table costs ₹450 cash, or ₹210 paid at once and then ₹125 in two monthly instalments. What is the rate of interest in the instalment plan?", "o": ["33.8%", "33.5%", "34.8%", "34%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Balance after the cash down payment = 450 − 210 = ₹240. For equal monthly instalments of ₹125 over two months, 125 = 240(1 + 2r/100... solving the printed equation gives r = 200/71 % per month = 33.8% per annum.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0802", "ch": 13, "page": 126, "ansPage": 126, "srcNo": "Business Maths Q218", "exam": "04.09.2023 S-I", "q": "A washing machine is priced at ₹12000. The company takes ₹5200 at once and the rest in equal instalments. If the rate of interest is 12% per annum and each monthly instalment is ₹1400, the number of instalments will be ______.", "o": ["4", "5", "6", "3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Balance P = 12000 − 5200 = ₹6800. The monthly rate = 1%. Using the instalment formula, 1400 = 6800(1 + n/100)/(n + n(n − 1)/200). This simplifies to 7n² + 1325n − 6800 = 0, which gives (7n + 1360)(n − 5) = 0, so n = 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0803", "ch": 13, "page": 126, "ansPage": 126, "srcNo": "Business Maths Q219", "exam": "04.09.2023 S-I", "q": "A juicer is available for ₹3500 cash. Under an instalment plan, the customer pays ₹1500 at once and three equal quarterly instalments. The dealer charges 12% per annum interest compounded quarterly. Find each instalment to the nearest rupee.", "o": ["₹707", "₹725", "₹710", "₹750"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Balance = 3500 − 1500 = ₹2000. The quarterly rate = 3%. Each instalment = 2000(1 + 3 × 3/100)/(3 + (3 × 2/2) × 3/100) = 2000 × 1.09/3.09 ≈ ₹705.5, taken as about ₹707 in the printed key.", "tip": "", "status": "note", "note": "The printed working computes about 705.5 but the printed key is (a) ₹707, the nearest listed option.", "void": false}, {"id": "MTH-0804", "ch": 13, "page": 126, "ansPage": 126, "srcNo": "Business Maths Q220", "exam": "04.09.2023 S-I", "q": "A fan is available for ₹1500 paid at once and five equal monthly instalments of ₹440. If the instalment plan carries 24% per annum interest, the cash price of the fan is ______.", "o": ["₹3500", "₹3580", "₹3600", "₹3680"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The monthly rate = 24/12 = 2%. Using the instalment formula with n = 5: 440 = P(1 + 5 × 2/100)/(5 + (5 × 4/2)(2/100)) = P × 1.1/5.2, so P = 440 × 5.2/1.1 = ₹2080. Cash price = 2080 + 1500 = ₹3580.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0805", "ch": 14, "page": 127, "ansPage": 127, "srcNo": "Coordinate Geometry Q1", "exam": "22.05.2024 S-II", "q": "The points A (0, 6), B (−5, 3) and C (3, 1) are the vertices of a triangle. This triangle is ______.", "o": ["Isosceles", "Equilateral", "Scalene", "Obtuse-angled"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "AB = √((0 + 5)² + (6 − 3)²) = √34. BC = √((3 + 5)² + (1 − 3)²) = √68. AC = √((3 − 0)² + (1 − 6)²) = √34. Two sides are equal (AB = AC), so the triangle is isosceles.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0806", "ch": 14, "page": 127, "ansPage": 127, "srcNo": "Coordinate Geometry Q2", "exam": "22.05.2024 S-II", "q": "If the centroid of the triangle formed by the points (7, y), (x, −6) and (9, 10) is (6, 3), then (x, y) = ______.", "o": ["(2, 5)", "(5, 2)", "(4, 5)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The centroid = ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3). From the x-coordinate: (7 + x + 9)/3 = 6, so x = 2. From the y-coordinate: (y − 6 + 10)/3 = 3, so y + 4 = 9 and y = 5. So (x, y) = (2, 5).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-064", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0807", "ch": 14, "page": 127, "ansPage": 127, "srcNo": "Coordinate Geometry Q3", "exam": "24.05.2024 S-I", "q": "If the end points of a diameter of a circle are (−4, 2) and (8, 6), the coordinates of the centre are ______.", "o": ["(3, 1)", "(1, 3)", "(2, 4)", "(4, 2)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The centre is the midpoint of the diameter: x = (−4 + 8)/2 = 2 and y = (2 + 6)/2 = 4. So the centre is (2, 4).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0808", "ch": 14, "page": 127, "ansPage": 127, "srcNo": "Coordinate Geometry Q4", "exam": "22.05.2024 S-I", "q": "In what ratio does the y-axis divide the line segment joining (−3, −4) and (1, 2)?", "o": ["1 : 3", "2 : 3", "3 : 1", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the ratio be m : n. The x-coordinate of the dividing point on the y-axis is 0: (m × 1 + n × (−3))/(m + n) = 0, so m = 3n and m : n = 3 : 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0809", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q5", "exam": "22.05.2024 S-I", "q": "The midpoint of the line joining A(x₁, y₁) and B(x₂, y₂) is ______.", "o": ["((x₂ − x₁)/2, (y₂ − y₁)/2)", "((x₁ − x₂)/2, (y₁ − y₂)/2)", "((x₁ + y₁)/2, (x₂ + y₂)/2)", "((x₁ + x₂)/2, (y₁ + y₂)/2)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The midpoint of the segment joining (x₁, y₁) and (x₂, y₂) is ((x₁ + x₂)/2, (y₁ + y₂)/2).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0810", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q6", "exam": "22.05.2024 S-I", "q": "If the point P divides the line segment AB in the ratio k : 1, the coordinates of P are ______, where A(x₁, y₁) and B(x₂, y₂).", "o": ["((kx₂ − kx₁)/1, (ky₂ − ky₁)/2)", "((kx₂ + kx₁)/(k + 1), (ky₂ + ky₁)/(k + 1))", "((kx₂ + x₁)/k, (ky₂ + y₁)/2)", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "By the section formula, P = ((kx₂ + x₁)/(k + 1), (ky₂ + y₁)/(k + 1)). None of options (a), (b) or (c) matches this, so the answer is (d).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0811", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q7", "exam": "22.05.2024 S-I", "q": "The distance between the points (a, b) and (−a, −b) is ______.", "o": ["√(a² + b²)", "2√(a² + b²)", "√(2(a² + b²))", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "d = √((−a − a)² + (−b − b)²) = √(4a² + 4b²) = 2√(a² + b²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0812", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q8", "exam": "22.05.2024 S-I", "q": "The point with coordinates (x, 0) lies on which axis?", "o": ["X-axis", "Y-axis", "Both X and Y axes", "The origin"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Every point on the x-axis has its y-coordinate equal to zero, so (x, 0) lies on the x-axis.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0813", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q9", "exam": "22.05.2024 S-I", "q": "If two points (x₁, y₁) and (x₂, y₂) lie in a plane, the distance between them is ______.", "o": ["(x₂ − x₁)²(y₂ − y₁)²", "√((x₂ − x₁)² + (y₂ − y₁)²)", "(x₁ − y₁)² + (x₂ − y₂)²", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The distance formula gives d = √((x₂ − x₁)² + (y₂ − y₁)²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0814", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q10", "exam": "22.05.2024 S-I", "q": "The distance between the points (x, −1) and (3, 2) is 5 units. Then the value of x is ______.", "o": ["1", "−1", "7", "−1 and 7 both"], "key": {"printed": [1], "verified": [3], "official": null}, "e": "5 = √((3 − x)² + (2 + 1)²), so 25 = (3 − x)² + 9 and (3 − x)² = 16. The printed solution takes 3 − x = 4 and gets x = −1.", "tip": "", "status": "disputed", "note": "(3 − x)² = 16 also gives 3 − x = −4, so x = 7 as well. The correct answer is both −1 and 7 (option d). Printed key (b) is retained; verified answer (d).", "void": false}, {"id": "MTH-0815", "ch": 14, "page": 128, "ansPage": 128, "srcNo": "Coordinate Geometry Q11", "exam": "22.05.2024 S-I", "q": "The distance between the points (5 cos θ, 0) and (0, 5 sin θ) is ______.", "o": ["5", "10", "15", "25"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "d = √((0 − 5cos θ)² + (5 sin θ − 0)²) = √(25cos²θ + 25 sin²θ) = √25 = 5.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-065", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0816", "ch": 14, "page": 129, "ansPage": 129, "srcNo": "Coordinate Geometry Q12", "exam": "22.05.2024 S-II", "q": "The length of the line segment joining the points A(1, 1) and B(2, 3) in a plane is ______.", "o": ["√6", "√5", "2√2", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "d = √((2 − 1)² + (3 − 1)²) = √(1 + 4) = √5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0817", "ch": 14, "page": 129, "ansPage": 129, "srcNo": "Coordinate Geometry Q13", "exam": "23.05.2024 S-II", "q": "The line segment joining C(−1, 2) and A(2, 5) is divided by B internally in the ratio 3 : 4. The coordinates of B are ______.", "o": ["(2/7, 23/7)", "(5, 2)", "(−5, −2)", "(−2, 5)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The book substitutes C as the dividing point: let the point (x, y) divide A(2, 5) and B(x, y) ... following the printed working, with m : n = 3 : 4, −1 = (3x + 4 × 2)/7 gives x = −5, and 2 = (3y + 4 × 5)/7 gives y = −2. So B = (−5, −2).", "tip": "", "status": "note", "note": "The printed solution treats C as the point that divides AB in the ratio 3 : 4 and finds B. The stem wording is not clear in the source; the printed key (c) is retained.", "void": false}, {"id": "MTH-0818", "ch": 14, "page": 129, "ansPage": 129, "srcNo": "Coordinate Geometry Q14", "exam": "22.05.2024 S-II", "q": "If the points (k, 2k), (3k, k) and (3, 1) are collinear, then k = ______.", "o": ["1/2", "1/3", "−1/3", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For collinear points the area of the triangle is zero: (1/2)[k(k − 1) + 3k(1 − 2k) + 3(2k − k)] = 0, which gives −5k² + 5k = 0, so 5k(1 − k) = 0 and k = 0 or k = 1. Neither 0 nor 1 is among options (a) to (c), so the answer is (d).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0819", "ch": 14, "page": 129, "ansPage": 129, "srcNo": "Coordinate Geometry Q15", "exam": "22.05.2024 S-II", "q": "If the points A(2, 3), B(4, k) and C(6, −3) are collinear, then the value of k is ______.", "o": ["0", "1", "2", "5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The area of the triangle must be zero: (1/2)[2(k + 3) + 4(−3 − 3) + 6(3 − k)] = (1/2)[2k + 6 − 24 + 18 − 6k] = (1/2)(−4k) = 0, so k = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0820", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q16", "exam": "22.05.2024 S-II", "q": "The distance of the point P(−3, 6) from the x-axis is ______.", "o": ["−3", "3", "6", "3√5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The distance of a point (x, y) from the x-axis is |y|. For P(−3, 6), the distance is |6| = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0821", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q17", "exam": "22.05.2024 S-II", "q": "The point (3, 4) and the point (x, 1) are equidistant from the origin. Then the value of x is ______.", "o": ["±3", "±2√6", "±√5", "±√6"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The distance of (3, 4) from the origin = √(9 + 16) = 5. The distance of (x, 1) from the origin = √(x² + 1). Equal distances give x² + 1 = 25, so x² = 24 and x = ±2√6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0822", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q18", "exam": "23.05.2024 S-II", "q": "A line that cuts two or more coplanar lines at different points is called ______.", "o": ["A transversal", "A parallel line", "Both a transversal and a parallel line", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A line that intersects two or more coplanar lines at different points is called a transversal.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0823", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q19", "exam": "09.06.2024 S-I", "q": "The value of y for which the distance between P(2, −3) and Q(10, y) is 10 units is ______.", "o": ["(2, 3)", "(3, −6)", "(−9, 3)", "(9, −3)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "PQ = √((10 − 2)² + (y + 3)²) = 10, so 100 = 64 + (y + 3)², giving (y + 3)² = 36 and y + 3 = ±6. So y = 3 or y = −9. The option listing these values is (c) (−9, 3).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0824", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q20", "exam": "09.06.2024 S-I", "q": "Which of the following is the condition for three consecutive points A, B, C on a line to be collinear?", "o": ["AB + BC = AC", "AB − BC = AC", "AC + CB = AB", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If A, B and C are collinear with B between A and C, then the sum of the two shorter distances equals the longest: AB + BC = AC.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0825", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q21", "exam": "09.06.2024 S-I", "q": "The graphs of two equations intersect if the pair has ______.", "o": ["No solution", "Two solutions", "One solution", "Many solutions"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If two lines intersect at a single point, the coordinates of that point are the unique common solution, so the pair has one solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0826", "ch": 14, "page": 130, "ansPage": 130, "srcNo": "Coordinate Geometry Q22", "exam": "09.06.2024 S-I", "q": "Find the ratio in which the point (−8, 3) divides the line segment joining (2, −2) and (−12, 1) internally.", "o": ["2 : 5", "3 : 7", "4 : 7", "5 : 2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the ratio be m : n. The x-coordinate: −8 = (m(−12) + n(2))/(m + n), so −8m − 8n = −12m + 2n, giving 4m = 10n and m : n = 5 : 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0827", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q23", "exam": "09.06.2024 S-I", "q": "The point R = (a, b) lies on the line joining P = (0, 0) and Q = (0, 2). Which of the following is true?", "o": ["a = 0", "a = 2", "b = 0", "b = 2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "P and Q both lie on the y-axis, so the line is x = 0. R(a, b) lies on it, so a = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0828", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q24", "exam": "09.06.2024 S-I", "q": "The point (−4, 3) lies in the ______ quadrant.", "o": ["First", "Second", "Third", "Fourth"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A point with x < 0 and y > 0 lies in the second quadrant.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0829", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q25", "exam": "09.06.2024 S-I", "q": "The x-axis is represented by which equation?", "o": ["X = 0", "Y = 0", "X + Y = 0", "X = Y"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Every point on the x-axis has y-coordinate 0, so the x-axis is represented by y = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0830", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q26", "exam": "23.05.2024 S-II", "q": "The ordinate of the point (4, −5) in the Cartesian plane is ______.", "o": ["4", "−5", "5", "−4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The ordinate is the y-coordinate, which is −5.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-066", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0831", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q27", "exam": "23.05.2024 S-II", "q": "The point (2√3, −2√3) lies in the ______ quadrant.", "o": ["First", "Second", "Third", "Fourth"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The x-coordinate 2√3 is positive and the y-coordinate −2√3 is negative, so the point lies in the fourth quadrant.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0832", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q28", "exam": "23.05.2024 S-II", "q": "The point on the x-axis that is equidistant from (6, 3) and (3, 6) is ______.", "o": ["(0, 1)", "(1, 0)", "(0, 0)", "(0, 2)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the point be P(x, 0). Equal distances: (x − 6)² + 9 = (x − 3)² + 36, so x² − 12x + 45 = x² − 6x + 45, which gives −6x = 0 and x = 0. The point is (0, 0).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0833", "ch": 14, "page": 131, "ansPage": 131, "srcNo": "Coordinate Geometry Q29", "exam": "23.05.2024 S-II", "q": "The distance between the points (a cos θ, 0) and (0, a sin θ) is ______.", "o": ["a", "a cos θ", "a sin θ", "1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "d = √((0 − a cos θ)² + (a sin θ − 0)²) = √(a²cos²θ + a²sin²θ) = √(a²) = a.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0834", "ch": 14, "page": 132, "ansPage": 132, "srcNo": "Coordinate Geometry Q30", "exam": "23.05.2024 S-II", "q": "The midpoint of the line segment joining P(−2, 8) and Q(−6, −4) is ______.", "o": ["(−6, −4)", "(−4, 2)", "(2, 6)", "(−4, −6)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2) = ((−2 − 6)/2, (8 − 4)/2) = (−4, 2).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-067", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0835", "ch": 14, "page": 132, "ansPage": 132, "srcNo": "Coordinate Geometry Q31", "exam": "23.05.2024 S-II", "q": "P(−1, 1) is the midpoint of the line segment AB, where A(−3, b) and B(1, b + 4). Then b = ______.", "o": ["1", "2", "−1", "0"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The midpoint = ((−3 + 1)/2, (b + b + 4)/2) = (−1, b + 2). The x-coordinate is −1, which matches. For the y-coordinate, b + 2 = 1, so b = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0836", "ch": 14, "page": 132, "ansPage": 132, "srcNo": "Coordinate Geometry Q32", "exam": "23.05.2024 S-II", "q": "The line segment joining (−3, −4) and (1, −2) is divided by the y-axis in the ratio ______.", "o": ["2 : 3", "3 : 1", "1 : 3", "3 : 2"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the point on the y-axis divide the segment in the ratio k : 1. Its x-coordinate is 0: (k × 1 + 1 × (−3))/(k + 1) = 0, so k = 3. The ratio is 3 : 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0837", "ch": 14, "page": 132, "ansPage": 132, "srcNo": "Coordinate Geometry Q33", "exam": "23.05.2024 S-II", "q": "A line passing through (k, −4) cuts the x-axis and the y-axis at (1, 0) and (0, 2) respectively. The value of k is ______.", "o": ["1/2", "3", "−4", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The three points (k, −4), (1, 0) and (0, 2) lie on the same line, so the area of the triangle is zero: (1/2)[k(0 − 2) + 1(2 + 4) + 0] = 0, so −2k + 6 = 0 and k = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0838", "ch": 14, "page": 132, "ansPage": 133, "srcNo": "Coordinate Geometry Q34", "exam": "23.05.2024 S-II", "q": "The area of the triangle whose vertices are (3, 4), (−4, 3) and (8, 6) is ______.", "o": ["9/2 square units", "9 square units", "7/2 square units", "4 square units"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Area = (1/2)|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)| = (1/2)|3(3 − 6) + (−4)(6 − 4) + 8(4 − 3)| = (1/2)|−9 − 8 + 8| = 9/2 square units.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0839", "ch": 14, "page": 133, "ansPage": 133, "srcNo": "Coordinate Geometry Q35", "exam": "23.05.2024 S-II", "q": "If the points (3, 3), (h, 0) and (0, k) are collinear, then 1/h + 1/k = ______.", "o": ["2/3", "3/2", "1/3", "4/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Collinear points have zero area: (1/2)[3(0 − k) + h(k − 3) + 0] = 0, so −3k + hk − 3h = 0, i.e. 3k + 3h = hk. Dividing by hk: 3/h + 3/k = 1, so 1/h + 1/k = 1/3.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-068", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0840", "ch": 14, "page": 133, "ansPage": 133, "srcNo": "Coordinate Geometry Q36", "exam": "24.05.2024 S-I", "q": "The equation of the x-axis is ______.", "o": ["x = 0", "y = 0", "xy = 0", "x − y = 0"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The x-axis is the horizontal line on which every point has y-coordinate 0, so its equation is y = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0841", "ch": 14, "page": 133, "ansPage": 133, "srcNo": "Coordinate Geometry Q37", "exam": "24.05.2024 S-I", "q": "The ordinate of a point (5, −4) in the Cartesian plane is ______.", "o": ["3", "−4", "5", "−5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The ordinate is the y-coordinate of a point, which is −4 here. (The abscissa is the x-coordinate.)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0842", "ch": 14, "page": 133, "ansPage": 133, "srcNo": "Coordinate Geometry Q38", "exam": "23.05.2024 S-I", "q": "The distance of a point from the x-axis is called its ______.", "o": ["Ordinate", "Abscissa", "Axis", "Graph"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The distance of a point from the x-axis is its ordinate (y-coordinate). The x-coordinate is called the abscissa.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-069", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0843", "ch": 14, "page": 133, "ansPage": 133, "srcNo": "Coordinate Geometry Q39", "exam": "23.05.2024 S-I", "q": "The distance of the point (x, y) from the origin is ______.", "o": ["√(x² − y²)", "√(x² + y²)", "x² − y²", "x²y²"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The distance from (0, 0) to (x, y) is √((x − 0)² + (y − 0)²) = √(x² + y²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0844", "ch": 14, "page": 133, "ansPage": 134, "srcNo": "Coordinate Geometry Q40", "exam": "23.05.2024 S-I", "q": "The point on the y-axis equidistant from A(6, 5) and B(−4, 3) is ______.", "o": ["(9, 0)", "(0, 9)", "(0, 0)", "(9, 9)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let P(0, y). AP = BP gives 36 + (y − 5)² = 16 + (y − 3)². So 36 + y² − 10y + 25 = 16 + y² − 6y + 9, which simplifies to 61 − 10y = 25 − 6y, so 4y = 36 and y = 9. The point is (0, 9).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0845", "ch": 14, "page": 134, "ansPage": 134, "srcNo": "Coordinate Geometry Q41", "exam": "23.05.2024 S-I", "q": "The distance of the point (2, 3) from the origin is ______.", "o": ["√10", "√12", "√13", "√11"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "d = √(2² + 3²) = √(4 + 9) = √13.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-070", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0846", "ch": 14, "page": 134, "ansPage": 134, "srcNo": "Coordinate Geometry Q42", "exam": "23.05.2024 S-I", "q": "The coordinates of A and B are (1, 2) and (2, 3) respectively. If P lies on the line segment AB such that AP/PB = 4/3, the coordinates of P are ______.", "o": ["(11/7, 18/7)", "(11, 18)", "(7, 7)", "(4, 3)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Using the section formula with m : n = 4 : 3: x = (4 × 2 + 3 × 1)/7 = 11/7 and y = (4 × 3 + 3 × 2)/7 = 18/7. So P = (11/7, 18/7).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0847", "ch": 14, "page": 134, "ansPage": 134, "srcNo": "Coordinate Geometry Q43", "exam": "23.05.2024 S-I", "q": "If (x, y) is the midpoint of the line segment joining (3, 4) and (k, 7), and 2x + 2y + 1 = 0, the value of k is ______.", "o": ["15", "14", "−15", "13"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x = (3 + k)/2 and y = (4 + 7)/2 = 11/2. Substituting in 2x + 2y + 1 = 0: (3 + k) + 11 + 1 = 0, so k + 15 = 0 and k = −15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0848", "ch": 14, "page": 134, "ansPage": 134, "srcNo": "Coordinate Geometry Q44", "exam": "23.05.2024 S-I", "q": "In which situation is the area of a triangle zero?", "o": ["When its three vertices are near the origin", "When the three vertices are collinear", "When the three vertices are equidistant from each other", "All of the above are true"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The area of a triangle is zero when its three vertices lie on one straight line (collinear), because they do not enclose any region.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0849", "ch": 14, "page": 134, "ansPage": 134, "srcNo": "Coordinate Geometry Q45", "exam": "23.05.2024 S-I", "q": "P is a point on the line segment AB such that AP = 2BP. If A = (2, −3) and B = (2, 3), the y-coordinate of P is ______.", "o": ["−2", "−1", "2", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "AP = 2BP means P divides AB in the ratio 2 : 1. P = ((2 × 2 + 1 × 2)/3, (2 × 3 + 1 × (−3))/3) = (2, 1). So the y-coordinate is 1.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-071", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0850", "ch": 14, "page": 134, "ansPage": 134, "srcNo": "Coordinate Geometry Q46", "exam": "23.05.2024 S-I", "q": "What is the distance between the graphs of y = −1 and y = 3?", "o": ["2", "4", "3", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The lines y = −1 and y = 3 are parallel to the x-axis. The distance between them is the difference of the y-values: 3 − (−1) = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0851", "ch": 14, "page": 135, "ansPage": 135, "srcNo": "Coordinate Geometry Q47", "exam": "24.05.2024 S-I", "q": "The midpoint of the line segment joining (22, 20) and (0, 16) is ______.", "o": ["(18, 11)", "(11, 18)", "(−11, −18)", "(−18, −11)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Midpoint = ((22 + 0)/2, (20 + 16)/2) = (11, 18).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0852", "ch": 14, "page": 135, "ansPage": 135, "srcNo": "Coordinate Geometry Q48", "exam": "24.05.2024 S-I", "q": "What is the area (in square units) of the triangle formed by A(0, 1), B(0, 5) and C(3, 4)?", "o": ["16", "8", "6", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Area = (1/2)|0(5 − 4) + 0(4 − 1) + 3(1 − 5)| = (1/2)|−12| = 6 square units. (Area is never negative.)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0853", "ch": 14, "page": 135, "ansPage": 135, "srcNo": "Coordinate Geometry Q49", "exam": "24.05.2024 S-I", "q": "The points (x₁, y₁), (x₂, y₂) and (x₃, y₃) will be collinear if ______.", "o": ["x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) = 0", "x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) ≠ 0", "y₁(x₂ − x₃) + y₂(x₃ − x₁) + y₃(x₁ − x₂) = 0", "y₁(x₂ − x₃) + y₂(x₃ − x₁) + y₃(x₁ − x₂) ≠ 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Three points are collinear if the area of the triangle formed by them is zero, i.e. x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) = 0.", "tip": "", "status": "note", "note": "Option (c) is an equivalent expression of the same condition in the other form; the printed key is (a).", "void": false}, {"id": "MTH-0854", "ch": 14, "page": 135, "ansPage": 135, "srcNo": "Coordinate Geometry Q50", "exam": "24.05.2024 S-I", "q": "Which of the following is true for the line segment AB joining the points A(3, 4) and B(−3, 4)?", "o": ["AB ⊥ x-axis", "AB ⊥ y-axis", "AB ∥ y-axis", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Both points have y-coordinate 4, so AB is a horizontal line parallel to the x-axis. A line parallel to the x-axis is perpendicular to the y-axis, so AB ⊥ y-axis.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0855", "ch": 14, "page": 135, "ansPage": 135, "srcNo": "Coordinate Geometry Q51", "exam": "24.05.2024 S-I", "q": "The points (3, 4) and (−3, 2) both lie ______.", "o": ["On the x-axis", "On the y-axis", "On one side of the x-axis", "On both sides of the x-axis"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Both points have positive y-coordinates (4 and 2), so both lie above the x-axis, that is on one side of the x-axis.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0856", "ch": 14, "page": 135, "ansPage": 135, "srcNo": "Coordinate Geometry Q52", "exam": "24.05.2024 S-I", "q": "The distance between the points P(2, 3) and Q(4, 2) is ______.", "o": ["√2", "√3", "2", "√5"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "d = √((4 − 2)² + (2 − 3)²) = √(4 + 1) = √5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0857", "ch": 14, "page": 135, "ansPage": 136, "srcNo": "Coordinate Geometry Q53", "exam": "24.05.2024 S-I", "q": "The coordinates of the point that divides the line segment joining (1, 1) and (2, 3) in the ratio 2 : 3 are ______.", "o": ["(7/5, 9/5)", "(7, 9)", "(7/3, 3)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "By the section formula with m : n = 2 : 3: x = (2 × 2 + 3 × 1)/5 = 7/5 and y = (2 × 3 + 3 × 1)/5 = 9/5. The point is (7/5, 9/5).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0858", "ch": 14, "page": 136, "ansPage": 136, "srcNo": "Coordinate Geometry Q54", "exam": "24.05.2024 S-I", "q": "Which point lies on the line y = x?", "o": ["(a, −a)", "(0, a)", "(a, a)", "(a, 0)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Any point (x, x) lies on the line y = x, so the coordinates must be equal. The point is (a, a).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0859", "ch": 14, "page": 136, "ansPage": 136, "srcNo": "Coordinate Geometry Q55", "exam": "05.09.2023 S-IV", "q": "The number of solutions of the pair of equations x = 5 and x = −4 is ______.", "o": ["Two (2)", "One (1)", "Infinite", "None / no solution possible"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The lines x = 5 and x = −4 are both parallel to the y-axis, so they never meet. There is no common solution.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0860", "ch": 14, "page": 136, "ansPage": 136, "srcNo": "Coordinate Geometry Q56", "exam": "05.09.2023 S-III", "q": "The graph of the equation 2x + 3y = 5 is ______.", "o": ["A curve", "A straight line", "A circle", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The graph of a linear equation in two variables is a straight line. For 2x + 3y = 5, the points (0, 5/3) and (5/2, 0) lie on it.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0861", "ch": 14, "page": 136, "ansPage": 136, "srcNo": "Coordinate Geometry Q57", "exam": "04.09.2023 S-II", "q": "The point at which the line 2x + 3y − 6 = 0 cuts the y-axis is ______.", "o": ["(0, 2)", "(2, 0)", "(0, 3)", "(3, 0)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "On the y-axis x = 0, so 3y − 6 = 0 and y = 2. The point is (0, 2).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0862", "ch": 14, "page": 136, "ansPage": 136, "srcNo": "Coordinate Geometry Q58", "exam": "18.09.2023 S-V", "q": "If the points (3, 3), (h, 0) and (0, k) are collinear, then 1/h + 1/k = ?", "o": ["2/3", "3/2", "1/3", "4/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The area of the triangle is zero: (1/2)[3(0 − k) + h(k − 3) + 0(3 − 0)] = 0, so −3k + hk − 3h = 0 and 3h + 3k = hk. Dividing by hk: 3/k + 3/h = 1, so 1/h + 1/k = 1/3.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-068", "first": false, "kind": "exact", "of": "MTH-0839"}}, {"id": "MTH-0863", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q59", "exam": "18.09.2023 S-V", "q": "The equation of the y-axis is ______.", "o": ["x = 0", "y = 0", "xy = 0", "x − y = 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Every point on the y-axis has x-coordinate 0, so the equation of the y-axis is x = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0864", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q60", "exam": "18.09.2023 S-V", "q": "If the point (0, 5) lies in a plane, on which axis does the point lie?", "o": ["x-axis", "y-axis", "Origin", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The x-coordinate is 0, so the point lies on the y-axis.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0865", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q61", "exam": "18.09.2023 S-V", "q": "Which of the following is the coordinates of the origin?", "o": ["(1, 1)", "(0, 0)", "(−1, 1)", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The origin is the point where the two axes meet, with coordinates (0, 0).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-072", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0866", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q62", "exam": "18.09.2023 S-V", "q": "The distance of a point (x, y) from the origin is ______.", "o": ["√(x² − y²)", "√(x² + y²)", "x² − y²", "x²y²"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Distance from (0, 0) to (x, y) = √(x² + y²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0867", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q63", "exam": "18.09.2023 S-V", "q": "The distance of the point P(−3, 6) from the origin is ______.", "o": ["−3", "3", "6", "3√5"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "d = √((−3 − 0)² + (6 − 0)²) = √(9 + 36) = √45 = 3√5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0868", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q64", "exam": "18.09.2023 S-V", "q": "If two points (x₁, y₁) and (x₂, y₂) lie in a plane, the distance between them is ______.", "o": ["(x₂ − x₁)² + (y₂ − y₁)²", "√((x₂ − x₁)² + (y₂ − y₁)²)", "(x₁ − y₁)² + (x₂ − y₂)²", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The distance formula is d = √((x₂ − x₁)² + (y₂ − y₁)²).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-073", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0869", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q65", "exam": "18.09.2023 S-V", "q": "The distance between the points (5 cos θ, 0) and (0, 5 sin θ) is ______.", "o": ["5", "10", "15", "25"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "d = √((0 − 5cos θ)² + (5 sin θ − 0)²) = √(25cos²θ + 25sin²θ) = √25 = 5.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-065", "first": false, "kind": "exact", "of": "MTH-0815"}}, {"id": "MTH-0870", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q66", "exam": "05.09.2023 S-IV", "q": "The ordinate of the point (4, −5) in the Cartesian plane is ______.", "o": ["4", "−5", "5", "−4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The y-coordinate of a point is its ordinate. For (4, −5), the ordinate is −5.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-066", "first": false, "kind": "exact", "of": "MTH-0830"}}, {"id": "MTH-0871", "ch": 14, "page": 137, "ansPage": 137, "srcNo": "Coordinate Geometry Q67", "exam": "05.09.2023 S-IV", "q": "In which quadrant does the point (4, 5) lie?", "o": ["First", "Second", "Third", "Fourth"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Both coordinates are positive, so the point lies in the first quadrant.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0872", "ch": 14, "page": 138, "ansPage": 138, "srcNo": "Coordinate Geometry Q68", "exam": "05.09.2023 S-IV", "q": "If two points (x₁, y₁) and (x₂, y₂) lie in a plane, the distance between them is ______.", "o": ["(x₂ − x₁)² + (y₂ − y₁)²", "√((x₂ − x₁)² + (y₂ − y₁)²)", "(x₁ − y₁)² + (x₂ − y₂)²", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The distance between two points is √((x₂ − x₁)² + (y₂ − y₁)²).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-073", "first": false, "kind": "exact", "of": "MTH-0868"}}, {"id": "MTH-0873", "ch": 14, "page": 138, "ansPage": 138, "srcNo": "Coordinate Geometry Q69", "exam": "05.09.2023 S-IV", "q": "If the centroid of the triangle formed by the points (7, y), (x, −6) and (9, 10) is (6, 3), then (x, y) = ?", "o": ["(2, 5)", "(5, 2)", "(4, 5)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The centroid = ((7 + x + 9)/3, (y − 6 + 10)/3) = (6, 3). So 16 + x = 18, giving x = 2, and y + 4 = 9, giving y = 5.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-064", "first": false, "kind": "exact", "of": "MTH-0806"}}, {"id": "MTH-0874", "ch": 14, "page": 138, "ansPage": 138, "srcNo": "Coordinate Geometry Q70", "exam": "05.09.2023 S-IV", "q": "The midpoint of the line segment joining P(−2, 8) and Q(−6, −4) is ______.", "o": ["(−6, −4)", "(−4, 2)", "(2, 6)", "(−4, 6)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Midpoint = ((−2 − 6)/2, (8 − 4)/2) = (−4, 2).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-067", "first": false, "kind": "exact", "of": "MTH-0834"}}, {"id": "MTH-0875", "ch": 14, "page": 138, "ansPage": 138, "srcNo": "Coordinate Geometry Q71", "exam": "05.09.2023 S-IV", "q": "P(−1, 1) is the midpoint of the line segment joining A(−3, b) and B(1, b + 4). The value of b is ______.", "o": ["1", "2", "−1", "0"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The midpoint = ((−3 + 1)/2, (b + b + 4)/2) = (−1, b + 2). Setting b + 2 = 1 gives b = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0876", "ch": 14, "page": 138, "ansPage": 138, "srcNo": "Coordinate Geometry Q72", "exam": "05.09.2023 S-IV", "q": "The area of the triangle formed by (x₁, y₁), (x₂, y₂) and (x₃, y₃) is ______.", "o": ["(1/2)[x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)]", "x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)", "x₁(y₂ − y₃) + x₂(x₁ − y₃) + y₃(y₂ − y₁)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The area of a triangle with vertices (x₁, y₁), (x₂, y₂), (x₃, y₃) is (1/2)|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0877", "ch": 14, "page": 138, "ansPage": 138, "srcNo": "Coordinate Geometry Q73", "exam": "04.09.2023 S-IV", "q": "If the points A(2, 3), B(4, k) and C(6, −3) are collinear, the value of k is ______.", "o": ["0", "1", "2", "5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For collinear points the area is zero: 2(k + 3) + 4(−3 − 3) + 6(3 − k) = 0, so 2k + 6 − 24 + 18 − 6k = 0, giving −4k = 0 and k = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0878", "ch": 14, "page": 138, "ansPage": 139, "srcNo": "Coordinate Geometry Q74", "exam": "04.09.2023 S-IV", "q": "P is a point on the line segment AB such that AP = 2BP. If A = (2, −3) and B = (2, 3), the y-coordinate of P is ______.", "o": ["−2", "−1", "2", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "AP : PB = 2 : 1, so P = ((2 × 2 + 1 × 2)/3, (2 × 3 + 1 × (−3))/3) = (2, 1). The y-coordinate of P is 1.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-071", "first": false, "kind": "exact", "of": "MTH-0849"}}, {"id": "MTH-0879", "ch": 14, "page": 139, "ansPage": 139, "srcNo": "Coordinate Geometry Q75", "exam": "05.09.2023 S-III", "q": "The x-axis can be represented by which equation?", "o": ["X = 0", "Y = 0", "X + Y = 0", "X = Y"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "All points on the x-axis have y = 0, so the x-axis is represented by y = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0880", "ch": 14, "page": 139, "ansPage": 139, "srcNo": "Coordinate Geometry Q76", "exam": "05.09.2023 S-III", "q": "What is the ordinate of the point (5, −4) in the Cartesian plane?", "o": ["3", "−4", "5", "−5"], "key": {"printed": [1], "verified": [1], "official": 2}, "e": "The abscissa (x-coordinate) of a point is its distance from the y-axis and the ordinate (y-coordinate) is its distance from the x-axis. So the ordinate of (5, −4) is −4.", "tip": "", "status": "disputed", "note": "The book notes that the Commission treated option (c) as the answer to this question. The correct answer is (b) −4; the printed key (b) is retained and the Commission's key is recorded.", "void": false}, {"id": "MTH-0881", "ch": 14, "page": 139, "ansPage": 139, "srcNo": "Coordinate Geometry Q77", "exam": "05.09.2023 S-III", "q": "Which of the following is the coordinates of the origin?", "o": ["(1, 1)", "(0, 0)", "(−1, 1)", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The coordinates of the origin are (0, 0).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-072", "first": false, "kind": "exact", "of": "MTH-0865"}}, {"id": "MTH-0882", "ch": 14, "page": 139, "ansPage": 139, "srcNo": "Coordinate Geometry Q78", "exam": "05.09.2023 S-III", "q": "What is the point on the x-axis that is equidistant from (6, 3) and (3, 6)?", "o": ["(0, 1)", "(1, 0)", "(0, 0)", "(0, 2)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the point be C(x, 0). Equal distances: (x − 6)² + 9 = (x − 3)² + 36, so −12x + 36 + 9 = −6x + 9 + 36, giving −6x = 0 and x = 0. The point is (0, 0).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0883", "ch": 14, "page": 139, "ansPage": 139, "srcNo": "Coordinate Geometry Q79", "exam": "05.09.2023 S-III", "q": "If the points A(6, 1), B(8, 2), C(9, 4) and D(P, 3) are the vertices of a parallelogram taken in order, then the value of P is ______.", "o": ["5", "6", "8", "7 or 11"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In a parallelogram the diagonals bisect each other, so the midpoint of AC equals the midpoint of BD: ((6 + 9)/2, (1 + 4)/2) = ((8 + P)/2, (2 + 3)/2). The book equates the midpoint of AD with that of BC: (6 + P)/2 = (8 + 9)/2, so 6 + P = 17 and P = 11.", "tip": "", "status": "note", "note": "The printed working gives P = 11 only; the printed key (d) '7 or 11' includes it. Printed key retained.", "void": false}, {"id": "MTH-0884", "ch": 14, "page": 139, "ansPage": 139, "srcNo": "Coordinate Geometry Q80", "exam": "05.09.2023 S-III", "q": "The midpoints of the sides of a triangle are (1, 1), (2, 3) and (4, 1). The coordinates of its vertices are ______.", "o": ["(4, 3), (2, 1), (7, 3)", "(5, 3), (3, −1), (−1, 3)", "(2, 3), (5, 6), (7, 8)", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the vertices be A(x₁, y₁), B(x₂, y₂), C(x₃, y₃) with midpoints D(1, 1), F(2, 3) and E(4, 1). Solving the midpoint equations gives the vertices (5, 3), (3, −1) and (−1, 3).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0885", "ch": 14, "page": 140, "ansPage": 140, "srcNo": "Coordinate Geometry Q81", "exam": "05.09.2023 S-III", "q": "The line segment joining A(5, −2) and B(9, 6) is divided by a point P in the ratio 3 : 1. The coordinates of P are ______.", "o": ["(4, 7)", "(8, 4)", "(11/2, 5)", "(12, 8)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "With m : n = 3 : 1, x = (3 × 9 + 1 × 5)/4 = 8 and y = (3 × 6 + 1 × (−2))/4 = 4. So P = (8, 4).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0886", "ch": 14, "page": 140, "ansPage": 140, "srcNo": "Coordinate Geometry Q82", "exam": "05.09.2023 S-III", "q": "A line passing through (K, −4) cuts the x-axis and y-axis at (1, 0) and (0, 2) respectively. The value of K is ______.", "o": ["1/2", "3", "−4", "None"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The line with intercepts 1 and 2 is x/1 + y/2 = 1, i.e. 2x + y = 2. Since (K, −4) lies on it, 2K − 4 = 2, so K = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0887", "ch": 14, "page": 140, "ansPage": 140, "srcNo": "Coordinate Geometry Q83", "exam": "05.09.2023 S-III", "q": "The points (x₁, y₁), (x₂, y₂) and (x₃, y₃) are collinear if ______.", "o": ["x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) = 0", "x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) ≠ 0", "y₁(x₂ − x₃) + y₂(x₃ − x₁) + y₃(x₁ − x₂) = 0", "y₁(x₂ − x₃) + y₂(x₃ − x₁) + y₃(x₁ − x₂) ≠ 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Collinear points enclose a triangle of zero area, so x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0888", "ch": 14, "page": 140, "ansPage": 140, "srcNo": "Coordinate Geometry Q84", "exam": "05.09.2023 S-III", "q": "If the centroid of the triangle formed by (a, b), (b, c) and (c, a) is the origin, then a³ + b³ + c³ equals ______.", "o": ["0", "abc", "3abc", "a + b + c"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The centroid is ((a + b + c)/3, (b + c + a)/3) = (0, 0), so a + b + c = 0. Then a³ + b³ + c³ − 3abc = (a + b + c)(...) = 0, so a³ + b³ + c³ = 3abc.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0889", "ch": 14, "page": 141, "ansPage": 141, "srcNo": "Coordinate Geometry Q85", "exam": "05.09.2023 S-III", "q": "The distance of the point (x, y) from the origin is ______.", "o": ["√(x² − y²)", "√(x² + y²)", "x² − y²", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Distance from (0, 0) to (x, y) = √((x − 0)² + (y − 0)²) = √(x² + y²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0890", "ch": 14, "page": 141, "ansPage": 141, "srcNo": "Coordinate Geometry Q86", "exam": "04.09.2023 S-II", "q": "The graph of the equation 2x − 3y = 6 cuts the x-axis at the point ______.", "o": ["(0, 2)", "(2, 0)", "(0, 3)", "(3, 0)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "On the x-axis y = 0, so 2x = 6 and x = 3. The point is (3, 0).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0891", "ch": 14, "page": 141, "ansPage": 141, "srcNo": "Coordinate Geometry Q87", "exam": "04.09.2023 S-II", "q": "In which quadran s": "ok", "note": "", "void": false}, {"id": "MTH-0896", "ch": 14, "page": 141, "ansPage": 141, "srcNo": "Coordinate Geometry Q92", "exam": "04.09.2023 S-II", "q": "The distance of the point (2, 3) from the origin is ______.", "o": ["√10", "√12", "√13", "√11"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "d = √(2² + 3²) = √13.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-070", "first": false, "kind": "exact", "of": "MTH-0845"}}, {"id": "MTH-0897", "ch": 14, "page": 142, "ansPage": 142, "srcNo": "Coordinate Geometry Q93", "exam": "04.09.2023 S-II", "q": "In what ratio does the y-axis divide the line segment joining (−3, −4) and (1, 2)?", "o": ["1 : 3", "2 : 3", "3 : 1", "None"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the ratio be m : n. The point on the y-axis has x = 0: (m × 1 + n × (−3))/(m + n) = 0, so m = 3n and m : n = 3 : 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0898", "ch": 14, "page": 142, "ansPage": 142, "srcNo": "Coordinate Geometry Q94", "exam": "04.09.2023 S-II", "q": "The ancient text related to geometry is ______.", "o": ["Sulbasutra", "Samaveda", "Arthashastra", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The Sulbasutras (Śulbasūtra) are Sanskrit texts of the Vedic period that describe geometric constructions used in building altars. They are the ancient texts related to geometry.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0899", "ch": 14, "page": 142, "ansPage": 142, "srcNo": "Coordinate Geometry Q95", "exam": "04.09.2023 S-I", "q": "The coordinates of a point on the y-axis are ______.", "o": ["(0, y)", "(y, y)", "(0, 0)", "(x, y)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A point on the y-axis has x-coordinate 0, so it can be written (0, y).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0900", "ch": 14, "page": 142, "ansPag
