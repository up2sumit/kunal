, "verified": [0], "official": null}, "e": "Comparing with ax² + bx + c: for x² − 3x − 10, the sum of zeros = −b/a = 3 and the product = c/a = −10. This satisfies the condition. For −x² − 3x + 10 the sum is −3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0483", "ch": 8, "page": 67, "ansPage": 67, "srcNo": "Algebra Q130", "exam": "23.05.2024 S-II", "q": "If the roots of the quadratic equation 16x² − 4px + 9 = 0 are real and equal, the value of p is ______.", "o": ["6, −1/6", "36, −36", "6, −6", "3/4, −3/4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For equal roots the discriminant D = b² − 4ac = 0. (−4p)² − 4(16)(9) = 16p² − 576 = 0, so p² = 36 and p = 6 or −6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0484", "ch": 8, "page": 67, "ansPage": 67, "srcNo": "Algebra Q131", "exam": "23.05.2024 S-II", "q": "If the sum of the roots of the equation x² − x = p(2x − 1) is 0, then p = ______.", "o": ["−2", "2", "−1/2", "1/2"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x² − x = 2px − p gives x² − (2p + 1)x + p = 0. The sum of the roots is (2p + 1) = 0, so p = −1/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0485", "ch": 8, "page": 67, "ansPage": 67, "srcNo": "Algebra Q132", "exam": "23.05.2024 S-II", "q": "A zero of the polynomial x² − 2x + 1 is ______.", "o": ["1", "2", "−1", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x² − 2x + 1 = (x − 1)² = 0, so x = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0486", "ch": 8, "page": 67, "ansPage": 67, "srcNo": "Algebra Q133", "exam": "23.05.2024 S-II", "q": "If a is a zero of the polynomial p(x), then the value of p(a) is ______.", "o": ["1", "2", "a", "0"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A zero of a polynomial is a value of x for which the polynomial equals zero. So if a is a zero of p(x), then p(a) = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0487", "ch": 8, "page": 67, "ansPage": 67, "srcNo": "Algebra Q134", "exam": "23.05.2024 S-II", "q": "If α and β are the zeros of the polynomial f(x) = x² − p(x + 1) − c, then the value of (α + 1)(β + 1) is ______.", "o": ["c + 1", "c − 1", "c", "1 − c"], "key": {"printed": [2], "verified": [3], "official": null}, "e": "Write f(x) = x² − px − (p + c), so α + β = p and αβ = −(p + c). Then (α + 1)(β + 1) = αβ + (α + β) + 1 = −(p + c) + p + 1 = 1 − c.", "tip": "", "status": "disputed", "note": "The printed derivation gives (α + 1)(β + 1) = 1 − c, which is option (d), but the printed key is (c). Printed key retained; verified answer (d).", "void": false}, {"id": "MTH-0488", "ch": 8, "page": 67, "ansPage": 67, "srcNo": "Algebra Q135", "exam": "23.05.2024 S-II", "q": "If α and β are the zeros of the polynomial 2x² + 5x − 10, then the value of α × β is ______.", "o": ["−5/2", "5/2", "5", "−5"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The product of the zeros of ax² + bx + c is c/a = −10/2 = −5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0489", "ch": 8, "page": 68, "ansPage": 68, "srcNo": "Algebra Q136", "exam": "23.05.2024 S-II", "q": "The maximum number of zeros of a polynomial of degree n is ______.", "o": ["n + 1", "n − 1", "n²", "n"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A polynomial of degree n has at most n zeros.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0490", "ch": 8, "page": 68, "ansPage": 68, "srcNo": "Algebra Q137", "exam": "23.05.2024 S-II", "q": "Which of the following is NOT a polynomial?", "o": ["2x² − 3x + √5", "√3x² − 2√3x − 5", "x + 1/x", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x + 1/x = x + x⁻¹ has a negative power of the variable. In a polynomial the power of the variable must always be a whole number (0, 1, 2, 3, ...), so it is not a polynomial.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-045", "first": false, "kind": "exact", "of": "MTH-0417"}}, {"id": "MTH-0491", "ch": 8, "page": 68, "ansPage": 68, "srcNo": "Algebra Q138", "exam": "23.05.2024 S-I", "q": "If sin α and cos α are the roots of the quadratic equation ax² + bx + c = 0, then b² = ______.", "o": ["a² + 2ac", "a² − 2ac", "a² − ac", "a² + ac"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Sum of roots sin α + cos α = −b/a and product sin α cos α = c/a. Squaring the sum: 1 + 2 sin α cos α = b²/a², so 1 + 2c/a = b²/a². Multiplying by a²: a² + 2ac = b².", "tip": "", "status": "disputed", "note": "The stem prints the equation as 2x² + bx + c = 0 but the printed solution works with ax² + bx + c = 0, so the equation is read as ax² + bx + c = 0. Repeated elsewhere in the PDF with a different answer.", "void": false, "dup": {"group": "DUP-046", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "MTH-0492", "ch": 8, "page": 68, "ansPage": 68, "srcNo": "Algebra Q139", "exam": "23.05.2024 S-I", "q": "If α and β are the roots of (x/2)² − x = 48, then 1/α + 1/β = ______.", "o": ["−1/48", "1/48", "1/24", "24"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x²/4 − x = 48 gives x² − 4x − 192 = 0. So α + β = 4 and αβ = −192. Then 1/α + 1/β = (α + β)/(αβ) = 4/(−192) = −1/48.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0493", "ch": 8, "page": 68, "ansPage": 68, "srcNo": "Algebra Q140", "exam": "23.05.2024 S-I", "q": "For which values will the equation ax² + bx + c = 0 be a quadratic equation?", "o": ["All values of a", "All values of b", "All values of a except zero", "All values of a, b, c"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "ax² + bx + c = 0 is a quadratic equation when a ≠ 0; b and c can have any value.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0494", "ch": 8, "page": 68, "ansPage": 68, "srcNo": "Algebra Q141", "exam": "23.05.2024 S-I", "q": "What is the sum of the zeros of the polynomial 3x² − 5x − 2?", "o": ["−3/5", "3/5", "5/3", "−5/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For ax² + bx + c the sum of the zeros is −b/a. Here a = 3, b = −5, so the sum is −(−5)/3 = 5/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0495", "ch": 8, "page": 68, "ansPage": 69, "srcNo": "Algebra Q142", "exam": "23.05.2024 S-I", "q": "If the polynomial x³ + 4x² − Px + 8 is exactly divisible by (x − 2), the value of P is ______.", "o": ["16", "15", "0", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Since (x − 2) is a factor, x = 2 is a zero: 8 + 16 − 2P + 8 = 0, so 32 − 2P = 0 and P = 16.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-047", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0496", "ch": 8, "page": 69, "ansPage": 69, "srcNo": "Algebra Q143", "exam": "23.05.2024 S-I", "q": "If α, β and γ are the zeros of the cubic polynomial x³ − 7x² + 5x + 9, what is the value of α + β + γ?", "o": ["−5", "7", "−7", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For the cubic ax³ + bx² + cx + d, the sum of the zeros is −b/a. Here a = 1, b = −7, so α + β + γ = −(−7)/1 = 7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0497", "ch": 8, "page": 69, "ansPage": 69, "srcNo": "Algebra Q144", "exam": "24.05.2024 S-I", "q": "For the equation px² − qx + r = 0, which condition makes the sum and the product of the roots equal?", "o": ["q + r = 0", "q − r = 0", "p + r = 0", "p + q + r = 0"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The sum of the roots is q/p and the product is r/p. For them to be equal, q/p = r/p, so q − r = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0498", "ch": 8, "page": 69, "ansPage": 69, "srcNo": "Algebra Q145", "exam": "24.05.2024 S-I", "q": "The discriminant of (x − 1)(x + 2) will be ______.", "o": ["2", "6", "9", "19"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "(x − 1)(x + 2) = x² + x − 2. The discriminant D = b² − 4ac = 1² − 4(1)(−2) = 9.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0499", "ch": 8, "page": 69, "ansPage": 69, "srcNo": "Algebra Q146", "exam": "24.05.2024 S-I", "q": "If the roots of ax² + bx + c = 0 are reciprocals of each other, then ______.", "o": ["a = b", "b = ac", "a = c", "ac = 1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the roots be α and 1/α. Their product is α × (1/α) = 1 = c/a, so c = a.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-048", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0500", "ch": 8, "page": 69, "ansPage": 69, "srcNo": "Algebra Q147", "exam": "24.05.2024 S-I", "q": "The zeros of the polynomial 4x² − 3 will be ______.", "o": ["√3/5, −√3/5", "1/2, −1/5", "√3/2, −√3/2", "5/3, −5/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "4x² − 3 = 0 gives x² = 3/4, so x = ±√3/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0501", "ch": 8, "page": 69, "ansPage": 69, "srcNo": "Algebra Q148", "exam": "24.05.2024 S-I", "q": "A quadratic polynomial whose sum of zeros is 0 and one zero is 4 will be ______.", "o": ["x² − 16", "x² + 3", "x² − 3", "x² + 4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If one zero is α = 4 and the sum of zeros is 0, then the other zero is β = −4. The product of the zeros is 4 × (−4) = −16. The polynomial is x² − (α + β)x + αβ = x² − 0 + (−16) = x² − 16.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-049", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0502", "ch": 8, "page": 70, "ansPage": 70, "srcNo": "Algebra Q149", "exam": "24.05.2024 S-I", "q": "The sum of the zeros of the polynomial x² − 4x + 1 is ______.", "o": ["4", "1", "5", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For ax² + bx + c the sum of the zeros is −b/a = −(−4)/1 = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-050", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0503", "ch": 8, "page": 70, "ansPage": 70, "srcNo": "Algebra Q150", "exam": "24.05.2024 S-I", "q": "If one zero of the polynomial f(x) = 5x² + 13x + k is the reciprocal of the other, the value of k is ______.", "o": ["6", "0", "1", "5"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the zeros be α and 1/α. Their product is α × 1/α = 1 = k/5, so k = 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0504", "ch": 8, "page": 70, "ansPage": 70, "srcNo": "Algebra Q151", "exam": "24.05.2024 S-I", "q": "If x + 2 is a factor of the polynomial x² + ax + 2b and a + b = 4, the values of a and b are ______.", "o": ["a = 3, b = 1", "a = 1, b = 3", "a = 5, b = −1", "a = −1, b = 5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Since x + 2 is a factor, x = −2 gives 4 − 2a + 2b = 0, so b − a = −2, i.e. a − b = 2. With a + b = 4, solving gives a = 3 and b = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0505", "ch": 8, "page": 70, "ansPage": 70, "srcNo": "Algebra Q152", "exam": "24.05.2024 S-I", "q": "A polynomial whose sum of zeros is 0 and one zero is 3 will be ______.", "o": ["x² − 3", "x² + 3", "x² + 9", "x² − 9"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "One zero α = 3 and the sum of the zeros is 0, so the other zero is β = −3. The product is −9. The polynomial is x² − (α + β)x + αβ = x² − 9.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-051", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0506", "ch": 8, "page": 70, "ansPage": 70, "srcNo": "Algebra Q153", "exam": "24.05.2024 S-I", "q": "Which of the following are the zeros of the polynomial p(x) = x² − 5x + 6?", "o": ["6, −5", "1, −6", "2, 3", "3, −2"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The sum of the zeros is 5 and the product is 6, so the zeros are 2 and 3. (Check: x² − 5x + 6 = (x − 2)(x − 3).)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0507", "ch": 8, "page": 70, "ansPage": 70, "srcNo": "Algebra Q154", "exam": "22.05.2024 S-II", "q": "If the roots of the quadratic equation 2x² + 6x + p = 0 are real and unequal, the value of p is ______.", "o": ["p < 9/2", "p ≤ 9/2", "p > 9/2", "p ≥ 9/2"], "key": {"printed": [1], "verified": [0], "official": null}, "e": "For real roots the discriminant D = b² − 4ac must be positive. Here a = 2, b = 6, c = p, so D = 36 − 8p. The printed solution takes D ≥ 0, which gives 36 ≥ 8p and p ≤ 9/2.", "tip": "", "status": "disputed", "note": "For real and unequal (distinct) roots the condition is D > 0, that is p < 9/2 (option a). The printed key (b) p ≤ 9/2 corresponds to real roots that may be equal. Printed key retained; verified answer (a).", "void": false, "dup": {"group": "DUP-052", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0508", "ch": 8, "page": 71, "ansPage": 71, "srcNo": "Algebra Q155", "exam": "22.05.2024 S-II", "q": "If α and β are the zeros of x² + 9x + 20 = 0, then α² + β² = ______.", "o": ["21", "40", "41", "39"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "α + β = −9 and αβ = 20. So α² + β² = (α + β)² − 2αβ = 81 − 40 = 41.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0509", "ch": 8, "page": 71, "ansPage": 71, "srcNo": "Algebra Q156", "exam": "22.05.2024 S-II", "q": "If α and β are the roots of ax² + bx + c = 0, then ax² + bx + c = ______.", "o": ["a(x − α)(x − β)", "a(x + α)(x + β)", "b(x − α)(x − β)", "c(x − α)(x − β)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A quadratic can be written in terms of its roots as ax² + bx + c = a(x − α)(x − β).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0510", "ch": 8, "page": 71, "ansPage": 71, "srcNo": "Algebra Q157", "exam": "22.05.2024 S-II", "q": "The value of √(6 + √(6 + √(6 + ...))) is ______.", "o": ["4", "3", "−2", "3.5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let x = √(6 + √(6 + ...)), so x = √(6 + x). Squaring, x² = 6 + x, so x² − x − 6 = 0, which gives x = 3 or x = −2. Since a square root is non-negative, x = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0511", "ch": 8, "page": 71, "ansPage": 71, "srcNo": "Algebra Q158", "exam": "22.05.2024 S-I", "q": "If α and β are the zeros of the quadratic equation g(x) = cx² + ax + b, where c ≠ 0, then α + β = ______.", "o": ["b/a", "c/a", "a/c", "−a/c"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The sum of the zeros is −(coefficient of x)/(coefficient of x²) = −a/c.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0512", "ch": 8, "page": 71, "ansPage": 71, "srcNo": "Algebra Q159", "exam": "18.09.2023 S-V", "q": "The sum of the zeros of the polynomial x² − 4x + 1 is ______.", "o": ["4", "1", "5", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Comparing with ax² + bx + c: a = 1, b = −4, c = 1. The sum of the zeros is −b/a = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-050", "first": false, "kind": "exact", "of": "MTH-0502"}}, {"id": "MTH-0513", "ch": 8, "page": 72, "ansPage": 72, "srcNo": "Algebra Q160", "exam": "18.09.2023 S-V", "q": "The product of the zeros of the polynomial 4x² − 4x + 1 is ______.", "o": ["4", "−1", "−4", "1/4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Comparing with ax² + bx + c: a = 4, b = −4, c = 1. The product of the zeros is c/a = 1/4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0514", "ch": 8, "page": 72, "ansPage": 72, "srcNo": "Algebra Q161", "exam": "18.09.2023 S-V", "q": "If α and β are the zeros of the polynomial f(x) = ax² + bx + c, then 1/α² + 1/β² = ______.", "o": ["(b² + 2ac)/a²", "(b² − 2ac)/c²", "(b² − 2ac)/a²", "(b² + 2ac)/a²"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "α + β = −b/a and αβ = c/a. 1/α² + 1/β² = (α² + β²)/(αβ)² = [(α + β)² − 2αβ]/(αβ)² = (b²/a² − 2c/a)/(c²/a²) = (b² − 2ac)/c².", "tip": "", "status": "note", "note": "Options (a) and (d) are printed identically in the source.", "void": false}, {"id": "MTH-0515", "ch": 8, "page": 72, "ansPage": 72, "srcNo": "Algebra Q162", "exam": "18.09.2023 S-V", "q": "The zeros of the polynomial p(x) = x² − 5x + 6 are ______.", "o": ["6, −5", "1, −6", "2, 3", "3, −2"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x² − 5x + 6 = x² − 3x − 2x + 6 = (x − 3)(x − 2). So the zeros are 2 and 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0516", "ch": 8, "page": 72, "ansPage": 72, "srcNo": "Algebra Q163", "exam": "18.09.2023 S-V", "q": "If α and β are the zeros of the polynomial P(x) = x² − x + 4, what is the value of α + β?", "o": ["−1", "0", "1", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Comparing with ax² + bx + c: a = 1, b = −1, c = 4. α + β = −b/a = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0517", "ch": 8, "page": 72, "ansPage": 72, "srcNo": "Algebra Q164", "exam": "18.09.2023 S-V", "q": "For the roots of 2x² − 5x + 3 = 0, the ratio of the sum to the product of the roots is ______.", "o": ["2 : 3", "3 : 2", "5 : 3", "3 : 5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Here a = 2, b = −5, c = 3. The sum of the roots is −b/a = 5/2 and the product is c/a = 3/2. The ratio is (5/2) : (3/2) = 5 : 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0518", "ch": 8, "page": 72, "ansPage": 72, "srcNo": "Algebra Q165", "exam": "18.09.2023 S-V", "q": "If the polynomial x³ + 4x² − px + 8 is exactly divisible by (x − 2), the value of p is ______.", "o": ["16", "15", "0", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Since (x − 2) is a factor, x = 2 is a zero: 8 + 16 − 2p + 8 = 0, so 2p = 32 and p = 16.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-047", "first": false, "kind": "exact", "of": "MTH-0495"}}, {"id": "MTH-0519", "ch": 8, "page": 72, "ansPage": 73, "srcNo": "Algebra Q166", "exam": "18.09.2023 S-V", "q": "If α and β are the roots of the polynomial f(x) = x² − p(x + 1) − c and (α + 1)(β + 1) = 0, the value of c is ______.", "o": ["2", "0", "1", "−1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "f(x) = x² − px − (p + c), so α + β = p and αβ = −(p + c). Then (α + 1)(β + 1) = αβ + (α + β) + 1 = −p − c + p + 1 = 1 − c = 0, so c = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0520", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q167", "exam": "18.09.2023 S-V", "q": "A quadratic polynomial whose sum of zeros is 0 and one zero is 4 will be ______.", "o": ["x² − 16", "x² + 3", "x² − 3", "x² + 4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "α + β = 0 and α = 4 give β = −4. The polynomial is x² − (α + β)x + αβ = x² − 0 + 4(−4) = x² − 16.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-049", "first": false, "kind": "exact", "of": "MTH-0501"}}, {"id": "MTH-0521", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q168", "exam": "18.09.2023 S-V", "q": "If α, β, γ are the zeros of the cubic polynomial x³ − 7x² + 5x + 9, then α + β + γ = ______.", "o": ["−5", "7", "−7", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Comparing with ax³ + bx² + cx + d: a = 1, b = −7, c = 5, d = 9. α + β + γ = −b/a = 7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0522", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q169", "exam": "05.09.2023 S-IV", "q": "A polynomial whose sum of zeros is 0 and one zero is 3 will be ______.", "o": ["x² − 3", "x² + 3", "x² + 9", "x² − 9"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If α = 3 and α + β = 0, then β = −3. The polynomial is x² − (α + β)x + αβ = x² − 0 + (3)(−3) = x² − 9.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-051", "first": false, "kind": "exact", "of": "MTH-0505"}}, {"id": "MTH-0523", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q170", "exam": "05.09.2023 S-IV", "q": "If α and β are the roots of the polynomial cx² − bx + a = 0, then α² + β² = ______.", "o": ["(b² − 2ac)/c²", "(a² − 2ac)/c", "a²b²/c", "0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "α + β = b/c and αβ = a/c. α² + β² = (α + β)² − 2αβ = b²/c² − 2a/c = (b² − 2ac)/c².", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0524", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q171", "exam": "05.09.2023 S-IV", "q": "If α and β are the roots of f(x) = x² − p(x + 1) − c, the value of (α + 1)(β + 1) is ______.", "o": ["c + 1", "c − 1", "c − 1", "1 − c"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "f(x) = x² − px − (p + c), so α + β = p and αβ = −(p + c). Then (α + 1)(β + 1) = αβ + (α + β) + 1 = −p − c + p + 1 = 1 − c.", "tip": "", "status": "note", "note": "Options (b) and (c) are printed identically in the source scan.", "void": false}, {"id": "MTH-0525", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q172", "exam": "05.09.2023 S-IV", "q": "A zero of the polynomial x² − 2x + 1 will be ______.", "o": ["1", "−1", "2", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x² − 2x + 1 = (x − 1)² = 0, so the zero is x = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0526", "ch": 8, "page": 73, "ansPage": 73, "srcNo": "Algebra Q173", "exam": "05.09.2023 S-IV", "q": "If the roots of the quadratic equation 2x² − 6x + P = 0 are real and unequal, the value of p is ______.", "o": ["P < 9/2", "p ≤ 9/2", "p > 9/2", "p ≥ 9/2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Here a = 2, b = −6, c = P. For real and unequal roots, b² − 4ac > 0, so 36 − 8P > 0 and P < 9/2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-052", "first": false, "kind": "exact", "of": "MTH-0507"}}, {"id": "MTH-0527", "ch": 8, "page": 74, "ansPage": 74, "srcNo": "Algebra Q174", "exam": "05.09.2023 S-IV", "q": "If sin α and cos α are the roots of the quadratic equation ax² + bx + c = 0, then b² = ______.", "o": ["a² + ac", "a² − 2ac", "a² − ac", "a² + 2ac"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The sum of the roots sin α + cos α = −b/a and the product sin α cos α = c/a. Squaring the sum: 1 + 2 sin α cos α = b²/a², so 1 + 2c/a = b²/a², giving b² = a² + 2ac.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different answer.", "void": false, "dup": {"group": "DUP-046", "first": false, "kind": "exact", "of": "MTH-0491", "keyConflict": true}}, {"id": "MTH-0528", "ch": 8, "page": 74, "ansPage": 74, "srcNo": "Algebra Q175", "exam": "05.09.2023 S-III", "q": "If x + 2 is a factor of the polynomial x² + ax + 2b and a + b = 4, then the values of a and b are ______.", "o": ["a = 3, b = 1", "a = 1, b = 3", "a = 5, b = −1", "a = −1, b = 5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x = −2 is a zero: 4 − 2a + 2b = 0, so a − b = 2. With a + b = 4, adding gives 2a = 6, so a = 3 and b = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0529", "ch": 8, "page": 74, "ansPage": 74, "srcNo": "Algebra Q176", "exam": "05.09.2023 S-III", "q": "If α and β are the zeros of the polynomial 2x² + 5x − 3, then (α + β) = ______.", "o": ["1", "−5/3", "5/3", "−5/2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Comparing with ax² + bx + c: a = 2, b = 5, c = −3. α + β = −b/a = −5/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0530", "ch": 8, "page": 74, "ansPage": 74, "srcNo": "Algebra Q177", "exam": "05.09.2023 S-III", "q": "If one zero of the polynomial (K − 1)(x² + kx + 1) is −3, then K = ______.", "o": ["2/3", "4/3", "−2/3", "−4/3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Put x = −3: (K − 1)(9 − 3K + 1) = 0 in the form used by the book, i.e. (K − 1)(9) + K(−3) + 1 = 0, so 9K − 9 − 3K + 1 = 0, giving 6K = 8 and K = 4/3.", "tip": "", "status": "note", "note": "The printed solution expands the polynomial as (K − 1)x² + Kx + 1 (as in Q120), not as (K − 1)(x² + Kx + 1). With the stem as literally printed, the zero condition would give a different value. The printed key (b) 4/3 follows the book's working.", "void": false}, {"id": "MTH-0531", "ch": 8, "page": 74, "ansPage": 74, "srcNo": "Algebra Q178", "exam": "05.09.2023 S-III", "q": "If the sum of the zeros of the polynomial f(x) = 2x³ − 3kx² + 4x − 5 is 6, then k = ______.", "o": ["4", "−4", "2", "−2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Sum of the zeros = −b/a = −(−3k)/2 = 3k/2. Setting 3k/2 = 6 gives k = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0532", "ch": 8, "page": 75, "ansPage": 75, "srcNo": "Algebra Q179", "exam": "05.09.2023 S-III", "q": "If 3 is a zero of the polynomial x² + px + 12, then p = ______.", "o": ["7", "12", "−7", "3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "p(3) = 0: 9 + 3p + 12 = 0, so 3p = −21 and p = −7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0533", "ch": 8, "page": 75, "ansPage": 75, "srcNo": "Algebra Q180", "exam": "05.09.2023 S-III", "q": "If the sum and the product of the roots of the quadratic equation Kx² + 6x + 4K = 0 are equal, the value of K is ______.", "o": ["−3/2", "3/2", "2/3", "−2/3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Here a = K, b = 6, c = 4K. The sum of the roots is −6/K and the product is 4K/K = 4. Setting them equal: −6/K = 4, so K = −3/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0534", "ch": 8, "page": 75, "ansPage": 75, "srcNo": "Algebra Q181", "exam": "05.09.2023 S-III", "q": "Find the nature of the roots of the quadratic equation x² − x + 7 = 0.", "o": ["Real and equal", "Real and unequal", "No real roots", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Here a = 1, b = −1, c = 7. The discriminant D = b² − 4ac = 1 − 28 = −27 < 0, so there are no real roots.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0535", "ch": 8, "page": 75, "ansPage": 75, "srcNo": "Algebra Q182", "exam": "05.09.2023 S-III", "q": "For what value of P will the roots of the quadratic equation Px² − 2√5x + 4 = 0 be real and equal?", "o": ["3/4", "5/4", "6/7", "7/10"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For real and equal roots the discriminant is zero: (−2√5)² − 4 × P × 4 = 0, so 20 − 16P = 0 and P = 5/4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0536", "ch": 8, "page": 75, "ansPage": 75, "srcNo": "Algebra Q183", "exam": "04.09.2023 S-II", "q": "If α and β are the roots of the polynomial f(x) = x² + x + 1, then 1/α + 1/β = ______.", "o": ["0", "1", "−1", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "α + β = −1 and αβ = 1. So 1/α + 1/β = (α + β)/αβ = −1/1 = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0537", "ch": 8, "page": 75, "ansPage": 75, "srcNo": "Algebra Q184", "exam": "04.09.2023 S-II", "q": "Which of the following are the zeros of the polynomial 9x² − 4?", "o": ["2/3, −2/3", "4, −4", "9, −9", "3/2, −3/2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "9x² − 4 = 0 gives x² = 4/9, so x = ±2/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0538", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q185", "exam": "04.09.2023 S-II", "q": "The sum of the zeros of the polynomial 3x² − 5x − 2 is ______.", "o": ["−3/5", "3/5", "5/3", "−5/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Comparing with ax² + bx + c: a = 3, b = −5, c = −2. The sum of the zeros is −b/a = 5/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0539", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q186", "exam": "04.09.2023 S-II", "q": "The solution set of the equation x² = 4 is ______.", "o": ["{3, −3}", "{4, −4}", "{2, −2}", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x² = 4 gives x = ±√4 = ±2, so the solution set is {2, −2}.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0540", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q187", "exam": "04.09.2023 S-II", "q": "If two zeros of (x³ + x² − 7x − 7) are √7 and −√7, the third zero is ______.", "o": ["1", "−3", "3", "−1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "x³ + x² − 7x − 7 = x²(x + 1) − 7(x + 1) = (x + 1)(x² − 7). The zeros are −1, √7 and −√7, so the third zero is −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0541", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q188", "exam": "04.09.2023 S-II", "q": "If one root of f(x) = (k² + 4)x² + 13x + 4k is the reciprocal of the other, then k = ______.", "o": ["−2", "−1", "2", "1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If the roots are reciprocals their product is 1: 4k/(k² + 4) = 1, so k² − 4k + 4 = 0, i.e. (k − 2)² = 0 and k = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0542", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q189", "exam": "04.09.2023 S-II", "q": "What should be added to x² − 5x + 4 so that the resulting polynomial has 3 as a zero?", "o": ["4", "5", "2", "1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "At x = 3 the polynomial x² − 5x + 4 equals 9 − 15 + 4 = −2. Adding +2 makes the value 0, so 3 becomes a zero.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0543", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q190", "exam": "04.09.2023 S-II", "q": "If the zeros of the polynomial x² + ax − b are reciprocals of each other, then the value of b is ______.", "o": ["−1", "1", "a", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the zeros be α and 1/α. Their product is 1 = −b/1, so b = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0544", "ch": 8, "page": 76, "ansPage": 76, "srcNo": "Algebra Q191", "exam": "04.09.2023 S-I", "q": "The zeros of the polynomial 4x² − 3 will be ______.", "o": ["√3/5, −√3/5", "1/2, −1/2", "√3/2, −√3/2", "5/3, −5/3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "4x² − 3 = 0 gives x² = 3/4, so x = ±√3/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0545", "ch": 8, "page": 77, "ansPage": 77, "srcNo": "Algebra Q192", "exam": "04.09.2023 S-I", "q": "What should be subtracted from x² − 16x + 30 so that the resulting polynomial has 15 as a root?", "o": ["16", "15", "14", "30"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let a be subtracted. Then x² − 16x + 30 − a = 0 has root 15: 225 − 240 + 30 − a = 0, so a = 15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0546", "ch": 8, "page": 77, "ansPage": 77, "srcNo": "Algebra Q193", "exam": "04.09.2023 S-I", "q": "If 2 is a zero of the polynomial x² − 5x + k, then k = ______.", "o": ["5", "6", "0", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Put x = 2: 4 − 10 + k = 0, so k = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0547", "ch": 8, "page": 77, "ansPage": 77, "srcNo": "Algebra Q194", "exam": "04.09.2023 S-I", "q": "For what value of c will the roots of the quadratic equation ax² + bx + c = 0 be equal?", "o": ["b²/a", "b²/4a", "a²/b", "a²/4b"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Equal roots need the discriminant b² − 4ac = 0, so 4ac = b² and c = b²/(4a).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0548", "ch": 8, "page": 77, "ansPage": 77, "srcNo": "Algebra Q195", "exam": "04.09.2023 S-I", "q": "If the roots of ax² + bx + c = 0 are reciprocals of each other, then ______.", "o": ["a = b", "b = ac", "a = c", "ac = 1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If the roots are reciprocals of each other, their product is 1: c/a = 1, so c = a.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-048", "first": false, "kind": "exact", "of": "MTH-0499"}}, {"id": "MTH-0549", "ch": 8, "page": 77, "ansPage": 77, "srcNo": "Algebra Q196", "exam": "14.09.2020 S-I", "q": "The number of real roots of the quadratic equation x² − 5|x| − 6 = 0 is ______.", "o": ["4", "3", "2", "1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Case I, x > 0: x² − 5x − 6 = 0, so (x − 6)(x + 1) = 0 and x = 6 (x = −1 rejected because x > 0). Case II, x < 0: x² + 5x − 6 = 0, so (x + 6)(x − 1) = 0 and x = −6 (x = 1 rejected). So there are 2 real roots, 6 and −6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0550", "ch": 8, "page": 77, "ansPage": 77, "srcNo": "Algebra Q197", "exam": "14.09.2020 S-I", "q": "For what value of n are the roots of the quadratic equation x² + x(14 − n) − 14n + 1 = 0 equal? (n is an integer.)", "o": ["−13, −15", "−11, −16", "−13, −16", "−11, −12"], "key": {"printed": [], "verified": [], "official": null}, "e": "For equal roots D = (14 − n)² − 4(1)(1 − 14n) = n² + 28n + 192 = 0, so (n + 12)(n + 16) = 0 and n = −12 or −16.", "tip": "", "status": "void", "note": "The printed key is '(*)'. The book notes that the Commission treated the question as wrong because the correct values n = −12 and n = −16 do not appear together in any option. This question has no valid option and is excluded from scored tests.", "void": true}, {"id": "MTH-0551", "ch": 8, "page": 78, "ansPage": 78, "srcNo": "Algebra Q198", "exam": "14.09.2020 S-I", "q": "If α and β are the roots of the quadratic equation x² − 5x + 1 = 0, then the value of α⁴ + β⁴ is ______.", "o": ["527", "−527", "0", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "α + β = 5 and αβ = 1. α⁴ + β⁴ = (α² + β²)² − 2(αβ)² = ((α + β)² − 2αβ)² − 2(αβ)² = (25 − 2)² − 2 = 529 − 2 = 527.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0552", "ch": 8, "page": 78, "ansPage": 78, "srcNo": "Algebra Q199", "exam": "11.09.2020 S-I", "q": "The set of values of 'a' for which x² − ax + sin⁻¹(sin 4) is positive for all real values of x is ______.", "o": ["R", "(−4, 4)", "(−∞, −4)", "φ (the null set)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "sin⁻¹(sin 4) = π − 4, since the principal value lies in [−π/2, π/2]. For the quadratic x² − ax + (π − 4) to be positive for every real x, its discriminant must be negative: a² − 4(π − 4) < 0, i.e. a² < 4(π − 4). But π − 4 is negative, so this is impossible for any real a. The set is empty.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0553", "ch": 8, "page": 78, "ansPage": 78, "srcNo": "Algebra Q200", "exam": "11.09.2020 S-I", "q": "The function f(x) = (p + 3)x + 5p, p ∈ R, is periodic for ______.", "o": ["No value of p", "Exactly one value of p", "Exactly two values of p", "Infinitely many values of p"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A function is periodic with period p if f(x + p) = f(x). Here f(x + p) − f(x) = (p + 3)p = p² + 3p must be 0, which gives p(p + 3) = 0, so p = 0 or p = −3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0554", "ch": 8, "page": 78, "ansPage": 78, "srcNo": "Algebra Q201", "exam": "11.09.2020 S-I", "q": "The equation (2^2019 − 2020)x² − 2^2020 x + (2^2019 + 2020) = 0 has roots ______.", "o": ["−1 and (2^2019 + 2020)/(2^2019 − 2020)", "1 and (2^2019 + 2020)/(2^2019 − 2020)", "−1 and −(2^2019 + 2020)/(2^2019 − 2020)", "1 and −(2^2019 + 2020)/(2^2019 − 2020)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Split the middle term: (2^2019 − 2020)x² − (2^2019 − 2020)x − (2^2019 + 2020)x + (2^2019 + 2020) = 0. This factors as [(2^2019 − 2020)x − (2^2019 + 2020)](x − 1) = 0. The roots are x = 1 and x = (2^2019 + 2020)/(2^2019 − 2020).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0555", "ch": 8, "page": 78, "ansPage": 79, "srcNo": "Algebra Q202", "exam": "10.09.2020 S-II", "q": "If a + b + c = 0, then the roots of the equation ax² + bx + c = 0 are ______.", "o": ["1 and b/a", "1 and c/a", "1 and −b/a", "1 and −c/a"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "From a + b + c = 0, c = −a − b. Then ax² + bx − a − b = 0, i.e. a(x² − 1) + b(x − 1) = 0, so (x − 1)[a(x + 1) + b] = 0. Hence x = 1 or x = −(a + b)/a = c/a. The roots are 1 and c/a.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0556", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q203", "exam": "", "q": "Which of the following pairs is the pair of zeros of the polynomial x² − 2x − 8?", "o": ["(4, 2)", "(4, −2)", "(−4, −2)", "(−4, 2)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "x² − 2x − 8 = x² − 4x + 2x − 8 = (x − 4)(x + 2) = 0, so the zeros are 4 and −2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0557", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q204", "exam": "", "q": "Which of the following is a quadratic polynomial whose sum of zeros and product of zeros are 0 and √5 respectively?", "o": ["x² − √5", "x² + √5", "x² − x + √5", "x² + x + √5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A quadratic with sum of zeros S and product P is x² − Sx + P. With S = 0 and P = √5, the polynomial is x² + √5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0558", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q205", "exam": "", "q": "If −4 is a zero of the polynomial x² − x − (2 + 2k), then the value of k is ______.", "o": ["3", "9", "6", "−9"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Put x = −4: 16 + 4 − (2 + 2k) = 0, so 20 − 2 − 2k = 0, giving 2k = 18 and k = 9.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0559", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q206", "exam": "10.09.2020 S-II", "q": "The equation x − 2019/(x − 2020) = 2020 − 2019/(x − 2020) has ______.", "o": ["Only one real root", "Two real roots", "No real root", "Infinitely many real roots"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Adding 2019/(x − 2020) to both sides gives x = 2020. But at x = 2020 the terms 2019/(x − 2020) are undefined (division by zero). So there is no real root of the equation.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0560", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q207", "exam": "TGT 1999", "q": "Solve 2^(x²) : 2^(2x) = 8 : 1 for the values of x.", "o": ["x = 3, −1", "x = 3, 1", "x = 3, 2", "x = 3, 4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "2^(x²)/2^(2x) = 8 gives 2^(x² − 2x) = 2³, so x² − 2x = 3, i.e. x² − 2x − 3 = 0. Factorising, (x − 3)(x + 1) = 0, so x = 3 or x = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0561", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q208", "exam": "", "q": "If x² + 1 − 2x = 0 and x > 0, find the value of x²(x² − 2).", "o": ["0", "√2", "−1", "1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x² − 2x + 1 = (x − 1)² = 0, so x = 1. Then x²(x² − 2) = 1(1 − 2) = −1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0562", "ch": 8, "page": 79, "ansPage": 79, "srcNo": "Algebra Q209", "exam": "", "q": "If the difference of the roots of the equation Ax² − Bx + C = 0 is 4, which of the following is true?", "o": ["B² − 16A² = 4AC + 4B²", "B² − 10A² = 4AC + 6A²", "B² − 8A² = 4AC + 10A²", "B² − 16A² = 4AC + 8B²"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the roots be α and β. (α + β)² = (α − β)² + 4αβ, so (B/A)² = 16 + 4C/A. Multiplying by A²: B² = 16A² + 4AC. Option (b) rearranges to B² = 16A² + 4AC.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0563", "ch": 8, "page": 80, "ansPage": 80, "srcNo": "Algebra Q210", "exam": "", "q": "α and β are the roots of a quadratic equation. If α + β = 8 and α − β = 2√5, then α⁴ and β⁴ are the roots of which of the following equations?", "o": ["x² − 1522x + 14641 = 0", "x² − 1921x + 14641 = 0", "x² − 1764x + 14641 = 0", "x² − 2520x + 14641 = 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Squaring and adding (α + β)² and (α − β)²: 2(α² + β²) = 64 + 20 = 84, so α² + β² = 42. Then 2αβ = 64 − 42 = 22, so αβ = 11. α⁴ + β⁴ = (α² + β²)² − 2(αβ)² = 1764 − 242 = 1522 and α⁴β⁴ = 11⁴ = 14641. The equation is x² − 1522x + 14641 = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0564", "ch": 8, "page": 80, "ansPage": 80, "srcNo": "Algebra Q211", "exam": "", "q": "If a and b are the roots of the equation Px² − Qx + R = 0, what is the value of 1/a² + 1/b² + a/b + b/a?", "o": ["(Q² − 2P)(2R + P)/(PR²)", "(Q² − 2PR)(R + P)/(PR²)", "(Q² − 2R)(2P + R)/(P²R²)", "(Q² − 2PR)(2R + 2P)/(P²R²)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "a + b = Q/P and ab = R/P. 1/a² + 1/b² + a/b + b/a = (a² + b²)/(ab)² + (a² + b²)/(ab) = (a² + b²)[1/(ab)² + 1/(ab)]... Simplifying with a² + b² = (Q² − 2PR)/P² and ab = R/P gives (Q² − 2PR)(R + P)/(PR²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0565", "ch": 8, "page": 80, "ansPage": 80, "srcNo": "Algebra Q212", "exam": "", "q": "If A and B are the roots of the equation Ax² − A²x + AB = 0, what are A and B respectively?", "o": ["1, 0", "1, 1", "0, 2", "0, 1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The sum of the roots is A + B = A²/A = A, so B = 0. The product is AB = AB/A = B, which gives A × B = B, and with B = 0 this is consistent; from A × B = B/1 the book takes A = 1. So A = 1 and B = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0566", "ch": 8, "page": 80, "ansPage": 80, "srcNo": "Algebra Q213", "exam": "", "q": "If α and β are the roots of the quadratic equation x² − x − 1 = 0, what is the value of α⁸ + β⁸?", "o": ["47", "54", "59", "68"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "α + β = 1 and αβ = −1. α² + β² = 1 + 2 = 3. α⁴ + β⁴ = 9 − 2 = 7. α⁸ + β⁸ = 49 − 2 × 1 = 47.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0567", "ch": 8, "page": 80, "ansPage": 81, "srcNo": "Algebra Q214", "exam": "", "q": "If α and β are the roots of x² − 2x + 4 = 0, what is the quadratic equation whose roots are α³/β² and β³/α²?", "o": ["x² − 4x + 8 = 0", "x² − 32x + 4 = 0", "x² − 2x + 4 = 0", "x² − 16x + 4 = 0"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "α + β = 2 and αβ = 4. The product of the new roots is (α³/β²)(β³/α²) = αβ = 4. Their sum is (α⁵ + β⁵)/(αβ)². Here α³ + β³ = 8 − 24 = −16, α² + β² = 4 − 8 = −4, and (α³ + β³)(α² + β²) = α⁵ + β⁵ + α²β²(α + β), so 64 = α⁵ + β⁵ + 32 and α⁵ + β⁵ = 32. The sum is 32/16 = 2. The equation is x² − 2x + 4 = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0568", "ch": 8, "page": 81, "ansPage": 81, "srcNo": "Algebra Q215", "exam": "", "q": "If one root of Ax² + Bx + C = 0 is 2½ times the other, which of the following is true?", "o": ["7B² = 3CA", "7B² = 4CA", "7B² = 36CA", "10B² = 49CA"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the roots be α and (5/2)α. Sum: (7/2)α = −B/A, so α = −2B/(7A). Product: (5/2)α² = C/A. Substituting, (5/2) × 4B²/(49A²) = C/A, which gives 10B² = 49AC.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0569", "ch": 8, "page": 81, "ansPage": 81, "srcNo": "Algebra Q216", "exam": "", "q": "If α and β are the roots of x² − x + 1 = 0, the roots of which equation are α³ and β³?", "o": ["x² + 2x + 1 = 0", "x² − 2x − 1 = 0", "x² + 3x − 1 = 0", "x² − 3x + 1 = 0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "α + β = 1 and αβ = 1. α³ + β³ = (α + β)³ − 3αβ(α + β) = 1 − 3 = −2, and α³β³ = 1. The equation is x² − (sum)x + product = x² + 2x + 1 = 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0570", "ch": 8, "page": 81, "ansPage": 81, "srcNo": "Algebra Q217", "exam": "", "q": "If α and β are the roots of the quadratic equation ax² − bx + c = 0, where a, b, c are constants and a ≠ 0, what is the value of 1/α + 1/β?", "o": ["b/c", "c/a", "c/b", "−b/c"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "α + β = b/a and αβ = c/a. So 1/α + 1/β = (α + β)/αβ = (b/a)/(c/a) = b/c.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0571", "ch": 8, "page": 81, "ansPage": 81, "srcNo": "Algebra Q218", "exam": "", "q": "Find the values of x for 3x² + 5x − 2 = 0.", "o": ["−3 and −2", "−2 and 1/3", "3 and −1/2", "2 and −3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "3x² + 6x − x − 2 = 3x(x + 2) − 1(x + 2) = (x + 2)(3x − 1) = 0. So x = −2 or x = 1/3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0572", "ch": 8, "page": 81, "ansPage": 81, "srcNo": "Algebra Q219", "exam": "22.05.2024 S-I", "q": "If 3 is a zero of the polynomial x² + px + 12, the value of p is ______.", "o": ["7", "12", "−7", "3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "P(3) = 0: 9 + 3p + 12 = 0, so 3p = −21 and p = −7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0573", "ch": 9, "page": 82, "ansPage": 82, "srcNo": "Algebra Q220", "exam": "09.06.2024 S-I", "q": "For 3^(x+y) = 243 and 243^(x−y) = 3, how many solutions are possible?", "o": ["0", "1", "2", "Infinitely many"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "3^(x+y) = 3⁵ gives x + y = 5, and 243^(x−y) = 3 gives 5(x − y) = 1. Adding 5 × (i) and (ii) gives 10x = 26, so x = 13/5, and then y = 12/5. Only one solution exists.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0574", "ch": 9, "page": 82, "ansPage": 82, "srcNo": "Algebra Q221", "exam": "28.01.2020 S-I", "q": "Which term of the arithmetic progression (A.P.) 4, 9, 14, 19, ... is 109?", "o": ["12th", "22nd", "21st", "11th"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "a = 4 and d = 9 − 4 = 5. Tₙ = a + (n − 1)d gives 109 = 4 + (n − 1) × 5, so (n − 1) × 5 = 105, n − 1 = 21 and n = 22.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0575", "ch": 9, "page": 82, "ansPage": 82, "srcNo": "Algebra Q222", "exam": "", "q": "Find the sum of 23 terms of the A.P. 5, 9, 13, 17, ...", "o": ["1172", "1127", "1217", "1712"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "a = 5, d = 4, n = 23. Sₙ = (n/2){2a + (n − 1)d} = (23/2){10 + 22 × 4} = (23/2) × 98 = 23 × 49 = 1127.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0576", "ch": 9, "page": 82, "ansPage": 82, "srcNo": "Algebra Q223", "exam": "KVS TGT Dec 2017", "q": "The geometric mean of the numbers 3, 9, 27, 81, 243 is ______.", "o": ["9", "27", "81", "3√3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The numbers are in G.P. and their number is 5. G.M. = (3¹ · 3² · 3³ · 3⁴ · 3⁵)^(1/5) = (3^15)^(1/5) = 3³ = 27.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0577", "ch": 9, "page": 82, "ansPage": 82, "srcNo": "Algebra Q224", "exam": "DSSSB TGT 04-09-2021 Shift-I (Male)", "q": "If n is any positive integer, then 1 + 3 + 5 + ... + (2n − 1) = ______.", "o": ["n²", "2n − 1", "n − 1", "n"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "1, 3, 5, ..., (2n − 1) form an A.P. with first term 1 and common difference 2. The sum of n terms is (n/2)[2 + (n − 1)2] = n².", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0578", "ch": 9, "page": 82, "ansPage": 82, "srcNo": "Algebra Q225", "exam": "Rajasthan TGT 2011", "q": "If the product of n positive numbers is 1, then the sum of these numbers will never be less than ______.", "o": ["1", "n", "n²", "n/2"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "By the A.M.–G.M. inequality, (x₁ + x₂ + ... + xₙ)/n ≥ (x₁x₂...xₙ)^(1/n). The product is 1, so the right side is 1. Hence x₁ + x₂ + ... + xₙ ≥ n.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0579", "ch": 9, "page": 83, "ansPage": 83, "srcNo": "Algebra Q226", "exam": "", "q": "What is the 8th term of the G.P. 3, 6, 12, 24, ...?", "o": ["184", "284", "384", "484"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "a = 3, r = 2, n = 8. Tₙ = arⁿ⁻¹ = 3 × 2⁷ = 3 × 128 = 384.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0580", "ch": 9, "page": 83, "ansPage": 83, "srcNo": "Algebra Q227", "exam": "", "q": "What result is obtained on simplifying 1/(3×4) + 1/(4×5) + 1/(5×6) + ... + 1/(20×21)?", "o": ["3/7", "2/7", "1/20", "1/7"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Each term 1/(n(n + 1)) = 1/n − 1/(n + 1). The sum telescopes: (1/3 − 1/4) + (1/4 − 1/5) + ... + (1/20 − 1/21) = 1/3 − 1/21 = 6/21 = 2/7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0581", "ch": 9, "page": 83, "ansPage": 83, "srcNo": "Algebra Q228", "exam": "", "q": "Find the sum 6 + 8 + 10 + 12 + 14 + ... + 40.", "o": ["424", "1600", "400", "414"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The A.P. has a = 6, d = 2 and last term 40: 6 + (n − 1)2 = 40, so n = 18. The sum is (n/2)(a + l) = 9 × 46 = 414.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0582", "ch": 9, "page": 83, "ansPage": 83, "srcNo": "Algebra Q229", "exam": "", "q": "Find the sum of all natural numbers between 1 and 200 that are multiples of 5.", "o": ["3900", "4100", "4155", "4235"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The numbers are 5, 10, 15, ..., 195, an A.P. with a = 5 and last term 195, so n = 39. The sum is (n/2)(a + l) = (39/2)(5 + 195) = 39 × 100 = 3900.", "tip": "", "status": "note", "note": "This answer treats 'between 1 and 200' as excluding 200. If 200 were included the sum would be 4100 (option b).", "void": false}, {"id": "MTH-0583", "ch": 9, "page": 83, "ansPage": 83, "srcNo": "Algebra Q230", "exam": "", "q": "What is the sum of all positive three-digit integers divisible by 11?", "o": ["44550", "43550", "42550", "45550"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The three-digit multiples of 11 are 110, 121, ..., 990, an A.P. with a = 110, d = 11 and last term 990. 990 = 110 + (n − 1) × 11 gives n = 81. The sum is (81/2)(110 + 990) = (81/2) × 1100 = 44550.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0584", "ch": 9, "page": 83, "ansPage": 83, "srcNo": "Algebra Q231", "exam": "", "q": "What is the average of all natural numbers from 49 to 125?", "o": ["85", "87", "88", "86"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The numbers 49, 50, ..., 125 form an A.P. with first term 49, last term 125, so n = 77. The average of an A.P. is (first + last)/2 = (49 + 125)/2 = 87.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0585", "ch": 10, "page": 84, "ansPage": 84, "srcNo": "Business Maths Q1", "exam": "22.05.2024 S-I", "q": "The ratio of the capitals invested by two partners 'A' and 'B' is 11 : 12 and the ratio of their profits is 2 : 3. If A invested his capital for 8 months, for how long did B invest his capital?", "o": ["9 months", "10 months", "11 months", "12 months"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let B invest for t months. Profit is proportional to capital × time, so (11 × 8)/(12 × t) = 2/3. Then 88 × 3 = 24t, giving t = 11 months.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-053", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0586", "ch": 10, "page": 84, "ansPage": 84, "srcNo": "Business Maths Q2", "exam": "23.05.2024 S-I", "q": "How many shares of face value ₹25 can be bought for ₹12750 if the brokerage per share is ₹1/2?", "o": ["450", "500", "550", "600"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The cost per share = 25 + 0.50 = ₹25.50. The number of shares = 12750 / 25.50 = 500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0587", "ch": 10, "page": 84, "ansPage": 84, "srcNo": "Business Maths Q3", "exam": "09.06.2024 S-I", "q": "What is the annual percentage income from a 6% stock of ₹120?", "o": ["75%", "6%", "5%", "20%"], "key": {"printed": [1], "verified": [2], "official": null}, "e": "The printed solution computes 120 × 6/100 = 36/5 = 7.2% and says this is 'around 6%', choosing option (b).", "tip": "", "status": "disputed", "note": "The printed working is not a valid yield calculation. A '6% stock at ₹120' pays ₹6 on a ₹100 face value, so the percentage income on the ₹120 invested is 6/120 × 100 = 5% (option c). Printed key (b) retained; verified answer (c).", "void": false}, {"id": "MTH-0588", "ch": 10, "page": 84, "ansPage": 84, "srcNo": "Business Maths Q4", "exam": "23.05.2024 S-II", "q": "What will be the annual income from 175 shares if the quarterly dividend per share is ₹3?", "o": ["₹525", "₹1800", "₹2100", "₹2400"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Quarterly dividend per share = ₹3, so the annual dividend per share = 3 × 4 = ₹12. For 175 shares the annual income is 175 × 12 = ₹2100.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-054", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0589", "ch": 10, "page": 84, "ansPage": 84, "srcNo": "Business Maths Q5", "exam": "23.05.2024 S-II", "q": "Suresh started a business by investing ₹32000. After 5 months, Amit also became a partner by investing ₹22000. At the end of the year, Suresh's share in the total profit of ₹16409 will be ______.", "o": ["₹5284", "₹11712", "₹10182", "₹4697"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Suresh's investment-time = 32000 × 12 = 384000. Amit's = 22000 × 7 = 154000. The ratio is 384 : 154 = 192 : 77. Suresh's share = 192/269 × 16409 = ₹11712.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0590", "ch": 10, "page": 84, "ansPage": 84, "srcNo": "Business Maths Q6", "exam": "24.05.2024 S-I", "q": "A person invested ₹1250 in shares of face value ₹10. When the market price of a share becomes ₹9.50, he sells them. The loss he suffers is ______.", "o": ["₹60", "₹62.50", "₹61.50", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Number of shares = 1250/10 = 125. Selling price = 125 × 9.50 = ₹1187.50. Loss = 1250 − 1187.50 = ₹62.50.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0591", "ch": 10, "page": 84, "ansPage": 85, "srcNo": "Business Maths Q7", "exam": "22.05.2024 S-I", "q": "In which stock is investing more profitable? (A) 10% stock at ₹143. (B) 7% stock at ₹93.", "o": ["'A'", "'B'", "Equal profit in both", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A 10% stock at ₹143 gives a return of 10/143 × 100 ≈ 7%, i.e. ₹14.30 on ₹143 per ₹100 stock, whereas the 7% stock at ₹93 gives 7/93 × 100 ≈ 7.5%. Since the investment cost in B is lower, its rate of return is higher, so investing in B is more profitable.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0592", "ch": 10, "page": 85, "ansPage": 85, "srcNo": "Business Maths Q8", "exam": "22.05.2024 S-I", "q": "A man invests ₹2000 in shares of face value ₹20 each. If he sells them at a market price of ₹22.50 per share, his profit will be ______.", "o": ["₹250", "₹150", "₹350", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Number of shares = 2000/20 = 100. Selling value = 100 × 22.50 = ₹2250. Profit = 2250 − 2000 = ₹250.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0593", "ch": 10, "page": 85, "ansPage": 85, "srcNo": "Business Maths Q9", "exam": "18.09.2023 S-V", "q": "A person buys ₹50 shares of a company with a 10% dividend. If he gets an income of 12.5% on his cost, what is the market price of a share?", "o": ["₹37.50", "₹40", "₹48", "₹52"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Dividend per share = 50 × 10/100 = ₹5. This is 12.5% of the cost, so the market price = 5 × 100/12.5 = ₹40.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0594", "ch": 10, "page": 85, "ansPage": 85, "srcNo": "Business Maths Q10", "exam": "18.09.2023 S-V", "q": "A man invests ₹2000 in shares of face value ₹20. If he sells them at ₹22.50 per share, his profit will be ______.", "o": ["₹250", "₹150", "₹350", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "He buys 2000/20 = 100 shares. Selling price = 100 × 22.50 = ₹2250. Profit = ₹250.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0595", "ch": 10, "page": 85, "ansPage": 85, "srcNo": "Business Maths Q11", "exam": "18.09.2023 S-V", "q": "The ratio of the capitals invested by two partners 'A' and 'B' is 11 : 12 and the ratio of their profits is 2 : 3. If A invested his capital for 8 months, for how long did B invest his capital?", "o": ["9 months", "10 months", "11 months", "12 months"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Profit is in proportion to (capital × time): (11 × 8)/(12 × t) = 2/3, so t = 11 months.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-053", "first": false, "kind": "exact", "of": "MTH-0585"}}, {"id": "MTH-0596", "ch": 10, "page": 85, "ansPage": 85, "srcNo": "Business Maths Q12", "exam": "18.09.2023 S-V", "q": "A started a business by investing ₹45000. After some time B invested ₹54000 and became his partner. If the profit at the end of the year is divided in the ratio 2 : 1, after how many months did B become his partner?", "o": ["4 months", "5 months", "6 months", "7 months"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let B invest for (12 − n) months after joining n months later. Then 45000 × 12 : 54000 × (12 − n) = 2 : 1, so 10/(12 − n) = 2, giving 12 − n = 5 and n = 7 months.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-055", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0597", "ch": 10, "page": 85, "ansPage": 85, "srcNo": "Business Maths Q13", "exam": "05.09.2023 S-IV", "q": "A person buys some shares at the rate of ₹10 per share, and at the end of the year receives an 8% dividend. If the total dividend is ₹300, how many shares did he buy?", "o": ["375", "350", "275", "250"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the number of shares be x. Dividend = x × 10 × 8/100 = 300, so x = 300 × 100/80 = 375.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0598", "ch": 10, "page": 86, "ansPage": 86, "srcNo": "Business Maths Q14", "exam": "05.09.2023 S-IV", "q": "A started a business by investing ₹45000. After some time B invested ₹54000 and became his partner. If the profit at the end of the year is divided in the ratio 2 : 1, after how many months did B become his partner?", "o": ["4 months", "5 months", "6 months", "7 months"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let B be a partner for t months. Profit is in proportion to capital × time: (45000 × 12)/(54000 × t) = 2/1, so 10/t = 2 and t = 5. B was a partner for 5 months, so he joined (12 − 5) = 7 months after A.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-055", "first": false, "kind": "exact", "of": "MTH-0596"}}, {"id": "MTH-0599", "ch": 10, "page": 86, "ansPage": 86, "srcNo": "Business Maths Q15", "exam": "05.09.2023 S-III", "q": "What will be the annual income from 175 shares if the quarterly dividend per share is ₹3?", "o": ["₹525", "₹1800", "₹2100", "₹2400"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Annual dividend per share = 3 × 4 = ₹12. For 175 shares, income = 12 × 175 = ₹2100.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-054", "first": false, "kind": "exact", "of": "MTH-0588"}}, {"id": "MTH-0600", "ch": 10, "page": 86, "ansPage": 86, "srcNo": "Business Maths Q16", "exam": "04.09.2023 S-II", "q": "A person bought shares of ₹25 from a company that pays a 9% dividend. If he gets an income of 10% on his cost, at what price per share did he buy the shares?", "o": ["₹20.50", "₹21.50", "₹22", "₹22.50"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the price paid per share be ₹x. Then x × 10/100 = 25 × 9/100, so 10x = 225 and x = ₹22.50.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0601", "ch": 10, "page": 86, "ansPage": 86, "srcNo": "Business Maths Q17", "exam": "04.09.2023 S-II", "q": "Suresh started a business by investing ₹32000. After 5 months, Amit also became a partner by investing ₹22000. At the end of the year, what will be Suresh's share in the total profit of ₹16409?", "o": ["₹5284", "₹11712", "₹10182", "₹4697"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Suresh : Amit = (32000 × 12) : (22000 × 7) = 192 : 77. Total = 269. Suresh's share = 192/269 × 16409 = ₹11712.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0602", "ch": 10, "page": 86, "ansPage": 86, "srcNo": "Business Maths Q18", "exam": "04.09.2023 S-I", "q": "A person invests ₹1250 in shares of face value ₹10. When the market price of a share falls to ₹9.50, he sells them. The loss he suffers is ______.", "o": ["₹60", "₹62.50", "₹61.50", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Number of shares = 1250/10 = 125. Amount received = 125 × 9.50 = ₹1187.50. Loss = 1250 − 1187.50 = ₹62.50.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0603", "ch": 10, "page": 86, "ansPage": 86, "srcNo": "Business Maths Q19", "exam": "04.09.2023 S-I", "q": "A and B together started a business. A invested ₹36000 for 8 months, while B invested some capital for 6 months. At the end, B received 15/31 of the total profit. How much capital did B invest?", "o": ["₹42000", "₹39000", "₹35000", "₹45000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "B's share is 15/31, so A's share is 16/31 and the ratio of profits A : B = 16 : 15. Let B invest ₹x. Then (36000 × 8)/(x × 6) = 16/15, so x = 36000 × 8 × 15/(6 × 16) = ₹45000.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-056", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0604", "ch": 10, "page": 87, "ansPage": 87, "srcNo": "Business Maths Q20", "exam": "", "q": "A and B started a business, each investing ₹70,000. After 10 months A invests an additional ₹40,000, and after 2 more months B withdraws ₹20,000. After a further 2 months, a third person C joins the business and invests ₹40,000. If at the end of 2 years C gets ₹7,500 as his share of the profit, find A's share of the profit.", "o": ["₹27,000", "₹25,500", "₹42,000", "₹20,625"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Capital × time: A = 70000 × 10 + 110000 × 14 = 2240000. B = 70000 × 12 + 50000 × 12 = 1440000. C = 40000 × 10 = 400000. The ratio A : B : C = 224 : 144 : 40 = 28 : 18 : 5. C's share 5x = 7500, so x = 1500 and A's share = 28 × 1500 = ₹42,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0605", "ch": 10, "page": 87, "ansPage": 87, "srcNo": "Business Maths Q21", "exam": "", "q": "Ramesh started a business by investing ₹40,000. After 6 months Kevin joined the business by investing ₹20,000. If they earned a profit of ₹10,000 by the end of the year, what is Kevin's share?", "o": ["₹3,000", "₹4,000", "₹2,500", "₹2,000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The profit ratio Ramesh : Kevin = (40000 × 12) : (20000 × 6) = 4 : 1. Kevin's share = 1/5 × 10000 = ₹2000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0606", "ch": 10, "page": 87, "ansPage": 87, "srcNo": "Business Maths Q22", "exam": "14.09.2020 S-I", "q": "The cost price of 25 articles is equal to the selling price of 20 articles. Find the gain %.", "o": ["20%", "25%", "30%", "40%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "25 CP = 20 SP, so CP/SP = 20/25. Gain % = (SP − CP)/CP × 100 = (25 − 20)/20 × 100 = 25%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0607", "ch": 11, "page": 87, "ansPage": 87, "srcNo": "Business Maths Q23", "exam": "09.06.2024 S-I", "q": "A person buys shares at the rate of ₹10 per share and receives an 8% dividend at the end of the year. If the total dividend is ₹300, how many shares did he buy?", "o": ["375", "350", "275", "250"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the number of shares be x. The total cost = 10x and the dividend = 10x × 8/100 = 300, so 8x = 3000 and x = 375.", "tip": "", "status": "note", "note": "The options are printed with a rupee sign in the source ('₹375' and so on); they are the numbers of shares.", "void": false}, {"id": "MTH-0608", "ch": 11, "page": 87, "ansPage": 87, "srcNo": "Business Maths Q24", "exam": "09.06.2024 S-I", "q": "The marked price of an article is 20% above its cost price. A discount of 20% is given on the marked price. Does the seller gain or lose in such a sale?", "o": ["Gain", "Loss", "Neither gain nor loss", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the cost price be ₹100. The marked price is ₹120. The selling price = 120 × 80/100 = ₹96. Loss = 100 − 96 = ₹4, so the seller loses.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-057", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0609", "ch": 11, "page": 87, "ansPage": 87, "srcNo": "Business Maths Q25", "exam": "09.06.2024 S-I", "q": "A toy car of marked price ₹400 is sold at two successive discounts of 8% each. If the shopkeeper had declared only a single discount of 16%, what would be the difference in the price paid by the customer?", "o": ["₹2.56", "₹4", "₹3.25", "₹5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "With two successive discounts of 8%: 400 × 23/25 × 23/25 = ₹338.56. With a single discount of 16%: 400 × 21/25 = ₹336. The difference is 338.56 − 336 = ₹2.56.", "tip": "", "status": "note", "note": "The last part of the stem is only partly legible in the source scan; it is read from the printed solution, which compares the two selling prices.", "void": false}, {"id": "MTH-0610", "ch": 11, "page": 88, "ansPage": 88, "srcNo": "Business Maths Q26", "exam": "23.05.2024 S-II", "q": "A trader marks the selling price of an article 10% above its cost price. While selling, he gives some discount so that he suffers a loss of 1%. What percentage discount did he give?", "o": ["10%", "11%", "15%", "9%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the cost price be ₹100. The marked price is ₹110 and the selling price (1% loss) is ₹99. The discount is 110 − 99 = ₹11, so the discount % = 11/110 × 100 = 10%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-058", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0611", "ch": 11, "page": 88, "ansPage": 88, "srcNo": "Business Maths Q27", "exam": "23.05.2024 S-II", "q": "The equivalent single discount for successive discounts of 20%, 20% and 10% will be ______.", "o": ["50%", "42%", "42.4%", "44%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the price be ₹100. After 20%: 80. After another 20%: 64. After 10%: 57.6. The total discount = 100 − 57.6 = 42.4%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-059", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0612", "ch": 11, "page": 88, "ansPage": 88, "srcNo": "Business Maths Q28", "exam": "23.05.2024 S-II", "q": "Ramesh invested part of his money in a 9% stock at ₹96 and the remaining in a 12% stock at ₹120. If the annual dividends from both stocks are equal, the ratio of the money invested in the two stocks will be ______.", "o": ["3 : 4", "3 : 5", "4 : 5", "16 : 15"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Dividend = (investment × rate)/(stock price). So (I₁ × 9)/96 = (I₂ × 12)/120. This gives I₁ × 9 × 120 = I₂ × 12 × 96, so I₁/I₂ = 1152/1080 = 16/15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0613", "ch": 11, "page": 88, "ansPage": 88, "srcNo": "Business Maths Q29", "exam": "23.05.2024 S-I", "q": "The marked price of a machine is ₹6800 and a 10% discount is available on it. The shopkeeper sold the machine for ₹5202 after giving some additional discount. The additional discount percentage was ______.", "o": ["15%", "16%", "18%", "20%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Price after the first discount = 6800 − 10% of 6800 = 6800 − 680 = ₹6120. The additional discount = 6120 − 5202 = ₹918. The percentage = 918/6120 × 100 = 15%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0614", "ch": 11, "page": 88, "ansPage": 88, "srcNo": "Business Maths Q30", "exam": "23.05.2024 S-I", "q": "The marked price of a trader's goods is 30% above the cost price. He gives his customers a 10% discount on the marked price. What is his profit percentage?", "o": ["27%", "25%", "20%", "17%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the cost price be ₹100. The marked price is ₹130. The selling price after a 10% discount = 130 − 13 = ₹117. Profit = 117 − 100 = ₹17, so the profit % = 17%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0615", "ch": 11, "page": 88, "ansPage": 89, "srcNo": "Business Maths Q31", "exam": "23.05.2024 S-I", "q": "A and B together started a business. A invested ₹36000 for 8 months while B invested some capital for 6 months. At the end, B received 15/31 of the total profit. How much capital did B invest?", "o": ["₹42000", "₹39000", "₹35000", "₹45000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "B's share is 15/31, so A's share is 16/31 and the profit ratio A : B = 16 : 15. Profit is proportional to capital × time: (36000 × 8)/(x × 6) = 16/15, so x = 36000 × 8 × 15/(6 × 16) = ₹45000.", "tip": "", "status": "note", "note": "Option (d) is printed as '₹4500' in the source, an evident typo for ₹45000, which is the value the printed solution gives. The same question appears in the Share section with option ₹45000.", "void": false, "dup": {"group": "DUP-056", "first": false, "kind": "exact", "of": "MTH-0603"}}, {"id": "MTH-0616", "ch": 11, "page": 89, "ansPage": 89, "srcNo": "Business Maths Q32", "exam": "24.05.2024 S-I", "q": "Find the annual dividend on 400 shares of face value ₹10 if the quarterly dividend rate per share is 5%.", "o": ["₹800", "₹700", "₹850", "₹900"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Face value per share = ₹10. Quarterly dividend per share = 10 × 5% = ₹0.50. Annual dividend per share = 0.5 × 4 = ₹2. For 400 shares: 2 × 400 = ₹800.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0617", "ch": 11, "page": 89, "ansPage": 89, "srcNo": "Business Maths Q33", "exam": "24.05.2024 S-I", "q": "A discount of 15% on one article is the same as a discount of 20% on another article. What is the ratio of the two articles' prices?", "o": ["3 : 4", "4 : 3", "4 : 5", "5 : 4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the prices be a and b. Then 15% of a = 20% of b, so 15a = 20b, giving 3a = 4b and a : b = 4 : 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0618", "ch": 11, "page": 89, "ansPage": 89, "srcNo": "Business Maths Q34", "exam": "24.05.2024 S-I", "q": "A shopkeeper fixes the price of his sarees 20% above the cost price and also gives the buyer a 10% discount. What is the shopkeeper's total profit percentage?", "o": ["10%", "8%", "12%", "15%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Treat the mark-up as +20% and the discount as −10%. Net change = 20 − 10 + (20 × (−10))/100 = 10 − 2 = 8%. The profit is 8%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-060", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0619", "ch": 11, "page": 89, "ansPage": 89, "srcNo": "Business Maths Q35", "exam": "22.05.2024 S-II", "q": "Two successive discounts of 10% each are given on the price of a TV set. The equivalent single discount is ______.", "o": ["20%", "21%", "19%", "22%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For successive discounts x% and y%, the equivalent discount = x + y − xy/100 = 10 + 10 − (10 × 10)/100 = 20 − 1 = 19%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-061", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0620", "ch": 11, "page": 89, "ansPage": 89, "srcNo": "Business Maths Q36", "exam": "22.05.2024 S-II", "q": "A bought a table of marked price ₹3000 at successive discounts of 10% and 15%. He spent ₹105 on transport and sold the table for ₹3200. His profit percentage is ______.", "o": ["30%", "33 1/3%", "35%", "35 1/3%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Cost after the discounts = 3000 × 90/100 × 85/100 = ₹2295. Adding transport: 2295 + 105 = ₹2400. Selling price = ₹3200. Profit = 800, so the profit % = 800/2400 × 100 = 33 1/3%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0621", "ch": 11, "page": 89, "ansPage": 89, "srcNo": "Business Maths Q37", "exam": "22.05.2024 S-II", "q": "The marked price of a watch was ₹720. A person bought it for ₹550.80 after two successive discounts. If the first discount was 10%, the second discount rate will be ______.", "o": ["10%", "15%", "20%", "25%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "After the first discount of 10%: 720 × 90/100 = ₹648. The second discount amount = 648 − 550.80 = ₹97.20. The rate = 97.20/648 × 100 = 15%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0622", "ch": 11, "page": 90, "ansPage": 90, "srcNo": "Business Maths Q38", "exam": "22.05.2024 S-II", "q": "The printed price of an article is ₹900, but a retailer buys it at a 40% discount and sells it for ₹900. The retailer's profit percentage is ______.", "o": ["33 2/3%", "66%", "66 2/3%", "60%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Cost price = 900 × (1 − 40/100) = ₹540. Profit = 900 − 540 = ₹360. Profit % = 360/540 × 100 = 66 2/3%.", "tip": "", "status": "note", "note": "Option (a) is printed as '33 2/3%' in the source; the answer (c) is unaffected.", "void": false}, {"id": "MTH-0623", "ch": 11, "page": 90, "ansPage": 90, "srcNo": "Business Maths Q39", "exam": "22.05.2024 S-I", "q": "The marked price of a watch is ₹1000. A retailer buys it at two successive discounts for ₹810. If one discount is 10%, the percentage of the second successive discount is ______.", "o": ["11%", "20%", "8%", "10%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "After the first discount of 10% the price is 1000 − 100 = ₹900. The retailer buys it for ₹810, so the second discount = 900 − 810 = ₹90, which is 90/900 × 100 = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0624", "ch": 11, "page": 90, "ansPage": 90, "srcNo": "Business Maths Q40", "exam": "18.09.2023 S-V", "q": "Two successive discounts of 10% each are given on the price of a TV set. The equivalent single discount is ______.", "o": ["20%", "21%", "19%", "22%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Equivalent discount = x + y − xy/100 = 10 + 10 − 100/100 = 19%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-061", "first": false, "kind": "exact", "of": "MTH-0619"}}, {"id": "MTH-0625", "ch": 11, "page": 90, "ansPage": 90, "srcNo": "Business Maths Q41", "exam": "18.09.2023 S-V", "q": "'A' bought a table of marked price ₹3000 at successive discounts of 10% and 15%. He spent ₹105 on transport and sold the table for ₹3200. What is his profit percentage?", "o": ["33%", "33 1/3%", "35%", "35 1/3%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Price paid = 3000 × 90/100 × 85/100 = ₹2295. Cost including transport = 2295 + 105 = ₹2400. Profit = 3200 − 2400 = ₹800. Profit % = 800/2400 × 100 = 33 1/3%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0626", "ch": 11, "page": 90, "ansPage": 90, "srcNo": "Business Maths Q42", "exam": "18.09.2023 S-V", "q": "A retailer buys 40 pens from a wholesaler at the marked price of 36 pens. If the retailer sells those pens at a 1% discount, his percentage profit is ______.", "o": ["10%", "10.50%", "6%", "8%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the marked price of 1 pen be ₹1. The cost of 40 pens = 36 × 1 = ₹36. The marked value of 40 pens = ₹40, and after a 1% discount the sale value = 40 × 99/100 = ₹39.60. Profit = 39.60 − 36 = ₹3.60, so the profit % = 3.6/36 × 100 = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0627", "ch": 11, "page": 91, "ansPage": 91, "srcNo": "Business Maths Q43", "exam": "05.09.2023 S-IV", "q": "'A' bought a table of marked price ₹3000 at successive discounts of 10% and 15%. He spent ₹105 on transport and sold the table for ₹3200. What is his profit percentage?", "o": ["30%", "33 1/3%", "35%", "35 1/3%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Cost = 3000 × 90/100 × 85/100 + 105 = 2295 + 105 = ₹2400. Selling price = ₹3200. Profit % = 800/2400 × 100 = 33 1/3%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0628", "ch": 11, "page": 91, "ansPage": 91, "srcNo": "Business Maths Q44", "exam": "05.09.2023 S-IV", "q": "The marked price of a watch is ₹1000. A retailer buys it at two successive discounts for ₹810, where one discount is 10%. The percentage of the second successive discount is ______.", "o": ["11%", "20%", "8%", "10%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Total discount = (1000 − 810)/1000 × 100 = 19%. For successive discounts x and y, total = x + y − xy/100, so 19 = 10 + y − 10y/100 = 10 + 0.9y, giving y = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0629", "ch": 11, "page": 91, "ansPage": 91, "srcNo": "Business Maths Q45", "exam": "05.09.2023 S-IV", "q": "A retailer buys 40 pens from a wholesaler at the marked price of 36 pens. If the retailer sells them at a 1% discount, his percentage profit is ______.", "o": ["10%", "10.5%", "6%", "8%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Marked price of 1 pen = ₹1. Cost of 40 pens = ₹36. Selling price of 40 pens = 40 × 99/100 = ₹39.60. Profit = ₹3.60, so the profit % = 3.6/36 × 100 = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0630", "ch": 11, "page": 91, "ansPage": 91, "srcNo": "Business Maths Q46", "exam": "05.09.2023 S-IV", "q": "A trader marks the selling price of an article 10% above its cost price. While selling, he gives some discount so that he suffers a loss of 1%. What percentage discount did he give?", "o": ["10%", "11%", "15%
