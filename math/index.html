/* Flat, light, exam-software look. One theme on purpose: it reads the same on a phone in sunlight and on a laptop. */
:root {

* { box-sizing: border-box; }

.stat:first-child { border-left: 0; }

.two-col { grid-template-columns: 1fr; }
@media (min-width: 980px) { .two-col { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 4px; padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 500; }

.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary, .btn.success { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

legend { font-weight: 600; padding: 0 12px 0 0; color: var(--brand); font-size: .95rem; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }

.field input[type=number], .field select, .field input[type=text] { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 8px 10px; min-height: 42px; width: 100%; max-width: 280px; }
.hint { color: var(--muted); font-size: .84rem; }
.inline { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.radio-line { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
details.instr summary { cursor: pointer; font-weight: 600; padding: 4px 0; color: var(--brand); }

.notice { background: var(--info-bg); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; }
.notice.warn { background: var(--warn-bg); border-left-color: var(--warn); }

.test-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.tabs { display: flex; gap: 0; overflow-x: auto; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: none; padding: 9px 14px; min-height: 42px; cursor: pointer; font-size: .88rem; color: var(--muted); }
.tab[aria-selected=true] { border-bottom-color: var(--brand); color: var(--brand); font-weight: 600; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line-soft); padding-bottom: 10px; margin-bottom: 14px; }
.qnum { font-weight: 600; font-size: 1.02rem; }
.qmeta { color: var(--muted); font-size: .78rem; }
.qtext { font: 1.12rem/1.6 var(--read); white-space: pre-line; margin-bottom: 16px; overflow-wrap: anywhere; }
.opts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 4px; padding: 11px 14px; min-height: 48px; cursor: pointer; background: var(--panel); overflow-wrap: anywhere; font-family: var(--read); font-size: 1.04rem; line-height: 1.5; }
.opt:hover { border-color: var(--brand); }

.opt.locked { cursor: default; }
.opt .tag { margin-left: auto; font-family: var(--ui); font-size: .72rem; font-weight: 600; white-space: nowrap; padding-left: 8px; color: var(--muted); }
.opt.right .tag { color: var(--ok); } .opt.wrong .tag { color: var(--bad); }
.feedback { margin-top: 16px; border-radius: 4px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--muted); background: var(--panel-2); font-family: var(--read); }
.feedback.good { border-left-color: var(--ok); background: var(--ok-bg); }
.feedback.badf { border-left-color: var(--bad); background: var(--bad-bg); }
.feedback h3 { font-family: var(--ui); margin-bottom: 6px; }
.feedback .hint { font-family: var(--ui); }

.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size: .78rem; margin-bottom: 12px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.pq { position: relative; min-height: 40px; border: 1px solid transparent; border-radius: 4px; font-weight: 600; font-size: .9rem; cursor: pointer; background: var(--nv); color: var(--nv-text); font-variant-numeric: tabular-nums; }
.pq.na { background: var(--bad); color: #fff; }
.pq.a { background: var(--ok); color: #fff; }
.pq.m, .pq.am { background: var(--review); color: #fff; border-radius: 50%; }
.pq.am::after { content: "✓"; position: absolute; right: -3px; bottom: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 10px; line-height: 15px; }
.pq.cur { outline: 2px solid var(--text); outline-offset: 2px; }
.sw { width: 26px; height: 26px; min-height: 0; display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; flex-shrink: 0; cursor: default; }

e": "", "void": false}, {"id": "MTH-0010", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q10", "exam": "23.05.2024 S-II", "q": "√6 is a ______ number.", "o": ["Rational", "Irrational", "Integer", "Natural"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "6 is not a perfect square, so √6 is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0011", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q11", "exam": "23.05.2024 S-II", "q": "Which of the following is NOT irrational?", "o": ["√10", "√24", "√35", "√121"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "√121 = 11 is rational. The others are square roots of non-perfect squares.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0012", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q12", "exam": "23.05.2024 S-I", "q": "If a is a rational number, then 1/a is ______.", "o": ["A rational number", "An irrational number", "A prime number", "An even number"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If a is rational (and non-zero), its reciprocal 1/a is also a ratio of integers, so it is rational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0013", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q13", "exam": "23.05.2024 S-I", "q": "11.23456 is ______.", "o": ["An irrational number", "An integer", "A rational number", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "11.23456 = 1123456/100000, a ratio of two integers, so it is rational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0014", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q14", "exam": "23.05.2024 S-I; 18.09.2023 S-V", "q": "What kind of number is 2.12112111211112...?", "o": ["Even number", "Integer", "Rational number", "Irrational number"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The decimal is non-terminating and non-repeating (the number of 1s keeps increasing), so it is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0015", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q15", "exam": "23.05.2024 S-I", "q": "A positive odd integer is of the form ______, where q is a positive integer.", "o": ["2q", "4q − 1", "2q + 1", "3q"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An odd positive integer leaves remainder 1 when divided by 2, so it has the form 2q + 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0016", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q16", "exam": "23.05.2024 S-I", "q": "Is '1' a composite number?", "o": ["Yes", "No", "Both", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A composite number has more than two factors. 1 has only one factor (itself), so it is neither prime nor composite.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0017", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q17", "exam": "23.05.2024 S-I", "q": "The product of which of the following is a rational number?", "o": ["√2 × √3", "√9 × √5", "√27 × √3", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "√27 × √3 = √81 = 9, a rational number. √2×√3 = √6 and √9×√5 = 3√5 are irrational.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-004", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0018", "ch": 1, "page": 4, "ansPage": 4, "srcNo": "Number System Q18", "exam": "23.05.2024 S-I", "q": "Which of the following is the odd one out?", "o": ["3/5", "√(16/4)", "√2/5", "25/9"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "3/5, √(16/4) = 2 and 25/9 are rational. √2/5 is irrational because √2 is irrational, so it is the odd one out.", "tip": "", "status": "note", "note": "The printed explanation shows the last option as 25/5 = 5, while the printed option reads 25/9. Both are rational, so the answer is unaffected.", "void": false, "dup": {"group": "DUP-005", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0019", "ch": 1, "page": 4, "ansPage": 5, "srcNo": "Number System Q19", "exam": "24.05.2024 S-I", "q": "The smallest prime number is ______.", "o": ["2", "1", "0", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A prime number has exactly two factors. 1 has only one factor, so the smallest prime is 2. A composite number has more than two factors (for example 9 = 3×3×1).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-006", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0020", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q20", "exam": "24.05.2024 S-I", "q": "Which of the following pairs is co-prime?", "o": ["(15, 20)", "(9, 16)", "(16, 52)", "(21, 84)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Co-prime numbers have no common factor other than 1. 9 = 3×3 and 16 = 2×2×2×2 share no factor, so (9, 16) is co-prime. The other pairs share factors such as 5, 4 and 21.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0021", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q21", "exam": "22.05.2024 S-II", "q": "The product of the smallest prime number and the smallest composite number is ______.", "o": ["10", "6", "8", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Smallest prime = 2, smallest composite = 4, so the product is 2 × 4 = 8.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-007", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0022", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q22", "exam": "22.05.2024 S-II", "q": "The sum of the first 20 odd natural numbers is ______.", "o": ["100", "210", "400", "420"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The sum of the first n odd natural numbers is n². For n = 20 the sum is 20² = 400.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-008", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0023", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q23", "exam": "22.05.2024 S-II; 04.09.2023 S-II", "q": "0.12112111211112... is a number that is ______.", "o": ["Rational", "Irrational", "Unreal", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The digits follow a pattern of growing blocks of 1s and never repeat a fixed block, so the decimal is non-terminating and non-repeating, hence irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0024", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q24", "exam": "22.05.2024 S-I", "q": "According to the Fundamental Theorem of Arithmetic:", "o": ["Every composite number can be expressed as a product of prime numbers.", "Every composite number cannot be expressed as a product of prime numbers.", "Both are true.", "None of the above."], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The Fundamental Theorem of Arithmetic says every composite number can be written as a product of primes.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0025", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q25", "exam": "22.05.2024 S-I", "q": "The number of odd numbers between 0 and 50 is ______.", "o": ["26", "25", "27", "24"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The odd numbers 1, 3, 5, ..., 49 form an AP with a = 1, d = 2, last term 49. 49 = 1 + (n−1)×2 gives n = 25.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-009", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0026", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "Number System Q26", "exam": "05.09.2023 S-IV", "q": "Every positive odd integer has the fo nd": "exact", "of": "MTH-0025"}}, {"id": "MTH-0034", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "Number System Q33", "exam": "05.09.2023 S-IV", "q": "11.23564... (with 564 repeating) is a ______.", "o": ["Irrational number", "Integer", "Rational number", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let x = 11.23564564... Then 100x = 1123.564564... and 100000x = 1123564.564564... Subtracting, 99900x = 1122441, so x = 1122441/99900, a ratio of integers, hence rational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0035", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "Number System Q34", "exam": "05.09.2023 S-III", "q": "Which of the following is NOT a rational number?", "o": ["0.2354", "3.45666......", "13.4545.....", "0.3232232223....."], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The decimal 0.3232232223... is non-terminating and non-repeating, so it is not rational.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-003", "first": false, "kind": "exact", "of": "MTH-0008"}}, {"id": "MTH-0036", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q35", "exam": "05.09.2023 S-III", "q": "Which of the following is true for an irrational number?", "o": ["Its decimal form is terminating.", "Its decimal form is non-terminating recurring.", "Its decimal form is non-terminating non-recurring.", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Irrational numbers cannot be written as terminating or repeating decimals; their decimal form is non-terminating and non-recurring.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-010", "first": false, "kind": "exact", "of": "MTH-0028"}}, {"id": "MTH-0037", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q36", "exam": "05.09.2023 S-III", "q": "Which of the following is true for every positive even integer, where q is an integer?", "o": ["It is of the form 2q + 1", "It is of the form 2q", "It is of the form 3q", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "An even number leaves remainder 0 on division by 2. By Euclid's lemma a = bq + r with b = 2, r = 0, so a = 2q.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0038", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q37", "exam": "05.09.2023 S-III", "q": "The general form of a rational number is ______.", "o": ["p/q (q ≠ 0)", "pq", "p + q", "p − q"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A rational number is one that can be expressed as p/q with p, q integers and q ≠ 0.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-002", "first": false, "kind": "exact", "of": "MTH-0004"}}, {"id": "MTH-0039", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q38", "exam": "05.09.2023 S-III", "q": "The sum of two rational numbers is ______.", "o": ["An even number", "A natural number", "A rational number", "An irrational number"], "key": {"printed": [2], "verified": [2], "official": 3}, "e": "The sum and product of two rational numbers are always rational.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (d) as the answer to this question. Option (d) is mathematically wrong, so printed key (c) is retained and the Commission's key is recorded.", "void": false}, {"id": "MTH-0040", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q39", "exam": "05.09.2023 S-III", "q": "According to the Fundamental Theorem of Arithmetic:", "o": ["Every composite number can be expressed as a product of prime numbers.", "Every composite number cannot be expressed as a product of prime numbers.", "Both A and B are true.", "None of these"], "key": {"printed": [1], "verified": [0], "official": null}, "e": "The printed solution states that, by the Fundamental Theorem of Arithmetic, every composite number can be expressed as a product of primes, and this factorisation is unique apart from the order of the prime factors.", "tip": "", "status": "disputed", "note": "The printed key (b) contradicts the printed explanation, which supports statement (a). The same question at Q24 has key (a). Printed key retained; verified answer (a).", "void": false}, {"id": "MTH-0041", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q40", "exam": "04.09.2023 S-II", "q": "The product of which of the following is a rational number?", "o": ["√2 × √3", "√9 × √5", "√27 × √3", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "√27 × √3 = √81 = 9 = 9/1, a rational number.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-004", "first": false, "kind": "exact", "of": "MTH-0017"}}, {"id": "MTH-0042", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q41", "exam": "04.09.2023 S-II", "q": "What kind of number is π/2?", "o": ["Rational", "Irrational", "Not real", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Numbers that cannot be written as p/q are irrational (for example √2, √3, π). So π/2 is irrational.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-001", "first": false, "kind": "exact", "of": "MTH-0003"}}, {"id": "MTH-0043", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "Number System Q42", "exam": "04.09.2023 S-II", "q": "Which of the following is the odd one out?", "o": ["3/5", "√16/4", "√2/5", "25/9"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "√2/5 cannot be written as a ratio of integers because √2 is irrational, whereas the other numbers are rational.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-005", "first": false, "kind": "exact", "of": "MTH-0018"}}, {"id": "MTH-0044", "ch": 1, "page": 7, "ansPage": 8, "srcNo": "Number System Q43", "exam": "04.09.2023 S-II", "q": "What kind of number is π?", "o": ["Irrational", "Rational", "Odd", "Equal"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A number that cannot be written as p/q is irrational. π cannot be written as a ratio of integers, so it is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0045", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q44", "exam": "04.09.2023 S-II", "q": "5.2333... is a ______.", "o": ["Natural number", "Even number", "Rational number", "Irrational number"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "5.2333... = 5.2 + 0.0333... = 5 + (23 − 2)/90 = 5 + 21/90 = 471/90, a ratio of integers, so it is rational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0046", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q45", "exam": "04.09.2023 S-I", "q": "Which of the following is NOT irrational?", "o": ["4√5", "√9 × √16", "√11", "√15"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "√9 × √16 = 3 × 4 = 12, which is rational. The others are irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0047", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q46", "exam": "04.09.2023 S-I", "q": "Which of the following is a prime number?", "o": ["15", "23", "12", "75"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A prime number is divisible only by 1 and itself. 23 is prime; 15, 12 and 75 have other factors.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-011", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0048", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q47", "exam": "04.09.2023 S-I", "q": "For an integer P, the form of an odd number is ______.", "o": ["2p + 1", "2p", "p", "p + 1"], "key": {"printed": [0], "verified": [0], "official": 2}, "e": "A number divisible by 2 is even. If p is an integer, 2p is always even, and adding 1 to an even number gives an odd number, so 2p + 1 is always odd.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (c) as the answer. Option (a) is the mathematically correct form; printed key (a) retained and the Commission's key recorded.", "void": false}, {"id": "MTH-0049", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q48", "exam": "04.09.2023 S-I", "q": "Which of the following is a rational number?", "o": ["2 − √3", "√5", "2√3/√3", "√6"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "2√3/√3 = 2, which is rational. 2 − √3, √5 and √6 are irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0050", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q49", "exam": "04.09.2023 S-I", "q": "√5 is a ______ number.", "o": ["Rational", "Irrational", "Integer", "Natural"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "√5 ≈ 2.236..., a non-terminating, non-repeating decimal, so it is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0051", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q50", "exam": "04.09.2023 S-I", "q": "3 + 2√5 is a ______ number.", "o": ["Irrational", "Rational", "Prime", "Natural"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "3 is rational and 2√5 is irrational. The sum of a rational and an irrational number is always irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0052", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "Number System Q51", "exam": "04.09.2023 S-I", "q": "53 − 1/√2 (sign as printed in the source) is a ______.", "o": ["Natural number", "Rational number", "Irrational number", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "53 is rational and 1/√2 is irrational, so the combination is irrational.", "tip": "", "status": "note", "note": "The sign between 53 and 1/√2 is not clearly legible in the source, and the printed solution writes the number as 58 − 1/√3. Under either reading the result is irrational, so the answer is unaffected.", "void": false}, {"id": "MTH-0053", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q52", "exam": "", "q": "If a and b are two positive integers, then the solution of the equation ax = b will always be a ______.", "o": ["Positive number", "Negative number", "−1/−1", "0/0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Since a and b are positive, x = b/a is always a positive number.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0054", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q53", "exam": "", "q": "If a and b are two integers, which of the following may not be an integer?", "o": ["a + b", "a − b", "a × b", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The sum, difference and product of two integers are always integers, so each of a + b, a − b and a × b is an integer.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0055", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q54", "exam": "", "q": "In the standard form of a rational number, the common factor of the numerator and denominator is always ______.", "o": ["0", "1", "−2", "2"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the standard (lowest) form of a rational number the numerator and denominator have no common factor other than 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0056", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q55", "exam": "", "q": "Which of the following rational numbers is equal to its reciprocal?", "o": ["1", "1/2", "2", "0"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The reciprocal of 1 is 1. The reciprocal of 1/2 is 2, of 2 is 1/2, and 0 has no reciprocal.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0057", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q56", "exam": "", "q": "How many rational numbers can there be between two rational numbers?", "o": ["1/1", "0/0", "Unlimited (infinite)", "100/100"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Between any two rational numbers there are infinitely many rational numbers.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0058", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q57", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "Which of the following is a rational number?", "o": ["(4 + √5) − (4 − √5)", "(4 − √5)(4 − √5)", "(4 + √5)(4 + √5)", "(4 + √5)(4 − √5)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "(4 + √5)(4 − √5) = 16 − 5 = 11 = 11/1, which is rational. The other expressions contain √5 terms.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0059", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q58", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The sum of two irrational numbers is ______.", "o": ["Rational", "Irrational", "Real", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The sum of two irrational numbers is either rational or irrational, and in both cases it is a real number, so 'real' is the answer that always holds.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0060", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q59", "exam": "TGT 2001", "q": "The number log₂7 is ______.", "o": ["An integer", "A rational number", "An irrational number", "A prime number"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Suppose log₂7 = p/q. Then 7 = 2^(p/q), so 2^p = 7^q. The left side is even and the right side is odd, so they cannot be equal. Hence log₂7 is neither an integer, nor rational, nor prime; it is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0061", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "Number System Q60", "exam": "TGT 1999", "q": "If x and y are any two positive real numbers, which is correct for x > y?", "o": ["−x > y", "−x < −y", "1/x > 1/y", "−1/x > 1/y"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If x > y then −x < −y. For example x = 5, y = 3 gives −5 < −3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0062", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q61", "exam": "PGT 2010", "q": "How many real numbers are there in the interval (2, 7)?", "o": ["2", "4", "6", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Any interval contains infinitely many real numbers.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0063", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q62", "exam": "Rajasthan TGT 2016", "q": "The sum of an integer and its square is ______.", "o": ["Always an odd number", "Always an even number", "Always a prime number", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "n + n² = n(n + 1) is a product of two consecutive integers, so it is always even. For example 1+1² = 2, 2+2² = 6, 3+3² = 12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0064", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q63", "exam": "Rajasthan TGT 2016", "q": "The number √1452/1872 is ______.", "o": ["A natural number", "An integer", "A rational number", "An irrational number"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "√1452 = 2 × 11 × √3, so the number equals 22√3/1872 = 11√3/936, which is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0065", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q64", "exam": "UP PCS (Pre) 1994", "q": "The number of rational numbers between two unequal rational numbers is ______.", "o": ["2", "10", "15", "Infinite"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Between two unequal rational numbers there are infinitely many rational numbers.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0066", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q65", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The decimal expansion of an irrational number is ______.", "o": ["Non-terminating, recurring", "Terminating", "Non-terminating, non-recurring", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The decimal expansion of an irrational number is non-terminating and non-recurring.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0067", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q66", "exam": "", "q": "For a non-zero integer a, which of the following is not defined?", "o": ["a ÷ 0", "0 ÷ a", "a ÷ 1", "1 ÷ a"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Division by zero is undefined. 0 ÷ a = 0, a ÷ 1 = a and 1 ÷ a = 1/a are all defined.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0068", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q67", "exam": "", "q": "Which of the following is an irrational number?", "o": ["√1.44", "−√0.64", "√7 − 8", "(√5 + 1)(√5 − 1)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "√1.44 = 12/10 and −√0.64 = −8/10 are rational. (√5+1)(√5−1) = 5 − 1 = 4 is rational. √7 − 8 is irrational because √7 is irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0069", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "Number System Q68", "exam": "14.09.2020 S-I", "q": "Which four rational numbers lie between 1/4 and 1/3?", "o": ["13/48, 9/32, 7/24 and 5/16", "13/42, 11/32, 7/25 and 7/16", "13/48, 9/32, 7/25 and 5/16", "None of these"], "key": {"printed": [0, 2], "verified": [0, 2], "official": null}, "e": "1/4 = 0.25 and 1/3 = 0.333... In option (a): 13/48 = 0.27, 9/32 = 0.28, 7/24 = 0.29, 5/16 = 0.31, all between them. Option (c) also gives 0.27, 0.28, 0.28, 0.31, all between them. In option (b), 11/32 = 0.34 and 7/16 = 0.43 are outside the interval.", "tip": "", "status": "note", "note": "The book accepts both (a) and (c) ('Ans. (a+c)'). Both are stored as correct.", "void": false}, {"id": "MTH-0070", "ch": 2, "page": 11, "ansPage": 11, "srcNo": "Number System Q69", "exam": "22.05.2024 S-II", "q": "Which of the following fractions has a terminating decimal expansion?", "o": ["64/455", "3/160", "17/105", "15/85"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A fraction in lowest terms has a terminating decimal only if its denominator has only 2 and 5 as prime factors. 455 = 5×7×13, 160 = 2⁵×5, 105 = 3×5×7, 85 = 5×17. Only 160 qualifies, so 3/160 terminates.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-012", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0071", "ch": 2, "page": 11, "ansPage": 11, "srcNo": "Number System Q70", "exam": "22.05.2024 S-I", "q": "Which of the following is true for an irrational number?", "o": ["Its decimal form is terminating.", "Its decimal form is non-terminating recurring.", "Its decimal form is non-terminating non-recurring.", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Irrational numbers cannot be written as a ratio of integers; their decimal expansion neither ends nor repeats (for example √2, √3, √5).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-010", "first": false, "kind": "exact", "of": "MTH-0028"}}, {"id": "MTH-0072", "ch": 2, "page": 11, "ansPage": 11, "srcNo": "Number System Q71", "exam": "22.05.2024 S-I", "q": "Which of the following can be converted to a terminating decimal?", "o": ["22/7", "4 1/8", "2/15", "5/22"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A fraction in lowest terms has a terminating decimal if its denominator has only 2 or 5 as prime factors. 4 1/8 = 33/8 and 8 = 2³, so it terminates.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0073", "ch": 2, "page": 11, "ansPage": 11, "srcNo": "Number System Q72", "exam": "09.06.2024 S-I", "q": "If p is of the form 3ⁿ and q is of the form 6ⁿ × 5ᵐ, what kind of decimal expansion does the fraction p/q have?", "o": ["Non-terminating recurring", "Terminating", "Non-terminating", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "p/q = 3ⁿ/(6ⁿ × 5ᵐ) = 3ⁿ/(2ⁿ × 3ⁿ × 5ᵐ) = 1/(2ⁿ × 5ᵐ). The denominator has only the prime factors 2 and 5, so the decimal expansion terminates.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0074", "ch": 2, "page": 11, "ansPage": 11, "srcNo": "Number System Q73", "exam": "09.06.2024 S-I", "q": "The simplest form of 188/220 is ______.", "o": ["47/50", "45/53", "91/100", "47/55"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Dividing numerator and denominator by 4, 188/220 = 47/55.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-013", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0075", "ch": 2, "page": 11, "ansPage": 11, "srcNo": "Number System Q74", "exam": "23.05.2024 S-II", "q": "Decimal expansions of some real numbers are given below. Which of them is NOT rational?", "o": ["43.123456789", "0.120120012000120.....", "43.123456789 (with the digits 123456789 repeating)", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If a rational number has a terminating or recurring decimal expansion, it can be written as p/q. In option (b) the number of zeros between the 1s keeps growing, so the expansion is non-terminating and non-recurring, hence irrational.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0076", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q75", "exam": "23.05.2024 S-I", "q": "The decimal expansion of 11/15 is ______.", "o": ["Terminating", "Non-terminating recurring", "Non-terminating non-recurring", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "11/15 = 0.7333... The digit 3 repeats forever, so the expansion is non-terminating and recurring.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0077", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q76", "exam": "22.05.2024 S-I", "q": "What is the decimal expansion of 2³/(2³ × 5²)?", "o": ["0.004", "0.04", "0.0004", "0.4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "2³/(2³ × 5²) = 1/5² = 1/25 = 0.04.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-014", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0078", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q77", "exam": "22.05.2024 S-I", "q": "What kind of decimal expansion does 29/343 have?", "o": ["Terminating", "Non-terminating recurring", "Non-terminating non-recurring", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "343 = 7³. If the denominator of a rational number in lowest terms has a prime factor other than 2 or 5, its decimal expansion is non-terminating and recurring.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-015", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0079", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q78", "exam": "22.05.2024 S-I", "q": "What kind of decimal expansion does 6/15 have?", "o": ["Terminating", "Non-terminating recurring", "Non-terminating non-recurring", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "6/15 = 2/5 = 0.4, so the expansion terminates.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-016", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0080", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q79", "exam": "05.09.2023 S-IV", "q": "1 cm is equal to how many millimetres?", "o": ["10", "100", "45200", "1/100"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "1 m = 100 cm = 1000 mm, so 100 cm = 1000 mm and 1 cm = 10 mm.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0081", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q80", "exam": "04.09.2023 S-I", "q": "For what value of n will the number 4ⁿ be zero?", "o": ["n = 2", "n = 0", "There is no such n", "n = ∞"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "4ⁿ is never zero for any value of n.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0082", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q81", "exam": "04.09.2023 S-II", "q": "What kind of decimal expansion does 6/15 have?", "o": ["Terminating", "Non-terminating recurring", "Non-terminating non-recurring", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "6/15 = 0.4, which terminates. A terminating decimal has a finite number of digits after the decimal point.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-016", "first": false, "kind": "exact", "of": "MTH-0079"}}, {"id": "MTH-0083", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q82", "exam": "04.09.2023 S-I", "q": "What kind of decimal expansion does 29/343 have?", "o": ["Terminating", "Non-terminating recurring", "Non-terminating non-recurring", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "29/343 = 0.084548104..., a non-terminating decimal with a repeating pattern, because the denominator 343 = 7³ has a prime factor other than 2 and 5.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-015", "first": false, "kind": "exact", "of": "MTH-0078"}}, {"id": "MTH-0084", "ch": 2, "page": 12, "ansPage": 12, "srcNo": "Number System Q83", "exam": "05.09.2023 S-IV", "q": "Which of the following can be converted into a terminating decimal?", "o": ["22/7", "4 1/8", "2/15", "5/22"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A fraction p/q (q ≠ 0) terminates only if the denominator in lowest terms has only 2 and 5 as prime factors. 4 1/8 = 33/8 = 4.125, so it terminates.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0085", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q84", "exam": "18.09.2023 S-V", "q": "The simplest form of 188/220 is ______.", "o": ["47/50", "45/53", "91/100", "47/55"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Dividing numerator and denominator by 4 gives 47/55.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-013", "first": false, "kind": "exact", "of": "MTH-0074"}}, {"id": "MTH-0086", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q85", "exam": "18.09.2023 S-V", "q": "The decimal expansion of 11/15 is ______.", "o": ["Terminating", "Non-terminating", "Terminating recurring", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The denominator 15 = 3 × 5 has the prime factor 3, which is neither 2 nor 5, so the expansion cannot terminate. It is non-terminating (and recurring).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0087", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q86", "exam": "18.09.2023 S-V; 05.09.2023 S-IV", "q": "The simplest form of 387/405 is ______.", "o": ["43/45", "41/25", "9/25", "129/135"], "key": {"printed": [0], "verified": [0], "official": 3}, "e": "Dividing numerator and denominator by 9 gives 387/405 = 43/45.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (d). 129/135 equals 43/45 but is not in simplest form, so printed key (a) is retained and the Commission's key is recorded.", "void": false, "dup": {"group": "DUP-017", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0088", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q87", "exam": "04.09.2023 S-II", "q": "What is the decimal expansion of 2³/(2³ × 5²)?", "o": ["0.004", "0.04", "0.0004", "0.4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "2³/(2³ × 5²) = 8/200 = 0.04.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-014", "first": false, "kind": "exact", "of": "MTH-0077"}}, {"id": "MTH-0089", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q88", "exam": "10.09.2020 S-I", "q": "The number of rational terms in the expansion of (√3 + ⁴√5)^2020 is ______.", "o": ["2021", "505", "506", "507"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The general term is T(r+1) = C(2020, r) × 3^((2020−r)/2) × 5^(r/4). It is rational when r is a multiple of 4: r = 0, 4, 8, ..., 2020, which gives 506 terms.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0090", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q89", "exam": "", "q": "The decimal expression (in rupees) for 8 rupees 8 paise is ______.", "o": ["8.8", "8.08", "8.008", "88.0"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "8 rupees 8 paise = 8 + 8/100 = 8 + 0.08 = ₹8.08.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0091", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q90", "exam": "Haryana TGT 2020", "q": "What is the digit in the unit place of (751)^751 × (263)^271 × (137)^138 × (339)^339?", "o": ["6", "7", "8", "9"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Unit digits: 751^751 ends in 1. 263^271 ends like 3^271; 271 = 4×67 + 3, so the digit is 7. 137^138 ends like 7^138; 138 = 4×34 + 2, so the digit is 9. 339^339 ends like 9^339 (odd power), so the digit is 9. The product of unit digits is 1 × 7 × 9 × 9 = 567, so the unit digit is 7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0092", "ch": 2, "page": 13, "ansPage": 13, "srcNo": "Number System Q91", "exam": "Haryana TGT 2020", "q": "The decimal expansion of the number 14753/1250 will terminate after ______.", "o": ["One decimal place", "Two decimal places", "Three decimal places", "Four decimal places"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "14753/1250 = 11.8024, which has four decimal places. (1250 = 2 × 5⁴, so four places are needed.)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0093", "ch": 2, "page": 13, "ansPage": 14, "srcNo": "Number System Q92", "exam": "Haryana TGT 2019", "q": "The number of consecutive zeros at the end of 2³ × 3⁴ × 5⁴ × 7 is equal to ______.", "o": ["2", "3", "4", "5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Each zero needs a factor 2 × 5. There are three 2s and four 5s, so only three pairs can be formed: 2³ × 3⁴ × 5⁴ × 7 = 2835 × 10³. Hence there are 3 consecutive zeros.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0094", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q93", "exam": "PGT Section B Tier-I 31.11.2014", "q": "The last digit of 6^500 is ______.", "o": ["5", "7", "6", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Any positive integer power of 6 ends in 6. For example 6¹ = 6, 6² = 36, 6³ = 216.", "tip": "", "status": "note", "note": "The exam date is printed as '31.11.2014' in the book, which is not a valid date.", "void": false}, {"id": "MTH-0095", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q94", "exam": "TGT 2004", "q": "The digit in the unit place of (237)^610 is ______.", "o": ["9", "7", "3", "1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The unit digit depends on 7^610. The cycle of 7 is 7, 9, 3, 1 (length 4). 610 = 4 × 152 + 2, so the digit is 7² = 49, ending in 9.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0096", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q95", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "19.999 can be written in the form p/q (p, q integers, q ≠ 0) as ______.", "o": ["81/100", "20", "199/10", "1999/100"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "19.999 = 19999/1000, which is a rational number with integer p and q. Among the options, the printed solution accepts 20 (that is, 20/1).", "tip": "", "status": "note", "note": "Taken literally, 19.999 = 19999/1000, which is none of the options. The printed key (b) 20 holds exactly only if the 9s repeat forever (19.999... = 20). Printed key retained, flagged for review.", "void": false}, {"id": "MTH-0097", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q96", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "What is the unit digit of 3^100?", "o": ["2", "3", "0", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "100 ÷ 4 leaves remainder 0, and 3⁴ = 81 ends in 1, so 3^100 ends in 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0098", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q97", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The digit in the unit's place of 5^834 is ______.", "o": ["5", "0", "1", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Every positive integer power of 5 ends in 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0099", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q98", "exam": "JDD-75-PGT Tier II-X-15 28.06.2015", "q": "How many digits are there in 2^17 × 3² × 5^14 × 7?", "o": ["14", "16", "15", "17"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "2^17 × 5^14 = 2³ × 10^14. So the number is 2³ × 3² × 7 × 10^14 = 504 × 10^14. 504 has 3 digits and 10^14 adds 14 zeros, giving 17 digits.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0100", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q99", "exam": "JDD-75-PGT Tier II-X-15 28.06.2015", "q": "The last digit of 6^500 is ______.", "o": ["2", "4", "6", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The last digit of 6 raised to any power is always 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0101", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q100", "exam": "Rajasthan TGT 2016", "q": "The digit in the unit position of the integer 1! + 2! + 3! + ... + 99! is ______.", "o": ["7", "3", "1", "0"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For n ≥ 5, n! contains the factors 2 and 5, so it ends in 0. Only 1! + 2! + 3! + 4! = 1 + 2 + 6 + 24 = 33 matters, so the unit digit is 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0102", "ch": 2, "page": 14, "ansPage": 14, "srcNo": "Number System Q101", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The value of the expression 0.8 × (0.05/0.004) is equal to ______.", "o": ["10", "0.1", "100", "0.4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "0.05/0.004 = 12.5, so 0.8 × 12.5 = 10.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0103", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q102", "exam": "", "q": "In standard form 72 crore is written as ______.", "o": ["72 × 10⁷", "72 × 10⁸", "7.2 × 10⁸", "7.2 × 10⁷"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "72 crore = 720000000 = 72 × 10⁷ = 7.2 × 10⁸. Standard form needs a single non-zero digit before the decimal point, so 7.2 × 10⁸.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0104", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q103", "exam": "", "q": "When the integers 10, 0, 5, −5, −7 are arranged in ascending or descending order, which integer always stays in the middle?", "o": ["0", "5", "−7", "−5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Ascending: −7, −5, 0, 5, 10. Descending: 10, 5, 0, −5, −7. In both orders 0 is in the middle.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0105", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q104", "exam": "", "q": "The value of 5 ÷ (−1) does not lie between ______.", "o": ["0 and −10", "0 and 10", "−4 and −15", "−6 and 6"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "5 ÷ (−1) = −5, which is negative. It lies between 0 and −10, −4 and −15, and −6 and 6, but not between 0 and 10.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0106", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q105", "exam": "", "q": "If 1 is added to the greatest 7-digit number, it becomes equal to ______.", "o": ["10 thousand", "1 lakh", "10 lakh", "1 crore"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The greatest 7-digit number is 9999999. Adding 1 gives 10000000 = 1 crore.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0107", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q106", "exam": "", "q": "The largest 5-digit number having three different digits is ______.", "o": ["98978", "99897", "99987", "98799"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The largest 5-digit number using exactly three different digits is 99987.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0108", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q107", "exam": "", "q": "The ratio 3 : 8 is equal to which of the following?", "o": ["3.75", "0.375", "37.5", "375"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "3 : 8 = 3/8 = 0.375.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0109", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q108", "exam": "", "q": "Express the number 2,36,00,000 in standard form.", "o": ["2.36 × 10⁷", "23.6 × 10⁷", "236 × 10⁵", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "2,36,00,000 = 23600000 = 2.36 × 10⁷.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0110", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q109", "exam": "", "q": "Which of the following has the largest value?", "o": ["0.0001", "1/1000", "(0.100)²", "1/10 + 0.1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "0.0001 = 10⁻⁴, 1/1000 = 10⁻³, (0.100)² = 10⁻², and 1/10 + 0.1 = 0.2 = 2 × 10⁻¹. So 2 × 10⁻¹ > 10⁻² > 10⁻³ > 10⁻⁴ and option (d) is largest.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0111", "ch": 2, "page": 15, "ansPage": 15, "srcNo": "Number System Q110", "exam": "14.09.2020 S-I", "q": "The sum of the digits of a two-digit number is 24 times the sum of their reciprocals. If the sum of their reciprocals is 5/12, the number is ______.", "o": ["64", "46", "36", "Cannot be determined"], "key": {"printed": [0, 1], "verified": [0, 1], "official": null}, "e": "Let the digits be x and y. x + y = 24 × (1/x + 1/y) = 24(x + y)/(xy) ... with 1/x + 1/y = 5/12 this gives x + y = 24 × 5/12 = 10 and xy = 24 (because (x+y)/xy = 5/12). The digits are 4 and 6, so the number is 46 or 64.", "tip": "", "status": "note", "note": "The book accepts both (a) and (b) ('Ans. (a&b)'). Both are stored as correct.", "void": false}, {"id": "MTH-0112", "ch": 2, "page": 16, "ansPage": 16, "srcNo": "Number System Q111", "exam": "11.09.2020 S-I", "q": "The digit at the unit place of the number 2019^2020 + 2020^2019 is ______.", "o": ["0", "9", "1", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "2019^2020 = (2019⁴)^505 ends in 1 (the cycle of 9 is 9, 1 and 2020 is even). 2020^2019 ends in 0. So the sum ends in 1 + 0 = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0113", "ch": 2, "page": 16, "ansPage": 16, "srcNo": "Number System Q112", "exam": "", "q": "The unit's place digit in the expansion of (191)^1009 is ______.", "o": ["0", "1", "2", "3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Any power of a number ending in 1 ends in 1, so (191)^1009 ends in 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0114", "ch": 2, "page": 16, "ansPage": 16, "srcNo": "Number System Q113", "exam": "Haryana TGT 2019", "q": "One kilometre is equal to how many miles?", "o": ["0.84", "0.5", "0.62", "1.6"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "1 mile = 1.6 km, so 1 km = 1/1.6 = 0.625 miles ≈ 0.62 miles.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0115", "ch": 2, "page": 16, "ansPage": 16, "srcNo": "Number System Q114", "exam": "", "q": "Let x = (433)^24 − (377)^38 + (166)^54. What is the unit digit of x?", "o": ["6", "9", "8", "7"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "433^24 = (433⁴)^6 ends in 1 (since 3⁴ ends in 1). 377^38 = (377²)^19 ends in 9 (7² = 49). 166^54 ends in 6. The unit digit of x is (11 − 9 + 6) → 1 − 9 + 6 with a borrow gives 17 − 9 = 8, so the unit digit is 8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0116", "ch": 2, "page": 16, "ansPage": 16, "srcNo": "Number System Q115", "exam": "", "q": "What is the unit digit of 1⁵ + 2⁵ + 3⁵ + ... + 20⁵?", "o": ["0", "5", "2", "4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The unit digit of n⁵ equals the unit digit of n. So the unit digit of the sum equals that of 1 + 2 + 3 + ... + 20 = 20 × 21/2 = 210, which is 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0117", "ch": 2, "page": 16, "ansPage": 16, "srcNo": "Number System Q116", "exam": "", "q": "If the unit digit of 433 × 456 × 43N is (N + 2), what is the value of N?", "o": ["1", "8", "3", "6"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Unit digits give 3 × 6 × N = 18N, so the unit digit is that of 8N, and it must equal N + 2. Trying N = 6: 8 × 6 = 48 ends in 8 and N + 2 = 8. So N = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0118", "ch": 2, "page": 16, "ansPage": 17, "srcNo": "Number System Q117", "exam": "", "q": "What is the unit digit of (217)^413 × (819)^547 × (414)^624 × (342)^812?", "o": ["2", "4", "6", "8"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "7^413 ends in 7 (413 = 4×103 + 1). 9^547 ends in 9 (odd power). 4^624 ends in 6 (even power). 2^812 ends in 6 (812 is a multiple of 4). The product of unit digits 7 × 9 × 6 × 6 = 2268 ends in 8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0119", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q118", "exam": "", "q": "Out of the numbers from 101 to 1000, what percentage of numbers have 9 as the unit digit?", "o": ["10%", "12%", "20%", "15%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "From 101 to 1000 there are 900 numbers. In each block of 100 numbers, 10 end in 9, so there are 10 × 9 = 90 such numbers. 90/900 × 100 = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0120", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q119", "exam": "", "q": "What is the unit digit of 5^124 × 124^5?", "o": ["5", "1", "0", "2"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "When any number is multiplied by 5 and the other factor is even, the unit digit is always 0. Here 5^124 ends in 5 and 124^5 is even, so the product ends in 0.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0121", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q120", "exam": "", "q": "What is the unit digit of the product (653 × 308 × 402 × 413)?", "o": ["4", "3", "2", "8"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Unit digits give 3 × 8 × 2 × 3 = 144, whose unit digit is 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0122", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q121", "exam": "", "q": "What is the unit digit of the sum of the first 111 whole numbers?", "o": ["4", "6", "5", "0"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The first 111 whole numbers are 0, 1, 2, ..., 110. Their sum is 110 × 111/2 = 55 × 111 = 6105, whose unit digit is 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0123", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q122", "exam": "", "q": "If x = (164)^169 + (333)^337 − (727)^726, what is the unit digit of x?", "o": ["5", "7", "8", "9"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The cycle length of unit digits is 4. 164^169 ends like 4^1 = 4 (169 = 4×42 + 1). 333^337 ends like 3^1 = 3 (337 = 4×84 + 1). 727^726 ends like 7^2 = 9 (726 = 4×181 + 2). So the unit digit is 4 + 3 − 9 = −2, and adding 10 gives 8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0124", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q123", "exam": "", "q": "If x = (633)^24 − (277)^38 + (266)^54, what is the unit digit of x?", "o": ["8", "6", "4", "7"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "633^24 ends like 3^24 = (3⁴)^6, which ends in 1. 277^38 ends like 7^38 = (7⁴)^9 × 7², which ends in 9. 266^54 ends in 6. So the unit digit is 1 − 9 + 6 = −2, and adding 10 gives 8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0125", "ch": 2, "page": 17, "ansPage": 17, "srcNo": "Number System Q124", "exam": "05.09.2023 S-III", "q": "Which of the following fractions has a terminating decimal expansion?", "o": ["64/455", "3/160", "17/105", "15/85"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "64/455 = 0.140659..., 3/160 = 0.01875 (terminating), 17/105 = 0.161904... and 15/85 = 0.176470... are non-terminating. Only 3/160 terminates.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-012", "first": false, "kind": "exact", "of": "MTH-0070"}}, {"id": "MTH-0126", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q125", "exam": "23.05.2024 S-I", "q": "If dividing 379 by 47 leaves remainder 3, what is the quotient?", "o": ["7", "8", "9", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "379 = 47 × 8 + 3 (since 47 × 8 = 376 and 379 − 376 = 3), so the quotient is 8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0127", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q126", "exam": "04.09.2023 S-II", "q": "For dividend a and divisor b in a = bq + r, which relation is correct for the remainder r?", "o": ["a ≤ r ≤ b", "0 ≤ r ≤ b", "0 ≤ r < b", "r > b"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "By Euclid's division lemma, a = bq + r with 0 ≤ r < b.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0128", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q127", "exam": "05.09.2023 S-III", "q": "What is the remainder when P(x) = x³ + ax² + 2x + a is divided by x + a?", "o": ["0", "a", "−a", "2a"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "By the remainder theorem, dividing by x + a gives remainder P(−a) = (−a)³ + a(−a)² + 2(−a) + a = −a³ + a³ − 2a + a = −a.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0129", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q128", "exam": "05.09.2023 S-IV", "q": "When the polynomial −x³ + 3x² − 3x + 5 is divided by −x² + x − 1, the quotient is x − 2. What is the remainder?", "o": ["5", "2", "−3", "3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Dividend = divisor × quotient + remainder. (−x² + x − 1)(x − 2) = −x³ + 3x² − 3x + 2. So the remainder is (−x³ + 3x² − 3x + 5) − (−x³ + 3x² − 3x + 2) = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0130", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q129", "exam": "18.09.2023 S-V", "q": "When the polynomial −x³ + 3x² − 3x + 5 is divided by −x² + x − 1, the quotient obtained is x − 2. What is the remainder?", "o": ["5", "2", "−3", "3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "(−x² + x − 1)(x − 2) = −x³ + 3x² − 3x + 2. The remainder is 5 − 2 = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0131", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q130", "exam": "05.09.2023 S-IV", "q": "What is the remainder when the polynomial x² − 2x + 1 is divided by x − 1?", "o": ["1", "2", "0", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "x² − 2x + 1 = (x − 1)². Dividing by x − 1 gives quotient x − 1 and remainder 0. (Check: P(1) = 1 − 2 + 1 = 0.)", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-018", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0132", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q131", "exam": "04.09.2023 S-II", "q": "What is the remainder when the polynomial x² − 2x + 1 is divided by (x − 1)?", "o": ["1", "2", "0", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Long division gives quotient x − 1 and remainder 0, since x² − 2x + 1 = (x − 1)².", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-018", "first": false, "kind": "exact", "of": "MTH-0131"}}, {"id": "MTH-0133", "ch": 3, "page": 18, "ansPage": 18, "srcNo": "Number System Q132", "exam": "10.09.2020 S-I", "q": "The number of times 20 can be subtracted from 2020 is ______.", "o": ["1 time", "101 times", "100 times", "102 times"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "2020 ÷ 20 = 101, so 20 can be subtracted 101 times.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0134", "ch": 3, "page": 19, "ansPage": 19, "srcNo": "Number System Q133", "exam": "", "q": "On subtracting 13 from 3 times a number, the result is ______.", "o": ["6", "7", "8", "9"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the result be y and the number x, so y = 3x − 13. For y = 6, x = 19/3; for y = 7, x = 20/3; for y = 8, x = 7; for y = 9, x = 22/3. Only y = 8 gives a whole-number x = 7.", "tip": "", "status": "note", "note": "The question stem is incomplete in the source (the condition that selects the answer is not printed). The printed solution picks the option for which the number is a whole number.", "void": false}, {"id": "MTH-0135", "ch": 3, "page": 19, "ansPage": 19, "srcNo": "Number System Q134", "exam": "UKPSC Lecturer (Mains) 2020", "q": "For all natural numbers n, (3·5^(2n+1) + 2^(3n+1)) is divisible by ______.", "o": ["18", "15", "11", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For n = 1 the expression is 3 × 5³ + 2⁴ = 375 + 16 = 391 = 17 × 23, which is not divisible by 18, 15 or 11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0136", "ch": 3, "page": 19, "ansPage": 19, "srcNo": "Number System Q135", "exam": "Haryana TGT 2020", "q": "A number leaves remainder 21 when divided by 114. If the same number is divided by 19, the remainder is ______.", "o": ["0", "1", "2", "5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the number be n = 114q + 21 = 19 × (6q + 1) + 2, because 114 = 6 × 19 and 21 = 19 + 2. So the remainder on division by 19 is 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0137", "ch": 3, "page": 19, "ansPage": 19, "srcNo": "Number System Q136", "exam": "Haryana TGT 2019", "q": "If n is a natural number, then (9^2n − 4^2n) is always divisible by ______.", "o": ["Only 5", "Only 13", "Both 5 and 13", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "9^2n − 4^2n is divisible by both 9 − 4 = 5 and 9 + 4 = 13 (since a^2n − b^2n is divisible by a − b and a + b).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0138", "ch": 3, "page": 19, "ansPage": 19, "srcNo": "Number System Q137", "exam": "Section B PGT Tier-I 31.11.2014", "q": "The remainder when 10^10 (10^10 + 1)(10^10 + 2) is divided by 6 is ______.", "o": ["2", "4", "0", "6"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The expression is a product of three consecutive integers 10^10, 10^10 + 1 and 10^10 + 2, so it is divisible by 6 and the remainder is 0.", "tip": "", "status": "note", "note": "The exam date is printed as '31.11.2014' in the book, which is not a valid date.", "void": false}, {"id": "MTH-0139", "ch": 3, "page": 19, "ansPage": 19, "srcNo": "Number System Q138", "exam": "UP PGT-2016 (02-02-2019)", "q": "The number of numbers between 100 and 300 that are divisible by 5 but not by 15 is ______.", "o": ["20", "26", "32", "35"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Multiples of 5 between 100 and 300: 105, 110, ..., 295, which is 39 numbers. Multiples of 15 in this range: 105, 120, ..., 285, which is 13 numbers. Divisible by 5 but not by 15: 39 − 13 = 26.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0140", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q139", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "In any group of 11 integers, how many of them, when divided by 10, will leave the same remainder?", "o": ["Exactly 3", "At least 5", "At least 2", "About 5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Division by 10 gives only 10 possible remainders (0 to 9). With 11 integers, by the pigeonhole principle at least two of them must leave the same remainder.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0141", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q140", "exam": "PGT 2010", "q": "3^(4n+2) + 5^(2n+1) is exactly divisible by ______.", "o": ["15", "14", "13", "12"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For n = 0 the value is 3² + 5¹ = 9 + 5 = 14. For n = 1 it is 3⁶ + 5³ = 729 + 125 = 854 = 14 × 61. So the expression is divisible by 14.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0142", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q141", "exam": "Rajasthan TGT 2016", "q": "The remainder when 59^28 is divided by 7 is ______.", "o": ["6", "4", "2", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "59 = 56 + 3, so 59^28 leaves the same remainder as 3^28 = 9^14. 9 = 7 + 2, so this equals the remainder of 2^14 = (2³)^4 × 2² = 8^4 × 4. Since 8 = 7 + 1, 8^4 leaves remainder 1, giving 1 × 4 = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0143", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q142", "exam": "TGT 2004", "q": "What is the remainder when x⁴ − 3x² + 6x − 5 is divided by x + 3?", "o": ["31", "25", "67", "84"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "By the remainder theorem, put x = −3: (−3)⁴ − 3(−3)² + 6(−3) − 5 = 81 − 27 − 18 − 5 = 31.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0144", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q143", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "The number of positive divisors of 8 × 81 × 125 is ______.", "o": ["20", "16", "100", "80"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "8 × 81 × 125 = 2³ × 3⁴ × 5³. The number of divisors is (3+1)(4+1)(3+1) = 4 × 5 × 4 = 80.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0145", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q144", "exam": "Haryana TGT 2019", "q": "How many two-digit numbers are divisible by 3?", "o": ["30", "29", "85", "99"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The two-digit multiples of 3 are 12, 15, 18, ..., 99, an AP with a = 12, d = 3. 99 = 12 + (n − 1) × 3 gives n = 30.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0146", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q145", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "N = 2⁴⁸ − 1 is exactly divisible by two numbers between 60 and 70. What is the sum of those two numbers?", "o": ["128", "256", "64", "512"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "2⁴⁸ − 1 = (2²⁴ + 1)(2²⁴ − 1) = (2²⁴ + 1)(2¹² + 1)(2¹² − 1) = (2²⁴ + 1)(2¹² + 1)(2⁶ + 1)(2⁶ − 1) = (2²⁴ + 1)(2¹² + 1) × 65 × 63. So N is divisible by 63 and 65, and their sum is 128.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0147", "ch": 3, "page": 20, "ansPage": 20, "srcNo": "Number System Q146", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "Find the smallest number which leaves remainders 28, 52 and 64 when divided by 60, 84 and 96 respectively.", "o": ["3392", "3360", "3318", "3328"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "60 − 28 = 84 − 52 = 96 − 64 = 32, so the difference is constant. The LCM of 60, 84 and 96 is 3360 (60 = 12×5, 84 = 12×7, 96 = 12×8, LCM = 12×8×7×5 = 3360). The required number is 3360 − 32 = 3328.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0148", "ch": 3, "page": 20, "ansPage": 21, "srcNo": "Number System Q147", "exam": "", "q": "What is the remainder when 8127 is divided by 8?", "o": ["4", "7", "6", "5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "8127 = 8 × 1015 + 7, so the remainder is 7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0149", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q148", "exam": "", "q": "A six-digit number 11p9q4 is divisible by 24. Then the greatest possible value of pq is ______.", "o": ["56", "42", "68", "32"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A number divisible by 24 must be divisible by 8 and by 3. For 8, the last three digits 9q4 must be divisible by 8. For 3, the digit sum 1 + 1 + p + 9 + q + 4 = 15 + p + q must be divisible by 3. Taking q = 8 (984 is divisible by 8) and p = 7 gives 15 + 7 + 8 = 30, which is divisible by 3. So p = 7, q = 8 and pq = 56.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0150", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q149", "exam": "", "q": "Which of the numbers 25560, 35751, 48168 and 49608 is NOT divisible by 24?", "o": ["35751", "48168", "25560", "49608"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Divisibility by 24 needs divisibility by 8 (last three digits) and by 3 (digit sum). 35751 is odd, so it is not divisible by 8 and hence not by 24. The others are divisible by 24.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0151", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q150", "exam": "", "q": "Which of the following numbers is NOT divisible by 11?", "o": ["1735624", "752563", "1904529", "1661308"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A number is divisible by 11 if the difference between the sum of digits in odd places and in even places is 0 or a multiple of 11. For 752563: (7 + 2 + 6) − (5 + 5 + 3) = 15 − 13 = 2, which is not a multiple of 11, so it is not divisible by 11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0152", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q151", "exam": "", "q": "Find the smallest number which when added to 888 gives a number completely divisible by 35.", "o": ["22", "21", "23", "20"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "888 + 22 = 910 = 35 × 26. So the smallest number is 22.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0153", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q152", "exam": "", "q": "846523X7Y is a 9-digit number divisible by 9, and Y − X = 6. Find the value of √(2X + 4Y).", "o": ["4", "6", "8", "2"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Y = X + 6. The digit sum is 8 + 4 + 6 + 5 + 2 + 3 + X + 7 + Y = 35 + X + Y = 41 + 2X, which must be a multiple of 9. This works for X = 2 (45), so Y = 8. Then √(2X + 4Y) = √(4 + 32) = √36 = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0154", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q153", "exam": "", "q": "How many of the numbers 5826, 5964, 6039, 6336, 6489, 6564, 6867 and 6960 are divisible by 3 but not by 9?", "o": ["5", "4", "6", "3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A number is divisible by 3 if its digit sum is, and by 9 if its digit sum is a multiple of 9. Digit sums: 5826 → 21, 5964 → 24, 6564 → 21, 6960 → 21 (divisible by 3 but not 9). 6039 → 18, 6336 → 18, 6489 → 27, 6867 → 27 are divisible by 9. So 4 numbers qualify.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0155", "ch": 3, "page": 21, "ansPage": 21, "srcNo": "Number System Q154", "exam": "", "q": "Which of the following numbers is divisible by 11?", "o": ["63962", "56923", "97174", "17295"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For 97174: (9 + 1 + 4) − (7 + 7) = 14 − 14 = 0, so it is divisible by 11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0156", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q155", "exam": "", "q": "Find the largest 5-digit number that is completely divisible by 88.", "o": ["99968", "99984", "99990", "99978"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A number divisible by 88 must be divisible by 8 and 11. 99968: the last three digits 968 ÷ 8 = 121 (divisible by 8), and (9 + 9 + 8) − (9 + 6) = 26 − 15 = 11, so it is divisible by 11. Hence 99968.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0157", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q156", "exam": "", "q": "Find the least value of * in the number 3*740 so that it is divisible by 12.", "o": ["2", "4", "0", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Divisible by 12 means divisible by 3 and 4. The last two digits 40 are divisible by 4. For 3, the digit sum 3 + * + 7 + 4 + 0 = 14 + * must be a multiple of 3. * = 1 gives 15, so the least value is 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0158", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q157", "exam": "", "q": "Find the largest two-digit number that is divisible by both 7 and 3.", "o": ["63", "96", "84", "91"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A number divisible by both 7 and 3 is divisible by 21. The largest two-digit multiple of 21 is 21 × 4 = 84.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0159", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q158", "exam": "", "q": "Find the smallest number that is exactly divisible by 9, 24 and 36.", "o": ["72", "24", "36", "9"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The LCM of 9, 24 and 36 is 72 (9 = 3², 24 = 2³ × 3, 36 = 2² × 3², so LCM = 2³ × 3² = 72).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0160", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q159", "exam": "", "q": "Find the remainder when 19^19 + 20 is divided by 18.", "o": ["3", "0", "2", "1"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "19 = 18 + 1, so 19^19 leaves remainder 1 on division by 18. Then 1 + 20 = 21 leaves remainder 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0161", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q160", "exam": "", "q": "If 8A5146B is divisible by 88, what is the value of A^B?", "o": ["27", "64", "12", "81"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "88 = 8 × 11. For divisibility by 8, the last three digits 46B must be divisible by 8, so B = 4 (464 = 8 × 58). For divisibility by 11: (8 + 5 + 4 + 4) − (A + 1 + 6) = 21 − (A + 7) = 14 − A must be 0 or a multiple of 11, which gives A = 3. So A^B = 3⁴ = 81.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0162", "ch": 3, "page": 22, "ansPage": 22, "srcNo": "Number System Q161", "exam": "", "q": "Which of the following numbers is NOT divisible by 15?", "o": ["2595", "3465", "2995", "3195"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A number divisible by 15 must be divisible by 3 and 5. 2995 ends in 5, but its digit sum 2 + 9 + 9 + 5 = 25 is not divisible by 3, so 2995 is not divisible by 15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0163", "ch": 3, "page": 23, "ansPage": 23, "srcNo": "Number System Q162", "exam": "", "q": "A number leaves remainder 31 when divided by 65. What remainder will the same number leave when divided by 13?", "o": ["7", "5", "3", "9"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The number is 65k + 31, and 65 is a multiple of 13, so the remainder on division by 13 is the same as for 31, which is 31 − 26 = 5. (The book takes the number 96 = 65 + 31 and gets 96 ÷ 13 = 7 remainder 5.)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0164", "ch": 3, "page": 23, "ansPage": 23, "srcNo": "Number System Q163", "exam": "", "q": "When a number is divided by 14 the remainder is 9. What is the remainder when the square of the same number is divided by 14?", "o": ["11", "9", "8", "10"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the number be 14K + 9. Its square is (14K)² + 2 × 14K × 9 + 81, so the remainder equals that of 81 ÷ 14. 81 = 14 × 5 + 11, so the remainder is 11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0165", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q164", "exam": "22.05.2024 S-II", "q": "What is the HCF of the smallest prime number and the smallest composite number?", "o": ["4", "3", "2", "5"],
