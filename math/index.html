"key": {"printed": [2], "verified": [2], "official": null}, "e": "The smallest prime is 2 and the smallest composite is 4. HCF(2, 4) = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0166", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q165", "exam": "09.06.2024 S-I", "q": "What is the HCF of two consecutive even numbers?", "o": ["1", "2", "3", "5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The HCF of two consecutive even numbers is always 2. For example, HCF(2, 4) = 2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-019", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0167", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q166", "exam": "09.06.2024 S-I", "q": "The HCF of (3² × 2 × 5) and (3² × 2² × 5) will be ______.", "o": ["90", "2700", "1800", "30"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "HCF takes the lowest power of each common prime: 3² × 2 × 5 = 90.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0168", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q167", "exam": "09.06.2024 S-I", "q": "The HCF of 124 and 24 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "124 = 2 × 2 × 31 and 24 = 2 × 2 × 2 × 3. The common factors are 2 × 2, so the HCF is 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0169", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q168", "exam": "09.06.2024 S-I", "q": "Which of the following is the prime factorisation of 54?", "o": ["2³ × 5²", "2¹ × 3³", "2² × 3⁴", "3² × 4³"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "54 = 2 × 3 × 3 × 3 = 2¹ × 3³.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0170", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q169", "exam": "23.05.2024 S-II", "q": "a × b = LCM(a, b) × HCF(a, b) is true only for ______.", "o": ["Two numbers", "Three numbers", "Four numbers", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The product of two numbers equals the product of their LCM and HCF. This relation holds only for two numbers.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-020", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0171", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q170", "exam": "23.05.2024 S-II", "q": "The LCM and HCF of (96, 404) are respectively ______.", "o": ["(9696, 4)", "(4, 9696)", "(9797, 5)", "(5, 9797)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "96 = 2⁵ × 3 and 404 = 2² × 101. LCM = 2⁵ × 3 × 101 = 9696 and HCF = 2² = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0172", "ch": 4, "page": 23, "ansPage": 23, "srcNo": "Number System Q171", "exam": "23.05.2024 S-II", "q": "Which of the following is a prime number?", "o": ["15", "23", "12", "75"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A prime number has exactly two factors, 1 and itself. 23 is prime. 15, 12 and 75 have other factors.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-011", "first": false, "kind": "exact", "of": "MTH-0047"}}, {"id": "MTH-0173", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q172", "exam": "23.05.2024 S-II", "q": "What is the highest power of 3 in the prime factorisation of 234?", "o": ["3", "4", "5", "2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "234 = 2 × 3 × 3 × 13 = 2 × 3² × 13. The highest power of 3 is 2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-021", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0174", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q173", "exam": "23.05.2024 S-I", "q": "If a = 2³ × 3, b = 2 × 3² × 5, c = 3 × 5ⁿ and LCM(a, b, c) = 2³ × 3² × 5, then n equals ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The LCM takes the highest power of each prime: 2³, 3² and 5^max(1, n). Since the LCM is 2³ × 3² × 5¹, the highest power of 5 is 1, so n = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0175", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q174", "exam": "24.05.2024 S-I", "q": "The HCF of 420 and 272 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "420 = 2 × 2 × 3 × 5 × 7 and 272 = 2 × 2 × 2 × 2 × 17. The common factors are 2 × 2, so the HCF is 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-022", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0176", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q175", "exam": "24.05.2024 S-I", "q": "If p and q are two prime numbers, their HCF is ______.", "o": ["2", "0", "1 or 2", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Two distinct prime numbers have no common factor other than 1, so their HCF is 1.", "tip": "", "status": "note", "note": "If p and q are the same prime, the HCF would be that prime. The printed key assumes two different primes.", "void": false}, {"id": "MTH-0177", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q176", "exam": "24.05.2024 S-I", "q": "If HCF(54, 78) = 6, what is the value of LCM(54, 78)?", "o": ["602", "720", "702", "804"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "LCM × HCF = product of the numbers, so LCM = 54 × 78 / 6 = 702. (54 = 6 × 9, 78 = 6 × 13, LCM = 6 × 9 × 13 = 702.)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0178", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q177", "exam": "22.05.2024 S-II", "q": "The statement 'the product of three numbers equals the product of their LCM and HCF' is ______.", "o": ["Correct", "Not correct", "Both are correct", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The relation holds for two numbers, but not in general for three or more. For 4, 6, 8 the product is 192 while LCM × HCF = 24 × 2 = 48. It does hold in special cases such as 1, 2, 3 (product 6 = LCM 6 × HCF 1).", "tip": "", "status": "note", "note": "The printed key is (c), based on the example of 1, 2, 3 where the relation happens to hold. In general the statement is not correct (see the same question at Q182, key (b)). Printed key retained.", "void": false}, {"id": "MTH-0179", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q178", "exam": "22.05.2024 S-II", "q": "If the HCF and LCM of two rational numbers are equal, the numbers must be ______.", "o": ["Prime", "Co-prime", "Composite", "Equal"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If two numbers are equal, their HCF and LCM are both that same number. Conversely, equal HCF and LCM force the numbers to be equal.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-023", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0180", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q179", "exam": "22.05.2024 S-I", "q": "The HCF of 272 and 148 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "272 = 2 × 2 × 2 × 2 × 17 and 148 = 2 × 2 × 37. HCF = 2 × 2 = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-024", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0181", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q180", "exam": "22.05.2024 S-I", "q": "For two positive integers c and d (c > d), what is HCF(c, d) when r = 0 in c = dq + r?", "o": ["cd", "d", "c", "r"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "By Euclid's division algorithm, c = dq + r. If r = 0, then d divides c, so HCF(c, d) = d.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0182", "ch": 4, "page": 24, "ansPage": 24, "srcNo": "Number System Q181", "exam": "22.05.2024 S-I", "q": "The LCM of two numbers a and 18 is 36 and their HCF is 2. The value of a is ______.", "o": ["2", "3", "4", "1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "First number × second number = LCM × HCF, so a × 18 = 36 × 2, giving a = 72/18 = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-025", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0183", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q182", "exam": "05.09.2023 S-IV", "q": "The product of three numbers is equal to the product of their LCM and HCF.", "o": ["Correct", "Not correct", "Both A and B are correct", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The product of three numbers is not equal to the product of their HCF and LCM in general. The equality holds for two numbers; for three it can hold only in special cases (for example when the numbers are co-prime in a particular way).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0184", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q183", "exam": "18.09.2023 S-V", "q": "What is the highest power of 3 in the prime factorisation of 234?", "o": ["3", "4", "5", "2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "234 = 2 × 3² × 13, so the highest power of 3 is 2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-021", "first": false, "kind": "exact", "of": "MTH-0173"}}, {"id": "MTH-0185", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q184", "exam": "18.09.2023 S-V", "q": "The HCF of 6 and 20 is ______.", "o": ["2", "6", "60", "20"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "6 = 2 × 3 and 20 = 2 × 2 × 5. The only common factor is 2, so the HCF is 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0186", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q185", "exam": "18.09.2023 S-V", "q": "The LCM of two numbers a and 18 is 36 and their HCF is 2. The value of a is ______.", "o": ["2", "3", "4", "1"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "a × 18 = LCM × HCF = 36 × 2, so a = 72/18 = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-025", "first": false, "kind": "exact", "of": "MTH-0182"}}, {"id": "MTH-0187", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q186", "exam": "05.09.2023 S-IV", "q": "a × b = LCM(a, b) × HCF(a, b) is true only for ______.", "o": ["Two numbers", "Three numbers", "Four numbers", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The product of two numbers equals the product of their LCM and HCF. This relation holds only for two numbers.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-020", "first": false, "kind": "exact", "of": "MTH-0170"}}, {"id": "MTH-0188", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q187", "exam": "05.09.2023 S-IV", "q": "The HCF of 148 and 124 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "148 = 2 × 2 × 37 and 124 = 2 × 2 × 31. The HCF is 2 × 2 = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0189", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q188", "exam": "05.09.2023 S-IV", "q": "The HCF of 420 and 272 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "420 = 2 × 2 × 3 × 5 × 7 and 272 = 2 × 2 × 2 × 2 × 17. HCF = 2 × 2 = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-022", "first": false, "kind": "exact", "of": "MTH-0175"}}, {"id": "MTH-0190", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q189", "exam": "05.09.2023 S-III", "q": "HCF(a, 1) = ?", "o": ["a", "1", "1/a", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The HCF of two or more numbers is the greatest common factor. The only common factor of a and 1 is 1, so HCF(a, 1) = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0191", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q190", "exam": "05.09.2023 S-III", "q": "The HCF of 272 and 148 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "272 = 2 × 2 × 2 × 2 × 17 and 148 = 2 × 2 × 37. HCF = 2 × 2 = 4.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-024", "first": false, "kind": "exact", "of": "MTH-0180"}}, {"id": "MTH-0192", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q191", "exam": "05.09.2023 S-III", "q": "The HCF of 4052 and 420 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "4052 = 2 × 2 × 1013 and 420 = 2 × 2 × 3 × 5 × 7. HCF = 2 × 2 = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0193", "ch": 4, "page": 25, "ansPage": 25, "srcNo": "Number System Q192", "exam": "05.09.2023 S-III", "q": "The HCF of 420 and 130 will be ______.", "o": ["10", "11", "12", "13"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "420 = 2 × 2 × 3 × 5 × 7 and 130 = 2 × 5 × 13. HCF = 2 × 5 = 10.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0194", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q193", "exam": "05.09.2023 S-III", "q": "The LCM and HCF of (96, 404) will be ______.", "o": ["(9696, 4)", "(4, 9696)", "(9797, 5)", "(5, 9797)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "96 = 2⁵ × 3 and 404 = 2² × 101. LCM = 2⁵ × 3 × 101 = 9696 and HCF = 2² = 4. So (LCM, HCF) = (9696, 4).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0195", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q194", "exam": "04.09.2023 S-II", "q": "The HCF of the smallest prime number and the smallest composite number is ______.", "o": ["4", "3", "2", "5"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The smallest prime number is 2 and the smallest composite number is 4. HCF(2, 4) = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0196", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q195", "exam": "04.09.2023 S-II", "q": "If the HCF and LCM of two rational numbers are equal, the numbers must be ______.", "o": ["Prime", "Co-prime", "Composite", "Equal"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If the HCF and LCM of two numbers are equal, the numbers themselves must be equal.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-023", "first": false, "kind": "exact", "of": "MTH-0179"}}, {"id": "MTH-0197", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q196", "exam": "04.09.2023 S-II", "q": "What is the HCF of two consecutive even numbers?", "o": ["1", "2", "3", "5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The HCF of two consecutive even numbers is always 2. For example, 2 = 1 × 2 and 4 = 2 × 2, so HCF(2, 4) = 2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-019", "first": false, "kind": "exact", "of": "MTH-0166"}}, {"id": "MTH-0198", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q197", "exam": "04.09.2023 S-I", "q": "In a = bq + r, HCF(a, b) = ?", "o": ["HCF(a, r)", "HCF(b, r)", "HCF(b, a)", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "By Euclid's division lemma, if a = bq + r then HCF(a, b) = HCF(b, r).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0199", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q198", "exam": "04.09.2023 S-I", "q": "The ratio of the LCM to the HCF of 5, 15 and 20 is ______.", "o": ["9 : 1", "4 : 3", "11 : 1", "12 : 1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "LCM of 5, 15, 20 = 60 and HCF = 5. The ratio is 60 : 5 = 12 : 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0200", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q199", "exam": "04.09.2023 S-I", "q": "If the HCF of 65 and 117 is expressible in the form 65m − 117, what is the value of m?", "o": ["1", "2", "3", "4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "65 = 5 × 13 and 117 = 3 × 3 × 13, so HCF = 13. Then 65m − 117 = 13 gives 65m = 130, so m = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0201", "ch": 4, "page": 26, "ansPage": 26, "srcNo": "Number System Q200", "exam": "04.09.2023 S-I", "q": "The HCF of 4052 and 12576 will be ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "By Euclid's division algorithm: 12576 = 3 × 4052 + 420; 4052 = 9 × 420 + 272; 420 = 1 × 272 + 148; 272 = 1 × 148 + 124; 148 = 1 × 124 + 24; 124 = 5 × 24 + 4; 24 = 6 × 4 + 0. The HCF is 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0202", "ch": 4, "page": 27, "ansPage": 27, "srcNo": "Number System Q201", "exam": "Haryana TGT 2020", "q": "Two numbers have 16 as their HCF and 146 as their LCM. Then one can say that:", "o": ["Many such pairs of numbers exist", "Only one such pair exists", "No such pair exists", "Only two such pairs exist"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The HCF must divide the LCM. Let the numbers be 16x and 16y with x and y co-prime. Then 16x × 16y = 16 × 146, so xy = 9.125, which cannot be true for positive integers. Also 146 is not a multiple of 16. So no such pair exists.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0203", "ch": 4, "page": 27, "ansPage": 27, "srcNo": "Number System Q202", "exam": "Haryana TGT 2020", "q": "What is the least number which, when subtracted from 22541, leaves a perfect square?", "o": ["17", "21", "31", "41"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "150² = 22500 and 151² = 22801. The largest perfect square not above 22541 is 22500, so the least number to subtract is 22541 − 22500 = 41.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0204", "ch": 4, "page": 27, "ansPage": 27, "srcNo": "Number System Q203", "exam": "Haryana TGT 2020", "q": "The sum and the difference of the LCM and HCF of two numbers are 592 and 518 respectively. If the sum of the numbers is 296, then the numbers are ______.", "o": ["107 and 111", "111 and 158", "111 and 185", "158 and 167"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let LCM = L and HCF = h. L + h = 592 and L − h = 518, so L = 555 and h = 37. The numbers are 37a and 37b with 37a + 37b = 296, so a + b = 8 with a, b co-prime: (3, 5). The numbers are 111 and 185. Check: LCM × HCF = 555 × 37 = 20535 = 111 × 185.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0205", "ch": 4, "page": 27, "ansPage": 27, "srcNo": "Number System Q204", "exam": "Haryana TGT 2019", "q": "If HCF(56, 72) = 56x + 72y, then x and y are equal to ______.", "o": ["x = 4, y = 3", "x = −4, y = 3", "x = 4, y = −3", "x = −4, y = −3"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "72 = 56 + 16, 56 = 16 × 3 + 8, 16 = 8 × 2, so HCF = 8. Then 8 = 56 − 16 × 3 = 56 − (72 − 56) × 3 = 56 × 4 + 72 × (−3). So x = 4 and y = −3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0206", "ch": 4, "page": 27, "ansPage": 27, "srcNo": "Number System Q205", "exam": "UP TGT-2016 (08-03-2019)", "q": "The factorisation of x³ − y³ is ______.", "o": ["(x + y)(x² − xy + y²)", "(x − y)(x² − xy + y²)", "(x − y)(x² − xy − y²)", "(x − y)(x² + xy + y²)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "By the identity, x³ − y³ = (x − y)(x² + xy + y²).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0207", "ch": 4, "page": 27, "ansPage": 27, "srcNo": "Number System Q206", "exam": "NVS PGT 10-06-2019", "q": "The least common multiple of 119 and 272 is ______.", "o": ["1904", "119", "102", "272"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "119 = 7 × 17 and 272 = 2 × 2 × 2 × 2 × 17. LCM = 16 × 7 × 17 = 1904.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0208", "ch": 4, "page": 27, "ansPage": 28, "srcNo": "Number System Q207", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "Three numbers are in the ratio 3 : 5 : 9. If their LCM is 810, what is their HCF?", "o": ["18", "6", "15", "12"], "key": {"printed": [1], "verified": [0], "official": null}, "e": "Let the numbers be 3x, 5x and 9x. Their LCM is 45x = 810, so x = 18, and the HCF of 3x, 5x, 9x is x = 18.", "tip": "", "status": "disputed", "note": "The printed key is (b), but the printed solution itself ends with HCF = 18, which is option (a). Printed key retained; verified answer (a).", "void": false}, {"id": "MTH-0209", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q208", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "The HCF of two numbers is 36 and their sum is 1260. If both numbers are three-digit numbers, how many pairs of such numbers are possible?", "o": ["10", "5", "7", "4"], "key": {"printed": [0], "verified": [2], "official": null}, "e": "Let the numbers be 36x and 36y. Then 36(x + y) = 1260, so x + y = 35. The book lists the pairs (17,18), (15,20), (16,19), (14,21), (13,22), (12,23), (11,24), (10,25), (9,26), (8,27) and counts 10.", "tip": "", "status": "disputed", "note": "For the HCF to be exactly 36, x and y must be co-prime, which removes (15,20), (14,21) and (10,25). That leaves 7 pairs (option c). The printed key (a) counts all 10 listed pairs. Printed key retained; verified answer (c).", "void": false}, {"id": "MTH-0210", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q209", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The number of positive divisors of 252 is ______.", "o": ["5", "9", "10", "18"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "252 = 2² × 3² × 7. The number of positive divisors is (2 + 1)(2 + 1)(1 + 1) = 18.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0211", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q210", "exam": "UP PCS (Pre) 1994", "q": "The product of two positive integers is 24 and their greatest common divisor is 2. Their least common multiple is ______.", "o": ["12", "24", "1", "2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Product of the numbers = LCM × HCF, so 24 = LCM × 2 and LCM = 12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0212", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q211", "exam": "TGT 2013", "q": "The factors of x⁴ + x² + 25 = 0 are ______.", "o": ["(x² + 3x + 5)(x² − 3x + 5)", "(x² + 3x + 5)(x² + 3x − 5)", "(x² + x + 5)(x² − x + 5)", "(x² + x + 5)(x² − x − 5)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "x⁴ + x² + 25 = (x² + 5)² − 9x² = (x² + 5)² − (3x)² = (x² + 5 + 3x)(x² + 5 − 3x).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0213", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q212", "exam": "TGT 2009", "q": "The HCF of x² + x − 6 and x² − x − 6 is ______.", "o": ["x − 2", "x − 3", "x + 3", "1"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "x² + x − 6 = (x + 3)(x − 2) and x² − x − 6 = (x − 3)(x + 2). They share no common factor other than 1, so the HCF is 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0214", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q213", "exam": "", "q": "The product of the successor and predecessor of 999 is ______.", "o": ["999000", "998000", "989000", "998"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The predecessor is 998 and the successor is 1000. Their product is 998 × 1000 = 998000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0215", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q214", "exam": "", "q": "How many numbers between 300 and 400 leave no remainder when divided by 6, 12 and 16?", "o": ["720", "764", "586", "632"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "LCM(6, 12, 16) = 48. The multiples of 48 between 300 and 400 are 336 and 384. Their sum is 336 + 384 = 720.", "tip": "", "status": "note", "note": "The question as printed asks 'how many' but the options and the printed solution give the SUM of such numbers (720). Printed key (a) retained.", "void": false}, {"id": "MTH-0216", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q215", "exam": "", "q": "Which of the following is a factor of (mx + n)?", "o": ["m²x² + 2nx + n²", "m²x² + 2nx + n²", "m²x² + 2mnx + n²", "m²x² + 2mx + n²"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "(mx + n)² = m²x² + 2mnx + n². The given expression in option (c) is therefore a multiple of (mx + n), i.e. (mx + n) is a factor of it.", "tip": "", "status": "note", "note": "Options (a) and (b) are printed identically in the source.", "void": false}, {"id": "MTH-0217", "ch": 4, "page": 28, "ansPage": 28, "srcNo": "Number System Q216", "exam": "", "q": "If y is an integer, then (y³ − y) is always a multiple of ______.", "o": ["5", "7", "9", "6"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "y³ − y = y(y − 1)(y + 1) = (y − 1)y(y + 1), a product of three consecutive integers, which is always divisible by 3! = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0218", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q217", "exam": "", "q": "How many multiples of 7 from 1 to 100 are not multiples of 4?", "o": ["14", "11", "10", "12"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "There are 14 multiples of 7 up to 100. The LCM of 7 and 4 is 28, and 3 numbers (28, 56, 84) are multiples of both. So 14 − 3 = 11 are multiples of 7 but not of 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0219", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q218", "exam": "", "q": "In the product (30)^5 × (24)^5, find the number of prime factors.", "o": ["45", "10", "35", "30"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "30^5 × 24^5 = (2×3×5)^5 × (2³×3)^5 = 2^20 × 3^10 × 5^5. The number of prime factors (counting repeats) is 20 + 10 + 5 = 35.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0220", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q219", "exam": "", "q": "Which of the following statements is/are true?\nI. 72 has 12 positive factors in total.\nII. The sum of the first 20 odd numbers is 400.\nIII. The largest two-digit prime number is 97.", "o": ["Only I and II", "Only II and III", "Only I and III", "All are true"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "I. 72 = 2³ × 3², so it has (3 + 1)(2 + 1) = 12 factors. II. The sum of the first n odd numbers is n², so for n = 20 it is 400. III. 97 is the largest two-digit prime. All three are true.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0221", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q220", "exam": "", "q": "How many factors does 3600 have?", "o": ["42", "44", "45", "43"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "3600 = 2⁴ × 3² × 5². The number of factors is (4 + 1)(2 + 1)(2 + 1) = 5 × 3 × 3 = 45.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0222", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q221", "exam": "", "q": "(8^2k + 5^2k) has a factor, where k is an odd number:", "o": ["88", "84", "89", "86"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For odd k, take k = 1: 8² + 5² = 64 + 25 = 89. In general (8²)^k + (5²)^k = 64^k + 25^k is divisible by 64 + 25 = 89 when k is odd.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0223", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q222", "exam": "", "q": "The sum of two numbers is 7 and their product is 12. What is the sum of their reciprocals?", "o": ["7/12", "8/15", "7/13", "12/7"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "1/a + 1/b = (a + b)/ab = 7/12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0224", "ch": 4, "page": 29, "ansPage": 29, "srcNo": "Number System Q223", "exam": "", "q": "How many positive factors does 333 have?", "o": ["5", "8", "6", "9"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "333 = 3² × 37. The number of positive factors is (2 + 1)(1 + 1) = 6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0225", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q224", "exam": "", "q": "Find the largest number which, when it divides 627, 15630 and 3128, leaves remainders 2, 5 and 3 respectively.", "o": ["775", "625", "1225", "650"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The required number is the HCF of (627 − 2), (15630 − 5) and (3128 − 3), that is HCF(625, 15625, 3125) = 625.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0226", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q225", "exam": "", "q": "Find the smallest number which, when divided by 15, 25, 35 and 40, leaves remainders 10, 20, 30 and 35 respectively.", "o": ["4210", "4200", "4205", "4195"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In each case the divisor minus the remainder is 5 (15 − 10, 25 − 20, 35 − 30, 40 − 35). So the number is LCM − 5. LCM(15, 25, 35, 40) = 5 × 3 × 5 × 7 × 8 = 4200, and the number is 4200 − 5 = 4195.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0227", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q226", "exam": "", "q": "What is the greatest number which, when it divides 2036 and 233, leaves remainders 12 and 13 respectively?", "o": ["36", "44", "42", "46"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The numbers are 2036 − 12 = 2024 and 233 − 13 = 220. HCF(2024, 220) = 2 × 2 × 11 = 44.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0228", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q227", "exam": "", "q": "Find the smallest three-digit number which, when 5 is added to it, is exactly divisible by 12, 14 and 18.", "o": ["240", "225", "247", "245"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The smallest number divisible by 12, 14 and 18 is their LCM = 252. The required number is 252 − 5 = 247.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0229", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q228", "exam": "", "q": "Find the LCM of the fractions 2/5, 3/7 and 4/9.", "o": ["2/315", "1/315", "24", "12"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "LCM of fractions = LCM of numerators / HCF of denominators = LCM(2, 3, 4)/HCF(5, 7, 9) = 12/1 = 12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0230", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q229", "exam": "", "q": "If A = 2³ × 3⁷, B = 2⁷ × 3⁵ and C = 2⁸ × 3⁴, find the LCM of A, B and C.", "o": ["2⁶ × 3⁷", "2⁷ × 3⁷", "2⁹ × 3⁷", "2⁸ × 3⁷"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The LCM takes the highest power of each prime: 2⁸ and 3⁷, so LCM = 2⁸ × 3⁷.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0231", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q230", "exam": "", "q": "What is the LCM of 96, 136 and 504?", "o": ["25872", "28564", "34272", "36548"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "96 = 2⁵ × 3, 136 = 2³ × 17, 504 = 2³ × 3² × 7. LCM = 2⁵ × 3² × 7 × 17 = 34272.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0232", "ch": 4, "page": 30, "ansPage": 30, "srcNo": "Number System Q231", "exam": "", "q": "Find the LCM of 1.2 and 2.7.", "o": ["5.4", "10.8", "32.4", "7.08"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Convert to fractions: 1.2 = 12/10 and 2.7 = 27/10. LCM of fractions = LCM(12, 27)/HCF(10, 10) = 108/10 = 10.8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0233", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q232", "exam": "", "q": "The product of two numbers is 1500 and their HCF is 10. The number of possible such pairs is/are ______.", "o": ["1", "3", "4", "2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "LCM × HCF = product, so LCM = 150. Let the numbers be 10a and 10b with a, b co-prime and ab = 15. The co-prime pairs are (3, 5) and (1, 15), so there are 2 pairs.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0234", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q233", "exam": "", "q": "The LCM of x² − 8x + 15 and x² − 5x + 6 is ______.", "o": ["(x − 6)²(x + 1)(x − 3)", "(x + 6)(x + 1)(x − 3)", "(x − 6)(x + 1)(x − 3)", "(x − 2)(x − 3)(x − 5)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "x² − 8x + 15 = (x − 3)(x − 5) and x² − 5x + 6 = (x − 2)(x − 3). The LCM is (x − 2)(x − 3)(x − 5).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0235", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q234", "exam": "", "q": "What is the LCM of 3.6, 1.8 and 0.144?", "o": ["36", "3600", "3.6", "360"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Write the numbers as fractions: 3600/1000, 1800/1000, 144/1000. LCM = LCM of numerators / HCF of denominators = 3600/1000 = 3.6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0236", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q235", "exam": "", "q": "Find the LCM of 2/3, 4/7 and 9/13.", "o": ["28", "36", "12", "15"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "LCM of fractions = LCM(2, 4, 9)/HCF(3, 7, 13) = 36/1 = 36.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0237", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q236", "exam": "", "q": "The LCM of two numbers x and y (where x > y) is 253. What is the difference between x and y?", "o": ["11", "14", "12", "16"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "253 has only the prime factors 11 and 23, so the numbers are 23 and 11 (253 = 11 × 23). With x > y, x = 23 and y = 11, and x − y = 12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0238", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q237", "exam": "", "q": "There is a number greater than 1 that leaves remainder 3 on division by each of 4, 5 and 6. Find the largest such number less than 500.", "o": ["493", "483", "486", "484"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "LCM(4, 5, 6) = 60, so the numbers are 60k + 3. The largest below 500 is 480 + 3 = 483.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0239", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q238", "exam": "", "q": "Find the smallest number which is a perfect square and is divisible by each of 15, 24 and 36.", "o": ["900", "1600", "6400", "3600"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "LCM(15, 24, 36) = 2³ × 3² × 5 = 360. To make it a perfect square, every prime needs an even power, so multiply by 2 × 5 = 10, giving 3600 = 60².", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0240", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q239", "exam": "", "q": "Find the smallest number that is exactly divisible by 5, 6, 8, 10 and 12.", "o": ["180", "240", "120", "150"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The required number is the LCM of 5, 6, 8, 10 and 12, which is 120.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0241", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q240", "exam": "", "q": "Let x be the smallest number that is divisible by 13 but leaves remainder 2 each time it is divided by 4, 5, 6, 7, 8 and 12. Find the sum of the digits of x.", "o": ["8", "10", "11", "9"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "LCM(4, 5, 6, 7, 8, 12) = 840, so the numbers are 840k + 2. We need one divisible by 13: 840 × 3 + 2 = 2522 = 13 × 194. So x = 2522 and the digit sum is 2 + 5 + 2 + 2 = 11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0242", "ch": 4, "page": 31, "ansPage": 31, "srcNo": "Number System Q241", "exam": "", "q": "Find the HCF of the three numbers 98, 175 and 210.", "o": ["7", "3", "5", "6"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "98 = 2 × 7 × 7, 175 = 5 × 5 × 7 and 210 = 2 × 3 × 5 × 7. The only common factor is 7, so the HCF is 7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0243", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q242", "exam": "", "q": "Find the HCF of 12/5, 14/15 and 16/17.", "o": ["1/255", "2/255", "3/255", "4/255"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "HCF of fractions = HCF of numerators / LCM of denominators = HCF(12, 14, 16)/LCM(5, 15, 17) = 2/255.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0244", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q243", "exam": "", "q": "Two numbers are in the ratio 3 : 5. If their HCF is 8, find the two numbers.", "o": ["36 and 60", "48 and 80", "12 and 20", "24 and 40"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the numbers be 3x and 5x with HCF x. Given x = 8, the numbers are 3 × 8 = 24 and 5 × 8 = 40.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0245", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q244", "exam": "", "q": "P = 2⁵ × 3⁸ and Q = 2³ × 3^K. If the HCF of P and Q is 2³ × 3³, find the value of K.", "o": ["5", "3", "2", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The HCF takes the lower power of each prime. For 3 the HCF has the power 3, and P has 3⁸, so Q must have 3^K with K = 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0246", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q245", "exam": "", "q": "Find the HCF of (4^315 − 1) and (4^25 − 1).", "o": ["(4^25 − 1)", "1023", "1024", "1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "HCF(a^m − 1, a^n − 1) = a^HCF(m, n) − 1. HCF(315, 25) = 5, so the HCF is 4⁵ − 1 = 1024 − 1 = 1023.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0247", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q246", "exam": "", "q": "If the HCF of 341, 434 and 620 is x, then x lies between ______.", "o": ["30 and 35", "25 and 30", "35 and 40", "40 and 45"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "341 = 11 × 31, 434 = 14 × 31 and 620 = 20 × 31. Their HCF is 31, which lies between 30 and 35.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0248", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q247", "exam": "", "q": "Four numbers are in the ratio 2 : 3 : 5 : 7 and their HCF is 6. What is the sum of the squares of the largest and the smallest numbers?", "o": ["486", "1908", "54", "324"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The numbers are 2x, 3x, 5x and 7x with HCF x = 6. The largest is 7x and the smallest is 2x, so the sum of squares is (7x)² + (2x)² = 53x² = 53 × 36 = 1908.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0249", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q248", "exam": "", "q": "Find the HCF of 4/5, 6/8 and 8/25.", "o": ["1/5", "1/50", "1/100", "1/200"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "HCF of fractions = HCF(4, 6, 8)/LCM(5, 8, 25) = 2/200 = 1/100.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0250", "ch": 4, "page": 32, "ansPage": 32, "srcNo": "Number System Q249", "exam": "", "q": "The sum of two numbers is 342 and their HCF is 19. How many pairs of such numbers can be formed?", "o": ["3", "6", "2", "4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the numbers be 19x and 19y. Then 19(x + y) = 342, so x + y = 18 with x and y co-prime. The pairs are (1, 17), (5, 13) and (7, 11), so there are 3 pairs.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0251", "ch": 4, "page": 32, "ansPage": 33, "srcNo": "Number System Q250", "exam": "", "q": "The HCF of two numbers is 5 and their LCM is 120. If the sum of the two numbers is 55, find the sum of their reciprocals.", "o": ["601/55", "120/11", "11/120", "55/601"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The product of the numbers is 5 × 120 = 600, and their sum is 55. The sum of reciprocals is (x + y)/xy = 55/600 = 11/120.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0252", "ch": 4, "page": 33, "ansPage": 33, "srcNo": "Number System Q251", "exam": "", "q": "If K1 and K2 are two different prime numbers, what is the product of the HCF and LCM of K1 and K2?", "o": ["1", "K1/K2", "K1 + K2", "K1 × K2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For two different primes, HCF = 1 and LCM = K1 × K2. So the product of the HCF and LCM is 1 × K1 × K2 = K1 × K2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0253", "ch": 4, "page": 33, "ansPage": 33, "srcNo": "Number System Q252", "exam": "", "q": "The LCM of two positive numbers is 13 times their HCF. The sum of the HCF and LCM is 252. If one of them is 54, find the other number.", "o": ["68", "63", "73", "78"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let HCF = H, so LCM = 13H and H + 13H = 252, giving H = 18 and LCM = 234. The product of the numbers is H × L = 18 × 234, so the other number = 18 × 234/54 = 78.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0254", "ch": 4, "page": 33, "ansPage": 33, "srcNo": "Number System Q253", "exam": "", "q": "x and y have LCM and HCF of 165, 297 and 495 respectively (x is the LCM, y is the HCF). Find the value of x/y.", "o": ["45", "55", "75", "15"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "165 = 3 × 5 × 11, 297 = 3³ × 11, 495 = 3² × 5 × 11. HCF y = 3 × 11 = 33. LCM x = 3³ × 5 × 11 = 1485. So x/y = 1485/33 = 45.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0255", "ch": 4, "page": 33, "ansPage": 33, "srcNo": "Number System Q254", "exam": "", "q": "The sum of two numbers is 140. If their LCM is 240 and HCF is 20, find the smaller number.", "o": ["60", "140", "20", "80"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the numbers be 20x and 20y. 20(x + y) = 140 gives x + y = 7. 20xy = 240 gives xy = 12, so (x, y) = (3, 4). The smaller number is 20 × 3 = 60.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0256", "ch": 4, "page": 33, "ansPage": 34, "srcNo": "Number System Q255", "exam": "", "q": "The LCM of two numbers is 12 times their HCF. If one number is 15 and the sum of the HCF and LCM is 65, find the other number.", "o": ["42", "25", "30", "20"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let HCF = x, so LCM = 12x and x + 12x = 65, giving x = 5 and LCM = 60. The other number = LCM × HCF / first number = 60 × 5/15 = 20.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0257", "ch": 4, "page": 34, "ansPage": 34, "srcNo": "Number System Q256", "exam": "", "q": "The LCM and HCF of two numbers are 30 and 5 respectively. If their sum is 25, find the difference between the two numbers.", "o": ["15", "10", "25", "5"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the numbers be 5a and 5b. Then 5ab = 30 gives ab = 6 and 5a + 5b = 25 gives a + b = 5. (a − b)² = (a + b)² − 4ab = 25 − 24 = 1, so a − b = 1 and the difference of the numbers is 5.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0258", "ch": 4, "page": 34, "ansPage": 34, "srcNo": "Number System Q257", "exam": "", "q": "What is the LCM of the HCF of 2/3 and 3/4 and the LCM of 5/6 and 7/8?", "o": ["1/2", "35/2", "1/12", "33/12"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "HCF(2/3, 3/4) = HCF(2, 3)/LCM(3, 4) = 1/12. LCM(5/6, 7/8) = LCM(5, 7)/HCF(6, 8) = 35/2. Then LCM(1/12, 35/2) = LCM(1, 35)/HCF(12, 2) = 35/2.", "tip": "", "status": "note", "note": "The second pair of fractions is hard to read in the source stem; it is taken as 5/6 and 7/8, which matches the printed solution that uses HCF(6, 8).", "void": false}, {"id": "MTH-0259", "ch": 4, "page": 34, "ansPage": 34, "srcNo": "Number System Q258", "exam": "", "q": "If x * y means the HCF of x and y, and x @ y means the LCM of x and y, find the value of (72 * 84) @ 144.", "o": ["144", "504", "210", "420"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "72 * 84 = HCF(72, 84) = 12. Then 12 @ 144 = LCM(12, 144) = 144.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0260", "ch": 4, "page": 34, "ansPage": 34, "srcNo": "Number System Q259", "exam": "", "q": "The LCM of two numbers is 231 and their HCF is 11. If the first number is 77, find the second number.", "o": ["47", "37", "57", "33"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "LCM × HCF = product of the numbers, so 231 × 11 = 77 × second, giving second = 231 × 11/77 = 33.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0261", "ch": 4, "page": 34, "ansPage": 34, "srcNo": "Number System Q260", "exam": "", "q": "The LCM and HCF of two numbers are 60 and 3 respectively. If their difference is 3, find the sum of the two numbers.", "o": ["24", "35", "27", "21"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the numbers be 3x and 3x + 3. Their product = LCM × HCF = 180, so 3x(3x + 3) = 180, giving x² + x − 20 = 0, so x = 4. The numbers are 12 and 15, and their sum is 27.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0262", "ch": 5, "page": 34, "ansPage": 35, "srcNo": "Number System Q261", "exam": "23.05.2024 S-II", "q": "In a test of 50 questions, 2 marks are given for each correct answer and 1/2 mark is deducted for each wrong answer. A candidate attempted all the questions and scored 40 marks. How many questions did the candidate answer correctly?", "o": ["24", "26", "22", "20"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let x be the number of correct answers; the wrong answers are 50 − x. Then 2x − (1/2)(50 − x) = 40, so 4x − (50 − x) = 80, giving 5x = 130 and x = 26.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0263", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q262", "exam": "23.05.2024 S-II", "q": "The simplest form of 387/405 is ______.", "o": ["43/45", "41/25", "9/25", "129/135"], "key": {"printed": [3], "verified": [0], "official": null}, "e": "The printed solution gives 387/405 = 129/135.", "tip": "", "status": "disputed", "note": "387/405 divided by 9 is 43/45, which is the simplest form (option a). 129/135 is not in simplest form. The same question at Q86 prints key (a) and notes that the Commission accepted (d). Printed key (d) retained; verified answer (a).", "void": false, "dup": {"group": "DUP-017", "first": false, "kind": "exact", "of": "MTH-0087"}}, {"id": "MTH-0264", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q263", "exam": "24.05.2024 S-I", "q": "Any odd integer is of the form ______, where q is an integer.", "o": ["6q + 5", "6q + 5 × 0", "6q + 5 × 2", "6q + 3 × 2"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A number multiplied by an even number stays even and adding an odd number to an even number gives an odd number. So 6q + 5 is always an odd integer.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0265", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q264", "exam": "22.05.2024 S-II", "q": "For what value of n will 4ⁿ be zero?", "o": ["n = 2", "n = 0", "There is no such number n", "n = ∞"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "4ⁿ can never be zero for any real value of n, so no such n exists.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0266", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q265", "exam": "22.05.2024 S-II", "q": "0.105 can be written in the form p/(2ⁿ × 5ᵐ) as ______.", "o": ["12/(2⁴ × 5⁰)", "23/(2³ × 5³)", "21/(2³ × 5²)", "9/(2⁰ × 5²)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "0.105 = 105/1000 = 21/200 = 21/(2³ × 5²).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-026", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0267", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q266", "exam": "22.05.2024 S-I", "q": "If (x + 1)/x + x/(x + 1) = 2 1/2, then x = ?", "o": ["2 or −1", "−2 or 1", "−2 or −1", "2 or 1"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the equation be ((x+1)² + x²)/(x(x+1)) = 5/2. This gives 2(2x² + 2x + 1) = 5x² + 5x, so x² + x − 2 = 0, which factors as (x + 2)(x − 1) = 0. Hence x = −2 or x = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0268", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q267", "exam": "04.09.2023 S-II", "q": "The product of the smallest prime number and the smallest composite number is ______.", "o": ["10", "6", "8", "4"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The smallest composite number is 4 and the smallest prime is 2, so the product is 4 × 2 = 8.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-007", "first": false, "kind": "exact", "of": "MTH-0021"}}, {"id": "MTH-0269", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q268", "exam": "", "q": "A whole number is added to 25 and the same number is subtracted from 25. The sum of the two results is ______.", "o": ["0", "25", "50", "75"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the number be x. The sum of the two results is (25 + x) + (25 − x) = 50.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0270", "ch": 5, "page": 35, "ansPage": 35, "srcNo": "Number System Q269", "exam": "05.09.2023 S-III", "q": "The sum of the first 20 odd natural numbers is ______.", "o": ["100", "210", "400", "420"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The sum of the first n odd natural numbers is n². For n = 20 the sum is 20² = 400.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-008", "first": false, "kind": "exact", "of": "MTH-0022"}}, {"id": "MTH-0271", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q270", "exam": "14.09.2020 S-I", "q": "If X = 2, then the value of X + √(X + √(X + √(X + ...))) is ______.", "o": ["1 or 2", "2", "1 or 4", "4"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let y = X + √(X + √(X + ...)). Then y = X + √y, so (y − X)² = y. With X = 2: (y − 2)² = y, so y² − 5y + 4 = 0, giving y = 1 or 4. Since y must be greater than X = 2, y = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0272", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q271", "exam": "10.09.2020 S-I", "q": "The sequence √2, √(2√2), √(2√(2√2)), ... is ______.", "o": ["Convergent", "Divergent", "Neither convergent nor divergent", "Oscillatory"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The nth term is 2^(1 − 1/2ⁿ). As n → ∞, 1/2ⁿ → 0 and the term tends to 2¹ = 2. The sequence has a finite limit, so it is convergent.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0273", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q272", "exam": "", "q": "Find the arithmetic mean between (a − b) and (a + b).", "o": ["a", "b", "a + b", "a − b"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "AM = ((a − b) + (a + b))/2 = 2a/2 = a.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0274", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q273", "exam": "", "q": "What should be added to −1/2 to obtain the nearest natural number?", "o": ["2/3", "3/2", "1/2", "1/3"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The nearest natural number is 1. −1/2 + 3/2 = 1, so 3/2 should be added. (The other options give −1/2 + 2/3 = 1/6, −1/2 + 1/2 = 0 and −1/2 + 1/3 = −1/6.)", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0275", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q274", "exam": "UP TGT-2016 (08-03-2019)", "q": "10² + 11² + 12² + ... + 19² is equal to ______.", "o": ["1580", "2010", "2121", "2185"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Sum of squares of the first n natural numbers is n(n + 1)(2n + 1)/6. For n = 19: 19 × 20 × 39/6 = 2470. For n = 9: 9 × 10 × 19/6 = 285. The required sum is 2470 − 285 = 2185.", "tip": "", "status": "note", "note": "The printed solution shows intermediate values 14820/6 − 1710/6 = 13110/6 = 2185; these are the same quantities.", "void": false}, {"id": "MTH-0276", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q275", "exam": "UP PGT-2016 (02-02-2019)", "q": "1³ − 2³ + 3³ − 4³ + ... − 10³ + 11³ is equal to ______.", "o": ["512", "756", "848", "954"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Add the cubes of the odd numbers: 1³ + 3³ + 5³ + 7³ + 9³ + 11³ = 1 + 27 + 125 + 343 + 729 + 1331 = 2556. Subtract the cubes of the even numbers: 2³ + 4³ + 6³ + 8³ + 10³ = 8 + 64 + 216 + 512 + 1000 = 1800. Result: 2556 − 1800 = 756.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0277", "ch": 5, "page": 36, "ansPage": 36, "srcNo": "Number System Q276", "exam": "PGT 2011", "q": "The sum of the first n natural numbers is 1/5 times the sum of their squares. Then the value of n is ______.", "o": ["5", "6", "7", "8"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "n(n + 1)/2 = (1/5) × n(n + 1)(2n + 1)/6. This gives 1/2 = (2n + 1)/30, so 2n + 1 = 15 and n = 7.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0278", "ch": 5, "page": 37, "ansPage": 37, "srcNo": "Number System Q277", "exam": "TGT 2011", "q": "The sum of n terms of the series 1/(√3 + √7) + 1/(√7 + √11) + 1/(√11 + √15) + ... is ______.", "o": ["(√(3 + 4n) + √3)/n", "n/(√(3 + 4n) + √3)", "√(3 + 4n) + √3", "1/(√(3 + 4n) + √3)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Rationalise each term: 1/(√3 + √7) = (√7 − √3)/4, and so on. The sum telescopes to (1/4)(√(3 + 4n) − √3). Multiplying and dividing by (√(3 + 4n) + √3) gives (1/4) × (4n)/(√(3 + 4n) + √3) = n/(√(3 + 4n) + √3).", "tip": "", "status": "note", "note": "Option (c) is not clearly legible in the source scan.", "void": false}, {"id": "MTH-0279", "ch": 5, "page": 37, "ansPage": 37, "srcNo": "Number System Q278", "exam": "", "q": "What is the value of 99 11/99 + 99 13/99 + 99 15/99 + ... + 99 67/99?", "o": ["95120/33", "96220/33", "94220/33", "97120/33"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The terms 11, 13, ..., 67 form an AP with 29 terms. The sum is 29 × 99 + (11 + 13 + ... + 67)/99 = 2871 + (29/2)(11 + 67)/99 = 2871 + 1131/99 = 95120/33.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0280", "ch": 5, "page": 37, "ansPage": 37, "srcNo": "Number System Q279", "exam": "", "q": "What is the sum of the first 20 terms of the given series? 1 × 2 + 2 × 3 + 3 × 4 + 4 × 5 + ...", "o": ["3080", "3160", "3240", "2940"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The nth term is n(n + 1) = n² + n. The sum of 20 terms = Σn² + Σn = 20 × 21 × 41/6 + 20 × 21/2 = 2870 + 210 = 3080.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0281", "ch": 5, "page": 37, "ansPage": 37, "srcNo": "Number System Q280", "exam": "", "q": "What is the sum of all terms common to both series S1 and S2? S1 = 2, 9, 16, ..., 632 and S2 = 7, 11, 15, ..., 743.", "o": ["6860", "7140", "6974", "6750"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "S1 has common difference 7 and S2 has common difference 4. The common terms form an AP starting at 23 (the first common term, 23 = 2 + 7×3 = 7 + 4×4) with common difference LCM(7, 4) = 28. The last common term below 632 is 611. Number of terms n = (611 − 23)/28 + 1 = 22. Sum = (22/2)(23 + 611) = 11 × 634 = 6974.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0282", "ch": 5, "page": 37, "ansPage": 38, "srcNo": "Number System Q281", "exam": "", "q": "What is the value of 1 + 3 + 5 + 7 + ... + (2n − 1)?", "o": ["(2n − 1) × (2n − 1)", "n × n", "n/2", "n(n + 1)/2"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "This is an AP with a = 1 and d = 2. The sum of n terms is (n/2)[2 × 1 + (n − 1) × 2] = (n/2) × 2n = n × n.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0283", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q282", "exam": "", "q": "What is the sum of the first 40 terms of 1 + 3 + 4 + 5 + 7 + 7 + 10 + 9 + ...?", "o": ["1010", "1115", "1030", "1031"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The series interleaves two APs: 1, 4, 7, 10, ... (first 20 terms) and 3, 5, 7, 9, ... (first 20 terms). Sum of the first = (20/2)[2 × 1 + 19 × 3] = 590. Sum of the second = (20/2)[2 × 3 + 19 × 2] = 440. Total = 590 + 440 = 1030.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0284", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q283", "exam": "SSC CGL (Tier-II) 2019, 18/11/2020", "q": "1/15 + 1/35 + 1/63 + 1/99 + 1/143 = ?", "o": ["5/39", "7/39", "4/39", "10/39"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Each term is 1/((2k+1)(2k+3)) = (1/2)(1/(2k+1) − 1/(2k+3)). The sum telescopes: (1/2)(1/3 − 1/13) = (1/2)(10/39) = 5/39.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0285", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q284", "exam": "", "q": "If P = 2² + 6² + 10² + 14² + ... + 94² and Q = 1² + 5² + 9² + ... + 81², what is the value of P − Q?", "o": ["24645", "26075", "29317", "31515"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Pair the terms: (2² − 1²) + (6² − 5²) + (10² − 9²) + ... = 3 + 11 + 19 + ... + 163, an AP with a = 3, d = 8 and 21 terms; its sum is (21/2)(3 + 163) = 1743. The remaining terms of P are 86² + 90² + 94² = 7396 + 8100 + 8836 = 24332. So P − Q = 1743 + 24332 = 26075.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0286", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q285", "exam": "", "q": "Which of the following fractions is the smallest? 5/11, 7/12, 8/13, 9/17", "o": ["5/11", "7/12", "8/13", "9/17"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Converting to decimals: 5/11 ≈ 0.45, 7/12 ≈ 0.58, 8/13 ≈ 0.61, 9/17 ≈ 0.52. The smallest is 5/11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0287", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q286", "exam": "", "q": "Which of the following is the largest? 11/12, 3/4, 10/11", "o": ["11/12", "3/4", "10/11", "All are equal"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Using the LCM of the denominators 132: 11/12 = 121/132, 3/4 = 99/132 and 10/11 = 120/132. The largest is 11/12.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0288", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q287", "exam": "", "q": "Find the value of 14 4/9 + 16 5/27 + 2 5/54.", "o": ["32 17/18", "32 11/18", "32 13/18", "31 13/18"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Add the whole parts: 14 + 16 + 2 = 32. Add the fractions: 4/9 + 5/27 + 5/54 = (24 + 10 + 5)/54 = 39/54 = 13/18. So the sum is 32 13/18.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0289", "ch": 5, "page": 38, "ansPage": 38, "srcNo": "Number System Q288", "exam": "", "q": "Find the value of 3 2/7 + 14 4/9 + 5 3/9.", "o": ["23 4/63", "22 4/63", "25 4/63", "21 4/63"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Whole parts: 3 + 14 + 5 = 22. Fractions: 2/7 + 4/9 + 3/9 = 2/7 + 7/9 = (18 + 49)/63 = 67/63 = 1 4/63. Total = 22 + 1 4/63 = 23 4/63.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0290", "ch": 5, "page": 39, "ansPage": 39, "srcNo": "Number System Q289", "exam": "", "q": "If 1/(1 + 1/(1 + 1/(1 + 1/x))) = 5/8, find the value of x.", "o": ["2", "3", "1", "4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Work from the inside. 1 + 1/x = (x + 1)/x. Then 1 + x/(x + 1) = (2x + 1)/(x + 1). Then 1 + (x + 1)/(2x + 1) = (3x + 2)/(2x + 1). So the expression is (2x + 1)/(3x + 2) = 5/8. Cross-multiplying: 16x + 8 = 15x + 10, so x = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0291", "ch": 5, "page": 39, "ansPage": 39, "srcNo": "Number System Q290", "exam": "", "q": "If S = 1/(1×3×5) + 1/(1×4×7) + 1/(3×5×7) + 1/(4×7×10) + 1/(5×7×9) + 1/(7×10×13) + ... up to 20 terms, what is the value of S?", "o": ["6179/15275", "6070/14973", "7191/15174", "5183/16423"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Split the series into two series of 10 terms each. First: 1/(1·3·5) + 1/(3·5·7) + ... which telescopes to (1/4)(1/3 − 1/483). Second: 1/(1·4·7) + 1/(4·7·10) + ... which telescopes to (1/6)(1 − 1/(28·31)) style terms. Adding gives 40/483 + 10/31 type terms, which combine to 6070/14973.", "tip": "", "status": "note", "note": "The terms of the series are partly illegible in the source scan and the printed solution is only partly legible. The question text above is the best reading; printed key (b) retained, flagged for review.", "void": false}, {"id": "MTH-0292", "ch": 5, "page": 39, "ansPage": 39, "srcNo": "Number System Q291", "exam": "", "q": "What is the value of 0.00010?", "o": ["1/1000", "1/10000", "1/100000", "1/100"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "0.00010 = 10/100000 = 1/10000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0293", "ch": 5, "page": 39, "ansPage": 39, "srcNo": "Number System Q292", "exam": "SSC CGL (Tier-II) 2019, 18/11/2020", "q": "The numerator of a fraction is 6 less than its denominator. If 1 is subtracted from its numerator and 5 is added to its denominator, its denominator becomes 4 times its numerator. Find the fraction.", "o": ["4/11", "5/11", "7/11", "3/11"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the denominator be x, so the numerator is x − 6. Then x + 5 = 4[(x − 6) − 1], so x + 5 = 4x − 28, giving 3x = 33 and x = 11. The numerator is 5, so the fraction is 5/11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0294", "ch": 6, "page": 39, "ansPage": 39, "srcNo": "Number System Q293", "exam": "24.05.2024 S-I", "q": "Which of the following is the p/q form of 0.001001001... (0.001 recurring)?", "o": ["1/1000", "1/999", "1/100", "1/1999"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "0.001001... = 001/999 = 1/999. A recurring decimal with a repeating block of three digits equals the block divided by 999.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-027", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0295", "ch": 6, "page": 39, "ansPage": 39, "srcNo": "Number System Q294", "exam": "05.09.2023 S-IV", "q": "Which of the following is the p/q form of 0.001001001... (0.001 recurring)?", "o": ["1/1000", "1/999", "1/100", "1/1999"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let x = 0.001001001... Then 1000x = 1.001001001... Subtracting, 999x = 1, so x = 1/999.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-027", "first": false, "kind": "exact", "of": "MTH-0294"}}, {"id": "MTH-0296", "ch": 6, "page": 40, "ansPage": 40, "srcNo": "Number System Q295", "exam": "18.09.2023 S-V", "q": "0.105 can be written in the form p/(2ⁿ × 5ᵐ) as ______.", "o": ["12/(2⁴ × 5⁰)", "23/(2³ × 5³)", "21/(2³ × 5²)", "9/(2⁰ × 5²)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "0.105 = 105/1000 = 21/200 = 21/(2³ × 5²).", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-026", "first": false, "kind": "exact", "of": "MTH-0266"}}, {"id": "MTH-0297", "ch": 6, "page": 40, "ansPage": 40, "srcNo": "Number System Q296", "exam": "14.09.2020 S-I", "q": "If 27^x = 9/3^x, then the value of 1/x⁴ is ______.", "o": ["14", "16", "18", "12"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "27^x = 3^(3x), so 3^(3x) × 3^x = 9, which gives 3^(4x) = 3², so 4x = 2 and x = 1/2. Then 1/x⁴ = 1/(1/2)⁴ = 16.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0298", "ch": 6, "page": 40, "ansPage": 40, "srcNo": "Number System Q297", "exam": "10.09.2020 S-I", "q": "If aˣ = b³, bʸ = c³ and cᶻ = a³, then the value of xyz will be ______.", "o": ["9", "0", "27", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "aˣ = b³ gives b = a^(x/3); bʸ = c³ gives c = b^(y/3); cᶻ = a³ gives a = c^(z/3). Substituting, a = a^(xyz/27), so xyz/27 = 1 and xyz = 27.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0299", "ch": 6, "page": 40, "ansPage": 40, "srcNo": "Number System Q298", "exam": "Haryana TGT 2019", "q": "0.23535... (0.2 followed by the recurring block 35) can be written as ______.", "o": ["235/100", "234/990", "233/990", "234/1000"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let x = 0.23535... Then 100x = 23.5353... and 10000x... Subtracting, 100x − x = 23.5353... − 0.2353... = 23.3, so 99x = 23.3 and x = 23.3/99 = 233/990.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0300", "ch": 6, "page": 40, "ansPage": 40, "srcNo": "Number System Q299", "exam": "Haryana TGT 2019", "q": "The sum of the squares of two numbers is 145. If the square root of one number is 3, the other number is equal to ______.", "o": ["136", "64", "9", "8"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If the square root of one number a is 3, then a = 9. So 9² + b² = 145, giving b² = 64 and b = 8 (taking the positive value).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0301", "ch": 6, "page": 40, "ansPage": 40, "srcNo": "Number System Q300", "exam": "Haryana TGT 2019", "q": "(16 × 2^(n+1) − 4 × 2^n)/(16 × 2^(n+2) − 2 × 2^(n+2)) = ______.", "o": ["1", "1/2", "1/4", "1/2ⁿ"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Numerator: 16 × 2^(n+1) − 4 × 2^n = 2^(n+5) − 2^(n+2) = 2^(n+2)(2³ − 1). Denominator: 16 × 2^(n+2) − 2 × 2^(n+2) = 2^(n+6) − 2^(n+3) = 2^(n+3)(2³ − 1). The ratio is 2^(n+2)/2^(n+3) = 1/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0302", "ch": 6, "page": 40, "ansPage": 41, "srcNo": "Number System Q301", "exam": "UP TGT-2016 (08-03-2019)", "q": "The smallest number among the numbers 2^250, 3^150, 5^100 and 4^200 is ______.", "o": ["4^200", "5^100", "3^150", "2^250"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Write each with the common exponent 50: 2^250 = (2⁵)^50 = 32^50, 3^150 = (3³)^50 = 27^50, 5^100 = (5²)^50 = 25^50 and 4^200 = (4⁴)^50 = 256^50. With equal powers, the smallest base gives the smallest number: 25^50 = 5^100.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0303", "ch": 6, "page": 41, "ansPage": 41, "srcNo": "Number System Q302", "exam": "UP TGT-2016 (08-03-2019)", "q": "√(3 + 2√2) − √(3 − 2√2) is equal to ______.", "o": ["1", "√3 + 1", "√3 − 1", "2"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "3 + 2√2 = (√2 + 1)² and 3 − 2√2 = (√2 − 1)². So the expression is (√2 + 1) − (√2 − 1) = 2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0304", "ch": 6, "page": 41, "ansPage": 41, "srcNo": "Number System Q303", "exam": "NVS PGT 10-06-2019", "q": "Two consecutive positive integers, the sum of whose squares is 365, are ______.", "o": ["11, 12", "13, 14", "12, 13", "14, 15"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the integers be x and x + 1. Then x² + (x + 1)² = 365, so 2x² + 2x − 364 = 0, i.e. x² + x − 182 = 0, which factors as (x + 14)(x − 13) = 0. Since x is positive, x = 13, and the integers are 13 and 14.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0305", "ch": 6, "page": 41, "ansPage": 41, "srcNo": "Number System Q304", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The decimal number 1.23657657657... is equal to the rational number ______.", "o": ["123/99", "1235/9990", "123657/100000", "123534/99900"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The recurring block is 657, starting after the digits 23. So 1.23657657... = (123657 − 123)/99900 = 123534/99900.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0306", "ch": 6, "page": 41, "ansPage": 41, "srcNo": "Number System Q305", "exam": "DSSSB TGT (Section-B) 28 Dec 2014", "q": "The average of the squares of the numbers 0, 1, 2, ..., n is ______.", "o": ["(1/n) n(n + 1)", "(1/6) n(2n + 1)", "(1/6)(n + 1)(2n + 1)", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "There are n + 1 numbers. The sum of their squares is n(n + 1)(2n + 1)/6. The average is [n(n + 1)(2n + 1)/6]/(n + 1) = n(2n + 1)/6.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0307", "ch": 6, "page": 41, "ansPage": 41, "srcNo": "Number System Q306", "exam": "JDD-75-PGT Tier II-X-15 28.06.2015", "q": "The value of ∛(√5 + 2) − ∛(√5 − 2) is ______.", "o": ["1", "2", "3", "4"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let a = ∛(√5 + 2) − ∛(√5 − 2). Cubing, a³ = (√5 + 2) − (√5 − 2) − 3∛((√5+2)(√5−2)) × a = 4 − 3a, because (√5+2)(√5−2) = 1. So a³ + 3a − 4 = 0. Putting a = 1 gives 1 + 3 − 4 = 0, so a = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0308", "ch": 6, "page": 41, "ansPage": 41, "srcNo": "Number System Q307", "exam": "JDD-75-PGT Tier II-X-15 28.06.2015", "q": "If 4ˣ = 8ʸ, the value of (x/y − 1) is ______.", "o": ["0", "1/2", "1", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "4ˣ = 8ʸ gives 2^(2x) = 2^(3y), so 2x = 3y and x/y = 3/2. Then x/y − 1 = 1/2.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0309", "ch": 6, "page": 42, "ansPage": 42, "srcNo": "Number System Q308", "exam": "JDD-75-PGT Tier II-X-15 28.06.2015", "q": "If 5ⁿ + 5^(n−1) = 30, then the value of (2n)^(n/2) is ______.", "o": ["12", "4", "6", "8"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "5ⁿ + 5^(n−1) = 5^(n−1)(5 + 1) = 30, so 5^(n−1) = 5 and n = 2. Then (2n)^(n/2) = 4^1 = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0310", "ch": 6, "page": 42, "ansPage": 42, "srcNo": "Number System Q309", "exam": "TGT 2001", "q": "Solve the equation 2^(3/log₃x) = 1/64. Then x = ______.", "o": ["3", "1/3", "1/√3", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "1/64 = 2^(−6), so 3/log₃x = −6, which gives log₃x = −1/2 and x = 3^(−1/2) = 1/√3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0311", "ch": 6, "page": 42, "ansPage": 42, "srcNo": "Number System Q310", "exam": "Rajasthan TGT 2016", "q": "The value of (256)^0.16 × (16)^0.18 is ______.", "o": ["4", "16", "64", "128"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "(256)^0.16 = (2⁸)^0.16 = 2^1.28 and (16)^0.18 = (2⁴)^0.18 = 2^0.72. The product is 2^(1.28 + 0.72) = 2² = 4.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0312", "ch": 6, "page": 42, "ansPage": 42, "srcNo": "Number System Q311", "exam": "KVS TGT Dec 2017", "q": "If (1/5)^(3y) = 0.008, find the value of (0.25)^y.", "o": ["1.00", "0.75", "0.50", "0.25"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "0.008 = (1/5)³, so 3y = 3 and y = 1. Then (0.25)^y = 0.25.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0313", "ch": 6, "page": 42, "ansPage": 42, "srcNo": "Number System Q312", "exam": "TGT 2010", "q": "If a = (√2 + 1)/(√2 − 1) and b = (√2 − 1)/(√2 + 1), then a² + ab + b² is ______.", "o": ["35", "34", "33", "32"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "a = (√2 + 1)² = 3 + 2√2 and b = (√2 − 1)² = 3 − 2√2. Then a² + b² = 2(9 + 8) = 34 and ab = 1, so a² + ab + b² = 35.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0314", "ch": 6, "page": 42, "ansPage": 42, "srcNo": "Number System Q313", "exam": "TGT 2010", "q": "If aˣ = b, bʸ = c and cᶻ = a, then the value of xyz is ______.", "o": ["1", "2", "3", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "aˣ = b gives x = log_a b, bʸ = c gives y = log_b c, and cᶻ = a gives z = log_c a. So xyz = log_a b × log_b c × log_c a = 1.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0315", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q314", "exam": "TGT 2009", "q": "The value of ⁴√5 × ⁶√8 is ______.", "o": ["¹²√800", "¹⁰√80000", "¹²√8000", "¹⁰√80"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "⁴√5 = 5^(1/4) = (5³)^(1/12) = ¹²√125 and ⁶√8 = (8²)^(1/12) = ¹²√64. The product is ¹²√(125 × 64) = ¹²√8000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0316", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q315", "exam": "TGT 2009", "q": "The square root of 2 − √3 is ______.", "o": ["√3/2 + 1/√2", "1/√2 − √3/2", "√3/2 − 1/2", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "2 − √3 = (1/2)(4 − 2√3) = (1/2)(√3 − 1)². Its square root is (√3 − 1)/√2 = √(3/2) − 1/√2, which does not match options (a), (b) or (c).", "tip": "", "status": "note", "note": "The options (a) to (c) are only partly legible in the source scan; the printed key (d) agrees with the printed solution.", "void": false}, {"id": "MTH-0317", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q316", "exam": "TGT 2009", "q": "If √10 = 3.1622, then the value of 1/√10 is ______.", "o": ["3.1622", "2.1622", "0.31622", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "1/√10 = √10/10 = 3.1622/10 = 0.31622.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0318", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q317", "exam": "TGT 2005", "q": "Among ∛9, ⁴√11 and ⁶√17, the largest number is ______.", "o": ["∛9", "⁴√11", "⁶√17", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The LCM of 3, 4 and 6 is 12. ∛9 = ¹²√(9⁴) = ¹²√6561, ⁴√11 = ¹²√(11³) = ¹²√1331 and ⁶√17 = ¹²√(17²) = ¹²√289. The largest is ¹²√6561, that is ∛9.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0319", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q318", "exam": "TGT 2004", "q": "If xʸ = yˣ, then (x/y)^(x/y) is equal to ______.", "o": ["x^(x/y + 1)", "x^(1/y)", "x^(1/x)", "x^(x/y − 1)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "xʸ = yˣ gives x = y^(x/y). So (x/y)^(x/y) = x^(x/y)/y^(x/y) = x^(x/y)/x = x^((x/y) − 1).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0320", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q319", "exam": "", "q": "Find the value of √(8 + √1681).", "o": ["5", "6", "4", "7"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "√1681 = 41, so √(8 + 41) = √49 = 7.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-028", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0321", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q320", "exam": "", "q": "If x = √(−√3 + √(3 + 8√(7 + 4√3))), where x > 0, find the value of x.", "o": ["2", "4", "1", "3"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "7 + 4√3 = (2 + √3)², so √(7 + 4√3) = 2 + √3 and 8(2 + √3) = 16 + 8√3. Then 3 + 16 + 8√3 = 19 + 8√3 = (4 + √3)², whose root is 4 + √3. Then −√3 + 4 + √3 = 4 and x = √4 = 2.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-029", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0322", "ch": 6, "page": 43, "ansPage": 43, "srcNo": "Number System Q321", "exam": "", "q": "√(269 − √169) = ?", "o": ["17", "15", "22", "16"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "√169 = 13, so √(269 − 13) = √256 = 16.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0323", "ch": 6, "page": 43, "ansPage": 44, "srcNo": "Number System Q322", "exam": "", "q": "From the equation (5)² + (6)² + (30)² = (x)², find the value of x.", "o": ["53", "37", "41", "31"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "25 + 36 + 900 = 961 = x², so x = √961 = 31.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-030", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0324", "ch": 6, "page": 44, "ansPage": 44, "srcNo": "Number System Q323", "exam": "", "q": "Find the value of (√1.24 × √2.79)/(√2.64 × √5.94).", "o": ["31/44", "33/31", "31/66", "33/64"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "√1.24 × √2.79 = √(1.24 × 2.79) = √3.4596 = 1.86 and √2.64 × √5.94 = √15.6816 = 3.96. Equivalently the book writes the ratio as √31 × √31/(√66 × √66) = 31/66.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-031", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0325", "ch": 6, "page": 44, "ansPage": 44, "srcNo": "Number System Q324", "exam": "", "q": "On comparing the two numerical expressions [(2 7/9)^(5/2)]^(3/5) and [(1 2/3)^5]^(3/5), we find that ______.", "o": ["The first expression is smaller than the second", "The first expression is larger than the second", "The given expressions cannot be compared", "Both expressions are equal"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "2 7/9 = 25/9 = (5/3)². So (25/9)^(5/2) = (5/3)^5. Both expressions then equal [(5/3)^5]^(3/5) = (5/3)³. They are equal.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0326", "ch": 6, "page": 44, "ansPage": 44, "srcNo": "Number System Q325", "exam": "", "q": "What number can replace the question mark in the equation (0.064)^123 ÷ 0.16^47 × 0.4^34 × 0.4^29 = (0.4)^?", "o": ["320", "341", "338", "350"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Write every base as a power of 0.4: 0.064 = (0.4)³ and 0.16 = (0.4)². Then 0.4^369 ÷ 0.4^94 × 0.4^34 × 0.4^29 = 0.4^(369 − 94 + 34 + 29) = 0.4^338. So ? = 338.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0327", "ch": 6, "page": 44, "ansPage": 44, "srcNo": "Number System Q326", "exam": "", "q": "Which number can replace the question mark in t
