", "9%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let CP = 100, MP = 110. The selling price (1% loss) is 99. So 110 × (100 − x)/100 = 99, giving 100 − x = 90 and x = 10%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-058", "first": false, "kind": "exact", "of": "MTH-0610"}}, {"id": "MTH-0631", "ch": 11, "page": 91, "ansPage": 91, "srcNo": "Business Maths Q47", "exam": "05.09.2023 S-III", "q": "Find the annual dividend on 400 shares of face value ₹10 if the quarterly dividend rate is 5%.", "o": ["₹800", "₹700", "₹850", "₹900"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Quarterly dividend rate = 5%, so annual = 5 × 4 = 20%. The annual dividend = 400 × 10 × 20/100 = ₹800.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0632", "ch": 11, "page": 91, "ansPage": 91, "srcNo": "Business Maths Q48", "exam": "05.09.2023 S-III", "q": "On getting a 5% discount on the price of sugar, a buyer gets 2 kg more sugar for ₹608. What is the selling price of sugar?", "o": ["₹20 per kg", "₹25 per kg", "₹16 per kg", "₹18 per kg"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the original price be ₹x per kg and the buyer originally get y kg for ₹608, so xy = 608. With the 5% discount the price is 0.95x and he gets (y + 2) kg: 0.95x(y + 2) = 608 = xy. So y = 0.95y + 1.9, which gives y = 38 kg. Then x = 608/38 = ₹16 per kg.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0633", "ch": 11, "page": 92, "ansPage": 92, "srcNo": "Business Maths Q49", "exam": "05.09.2023 S-III", "q": "The equivalent single discount for successive discounts of 20%, 20% and 10% will be ______.", "o": ["50%", "42%", "42.4%", "44%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Starting at 100: after 20% → 80, after another 20% → 64, after 10% → 57.6. The equivalent discount = 100 − 57.6 = 42.4%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-059", "first": false, "kind": "exact", "of": "MTH-0611"}}, {"id": "MTH-0634", "ch": 11, "page": 92, "ansPage": 92, "srcNo": "Business Maths Q50", "exam": "05.09.2023 S-III", "q": "A discount of 15% on one article is equal to a discount of 20% on another article. The ratio of the prices of the two articles is ______.", "o": ["3 : 4", "4 : 3", "4 : 5", "5 : 4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the prices be x and y. Then x × 15/100 = y × 20/100, so x/y = 20/15 = 4/3, i.e. x : y = 4 : 3.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0635", "ch": 11, "page": 92, "ansPage": 92, "srcNo": "Business Maths Q51", "exam": "04.09.2023 S-II", "q": "The marked price of an article is 20% above its cost price. A discount of 20% is given on the marked price. Does the seller gain or lose in such a sale?", "o": ["Gain", "Loss", "Neither gain nor loss", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the cost price be ₹100. The marked price is ₹120. After a 20% discount the selling price is 120 − 24 = ₹96. The seller loses 100 − 96 = ₹4, a 4% loss.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-057", "first": false, "kind": "exact", "of": "MTH-0608"}}, {"id": "MTH-0636", "ch": 11, "page": 92, "ansPage": 92, "srcNo": "Business Maths Q52", "exam": "04.09.2023 S-II", "q": "The list price of a fan is ₹1500 and a 20% discount is given on the list price. What additional discount must be given so that its net price becomes ₹1104?", "o": ["10%", "5%", "7%", "8%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Price after the 20% discount = 1500 × 80/100 = ₹1200. Let the additional discount be x%: 1200 × (100 − x)/100 = 1104, so 100 − x = 92 and x = 8%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0637", "ch": 11, "page": 92, "ansPage": 92, "srcNo": "Business Maths Q53", "exam": "04.09.2023 S-II", "q": "The marked price of a watch was ₹720. A person bought it for ₹550.80 after two successive discounts. If the first discount was 10%, the second successive discount will be ______.", "o": ["10%", "15%", "20%", "25%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the second discount be x%. 720 × 90/100 × (100 − x)/100 = 550.80, so 648 × (100 − x)/100 = 550.80, giving 100 − x = 85 and x = 15%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0638", "ch": 11, "page": 92, "ansPage": 92, "srcNo": "Business Maths Q54", "exam": "04.09.2023 S-I", "q": "A discount of 10% on the marked price of a toy gives a shopkeeper a 20% profit. If a discount of 20% is given, his profit will be ______.", "o": ["8%", "6 2/3%", "7 1/3%", "10%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the marked price be ₹100. After a 10% discount the selling price is ₹90, which gives a 20% profit, so the cost price = 90 × 100/120 = ₹75. With a 20% discount the selling price is ₹80. Profit % = (80 − 75)/75 × 100 = 6 2/3%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0639", "ch": 11, "page": 93, "ansPage": 93, "srcNo": "Business Maths Q55", "exam": "04.09.2023 S-I", "q": "A toy car of marked price ₹400 was sold at two successive discounts of 8% each. If the shopkeeper had declared a single discount of 16%, his loss compared with that would be ______.", "o": ["₹2.56", "₹4", "₹3.25", "₹5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The equivalent of two successive 8% discounts = 8 + 8 − (8 × 8)/100 = 15.36%. A single 16% discount differs by 16 − 15.36 = 0.64%, which on ₹400 is 400 × 0.64/100 = ₹2.56.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0640", "ch": 11, "page": 93, "ansPage": 93, "srcNo": "Business Maths Q56", "exam": "04.09.2023 S-I", "q": "The price of an article is raised 30% above its cost, and then two successive discounts of 10% and 10% are given. What is the final profit percentage?", "o": ["5%", "5.5%", "5.3%", "4.3%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the cost price be ₹100. The marked price = ₹130. The selling price = 130 × 90/100 × 90/100 = ₹105.30. Profit % = 5.3%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0641", "ch": 11, "page": 93, "ansPage": 93, "srcNo": "Business Maths Q57", "exam": "04.09.2023 S-I", "q": "A shopkeeper fixes the price of his sarees 20% above the cost price and also gives the buyer a 10% discount. What is the shopkeeper's total profit percentage?", "o": ["10%", "8%", "12%", "15%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If the cost price is ₹100, the marked price is ₹120. After a 10% discount the selling price = 120 × 90/100 = ₹108. Profit % = 8%.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-060", "first": false, "kind": "exact", "of": "MTH-0618"}}, {"id": "MTH-0642", "ch": 11, "page": 93, "ansPage": 93, "srcNo": "Business Maths Q58", "exam": "", "q": "On selling an article for ₹329, a dealer lost 6%. The cost price of the article is ______.", "o": ["₹310.37", "₹348.74", "₹335", "₹350"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Cost price = selling price × 100/(100 − loss%) = 329 × 100/94 = ₹350.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0643", "ch": 11, "page": 93, "ansPage": 93, "srcNo": "Business Maths Q59", "exam": "Haryana TGT 2020", "q": "A shopkeeper allows a discount of 10% to his customers and still gains 20%. What is the marked price of an article which costs the shopkeeper ₹450?", "o": ["₹600", "₹540", "₹615", "₹405"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the marked price be ₹x. The selling price after a 10% discount is 9x/10. The gain is 20% on ₹450: (9x/10 − 450)/450 × 100 = 20, so 9x/10 = 540 and x = ₹600.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0644", "ch": 11, "page": 93, "ansPage": 94, "srcNo": "Business Maths Q60", "exam": "Haryana TGT 2020", "q": "If a tax on an item is diminished by 20% and its consumption increases by 15%, the effect on revenue is ______.", "o": ["Increased by 8%", "Increased by 11%", "Decreased by 8%", "Decreased by 11%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the tax be x and the consumption y, so the revenue is xy. The new revenue = (4x/5)(23y/20) = (23/25)xy = 0.92xy, a decrease of 8%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0645", "ch": 11, "page": 94, "ansPage": 94, "srcNo": "Business Maths Q61", "exam": "Haryana TGT 2020", "q": "A man buys two horses for ₹1350. He sells one so as to lose 6% and the other so as to gain 7.5%. On the whole he neither gains nor loses. The cost of each horse is ______.", "o": ["₹570; ₹600", "₹750; ₹606", "₹705; ₹660", "₹750; ₹600"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the costs be ₹x and ₹y with x + y = 1350. No overall gain or loss means 6% of x equals 7.5% of y, so x × 94/100 + (1350 − x) × 107.5/100 = 1350, which gives x = ₹750 and y = ₹600.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0646", "ch": 11, "page": 94, "ansPage": 94, "srcNo": "Business Maths Q62", "exam": "Haryana TGT 2019", "q": "Which of the following will give the maximum discount on ₹6896? (1) Two successive discounts of 5% and 5%. (2) A single discount of 10%. (3) Two successive discounts of 8% and 2%.", "o": ["1", "2", "3", "All are the same"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "(1) Two successive discounts of 5% and 5% = 5 + 5 − (5 × 5)/100 = 9.75%. (2) A single discount of 10%. (3) Two successive discounts of 8% and 2% = 8 + 2 − (8 × 2)/100 = 9.84%. The maximum is the single 10% discount.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0647", "ch": 11, "page": 94, "ansPage": 94, "srcNo": "Business Maths Q63", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "A person spends 75% of his income. If his income is increased by 20%, his expenditure also increases by 20%. By what percentage does his savings increase?", "o": ["20%", "10%", "16%", "5%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the income be ₹100. Expenditure = 75 and savings = 25. The new income = 120 and the new expenditure = 75 × 120/100 = 90, so the new savings = 30. The increase in savings = (30 − 25)/25 × 100 = 20%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0648", "ch": 11, "page": 94, "ansPage": 94, "srcNo": "Business Maths Q64", "exam": "DSSSB 23 Sep 2018 (9 AM-11 AM)", "q": "Two articles A and B are sold for ₹1888 and ₹1440 respectively. A is sold at a gain of 18% and B at a loss of 10%. What is the overall profit percentage?", "o": ["4%", "8%", "5%", "6%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Cost of A = 1888 × 100/118 = ₹1600. Cost of B = 1440 × 100/90 = ₹1600. Total cost = ₹3200 and total selling price = 1888 + 1440 = ₹3328. Profit % = (3328 − 3200)/3200 × 100 = 128/3200 × 100 = 4%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0649", "ch": 11, "page": 94, "ansPage": 95, "srcNo": "Business Maths Q65", "exam": "TGT 2001", "q": "A trader sells a pen for ₹24.00. The trader's profit percentage is equal to the cost price of the pen. What is the cost price of the pen?", "o": ["₹15.00", "₹18.00", "₹20.00", "₹24.00"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the cost price be ₹x. The profit % = x, so the profit = x × x/100 = x²/100. Selling price = cost + profit: 24 = x + x²/100, so x² + 100x − 2400 = 0, which factors as (x + 120)(x − 20) = 0. Hence x = 20 (the negative root is rejected).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0650", "ch": 11, "page": 95, "ansPage": 95, "srcNo": "Business Maths Q66", "exam": "Rajasthan TGT 2016", "q": "If each edge of a cube is increased by 50%, the increase in its surface area will be ______.", "o": ["50%", "75%", "100%", "125%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the original edge be a. The new edge = 3a/2. Original surface area = 6a². New surface area = 6(3a/2)² = 27a²/2. The increase = (27a²/2 − 6a²)/(6a²) × 100 = (15/2)/6 × 100 = 125%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0651", "ch": 11, "page": 95, "ansPage": 95, "srcNo": "Business Maths Q67", "exam": "KVS TGT Dec 2017", "q": "Two students A and B appeared in an examination in which A scored 12 marks more than B. B scored what percent less than A?", "o": ["20%", "16.67%", "12%", "33.33%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The printed solution takes B = 100 and A = 112 (that is, A scored 12% more), so B scored 12/112 × 100 = 10.7% less than A. The book notes that this does not match any option but is near option (c).", "tip": "", "status": "note", "note": "As printed, the question says 12 marks more but the solution treats it as 12% more, and the computed 10.7% is not among the options. Printed key (c) is the nearest option and is retained, flagged for review.", "void": false}, {"id": "MTH-0652", "ch": 11, "page": 95, "ansPage": 95, "srcNo": "Business Maths Q68", "exam": "KVS TGT Dec 2017", "q": "A shopkeeper gives successive discounts of 20%, 10% and 5%. A customer bought an article for ₹342. The marked price of the article was ______.", "o": ["₹600", "₹500", "₹480", "₹400"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the marked price be x. Then x × 80/100 × 90/100 × 95/100 = 342, so x × 0.684 = 342 and x = ₹500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0653", "ch": 11, "page": 95, "ansPage": 95, "srcNo": "Business Maths Q69", "exam": "TGT 2010", "q": "The sale value of an item is ₹8,400 with sales tax. If the sales tax is 5% on the printed value, the printed value is ______.", "o": ["₹8,000", "₹8,820", "₹8,800", "₹8,200"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the printed value be ₹x. Then x × 105/100 = 8400, so x = 8400 × 100/105 = ₹8000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0654", "ch": 11, "page": 95, "ansPage": 95, "srcNo": "Business Maths Q70", "exam": "", "q": "Nikita made two investments. She earns a 10% profit on one and suffers a 20% loss on the other. If the investments were in the ratio 2 : 3, what is her overall gain or loss percentage?", "o": ["8% loss", "8% gain", "15% gain", "15% loss"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the investments be ₹200 and ₹300 (total ₹500). The first amount becomes 200 × 110/100 = ₹220 and the second becomes 300 × 80/100 = ₹240, a total of ₹460. Loss = 500 − 460 = ₹40, so the loss % = 40/500 × 100 = 8%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0655", "ch": 11, "page": 95, "ansPage": 96, "srcNo": "Business Maths Q71", "exam": "", "q": "A trader marks his goods 42% above the cost price and sells them after giving a 15% discount on the marked price. What is his profit percentage (to the nearest integer)?", "o": ["27%", "42%", "35%", "21%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the cost price be ₹100. The marked price is ₹142 and the selling price after a 15% discount is 142 × 85/100 = ₹120.70. Profit % = (120.7 − 100)/100 × 100 ≈ 21%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0656", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q72", "exam": "", "q": "A shopkeeper uses a false weight of 930 g in place of 1 kg and sells at the cost price. What is his profit percentage on selling 15 kg of the article?", "o": ["7 49/93 %", "6 19/93 %", "5 21/93 %", "8 79/93 %"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The true weight is 1000 g but he gives 930 g, so the error is 70 g. Profit % = error/(true weight − error) × 100 = 70/930 × 100 = 7 49/93 %.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0657", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q73", "exam": "", "q": "If the cost price of 28 oranges equals the selling price of 24 oranges, the gain percentage is ______.", "o": ["16 1/3 %", "18 2/3 %", "18 1/3 %", "16 2/3 %"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "28 CP = 24 SP, so CP/SP = 6/7. Gain % = (7 − 6)/6 × 100 = 50/3 = 16 2/3 %.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0658", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q74", "exam": "", "q": "A dealer bought an article at a 10% discount on its marked price. He sold it at a price 35% above the marked price. What percentage profit did he make?", "o": ["62.5%", "50%", "42.5%", "57.5%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the marked price be ₹100. He buys it for ₹90 and sells it for ₹135. Profit = 135 − 90 = ₹45, so the profit % = 45/90 × 100 = 50%.", "tip": "", "status": "note", "note": "The stem says 'at a 10% discount on its cost price' and 'above the original price'; the printed solution treats the 10% as a discount on the marked price and the 35% as above the marked price.", "void": false}, {"id": "MTH-0659", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q75", "exam": "", "q": "The selling price of a book is ₹855. If the loss on the sale is 10%, what is the amount of the loss in rupees?", "o": ["₹90.5", "₹85", "₹85.5", "₹95"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the cost price be ₹x. A 10% loss gives selling price = 0.9x = 855, so x = 950. The loss = 950 − 855 = ₹95.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0660", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q76", "exam": "", "q": "The selling price of an article is three times the loss incurred on selling it. What is the loss percentage?", "o": ["33.33%", "40%", "50%", "25%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Selling price = 3 × loss, so loss/selling price = 1/3. Let the loss be x and the selling price 3x; the cost price = 3x + x = 4x. Loss % = x/4x × 100 = 25%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0661", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q77", "exam": "", "q": "Three-fourths of a consignment was sold at an 8% profit and the rest at a 4% loss. If the total profit was ₹600, find the value of the consignment.", "o": ["₹15,000", "₹12,000", "₹18,000", "₹6,000"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the value of the consignment be ₹x. Profit on 3/4 of it = (3x/4)(8/100) and loss on 1/4 of it = (x/4)(4/100). So 6x/100 − x/100 = 600... precisely 24x/400 − 4x/400 = 600, so 20x = 240000 and x = ₹12,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0662", "ch": 11, "page": 96, "ansPage": 96, "srcNo": "Business Maths Q78", "exam": "", "q": "A shopkeeper bought a table for ₹4,600 and a chair for ₹1,800. He sells the table at a 10% profit and the chair at a 6% profit. Find the total percentage profit.", "o": ["7 3/4", "8", "8 7/8", "16"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Total cost = 4600 + 1800 = ₹6400. Selling price = 4600 × 110/100 + 1800 × 106/100 = 5060 + 1908 = ₹6968. Profit % = (6968 − 6400)/6400 × 100 = 568/6400 × 100 = 71/8 = 8 7/8 %.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0663", "ch": 11, "page": 97, "ansPage": 97, "srcNo": "Business Maths Q79", "exam": "", "q": "Sudhir claimed that he sells his goods at only 8% above the cost, but he used a false weight marked 750 g which actually weighed 720 g. What was the actual profit percentage earned by Sudhir?", "o": ["12.6%", "12.25%", "12.5%", "12.75%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the cost of 1 g be ₹x. The cost of 720 g = ₹720x. The sale price of '750 g' at an 8% profit = 750x × 108/100 = ₹810x. Actual profit % = (810x − 720x)/720x × 100 = 90/720 × 100 = 12.5%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0664", "ch": 11, "page": 97, "ansPage": 97, "srcNo": "Business Maths Q80", "exam": "", "q": "The marked price of an article is ₹400. Even after giving a 20% discount, the shopkeeper earns a profit of ₹48. Find his profit percentage.", "o": ["15 11/17 %", "19 11/17 %", "17 11/17 %", "14 11/17 %"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Selling price = 400 × 80/100 = ₹320. Cost price = 320 − 48 = ₹272. Profit % = 48/272 × 100 = 17 11/17 %.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0665", "ch": 11, "page": 97, "ansPage": 97, "srcNo": "Business Maths Q81", "exam": "", "q": "A trader suffers a 10% loss by selling an article at 9/11 of its actual selling price. What will be the profit percentage if the article is sold at 5% less than its actual selling price?", "o": ["5", "4 1/2", "5 1/2", "4"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the actual selling price be ₹11. A 10% loss at 9/11 of the price means the cost price = ₹10 (since 9/10 × 10... the book takes the cost as ₹10). Selling 5% below the actual price: 11 × 95/100 = ₹10.45. Profit % = (10.45 − 10)/10 × 100 = 4.5 = 4 1/2 %.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0666", "ch": 11, "page": 97, "ansPage": 97, "srcNo": "Business Maths Q82", "exam": "", "q": "Praveen sells a study table to Joya at a 10% loss, and Joya sells the same table to Adarsh at a 25% profit. If Adarsh bought the table for ₹2,250, what was the cost of the table for Praveen (in ₹)?", "o": ["1,900", "2,100", "2,000", "1,800"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Joya's cost = 2250 × 100/125 = ₹1800. Let Praveen's cost be ₹x. His selling price = 90x/100 = 1800, so x = ₹2000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0667", "ch": 11, "page": 98, "ansPage": 98, "srcNo": "Business Maths Q83", "exam": "", "q": "A piece of land was sold through two brokers, each broker making a 25% profit. If the person bought the land for ₹6,25,000, what was the original cost of the land (in ₹)?", "o": ["4,25,000", "3,75,000", "3,50,000", "4,00,000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A 25% profit means selling price/cost = 5/4. For two brokers the ratio is (5/4)² = 25/16. So original cost = 625000 × 16/25 = ₹4,00,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0668", "ch": 11, "page": 98, "ansPage": 98, "srcNo": "Business Maths Q84", "exam": "", "q": "The marked price of a television set is ₹18,000. A shopkeeper gives a 40% discount and earns a 10% profit. Find the cost price of the television set.", "o": ["₹8,181 1/11", "₹9,818 2/11", "₹7,821 3/11", "₹9,531 5/11"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Selling price = 18000 × 60/100 = ₹10800. Cost × (100 + 10)/100 = 10800, so cost = 10800 × 100/110 = ₹9818 2/11.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0669", "ch": 11, "page": 98, "ansPage": 98, "srcNo": "Business Maths Q85", "exam": "", "q": "An article is sold at a 25% loss. If its cost price were doubled and the selling price were increased by ₹660, a 20% profit would be obtained. What is the actual cost price of the article?", "o": ["₹400", "₹360", "₹480", "₹500"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the actual cost be x. The first selling price = 0.75x. The new cost = 2x, and the new selling price = 0.75x + 660 gives a 20% profit: (0.75x + 660) = 2x × 120/100 = 2.4x. So 660 = 1.65x and x = ₹400.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0670", "ch": 11, "page": 98, "ansPage": 98, "srcNo": "Business Maths Q86", "exam": "", "q": "A wholesaler sells a watch to a retailer at an 8% profit and the retailer sells it to a customer at a 12% profit. If the customer pays ₹8,448, approximately how much (in ₹) did the wholesaler buy the watch for?", "o": ["6984", "6082", "7120", "7022"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the wholesaler's cost be ₹x. Then x × 108/100 × 112/100 = 8448, so x = 8448 × 10000/(108 × 112) ≈ ₹6984.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0671", "ch": 11, "page": 98, "ansPage": 98, "srcNo": "Business Maths Q87", "exam": "", "q": "Raju sold an article to Ravi at a 10% profit. Ravi sold it to Ramu at a 10% loss. If Ramu paid ₹1,485, at what price did Raju sell the article to Ravi?", "o": ["₹1,500", "₹1,600", "₹1,200", "₹1,650"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the cost of the article to Raju be ₹x. Raju sells at 110x/100. Ravi sells at 110x/100 × 90/100 = 1485, so 99x = 148500 and x = ₹1500. Raju sold it to Ravi for 1500 × 110/100 = ₹1650.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0672", "ch": 11, "page": 99, "ansPage": 99, "srcNo": "Business Maths Q88", "exam": "", "q": "A trader bought 60 sheep at ₹120 each. He sold 40 of them at ₹150 each, and 10 sheep died. If he wants a total profit of ₹800, at what price per sheep should he sell the remaining sheep?", "o": ["₹200", "₹150", "₹180", "₹250"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Cost of 60 sheep = 60 × 120 = ₹7200. Sale of 40 sheep = 40 × 150 = ₹6000. For a profit of ₹800 the total sales must be 7200 + 800 = ₹8000, so the remaining 10 sheep must bring 8000 − 6000 = ₹2000, which is ₹200 per sheep.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0673", "ch": 11, "page": 99, "ansPage": 99, "srcNo": "Business Maths Q89", "exam": "", "q": "If some apples are sold at ₹12 each instead of ₹9 each, the difference in selling prices is ₹870. If the total cost of the apples is ₹2,320, find the selling price per apple at which a 25% profit would be earned.", "o": ["₹15", "₹10", "₹12", "₹8"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the number of apples be x. 12x − 9x = 870, so x = 290. The cost per apple = 2320/290 = ₹8. With a 25% profit the selling price = 8 × 125/100 = ₹10.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0674", "ch": 11, "page": 99, "ansPage": 99, "srcNo": "Business Maths Q90", "exam": "", "q": "Two Kalai watches were sold for ₹1,980 each. One was sold at a 10% profit and the other at a 10% loss. As a result of the whole transaction ______.", "o": ["There was neither loss nor profit", "There was a profit of ₹99", "There was a loss of ₹99", "There was a loss of ₹40"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Total selling price = 2 × 1980 = ₹3960. Cost of the first = 1980 × 100/110 = ₹1800 and of the second = 1980 × 100/90 = ₹2200, so the total cost is ₹4000. Loss = 4000 − 3960 = ₹40.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0675", "ch": 11, "page": 99, "ansPage": 99, "srcNo": "Business Maths Q91", "exam": "", "q": "Shyam bought a packet of 16 pens and got 4 pens free along with it. He marked the price 20% above the cost price. If he gave no discount and sold all 20 pens at this price, what was his profit percentage?", "o": ["36%", "37 1/2 %", "48%", "50%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the price of one pen be ₹1. The cost of 16 pens = ₹16. The selling price of 20 pens at 20% above cost = 20 × 120/100 = ₹24. Profit = (24 − 16)/16 × 100 = 50%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0676", "ch": 11, "page": 99, "ansPage": 99, "srcNo": "Business Maths Q92", "exam": "", "q": "Kapila bought 100 frocks at ₹320 per frock. The transport expense was ₹1,000. She paid a tax of ₹1.50 per frock and the labour charge was ₹500. If she wants to earn a 10% profit, what should the selling price per frock be?", "o": ["₹390.80", "₹385.45", "₹370.15", "₹336.50"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Per frock: purchase ₹320, transport 1000/100 = ₹10, tax ₹1.50, labour 500/100 = ₹5. Total cost per frock = 320 + 10 + 1.50 + 5 = ₹336.50. For a 10% profit the selling price = 336.50 × 110/100 = ₹370.15.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0677", "ch": 11, "page": 99, "ansPage": 99, "srcNo": "Business Maths Q93", "exam": "", "q": "The single discount equal to three successive discounts of 20%, 35% and 10% is ______.", "o": ["42.3%", "65.4%", "53.2%", "48.7%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For 20% and 35%: 20 + 35 − (20 × 35)/100 = 48%. Then for 48% and 10%: 48 + 10 − (48 × 10)/100 = 58 − 4.8 = 53.2%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0678", "ch": 11, "page": 99, "ansPage": 100, "srcNo": "Business Maths Q94", "exam": "", "q": "The marked price of a microwave oven is ₹15,990 and it is sold for ₹12,792. Find the rate of discount given.", "o": ["20%", "24%", "25%", "21%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Discount = 15990 − 12792 = ₹3198. Discount % = 3198/15990 × 100 = 20%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0679", "ch": 11, "page": 100, "ansPage": 100, "srcNo": "Business Maths Q95", "exam": "", "q": "The marked price of an article is 2/5 of... as printed: the marked price of an article multiplied by 2/5 equals its cost price multiplied by 4/7. If a 15% discount is given on the sale, what is the approximate profit percentage?", "o": ["19.84%", "21.43%", "14.28%", "23.63%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Marked price × 2/5 = cost price × 4/7, so MP/CP = (4/7) × (5/2) = 10/7. If the cost price is 7 the marked price is 10. A 15% discount gives SP = 8.5. Profit % = (8.5 − 7)/7 × 100 = 21.43%.", "tip": "", "status": "note", "note": "The stem is hard to read in the source scan; it is rebuilt from the printed solution (marked price × 2/5 = cost price × 4/7).", "void": false}, {"id": "MTH-0680", "ch": 11, "page": 100, "ansPage": 100, "srcNo": "Business Maths Q96", "exam": "", "q": "In a sale with an 18% discount, an article costs ₹6,560. What is the marked price of the article?", "o": ["₹7,000", "₹8,000", "₹8,800", "₹7,500"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Selling price = 82% of the marked price, so marked price = 6560 × 100/82 = 80 × 100 = ₹8000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0681", "ch": 11, "page": 100, "ansPage": 100, "srcNo": "Business Maths Q97", "exam": "", "q": "A dealer gives a 45% discount on a packet. He gives a further 25% discount on the discounted price for cash payment. To get the benefit of both discounts, how much must a customer pay in cash for a packet marked ₹2,800?", "o": ["₹1,350", "₹1,230", "₹1,155", "₹2,480"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "After 45% off: 2800 × 55/100 = ₹1540. After a further 25% off: 1540 × 75/100 = ₹1155.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0682", "ch": 11, "page": 100, "ansPage": 100, "srcNo": "Business Maths Q98", "exam": "", "q": "A manufacturer marks an article at ₹1,800 and sells it to a dealer at a 15% discount. For a cash payment, the dealer gets a further 8% discount on the net price. What amount (to the nearest rupee) does the dealer pay the manufacturer?", "o": ["₹1,530", "₹1,378", "₹1,408", "₹1,500"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "1800 × 85/100 × 92/100 = ₹1407.6 ≈ ₹1408.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0683", "ch": 11, "page": 100, "ansPage": 100, "srcNo": "Business Maths Q99", "exam": "", "q": "A shopkeeper buys books at a 25% discount on the marked price. What percentage discount should he allow on the marked price to make a profit of 20% on sales?", "o": ["25%", "20%", "30%", "10%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the marked price be 100. Cost price = 75, and a 20% profit means selling price = 75 × 120/100 = 90. So the discount allowed is 100 − 90 = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0684", "ch": 11, "page": 100, "ansPage": 100, "srcNo": "Business Maths Q100", "exam": "", "q": "After allowing a 12.5% discount on the marked price, a shopkeeper sells an article for ₹805. If he had not given this discount he would have earned a 15% profit. What is the cost price of the article (in ₹)?", "o": ["780", "750", "800", "700"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the marked price be x: x × 87.5/100 = 805, so x = ₹920. Without the discount the selling price = marked price = 920, which gives a 15% profit, so the cost price = 920 × 100/115 = ₹800.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0685", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q101", "exam": "", "q": "The marked price of an article is ₹1,500. After allowing a 20% discount on the marked price a shopkeeper sells it. If its cost price is ₹991, find his profit (in ₹).", "o": ["209", "189", "229", "319"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Selling price = 1500 × 80/100 = ₹1200. Profit = 1200 − 991 = ₹209.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0686", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q102", "exam": "", "q": "A person bought a shirt for ₹1000 and a pair of trousers for ₹2000. The discounts given on the shirt and the trousers were 20% and 50% respectively. What total discount did he get?", "o": ["25%", "40%", "60%", "45%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Discount on the shirt = 20% of 1000 = ₹200. Discount on the trousers = 50% of 2000 = ₹1000. Total discount = ₹1200 on ₹3000, which is 40%.", "tip": "", "status": "note", "note": "The printed working treats the two discounts as 20% and 25% on ₹1000 and ₹2000 and gets (20 + 25) − 5 = 40%; the answer 40% is the same.", "void": false}, {"id": "MTH-0687", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q103", "exam": "", "q": "A discount of 10% is given on the price of a mobile set, and then a further 10% discount is given on the reduced price. The single equivalent discount of the series is ______.", "o": ["17%", "16%", "19%", "18%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Equivalent discount = x + y − xy/100 = 10 + 10 − 1 = 19%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0688", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q104", "exam": "", "q": "Find the single discount equal to successive discounts of 10%, 20% and 25%.", "o": ["46%", "20%", "18.3%", "55%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "10% and 20% give 10 + 20 − 2 = 28%. Then 28% and 25% give 28 + 25 − 7 = 46%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0689", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q105", "exam": "", "q": "A shopkeeper gives an additional 5% discount on an article whose marked price already has a 15% discount. If the buyer has to pay ₹3,068.5 for the article, find the marked price of the article.", "o": ["₹3,500", "₹3,780", "₹3,700", "₹3,800"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Equivalent discount = 5 + 15 − (5 × 15)/100 = 19.25%. So 3068.5 = (100 − 19.25)/100 × MP = 0.8075 × MP, giving MP = 3068.5/0.8075 = ₹3800.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0690", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q106", "exam": "", "q": "After successive discounts of 10%, 5% and 4% on the marked price of an article, it was sold for ₹98,496. What was the marked price of the article?", "o": ["₹1,20,200", "₹1,20,500", "₹1,10,700", "₹1,20,000"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the marked price be x. x × 90/100 × 95/100 × 96/100 = 98496, so x = 98496 × 10⁶/(90 × 95 × 96) = ₹1,20,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0691", "ch": 11, "page": 101, "ansPage": 101, "srcNo": "Business Maths Q107", "exam": "", "q": "The cost price of an article is ₹750. It is marked up so that a 30% profit could be made. If a customer is given a 15% discount on it, what is the selling price of the article?", "o": ["₹800", "Equal to the cost price", "₹828.75", "₹758.75"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Marked price = 750 × 130/100 = ₹975. After a 15% discount the selling price = 975 × 85/100 = ₹828.75.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0692", "ch": 11, "page": 102, "ansPage": 102, "srcNo": "Business Maths Q108", "exam": "", "q": "A dealer gives a 7% discount on the marked price and gives 1 article free on every purchase of 25 articles, and thereby earns a 25% profit. Find the percentage increase of the marked price over the cost price (to two decimal places).", "o": ["1.4%", "38.87%", "37.88%", "39.78%"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the cost of each article be ₹100. The cost of 26 articles = 2600, and the dealer earns 25%, so the selling price of 25 articles = 2600 × 125/100 = ₹3250. Selling price of 1 article = 3250/25 = ₹130. If the marked price is 100 the selling price is 93, so marked price = 100 × 130/93 = 139.78. The marked price is 39.78% above the cost price.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0693", "ch": 11, "page": 102, "ansPage": 102, "srcNo": "Business Maths Q109", "exam": "", "q": "Three traders A, B and C sell sewing machines at the same list price. Trader A allows two successive discounts of 30% and 16%; trader B allows two successive discounts of 20% and 26%; trader C allows two successive discounts of 25% and 20%. To get the maximum discount, which trader should the customer choose?", "o": ["Trader A", "Trader C", "Either Trader B or Trader C", "Trader B"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A: 30 + 16 − (30 × 16)/100 = 41.2%. B: 20 + 26 − (20 × 26)/100 = 40.8%. C: 25 + 20 − (25 × 20)/100 = 40%. Trader A gives the maximum discount.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0694", "ch": 11, "page": 102, "ansPage": 103, "srcNo": "Business Maths Q110", "exam": "", "q": "A shopkeeper announced a 30% discount on the marked price of an article. A person bought an article from the shop after getting a discount of ₹21,000, and sold it to a customer so that he earned a 32% profit on the marked price. Find the profit earned by the person on selling it (in rupees).", "o": ["10,000", "9,600", "21,600", "18,600"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The cost price to the person = ₹21,000 (the printed solution treats the amount paid as 21,000). The marked price = 21000 × 100/70 = ₹30,000. Selling price = 30000 × 132/100 = ₹39,600. Profit = 39600 − 21000 = ₹18,600.", "tip": "", "status": "note", "note": "The stem says 'after getting a discount of ₹21,000' but the printed solution takes ₹21,000 as the price paid. The printed key (d) follows that working.", "void": false}, {"id": "MTH-0695", "ch": 11, "page": 102, "ansPage": 102, "srcNo": "Business Maths Q111", "exam": "04.09.2023 S-I", "q": "In which stock is investing money more profitable? (A) 10% stock at ₹143. (B) 7% stock at ₹93.", "o": ["A", "B", "Equal profit in both", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the total investment be 143 × 93. In stock A the annual income = 10/143 × 143 × 93 = ₹930. In stock B the annual income = 7/93 × 143 × 93 = ₹1001. Stock B gives more income, so investing in the ₹93 stock is more profitable.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0696", "ch": 12, "page": 102, "ansPage": 102, "srcNo": "Business Maths Q112", "exam": "09.06.2024 S-I", "q": "A sum of ₹12000 deposited at compound interest becomes double in 5 years. After 20 years it will become ______.", "o": ["₹144000", "₹120000", "₹16400", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "24000 = 12000(1 + R/100)⁵, so (1 + R/100)⁵ = 2. After 20 years the amount x = 12000(1 + R/100)²⁰ = 12000 × [(1 + R/100)⁵]⁴ = 12000 × 2⁴ = 12000 × 16 = ₹192000, which is not among the options.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0697", "ch": 12, "page": 103, "ansPage": 103, "srcNo": "Business Maths Q113", "exam": "09.06.2024 S-I", "q": "A person borrowed some money and returned it in two equal annual instalments of ₹8820. If the rate of compound interest is 5% per annum, the amount borrowed was ______.", "o": ["₹17400", "₹16000", "₹16400", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Principal = 8820/(1.05) + 8820/(1.05)² = 8820(20/21 + 400/441) = 8820 × 820/441 = 20 × 820 = ₹16400.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0698", "ch": 12, "page": 103, "ansPage": 103, "srcNo": "Business Maths Q114", "exam": "23.05.2024 S-II", "q": "What is the sum whose compound interest for the second year at 10% per annum is ₹132?", "o": ["₹1000", "₹1120", "₹1200", "₹1320"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Interest for the second year = 10% of the amount at the end of the first year. In two years 10% and 10% give 21%, so the second-year interest is 21% − 10% = 11% of the principal. 11% of P = 132, so P = 132 × 100/11 = ₹1200.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0699", "ch": 12, "page": 103, "ansPage": 103, "srcNo": "Business Maths Q115", "exam": "23.05.2024 S-I", "q": "In how much time will ₹1600 amount to ₹1852.20 at a compound interest rate of 5% per annum?", "o": ["2 years", "3 years", "5 years", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "1852.20 = 1600(1.05)ᵗ, so (1.05)ᵗ = 1.157625 = (1.05)³. Hence t = 3 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0700", "ch": 12, "page": 103, "ansPage": 104, "srcNo": "Business Maths Q116", "exam": "23.05.2024 S-I", "q": "The value of a property is ₹500000 and it depreciates by 10% every year. In how much time will its value become ₹364500?", "o": ["3 years", "3 1/2 years", "2 years", "2 1/2 years"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A = P(1 − r/100)ⁿ: 364500 = 500000(0.9)ⁿ, so (0.9)ⁿ = 729/1000 = (9/10)³. Hence n = 3 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0701", "ch": 12, "page": 104, "ansPage": 104, "srcNo": "Business Maths Q117", "exam": "24.05.2024 S-I", "q": "A table is bought by paying ₹750 at once and ₹436 six months later. If the rate of simple interest charged is 18% per annum, the cash price of the table is ______.", "o": ["₹1186", "₹1180", "₹1150", "₹1100"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the balance due after the ₹750 payment be ₹P. It is cleared six months later with ₹436 including simple interest, so 436 − P = P × 18 × (1/2)/100, so 43600 − 100P = 9P, giving 109P = 43600 and P = ₹400. The cash price of the table = 400 + 750 = ₹1150.", "tip": "", "status": "note", "note": "The stem is partly illegible in the source; it is rebuilt from the printed solution.", "void": false}, {"id": "MTH-0702", "ch": 12, "page": 104, "ansPage": 104, "srcNo": "Business Maths Q118", "exam": "24.05.2024 S-I", "q": "Mohan bought a house for ₹30000 which depreciates at 25% per annum. What will be the value of the house after 3 years?", "o": ["₹13656", "₹13656.25", "₹12656", "₹12656.25"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A = P(1 − r/100)ᵗ = 30000(1 − 25/100)³ = 30000 × (3/4)³ = 30000 × 27/64 = ₹12656.25.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-062", "first": true, "kind": "exact", "of": null}}, {"id": "MTH-0703", "ch": 12, "page": 104, "ansPage": 104, "srcNo": "Business Maths Q119", "exam": "22.05.2024 S-II", "q": "The principal that will amount to ₹4913 after 3 years, if the rate of interest is 6 1/4% per annum compounded annually, is ______.", "o": ["₹4500", "₹4096", "₹4296", "₹4400"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "6 1/4% = 1/16. A = P(1 + 1/16)³ = P(17/16)³, so 4913 = P × 4913/4096, giving P = ₹4096.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0704", "ch": 12, "page": 104, "ansPage": 104, "srcNo": "Business Maths Q120", "exam": "22.05.2024 S-I", "q": "On a sum of money at 4% per annum, the difference between the compound interest and the simple interest for two years is ₹20. The sum is ______.", "o": ["₹12000", "₹12500", "₹13500", "₹10000"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "SI = P × 4 × 2/100 = 0.08P. CI = P(1.04)² − P = 0.0816P. The difference is 0.0016P = 20, so P = 20/0.0016 = ₹12,500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0705", "ch": 12, "page": 105, "ansPage": 105, "srcNo": "Business Maths Q121", "exam": "22.05.2024 S-I", "q": "A refrigerator was bought 2 years ago and depreciates at 12% per annum. Its present value is ₹9680. At what price was it bought?", "o": ["₹12000", "₹12500", "₹13000", "₹13500"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Present value = P(1 − 0.12)² = P × 0.7744 = 9680, so P = 9680/0.7744 = ₹12,500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0706", "ch": 12, "page": 105, "ansPage": 105, "srcNo": "Business Maths Q122", "exam": "18.09.2023 S-V", "q": "On a certain sum, the difference between the compound interest and the simple interest at 4% for two years is ₹20. The sum is ______.", "o": ["₹12000", "₹12500", "₹13500", "₹10000"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For two years the difference between CI and SI = P(r/100)². So 20 = P × (4/100)², giving P = 20 × 25 × 25 = ₹12,500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0707", "ch": 12, "page": 105, "ansPage": 105, "srcNo": "Business Maths Q123", "exam": "18.09.2023 S-V", "q": "A refrigerator was bought 2 years ago, depreciating at 12% per annum. Its present value is ₹9680. At what price was it bought?", "o": ["₹12000", "₹12500", "₹13000", "₹13500"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the price 2 years ago be ₹x. 9680 = x(1 − 12/100)² = x × (22/25)², so x = 9680 × 25 × 25/(22 × 22) = ₹12,500.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0708", "ch": 12, "page": 105, "ansPage": 105, "srcNo": "Business Maths Q124", "exam": "05.09.2023 S-IV", "q": "A sum of ₹12000 deposited at compound interest becomes double in 5 years. After 20 years it will become ______.", "o": ["₹144000", "₹120000", "₹192000", "₹116000"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "12000 × 2 = 12000(1 + r/100)⁵, so (1 + r/100)⁵ = 2. After 20 years: 12000 × [(1 + r/100)⁵]⁴ = 12000 × 2⁴ = ₹192000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0709", "ch": 12, "page": 105, "ansPage": 105, "srcNo": "Business Maths Q125", "exam": "05.09.2023 S-IV", "q": "At 10% annual compound interest, ₹1800 gives ₹378 as compound interest in a certain time. What is the time in years?", "o": ["2 years", "3 years", "1 1/2 years", "2 1/2 years"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Amount = 1800 + 378 = ₹2178. 2178 = 1800(1.1)ⁿ, so (1.1)ⁿ = 121/100 = (11/10)². Hence n = 2 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0710", "ch": 12, "page": 105, "ansPage": 105, "srcNo": "Business Maths Q126", "exam": "05.09.2023 S-IV", "q": "A TV set is sold for ₹20000 cash, or ₹6000 immediately and ₹16800 as a single instalment after 6 months. What is the rate of interest for the instalment plan?", "o": ["30%", "35%", "40%", "25%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The balance after paying ₹6000 immediately = 20000 − 6000 = ₹14000. Interest charged = 16800 − 14000 = ₹2800. Simple interest = P × r × t/100: 2800 = 14000 × r × 6/(100 × 12), so r = 2800 × 2/140 = 40%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0711", "ch": 12, "page": 106, "ansPage": 106, "srcNo": "Business Maths Q127", "exam": "05.09.2023 S-IV", "q": "A cycle is sold for ₹500 cash immediately, or ₹610 after one month as an instalment. If interest is charged at 20% per annum, find the cash price of the cycle.", "o": ["₹1100", "₹1110", "₹1200", "₹1122"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the cash price be ₹P. The balance after paying ₹500 = P − 500. Interest = 610 − (P − 500) = 1110 − P. Simple interest on (P − 500) for 1 month at 20%: (P − 500) × 20 × 1/(100 × 12) = (P − 500)/60. So 1110 − P = (P − 500)/60, giving 66600 − 60P = P − 500, so 67100 = 61P and P = ₹1100.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0712", "ch": 12, "page": 106, "ansPage": 106, "srcNo": "Business Maths Q128", "exam": "05.09.2023 S-III", "q": "What will be the difference between the compound interest and the simple interest on ₹1000 at 5% per annum for 2 years?", "o": ["₹2", "₹3", "₹2.50", "₹3.50"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "CI = 1000[(1.05)² − 1] = 102.50. SI = 1000 × 5 × 2/100 = 100. Difference = ₹2.50.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0713", "ch": 12, "page": 106, "ansPage": 106, "srcNo": "Business Maths Q129", "exam": "05.09.2023 S-III", "q": "What sum has a compound interest of ₹132 for the second year at 10% per annum?", "o": ["₹1000", "₹1120", "₹1200", "₹1320"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the principal be ₹P. CI for 2 years − CI for 1 year = 132: P[(1.1)² − 1] − P[1.1 − 1] = 132, so 0.21P − 0.1P = 0.11P = 132 and P = ₹1200.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0714", "ch": 12, "page": 106, "ansPage": 106, "srcNo": "Business Maths Q130", "exam": "05.09.2023 S-III", "q": "In how many years will ₹2000 earn a compound interest of ₹163.20 at 4% per annum?", "o": ["3 years", "4 years", "2 years", "5 years"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "163.20 = 2000[(1.04)ⁿ − 1], so (1.04)ⁿ = 1.0816 = (1.04)². Hence n = 2 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0715", "ch": 12, "page": 107, "ansPage": 107, "srcNo": "Business Maths Q131", "exam": "05.09.2023 S-III", "q": "Mohan bought a house for ₹30000 which depreciates at 25% per annum. What will be the value of the house after 3 years?", "o": ["₹13656", "₹13656.25", "₹12656", "₹12656.25"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Value after 3 years = 30000 × (75/100)³ = 30000 × 27/64 = ₹12656.25.", "tip": "", "status": "ok", "note": "", "void": false, "dup": {"group": "DUP-062", "first": false, "kind": "exact", "of": "MTH-0702"}}, {"id": "MTH-0716", "ch": 12, "page": 107, "ansPage": 107, "srcNo": "Business Maths Q132", "exam": "05.09.2023 S-III", "q": "A refrigerator is bought by paying ₹7000 at once and ₹3180 three months later. If the rate of interest is 24% per annum, the cash value of the refrigerator will be ______.", "o": ["₹10000", "₹10100", "₹1080", "₹10150"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Interest rate = 24% per annum = 6% per quarter. The balance x due now, paid after 3 months with 6% interest: x(1 + 6/100) = 3180, so x = ₹3000. The cash value = 7000 + 3000 = ₹10000.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source; it is rebuilt from the printed solution.", "void": false}, {"id": "MTH-0717", "ch": 12, "page": 107, "ansPage": 107, "srcNo": "Business Maths Q133", "exam": "04.09.2023 S-II", "q": "What will be the compound interest on ₹16000 at 10% per annum for 1 year, if interest is payable half-yearly?", "o": ["₹1600", "₹1640", "₹1700", "₹1740"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Rate per half-year = 5%, time = 2 half-years. CI = 16000[(1.05)² − 1] = 16000 × 0.1025 = ₹1640.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0718", "ch": 12, "page": 107, "ansPage": 107, "srcNo": "Business Maths Q134", "exam": "04.09.2023 S-II", "q": "At what rate of compound interest will ₹4000 earn a compound interest of ₹410 in 2 years?", "o": ["5%", "6%", "4%", "7%"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A = 4000 + 410 = 4410. 4410 = 4000(1 + r/100)², so (1 + r/100)² = 441/400 = (21/20)². Hence 1 + r/100 = 21/20 and r = 5%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0719", "ch": 12, "page": 107, "ansPage": 107, "srcNo": "Business Maths Q135", "exam": "04.09.2023 S-II", "q": "The price of a property is ₹500000 and it depreciates by 10% every year. In how much time will its value become ₹364500?", "o": ["3 years", "3 1/2 years", "2 years", "2 1/2 years"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "364500 = 500000(1 − 10/100)ᵗ, so (0.9)ᵗ = 729/1000 = (9/10)³ and t = 3 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0720", "ch": 12, "page": 108, "ansPage": 108, "srcNo": "Business Maths Q136", "exam": "04.09.2023 S-II", "q": "A camera is bought by paying ₹2500 at once and ₹2100 three months later. If the rate of interest charged is 20% per annum, find the cash price of the camera.", "o": ["₹4500", "₹4600", "₹4700", "₹4400"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the cash value be ₹x. The balance after paying ₹2500 is x − 2500. It is cleared three months later by ₹2100, which includes simple interest at 20% for 3 months: (x − 2500) × 20/100 × 3/12 = (x − 2500)/20. So 2100 − (x − 2500) = (x − 2500)/20, i.e. 4600 − x = (x − 2500)/20, giving 92000 − 20x = x − 2500, so 21x = 94500 and x = ₹4500.", "tip": "", "status": "note", "note": "The stem is partly garbled in the source; it is rebuilt from the printed solution.", "void": false}, {"id": "MTH-0721", "ch": 12, "page": 108, "ansPage": 108, "srcNo": "Business Maths Q137", "exam": "24.05.2024 S-I", "q": "In how much time will ₹1600 amount to ₹1852.20 at a compound interest rate of 5% per annum?", "o": ["2 years", "3 years", "4 years", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "1852.20 = 1600(1 + 5/100)ⁿ, so (21/20)ⁿ = 1852.2/1600 = 9261/8000 = (21/20)³. Hence n = 3 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0722", "ch": 12, "page": 108, "ansPage": 108, "srcNo": "Business Maths Q138", "exam": "", "q": "The sum which will earn a simple interest of ₹126 in 2 years at 14% per annum is ______.", "o": ["₹394", "₹395", "₹450", "₹540"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "SI = P × R × T/100, so 126 = P × 14 × 2/100, giving P = ₹450.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0723", "ch": 12, "page": 108, "ansPage": 108, "srcNo": "Business Maths Q139", "exam": "UP TGT 2021", "q": "A sum becomes double in 5 years at compound interest. When will it become 8 times at the same rate of interest?", "o": ["10 years", "15 years", "7 years", "20 years"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "2P = P(1 + x/100)⁵, so (1 + x/100)⁵ = 2. For 8 times: 8 = (1 + x/100)ᵗ, i.e. 2³ = (2^(1/5))ᵗ, so 3 = t/5 and t = 15 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0724", "ch": 12, "page": 108, "ansPage": 108, "srcNo": "Business Maths Q140", "exam": "UP TGT-2016 (08-03-2019)", "q": "A sum of money doubles itself in 4 years at compound interest. It will amount to 8 times itself at the same rate of interest in ______.", "o": ["12 years", "16 years", "18 years", "24 years"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Doubling takes 4 years, and 8 = 2³, so it takes 3 × 4 = 12 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0725", "ch": 12, "page": 109, "ansPage": 109, "srcNo": "Business Maths Q141", "exam": "UP TGT-2016 (08-03-2019)", "q": "The compound interest on ₹8000 at 10% per annum for 1.5 years, if the interest is calculated half-yearly, is ______.", "o": ["₹9261", "₹860", "₹961", "₹1261"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The half-yearly rate is 5% and the time is 3 half-years. CI = 8000[(1.05)³ − 1] = 8000 × (9261/8000 − 1) = 9261 − 8000 = ₹1261.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0726", "ch": 12, "page": 109, "ansPage": 109, "srcNo": "Business Maths Q142", "exam": "UP TGT-2016 (08-03-2019)", "q": "How much will ₹25000 amount to in 2 years at compound interest, if the rate of interest for successive years is 4% and 5% per year?", "o": ["₹25,300", "₹26,300", "₹27,300", "₹28,300"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Amount = 25000 × (1 + 4/100)(1 + 5/100) = 25000 × 26/25 × 21/20 = ₹27,300.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0727", "ch": 12, "page": 109, "ansPage": 109, "srcNo": "Business Maths Q143", "exam": "DSSSB 23 SEP 2018 (9 AM-11 AM)", "q": "If interest is compounded at 8% per annum, what is the compound interest on ₹4800 in 30 months (to the nearest whole number)?", "o": ["₹1021", "₹1032", "₹1023", "₹960"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "30 months = 2 years 6 months. Interest for the first 2 years is compounded; for the extra 6 months simple interest is added. Simple interest for 6 months on ₹4800 = 4800 × 8 × 1/(100 × 2) = ₹192, so the amount is taken as 4800 + 192 = 4992 for the compounding part: 4992 × (1.08)² ... the printed solution computes 4992 × (27/25)² = 5822.66, so the compound interest = 5822.66 − 4800 = 1022.66 ≈ ₹1023.", "tip": "", "status": "note", "note": "The printed solution first adds the 6-month interest (₹192) to the principal and then compounds for 2 years. The method and the question wording are as printed; the exam asked for the nearest integer.", "void": false}, {"id": "MTH-0728", "ch": 12, "page": 109, "ansPage": 109, "srcNo": "Business Maths Q144", "exam": "DSSSB 23 SEP 2018 (9 AM-11 AM)", "q": "A sum of money becomes 120% of itself in 3 years at simple interest. In how many years will it become 150% of itself?", "o": ["15/2 years", "7 years", "5 years", "17/2 years"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Let the principal be 100. In 3 years the interest is 20, so the rate = 20/3 % per annum. For 150% the interest must be 50: 50 = 100 × t × (20/3)/100, so t = 150/20 = 15/2 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0729", "ch": 12, "page": 109, "ansPage": 109, "srcNo": "Business Maths Q145", "exam": "TGT 1999", "q": "A sum of money becomes three times itself in 4 years at a certain rate of compound interest. In how many years will it become 27 times itself?", "o": ["36 years", "9 years", "12 years", "21 years"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "3x = x(1 + r/100)⁴, so (1 + r/100)⁴ = 3. For 27 times: 27 = (1 + r/100)ⁿ = ((1 + r/100)⁴)^(n/4) = 3^(n/4), so 3³ = 3^(n/4) and n = 12 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0730", "ch": 12, "page": 110, "ansPage": 110, "srcNo": "Business Maths Q146", "exam": "PGT 2010", "q": "A certain sum is invested at compound interest at 8% per year. In how many years will the amount be doubled?", "o": ["log₁₀2/(log₁₀27 − log₁₀25)", "log₁₀3/(log₁₀27 − log₁₀25)", "log₁₀(50/27)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "2P = P(1 + 8/100)ⁿ, so 2 = (27/25)ⁿ. Taking logarithms, log 2 = n(log 27 − log 25), so n = log 2/(log 27 − log 25).", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0731", "ch": 12, "page": 110, "ansPage": 110, "srcNo": "Business Maths Q147", "exam": "TGT 2011", "q": "A sum of money doubles in 15 years at compound interest. It will become 8 times in ______.", "o": ["30 years", "40 years", "45 years", "60 years"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "2P = P(1 + r/100)¹⁵, so (1 + r/100)¹⁵ = 2. For 8 times, (1 + r/100)ⁿ = 8 = 2³ = ((1 + r/100)¹⁵)³ = (1 + r/100)⁴⁵, so n = 45 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0732", "ch": 12, "page": 110, "ansPage": 110, "srcNo": "Business Maths Q148", "exam": "TGT 2013", "q": "The difference between the simple interest and the compound interest on ₹1250 at 8% per annum for 2 years is ______.", "o": ["₹8", "₹12", "₹15", "₹20"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "SI = 1250 × 8 × 2/100 = ₹200. CI = 1250[(27/25)² − 1] = 1250 × 104/625 = ₹208. The difference = 208 − 200 = ₹8.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0733", "ch": 12, "page": 110, "ansPage": 110, "srcNo": "Business Maths Q149", "exam": "TGT 2010", "q": "A man takes a loan of ₹8000 from a bank on the rule that for the first 5 years the bank rate is 6%, for the next 3 years the rate is 8%, and for the next 4 years the rate is 10% simple interest. If he repays the loan at the end of 12 years, how much interest must he pay?", "o": ["₹7500", "₹7505", "₹7520", "₹7000"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Interest = 8000(6 × 5 + 8 × 3 + 10 × 4)/100 = 8000 × (30 + 24 + 40)/100 = 8000 × 94/100 = ₹7520.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0734", "ch": 12, "page": 110, "ansPage": 110, "srcNo": "Business Maths Q150", "exam": "TGT 2010", "q": "Mohan opened a savings bank account on 5th Oct 2007 by depositing ₹500. Again he deposited ₹500 on 7th Oct 2007. After one week he deposited ₹1000 and on 15th Oct 2007 he deposited ₹500. On how much amount will he get interest?", "o": ["₹500", "₹1000", "₹1500", "₹2000"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A savings bank pays interest on the minimum balance between the 10th and the last day of the month. Between the 11th and the 31st of October the balance does not go below 500 + 500 = ₹1000 (deposits of ₹1000 on 14 Oct and ₹500 on 15 Oct came after the 10th), so interest is paid on ₹1000.", "tip": "", "status": "note", "note": "The date of the third deposit is printed as 14 Oct 2007 in the printed solution ('after one week').", "void": false}, {"id": "MTH-0735", "ch": 12, "page": 111, "ansPage": 111, "srcNo": "Business Maths Q151", "exam": "TGT 2010", "q": "A car manufacturing company is manufacturing 70000 cars. If the production rate is 10%, after how many years will production be 93170 cars?", "o": ["2 years", "4 years", "3 years", "1 1/2 years"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "93170 = 70000(1 + 10/100)ⁿ, so (11/10)ⁿ = 93170/70000 = 1331/1000 = (11/10)³. Hence n = 3 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0736", "ch": 12, "page": 111, "ansPage": 111, "srcNo": "Business Maths Q152", "exam": "", "q": "Disha invested ₹20000 at simple interest for 9 years and received a total of ₹33,500. What is the rate of interest?", "o": ["9%", "7.5%", "8.5%", "8%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Interest = 33500 − 20000 = ₹13500 = 20000 × r × 9/100, so r = 13500/1800 = 7.5%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0737", "ch": 12, "page": 111, "ansPage": 111, "srcNo": "Business Maths Q153", "exam": "", "q": "A certain sum lent at simple interest becomes ₹13,000 in 3 years and ₹15,000 in 5 years. Find the annual rate of interest.", "o": ["14%", "15%", "10%", "12%"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The interest for 2 years = 15000 − 13000 = ₹2000, so the interest for 1 year = ₹1000. Interest for 3 years = ₹3000, so the principal = 13000 − 3000 = ₹10000. Rate = 1000/10000 × 100 = 10%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0738", "ch": 12, "page": 111, "ansPage": 111, "srcNo": "Business Maths Q154", "exam": "", "q": "What is the ratio of the simple interest earned on a certain sum in 8 years at 21% per annum to the simple interest earned on the same sum in 21 years at 21% per annum?", "o": ["8 : 21", "21 : 5", "21 : 8", "5 : 21"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "SI₁/SI₂ = (P × 8 × 21)/(P × 21 × 21) = 8/21, so the ratio is 8 : 21.", "tip": "", "status": "note", "note": "The wording of the stem is partly illegible in the source and is rebuilt from the printed working.", "void": false}, {"id": "MTH-0739", "ch": 12, "page": 111, "ansPage": 111, "srcNo": "Business Maths Q155", "exam": "", "q": "A person invests a sum of ₹1,05,750 in the names of his son, daughter and wife in such a way that they receive equal simple interest after 3, 4 and 5 years respectively. If the rate of interest is 5% per annum, find the amount invested for the wife.", "o": ["₹30,000", "₹25,000", "₹27,000", "₹28,000"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Let the amounts be x, y and z. Equal interest: x × 3 × 5/100 = y × 4 × 5/100 = z × 5 × 5/100, so 3x = 4y = 5z. Then x : y : z = 20 : 15 : 12. The wife's share = 105750 × 12/47 = ₹27,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0740", "ch": 12, "page": 111, "ansPage": 112, "srcNo": "Business Maths Q156", "exam": "", "q": "The amount obtained on a certain sum at 6% simple interest in 3 years is ₹14,160. Find the simple interest obtained on the same sum at the same rate in 4 2/3 years.", "o": ["₹2,800", "₹3,920", "₹3,120", "₹3,360"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Let the principal be P. P(1 + 6 × 3/100) = 14160, so P = 14160/1.18 = ₹12000. Simple interest in 4 2/3 years = 12000 × 6 × (14/3)/100 = ₹3360.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0741", "ch": 12, "page": 112, "ansPage": 112, "srcNo": "Business Maths Q157", "exam": "", "q": "Sunita invests ₹12,000 at 10% per annum simple interest to receive ₹20,400 after a certain period. For how long does she invest to obtain this amount?", "o": ["6 years", "8 years", "9 years", "7 years"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Interest = 20400 − 12000 = ₹8400. SI = P × R × T/100, so 8400 = 12000 × 10 × T/100, giving T = 8400 × 100/(12000 × 10) = 7 years.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0742", "ch": 12, "page": 112, "ansPage": 112, "srcNo": "Business Maths Q158", "exam": "", "q": "At what annual rate of simple interest will a sum of money double itself in 8 1/3 years?", "o": ["12% per annum", "7% per annum", "8.5% per annum", "8% per annum"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If the sum doubles, the interest equals the principal: P = P × R × (25/3)/100, so R = 300/25 = 12%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0743", "ch": 12, "page": 112, "ansPage": 112, "srcNo": "Business Maths Q159", "exam": "", "q": "A sum of money at simple interest amounts to ₹750 in 3 years and ₹825 in 4 years. Find the sum.", "o": ["₹525", "₹550", "₹475", "₹500"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Interest for 1 year = 825 − 750 = ₹75. Interest for 3 years = 3 × 75 = ₹225. Principal = 750 − 225 = ₹525.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0744", "ch": 12, "page": 112, "ansPage": 112, "srcNo": "Business Maths Q160", "exam": "", "q": "At simple interest at y% per annum, a sum of ₹x amounts to ₹8,563.50 in 3 1/2 years and to ₹10,527 in 7 years. Find x and y respectively.", "o": ["6600 and 8 1/2", "6600 and 8", "6800 and 8 1/2", "7000 and 8"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The interest for (7 − 3.5) = 3.5 years = 10527 − 8563.50 = ₹1963.50. So the principal x = 8563.50 − 1963.50 = ₹6600. Then 1963.50 = 6600 × y × 3.5/100, giving y = 8.5%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0745", "ch": 12, "page": 112, "ansPage": 113, "srcNo": "Business Maths Q161", "exam": "", "q": "A sum of money at a certain simple interest rate becomes ₹820 in 3 years and ₹894 in 4 years. What will be the interest after 9 years?", "o": ["₹766", "₹686", "₹666", "₹676"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Interest for 1 year = 894 − 820 = ₹74. Interest for 3 years = ₹222, so the principal = 820 − 222 = ₹598. Interest for 9 years = 74 × 9 = ₹666.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0746", "ch": 12, "page": 113, "ansPage": 113, "srcNo": "Business Maths Q162", "exam": "", "q": "A sum lent at simple interest amounts to ₹6,076 in one year and ₹7,504 in 4 years. The sum and the rate of interest per annum are respectively ______.", "o": ["₹5,400 and 10%", "₹5,600 and 8.5%", "₹5,400 and 9%", "₹5,600 and 9%"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Interest for 3 years = 7504 − 6076 = ₹1428, so interest for 1 year = ₹476. Principal = 6076 − 476 = ₹5600. Rate = 476/5600 × 100 = 8.5%.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0747", "ch": 12, "page": 113, "ansPage": 113, "srcNo": "Business Maths Q163", "exam": "", "q": "A sum is invested at simple interest at a certain rate for 7 years. If the rate of interest were 8% higher, the interest would have been ₹2240 more. Find the sum invested (in ₹).", "o": ["3500", "4000", "5000", "6000"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Let the sum be P and the rate r. P × (r + 8) × 7/100 − P × r × 7/100 = 2240, so P × 56/100 = 2240 and P = ₹4000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0748", "ch": 12, "page": 113, "ansPage": 113, "srcNo": "Business Maths Q164", "exam": "", "q": "The compound interest on a certain sum at 10% per annum, compounded half-yearly, for 1.5 years is ₹5,044. What is the sum?", "o": ["₹33,000", "₹22,000", "₹32,000", "₹37,044"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The rate per half-year is 5% and the time is 3 half-years. CI = P[(1.05)³ − 1] = P × 1261/8000 = 5044, so P = 5044 × 8000/1261 = ₹32,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0749", "ch": 12, "page": 113, "ansPage": 113, "srcNo": "Business Maths Q165", "exam": "", "q": "If the simple interest on ₹2,800 at 10% per annum in 3 years is ₹x, and the simple interest on ₹6,200 at 14% per annum in y years is ₹1,736, what is the value of x/y?", "o": ["140", "420", "550", "380"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "x = 2800 × 10 × 3/100 = ₹840. 1736 = 6200 × 14 × y/100, so y = 2. Then x/y = 840/2 = 420.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0750", "ch": 12, "page": 113, "ansPage": 114, "srcNo": "Business Maths Q166", "exam": "", "q": "The compound interest on ₹18,000 at 7% per annum, compounded annually, is ₹1,260. Find the time.", "o": ["4 years", "1 year", "3 years", "2 years"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "1260 = 18000[(1.07)ⁿ − 1], so (1.07)ⁿ = 1.07 and n = 1 year.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0751", "ch": 12, "page": 114, "ansPage": 114, "srcNo": "Business Maths Q167", "exam": "", "q": "Find the amount obtained on investing ₹5,000 by P at an annual rate of 5%, with interest compounded quarterly, for a period of one year. (Give your answer to the nearest whole number.)", "o": ["₹5,200", "₹5,945", "₹5,330", "₹5,255"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Rate per quarter = 5/4 = 1.25%, and there are 4 quarters. A = 5000(1.0125)⁴ ≈ 5000 × (81/80)⁴ ≈ ₹5254.7 ≈ ₹5255.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0752", "ch": 12, "page": 114, "ansPage": 114, "srcNo": "Business Maths Q168", "exam": "", "q": "If ₹6,500 is borrowed for 2 years at 10% per annum compounded half-yearly, find the amount (to the nearest whole number).", "o": ["₹7,900", "₹7,650", "₹8,150", "₹8,250"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The rate per half-year is 5% and there are 4 half-years. A = 6500(1.05)⁴ = 6500 × (21/20)⁴ = 7900.79 ≈ ₹7900.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0753", "ch": 12, "page": 114, "ansPage": 114, "srcNo": "Business Maths Q169", "exam": "", "q": "What is the difference (in ₹) between the compound interest on ₹50,000 at 8% per annum compounded half-yearly and compounded annually for one year?", "o": ["100", "80", "70", "50"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Annually: CI = 50000 × 8/100 = ₹4000. Half-yearly: CI = 50000[(1.04)² − 1] = 50000 × 0.0816 = ₹4080. Difference = ₹80.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0754", "ch": 12, "page": 114, "ansPage": 114, "srcNo": "Business Maths Q170", "exam": "", "q": "What will be the compound interest (in ₹) on ₹62,500 at 12% per annum compounded every 8 months for two years?", "o": ["16,548", "16,232", "13,428", "18,342"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Two years contain 24/8 = 3 periods of 8 months. Rate per period = 12 × 8/12 = 8%. CI = 62500[(1.08)³ − 1] = 62500 × (19683 − 15625)/15625 = 62500 × 4058/15625 = ₹16232.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0755", "ch": 12, "page": 115, "ansPage": 115, "srcNo": "Business Maths Q171", "exam": "", "q": "The compound interest (compounded annually) on a certain sum at 21% per annum for 2 years is ₹11,138.40. What is the total amount obtained after 2 years?", "o": ["35,138.40", "31,538.040", "24,000.50", "28,315.40"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "11138.40 = P[(1.21)² − 1] = P × 4641/10000, so P = ₹24000. Amount = 24000 + 11138.40 = ₹35,138.40.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0756", "ch": 12, "page": 115, "ansPage": 115, "srcNo": "Business Maths Q172", "exam": "", "q": "If interest is compounded half-yearly, what is the compound interest (in ₹, to the nearest whole number) on ₹7,200 at 20% per annum for 18 months?", "o": ["2,338", "3,238", "2,833", "2,383"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Rate per half-year = 10% and 18 months = 3 half-years. CI = 7200[(1.1)³ − 1] = 7200 × 331/1000 = 2383.2 ≈ ₹2383.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0757", "ch": 12, "page": 115, "ansPage": 115, "srcNo": "Business Maths Q173", "exam": "", "q": "If the rate of interest is 5% for the first year, 6% for the second year and 8% for the third year, what sum will amount to ₹30,051 in 3 years under compound interest?", "o": ["₹25,000", "₹30,000", "₹28,000", "₹26,000"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Amount = P(1 + 5/100)(1 + 6/100)(1 + 8/100) = P × 21/20 × 53/50 × 27/25 = 30051. So P = 30051 × 20 × 50 × 25/(21 × 53 × 27) = ₹25,000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0758", "ch": 12, "page": 115, "ansPage": 115, "srcNo": "Business Maths Q174", "exam": "", "q": "When interest is compounded every 8 months at 12% per annum, the compound interest earned on a sum in 1 1/3 years is ₹2496. At the same rate, if interest is compounded annually, what will the same sum amount to in 4 years (in ₹, to the nearest whole number)?", "o": ["23603", "20336", "26033", "30632"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Rate per 8 months = 8%. Time = 1 1/3 years = 2 periods. 2496 = P[(1.08)² − 1] = P × 104/625... (729/625 − 1 = 104/625), so P = 2496 × 625/104 = ₹15,000. Compounded annually at 12% for 4 years: A = 15000(1.12)⁴ ≈ ₹23,603.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0759", "ch": 12, "page": 115, "ansPage": 116, "srcNo": "Business Maths Q175", "exam": "", "q": "A certain sum amounts to ₹6655 in 3 years at 10% per annum compound interest. If the same sum is lent at 1.5 times the earlier rate for 2 years, the interest earned is ₹x. If interest is compounded annually in both cases, what is the value of x?", "o": ["1725.75", "1516.25", "1612.50", "1000"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "6655 = P(1.1)³, so P = 6655/1.331 = ₹5000. The new rate = 10 × 1.5 = 15%. Amount after 2 years = 5000(1.15)² = 5000 × 23/20 × 23/20 = ₹6612.50. Interest x = 6612.50 − 5000 = ₹1612.50.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0760", "ch": 12, "page": 116, "ansPage": 116, "srcNo": "Business Maths Q176", "exam": "", "q": "What is the compound interest on a sum of ₹8000 for 1 1/2 years at 10% per annum, compounded half-yearly?", "o": ["₹1,261", "₹1,461", "₹1,260", "₹1,360"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The rate per half-year is 5% and the time is 3 half-years. CI = 8000[(1.05)³ − 1] = 8000 × (9261 − 8000)/8000 = ₹1261.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0761", "ch": 12, "page": 116, "ansPage": 116, "srcNo": "Business Maths Q177", "exam": "", "q": "If interest is compounded half-yearly at 16% per annum, find the time in years for ₹5,000 to become ₹5,832.", "o": ["1.5 years", "1 year", "1/2 year", "2 years"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The rate per half-year = 8%. 5832 = 5000(1.08)ⁿ, so (1.08)ⁿ = 5832/5000 = 729/625 = (27/25)² = (1.08)². So n = 2 half-years = 1 year.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0762", "ch": 12, "page": 116, "ansPage": 116, "srcNo": "Business Maths Q178", "exam": "", "q": "Find the difference between the compound interests on ₹8,000 for 1 year at 10% per annum, when the interest is calculated annually and half-yearly.", "o": ["₹10", "₹40", "₹20", "₹30"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Annually the rate is 10%. Half-yearly the rate is 5% per half-year, so the effective rate for 1 year = 5 + 5 + (5 × 5)/100 = 10.25%. Difference = 8000 × (10.25 − 10)/100 = ₹20.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0763", "ch": 12, "page": 117, "ansPage": 117, "srcNo": "Business Maths Q179", "exam": "", "q": "At 10% per annum compound interest, the interest on a certain sum for 2 1/2 years is ₹1,623, when the interest is compounded annually. What is the sum?", "o": ["₹5,000", "₹6,000", "₹7,200", "₹6,500"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For the extra half-year, the interest is half of the annual rate (5%) on the amount after 2 years. CI = P[(1.1)²(1.05) − 1] = P[1.27050 − 1] = 0.2705P = 1623, so P = ₹6000.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0764", "ch": 12, "page": 117, "ansPage": 117, "srcNo": "Business Maths Q180", "exam": "", "q": "₹15,000 is lent at 16% compound interest per annum. What is the difference between the interest for the second year and the third year?", "o": ["₹548", "₹544", "₹445.44", "₹454.88"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Interest in year 1 = 15000 × 16/100 = ₹2400. Interest in year 2 = 2400 + 2400 × 4/25 = ₹2784. Interest in year 3 = 2784 + 2784 × 4/25 = 2784 + 445.44. The difference between the third and the second year's interest = ₹445.44.", "tip": "", "status": "ok", "note": "", "void": false}, {"id": "MTH-0765", "ch": 12, "page": 117, "
