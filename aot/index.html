ent for learning?", "o": ["To compare the performance of students against a standard or benchmark", "To identify students who can be classified as 'slow learners'", "To measure the performance of the student and give grades", "To provide feedback to students that can be used to improve their learning"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main goal of 'assessment for learning' is to provide feedback to students which can be used to improve their learning. A teacher can use both assessment for learning and assessment of learning to know the progress and level of achievement of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0920", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "922", "exam": "13/09/2023 S-I", "q": "Diagnostic evaluation ensures:", "o": ["Failures and weaknesses during instruction", "The degree of achievement of instructional objectives at the end", "The performance of students at the start of instruction", "The cause and remedy of continuous learning problems during instruction"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Diagnostic evaluation can find out the cause and remedy of continuous learning problems during instruction. Diagnostic evaluation helps teachers understand students' learning difficulties or lack of understanding, and helps identify the strengths and weaknesses and skills of slow learners.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0921", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "923", "exam": "14/09/2023 S-I", "q": "Which one of the following statements about assessment is NOT correct?", "o": ["Norm-referenced assessment tells us where a student stands in his performance compared to other students", "Norm-referenced assessment is useful for diagnostic testing and remedial teaching", "Criterion-referenced assessment measures the proficiency of students in learning", "Criterion-referenced assessment is useful for diagnostic testing and remedial teaching"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Norm-referenced assessment is not useful for diagnostic tests and remedial teaching; it is the traditional method of assessment, in which the assessment is based on a standard, in particular a class or general answers. Its main aim is to identify how a student performed compared with a previously determined peer group.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0922", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "924", "exam": "14/09/2023 S-I", "q": "A good evaluation has ______.", "o": ["Subjectivity", "Validity", "Bias", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A good evaluation has validity. Besides this, a good evaluation summarises findings and gives a clear diagnosis with supporting evidence. Characteristics of good evaluation: reliability, objectivity, validity, utility, practicability and usefulness.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-055", "first": false, "kind": "exact", "of": "AOT-0914"}}, {"id": "AOT-0923", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "925", "exam": "14/09/2023 S-I", "q": "Which of the following is NOT a type of evaluation?", "o": ["Constructive", "Debate", "Summative", "CCE"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Evaluation is a process that critically examines a programme. Types of evaluation: 1. formative or constructive evaluation; 2. summative evaluation; 3. continuous and comprehensive evaluation (CCE). So 'debate' is not a type of evaluation.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-056", "first": false, "kind": "near", "of": "AOT-0915"}}, {"id": "AOT-0924", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "926", "exam": "14/09/2023 S-I", "q": "Evaluation is related to:", "o": ["Subject", "Learning process", "Objective", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Evaluation is related to subject, learning process and objective. Evaluation is done to appraise a person's performance in a specific field. Teachers evaluate students to analyse and estimate their achievement.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-057", "first": false, "kind": "exact", "of": "AOT-0916"}}, {"id": "AOT-0925", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "927", "exam": "15/09/2023 S-I", "q": "The evaluation process is:", "o": ["Quantitative", "Qualitative", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The evaluation process can be quantitative and qualitative. Quantitative evaluation is expressed in numbers such as exam marks or student attendance; qualitative evaluation is expressed in words or descriptions, e.g. student essay or teacher observation. So the process can be both.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0926", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "928", "exam": "15/09/2023 S-I", "q": "The triangle of evaluation in education includes:", "o": ["Learning experience", "Guardian experience", "Teacher experience", "Learning experience (learner experience)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The triangle of evaluation in education has three parts: (1) educational objective, (2) learning experience, (3) evaluation. Learning experience is the process through which students learn and is the basis of the evaluation process, so it is part of the triangle.", "tip": "", "status": "note", "note": "Options (a) and (d) read almost identically in the source ('shikshan anubhav' vs 'adhigam anubhav'); (a) = teaching experience, (d) = learning experience."}, {"id": "AOT-0927", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "929", "exam": "15/09/2023 S-I", "q": "Evaluation plays a role in:", "o": ["Teaching", "Curriculum", "Examination", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Evaluation is an important process in education that plays an important role in teaching, curriculum and examination. In teaching, evaluation is used to measure students' progress and improve their learning; in curriculum, to modify the curriculum and meet students' needs; in examination, to measure students' achievements.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0928", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "930", "exam": "18/09/2023 S-I", "q": "Which of the following has the least scope?", "o": ["Evaluation", "Assessment", "Measurement", "Test"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A test is a method of measuring a person's ability, performance or knowledge in a particular area after education. Among the given options, a test has the least scope.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0929", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "931", "exam": "18/09/2023 S-I", "q": "What is the purpose of formative evaluation?", "o": ["Checking the final status", "Promotion to the next class", "Selection of students", "Monitoring the progress of students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The purpose of formative evaluation is to monitor the progress of students. It provides continuous feedback to both teacher and student, relating to successes and failures in the teaching process, with the aim of improving proficiency and effectiveness.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0930", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "932", "exam": "18/09/2023 S-I", "q": "Which one is the correct order?", "o": ["Test, measurement, assessment, evaluation", "Evaluation, test, measurement, assessment", "Test, assessment, evaluation, measurement", "Assessment, measurement, evaluation, test"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The correct order is: test, measurement, assessment, evaluation. Test is considered the smallest unit for evaluating teaching work; measurement is a technique of assessment and evaluation; assessment is the continuous process going on throughout the academic period; evaluation is value determination, showing the achievement of students at the end of the prescribed course through grades or marks.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0931", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "933", "exam": "18/09/2023 S-I", "q": "Marking of which of the following questions is more reliable?", "o": ["Multiple-choice question", "Essay", "Short answer", "Completion"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Marking of multiple-choice questions is reliable. A multiple-choice question is a type of questionnaire that gives options for answers; objective or MCQ is a form of evaluation in which respondents are asked to choose only the correct answer from a list of options.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0932", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "934", "exam": "18/09/2023 S-I", "q": "Marking of which type of question is difficult with reliability?", "o": ["Structured essay", "Unstructured essay", "Short answer", "Multiple-choice question"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "It is difficult to mark an unstructured essay-type question reliably. Unstructured essay questions are generally open-ended questions; common examples include 'Describe yourself' or 'What is your ideal job?'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0933", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "935", "exam": "18/09/2023 S-I", "q": "Projective techniques are used mainly for measuring ______.", "o": ["Intelligence", "Knowledge", "Personality", "Utility"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Projective techniques are a way of measuring personality in which the test gives opportunities for structuring responses in relation to ambiguous stimuli or subjects, with reference to their personal characteristics.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0934", "ch": 9, "page": 127, "ansPage": 127, "srcNo": "936", "exam": "18/09/2023 S-I", "q": "Summative evaluation is basically used:", "o": ["During the programme", "At all times", "At the end of the programme", "At the start of the programme"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Summative evaluation, often known as 'assessment of learning', is conducted at the end of the course or session to measure, classify, certify and report the level of learning of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0935", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "937", "exam": "18/09/2023 S-I", "q": "Summative evaluation is generally:", "o": ["Ongoing", "Continuous", "Certifying decisions", "Diagnostic"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The purpose of summative evaluation is to measure the understanding of the subject matter presented at the end of a specific unit of work, and it is often graded as a percentage; hence it is a semester-type exam. So summative evaluation is generally certifying decisions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0936", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "938", "exam": "18/09/2023 S-I", "q": "Which tool is often used in summative evaluation?", "o": ["Daily work", "Oral questioning", "Teacher observation", "Test"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Summative evaluation, or evaluation of learning, is done at the end of the learning period or programme. Tests are often used as tools in summative evaluation. General data sources for summative evaluation: survey, test or assessment, financial indicators, focus group or interview.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0937", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "939", "exam": "18/09/2023 S-I", "q": "The number of marks obtained in a class interval is:", "o": ["Frequency", "Class limits", "Mid-point", "Quartile"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The number of marks obtained in a class interval is called the frequency of that class interval.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0938", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "940", "exam": "18/09/2023 S-I", "q": "The difference between the maximum and minimum values is called:", "o": ["Mode", "Range", "Quartile", "Mean"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The difference between the maximum and minimum value in any given data is called its range. Range = maximum value of the data - minimum value of the data.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0939", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "941", "exam": "18/09/2023 S-I", "q": "What is the main advantage of essay-type questions?", "o": ["Can diagnose students' learning difficulties", "Essays are for marking", "Students can guess the answer", "They can measure complex learning outcomes that cannot be measured by other types of questions"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Essay-type questions, also called long-answer questions, are one of the response-construction techniques. The advantages of essay-type questions: they measure complex learning results that cannot be measured by other types of results/questions; they integrate thinking and problem-solving skills; they assess the student's writing skills; and they give opportunity for expression.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-058", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0940", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "942", "exam": "18/09/2023 S-I", "q": "The first step in measurement is:", "o": ["Scoring the test", "Managing the test", "Development of the test", "Deciding what is to be measured"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The first step in measurement is deciding what is to be measured. Stevens gave four levels of measurement: (1) nominal scale, (2) ordinal scale, (3) interval scale, (4) ratio scale. These categories are used in research work.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0941", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "943", "exam": "09/09/2020 S-III", "q": "A good test should not have:", "o": ["Subjectivity", "Objectivity", "Reliability", "Validity"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A good test should not have subjectivity. A good test should have validity, reliability, usability and objectivity.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0942", "ch": 9, "page": 128, "ansPage": 128, "srcNo": "944", "exam": "09/09/2020 S-III", "q": "What kind of questions would you like to ask the students in the class?", "o": ["Questions that all students can answer", "Questions that no students can answer", "Questions that hardly any student can answer", "Questions to answer which students have to think"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The teacher should like to ask in class the questions to answer which students have to think. Questions should be: factual, convergent, divergent, evaluative and combinative. The teacher should avoid questions whose answers can be given in 'yes' or 'no'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0943", "ch": 9, "page": 129, "ansPage": 129, "srcNo": "945", "exam": "09/09/2020 S-III", "q": "A teacher collects and reads the performance of the class, then plans and adjusts the next lesson to meet student needs. He/she is doing:", "o": ["Assessment of learning", "Assessment as learning", "Assessment for learning", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher who collects the performance of the class, evaluates it and then plans and adjusts the next lesson to meet students' needs is doing assessment for learning. Assessment for learning helps the teacher use information about the students' knowledge, understanding, skills and values in developing teaching, which they can reflect in their behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0944", "ch": 9, "page": 129, "ansPage": 129, "srcNo": "946", "exam": "09/09/2020 S-III", "q": "'How do grades differ from marks?' This question belongs to which of the following classes of questions?", "o": ["Divergent", "Analytic", "Open-ended", "Problem-solving"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Marks and grades differ in this way: marks evaluate accurate performance, while a grade uses a range of marks to test performance. This is related to analytic-type questions; in analytic questions the correct answer is not clearly visible.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0945", "ch": 9, "page": 129, "ansPage": 129, "srcNo": "947", "exam": "09/09/2020 S-I", "q": "Which of the following is the wrong option in reference to 'why children should be assessed'?", "o": ["Recognising the personal and special needs of children", "Improve the process of teaching-learning in the classroom", "Identifying eligible children to provide incentive money to children", "Eliminate the fear of assessment in children and encourage self-assessment"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Identifying children eligible for incentive money is not valid in the context of assessment. Assessment is done to collect information about children, review it and use it for planning educational activities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0946", "ch": 9, "page": 129, "ansPage": 129, "srcNo": "948", "exam": "09/09/2020 S-I", "q": "Which of the following is not included in the fundamental methods of evaluation?", "o": ["Individual assessment", "Collective assessment", "Peer assessment", "Assessment by teachers"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "'Assessment' generally refers to the process of evaluating students' achievements. The four basic methods of assessment: (i) individual assessment, (ii) collective assessment, (iii) assessment by peers, (iv) self-assessment. So 'assessment by teachers' is not among the fundamental methods.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0947", "ch": 9, "page": 129, "ansPage": 129, "srcNo": "949", "exam": "09/09/2020 S-I", "q": "Which of the following is not in the twenty indicators of the 'Samjhen-Sikhen' programme?", "o": ["School starts and closes on time", "Full-time teacher specifically prescribed for class one", "Only written assessment of children", "Sports, arts and cultural activities in the last period"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "'Only written assessment of children' is not included in the twenty indicators of the 'Samjhen-Sikhen' programme, while school starting and closing on time, a full-time teacher specifically assigned for class one, and sports, arts and cultural activities in the last hour are in the indicators.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0948", "ch": 9, "page": 129, "ansPage": 129, "srcNo": "950", "exam": "09/09/2020 S-I", "q": "'CCE' means:", "o": ["Cluster Centre for Evaluation", "Curriculum and Evaluation Council", "Continuous and Comprehensive Evaluation", "All of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The full form of CCE is Continuous and Comprehensive Evaluation. This evaluation system evaluates all aspects of students. CBSE implemented it in 2009 under the Right to Education Act; its main objective is to ensure all-round development of students, including cognitive, psychomotor and affective domains.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-059", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0949", "ch": 9, "page": 130, "ansPage": 130, "srcNo": "951", "exam": "10/09/2020 S-I", "q": "The father of creativity is:", "o": ["E. Paul Torrance", "Francis Bacon", "B. F. Skinner", "Robert Rex"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The father of creativity is E. Paul Torrance. In his work he discussed fluency, flexibility, originality and elaboration. The Torrance test of creativity is sometimes used by selection processes to identify gifted programmes across the country and the world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0950", "ch": 9, "page": 130, "ansPage": 130, "srcNo": "952", "exam": "10/09/2020 S-I", "q": "Which of these is NOT a method of knowing individual differences?", "o": ["Test method", "Achievement test", "Intelligence test", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "All the options given are methods of knowing individual differences. Individual differences means each person differs from another in biological, mental, cultural and emotional aspects. The methods of knowing it include the test method, achievement test and intelligence test, so 'none of these' is the answer.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0951", "ch": 9, "page": 130, "ansPage": 130, "srcNo": "953", "exam": "11/09/2020 S-I", "q": "The advantage of giving homework is that students:", "o": ["Remain busy at home", "Study at home", "May be checked for their progress", "May develop the habit of self-study"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Homework includes educational activities which students should do at home. With regular practice of homework, students quickly develop the habit of self-study, which develops responsibility for the given tasks.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0952", "ch": 9, "page": 130, "ansPage": 130, "srcNo": "954", "exam": "11/09/2020 S-I", "q": "To make all students interested in homework, it should be:", "o": ["Of equal level", "According to the ability of the student", "Only from the book", "Out of the book"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "To create interest in all students for homework, it should be according to the ability of the students. The main objective of giving homework is to make students revise the lessons taught so that they can remove the shortcomings of collective teaching in the class on their own.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0953", "ch": 9, "page": 130, "ansPage": 130, "srcNo": "955", "exam": "11/09/2020 S-I", "q": "Which of the following practices promote meaningful learning? (i) Corporal punishment (ii) Co-operative learning environment (iii) Continuous and comprehensive evaluation (iv) Constant comparative evaluation", "o": ["(i), (ii)", "(ii), (iii)", "(i), (ii), (iii)", "(ii), (iii), (iv)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main practices promoting meaningful learning are: a co-operative learning environment, continuous and comprehensive evaluation, the constructive role of the teacher, and interesting reading material.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0954", "ch": 9, "page": 130, "ansPage": 130, "srcNo": "956", "exam": "11/09/2020 S-II", "q": "How can teachers facilitate understanding of complex concepts in children?", "o": ["By delivering a lecture", "By organising competitive events", "By repetitive mechanical drill", "By providing opportunities for exploration and discussion"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher can help children understand complex concepts by breaking the work into small parts and dividing complex instructions into small steps. This helps students to assimilate ideas effectively, reduce external cognitive load, identify the basic components of work, and gain opportunities for exploration and discussion.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0955", "ch": 9, "page": 131, "ansPage": 131, "srcNo": "957", "exam": "11/09/2020 S-I", "q": "Repeatedly asking students to engage in learning activities either to avoid punishment or to gain a reward:", "o": ["Decreases extrinsic motivation", "Increases intrinsic motivation", "Would encourage children to focus on mastery rather than performance-based goals", "Decreases children's natural interest and curiosity involved in learning"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The repetition of rewards or punishment for engaging in learning activities decreases children's natural interest and curiosity in learning. Too frequent rewards or punishment will suppress the innate interests and thoughts of students and drive them to show the behaviour which is expected by others.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0956", "ch": 9, "page": 131, "ansPage": 131, "srcNo": "958", "exam": "11/09/2020 S-I", "q": "Presenting students with clear examples and non-examples:", "o": ["Is an effective way to encourage conceptual change", "Leads to confusion in the minds of students", "Causes gaps in their understanding of concepts", "Focuses on procedural knowledge rather than conceptual understanding"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Giving clear examples and non-examples to students is an effective way of encouraging conceptual change. Non-examples are given when examples are lacking, in relation to students' existing knowledge or experiences, so that they can link themselves with the real world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0957", "ch": 9, "page": 131, "ansPage": 131, "srcNo": "959", "exam": "14/09/2020 S-I", "q": "The ability to locate, evaluate and effectively use information is an important trait known as:", "o": ["Deep thinking", "Information literacy", "Listening", "Selective attention"], "key": {"printed": [0], "verified": [1], "official": null}, "e": "As printed: the term used for the ability to locate, evaluate and effectively use information is described as an important educational skill, taught mostly in graduate and postgraduate studies.", "tip": "", "status": "disputed", "note": "Printed key letter (a) 'deep thinking' does not match the standard answer: the ability to locate, evaluate and use information effectively is INFORMATION LITERACY (b). Printed key retained; verified answer (b)."}, {"id": "AOT-0958", "ch": 9, "page": 131, "ansPage": 131, "srcNo": "960", "exam": "15/09/2020 S-III", "q": "Which of these is an example of extrinsic motivation?", "o": ["'I enjoy doing my homework because it is so much fun.'", "'I learn so much when I do my homework.'", "'Doing homework makes me understand my concepts better.'", "'I complete my homework because the teacher gives us marks for each assignment.'"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Extrinsic motivation is that which comes to a person from outside, such as rewards, punishment, competition and praise. 'I complete my homework because the teacher gives marks for every assignment' is an example, since the purpose is to encourage a person to achieve a specific target.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0959", "ch": 9, "page": 131, "ansPage": 131, "srcNo": "961", "exam": "15/09/2020 S-III", "q": "Which of the following would constitute an adequate way of dealing with the gifted child?", "o": ["Giving them double promotion", "Using them as class leaders", "Leaving them to find things of their own interest", "None of the above is adequate"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "To satisfy and utilise the intelligence of a gifted child, they should be given enriched experience, and freedom to explore subjects, arts, sports or other activities of their own interest, increasing their confidence, creativity and enthusiasm.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0960", "ch": 9, "page": 132, "ansPage": 132, "srcNo": "962", "exam": "15/09/2020 S-III", "q": "Which of the following statements is the most questionable as applied to students' appraisal?", "o": ["Appraisal validity is possible in spite of weakness in tests", "Student's behaviour must be related to his/her total performance", "Student's appraisals are samples of the total personal achievement", "Appraisal should be integrated and not dependent on isolated components"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The statement that students' appraisal should relate behaviour to the total performance is most questionable. A student's appraisal is a sample of the total individual achievement, which means the results of the evaluation do not represent the full ability and achievement of the student; a student may be weak in one subject but good in all others.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0961", "ch": 9, "page": 132, "ansPage": 132, "srcNo": "963", "exam": "15/09/2020 S-I", "q": "The academic performance of students can be improved if parents are encouraged to:", "o": ["Supervise the work of their wards", "Arrange for extra tuition", "Remain unconcerned about it", "Interact with teachers frequently"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Students' academic performance can be improved if parents are motivated to supervise their children's work. If parents help or supervise their children's work, this will motivate the children, help them achieve their learning goals and improve their academic performance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0962", "ch": 9, "page": 132, "ansPage": 132, "srcNo": "964", "exam": "18/09/2020 S-II", "q": "What would you do if one of your students asked irrelevant questions?", "o": ["Will ignore him", "Will make him realise his mistake", "Will give him another opportunity", "Will scold him among children"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "When a student asks a wrong question in the class, the teacher should give a suitable explanation and need to choose a good strategy to make the student correct and remove his doubts. If irrelevant questions are asked by a student, you will give him other opportunities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0963", "ch": 9, "page": 132, "ansPage": 132, "srcNo": "965", "exam": "18/09/2020 S-II", "q": "A good test has the following three characteristics:", "o": ["Validity, evaluation and practicability", "Validity, reliability and practicability", "Comprehensiveness, evaluation and experimentalism", "Comprehensiveness, evaluation and practicability"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A good test should be easy, attractive and interesting and convenient for both teacher and students. A good test has three qualities: validity, reliability and practicability.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0964", "ch": 9, "page": 132, "ansPage": 132, "srcNo": "966", "exam": "18/09/2020 S-II", "q": "When a child fails, it means:", "o": ["The child should have taken private tuition", "The system has failed", "The child is not fit for study", "The child has not memorised the answer properly"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When a child fails, it means the system has failed. Failure is a state of not achieving the desired goal, seen as opposite to success. There are many causes of failure of children: physical, intellectual, emotional and cultural.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0965", "ch": 9, "page": 132, "ansPage": 132, "srcNo": "967", "exam": "18/09/2020 S-II", "q": "A scoring guide used to evaluate the quality of students by a teacher is called:", "o": ["Rubrics", "Checklist", "Inventories", "Rating scales"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A scoring guide used by a teacher to evaluate the quality of students' work is called a rubric. A rubric is a scoring guide used to assess performance, products or projects; rubrics ensure scoring is accurate, fair or consistent.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0966", "ch": 9, "page": 133, "ansPage": 133, "srcNo": "968", "exam": "18/09/2020 S-II", "q": "The thematic qualification of the students, which can be well known, is:", "o": ["From exam questions", "From testing tools", "From discussion", "From parent counselling"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The subject qualification (aptitude) of students can be well known through discussion. Subject qualification is first identified and then developed. This subject should not be based only on students' needs and interests but should also be useful from the development perspective.", "tip": "", "status": "note", "note": "Question wording as printed ('thematic qualification'); read as subject-wise ability."}, {"id": "AOT-0967", "ch": 9, "page": 133, "ansPage": 133, "srcNo": "969", "exam": "26/02/2020 S-I", "q": "Which of the following is the objective of continuous and comprehensive evaluation (CCE)?", "o": ["Holistic development of children", "Promotion of competition among children", "Encouragement of academic excellence among children", "Inculcation of rote learning among children"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main objective of continuous and comprehensive evaluation is the 'holistic development of children'. It is presented as a school-based system; CCE stresses the 'holistic development' of children so that the cognitive, emotional and psychomotor dimensions of children can be ensured. Other objectives: emphasising continuity and regularity of evaluation; improving the art of learning through diagnostic and remedial teaching; evaluating the scholastic and co-scholastic aspects of development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0968", "ch": 9, "page": 133, "ansPage": 133, "srcNo": "970", "exam": "28/01/2020 S-II", "q": "For conducting a large survey to know the opinion of teachers regarding Higher Secondary Education, which tool will be most appropriate?", "o": ["Questionnaire", "Interview", "Observation", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A questionnaire is the most useful tool for a large survey of teachers' opinions about higher secondary education. A questionnaire is used to measure the level, feelings and perceptions of respondents; it is a self-report technique of data collection.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0969", "ch": 9, "page": 133, "ansPage": 133, "srcNo": "971", "exam": "28/01/2020 S-I", "q": "The Teacher Eligibility Test conducted for the selection of candidates for admission into teacher education institutions is an example of:", "o": ["Achievement test", "Placement test", "Attitude test", "Aptitude test"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The Teacher Eligibility Test tests the academic knowledge, skill and eligibility of candidates. It is an example of an achievement test, which measures the current knowledge, skill or ability of a person; it is a useful method of assessing the knowledge and skill required by candidates for teaching.", "tip": "", "status": "note", "note": "Some sources treat teacher-selection tests as aptitude tests; printed key (a) retained."}, {"id": "AOT-0970", "ch": 10, "page": 133, "ansPage": 133, "srcNo": "972", "exam": "09/06/2024 S-I", "q": "The psychological basis helps the curriculum developer to understand the nature of the ______.", "o": ["Subject matter", "Learner", "Teacher", "Idea"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The psychological basis of the curriculum helps the curriculum developer understand the nature of learning, i.e. the learner. This helps develop a curriculum according to students' interests, capacities, individual differences and levels of development, so that the learning process can be more relevant and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0971", "ch": 10, "page": 133, "ansPage": 133, "srcNo": "973", "exam": "09/06/2024 S-I", "q": "Curriculum improvement should be a ______ process.", "o": ["Final", "Preliminary", "Internal", "Continuous"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Curriculum improvement should be a continuous process. It should be revised and updated from time to time according to students' needs and changing educational trends, so that it stays relevant and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0972", "ch": 10, "page": 133, "ansPage": 133, "srcNo": "974", "exam": "18/05/2024 S-I", "q": "Students' attention in the class will not be drawn unless:", "o": ["The writing board is not used", "Curiosity is not developed in students' minds", "Questions are not asked of the students", "Discipline remains in the class"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Students' attention in class will not be drawn unless curiosity is developed in their minds. If a subject is presented in an interesting and important way, which increases their interest and curiosity, they focus completely and participate actively; curiosity is the driving force that moves students towards gaining knowledge.", "tip": "", "status": "note", "note": "Options are printed in negative form ('unless ... is not ...') as in the source."}, {"id": "AOT-0973", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "975", "exam": "18/05/2024 S-I", "q": "How many basic components of a curriculum are there?", "o": ["2", "4", "6", "8"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The four basic components of a curriculum are: aims/objectives, content, experiences (teaching-learning) and evaluation. Together these components form an effective curriculum that guides the learning process and evaluates its results.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0974", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "976", "exam": "18/05/2024 S-I", "q": "The curriculum model which cannot go beyond the initial level is:", "o": ["Subject curriculum", "Activity curriculum", "Core curriculum", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The activity curriculum is a curriculum model that keeps changing continuously and whose form develops according to local needs, students' interests and social changes. So it cannot be fixed beyond the initial level.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0975", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "977", "exam": "24/05/2024 S-I", "q": "Adult education is organised for which age group?", "o": ["15-35", "18-40", "17-35", "21-45"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The aim of adult education is to give educational opportunities to those adults who have missed the opportunity of education and need basic literacy skills. The National Literacy Mission (NLM) was started in 1988 to impart functional literacy to non-literate people in the 15-35 age group in a time-bound manner.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0976", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "978", "exam": "24/05/2024 S-I", "q": "The factor which influences curriculum development is:", "o": ["Sociological factor", "Economic factor", "Scientific factor", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Curriculum development is influenced by sociological (cultural values), economic (employment needs) and scientific (technological progress) factors. For a balanced curriculum, all of these must be included.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0977", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "979", "exam": "22/05/2024 S-I", "q": "Which of these is a nature of the curriculum?", "o": ["Critical", "Creative", "Narrow", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The nature of the curriculum is multi-dimensional, including critical (analytical capacity), creative (creative) and narrow (specific objectives) aspects. All these features show the different aspects of the teaching process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0978", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "980", "exam": "23/05/2024 S-II", "q": "Curriculum is:", "o": ["Course description", "Syllabus", "Co-curricular activities", "All activities of an institution"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A curriculum is all the activities of an educational institution (syllabus, co-curricular activities, teaching methods, evaluation, etc.). It is broader than just a syllabus and includes all activities planned in relation to the overall development of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0979", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "981", "exam": "23/05/2024 S-II", "q": "Implementation of plans and decisions is a part of:", "o": ["Promotion of student welfare", "Proper utilisation of school facilities", "Running of the curriculum", "Attaining success in examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Implementation of plans and decisions is an important part of school administration and management, which is the running of the curriculum. It is directly related to the implementation of plans (teaching plan, curriculum determination) and decisions (teaching methods, evaluation process).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0980", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "982", "exam": "21/05/2024 S-I", "q": "Which subject tries to understand the role of man in changing his environment?", "o": ["Biology", "Geography", "History", "Political science"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Geography is the subject that tries to understand the role of man in changing his environment. It studies human activities and their effects on the environment, such as urbanisation, agriculture and use of resources, and helps understand human-environment relations.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0981", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "983", "exam": "25/05/2024 S-I", "q": "John Dewey's thinking is based on:", "o": ["Learner-centred curriculum", "Activity-centred curriculum", "Subject-centred curriculum", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "John Dewey's thought is based on the activity-centred curriculum. Dewey emphasised involving students actively in the process of learning, advocated the principle of 'learning by doing', and encouraged students to participate in various activities to acquire knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0982", "ch": 10, "page": 134, "ansPage": 134, "srcNo": "984", "exam": "25/05/2024 S-I", "q": "A curriculum designed to meet the needs of all students is a part of ______.", "o": ["General education", "Special education", "Extra curriculum", "Programme of study"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A curriculum which accommodates the different learning styles and interests of all students, including those with special needs, so that they can learn together, would be a part of the inclusive approach of general education, where the curriculum is made flexible so that students with different needs can take part in mainstream education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0983", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "985", "exam": "09/06/2024 S-II", "q": "The main concern of the curriculum is:", "o": ["Change in the behaviour of individuals", "Preparation for jobs", "Individual satisfaction", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main concern of the curriculum is change in the behaviour of individuals. This means the aim of the curriculum is to bring change in the knowledge, skill and attitude of students so that they can become better citizens and contribute positively to society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0984", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "986", "exam": "09/06/2024 S-II", "q": "An important factor of curriculum helps in achieving which of the following?", "o": ["Education", "Objective", "Quality", "Job"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main components of any curriculum include objectives and goals, content, learning experiences, evaluation and the description of the curriculum. Curriculum development is influenced by political, economic, social, technological, environmental, child-psychological and educational factors. An important factor of curriculum helps achieve the objective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0985", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "987", "exam": "27/05/2024 S-I", "q": "A curriculum is the blueprint of a school which includes the experiences of:", "o": ["The expert", "The teacher", "The learner", "The curriculum planner"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A curriculum is mainly centred on the experiences and learning process of the learners. It is the blueprint that determines what learners will learn, how they will learn and how their experiences will be protected. Although it includes the experiences of experts, teachers and planners, the final goal is to enrich the learners' experiences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0986", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "988", "exam": "27/05/2024 S-I", "q": "The objective of an integrated curriculum is:", "o": ["An increase in the number of books", "A decrease in the number of books", "An increase in student enrolment", "A decrease in dropout"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The objective of an integrated curriculum is to join various subjects together and make learning more relevant, interesting and comprehensive. When students find the subject matter more connected and understandable, it becomes easy for them to remain in school and continue their studies, and the rate of dropout decreases.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0987", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "989", "exam": "27/05/2024 S-I", "q": "The National Curriculum Framework 2005 derived its understanding from ______.", "o": ["Humanism", "Behaviourism", "Constructivism", "Cognitive theory"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The main concept of the National Curriculum Framework (NCF) 2005 is based on 'constructivism'. This principle believes that children construct knowledge themselves through their own experiences and active participation, rather than receiving information passively. NCF 2005 promotes this principle in the education system so that the learning process becomes more child-centred and meaningful.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0988", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "990", "exam": "18/05/2024 S-III", "q": "After completion of class teaching:", "o": ["The blackboard should be got cleaned by any student", "The blackboard should be left as it is", "The teacher should clean the blackboard", "Anyone of them"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "After the class teaching is over, the blackboard should be cleaned by the teacher, since it is a part of the teaching process. According to the outline of the curriculum (2005), the teacher should take responsibility for the class's order and cleanliness; it is also an example of dedication and discipline towards students. Same as Q476.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-036", "first": false, "kind": "exact", "of": "AOT-0476"}}, {"id": "AOT-0989", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "991", "exam": "19/06/2024", "q": "The psychological foundation plays its role in the development of curriculum keeping in view the:", "o": ["Student's needs", "Student's interest", "Student's capabilities", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Curriculum development is an important aspect of education which aims to meet the interests, needs, capabilities and interests of students. Psychological ideas play an important role in the development of curriculum by focusing on factors related to students' cognition, motivation, needs, capabilities, stages of development, interests and learning priorities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0990", "ch": 10, "page": 135, "ansPage": 135, "srcNo": "992", "exam": "19/06/2024", "q": "Principles involved in lesson planning are all except:", "o": ["Clarity of objectives", "Knowledge of teaching", "Rigidity of planning", "Knowledge of pupils"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Rigidity of planning is not a principle of lesson planning. The objectives of teaching should be clear before teaching; teachers should have knowledge of students, curriculum, language skill, subject and teaching. The teacher should keep flexibility in planning the lesson, not rigidity, so that any change can be incorporated during teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0991", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "993", "exam": "29/05/2024 S-I", "q": "School curriculum is defined as:", "o": ["Methods of instruction", "Experiences organised by school", "Materials of instruction", "Courses of study"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "School curriculum is defined as the experiences organised by the school. It includes all teaching-learning related material for fulfilling the totality of students' experiences: aims, objectives, teaching material, teaching strategies and the assessment methods in the educational process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0992", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "994", "exam": "16/06/2024 S-III", "q": "Which of the following policies was introduced in 1975?", "o": ["Curriculum for the 10-year school", "Kothari Commission report", "Macaulay report", "Radhakrishnan report"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'The Curriculum for the Ten-Year School: A Framework' was published by NCERT in 1975, an attempt to give concrete form to the recommendations of the National Education Policy 1968.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0993", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "995", "exam": "16/06/2024 S-III", "q": "Psychological foundations of curriculum help curriculum developers to understand the nature of:", "o": ["Content", "Learner", "Teacher", "Ideas"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Psychological bases of the curriculum help curriculum developers understand the nature of the learner. They enable them to make an effective curriculum keeping in view the learner's style of learning, needs and developmental stages, which makes the process of education more meaningful and successful, as it is directly centred on the needs of the student. Same as Q972.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0994", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "996", "exam": "18/05/2024 S-III; 19/05/2024 S-II", "q": "In planning and implementing the curriculum, the school makes its selection from:", "o": ["Nation", "Region", "Culture", "Mass communication"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The construction of the curriculum is influenced by the cultural beliefs, values and traditions of the society. The subjects taught in schools, activities and teaching methods reflect the culture of that society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0995", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "997", "exam": "18/05/2024 S-III", "q": "Five stages of awareness, interest, evaluation, trial and adoption are for:", "o": ["Curriculum change", "Curriculum formation", "Curriculum development", "Curriculum implementation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The five stages - awareness, interest, evaluation, trial and adoption - are related to curriculum change. They are used for implementing new changes systematically in the education system; the process ensures easy and effective implementation among stakeholders.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0996", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "998", "exam": "14/06/2024 S-III", "q": "Curriculum effectiveness is determined by:", "o": ["Community cooperation", "Teacher's competence", "Students' interest", "Quality of supervision"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The effectiveness of the curriculum is determined mainly by how interested students are in it. If students have an interest in learning, the curriculum will be considered more effective because it will produce better learning results.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0997", "ch": 10, "page": 136, "ansPage": 136, "srcNo": "999", "exam": "05/09/2023 S-III", "q": "Under which Article of the Constitution has education been given the status of a Fundamental Right?", "o": ["Article 12", "Article 14", "Article 21-A", "Article 21"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Education got the status of a Fundamental Right under Article 21-A of the Constitution, which gives children aged 6 to 14 years the right to free and compulsory education; the Right to Education Act, 2009 was incorporated in the Constitution.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0998", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1000", "exam": "05/09/2023 S-I", "q": "In programmed instruction, the sequence of curriculum content is:", "o": ["Psychological", "Physical", "Both A and B", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Programmed instruction is a method in which subject matter is divided into small steps and presented in order, and students are nurtured with the help of their progress throughout the process. In programmed instruction the sequence of the curriculum content is psychological.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0999", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1001", "exam": "05/09/2023 S-III; 10/09/2023 S-I", "q": "Which of the following is NOT a part of curriculum development?", "o": ["Selection of objectives", "Selection of teachers", "Selection of subject matter", "Selection of activities"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The aim of curriculum development is to prepare the curriculum which meets the objectives of development for students. The selection of teachers is not a part of curriculum development, because it is a separate process which is done after curriculum development so that teachers can be prepared for the curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1000", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1002", "exam": "05/09/2023 S-III", "q": "An outline of a subject in a particular time to be completed is:", "o": ["Curriculum", "Syllabus", "Lesson", "Co-curricular activity"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A syllabus is an educational outline prepared to complete a subject matter in a specific period of time. It gives information to teachers and students about what material should be taught and learnt for a particular subject, and what activities should be included.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1001", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1003", "exam": "05/09/2023 S-I", "q": "The meaning of 'Right to Education' is:", "o": ["Free and compulsory education to children aged 6-14 years", "Free and compulsory education to children aged 4-14 years", "Education for all", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "According to Article 21A of the Indian Constitution, the State shall provide free and compulsory education to all children aged 6-14 years by law. Under the Right to Education Act, the right given is: to every child between 6 and 14 years; free and compulsory education; in a neighbourhood school; until elementary education is completed.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1002", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1004", "exam": "05/09/2023 S-I", "q": "A model school is established in ______.", "o": ["To provide free and compulsory education to children aged 6-14 years", "To provide free and compulsory education to children aged 4-14 years", "Education for all", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A model school is established in the natural sector. In a model school, a good infrastructure and adequate resources are said to ensure the availability of a safe, encouraging learning environment for all students and to provide different learning experiences. The schools should have large classrooms, proper desks, boards and cupboards, and a library and laboratories for children's education.", "tip": "", "status": "note", "note": "The stem is incomplete in the source ('established in ___'); printed key (c) 'education for all' retained."}, {"id": "AOT-1003", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1005", "exam": "05/09/2023 S-I", "q": "Curriculum development is based on:", "o": ["Philosophical basis", "Political basis", "Psychological basis", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The curriculum is the basis of education. By means of the curriculum, education fulfils its objectives; it connects the student and the teacher, and through the curriculum the teacher tries for the mental, physical, moral, cultural, emotional, spiritual and social development of students. So curriculum development is based on all the bases above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1004", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1006", "exam": "05/09/2023 S-I", "q": "'CCE' means:", "o": ["Continuous and Comprehensive Evaluation", "Continuous and Comprehended Evaluation", "Continuous and Cooperative Evaluation", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "CCE stands for Continuous and Comprehensive Evaluation, a continuous and regular process which goes on along with the teaching-learning of the class; teaching-learning and evaluation go on together. The main objective of CCE is to evaluate every aspect of the child during the child's presence in school.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-059", "first": false, "kind": "near", "of": "AOT-0948"}}, {"id": "AOT-1005", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1007", "exam": "13/09/2023 S-I", "q": "The purpose of play is:", "o": ["Physical development", "Moral development", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The main purpose of play is to promote children's physical and moral development. Play is an important part of our life: it keeps us healthy and also provides moral learning of restraint, morality and ethics. It is a unique means of improving our physical and mental condition.", "tip": "", "status": "note", "note": "Source prints the number 1007 twice (this item and the next one on the same page)."}, {"id": "AOT-1006", "ch": 10, "page": 137, "ansPage": 137, "srcNo": "1007 (second)", "exam": "13/09/2023 S-I", "q": "The psychological basis plays its role in curriculum development keeping in view the ______.", "o": ["Student's sensitivity (feeling)", "Student's nature", "Student's happiness", "Student's needs"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The psychological basis plays a role in curriculum development keeping in view the student's needs. The psychological basis plays an important role in curriculum development because it provides a theoretical framework for understanding how students learn and develop cognitively, emotionally and socially.", "tip": "", "status": "note", "note": "Source prints the number 1007 twice; this is the second occurrence.", "dup": {"group": "DUP-060", "first": true, "kind": "near", "of": null}}, {"id": "AOT-1007", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1008", "exam": "09/09/2023 S-I", "q": "The curriculum reflects the culture of:", "o": ["Society", "Home", "School", "Family life"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The curriculum is a formal plan of educational experiences and activities given to learners under the guidance of an educational institution. It reflects the social and cultural culture of the society and is presented so that learners change their behaviour and become functional members of society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1008", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1009", "exam": "10/09/2023 S-I", "q": "On which of the following is the principle of curriculum NOT based?", "o": ["Child", "Activity", "Community life", "Family life"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The curriculum should be determined by dividing it into cognitive, affective and conative areas. Keeping in mind the present needs of children, attention should be given at the psychological level; in curriculum construction, society, culture, civilisation, nationality and the spirit of internationalism should be kept in mind. The principle of curriculum is not based on family life.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1009", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1010", "exam": "10/09/2023 S-I", "q": "In programmed instruction, the sequence of subject matter is:", "o": ["Psychological", "Physical", "Both A and B", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In programmed instruction the sequence of the textbook is psychological. According to Stofflet, arranging knowledge in small units in a logical order and making the whole process sequenced is called programmed (sequenced) instruction. Same as Q1000.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1010", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1011", "exam": "13/09/2023 S-I; 14/09/2023 S-I", "q": "Which of the following statements is NOT related to the curriculum?", "o": ["It is related to students' learning experience", "It is related to the programme of study", "It is related to the professional development of teachers", "It is the structure of the syllabus outline"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The objective of the curriculum is fulfilled through education. It is a means that connects the student and the teacher; the teacher, through the curriculum, strives for the mental, physical, moral, cultural, emotional and social development of the students. The curriculum is not related to the professional development of teachers; it should be related to the overall development of children and teachers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1011", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1012", "exam": "13/09/2023 S-I; 14/09/2023 S-I", "q": "The syllabus is a part of:", "o": ["Teaching", "Curriculum", "Classroom", "Society"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The syllabus is a part of the curriculum. The curriculum plays an important role in the educational system. It works like a food (nourishment) that inspires the teacher and the student to reach the desired objectives. The aim of a comprehensive curriculum is to develop all human abilities - intellectual, aesthetic, social, emotional and moral - in an integrated manner.", "tip": "", "status": "note", "note": "Source option text reads 'pathyakram bhag hai' (the syllabus/curriculum is part of ...); answer (b) curriculum."}, {"id": "AOT-1012", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1013", "exam": "13/09/2023 S-I", "q": "The psychological basis plays its role in the development of curriculum keeping in view the ______.", "o": ["Student's feeling", "Student's nature", "Student's happiness", "Student's needs"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the development of curriculum the psychological basis plays its role keeping in view students' needs. It plays an important role because it provides a theoretical framework for understanding how students learn and develop cognitively, emotionally and socially. Same as the second Q1007.", "tip": "", "status": "note", "note": "Repeat of the second Q1007 with a slightly different option wording (feeling vs sensitivity).", "dup": {"group": "DUP-060", "first": false, "kind": "near", "of": "AOT-1006"}}, {"id": "AOT-1013", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1014", "exam": "14/09/2023 S-I", "q": "'Bal Griha' (pre-primary school) was established by:", "o": ["Pestalozzi", "Froebel", "Montessori", "Dewey"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The 'Casa dei Bambini' (children's house), a pre-primary school, was established by Maria Montessori on 6 January 1907 at a place named San Lorenzo, Rome. The Montessori method became popular and made remarkable progress with backward children.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1014", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1015", "exam": "15/09/2023 S-I", "q": "The principle of curriculum is based on:", "o": ["Subject matter", "Activity", "Learner", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The principle of the curriculum is based on all three: subject matter (what content is included), activity (what activities are included so that students find interest and motivation in learning) and the learner (according to the age, interest, capacities and needs of students).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1015", "ch": 10, "page": 138, "ansPage": 138, "srcNo": "1016", "exam": "15/09/2023 S-II", "q": "Who gave the idea of 'Learning Without Burden'?", "o": ["D. Kothari", "Prof. Yashpal", "K. Kasturirangan", "Dr. Mudaliar"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The idea of 'Learning Without Burden' was given by Prof. Yashpal. He wrote a report for the National Advisory Committee in 1992-93, in which he gave many suggestions for improving the Indian education system, including reducing the burden on students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1016", "ch": 10, "page": 139, "ansPage": 139, "srcNo": "1017", "exam": "09/09/2020 S-III", "q": "What is mainly taken into consideration in curriculum making?", "o": ["Educational objectives", "Teaching methods", "Students' surroundings", "Study materials"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The objectives of education are fulfilled through the curriculum, a means that connects student and teacher. Through the curriculum the teacher tries for the mental, physical, moral, cultural, emotional, spiritual and social development of students. In curriculum making, the surroundings (environment) of students are mainly kept in mind.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1017", "ch": 10, "page": 139, "ansPage": 139, "srcNo": "1018", "exam": "09/09/2020 S-I", "q": "Which part of the Indian Constitution allows every citizen to impart education as per one's own religion?", "o": ["Concurrent list of the Centre and the States", "Fundamental Rights", "State list", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The Fundamental Rights of the Indian Constitution state the freedom of thought, expression, belief, faith and worship for all citizens; this resolution has been given concrete form in Articles 25 to 28 in Part III. Under Article 28, every citizen has the right to impart education according to his religion, which comes under Fundamental Rights.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1018", "ch": 10, "page": 139, "ansPage": 139, "srcNo": "1019", "exam": "09/09/2020 S-I", "q": "Which option is true in the context of the National Achievement Survey?", "o": ["There is an online assessment portal of secondary-level children in the country", "There is a national programme by the MHRD to ascertain the level of education in schools", "There is a programme related to NTS and Medha Scholarship", "All of these options are true"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The National Achievement Survey is a national programme conducted by the Ministry of Human Resource Development to find out the level of education in schools. It is conducted by the Central Board of Secondary Education (CBSE). Its main objective is to improve the quality of learning of students at the district, state and national level through policy formulation, planning and the teaching-learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1019", "ch": 10, "page": 139, "ansPage": 139, "srcNo": "1020", "exam": "09/09/2020 S-I", "q": "Education does not include the following resources:", "o": ["Ground-water resources", "Financial resources", "Human resources", "Material resources"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Education is a lifelong process that develops and refines individuals. Main resources included in the school education system: 1. financial resources (school fees, government grants); 2. human resources (teachers, students, staff); 3. material resources (textbooks, audio-visual material, computers, library, laboratories). Ground-water resources are not included.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1020", "ch": 10, "page": 139, "ansPage": 139, "srcNo": "1021", "exam": "09/09/2020 S-I", "q": "Educational psychology is a science of:", "o": ["Educational planning", "Educational principles", "Human behaviour", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Educational psychology is the practical form of psychology, the science that studies human behaviour in the process of education. It is a science of behaviour in which the behaviour of the child in the educational situation is studied. E. A. Peel: 'Educational psychology helps the teacher to understand the development of students, the limits and level of their capabilities, and social relations.'", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1021", "ch": 10, "page": 139, "ansPage": 139, "srcNo": "1022", "exam": "10/09/2020 S-II", "q": "'Learning Without Burden' is the report of a committee headed by:", "o": ["Prof. D. S. Kothari", "Prof. Yashpal", "Acharya Rammurthy", "Dr. L. S. Mudaliar"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "'Learning Without Burden' was the title given to a report of the National Advisory Committee (NAC) written by 'Professor Yashpal', also called the Yashpal Committee report. Its aim is to reduce the burden or load on children in India and to see that learning has become a burden for students; it also gives guidance for ensuring quality in all schools and making them safe and non-hazardous.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1022", "ch": 10, "page": 140, "ansPage": 140, "srcNo": "1023", "exam": "10/09/2020 S-I", "q": "Which of the following is described as the Magna Carta of Indian Education?", "o": ["Hunter Commission", "Sargent Commission", "Wood's Despatch", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Wood's Despatch is called the Magna Carta of English education in India. Charles Wood was the president of the Board of Control of the East India Company. Wood's Despatch claimed to promote Western education in India; as a result of this charter, education departments were established in every province. Its features: primary school education in local languages; Anglo-vernacular medium in middle schools; English medium in colleges or higher education; promotion of secular education; teacher training programmes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1023", "ch": 10, "page": 140, "ansPage": 140, "srcNo": "1024", "exam": "10/09/2020 S-I", "q": "Which of the following commissions first recommended decentralisation of primary education?", "o": ["Kothari Commission", "Hunter Commission", "Prof. Yashpal Committee", "Dr. S. Radhakrishnan Commission"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The Hunter Commission first recommended decentralisation of primary education. The Hunter Commission's main objective was to look at the status of primary education in India, but it also decided to look at secondary and higher education. It was also known as the Indian Education Commission of 1882, headed by Sir William Hunter.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1024", "ch": 10, "page": 140, "ansPage": 140, "srcNo": "1025", "exam": "10/09/2020 S-I", "q": "Which of the following is NOT in the guiding principles of the National Curriculum Framework-2005?", "o": ["Connecting knowledge to life outside the school", "Ensuring that learning is shifted away from rote methods", "Making examinations more flexible and integrated into classroom life", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The National Curriculum Framework presents a new shape to the educational scene for classes 3 to 12 under the CBSE, with reforms in language learning, subject structure, evaluation strategies and environmental education. The guiding principles: connecting knowledge to life outside the school; ensuring that learning is shifted away from rote methods; making examinations more flexible and integrated into classroom life. So 'none of these' is correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1025", "ch": 10, "page": 140, "ansPage": 140, "srcNo": "1026", "exam": "28/01/2020 S-II", "q": "Co-curricular activities are to:", "o": ["Facilitate pupils' development", "Provide a progressive school", "Keep pupils from dropping out", "Meet the demands of the community"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Co-curricular activities are for the development of pupils. Co-curricular activities (CCA) ensure harmonious development of the child's personality; they are an extension of experiences gained from formal learning and play an important role in complementing academic activities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1026", "ch": 10, "page": 140, "ansPage": 140, "srcNo": "1027", "exam": "10/09/2020 S-I", "q": "NCF-2005 stands for:", "o": ["NATO Composite Force-2005", "Network Configuration File-2005", "National Curriculum Framework-2005", "National Cultural Foundation-2005"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "NCF 2005 stands for National Curriculum Framework, as the name suggests: a framework providing guidelines for national textbooks and teaching practices. NCF 2005 is strongly influenced by the principle of social constructivism, which means a child constructs knowledge from society; it motivates all children to learn in a natural way and enables them to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1027", "ch": 10, "page": 141, "ansPage": 141, "srcNo": "1028", "exam": "10/09/2020 S-I", "q": "Which of the following recommendations was NOT given by the Kothari Commission?", "o": ["All children should be given primary education in their mother tongue", "The first board examination should be done only after completing 10 years of school", "Subject division should start from class 10 instead of class 9", "50% of secondary schools should be converted into vocational schools"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The Kothari Commission is called the Gita of education because it provided the basis for developing the National Education Policy 1986. Its suggestions: all children should be given primary education in the mother tongue; the first public examination should be held only after 10 years of schooling; subject division should be after class 10 instead of class 9. The recommendation in option (d) was not given by the Kothari Commission.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1028", "ch": 10, "page": 141, "ansPage": 141, "srcNo": "1029", "exam": "11/09/2020 S-I", "q": "Despite your requests as in-charge of the time-table in the school, a teacher always comes late. In this situation you will:", "o": ["Insult him in the presence of other teachers", "Advise him to come on time", "Report to the principal", "Remain indifferent to it"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "As in-charge of the school's time-table, if a teacher always comes late despite your request, you will advise him to come on time.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1029", "ch": 10, "page": 141, "ansPage": 141, "srcNo": "1030", "exam": "11/09/2020 S-I", "q": "Play therapy is adopted in the study of children in order to:", "o": ["Make the educational process joyful", "Understand the inner motives and complexes of children", "Make education more activity-centred", "Highlight the importance of play activities in education"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The play-therapy method is adopted in the study of children so that the children's inner tendencies and inner conflicts can be understood. According to Piaget, play plays a big role in the development of children's mental abilities; through these plays the traits of children such as quick decision-making, information about things, planning, coordination, courage and cooperation develop automatically.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1030", "ch": 10, "page": 141, "ansPage": 141, "srcNo": "1032 (printed; first of two)", "exam": "15/09/2020 S-II", "q": "Which of the following is done in psychological schools?", "o": ["Control", "Direction", "Teaching", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Psychological schools work on control, direction and teaching. 'Psychological school' means that students' mental health-related responsibilities are to be carried out; in a psychological school, an attempt is made to solve the mental and emotional problems of children by using the principles and methods of psychology.", "tip": "", "status": "note", "note": "The source prints the number 1032 twice on p141; this first occurrence is presumed to be Q1031 by sequence."}, {"id": "AOT-1031", "ch": 10, "page": 141, "ansPage": 141, "srcNo": "1032", "exam": "15/09/2020 S-II", "q": "The emphasis is laid on ______ in the curriculum to fulfil the psychomotor objective of education.", "o": ["Theory and concept", "Action and experimentation", "School management", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "To fulfil the psychomotor objectives of education, emphasis should be laid in the curriculum on action and experimentation. Psychomotor objectives are focused on giving children practical experience and the opportunity to learn in real-life situations.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1032", "ch": 10, "page": 141, "ansPage": 141, "srcNo": "1033", "exam": "15/09/2020 S-II", "q": "India's first floating elementary school named 'Loktak' was inaugurated in:", "o": ["Manipur", "Agartala", "Sikkim", "Kerala"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "On 13 February 2017, a primary school floating on water was inaugurated at Loktak La
