atus": "note", "note": "Option wording reconstructed from the Hindi printed options."}, {"id": "AOT-0460", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "460", "exam": "19/05/2024 S-I", "q": "The 5E instructional model was first proposed in:", "o": ["1988", "1986", "1989", "1987"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The 5E instructional model has five stages - Engage, Explore, Explain, Elaborate, Evaluate - which encourage students' active participation and deep understanding. It was first developed in 1987 by the Biological Sciences Curriculum Study (BSCS) and was proposed by Bybee and Landes.", "tip": "5E = Engage, Explore, Explain, Elaborate, Evaluate (BSCS, 1987).", "status": "ok", "note": ""}, {"id": "AOT-0461", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "461", "exam": "19/05/2024 S-I", "q": "Which step calms the curiosity of students and helps them connect with the concepts learnt earlier?", "o": ["Elaborate", "Explain", "Engage", "Explore"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The first step of the 5E lesson plan is the engagement step. This step increases students' curiosity and helps them connect with previously learnt concepts, which also helps maintain new knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0462", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "462", "exam": "19/05/2024 S-I", "q": "The most natural and simple way of teaching a lesson and proceeding further is:\nStatement I: Something that the students already know.\nStatement II: Facts unknown to students.\nStatement III: Example.\nStatement IV: Illustration.\nChoose the correct option.", "o": ["I, III and IV", "Only I", "Only II", "III and IV"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The natural and simple way of teaching a lesson is to start from the students' prior knowledge, so that they feel connected to the subject; concepts become clear through examples and illustrations, giving depth to understanding. This approach makes teaching effective, interesting and understandable.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0463", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "463", "exam": "09/06/2024 S-II", "q": "The description of models of teaching is ______.", "o": ["The teacher's behaviour, including the teacher-student interaction", "Learning environment with teaching behaviour", "Learner behaviour with personality traits", "Subject matter with logical structure"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Models of teaching describe the teacher's behaviour, including the interaction between teacher and student. They show the patterns of interaction between teacher and student and how the teacher behaves in the classroom, and make clear the teaching-learning environment and the way of understanding subject matter.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0464", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "464", "exam": "09/06/2024 S-II", "q": "A work plan for an academic year is called:", "o": ["Unit plan", "Yearly plan", "Lesson plan", "Monthly plan"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A work plan for an academic year is a yearly plan. A year's work plan is a structured, written document that states the educational activities, goals and objectives for the whole year in an educational institution, including curriculum goals, major topics, assessment strategies and time limits.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0465", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "465", "exam": "09/06/2024 S-II", "q": "Preparation, Presentation, ______ and Production are the 4 P's of a lesson plan.", "o": ["Practice", "Perfect", "Preservation", "Purity"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The 4 P's of a lesson plan are Preparation, Presentation, Practice and Production, which together make an effective teaching structure. Practice gives students the opportunity to practise to understand and remember the content, and may include activities such as question-answer, group work and practical work.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-034", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0466", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "466", "exam": "27/05/2024 S-I", "q": "The duration of lessons in macro lesson plans is:", "o": ["5-10 minutes", "10-20 minutes", "20-30 minutes", "35-45 minutes"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Macro lesson plans are for extended and detailed teaching activities for which enough time is needed. They include introduction, presentation, practice and evaluation; a period of 35-45 minutes is considered most suitable for complete and effective teaching so that all learning objectives can be attained.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-035", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0467", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "467", "exam": "27/05/2024 S-I", "q": "How many aspects are there in lesson plans based on Flink's classification?", "o": ["4", "5", "6", "7"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Flink, the classification of lesson plans is based on six major aspects: objective, content, teaching method, teaching aids, teaching process and evaluation. Through these aspects teaching becomes effective and purposeful, helping the overall development of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0468", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "468", "exam": "26/05/2024 S-II", "q": "The issue of 'educational burden on students' was examined by the:", "o": ["Adiseshiah Committee", "Ishwarbhai Patel Committee", "Mathur Committee", "Yashpal Committee"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The Yashpal Committee, constituted by the Government of India's Ministry of Human Resource Development (now Ministry of Education) in 1992, examined the issue of educational burden on students. In 1993 it submitted a report titled 'Learning Without Burden', whose main aim was to reduce the educational burden on school students and improve the quality of learning, especially for young students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0469", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "469", "exam": "26/05/2024 S-II", "q": "In the specific approach, the lesson plan puts more emphasis on:", "o": ["Activity", "Teacher", "Presentation of subject matter", "Teacher and presentation of subject matter"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the specific approach the lesson plan mainly focuses on the teacher and presentation of subject matter. This approach believes that organised and effective presentation of subject matter enhances the effectiveness of the lesson; it looks at how the teacher presents the subject so that students can understand it easily.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0470", "ch": 4, "page": 66, "ansPage": 66, "srcNo": "470", "exam": "19/06/2024", "q": "A teacher should prepare teaching points because these help him/her:", "o": ["In saving time", "In maintaining discipline in the class", "In knowing what to teach in the class", "In making teaching effective"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teaching is a complex, multi-dimensional activity in which we often need to join different tasks and goals. A teacher should prepare teaching points because it helps the teacher know what to teach in the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0471", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "471", "exam": "16/06/2024 S-III", "q": "Which one of the following is a characteristic of project-based teaching?", "o": ["It is non-psychological", "It is theoretical", "It does not give freedom to students to work", "It includes physical and mental activity for the student"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A major characteristic of project-based learning is that it includes physical and mental activities of students. It is not merely theoretical, but gives freedom to work on solving real-world problems practically, so the student takes part actively in the learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0472", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "472", "exam": "16/06/2024 S-III", "q": "Preparation, presentation, ______ and production are the 4 P's of the lesson plan.", "o": ["Practice", "Perfect", "Preservation", "Purity"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The 4 P's in a lesson plan are Preparation, Presentation, Practice and Production. Of the given options, 'practice' is the missing P: the stage where students are actively involved to strengthen learnt concepts and skills, so that knowledge becomes permanent.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-034", "first": false, "kind": "near", "of": "AOT-0465"}}, {"id": "AOT-0473", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "473", "exam": "18/05/2024 S-III", "q": "The full form of the SIOP model is:", "o": ["Sheltered Intervention Observation Protocol", "Sheltered Instruction Observation Protocol", "Sheltered Instruction Objection Protocol", "Sheltered Intervention Objection Protocol"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "SIOP (Sheltered Instruction Observation Protocol) is a teaching framework created for students learning English, which connects language development with subject learning. It includes eight components such as lesson planning, background knowledge, comprehensible input, student interaction practice, lesson delivery, review and assessment, so as to give multilingual students access to the curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0474", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "474", "exam": "18/05/2024 S-III", "q": "Teaching through a lesson plan is beneficial because:", "o": ["A teacher can modify his own behaviour after evaluating his pupils", "A teacher can achieve all the objectives by adopting suitable strategies", "A teacher can complete his syllabus in time", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A lesson plan is very useful for teachers. Through it teachers can assess students' performance and improve their teaching methods; they can achieve all the educational objectives by adopting suitable strategies, and complete the syllabus in the given time by working in a planned manner. A lesson plan makes the teaching process more organised, effective and goal-oriented.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0475", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "475", "exam": "18/05/2024 S-III", "q": "Which type of lesson plan is comprehensive and complex, requiring extensive planning?", "o": ["Daily lesson plan", "Weekly lesson plan", "Monthly lesson plan", "Sequential lesson plans"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A monthly lesson plan is most suitable for comprehensive and complex lessons because it includes the long-term educational objectives and extensive planning of broad strategies and resources for the subject matter.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0476", "ch": 4, "page": 67, "ansPage": 68, "srcNo": "476", "exam": "14/06/2024 S-III", "q": "After completion of class teaching:", "o": ["The blackboard should be got cleaned by any student", "The blackboard should be left as it is", "The teacher should clean the blackboard", "Anyone of them"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "After the class teaching is over, the teacher should clean the blackboard. Maintaining discipline and cleanliness in the class is the teacher's responsibility; if the teacher himself cleans the blackboard it presents a good example for students and makes the educational environment positive.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-036", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0477", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "477", "exam": "14/06/2024 S-III", "q": "A sense of responsibility is not cared for in:", "o": ["Instructional administration", "Authoritarian administration", "Democratic administration", "Laissez-faire administration"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A sense of responsibility is not cared for in laissez-faire administration. Laissez-faire is a system where control and intervention are minimum; individuals or organisations are given a lot of freedom and are free to take their own decisions.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-037", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0478", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "478", "exam": "19/05/2024 S-III", "q": "A ______ is a guideline that can help you organise what learning and how learning will take place in your lesson.", "o": ["Content", "Lesson plan", "Map", "All of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A lesson plan is a guideline that helps you organise how learning will take place in the class and what will be taught and how. It helps the teacher teach in an effective way.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0479", "ch": 4, "page": 67, "ansPage": 67, "srcNo": "479", "exam": "19/05/2024 S-III", "q": "The duration of lessons in macro-lesson plans is:", "o": ["5-10 min", "10-20 min", "20-30 min", "35-45 min"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The duration of lessons in macro-lesson plans is 35-45 minutes. This period gives students enough time to understand the subject matter in depth and take part in various activities, making effective teaching-learning possible.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-035", "first": false, "kind": "near", "of": "AOT-0466"}}, {"id": "AOT-0480", "ch": 4, "page": 68, "ansPage": 68, "srcNo": "480", "exam": "08/09/2023 S-I", "q": "Which of the following is one of the five principles of the Merrill model?", "o": ["Activation", "Assessment", "Analysis", "Achievement"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Activation' is one of the five principles of the Merrill model. David Merrill's first principles of instruction are an instructional model that identifies universal recommendations for building learning experiences. The five principles are: problem-centred, activation, demonstration, application and integration.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0481", "ch": 4, "page": 68, "ansPage": 68, "srcNo": "481", "exam": "09/09/2023 S-I; 15/09/2023 S-I", "q": "The 5E model is based on:", "o": ["Constructivist theory of teaching", "Behaviourist theory", "Interactionist theory", "Cognitivist theory"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The 5E model is based on the constructivist theory of teaching. In it students are encouraged to face a problem or question and then solve it using their own knowledge and experiences. Constructivism holds that people construct knowledge and meaning from their experiences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0482", "ch": 4, "page": 68, "ansPage": 68, "srcNo": "482", "exam": "05/09/2023 S-III", "q": "The father of the lesson plan is:", "o": ["Ziller", "Herbart", "Carl Stoy", "Dewey"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The father of the lesson plan is the German psychologist Friedrich Herbart. He propounded the five-step system of lesson plan, still followed in education today: preparation, presentation, comparison (association), generalisation and application.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0483", "ch": 4, "page": 68, "ansPage": 68, "srcNo": "483", "exam": "05/09/2023 S-I", "q": "Which one of the following is included in the 5E model?", "o": ["Testing", "Ease", "Digging", "Exploration"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The 5E learning model is an instructional model based on 5 stages: engage, explore, explain, elaborate and evaluate. Exploration is a stage of the 5E model, in which students experience the concept before it is explained to them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0484", "ch": 4, "page": 68, "ansPage": 68, "srcNo": "484", "exam": "05/09/2023 S-I", "q": "A characteristic of a good lesson plan is:", "o": ["Length of the lesson", "Class level", "Achieving the goal", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A lesson plan helps keep to the period of each class and provides a framework for teachers to teach effectively. Some key features of an ideal lesson plan: class level, length of the lesson, objectives, and assumptions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0485", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "485", "exam": "13/09/2023 S-I", "q": "The specific objective in a lesson plan is:", "o": ["For the teacher", "For the learner", "For the curriculum", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In a lesson plan, a detailed outline of the various steps taken by the teacher in the class is prepared. Its primary goal is to apply the teaching-learning process. A lesson plan is a teacher's daily guide to what students will learn, how it will be taught and how learning will be measured; it helps teachers be more effective by providing a detailed outline for each class period.", "tip": "", "status": "note", "note": "Question wording is loosely worded in the source; printed answer (a) retained."}, {"id": "AOT-0486", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "486", "exam": "13/09/2023 S-I", "q": "Gaining attention is an important element in the arrangement of:", "o": ["Merrill model", "Gagne model", "ADDIE model", "None"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Gaining attention is an important element in the arrangement of Robert Gagne's model. Gagne's concept is that for normal behaviour certain prerequisites must be determined (e.g. memory-level learning before understanding-level learning). According to him, 'the student's learning is better when external conditions - events of instruction - are arranged', i.e. the sequence of learning events.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0487", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "487", "exam": "08/09/2023 S-II", "q": "The rule of presenting subject matter in an easy way is:", "o": ["Teaching method", "Teaching principle (maxim)", "Teaching technique", "Teaching strategy"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The rule of presenting subject matter easily comes under the 'teaching maxims (principles)'. They give direction to the teaching process and instruct the teacher how to make the subject matter understandable so that students gain the maximum knowledge and understanding.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0488", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "488", "exam": "08/09/2023 S-II", "q": "Introduction (preparation) is related to:", "o": ["Previous knowledge", "New knowledge", "Specific objective", "Objective statement"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The introduction is related to previous knowledge. It should be prepared on the basis of previous knowledge so that the teacher gets to know the children's thinking towards the lesson or subject to be taught. The introduction should coordinate previous knowledge in questions with the subject matter being taught.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0489", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "489", "exam": "08/09/2023 S-II", "q": "Homework in a lesson plan should be related to:", "o": ["Previous knowledge", "Repetition", "Student activity", "New knowledge related to previous knowledge"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Homework in a lesson plan should relate new knowledge to previous knowledge, because it helps students understand the new topic and strengthens their previous knowledge. The student can practise what was newly learnt and bring it to the point of completion.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0490", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "490", "exam": "08/09/2023 S-II", "q": "The investigative (discovery) question in a lesson plan requires:", "o": ["Previous knowledge", "Previous experience", "Subject knowledge", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For an investigative question in the lesson plan, the teacher uses students' previous knowledge, previous experience and subject knowledge, which increases interest and curiosity in the teaching process. Students can be encouraged to be enthusiastic about new knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0491", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "491", "exam": "09/09/2023 S-I", "q": "The lesson plan process is:", "o": ["Planning of a chapter", "Planning of subject-related activity", "Planning of teaching strategy", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Lesson planning is a process in which the teacher plans the chapter, subject-related activities and teaching strategy for a particular lesson. The objective of the lesson plan is to make the teaching-learning process effective, considering students' needs, curriculum and teaching-learning methods.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0492", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "492", "exam": "10/09/2023 S-I; 18/09/2023 S-I", "q": "The subject matter is determined by:", "o": ["Teaching method", "Teacher's attitude", "Participation of students", "Teaching effectiveness"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Subject matter is determined by students' participation. How interesting the subject is to the learner affects his participation; subjects that are relevant and interesting to students are ones in which they participate more.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0493", "ch": 4, "page": 69, "ansPage": 69, "srcNo": "493", "exam": "10/09/2023 S-I", "q": "General objectives in a lesson plan:", "o": ["Define long-term objectives", "Define immediate objectives", "Define class activity", "Define teacher activity"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "General objectives in the lesson plan define long-term objectives. A lesson plan is a teacher's guide for making a lesson convenient; its primary goal is to estimate the teaching-learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0494", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "494", "exam": "13/09/2023 S-I", "q": "The sub-topic is reflected in a lesson plan by:", "o": ["General objective", "Specific objective", "Objective statement", "Teaching point"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In a lesson plan the sub-topic is reflected by the objective statement. The lesson plan tells how much of the syllabus has been completed and how much remains. Without a lesson plan, a teacher may teach the same lesson two or three times by mistake; it is helpful for completing the syllabus on time.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0495", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "495", "exam": "13/09/2023 S-I", "q": "The plan made by a teacher for teaching a lesson is called:", "o": ["Unit plan", "Lesson plan", "Curriculum plan", "Master plan"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The plan prepared by the teacher for teaching a lesson is called a 'lesson plan'. A lesson plan is a written plan based on the teacher's thought before teaching, keeping in mind the textbook, objectives and principles of teaching. According to Davies, 'to go into the class, preparation beforehand is necessary, because the biggest hindrance to a child's progress is the teacher's incomplete preparation'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0496", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "496", "exam": "15/09/2023 S-I", "q": "A lesson plan determines:", "o": ["Learning objectives", "Objectives of the school", "Objectives of the principal", "Objectives of the management"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A lesson plan mainly determines the learning objectives. It fixes the methods of teaching and evaluation so that students understand the lesson well. A lesson plan has details of teaching aids, questioning method, time limit and homework.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0497", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "497", "exam": "15/09/2020 S-III", "q": "Integration of subject content can be done at:", "o": ["Elementary level only", "Secondary level only", "Senior secondary level only", "All the above levels"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Integration of subject matter can be done at any level. Subject matter integration means combining different subjects into one so that students can understand the subject better, learn more effectively and see connections between disciplines. At the elementary level, students can use mathematics in history; at the secondary level, social, language and history knowledge; at senior secondary, mathematics and science for a science experiment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0498", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "498", "exam": "09/09/2020 S-I", "q": "'RMSA' means:", "o": ["Rashtriya Madhyamik Soochna evam Anusandhan", "Rashtriya Uchcha Madhyamik Shiksha Abhiyan", "Rashtriya Madhyamik Shiksha Abhiyan", "Rajya Madhyamik Shiksha Abhiyan"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The full form of RMSA is Rashtriya Madhyamik Shiksha Abhiyan (National Mission for Secondary Education), a centrally sponsored scheme of the Ministry of Human Resource Development. Its main aim is to make good-quality secondary education available, accessible and affordable to all children of 15-16 years; it was started in 2009.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0499", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "499", "exam": "10/09/2020 S-II", "q": "The purpose of early childhood education is to:", "o": ["Emphasise the teaching of 3 Rs", "Provide them nutritious food", "Relieve parents from attending to their children for a few hours", "Improve their socialisation and perceptual abilities and prepare them for school readiness"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "School education from Class 1 to 5 is primary education, also called basic education, because it begins a child's initial reading, writing and arithmetic. The objectives of primary education include: developing socialisation and perceptual ability to prepare the child for school; giving knowledge of the mother tongue as the first language; and giving knowledge of health rules and of the natural and social environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0500", "ch": 4, "page": 70, "ansPage": 70, "srcNo": "500", "exam": "15/09/2020 S-I", "q": "The following are the functions of the time table in the school:", "o": ["To show hours of work", "To show teachers at work and at rest", "Time of morning assembly", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A school time-table is a plan or chart that shows the daily allotment of time among many subjects, activities and classes in the school. Its functions: it shows the hours of work, shows the work and rest time of teachers, and shows the time of morning assembly.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0501", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "501", "exam": "15/09/2020 S-I", "q": "Following are the principles of time table construction:", "o": ["Amount of time available", "Principles of justice", "A and B both", "Number of students in the school"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "While preparing the time-table, it should be balanced and kept in mind that it should not be rigid; it is based on the amount of time available and on the principle of justice, and has flexible dealing with teachers and the head.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0502", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "502", "exam": "14/09/2020 S-I", "q": "The mental stimulation (brainstorming) model of teaching is used for the improvement of which of the following?", "o": ["Understanding", "Application", "Creativity", "Problem solving"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The brainstorming model of teaching is used for improving creativity. The brainstorming method was developed by Osborn; it is the most famous and oldest technique to stimulate creative thinking and is also very useful in solving complex and important problems.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0503", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "503", "exam": "14/09/2020 S-I", "q": "NIEPA is mainly concerned with:", "o": ["Educational studies", "Educational supervision", "Educational planning and administration", "Educational measurement"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "NIEPA (National Institute of Educational Planning and Administration) is mainly concerned with educational planning and administration. It is a premier organisation dealing with capacity building and research in planning and management of education not only in India but also in South Asia.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0504", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "504", "exam": "15/09/2020 S-II", "q": "The rules of presenting the contents to make them easy are called:", "o": ["Methods of teaching", "Maxims of teaching", "Techniques of teaching", "Teaching strategies"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The rules of presenting subject matter in an easy way are called maxims of teaching. The teaching principles are based on two types of principles: (1) general principles and (2) psychological principles; the teaching principle is decided by teachers to make the teaching process and help learners learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0505", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "505", "exam": "15/09/2020 S-III", "q": "A teacher, while introducing a new subject to her/his class for the first time, should:", "o": ["Begin the first lesson without wasting time", "Give the class a broad outline of the subject", "Check the previous grades of students", "Check the previous knowledge of students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher who is introducing a new subject to the class for the first time should find out students' previous knowledge, which tells her what the students already know about the subject and at what level teaching should be given.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0506", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "506", "exam": "18/09/2020 S-II", "q": "The most important aspect of the New Education Policy, 1986 is:", "o": ["Equal opportunities for education for all sections of society", "Informal education", "Teacher training programme", "Counselling arrangement at the secondary level"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The most important aspect of NEP 1986 is equal opportunities of education for all sections of society. The policy particularly stressed equalising educational opportunities for women, Scheduled Tribes and Scheduled Castes in order to eliminate inequalities, especially for Indian women.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0507", "ch": 4, "page": 71, "ansPage": 71, "srcNo": "507", "exam": "18/09/2020 S-II", "q": "Who propounded the five-step system of 'Lesson Plan'?", "o": ["Herbart", "Bruner", "Galileo", "None of these"], "key": {"printed": [0], "verified": [0], "official": 1}, "e": "The five-step system of lesson plan was started by the German psychologist J. F. Herbart. His five steps are: preparation, presentation, comparison (association), generalisation and application.", "tip": "", "status": "disputed", "note": "The book notes that the Bihar Commission gave answer (b) Bruner, which it says is not correct. Printed key (a) retained; official key (b) recorded."}, {"id": "AOT-0508", "ch": 4, "page": 72, "ansPage": 72, "srcNo": "508", "exam": "18/09/2020 S-II", "q": "'Project is a purposeful action that is carried out in a social environment with full engagement.' Whose statement is this?", "o": ["Kilpatrick", "Vygotsky", "Dewey", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Developing a project as a plan is purposeful activity carried out wholeheartedly in a social setting. Dr. William Heard Kilpatrick defined it as 'a project is a purposeful action carried out wholeheartedly in a social environment'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0509", "ch": 4, "page": 72, "ansPage": 72, "srcNo": "509", "exam": "26/02/2020 S-I", "q": "For realising the goal of teacher training, the most important aspect is:", "o": ["Training module", "Inspection", "Follow-up programme", "Planning"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Every teacher should go through a teacher training programme because it is a training course that ensures professional development of teachers. In setting the goal of teacher training, the training module is the most important: it gives detailed information about a particular programme's content and teaching strategies, methods and resources, and the teacher can use it as a guideline.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0510", "ch": 5, "page": 72, "ansPage": 72, "srcNo": "510", "exam": "09/06/2024 S-I", "q": "The best example of microteaching is:", "o": ["Role play", "Simulation", "Demonstration", "Brainstorming"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The best example of microteaching is simulation. Microteaching is a controlled and short-duration process of practising teaching in which the trainee teaches a small group of students and receives feedback, which helps improve his teaching skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0511", "ch": 5, "page": 72, "ansPage": 72, "srcNo": "511", "exam": "09/06/2024 S-I", "q": "Which of the following is NOT a feature of the Indian model of microteaching?", "o": ["Feedback is given to the teacher by all the students immediately after the completion of the micro-lesson", "Audio cassettes and video films are used during the microteaching process", "A simulated class is used in the microteaching process", "During microteaching, the pupil-teacher, teacher, pupil and supervisor play roles"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "It is not a feature of the Indian model that during microteaching the pupil teacher plays the roles of teacher, pupil and supervisor. In contrast, in this model the role of each participant is clearly defined so that training can be effectively conducted.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0512", "ch": 5, "page": 72, "ansPage": 72, "srcNo": "512", "exam": "09/06/2024 S-I", "q": "A drawback of microteaching is:", "o": ["Not successful in real classroom conditions", "Lack of supervision", "No place for feedback", "Long duration of study"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A drawback of microteaching is that it does not give the full experience of the complexity of real classroom conditions. It is a controlled environment that cannot cover all the aspects of a real situation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0513", "ch": 5, "page": 72, "ansPage": 72, "srcNo": "513", "exam": "09/06/2024 S-I", "q": "CAI means:", "o": ["Computer Analytical Instruction", "Computer Assisted Instruction", "Computer Assisted Interview", "Computer Analytical Interview"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "CAI stands for Computer Assisted Instruction. It is a teaching method where a computer software or hardware is used to give instruction, practice and feedback; its aim is to make the learning process more personal and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0514", "ch": 5, "page": 72, "ansPage": 72, "srcNo": "514", "exam": "18/05/2024 S-I", "q": "The method of acquiring teaching skills is:", "o": ["Questioning-based learning", "Team teaching", "Inquiry-based learning", "Microteaching"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Microteaching is a method by which teaching skills are practised in small parts and proficiency is obtained, so that specific skills can be taught and trainees can teach effectively. It is a practical method of training.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0515", "ch": 5, "page": 72, "ansPage": 72, "srcNo": "515", "exam": "18/05/2024 S-I", "q": "Which of the following is NOT an advantage of team teaching?", "o": ["Better use of resources", "Better planning", "Better use of educational technology", "Better financial benefit to the teacher"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In team teaching, resources are better used, the work plan and weak students are helped, but special attention is not given to better financial benefit to teachers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0516", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "516", "exam": "18/05/2024 S-I", "q": "While planning teaching, the teacher prepares his session:", "o": ["One-by-one", "One-by-many", "Many-by-one", "Many-by-many"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher prepares his sessions one-by-one. This focuses on improving the individual student's learning experience.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0517", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "517", "exam": "24/05/2024 S-I", "q": "Which of the following does NOT apply to microteaching?", "o": ["Focusing on developing teaching skills", "Feedback for the trainee's performance", "Limited number of students", "A very broad and large subject"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Microteaching is a training technique in which a teaching skill is practised by dividing it into small, controlled and specific parts. A very broad and large subject does not apply to it, because in microteaching a subject is taught in small, limited parts, not broadly.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0518", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "518", "exam": "24/05/2024 S-I", "q": "Microteaching was first adopted at Stanford University by:", "o": ["Stephen M. Corey", "Dwight W. Allen", "John Dewey", "Arthur Cunningham"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Microteaching was first adopted at Stanford University in the 1960s by Dwight W. Allen and his colleagues. It is a teacher-training technique in which trainee teachers teach small groups for a short time and receive feedback.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0519", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "519", "exam": "24/05/2024 S-I", "q": "The correct sequence of the conditions of the microteaching cycle is:", "o": ["Plan - Teach - Re-teach plan - Re-teach - Re-feedback", "Plan - Teach - Feedback - Re-teach - Re-feedback", "Plan - Teach - Feedback - Re-lesson plan - Re-feedback", "Plan - Teach - Feedback - Re-lesson plan - Re-teach - Re-feedback"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The correct order of the microteaching cycle is: Plan - Teach - Feedback - Re-plan - Re-teach - Re-feedback. 1. Plan: the trainee prepares a short lesson; 2. Teach: teaches a small group (5-10 students); 3. Feedback: given by supervisor or peers; 4. Re-planning: lesson revised on feedback; 5. Re-teaching: revised lesson taught again; 6. Re-feedback: feedback received again.", "tip": "Microteaching cycle: Plan-Teach-Feedback-Re-plan-Re-teach-Re-feedback.", "status": "ok", "note": ""}, {"id": "AOT-0520", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "520", "exam": "22/05/2024 S-I", "q": "To simplify the duration of microteaching, a small teaching experience is:", "o": ["5 to 10 minutes", "30 to 50 minutes", "1 to 3 hours", "2 to 3 hours"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Microteaching is a short teaching practice aimed at developing a specific skill. Its duration is generally 5 to 10 minutes, which gives an opportunity to focus on one skill in a controlled environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0521", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "521", "exam": "22/05/2024 S-I", "q": "What is the characteristic of team teaching?", "o": ["In team teaching, the whole responsibility lies on all the teachers.", "In team teaching, teachers need to decide all the activities themselves.", "The needs of students, schools and other things are also considered.", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main features of team teaching are the collective teaching responsibility, the teachers' self-determined educational activities, and consideration of the needs of students and the institution; all these aspects make team teaching effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0522", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "522", "exam": "23/05/2024 S-II", "q": "Microteaching is useful for:", "o": ["Secondary classes", "Primary classes", "Teacher training institutions", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is a technique used in teacher-training institutions to help improve teachers' teaching skills. In it the teacher plans a small lesson (5-10 minutes) and then immediately gets feedback; it gives teachers an opportunity to concentrate on and practise various teaching skills such as presentation, questioning and feedback.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0523", "ch": 5, "page": 73, "ansPage": 73, "srcNo": "523", "exam": "23/05/2024 S-II", "q": "According to H. C. Morrison, 'Teaching is a ______ contact between a more mature person and a less mature person.'", "o": ["Direct", "Bipolar", "Intimate", "Universal"], "key": {"printed": [2], "verified": [2], "official": 1}, "e": "According to H. C. Morrison, 'teaching is an intimate contact between a more mature personality and a less mature one, by which the less mature is further advanced in the direction of education'.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (b) 'Bipolar'; the correct answer is (c) 'Intimate'. Printed key (c) retained; official key (b) recorded."}, {"id": "AOT-0524", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "524", "exam": "21/05/2024 S-I", "q": "Who is the father of the microteaching method?", "o": ["Pack and Tucker", "Mac Callan", "Clift", "D. W. Allen and Keith Aitchison"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Microteaching was developed by D. W. Allen and Keith Aitchison in the 1960s. It is used in teacher training so that teachers can practise their teaching skills in small, controlled situations. Its objective is to give teachers the opportunity to improve their teaching skills in small, controlled settings.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-038", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0525", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "525", "exam": "21/05/2024 S-I", "q": "What is the first step of microteaching?", "o": ["Presentation of a model lesson", "Selection of a specific skill", "Theoretical knowledge of microteaching", "Preparing a micro lesson plan"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The first step of microteaching is preparing a micro lesson plan. In it the teacher prepares a plan of teaching based on the subject selected; it is required to make the teaching process well organised, effective and purposeful, and enables development of teaching skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0526", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "526", "exam": "25/05/2024 S-I", "q": "The credit for starting research on the microteaching model in India goes to:", "o": ["Institute of Advanced Studies in Education (IASE), Ajmer", "Institute of Advanced Studies in Education (IASE), Baroda", "Institute of Advanced Studies in Education (IASE), Shimla", "Institute of Advanced Studies in Education (IASE), Pune"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The credit for starting research work on microteaching in India mainly goes to the Institute of Advanced Studies in Education (IASE) in Baroda, which played an important role in adapting and developing microteaching in the Indian context.", "tip": "", "status": "note", "note": "Printed option (b) reads 'Baroda'; some Hindi/English reproductions of this question differ. Answer as printed."}, {"id": "AOT-0527", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "527", "exam": "19/05/2024 S-I", "q": "The objective of microteaching is:", "o": ["To develop teaching skills in teachers", "To develop student ability", "To develop feedback skills in students", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The aim of microteaching is teacher training, where teachers practise teaching short lessons in limited time to a limited group of students. This helps them improve and develop their teaching skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0528", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "528", "exam": "09/06/2024 S-II", "q": "There are three steps in microteaching as a training technique. They are:", "o": ["Knowledge acquisition, skill acquisition and transfer of knowledge", "Preparation, orientation and selection", "Presentation, observation and discussion", "Re-planning, re-teaching and evaluation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "As a training technique, the three steps of microteaching are: knowledge acquisition, skill acquisition and transfer of knowledge. In knowledge acquisition, the teacher-trainee gets information about the various aspects of teaching and skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0529", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "529", "exam": "09/06/2024 S-II", "q": "Which one is NOT an advantage of microteaching?", "o": ["Instant feedback", "Opportunity for re-lesson planning", "Focusing on one skill at a time", "Lack of control over teaching situations"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Lack of control over teaching situations is not an advantage of microteaching. Instant feedback gives the teacher immediate feedback to improve; re-lesson planning lets the teacher teach again from different approaches; focusing on one skill at a time lets the teacher attain mastery over it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0530", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "530", "exam": "27/05/2024 S-I", "q": "Which teaching-learning method was started by Dwight W. Allen?", "o": ["Microteaching", "Team teaching", "Brainstorming", "Interactive teaching"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Dwight W. Allen developed microteaching in the 1960s (1961 as printed). It is a training technique for teachers in which a specific skill is taught in a small group in a short time; it makes teachers' training effective by giving prompt feedback to improve their capabilities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0531", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "531", "exam": "26/05/2024 S-II", "q": "Microteaching is a ______.", "o": ["Demonstration method", "Method of teaching", "Training technique", "Remedial teaching"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is a teacher-training technique in which students teach a small group a small lesson. It gives teachers the facility to improve their teaching methods in a controlled environment and obtain feedback.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0532", "ch": 5, "page": 74, "ansPage": 74, "srcNo": "532", "exam": "26/05/2024 S-II", "q": "How much time is required for presenting a microteaching lesson plan?", "o": ["5 minutes", "10 minutes", "15 minutes", "45 minutes"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A time of 5 minutes is generally considered sufficient for presenting a microteaching lesson plan. This time is appropriate for the teacher to demonstrate teaching skills and for the supervisor to evaluate.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0533", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "533", "exam": "19/06/2024", "q": "Who is the father of the microteaching method?", "o": ["Pack and Tucker", "Mac Callan", "Clift", "D. W. Allen and Keith Aitchison"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The father of the microteaching method is Dwight W. Allen, while Keith Aitchison also contributed to the development of microteaching. D. W. Allen is credited with beginning this concept at Stanford University in 1963.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-038", "first": false, "kind": "exact", "of": "AOT-0524"}}, {"id": "AOT-0534", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "534", "exam": "29/05/2024 S-I", "q": "In microteaching, a pupil-teacher teaches a short lesson to:", "o": ["A large group of pupils", "A small group of pupils", "The whole school students", "The school administrators"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In microteaching a pupil-teacher teaches a small group of pupils. It is a technique of teacher training in which a student-teacher teaches a short lesson to a small group; its aim is to develop teaching skills and it allows the trainee to receive feedback in a controlled environment and improve his methods.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0535", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "535", "exam": "16/06/2024 S-III", "q": "Micro-teaching is a:", "o": ["Device", "Method", "Scaled-down teaching", "Law"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is a technique of 'scaled-down teaching' in which the teaching process is divided into small components, such as fewer students, less time and focus on a specific skill. It helps teachers practise and improve their teaching capacity without the pressure of a real class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0536", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "536", "exam": "16/06/2024 S-III", "q": "Which is NOT a mode of CAI?", "o": ["Tutorial mode", "Drill mode", "Simulation mode", "Question mode"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Computer Assisted Instruction (CAI) does not have a separate 'question' mode. In CAI the usual modes include the tutorial mode (giving new knowledge) and the drill mode (practice). Although questioning is an important part of teaching, it is a technique used within these modes rather than a separate mode of CAI.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0537", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "537", "exam": "18/05/2024 S-III", "q": "Which of the following would you use to shape habits?", "o": ["Indoctrination", "Teaching", "Training", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Training is the most effective way to shape habits. It includes regular practice, discipline and repetition, which make habits permanent. Indoctrination influences feelings or temporary motivation, but habits develop through training.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0538", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "538", "exam": "14/06/2024 S-III", "q": "Knowledge of the internet:", "o": ["Is harmful for the students", "Is beneficial for the students", "Makes students dependable and they lose their own ability", "Is not at all beneficial to the students"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Knowledge of the internet is beneficial for students: it provides them wide access to information, teaches new ways of learning and helps develop research skills. However, its use should be done carefully and wisely, so that students do not become over-dependent and do not lose the ability to learn independently.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0539", "ch": 5, "page": 75, "ansPage": 75, "srcNo": "539", "exam": "14/06/2024 S-III", "q": "Is internet-based teaching suitable for India?", "o": ["Yes", "No", "Yes, but must measure the effectiveness and guide time to time", "Not at the present scenario"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Internet-based learning means online education; its usefulness in India depends on measuring its effectiveness and providing proper guidance from time to time. This ensures that it meets students' needs and improves the teaching-learning process, especially in the context of distance education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0540", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "540", "exam": "14/06/2024 S-III", "q": "Microteaching does not mean:", "o": ["Microteaching training is a technique in which one teaching skill is practised at a time", "In microteaching, student teachers have to go to schools and do actual teaching", "In this, emphasis is on attaining mastery and proficiency in teaching", "In this, changes are brought about in the teaching of proficiency through feedback"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Microteaching does not mean that students must go to schools to teach in actual conditions. It is a training technique with limited time, students and skill; in it the classroom environment is artificial and improvement is made through feedback.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0541", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "541", "exam": "14/06/2024 S-III", "q": "Microteaching is used:", "o": ["In secondary classes", "In teacher training institutions", "In primary classes", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Microteaching is used in teacher training institutions, mainly to train teachers. It is an effective method by which teachers can practise and improve their teaching methods.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0542", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "542", "exam": "19/05/2024 S-III", "q": "The aim of microteaching is:", "o": ["To create simulated situations", "To strengthen educational institutions", "To modify student behaviour", "To modify teacher behaviour"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main aim of microteaching is to change teacher behaviour. It helps teachers improve their teaching skills and develop effective teaching techniques, so that they can perform better in the class.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-039", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0543", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "543", "exam": "19/05/2024 S-III", "q": "Is microteaching real teaching?", "o": ["Yes", "No", "Both yes and no, from different perspectives", "Can't say anything"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is both yes and no from different perspectives. It simulates real teaching conditions, but its main aim is to practise and improve skills, not to complete a full syllabus. Hence it is a controlled form of real teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0544", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "544", "exam": "19/05/2024 S-III", "q": "Which state has recently installed the EDUSAT technique in its schools?", "o": ["Punjab", "Uttar Pradesh", "Haryana", "Himachal Pradesh"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The EDUSAT (satellite-based educational programme) was first started in Haryana on 21 May 2007. Its aim was to provide quality education in remote areas and improve the teaching of especially science education; the Haryana government made important investments in this initiative.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0545", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "545", "exam": "05/09/2023 S-II", "q": "Teleconference is:", "o": ["A two-way broadcasting system", "A one-way broadcasting system", "Both of the above", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A teleconference is a type of two-way broadcasting system in which two or more people can converse with one another, as if sitting in the same room. It can be done using a telephone, video-conferencing or other electronic devices.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0546", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "546", "exam": "05/09/2023 S-III", "q": "The correct way of writing on the blackboard for a teacher is:", "o": ["Writing clear and fast", "Writing important points", "First writing things and then asking students to read", "Writing the answers to questions"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The right way for a teacher to write on the blackboard is to first write the things and then ask the students to read. This helps students understand the information written on the board easily.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0547", "ch": 5, "page": 76, "ansPage": 76, "srcNo": "547", "exam": "05/09/2023 S-III", "q": "The 'Events of Instruction' stage was created by:", "o": ["Merrill", "Bloom", "Gagne", "Vygotsky"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The 'Events of Instruction' stage was created by Gagne, an American educationist who made important contributions to education, including the 'events of instruction' stage, divided into 9 steps.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0548", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "548", "exam": "05/09/2023 S-III", "q": "Which stages are included in microteaching?", "o": ["Knowledge acquisition stage", "Skill acquisition stage", "Transfer stage", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Microteaching is a theoretical approach, so it includes knowledge acquisition, skill acquisition and transfer stages. In the knowledge acquisition stage, the teacher gets information about the subject to be taught; in the skill acquisition stage, develops teaching skills; and in the transfer stage, applies knowledge and skill in other contexts.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0549", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "549", "exam": "05/09/2023 S-III", "q": "The best use of the blackboard by a teacher can be:", "o": ["To make students square (box)", "To write important and noteworthy points", "Both A and B", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The blackboard can be used by a teacher to write important points. It is a visual aid that can strengthen students' memory by helping them remember lessons; teachers can focus on lessons, pictures, charts and other information on it and help remember important information.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0550", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "550", "exam": "05/09/2023 S-III", "q": "Who developed programmed instruction?", "o": ["Skinner", "Pavlov", "Freud", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Programmed instruction was developed by B. F. Skinner, an American psychologist who propounded the operant conditioning theory. Its basis is also active conditioning; it was introduced by Professor B. F. Skinner of Harvard University in 1954.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0551", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "551", "exam": "05/09/2023 S-I", "q": "Microteaching is used in:", "o": ["Secondary classes", "Primary classes", "Teacher training institutions", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is a teacher-training technique that gives the opportunity to improve in simple tasks termed 'teaching skills'. In microteaching, teaching skills, subject matter and classroom discipline can be simplified and made easier.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0552", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "552", "exam": "13/09/2023 S-I; 10/09/2023 S-I", "q": "Which skills are used in microteaching?", "o": ["Blackboard skill", "Probing question skill", "Both A and B", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is a teacher-training technique that improves teachers' skills by various simple tasks (called teaching skills). Microteaching increases the teacher's learning of real-time teaching experience. Blackboard skills and probing-question skills are both used in microteaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0553", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "553", "exam": "13/09/2023 S-I", "q": "There is a similarity between instruction and teaching:", "o": ["Both are student-centred", "Both are subject-centred", "Both emphasise feedback, reinforcement and content analysis", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teaching is a situation in which a person imparts knowledge to another. Instruction means learning in which the child is helped to gain knowledge and develop intelligence. The similarity between teaching and instruction is that both emphasise feedback, reinforcement and content analysis.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0554", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "554", "exam": "13/09/2023 S-I", "q": "Which of the following statements is wrong for microteaching?", "o": ["It is a teacher-training concept", "It reduces the teacher's self-confidence", "It provides creative feedback", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Microteaching is regarded as an effective technique for developing the teaching skills of teachers. It is a real teaching, but its aim is to develop teachers' skills and not to reduce teacher self-confidence.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0555", "ch": 5, "page": 77, "ansPage": 77, "srcNo": "555", "exam": "08/09/2023 S-II", "q": "Item analysis is generally focused on finding out:", "o": ["The effectiveness of distractors", "The facility index", "Discrimination power", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "These three aspects are looked at in item analysis so that the quality and effectiveness of the questions of a test or survey can be assessed: the effectiveness of distractors (how well options mislead those who do not know the subject), the facility index (how many candidates answered correctly) and discrimination power (how well the item separates high and low performers).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0556", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "556", "exam": "08/09/2023 S-I", "q": "What does 'A' stand for in the ADDIE model?", "o": ["Analysis", "Achievement", "Assessment", "Application"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the ADDIE model, A stands for Analysis. ADDIE is an instructional design model that has stood the test of time and use: A - Analysis, D - Design, D - Development, I - Implementation, E - Evaluation.", "tip": "ADDIE = Analysis, Design, Development, Implementation, Evaluation.", "status": "ok", "note": ""}, {"id": "AOT-0557", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "557", "exam": "08/09/2023 S-I", "q": "Which of the following is NOT a skill of microteaching?", "o": ["Probing question skill", "Painting skill", "Blackboard skill", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Painting skill is not a skill of microteaching. Microteaching is a process of teacher training which improves teaching conditions and provides training in one skill at a time, through which the teacher brings desired improvement in teaching; its main purpose is to improve teacher behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0558", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "558", "exam": "08/09/2023 S-I", "q": "What is the meaning of synthesis?", "o": ["Creation of a new idea", "Creation of a new object", "Creation of a unique product", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Synthesis means creating a new idea, a new object and a unique product. Synthesis is the act of creating something new: in the synthesis method, a problem is solved by combining elements and joining the previous information related to it, in an attempt to solve the problem.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0559", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "559", "exam": "09/09/2023 S-I", "q": "Microteaching is based on:", "o": ["Teaching material", "Teaching method", "Teaching skills", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Microteaching is a teaching skill in which the teacher divides a specific task into small steps and demonstrates it systematically. Its aim is to improve the quality of teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0560", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "560", "exam": "10/09/2023 S-I", "q": "Which university developed the ______ model?", "o": ["ADDIE model", "5E model", "6E model", "7E model"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The University of Chicago was opened in 1892 under the patronage of the American Baptist Education Society. This university developed the ADDIE model. ADDIE stands for Analysis, Design, Development, Implementation and Evaluation.", "tip": "", "status": "note", "note": "Question stem as printed: 'Chicago University developed ___'. Printed explanation also credits Chicago; widely, ADDIE is credited to Florida State University (1975). Printed answer (a) retained."}, {"id": "AOT-0561", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "561", "exam": "14/09/2023 S-I", "q": "Analysis, design, development, implementation, evaluation is:", "o": ["Merrill model", "ADDIE model", "Bloom model", "Gagne model"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Analysis, Design, Development, Implementation and Evaluation make the ADDIE model. The ADDIE model is an instructional design model used by instructional designers and training developers to create effective learning experiences; it is a repetitive, dynamic and flexible guideline for creating effective e-learning courses.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0562", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "562", "exam": "15/09/2023 S-I", "q": "The aim of microteaching is:", "o": ["To develop teaching skills in teachers", "To develop student ability", "To develop reinforcement skills of students", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The aim of microteaching is to develop teaching skills in teachers. It is based on psychological learning principles and the practical aspect of educational sociology. It gives the teacher-candidate the chance to practise each skill without facing the chaos of a large class.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-039", "first": false, "kind": "near", "of": "AOT-0542"}}, {"id": "AOT-0563", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "563", "exam": "18/09/2023 S-I", "q": "Shaping a new form by bringing the elements together is:", "o": ["Analysis", "Synthesis", "System", "Understanding"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The process of combining elements to form a new shape is called synthesis. In it all elements and parts are brought together to build a new structure; it involves the use of creative ability, and the student develops a sense of insight, creativity and integration with special emphasis on the whole, e.g. drawing conclusions, generalising, summarising, making a new plan.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0564", "ch": 5, "page": 78, "ansPage": 78, "srcNo": "564", "exam": "09/09/2020 S-III", "q": "Which of the following is NOT a characteristic of 'Micro-Teaching'?", "o": ["Immediate feedback", "Opportunity to re-lesson plan", "Focusing on the same teaching skills", "Lack of control over learning situation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Microteaching is a training concept used for the professional development of teachers at pre-service and in-service levels. It gives teachers a teaching practice situation where the usual complexities of the class are greatly reduced. Its merits: immediate feedback, opportunity to re-plan the lesson, and focus on one teaching skill. 'Lack of control over the learning situation' is not a characteristic, since the situation is controlled.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0565", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "565", "exam": "10/09/2020 S-II", "q": "'CAI' stands for:", "o": ["Computer Analysed Instructions", "Computer Assisted Instructions", "Computer Assisted Intelligence", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "CAI is the abbreviated form of 'Computer Assisted Instruction': a programme that delivers instructional material through a computer system. It is defined as an approach in which the computer is used as the central activity to develop students' knowledge and skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0566", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "566", "exam": "10/09/2020 S-II", "q": "Which of the following is/are the basic paradigms in classroom teaching?", "o": ["Learning paradigm", "Instructional paradigm", "Both (A) and (B)", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The 'learning paradigm and instructional paradigm' are both the basic paradigms of classroom teaching. According to B. R. Joyce, teaching models refer to those specific situations in which students interact so that change comes in their behaviour. Instructional paradigms belong to traditional, teacher-centred teaching methods in which teachers mostly give instruction and students listen and follow.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0567", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "567", "exam": "14/09/2020 S-II", "q": "The first step of the microteaching cycle is:", "o": ["Feedback", "Teaching", "Planning", "Presentation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The first step of the microteaching cycle is planning. Microteaching is a technique used for the development of skills in students and teachers. The microteaching cycle has 6 steps: Step 1 - Planning; Step 2 - Teaching; Step 3 - Feedback; Step 4 - Re-planning; Step 5 - Re-teaching; Step 6 - Re-feedback.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0568", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "568", "exam": "16/09/2020 S-I", "q": "The effect on students of more use of technology in education will be helpful for:", "o": ["Alienation in students", "Modernisation of the society", "Cultural invasion", "Enhancement in learning level"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Educational technology gives students an opportunity to easily gain information, learn on their own and practise what they have learnt. Through it, the level of learning of students also increases.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0569", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "569", "exam": "16/09/2020 S-I", "q": "In India, distance education is conducted through:", "o": ["National Open School", "Open universities", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In India, distance education is conducted by the National Open School and open universities. Distance education is a system in which the teacher and the learner do not need to be present at a specific place or time; it makes the system flexible and liberal in respect of teaching methods, time scheduling and entry norms, without compromising on the required quality criteria.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0570", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "570", "exam": "18/09/2020 S-II", "q": "'Micro teaching' focuses on the competency over:", "o": ["Method", "Skills", "Content", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Microteaching is based on training to develop specific teaching skills. During teaching a skill is practised and brought to the level of proficiency; with these teaching skills the success of teaching becomes the art of teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0571", "ch": 5, "page": 79, "ansPage": 79, "srcNo": "571", "exam": "18/09/2020 S-II", "q": "To develop research and research-related activities in children:", "o": ["You will increase their observation power", "You will make them aware of the importance of research and research work", "You will tell them about the researchers so that they can also do research", "You will tell them that researchers are respected"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Research-related activities are those activities which result in the creation of new knowledge and the new and creative use of existing knowledge, so that new concepts, methods and understanding can arise. To develop research-related activities in children, make them aware of the importance of research and research work.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0572", "ch": 5, "page": 80, "ansPage": 80, "srcNo": "572", "exam": "18/09/2020 S-II", "q": "What is the correct sequence of micro-teaching?", "o": ["Micro lesson plan - Teaching - Re-lesson plan - Re-teaching - Re-feedback", "Micro lesson plan - Teaching - Feedback - Re-teaching - Re-feedback", "Micro lesson plan - Teaching - Feedback - Re-lesson plan - Re-feedback", "Micro lesson plan - Teaching - Feedback - Re-lesson plan - Re-teaching - Re-feedback"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Microteaching has been defined as a teaching situation scaled down in class size and with the focus on a specific teaching skill. The six steps of the microteaching cycle with their standard time: micro lesson plan; teaching - 6 minutes; feedback - 6 minutes; re-lesson plan - 12 minutes; re-teaching - 6 minutes; re-feedback - 6 minutes; total 36 minutes.", "tip": "Standard cycle: 6+6+12+6+6 = 36 minutes.", "status": "ok", "note": ""}, {"id": "AOT-0573", "ch": 5, "page": 80, "ansPage": 80, "srcNo": "573", "exam": "26/02/2020 S-I", "q": "The 'Guess-who technique' is used to study:", "o": ["Personality profile", "Different aptitude", "Vocational preferences", "Interpersonal relation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The 'Guess-who' technique is used for the study of interpersonal relationships. It is mainly used in schools as an evaluation tool: students are given pictures or descriptions of various kinds of individuals and asked to identify peers who resemble these descriptions. It was developed by Hartshorne and May (1929).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0574", "ch": 6, "page": 80, "ansPage": 80, "srcNo": "574", "exam": "09/06/2024 S-I", "q": "In which type of classroom can a teacher suggest resources and students learn at home using ICT, for example by using video?", "o": ["Excluded classroom", "Separate classroom", "Formal classroom", "Flipped classroom"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The flipped classroom is a teaching method in which the traditional classroom is 'reversed'. In it the teacher makes resources such as video, podcasts and online content available for students to learn at home, and class time is used for discussion, doubt clearing, problem solving, practicals and activities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0575", "ch": 6, "page": 80, "ansPage": 80, "srcNo": "575", "exam": "09/06/2024 S-I", "q": "The basic objective of supervision is to help:", "o": ["The teacher to improve the teaching methods", "The teacher to understand the students", "The children to learn more effectively", "The teacher to deal with students"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The basic objective of supervision is to improve teaching styles so that students' learning can be more effective. It also helps teachers adopt better teaching strategies.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0576", "ch": 6, "page": 80, "ansPage": 80, "srcNo": "576", "exam": "09/06/2024 S-I", "q": "Inclusive education is based on the principle of:", "o": ["Social balance", "Equality and equal opportunity", "Social existence and globalisation", "World brotherhood"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The fundamental principle of inclusive education is equality and equal opportunity. Its aim is to provide equal opportunity to all students, without ignoring their specific needs and background. It ensures that no student is left behind and that everyone gets the chance to reach their potential.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0577", "ch": 6, "page": 80, "ansPage": 80, "srcNo": "577", "exam": "18/05/2024 S-I", "q": "The main objective of classroom teaching is:", "o": ["To give information", "To develop an inquisitive mind", "To develop the personality of students", "To help the student only to pass the examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The main objective of classroom teaching is not only giving information or helping pass the examination, but the overall development of students' personality. Education encourages critical thinking, social skills, moral values, and overall mental and emotional development.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-040", "first": true, "kind": "near", "of": null, "keyConflict": true}}, {"id": "AOT-0578", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "578", "exam": "18/05/2024 S-I", "q": "Which of the following potential factors affecting teaching is NOT related to teaching facilities and the learning environment?", "o": ["Availability of textbooks for use", "Shortage of highly qualified teachers", "Active
