ents; so the biggest reason for a teacher's failure is a lack of enough command over the subject.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0799", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "801", "exam": "15/09/2020 S-I", "q": "A teacher can establish adjustment with his students by:", "o": ["Becoming a scholar of the subject", "Impressing students with knowledge and skill", "Playing the role of a guide", "Becoming a friend of the students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher can establish adjustment with his students by becoming a friend of the students. Making friendly relations with students is the fastest way to win their trust; it also helps your students stay comfortable with your presence and be comfortable in the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0800", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "802", "exam": "16/09/2020 S-I", "q": "The major responsibility of a teacher is to:", "o": ["Prepare a lesson plan and teach accordingly", "Provide as many activities as possible", "Maintain strict discipline", "Provide learning opportunities as per the different learning styles of students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main responsibility of a teacher is to facilitate the increase and development of students' learning: to plan effective lessons and give students opportunities to learn according to their different learning styles, and support them, creating an inclusive and positive classroom environment. Same as Q782.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0801", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "803", "exam": "16/09/2020 S-I", "q": "The most valuable thing for a teacher is:", "o": ["He has a job", "He has dignity", "Students' faith", "He has faith in teaching"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The most valuable thing for a teacher is his faith in his teaching; he does not do it as a profession but as one who is dutiful and takes up the responsibility of solving every problem of the students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0802", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "804", "exam": "16/09/2020 S-I", "q": "For a teacher, the study of educational sociology is important because:", "o": ["Education is the most essential aspect for social progress", "Education is every citizen's fundamental right", "Education is influenced by the social setting", "The individual and the society are bound together"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For teachers, the study of educational sociology is important because it helps them gain a comprehensive understanding of the social, cultural and historical factors; the teacher gives students the experiences, beliefs and behaviour, and connects the individual and society with each other.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0803", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "805", "exam": "18/09/2020 S-II", "q": "A good teacher must be:", "o": ["Resourceful and autocratic", "Resourceful and participative", "Resourceful and authoritative", "Resourceful and dominant"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A good teacher should be resourceful and participative. Teachers have a wide range of tools for analysing the situation; he should have knowledge or depth in the subject he wants to teach.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0804", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "806", "exam": "18/09/2020 S-II", "q": "The teaching profession can be upgraded only when:", "o": ["Teachers teach through creative methods", "Pay as per merit", "Teachers themselves should do new experiments and find new methods", "Teachers give more and more time to the students"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "New teaching strategies can create an effective environment and can help better relations between teachers and students that encourage cooperation to solve problems. The teaching profession can be upgraded only when teachers themselves do new experiments and find new methods.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0805", "ch": 8, "page": 112, "ansPage": 112, "srcNo": "807", "exam": "18/09/2020 S-II", "q": "How can a teacher encourage her students to be intrinsically motivated towards learning for the sake of learning?", "o": ["By inducing anxiety and fear", "By getting competitive tests", "By supporting them in setting individual goals and their mastery", "By offering tangible rewards such as chocolate"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher can encourage a student to remain intrinsically motivated to learn by supporting them in setting individual skill goals and mastering them. Giving rewards relates to external motivation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0806", "ch": 8, "page": 113, "ansPage": 113, "srcNo": "808", "exam": "18/09/2020 S-II", "q": "A secondary school teacher really helps students if she:", "o": ["Makes notes to children in class", "Completes the syllabus before the scheduled time", "Is impartial in the assessment", "Encourages students to ask questions"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A secondary-school teacher really helps students if she encourages them to ask questions, so that students can search by linking theory and their experience, and solve required problems themselves.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0807", "ch": 8, "page": 113, "ansPage": 113, "srcNo": "809", "exam": "18/09/2020 S-II", "q": "A few students in your class are exceptionally bright. You teach them:", "o": ["Along with the class", "Along with higher classes", "By using an enriched programme", "Only when they want"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Each student is different from others in psychological aspects such as intelligence and personality. For exceptionally bright students, additional guidance will not let them get bored and will keep them busy building knowledge; so for the bright students in your class you should teach them to use enriched programmes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0808", "ch": 8, "page": 113, "ansPage": 113, "srcNo": "810", "exam": "18/09/2020 S-II", "q": "A good teacher must have knowledge of teaching methods, because:", "o": ["This makes learning more effective", "With this, teaching work can be done quickly", "With this, teaching work can be done easily", "This gives confidence to the teacher"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A good teacher must have knowledge of teaching methods because it makes teaching more effective. Effective teaching is a term used to describe the knowledge, strategies and practice of a successful teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0809", "ch": 8, "page": 113, "ansPage": 113, "srcNo": "811", "exam": "26/02/2020 S-I", "q": "Which quality of the teacher is liked the most by the students?", "o": ["Love for discipline", "Punctuality", "Dominance", "Impartiality"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher plays many roles, such as investigator, actor, researcher, planner, manager, content provider, guide, promoter and collaborator. Impartiality is the most liked quality of a teacher, because students respect teachers who treat them equally and obey them. Other qualities: punctuality; ability to maintain discipline.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0810", "ch": 8, "page": 113, "ansPage": 113, "srcNo": "812", "exam": "26/02/2020 S-I", "q": "Which one of the following is a major challenge for a teacher?", "o": ["Maintain discipline in the classroom", "Make students do their homework", "Prepare good question papers for examination", "Make teaching joyful"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "'Making teaching enjoyable or interesting' is the main challenge for a teacher. Other challenges faced by teachers are: curriculum outline issues and challenges; challenges and issues of the teaching-learning process; challenges of teaching-learning material; challenge of a group of students with mixed ability; and the challenge of maintaining justice and democracy in the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0811", "ch": 8, "page": 113, "ansPage": 113, "srcNo": "813", "exam": "26/02/2020 S-I", "q": "'A teacher cannot truly teach unless he is learning himself.' This viewpoint was articulated by:", "o": ["Vivekananda", "Gandhi", "Tagore", "Sri Aurobindo"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "This thought was given by the great educationist Rabindranath Tagore. He emphasised that teachers should first be good learners: just as a lamp cannot light another lamp unless it keeps its own flame burning, a teacher cannot teach unless he himself keeps learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0812", "ch": 8, "page": 114, "ansPage": 114, "srcNo": "814", "exam": "26/02/2020 S-I", "q": "An effective teacher is one who:", "o": ["Is master of his/her subject", "Maintains discipline in the class", "Is good at rapport building", "Facilitates his/her students to learn at their own"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "An effective teacher presents a strong case for student-centred education and advocates a philosophy of teaching in which students play a much more important role in decision-making. An effective teacher facilitates students to learn on their own, since effective teaching occurs when a teacher succeeds in actively involving students in learning. An effective teacher should give priority to students' understanding, needs, experiences, etc. and promote problem-solving and reasoning skills.", "tip": "", "status": "note", "note": "Option (d) text is cut off in the source ('...to learn at their own [pace]')."}, {"id": "AOT-0813", "ch": 8, "page": 114, "ansPage": 114, "srcNo": "815", "exam": "26/02/2020 S-I", "q": "The most important function of a teacher is to:", "o": ["Impart subject matter", "Teach problem-solving technique", "Guide pupils' growth", "Maintain order in the class"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teachers are persons who have knowledge of teaching and understand learning problems. The main function of a teacher is: to guide pupils' growth; to motivate students to learn; to generate enthusiasm for learning in the class; and to create a positive classroom atmosphere.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0814", "ch": 8, "page": 114, "ansPage": 114, "srcNo": "816", "exam": "28/01/2020 S-II", "q": "When was the National Council for Teacher Education (NCTE) established by an Act of Parliament?", "o": ["1993", "1995", "1996", "1997"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The National Council for Teacher Education was established under the National Council for Teacher Education Act, 1993. The Act came into force on 17 August 1995.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0815", "ch": 8, "page": 114, "ansPage": 114, "srcNo": "817", "exam": "28/01/2020 S-II", "q": "Which of the following students need their teachers' attention?", "o": ["Intelligent", "Introvert", "Slow learners", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Intelligent, introvert and slow-learning students all need the teacher's attention. A teacher is a key person in any educational field, and each student needs the teacher's attention. By contributing to the success of each student, the teacher shapes his future.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0816", "ch": 8, "page": 114, "ansPage": 114, "srcNo": "818", "exam": "28/01/2020 S-II", "q": "According to the behaviourist school of psychology, the teacher is:", "o": ["A classroom facilitator", "A storehouse of knowledge", "A leader in the classroom", "Creator of favourable learning conditions"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to behaviourism, learning is a stimulus-response process. In this view the main function of the teacher is to provide an appropriate environment for the students' learning, motivate them, provide them with the resources needed for learning, and encourage their efforts; so a teacher is the creator of favourable learning conditions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0817", "ch": 9, "page": 114, "ansPage": 114, "srcNo": "819", "exam": "09/06/2024 S-I", "q": "Errors of evaluation are:", "o": ["Personal error", "Tendency (central tendency) error", "Constant error", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Errors of evaluation are mistakes that affect the objectivity of evaluation. They include personal error (personal bias), error of central tendency (evaluating everything in the middle based on one quality of the student) and constant error (giving the same marks to every student).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0818", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "820", "exam": "09/06/2024 S-I", "q": "Assessment is used:", "o": ["To improve the learning of future students", "To analyse and synthesise new information", "To recall past information", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Assessment is used to improve students' learning, to analyse and synthesise new information, and to recall previous information. So all the aspects given in the options are included, which make the teaching-learning process effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0819", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "821", "exam": "09/06/2024 S-I", "q": "Summative assessment is ______ learning assessment.", "o": ["From", "Of", "By", "For"], "key": {"printed": [3], "verified": [1], "official": null}, "e": "The printed explanation: summative evaluation done for learning usually occurs at the end of the teaching process, with the aim of evaluating the knowledge and skills achieved by students against objectives; it shows the effectiveness of learning.", "tip": "", "status": "disputed", "note": "Printed key (d) 'for' conflicts with standard terminology: summative = assessment OF learning (b), formative = assessment FOR learning. Printed key retained; verified answer (b)."}, {"id": "AOT-0820", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "822", "exam": "18/05/2024 S-I", "q": "Which type of test item is highly structured?", "o": ["Oral test", "Essay-type test", "Objective-type test", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Objective-type tests are highly structured because in them the questions and answer options are predetermined. There is no space to write the correct answer and the answer is clear; objective questions include items like true/false, right/wrong, matching and fill in the blanks.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0821", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "823", "exam": "18/05/2024 S-I", "q": "Continuous and comprehensive evaluation was started by ______.", "o": ["NCTE", "CBSE", "NCERT", "SCERT"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Continuous and comprehensive evaluation (CCE) was started by CBSE. Its aim was to make the evaluation process comprehensive and to improve the learning experience by evaluating the development of students on a continuous and comprehensive basis.", "tip": "", "status": "note", "note": "Printed key at Q310 is NCERT (d); here CBSE (b). Conflicting printed keys; each retained as printed."}, {"id": "AOT-0822", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "824", "exam": "18/05/2024 S-I", "q": "Which options are wrong in an MCQ (CCE)?", "o": ["Responses", "Answers", "Distractors", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Wrong options in a multiple-choice question (MCQ) are called 'distractors'. These options look like correct answers so that students' attention is diverted, so that the assessment of their knowledge and understanding can be done correctly.", "tip": "", "status": "note", "note": "Hindi stem reads 'MCQ mein galat vikalp hain' - rendered as 'Which options are wrong in an MCQ'."}, {"id": "AOT-0823", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "825", "exam": "24/05/2024 S-I", "q": "School-based assessment:", "o": ["Encourages teaching for testing since it involves continuous testing", "Focuses on examination techniques rather than results", "Provides students less control over what will be assessed", "Improves learning by providing constructive feedback"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main objective of school-based assessment is to improve the learning process of students. In it, continuous evaluation provides constructive feedback and learning opportunities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0824", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "826", "exam": "24/05/2024 S-I", "q": "In education, ______ is used to estimate the learning and development of students.", "o": ["Assessment", "Evaluation", "Measurement", "Diagnostic"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Assessment is a process in which information about a person or group is collected and used to evaluate them for a specific purpose or decision. It is also used to evaluate knowledge, skills and abilities, and to improve the process of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0825", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "827", "exam": "24/05/2024 S-I", "q": "What is the assessment done during the teaching-learning process called?", "o": ["Summative assessment", "Continuous assessment", "Formative assessment", "Diagnostic assessment"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The assessment done during the teaching-learning process is called 'formative assessment' or 'assessment for learning'. It helps assess the progress of students' learning and gives the teacher guidance to teach better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0826", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "828", "exam": "22/05/2024 S-I", "q": "Which element of the teaching process involves thinking about the subject matter and then transforming it in such a way that the student can respond best?", "o": ["Extensive", "Instruction", "Reflective evaluation", "Transformation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In reflective evaluation, the teacher thinks about the subject matter and changes it so that students can understand it better. It is an important part of the teaching process, through which the teacher analyses his methods and makes the students' learning process more effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0827", "ch": 9, "page": 115, "ansPage": 115, "srcNo": "829", "exam": "22/05/2024 S-I", "q": "When a teacher completes a lesson, he asks what worked and why. This is called:", "o": ["Planning", "Identification", "Teaching", "Evaluation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "When a teacher finishes a lesson and analyses what worked and why, this process is called evaluation. It shows the effectiveness of teaching and the points of improvement.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0828", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "830", "exam": "22/05/2024 S-I", "q": "The best method to evaluate students' achievements is:", "o": ["Weekly examination", "Monthly examination", "Annual examination", "Half-yearly examination"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Monthly examinations give balanced and effective evaluation, because they assess the progress of students regularly. It is a suitable option between weekly (very frequent) and annual (very rare), and helps continuous improvement.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0829", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "831", "exam": "22/05/2024 S-I", "q": "______ is used to monitor the learning process.", "o": ["Summative assessment", "Formative assessment", "Placement assessment", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Formative assessment is used to monitor the learning process. This assessment is done during teaching so that students' progress can be examined and teaching methods can be improved as required.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-048", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0830", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "832", "exam": "22/05/2024 S-I", "q": "The main objective of summative assessment is:", "o": ["To promote to the next higher class", "To give a rank to the student", "To give a grade to the student", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The objective of summative assessment is to evaluate the overall progress of students so that it can be decided whether they can be promoted to the next higher class. It may also be used for giving grades or rankings, but its main objective is promotion.", "tip": "", "status": "note", "note": "Option (d) 'all of the above' is also arguable; printed key (a) retained."}, {"id": "AOT-0831", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "833", "exam": "22/05/2024 S-I", "q": "Which of the following terms is not related to CCE?", "o": ["Continuous", "Comprehensive", "Evaluation", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The terms related to CCE (Continuous and Comprehensive Evaluation) are 'continuous', 'comprehensive' and 'evaluation'. So 'none of these' is the correct answer.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0832", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "834", "exam": "23/05/2024 S-II", "q": "What is the assessment organised before the start of teaching or instruction called?", "o": ["Initial (preliminary) assessment", "Formal assessment", "Formative assessment", "Summative assessment"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The assessment organised before the start of teaching or instruction is called initial (preliminary) assessment. Its purpose is to find out students' prior knowledge, skills and readiness, so that teaching can be adapted to their needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0833", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "835", "exam": "23/05/2024 S-II", "q": "The reliability of assessment is related to the ______ of assessment.", "o": ["Utility", "Quality", "Continuity", "Relevance"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The reliability of assessment relates to its consistency (continuity). Reliability means that an assessment tool (such as a test or evaluation) gives the same or stable result when used repeatedly in the same situations. It depends on consistency, whether between the evaluators or in different parts of the test.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0834", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "836", "exam": "23/05/2024 S-II", "q": "Projective techniques are mainly used to measure:", "o": ["Intelligence", "Knowledge", "Personality", "Achievement"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Projective techniques are mainly used to measure personality. Projective techniques are a category of psychological tests in which ambiguous stimuli (such as pictures, incomplete sentences or inkblots) are given and, based on the individual's responses, their unconscious thoughts, feelings, emotions and personality traits are analysed.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0835", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "837", "exam": "23/05/2024 S-II", "q": "Summative evaluation is done:", "o": ["In the beginning", "In the middle", "After regular intervals", "At the end"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Summative assessment is done at the end of the teaching-learning process. It evaluates students' learning at the end of the instructional period, such as final examinations or semester tests; its purpose may be grading or determining eligibility.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0836", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "838", "exam": "21/05/2024 S-I", "q": "Evaluation that monitors the progress of learning is:", "o": ["Placement evaluation", "Formative evaluation", "Diagnostic evaluation", "Summative evaluation"], "key": {"printed": [2], "verified": [1], "official": null}, "e": "The printed explanation: the evaluation that monitors the progress of learning continuously tracks students' progress and development, so that teaching methods can be improved and help given on the basis of individual needs of students.", "tip": "", "status": "disputed", "note": "Printed key letter (c) 'diagnostic', but the printed description (monitoring progress during learning) is the definition of FORMATIVE evaluation (b). Printed key retained; verified answer (b)."}, {"id": "AOT-0837", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "839", "exam": "21/05/2024 S-I", "q": "The interpretation of numerical values is called:", "o": ["Test", "Measurement", "Assessment", "Evaluation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Interpretation of numerical values is called measurement. It includes the analysis and interpretation of figures, helping us understand the reasons and relationships behind numerical values.", "tip": "", "status": "note", "note": "Printed key (b) measurement; interpretation of scores is conventionally part of evaluation. Printed key retained."}, {"id": "AOT-0838", "ch": 9, "page": 116, "ansPage": 116, "srcNo": "840", "exam": "21/05/2024 S-I", "q": "Which assessment technique is focused on measuring student achievement relative to their own progress and development?", "o": ["Formative assessment", "Summative assessment", "Diagnostic assessment", "Criterion-referenced assessment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "As printed: the assessment technique focused on measuring students' achievement relative to their own progress and development is criterion-referenced assessment, which measures students' achievement against pre-determined criteria or standards.", "tip": "", "status": "note", "note": "The description in the stem matches ipsative (self-referenced) assessment, not criterion-referenced; printed key (d) retained, flagged for review."}, {"id": "AOT-0839", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "841", "exam": "25/05/2024 S-I", "q": "The purpose of evaluation is to make decisions about the educational ______.", "o": ["Quantity", "Quality", "Time period", "Age"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main objective of evaluation is to make decisions about the quality of the educational process and outcomes. It involves examining how effective the teaching-learning process has been, how much the student has learnt, where improvement can be made and how effective the educational programmes are. It is not limited only to quantity but also examines how and how well the student learnt.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0840", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "842", "exam": "25/05/2024 S-I", "q": "Which assessment technique is focused on identifying students' strengths, weaknesses and learning needs?", "o": ["Formative assessment", "Summative assessment", "Diagnostic assessment", "Criterion-referenced assessment"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Diagnostic assessment focuses on identifying the difficulties of students' learning, the reasons for errors and specific learning needs. Its aim is to know where students are struggling so that appropriate remedial instruction can be given; it also helps identify students' strengths.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0841", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "843", "exam": "25/05/2024 S-I", "q": "What is the purpose of evaluation?", "o": ["To measure students' achievement", "To test students in a subject", "To give marks or grades to a student", "To make decisions about the quality of something"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The purpose of evaluation is to measure students' achievement. Evaluation is the process of determining the progress and learning of a student; it includes collecting data about their performance and using it to determine the level of their achievement against specific educational objectives.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-049", "first": true, "kind": "near", "of": null, "keyConflict": true}}, {"id": "AOT-0842", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "844", "exam": "25/05/2024 S-I", "q": "If students create a model to show how something works, they are:", "o": ["Evaluating", "Applying", "Synthesising", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When students make a model to show how something works, they apply their theoretical knowledge or understanding to a real-world situation. They use their knowledge to create something to explain. According to Bloom's classification this falls at the 'application' level, where knowledge and understanding are used in a new, concrete situation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0843", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "845", "exam": "19/05/2024 S-I", "q": "A quantitative description of the performance of the student is limited to:", "o": ["Test", "Measurement", "Assessment", "Evaluation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Measurement is the process of showing student performance in numbers (quantitatively). It shows the amount of learning through marks or scores of a test, and focuses only on facts and results, not on students' thinking or behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0844", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "846", "exam": "19/05/2024 S-I", "q": "Self-assessment is known as:", "o": ["Formative assessment", "Summative assessment", "Assessment of achievement", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Formative assessment is a process in which students themselves evaluate their own learning, skills and performance. It encourages self-reflection and helps students understand their strengths and weaknesses, which develops a sense of responsibility for learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0845", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "847", "exam": "19/05/2024 S-I", "q": "Summative assessment is mainly used:", "o": ["During the programme", "At all times", "At the end of the programme", "At the beginning of the programme"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Summative assessment is mainly used at the end of the programme. Its aim is to evaluate the learning of students at the end of any course period or learning unit, such as at the end of a course or chapter; it is not done to improve the learning process but to measure the overall achievement and understanding of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0846", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "848", "exam": "19/05/2024 S-I", "q": "Teachers can use assessment for learning and assessment of learning both for:", "o": ["Knowing the progress and achievement of students", "Knowing the learning needs of children and selecting a teaching strategy accordingly", "Assessing the performance of children at periodic intervals and certifying their performance", "Monitoring the progress of children and setting appropriate goals to fill the gap in learning"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teachers can use both assessment for learning and assessment of learning to find out the learning needs of students and, on this basis, choose appropriate teaching strategies. Assessment of learning measures the achievement of the student and grades him.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0847", "ch": 9, "page": 117, "ansPage": 117, "srcNo": "849", "exam": "19/05/2024 S-I", "q": "'First, the students will predict what will happen in the story. Then students will make a list of the main events of the story. Finally, I will write a review of the story.' Which skills are being used?", "o": ["Application, synthesis and evaluation", "Comprehension, knowledge and analysis", "Comprehension, knowledge and evaluation", "Evaluation, knowledge and synthesis"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In the question given, Bloom's classification has been used through comprehension, knowledge and evaluation skills. Comprehension is the ability to understand; knowledge is the collection of facts and information; evaluation is the process of measuring understanding of knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0848", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "850", "exam": "19/05/2024 S-I", "q": "Understanding the meaning of 'matter' (dravya) is related to:", "o": ["Comprehension", "Application", "Knowledge", "Synthesis"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Comprehension means understanding a subject and being able to interpret it. When students understand the meaning of 'matter', they are not merely remembering facts but gaining an understanding of its nature and use. This is an example of the cognitive domain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0849", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "851", "exam": "09/06/2024 S-II", "q": "What is the purpose of evaluation?", "o": ["Decision", "Prediction", "Determination of value/quality", "Opinion"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The main purpose of evaluation is to determine the value or quality of something or some process. In evaluation, an object, person or process is assessed and then a decision is made about its characteristics, qualities or value.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-049", "first": false, "kind": "near", "of": "AOT-0841", "keyConflict": true}}, {"id": "AOT-0850", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "852", "exam": "09/06/2024 S-II", "q": "Which tool is used for a behaviour sample?", "o": ["Evaluation", "Assessment", "Measurement", "Test"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A test tool is used for a behaviour sample. As a measuring tool, a test is used to examine behaviour, related to the product of behaviour; there are many types of tests used in education to facilitate achieving different educational objectives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0851", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "853", "exam": "09/06/2024 S-II", "q": "At the highest level of the hierarchy is:", "o": ["Comprehension", "Application", "Evaluation", "Synthesis"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "At the highest level of the hierarchy in Bloom's classification is evaluation. The cognitive hierarchy is divided into six levels: knowledge, comprehension, application, analysis, synthesis and evaluation; evaluation, analysis and synthesis are higher-order cognitive skills.", "tip": "", "status": "note", "note": "Valid for the original taxonomy (Q297, Q215).", "dup": {"group": "DUP-020", "first": false, "kind": "near", "of": "AOT-0297"}}, {"id": "AOT-0852", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "854", "exam": "09/06/2024 S-II", "q": "The process of determining the value of anything is:", "o": ["Examination", "Measurement", "Assessment", "Evaluation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The process of value determination of anything is evaluation. Evaluation means determining the value of something. 'Assessment' means estimating the quality, importance or value of something; it is a part of the process of value determination.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0853", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "855", "exam": "27/05/2024 S-I", "q": "Assessment is ______ if it gives the same results with the same students consistently.", "o": ["Valid", "Invalid", "Reliable", "Unreliable"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Assessment or evaluation is 'reliable' if it gives the same result repeatedly when the same test or evaluation is applied to the same students under the same conditions. Validity means the assessment measures what it is designed to measure; here consistency is being asked, so reliable is correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0854", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "856", "exam": "27/05/2024 S-I", "q": "Which best describes formative assessment?", "o": ["Assessing students at the end of a teaching unit", "Assessing students during learning", "Assessing the overall performance of students", "Assessing the long-term retention of students' knowledge"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Formative assessment is done during learning. Its main aim is to monitor students' progress, identify their weaknesses and strengths, and provide immediate feedback for improvement in the learning process. It differs from summative assessment, which is done at the end of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0855", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "857", "exam": "27/05/2024 S-I", "q": "In which assessment technique do students work together to solve a problem or complete a task?", "o": ["Formative assessment", "Summative assessment", "Collaborative assessment", "Group assessment"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Collaborative assessment is a method in which students work together to complete a task or solve a problem. It assesses their collective working skills and their ability to learn from one another.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0856", "ch": 9, "page": 118, "ansPage": 118, "srcNo": "858", "exam": "26/02/2020 S-II", "q": "Which type of evaluation is used to monitor the learning process?", "o": ["Summative evaluation", "Diagnostic evaluation", "Formative evaluation", "Placement evaluation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Formative evaluation is used for monitoring the process of learning. It provides continuous feedback during learning so that teachers and students can know which areas need improvement; its main aim is to improve learning and teaching, not just to give grades.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0857", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "859", "exam": "26/05/2024 S-II", "q": "Which type of question gives more reliable marking?", "o": ["Multiple-choice questions", "Essay", "Short answer", "Matching"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Marking in multiple-choice questions is more reliable, because in these questions students choose the correct answer from the options given. The chance of personal bias and subjectivity in marking is reduced.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0858", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "860", "exam": "26/05/2024 S-II", "q": "Objectives related to higher-order thinking are:", "o": ["Knowledge and comprehension", "Analysis and evaluation", "Comprehension and application", "Knowledge and analysis"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The objectives related to higher-order thinking are analysis and evaluation. Both skills fall under the higher levels of Bloom's classification. Analysis: dividing information into parts and understanding the relations between them. Evaluation: judging the quality and usefulness of information.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0859", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "861", "exam": "19/06/2024", "q": "Limited to the quantitative description of the pupil's performance is:", "o": ["Test", "Measurement", "Assessment", "Evaluation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Limited to quantitative description of the student's performance is measurement. Measurement is a specific process through which any teaching experience, event or context is converted into numerical form; it concerns the quantitative description of a student's performance (scores, marks) and does not interpret the results, unlike evaluation, which includes qualitative decisions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0860", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "862", "exam": "19/06/2024", "q": "Assessment for learning occurs:", "o": ["At the end of the unit", "Before the teaching-learning process", "Throughout the learning process", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Assessment for learning occurs throughout the learning and teaching process, not just at the end of a unit. It is an approach that gives students feedback to improve their learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0861", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "863", "exam": "19/06/2024", "q": "An ongoing dialogue between the teacher and the student during the learning process is a characteristic of:", "o": ["Formative assessment", "Summative assessment", "Diagnostic assessment", "Norm-referenced assessment"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The ongoing dialogue between teacher and student during the learning process is a characteristic of formative assessment. Its goal is to monitor students' learning so that continuous feedback can be given, which can be used by teachers to improve their teaching and by students to improve their learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0862", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "864", "exam": "19/06/2024", "q": "To put ideas together to form a new whole is:", "o": ["Evaluation", "Synthesis", "Analysis", "Application"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Putting ideas together to prepare a new form is called synthesis. Synthesis means the process of combining different ideas, concepts or pieces of information to make something new and more meaningful. In Bloom's classification, synthesis is the highest level of cognitive learning, representing the ability to create something new and original on the basis of existing knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0863", "ch": 9, "page": 119, "ansPage": 119, "srcNo": "865", "exam": "19/06/2024", "q": "In which phase of teaching is the knowledge which is given to the student evaluated?", "o": ["Interactive phase", "Post-active phase", "Pre-active and interactive phases", "Pre-active phase"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the post-active phase of teaching, the knowledge given to the student is evaluated. This phase also includes evaluating the students' understanding and giving feedback to both teacher and students to improve teaching and learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0864", "ch": 9, "page": 119, "ansPage": 120, "srcNo": "866", "exam": "29/05/2024 S-I", "q": "Assessment is both quantitative and ______ process.", "o": ["Powerful", "Right", "Quantitative", "Qualitative"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Assessment is both a quantitative and qualitative process. Quantitative evaluation: evaluating a person or thing using numbers and data, e.g. marks in an exam. Qualitative evaluation: evaluating a person or thing using descriptive statements and interpretations, e.g. the quality of a student's essay.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0865", "ch": 9, "page": 120, "ansPage": 120, "srcNo": "867", "exam": "29/05/2024 S-I", "q": "The four types of assessment or evaluation are formative assessment, summative assessment, continuous assessment and ______.", "o": ["Quantitative assessment", "Qualitative assessment", "Weekly assessment", "Diagnostic assessment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "There are four main types of assessment: 1. diagnostic assessment (to know students' prior knowledge, skills and weaknesses); 2. formative assessment (during the teaching-learning process to monitor progress and understanding); 3. summative assessment (at the end of a specified period such as a semester or year to assess total understanding); 4. outcome evaluation (evaluating the results of a project or programme).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0866", "ch": 9, "page": 120, "ansPage": 120, "srcNo": "868", "exam": "29/05/2024 S-I", "q": "Which of them is an advantage of formative evaluation?", "o": ["Provides a comprehensive view of students' performance", "Guides instructional decisions and interventions", "Allows for comparison among students", "Measures long-term retention of knowledge"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Formative evaluation guides instructional decisions and interventions. It helps students track their progress and identify their weaknesses, and also guides them to improve their learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0867", "ch": 9, "page": 120, "ansPage": 120, "srcNo": "869", "exam": "29/05/2024 S-I", "q": "The difficulty with evaluation is that it is often confused with assessment. Assessments are used as ______.", "o": ["Teaching aids", "Tools for evaluation", "Teaching methods", "Guidelines"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Assessment is used as a tool for evaluation. Assessment is an important part of the evaluation process, which helps improve the process of learning and teaching. Assessment helps achieve the objectives of learning, improving and perfecting the process of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0868", "ch": 9, "page": 120, "ansPage": 120, "srcNo": "870", "exam": "29/05/2024 S-I", "q": "Looking at primary or secondary sources to construct a timeline is an example of:", "o": ["Evaluate", "Elaborate", "Engage", "Explore"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Looking at primary and secondary sources to make a timeline is an example of 'exploring'. Evaluation means examining something and determining its quality, importance or value; exploring means investigating something, going to a place or finding out about a subject; looking at primary and secondary sources to make a timeline is certainly an example of exploration.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0869", "ch": 9, "page": 120, "ansPage": 120, "srcNo": "871", "exam": "29/05/2024 S-I", "q": "A student can design a laboratory according to certain specifications. In which category of objective does this fall?", "o": ["Analysis", "Synthesis", "Evaluation", "Knowledge"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A student can design a laboratory according to the specifications under the objective of synthesis. Synthesis is a higher-order cognitive skill which enables students to create something new by combining separate parts; in designing a laboratory the student can combine different tools and materials, conduct an experiment and draw conclusions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0870", "ch": 9, "page": 120, "ansPage": 120, "srcNo": "872", "exam": "16/06/2024 S-III", "q": "A teacher uses a rubric to assess students' written essays. This is an example of:", "o": ["Formative assessment", "Summative assessment", "Performance assessment", "Analytical assessment"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "When a teacher uses a rubric to evaluate students' essays, it is an example of formative assessment, which is conducted to improve students' progress and give better guidance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0871", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "873", "exam": "16/06/2024 S-III", "q": "In MCQs, the statement of the problem is:", "o": ["Option", "Distractor", "Premise", "Stem"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The statement of the problem in MCQ is called the 'stem'. The stem is the part in which the question or problem is presented; it is the main statement on which the correct answer is chosen from the options.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0872", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "874", "exam": "16/06/2024 S-III", "q": "Evaluation used to improve the contents after curriculum development is:", "o": ["Summative evaluation", "Formative evaluation", "Diagnostic evaluation", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The evaluation used for improving the contents after curriculum development is 'summative evaluation'. It is done at the end of a programme or teaching process, and its main aim is to assess the effectiveness of the entire process. Its results are used to make important decisions such as continuing or discontinuing future curriculum improvements or programmes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0873", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "875", "exam": "16/06/2024 S-III", "q": "Which one of the following will happen if the answer booklet is evaluated by another teacher than the teacher who teaches?", "o": ["Students will get fewer marks", "Students will know their actual knowledge level", "Students will develop more confidence", "Students will not be given unjust and partial treatment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If the answer booklet is evaluated by a teacher other than the teaching teacher, students will not face unfair and partial behaviour, since the evaluator is not under any pressure of personal bias towards students. This helps measure the students' real knowledge level. Same as Q741.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-046", "first": false, "kind": "exact", "of": "AOT-0739"}}, {"id": "AOT-0874", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "876", "exam": "18/05/2024 S-III", "q": "Absolute grading is otherwise known as:", "o": ["Norm-referenced grading", "Criterion-referenced grading", "Standard grading", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In absolute grading the evaluation of student performance is done on the basis of pre-determined standards (such as an 'A' grade on more than 90% marks). It does not depend on the performance of other students but is based on certain fixed criteria, so it is called criterion-referenced grading.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0875", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "877", "exam": "18/05/2024 S-III", "q": "Which of the following is NOT an informal assessment?", "o": ["Observation", "Project", "Rubrics", "Participation"], "key": {"printed": [3], "verified": [1], "official": null}, "e": "The printed explanation says participation is an informal evaluation process in which the student's activity, cooperation and presence in class activities are observed, not based on a set criterion; whereas observation, rubrics, etc. are formal.", "tip": "", "status": "disputed", "note": "Printed key (d) contradicts the printed explanation (participation = informal). The same question at Q879 gives key (b) Project, which is the verified answer. Printed key retained; verified answer (b).", "dup": {"group": "DUP-050", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "AOT-0876", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "878", "exam": "18/05/2024 S-III", "q": "Relative grading is otherwise known as:", "o": ["Criterion-referenced grading", "Norm-referenced grading", "Standard grading", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Relative grading or norm-referenced grading is the process of ranking and giving grades to students according to their relative level of achievement in a specific group. In this method of grading, a fixed ratio of students is assumed at different grade points, and students are honoured with a special grade on the basis of their relative performance.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-051", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0877", "ch": 9, "page": 121, "ansPage": 121, "srcNo": "879", "exam": "14/06/2024 S-III", "q": "Which of the following is NOT an informal assessment?", "o": ["Observation", "Project", "Rubrics", "Participation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Informal assessment is a continuous method of measuring students' understanding during the teaching-learning process. Of the given options, a project is not an informal assessment: projects are generally more structured and often formal assessment methods with specific criteria and grading systems, while observation, rubrics and participation are more informal.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-050", "first": false, "kind": "exact", "of": "AOT-0875", "keyConflict": true}}, {"id": "AOT-0878", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "880", "exam": "14/06/2024 S-III", "q": "A scoring guide used to evaluate the quality of student work is known as:", "o": ["Rubrics", "Checklists", "Inventories", "Rating scales"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Rubrics are scoring guides used to evaluate the quality of students' work. They state detailed criteria on which a task or performance is assessed, making the evaluation process clearer, fair and transparent.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0879", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "881", "exam": "14/06/2024 S-III", "q": "The least in scope is:", "o": ["Test", "Measurement", "Assessment", "Evaluation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A test has the least scope, being the most limited process, which examines only a specific knowledge or skill, whereas measurement, assessment and evaluation are respectively broader. So the scope of a test is the smallest.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0880", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "882", "exam": "19/05/2024 S-III", "q": "Supply-type questions are also known as:", "o": ["Recall type", "Recognition type", "Both recall and recognition type", "None of these"], "key": {"printed": [2], "verified": [0], "official": null}, "e": "As printed: supply-type questions are also known as both recall and recognition type. Answering these questions involves both recalling information and recognising the correct answer.", "tip": "", "status": "disputed", "note": "Standard classification: supply-type (free-response) items are RECALL type (a); selection-type items are recognition type. Printed key (c) retained; verified answer (a)."}, {"id": "AOT-0881", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "883", "exam": "19/05/2024 S-III", "q": "Relative grading is otherwise known as:", "o": ["Criterion-referenced grading", "Norm-referenced grading", "Standard grading", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Relative grading is known as norm-referenced grading, in which students' performance is evaluated relative to other students of the group.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-051", "first": false, "kind": "exact", "of": "AOT-0876"}}, {"id": "AOT-0882", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "884", "exam": "19/05/2024 S-III", "q": "The process of selecting units from a population to estimate the characteristics of the population is called:", "o": ["Analysing", "Inference", "Research", "Sampling"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The process of selecting units from the population in order to estimate the characteristics of the population is called sampling. It is an important method in research where, instead of studying the whole population, a small representative section (sample) is studied.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0883", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "885", "exam": "19/05/2024 S-III", "q": "For facilitating learning, the teacher must encourage:", "o": ["Lecture", "Question and answer session", "Extra class", "Work experience"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "To facilitate learning, the teacher should encourage question-and-answer sessions. This helps students clear their doubts and understand concepts better, making learning more interactive and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0884", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "886", "exam": "05/09/2023 S-III", "q": "In the current examination system, objectives of which domain are mainly evaluated?", "o": ["Affective domain", "Cognitive domain", "Psychomotor domain", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the current examination system the objectives of the cognitive domain are mainly evaluated. In the field of education, 'cognitive' relates to knowledge, understanding, stability and the development of skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0885", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "887", "exam": "05/09/2023 S-III", "q": "The process of quantitative decision is ______.", "o": ["Evaluation", "Measurement", "Assessment", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The process of quantitative decision is measurement. In the process of quantitative decision, the person or group making decisions on various items according to any problem or opportunity analyses to make the best decision.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0886", "ch": 9, "page": 122, "ansPage": 122, "srcNo": "888", "exam": "08/09/2023 S-I", "q": "The outline of subject matter is:", "o": ["Curriculum", "Syllabus", "Lesson", "Unit"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The syllabus is the outline of subject matter. The syllabus is a means that connects the student and the teacher with each other. The curriculum is a programme to be run to reach a fixed goal, where education is seen as a race.", "tip": "", "status": "note", "note": "Hindi option (a) 'pathcharya' (curriculum) and (b) 'pathyakram' (syllabus); answer (b) = syllabus."}, {"id": "AOT-0887", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "889", "exam": "05/09/2023 S-III", "q": "Which type of evaluation is used for ranking in the class?", "o": ["Criterion-referenced evaluation", "External examination", "Norm-referenced evaluation", "Constructive examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Norm-referenced evaluation is used for ranking in a class. In this type of evaluation, student performance is measured against predetermined norms or benchmarks. It helps in understanding the knowledge and skill levels of students and gives them a particular rank.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0888", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "890", "exam": "05/09/2023 S-I", "q": "What is the main purpose of summative evaluation?", "o": ["To promote students to the next class", "To understand the difficulty of learning", "To improve the learning process", "To improve students' learning process"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The objective of summative evaluation is to measure the overall achievement of a student or group at the end of a curriculum or programme. It provides educational institutions with valuable information about the success of their teaching methods and curriculum design; hence the purpose of this evaluation is classification and promotion of students.", "tip": "", "status": "note", "note": "Options (c) and (d) are near-identical in the source."}, {"id": "AOT-0889", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "891", "exam": "13/09/2023 S-I", "q": "The evaluation process is related to:", "o": ["The whole learning process", "Examination", "Investigation", "Measurement"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The whole learning process is included in the process of evaluation. The purpose of evaluation is to achieve the objectives of the entire learning process, and both teacher and student give feedback to each other about the student's progress.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-052", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0890", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "892", "exam": "13/09/2023 S-I", "q": "Which of the following is NOT a tool of evaluation?", "o": ["Rating scale", "Project report", "Checklist", "Cumulative record"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A project report does not work as a tool in evaluation. Common tools of evaluation include checklists, numerical rating scales, questionnaires, interviews and direct observation. Through these students can know their educational progress, which creates motivation, self-satisfaction and confidence.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-053", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0891", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "893", "exam": "13/09/2023 S-I", "q": "A portfolio is a tool:", "o": ["Collection of students' work over a period of time", "Collection of students' marks over a period of time", "Collection of students' grades over a period of time", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A portfolio is a tool which keeps a collection of students' work over a period of time. It is an organised collection of evidence used by teacher and student to monitor the development of the student's knowledge, skills and attitudes in a specific subject area.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-054", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0892", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "894", "exam": "08/09/2023 S-II", "q": "The most important advantage of a true-false test is:", "o": ["Eradication of guessing", "Wide sampling", "Item validity", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The most significant advantage of a true-false test is wide sampling, in which less time is needed and more subject matter can be covered.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0893", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "895", "exam": "08/09/2023 S-II", "q": "If the difficulty index of an item is 5%, it is:", "o": ["Difficult", "Very easy", "Easy", "Acceptable"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The difficulty index shows how difficult or easy a question is, indicating the percentage of people who answered correctly. If the difficulty index is 5%, only 5% of people answered correctly, which shows that the question is quite difficult.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0894", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "896", "exam": "08/09/2023 S-II", "q": "Marking and reporting systems commonly are of the type:", "o": ["Letter to parents", "Traditional marking system", "Pass-fail system", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Types of marking and reporting systems: letters to parents (informing parents about the student's progress and behaviour); traditional marking system (marks given for tests and assignments); pass-fail system (students placed in pass or fail). All the institutions and education systems use these three types.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0895", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "897", "exam": "08/09/2023 S-II", "q": "Measurement basically is:", "o": ["Quantitative value", "Qualitative value", "Value judgement", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Measurement is basically a quantitative value, that part of evaluation which is expressed in quantity, scores, mean, percentage and average. Measurement expresses students' progress in numbers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0896", "ch": 9, "page": 123, "ansPage": 123, "srcNo": "898", "exam": "08/09/2023 S-II", "q": "Basically, evaluation is:", "o": ["Qualitative value", "Quantitative value", "Value judgement", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Basically evaluation means to assess value. Through evaluation we collect all information about any process and its results and analyse it. Value judgement is a continuous process closely related to educational objectives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0897", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "899", "exam": "08/09/2023 S-II", "q": "The score of a student in a paper is:", "o": ["Evaluation", "Test", "Measure", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The score of a student in a paper is used for evaluation, test and measurement; all three indicate the student's score. Evaluation is an important part of the teaching-learning process which assesses the achievement and understanding of students; test and measurement are its parts.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0898", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "900", "exam": "08/09/2023 S-II", "q": "A test generally answers the question:", "o": ["How good is it", "How well", "How much", "None of the above"], "key": {"printed": [3], "verified": [2], "official": null}, "e": "As printed: a test generally measures how much knowledge a person has acquired in a specific subject or area and how well he can use that knowledge; it examines the logical thinking of a person by asking different kinds of questions.", "tip": "", "status": "disputed", "note": "Printed key (d) 'none of the above' is inconsistent with the standard view that a test answers 'how much?' (c) (measurement). The printed explanation is also muddled. Printed key retained; verified answer (c)."}, {"id": "AOT-0899", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "901", "exam": "08/09/2023 S-II", "q": "______ is used to monitor the learning process.", "o": ["Summative evaluation", "Formative evaluation", "Placement evaluation", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Formative evaluation is used to monitor the learning process. It is a type of evaluation used during the learning and teaching process to see the student's progress, and is used to identify students who need additional help. Same as Q831.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-048", "first": false, "kind": "near", "of": "AOT-0829"}}, {"id": "AOT-0900", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "902", "exam": "08/09/2023 S-II", "q": "Which scale is used for measuring attitude?", "o": ["Projective scale", "Likert scale", "General scale", "Technical scale"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The Likert scale is used for attitude measurement. The Likert scale is a graded scale often used to measure the attitudes or feelings of individuals.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0901", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "903", "exam": "08/09/2023 S-II", "q": "An aptitude test is used to measure:", "o": ["Present achievement", "Attained ability (proficiency)", "Potential ability", "Total mental ability"], "key": {"printed": [1], "verified": [2], "official": null}, "e": "As printed: an aptitude test is used to measure the ability acquired; it is used to predict success in future learning activities or in a profession.", "tip": "", "status": "disputed", "note": "By standard definition an aptitude test measures potential ability (c). The printed key (b) 'योग्यता प्राप्ति की' is ambiguous. Printed key retained; verified answer (c)."}, {"id": "AOT-0902", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "904", "exam": "08/09/2023 S-II", "q": "For ensuring the achievement of specific objectives, the following is used:", "o": ["Blackboard work", "Objective statement", "Revision", "Evaluation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Evaluation is used for ensuring the achievement of specific objectives. This helps the teacher in selecting the subject matter and teaching-learning material, and helps teachers evaluate their teaching methods so that they can achieve the objectives of the lesson effectively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0903", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "905", "exam": "08/09/2023 S-II", "q": "The teaching point in a lesson plan is mentioned in:", "o": ["The first row", "The second row", "The third row", "The fourth row"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teaching point in a lesson plan is mentioned in the first row. It also includes the specific objectives, the activities of teaching and the supporting material in full detail.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0904", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "906", "exam": "08/09/2023 S-II", "q": "In which type of test is item analysis necessary?", "o": ["Standardised test", "Teacher-made test", "Both A and B", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Item analysis is necessary where detailed information and understanding are needed. It includes standardised tests, in which the analytical capacity of tests can be tested.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0905", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "907", "exam": "08/09/2023 S-II", "q": "In which type of test is the performance of students compared with other students?", "o": ["Objective-referenced test", "Norm-referenced test", "Criterion-referenced test", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The test in which the performance of students is compared with other students is called a norm-referenced test. In it, the performance of a student is measured by comparing it with the performance of students of the same age on the same assessment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0906", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "908", "exam": "08/09/2023 S-II", "q": "A planned interview is called:", "o": ["Structured interview", "Focused interview", "Panel interview", "Group interview"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A planned interview is called a structured interview, in which the interviewer and interviewee sit face to face and discuss orally; its aim is to obtain specific information.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0907", "ch": 9, "page": 124, "ansPage": 124, "srcNo": "909", "exam": "08/09/2023 S-II", "q": "In which interview method does the discussion focus on one method?", "o": ["Structured interview", "Focused interview", "Panel interview", "Group interview"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The interview method in which the discussion focuses on a specific topic or method is called a focused interview. In it the interviewer asks questions focusing particularly on a fixed subject or method and limits the discussion around it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0908", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "910", "exam": "08/09/2023 S-I", "q": "The type of the matric examination conducted by the Bihar School Examination Board is:", "o": ["External examination", "Criterion-referenced test", "Summative evaluation", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The matric examination conducted by the Bihar School Examination Board is an external examination, a criterion-referenced test and a summative evaluation. A criterion-referenced exam examines how close a student is to achieving a specific standard; summative evaluation is done at the end of a session.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0909", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "911", "exam": "08/09/2023 S-I", "q": "The grading system is what type of evaluation?", "o": ["Absolute evaluation", "Relative evaluation", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The grading system is of both absolute and relative types. In the absolute grading system, grades are given on the basis of predetermined cut-off levels; in relative grading, student marks fluctuate to see how they performed compared to others in the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0910", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "912", "exam": "08/09/2023 S-I", "q": "Which of the following is NOT present in a good evaluation?", "o": ["Validity", "Reliability", "Objectivity", "Subjectivity"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A good evaluation does not have subjectivity. A good evaluation has the following qualities: objectivity, validity, reliability, comprehensiveness, discriminating power, utility and practicability.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0911", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "913", "exam": "10/09/2023 S-I", "q": "Evaluation is a:", "o": ["Continuous process", "Periodic process", "Half-yearly process", "Annual process"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Evaluation is the process of assessing the performance of someone in a specific area. It is done with the help of examination and measurement. Evaluation is a continuous process and goes on throughout life. Evaluation = quantitative description (measurement) + qualitative description (non-measurement) + value judgement.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0912", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "914", "exam": "10/09/2023 S-I", "q": "The comprehensive process of assessing/counting is:", "o": ["Assessment", "Measurement", "Evaluation", "Examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The comprehensive process of assessing is evaluation. A teacher evaluates students' performance to analyse, estimate and measure the level of student achievement; thus evaluation is the process of collecting and interpreting evidence about the changes brought in students' behaviour by the school.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0913", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "915", "exam": "10/09/2023 S-I", "q": "Summative evaluation is what type of test?", "o": ["Teacher-made test", "External test", "Internal test", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Summative evaluation is the overall evaluation done after the completion of the course. Through it we know to what extent the purposes of teaching have been served. Hence summative evaluation is a teacher-made test, an external test and an internal test.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0914", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "916", "exam": "13/09/2023 S-I", "q": "A good evaluation has:", "o": ["Subjectivity", "Validity", "Bias", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Evaluation is the process on the basis of which the teacher assesses a student's knowledge. Through evaluation, the student's deficiencies in a subject, interest in a subject and talent are evaluated. In a good evaluation, objectivity, validity and reliability work as essential qualities.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-055", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0915", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "917", "exam": "13/09/2023 S-I", "q": "Which of the following is NOT a type of evaluation?", "o": ["Formative", "Debate", "Summative", "CCE"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Evaluation is an integral part of any teaching and learning process. Formative, summative and CCE (continuous and comprehensive evaluation) are all types of evaluation, while 'debate' is not a type of evaluation but a teaching method.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-056", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0916", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "918", "exam": "13/09/2023 S-I", "q": "Evaluation is related to:", "o": ["Subject", "Learning process", "Objective", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Evaluation is done to assess the performance of someone in a given area. It appears as a major component in education. Under evaluation, subject, learning process and objective all come, with the help of which students are evaluated.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-057", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0917", "ch": 9, "page": 125, "ansPage": 125, "srcNo": "919", "exam": "13/09/2023 S-I", "q": "The evaluation process is related to:", "o": ["The whole learning process", "Examination", "Investigation", "Measurement"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The process of evaluation includes the whole learning process. The purpose of evaluation is to achieve the objectives of the entire learning, and both teacher and student give feedback on the student's progress.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-052", "first": false, "kind": "exact", "of": "AOT-0889"}}, {"id": "AOT-0918", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "920", "exam": "13/09/2023 S-I", "q": "Which of the following is NOT a tool of evaluation?", "o": ["Rating scale", "Project report", "Checklist", "Cumulative record"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A project report does not work as a tool in evaluation. The common formats of evaluation tools include checklists, numerical rating scales, questionnaires, interviews and direct observation; by these students get to know their educational progress, creating motivation, self-satisfaction and confidence. Same as Q892.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-053", "first": false, "kind": "exact", "of": "AOT-0890"}}, {"id": "AOT-0919", "ch": 9, "page": 126, "ansPage": 126, "srcNo": "921", "exam": "13/09/2023 S-I", "q": "What is the main goal of assessm
