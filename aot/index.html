ns like Mesopotamia and Egypt developed complex administrative systems, involving irrigation, tax collection and large construction works; this organised administration is the earliest evidence and became the basis of modern governance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0687", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "687", "exam": "26/05/2024 S-II", "q": "The purpose of a textbook is to provide:", "o": ["Teaching material based on the curriculum for a learner", "A material for teachers to base teaching on", "Material that forms the basis of and material for examination", "Reading and reference material for teachers"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main purpose of a textbook is to provide a student with curriculum-based teaching material. A textbook is prepared according to the prescribed curriculum and presents subject matter in an organised way, and includes information on topics as well as examples, pictures and questions-answers as per curriculum needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0688", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "688", "exam": "16/06/2024 S-III", "q": "The book 'Library Administration' was brought out by Ranganathan in:", "o": ["1925", "1933", "1931", "1935"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The book 'Library Administration' by Ranganathan was published in 1935. The book is an important treatise on the principles of library administration, in which broad guidelines have been given for the smooth running of libraries.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0689", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "689", "exam": "18/05/2024 S-III", "q": "Which of the following is a tertiary source of information?", "o": ["Journal", "Bibliography", "Encyclopaedia", "Bibliography of bibliographies"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Tertiary sources are those based on primary (original research) and secondary (analysis/compilation) sources. They present information in a summarised or list form; examples: guidebooks, indexes, directories, and 'bibliography of bibliographies'. A 'bibliography of bibliographies' is a pure tertiary source because it compiles secondary sources (bibliographies) themselves.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0690", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "690", "exam": "14/06/2024 S-III", "q": "The physical condition of the books should be properly maintained. This is known as:", "o": ["Collation", "Conservation", "Shelf arrangement", "Any of them"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Maintaining the physical condition of books is called conservation. It is an important process of the library which increases the age of books and keeps them safe for the use of readers. Conservation protects the wealth of knowledge and keeps it available.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-042", "first": false, "kind": "near", "of": "AOT-0677"}}, {"id": "AOT-0691", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "691", "exam": "19/05/2024 S-III", "q": "Now 'DELNET' stands for:", "o": ["Delhi Library Network", "Developing Library Network", "Distance Library Network", "Digital Libraries Network"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "DELNET stands for 'Developing Library Network'. It is a network that connects libraries and shares resources with each other.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0692", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "692", "exam": "19/05/2024 S-III", "q": "Which of the following is not a quality of a good story?", "o": ["A story should have good morals, where good behaviour is rewarded and evil deed is punished", "A story which has many characters creates much excitement", "Stories should be committed with the present scenario of children", "After finishing the story some related questions must be asked to the student"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "It is not a quality of a good story that it has many characters and creates much excitement. Too many characters make the story complex and hard for the reader to understand; in a good story the number of characters should be balanced according to the need of the story, not just for thrill.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0693", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "693", "exam": "05/09/2023 S-III", "q": "The university library budget is passed by:", "o": ["Senate", "Executive Council", "Research Council", "Academic Council"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The Executive Council has the right to pass the library budget. It is responsible for the administration of the university and usually includes the Vice-Chancellor, Pro-Vice-Chancellor, Registrar and other senior officials.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0694", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "694", "exam": "05/09/2023 S-III", "q": "The objective of a textbook should be:", "o": ["To guide the teaching and learning of the curriculum in a particular subject", "To reduce the ability to think", "Both A and B", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A textbook guides the teaching and learning of the curriculum in a particular subject, by which a self-study system develops among students. The objective of a textbook is not to reduce the ability to think but to increase it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0695", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "695", "exam": "05/09/2023 S-I", "q": "The person working in a library is called:", "o": ["Librarian", "Actor", "Musician", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The person who works in a library (pustakalaya) is called a librarian. A librarian manages the collection of books.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0696", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "696", "exam": "05/09/2023 S-I", "q": "Children need books:", "o": ["To develop critical thinking skills", "To understand themselves", "Both A and B", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Children should read books so that their critical thinking skills can develop and they can understand themselves. Books are very important for human life: not only do they give us knowledge and information, but they teach us how we want to live and how to fulfil our duty in society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0697", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "697", "exam": "13/09/2023 S-I; 09/09/2023 S-I; 10/09/2023 S-I", "q": "A library is a place where:", "o": ["Many books are kept", "Many toys are kept", "Many clothes are kept", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A library is a place where many types of books are kept. A library collects various types of educational materials, such as books, magazines, maps, manuscripts, gramophone/audio units and readable material; it attracts people to read and develops the habit of reading and expands their knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0698", "ch": 7, "page": 97, "ansPage": 97, "srcNo": "698", "exam": "13/09/2023 S-I; 10/09/2023 S-I", "q": "Which one of the following is a type of book?", "o": ["General textbook", "Reference book", "Both A and B", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Hollqvist, 'a textbook is the well-organised, written form of thought and knowledge for teaching activities and intentions.' A general textbook contains extensive information about a subject or curriculum, needed by students during their educational years; a reference book contains information on important subjects, particularly well-organised, reliable and authentic, and can be found in various forms.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0699", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "699", "exam": "08/09/2023 S-I", "q": "Which of the following statements is NOT true?", "o": ["Memory of students develops through a textbook", "Reasoning of students develops through a textbook", "A textbook makes students averse to study", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The statement that textbooks make students averse to study is not true, because a textbook helps students learn effectively and meaningfully. Through it students' memory develops, and their reasoning power also develops.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0700", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "700", "exam": "08/09/2023 S-I", "q": "What is the use of a textbook in the class?", "o": ["For interpreting ideas and thoughts", "For the achievement of educational objectives", "To limit what is taught", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A textbook is used in the class to achieve educational objectives. It provides a structure for teaching and learning, and is a tool used in the teaching-learning process to make it effective and convenient.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0701", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "701", "exam": "09/09/2023 S-I", "q": "A good textbook is:", "o": ["Audio material", "Audio-visual material", "Visual material", "None of these"], "key": {"printed": [0], "verified": [1], "official": null}, "e": "The printed explanation: a good textbook is audio material; audio-visual material means material that presents a lesson effectively in both sound and picture form, activating both eyes and ears and making learning meaningful; audio material activates both eyes and ears and makes learning meaningful.", "tip": "", "status": "disputed", "note": "Printed key (a) 'audio material' does not match the explanation, which describes audio-visual material activating both eyes and ears (option b). Printed key retained; verified answer (b)."}, {"id": "AOT-0702", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "702", "exam": "09/09/2023 S-I; 19/05/2024 S-III", "q": "The library plays a major role in:", "o": ["Personality development", "Educational development", "Both A and B", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The library is the source from which cultural information flows and it is the centre where ancient and new cultures meet. The library is the main source of knowledge and information; it provides rich educational resources and plays a major role in educational development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0703", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "703", "exam": "13/09/2023 S-I; 14/09/2023 S-I", "q": "Which is the oldest library in India?", "o": ["Asiatic Society Library, Mumbai", "Connemara Public Library, Madras", "Delhi Public Library, Delhi", "National Library of India, Kolkata"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The oldest library of India is the 'National Library of India, Kolkata'. It is India's largest library; the National Library was established in 1948 by the passing of the Imperial Library (Change of Name) Act, 1948, and it has been granted the status of an institution of national importance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0704", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "704", "exam": "15/09/2023 S-I", "q": "The objective of a library is:", "o": ["To provide knowledge and information", "To provide games", "Both A and B", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The aim of a library is to provide knowledge and information. A library has a collection of various types of sources, services and activities which are useful for readers' study, research and entertainment. Some libraries also provide material for readers to play.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0705", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "705", "exam": "15/09/2023 S-I", "q": "The evaluation of textbooks depends on:", "o": ["Aim of education", "Creation and presentation of subject matter", "Layout and composition", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Evaluation of textbooks is done based on the aim of education, creation and presentation of subject matter, and layout and composition. These determine how attractive and motivating the textbook is.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0706", "ch": 7, "page": 98, "ansPage": 98, "srcNo": "706", "exam": "09/09/2020 S-I", "q": "The author of 'Pedagogy of the Oppressed' is:", "o": ["Frederick Froebel", "Francis Bacon", "Paulo Freire", "Madan Mohan Malaviya"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The author of 'Pedagogy of the Oppressed' is the Brazilian educator Paulo Freire. The book was written in Portuguese between 1967 and 1968; it was banned in Brazil.", "tip": "", "status": "note", "note": "Same question as Q138 (key a: Paulo Freire; option order differs)."}, {"id": "AOT-0707", "ch": 7, "page": 99, "ansPage": 99, "srcNo": "708", "exam": "09/09/2020 S-I", "q": "'Shikshak Sathi' is:", "o": ["Learning facilitation manual", "Teacher facilitation manual", "Non-government platform to solve the problems of teachers", "Educational journal published by Bihar Education Project Council, Patna"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teachers have been given a subject-wise 'Shikshan Sahyog Sandarshika' (teaching support manual) book for classes 1-5, known as 'Shikshak Sathi'. According to the teacher-support manual, it guides teachers in delivering teaching to children in six parts, including teacher instructions, group work, individual work, revision and evaluation.", "tip": "", "status": "note", "note": "English option (a) 'Learning facilitation manual' vs (b) 'Teacher facilitation manual' differ only slightly; the printed key (a) matches the printed explanation."}, {"id": "AOT-0708", "ch": 7, "page": 99, "ansPage": 99, "srcNo": "709", "exam": "09/09/2020 S-I", "q": "The article titled 'Mera Vidyalaya' has been written by Raju. The article is meaningful but also has grammatical inaccuracies. Which comment would be appropriate for Raju?", "o": ["Your grammatical knowledge is very weak.", "Be sure to get spelling knowledge before writing an article.", "Your handwriting is dirty and full of inaccuracy.", "You have written an essay well. Here and there are some grammatical errors which need to be corrected by practice."], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The article 'Mera Vidyalaya' written by Raju is meaningful but also has grammatical errors. Hence the appropriate comment is: you have written the essay well; some places have errors which need to be improved with practice.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0709", "ch": 7, "page": 99, "ansPage": 99, "srcNo": "710", "exam": "09/09/2020 S-I", "q": "'Rise, wake up and do not stop until the goal is achieved.' Whose statement is this?", "o": ["Dr. Radhakrishnan", "Mahatma Gandhi", "Tagore", "Swami Vivekanand"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "'Rise, awake and stop not till the goal is reached' is the statement of Swami Vivekananda. Other quotes (printed): 'Through education alone the human brain can be properly used' - Dr. Radhakrishnan; 'You cannot cross the river merely by standing and staring at the water' - Tagore; 'A man is but the product of his thoughts; what he thinks, he becomes' - Mahatma Gandhi.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0710", "ch": 7, "page": 99, "ansPage": 99, "srcNo": "711", "exam": "15/09/2020 S-II", "q": "The first book written in the history of psychology was by:", "o": ["William James", "R. S. Woodworth", "William McDougall", "N. L. Mann"], "key": {"printed": [], "verified": [0], "official": null}, "e": "The first book on psychology, titled 'Principles of Psychology', was by the American philosopher and psychologist William James and was published in 1895 (as printed).", "tip": "", "status": "missing", "note": "Printed key is '(*)': the source gives bonus marks because the 'History of Psychology' was written by William Douglas Wood, who is not in the options. The printed explanation supports William James; the verified/used answer is (a) but the official outcome was bonus marks. Printed date 1895 is as printed."}, {"id": "AOT-0711", "ch": 7, "page": 99, "ansPage": 99, "srcNo": "712", "exam": "26/02/2020 S-I", "q": "The book titled 'Diva Swapna' was written by:", "o": ["J. Krishnamurti", "Gijubhai Badheka", "Mahatma Gandhi", "Rabindranath Tagore"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The book 'Diva Swapna' was written in 1932 by the famous Gujarati educationist Gijubhai Badheka. It was first published in Gujarati and later translated into various languages. The book is about rejecting the conventional culture of education; Gijubhai Badheka has always emphasised innovative uses in education. The book includes story, play and games, activity-based education, child-centred education, humanism and a holistic perspective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0712", "ch": 8, "page": 99, "ansPage": 99, "srcNo": "713", "exam": "09/06/2024 S-I", "q": "To be successful in teaching, a teacher will have to be dedicated to his work:", "o": ["Always ready to help his students", "Lacking respect for students", "Be partial towards students", "Emotionally detached"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "To be successful in teaching, a teacher must be completely dedicated to his work. Dedication means that the teacher should always be ready to help students, understanding their educational challenges. This dedication inspires confidence in students, motivates them to learn and ultimately paves the way for their educational and personal success.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0713", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "714", "exam": "09/06/2024 S-I", "q": "You want to adopt the teaching profession because:", "o": ["There are many other teachers in your family", "You have no other option to earn a livelihood", "Children give more respect and honour", "You get the opportunity to take care of and train future citizens"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "You want to adopt the teaching profession because you get the opportunity to take care of and train future citizens; this reflects a sense of duty of a teacher, as it is an opportunity to build future citizens.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0714", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "715", "exam": "09/06/2024 S-I", "q": "A good teacher should be:", "o": ["Resourceful and autocratic", "Resourceful and cooperative", "Resourceful and authentic", "Resourceful and effective"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A good teacher should be resourceful and cooperative: he should have sufficient resources for teaching and actively involve himself in the learning process with students, creating a collaborative and supportive learning environment.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-043", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0715", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "716", "exam": "18/05/2024 S-I", "q": "Knowledge of counselling skills is essential for teachers:", "o": ["To promote the students' learning and welfare", "To prepare the weekly lesson plan", "To collect data", "To guide students in acquiring technical skills"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Counselling skills are essential for teachers to promote students' learning and overall welfare. It helps them understand students' problems, provide emotional support and guide them in the right direction, creating a positive learning environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0716", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "717", "exam": "18/05/2024 S-I", "q": "Evaluation is important for the success of a teacher. It is the role that allows the teacher to find out:", "o": ["Social status", "Expectations of parents", "The value of his work", "The value of the family"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Evaluation is very important for a teacher's success: it helps the teacher find out the real value of his work. Through evaluation the teacher can know how effective his teaching has been and what effect it has had on students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0717", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "718", "exam": "24/05/2024 S-I", "q": "In the teaching-learning process, the teacher plays an important role as a ______ of learning.", "o": ["Facilitator", "Participant", "Adviser (counsellor)", "Practitioner"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the teaching-learning process, a teacher plays an important role as a facilitator or helper: a teacher provides an environment and resources suitable for students to learn, presents course material in a simple and understandable way, so students learn better.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-006", "first": false, "kind": "near", "of": "AOT-0057"}}, {"id": "AOT-0718", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "719", "exam": "22/05/2024 S-I", "q": "If a student is unable to answer questions in class, what should the teacher do?", "o": ["Advise him to study well", "Try to understand why he was unable to answer the questions", "Punish him so that he answers next time", "Scold him in class and make him feel humiliated"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If a student cannot answer questions in class, the teacher should try to understand why. An ideal teacher should help the student after knowing the cause of the difficulty, not scold or punish him; this increases the student's confidence and the learning process will be positive.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0719", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "720", "exam": "22/05/2024 S-I", "q": "Which of the following does an effective teacher ensure?", "o": ["Competition among students", "Cooperation among students", "Either competition or cooperation, as the situation demands", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "An effective teacher focuses on creating a cooperative environment among students. This encourages sharing knowledge, developing social skills and building a positive learning environment; cooperation increases mutual understanding, team spirit and interest in learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0720", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "721", "exam": "23/05/2024 S-II", "q": "A teacher should be a facilitator who is:", "o": ["Dominating", "Angry", "Autocratic", "Enthusiastic, understanding and self-controlled"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher should, as a facilitator, be enthusiastic, understanding and self-controlled, so that he can inspire students, understand their needs and guide them peacefully. A dominating, angry or autocratic teacher hinders students' behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0721", "ch": 8, "page": 100, "ansPage": 100, "srcNo": "722", "exam": "23/05/2024 S-II", "q": "To dedicate himself to the welfare of his students, a teacher should extend his specialised service only for:", "o": ["Good results", "The benefit of his students", "Their promotion", "Increase in salary"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A teacher's primary objective should be the interest of students, giving them the highest priority. He should use his expertise for the development of students' knowledge, skills and character, not for personal gain (such as promotion or salary increase).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0722", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "723", "exam": "21/05/2024 S-I", "q": "Who determines what a child learns in the classroom?", "o": ["Principal", "Parents", "Teacher", "The child himself"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "What a child learns in the class is determined by the teacher. The teacher fixes the learning objectives as per the curriculum, prepares the curriculum and selects teaching methods according to the needs of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0723", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "724", "exam": "21/05/2024 S-I", "q": "A teacher is one who is wholeheartedly devoted and committed to his profession as ______.", "o": ["Dishonest", "Unjust", "Honest", "Biased"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher is one who is honest, devoted and committed to his profession. Honesty is important because it shows his commitment and dedication to his profession. The teacher behaves right and fair with his students and does his job with full dedication.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0724", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "725", "exam": "21/05/2024 S-I", "q": "Only a teacher can lead society on the path of progress because he:", "o": ["Is devoted to society", "Is a social being", "Can show the right path to the future citizens of the country", "Knows less about himself and more about society"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher can lead society on the path of progress because, through his education, he can guide the future citizens of the country in the right direction. When teachers teach children the right way and guide them, a positive change comes in the future.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0725", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "726", "exam": "25/05/2024 S-I", "q": "A teacher's attitude should be helping and guiding so that he can play an important role in moving ______ forward.", "o": ["Children on the right path", "Their opinion as a rule", "Children in their care", "His work first"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The primary goal of a teacher is to help children in their all-round development and learning. A teacher's attitude should be helping and guiding so that he can play an important role in moving the children in his care forward in their overall process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0726", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "727", "exam": "25/05/2024 S-I", "q": "The most important quality of a good teacher is:", "o": ["Good communication skills", "Effective leadership qualities", "Concern for the welfare of students", "Good knowledge of the subject"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Complete and good knowledge of the subject is the most important quality of a good teacher, because it is the most important factor on which the effectiveness of teaching depends. Other qualities of a teacher: dedicated, responsible and caring; impartial towards all children; good communication skills; a good speaker and listener; and concern for students' interests.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-044", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0727", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "728", "exam": "25/05/2024 S-I", "q": "As a planner, a teacher must:", "o": ["Encourage class and panel discussion", "Be alert to guidance", "First of all decide what change is to be in the learner", "Skilfully observe the students' responses"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The first and most important task of a teacher as a planner is to decide what expected change (as a result of learning) should take place in the student at the end of the learning process. This is like determining the objectives of learning; once the objectives are clear, the teacher can select appropriate teaching methods, materials and evaluation techniques.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0728", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "729", "exam": "19/05/2024 S-I", "q": "The quality of a great teacher, according to students, is:", "o": ["Failure to respect commitments", "Deliberate deception", "Violation of conscience", "Knowledge of students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A great teacher is one who understands and promotes the knowledge of students. This makes learning easy and effective by taking their needs into account. Knowledge of students and dedication are essential for the development of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0729", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "730", "exam": "19/05/2024 S-I", "q": "In education, a teacher should promote teaching to whom for becoming a professional?", "o": ["Student", "Home", "Parent", "Teacher"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher should focus on teaching students for professional development. This increases the knowledge of students and also improves the teaching skills of teachers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0730", "ch": 8, "page": 101, "ansPage": 101, "srcNo": "731", "exam": "19/05/2024 S-I", "q": "Students respect the teacher who:", "o": ["Teaches in the right way", "Is very healthy and beautiful", "Has many degrees", "Teaches students a lot"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Students respect a teacher who teaches in the right way, because effective teaching enables students to get knowledge and make progress. More than beauty, health or number of degrees, the teaching ability and dedication of the teacher are important.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0731", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "732", "exam": "19/05/2024 S-I", "q": "The conditions of a good teaching environment are:", "o": ["Sympathetic behaviour of the teacher towards students", "Psychological and physical security of students", "Communication between teacher and students", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A good environment is one where students feel safe, accepted and motivated. For this, the teacher's sympathetic behaviour, psychological and physical security of students, and positive communication between teacher and students are very necessary. All these together create a collaborative and supportive environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0732", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "733", "exam": "19/05/2024 S-I", "q": "Supervision should be primarily:", "o": ["Personal and critical", "Preventive and corrective", "Constructive and creative", "Constructive and critical"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The purpose of supervision is to prevent errors in advance (preventive) and to improve work (corrective). This makes the teaching process more effective and of better quality.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0733", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "734", "exam": "09/06/2024 S-II", "q": "Which of the following is a challenge for a teacher in teaching?", "o": ["Preparing a question paper", "Evaluating students", "Maintaining discipline", "Making teaching-learning enjoyable"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Making teaching-learning enjoyable is a challenge for a teacher in education. It requires creativity, adaptability and deep understanding of educational techniques to make activities and attractive lessons that take into account the interest of both teachers and students.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-045", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0734", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "735", "exam": "09/06/2024 S-II", "q": "A teacher as a counsellor is considered:", "o": ["Self-controlled", "Stimulating and imaginative in his approach to classroom behaviour and subject", "Concerned directly with the problems related to the behaviour of students", "Guidance-minded, having an eye on individual children in the class"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher as a counsellor is considered guidance-minded, with an eye on each child in the class. The teacher helps students develop their capabilities through proper guidance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0735", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "736", "exam": "27/05/2024 S-I", "q": "An effective teacher should:", "o": ["Keep distance from the media", "Be organised and disciplined in classroom management", "Be calm and hostile", "Have a pessimistic and regressive outlook"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For an effective teacher, being organised and disciplined in classroom management is very important. An effective teacher helps maintain discipline in the class, present the subject matter systematically and make the student's learning process smooth. A disciplined teacher has a plan and works according to it, so the teaching-learning process stays organised.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0736", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "738", "exam": "26/05/2024 S-II", "q": "Before being named as a ______, a teacher must be a good human being.", "o": ["Successful manager", "Good teacher", "Problem solver", "Good speaker"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Before being called a good teacher, a teacher should be a good human being. It means that a teacher must have morality, sympathy and respect for others. These qualities help the teacher establish good relations with students and educate them effectively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0737", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "739", "exam": "26/05/2024 S-II", "q": "Which relationship between teacher and student do you consider good?", "o": ["Like friends", "Like master and servant", "Like father and son", "Like seller and buyer"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The relationship between teacher and student should be friendly. Such a relationship gives students the opportunity to talk openly and learn from each other. A friend-like teacher understands students' problems and motivates them, thereby making the learning environment positive and increasing confidence in students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0738", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "740", "exam": "26/05/2024 S-II", "q": "Which function of the teacher promotes the feeling of self-reliance in the learning process?", "o": ["Trainer", "Facilitator", "Representative", "Formal authority"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When a teacher plays the role of a facilitator, he creates an environment which motivates the process of learning. In this role the teacher gives students the opportunity to think freely, ask questions and share their ideas, which develops self-reliance in students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0739", "ch": 8, "page": 102, "ansPage": 102, "srcNo": "741", "exam": "18/05/2024 S-III", "q": "Which one of the following will happen if the answer booklet is evaluated by another teacher than the teacher who teaches?", "o": ["Students will get fewer marks", "Students will know their actual knowledge level", "Students will develop more confidence", "Students will not be given unjust and partial treatment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "When the answer book is evaluated by a teacher other than the teaching teacher, impartiality increases. The possibility of the teacher's prejudice or bias decreases, so students get proper and just marks, and the possibility of unfair behaviour with students is eliminated.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-046", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0740", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "742", "exam": "29/05/2024 S-I", "q": "______ is the quality of a good teacher.", "o": ["Control over emotions", "Good command over the subject", "Physical strength", "Sense of humour"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Good command over the subject is a quality of a good teacher. A teacher should have a deep knowledge of his subject so that he can explain it to students better and answer their questions; a teacher should also update himself on new knowledge and developments in the subject.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0741", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "743", "exam": "16/06/2024 S-III", "q": "As a counsellor, the teacher is supposed to be:", "o": ["Self-controlling", "Stimulating and imaginative in his approach to classroom behaviour and subject", "Concerned directly with the problems related to the behaviour of students", "Guidance-minded having an eye on individual children in the class"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher as a counsellor should be guidance-minded and keep an eye on every child in the class, understand each one's individual problems, and have a stimulating and imaginative outlook that influences students' attitude positively towards his subject. He also helps students become self-reliant.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0742", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "744", "exam": "16/06/2024 S-III", "q": "How does a teacher motivate students?", "o": ["Through lecture", "Through notes", "By reinforcement", "Through parent-teacher meeting (PTM)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher motivates students through reinforcement. Reinforcement can be of both types: positive (such as praise or reward) and negative (such as removal of an undesired situation). It helps students repeat and learn desired behaviour and encourages them to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0743", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "745", "exam": "18/05/2024 S-III", "q": "As a facilitator of learning, a teacher requires:", "o": ["Two months' leave", "One year of training", "Opportunities for professional and academic advancement", "Opportunities to travel around the world"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "To become a 'facilitator of learning', a teacher requires opportunities for professional and academic advancement. These opportunities help develop teaching methods, research and skills so the teacher can guide students better; options like travel or leave do not directly improve teaching ability, while continuous training keeps the teacher effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0744", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "746", "exam": "18/05/2024 S-III", "q": "It is best for teachers to teach:", "o": ["From the viewpoint of adults", "Complex task first", "Simple topic first", "From the viewpoint of experts"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to the 'principles of teaching', teachers should begin with the simplest concept first. It is part of the child-centred approach, in which the interest, understanding and level of students are kept in mind. This emphasises the process of learning from simple to complex.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0745", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "747", "exam": "19/05/2024 S-III", "q": "______ is the apex institution involved in the planned and coordinated development of the teacher education system in the country.", "o": ["UGC", "NCERT", "NCTE", "XSEED"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The apex institution for the planned and coordinated development of the teacher education system in the country is the National Council for Teacher Education (NCTE). Its work is to make standards for teacher education, develop curriculum and give recognition to teacher education institutions, so that the production of quality teachers is ensured.", "tip": "", "status": "note", "note": "Same question as Q458.", "dup": {"group": "DUP-033", "first": false, "kind": "near", "of": "AOT-0458"}}, {"id": "AOT-0746", "ch": 8, "page": 103, "ansPage": 103, "srcNo": "748", "exam": "19/05/2024 S-III", "q": "In teaching, which of the following is a challenge for the teacher?", "o": ["Preparing a question paper", "Evaluating students", "Maintaining discipline", "Making the teaching-learning enjoyable"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The biggest challenge for a teacher in education is to make the teaching-learning process enjoyable. Preparing a question paper, evaluating students and maintaining discipline are the regular duties of a teacher. To make teaching interesting and effective so that students learn actively and enjoy it, constant effort, creativity and understanding the various needs of students are needed.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-045", "first": false, "kind": "near", "of": "AOT-0733"}}, {"id": "AOT-0747", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "749", "exam": "19/05/2024 S-III", "q": "In order to introduce the topic on 'Nutrition' to the class more effectively, a teacher should:", "o": ["Show the model of human denture", "Ask the students to open their tiffin box, see the contents, followed by the teacher's explanation", "Give examples of different foods rich in nutrients", "Draw the diagram of the digestive system on the blackboard"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "To explain 'Nutrition' effectively in the class, the teacher should give examples of various foods rich in nutrients (as printed). This helps students understand which food items help the body, making the subject practical and interesting.", "tip": "", "status": "note", "note": "Printed key (b) (tiffin box activity); printed explanation speaks of 'examples of food rich in nutrients' (option c). Key retained as printed."}, {"id": "AOT-0748", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "750", "exam": "05/09/2023 S-III", "q": "A good teacher should be:", "o": ["Resourceful and autocratic", "Resourceful and cooperative", "Resourceful and dominating/effective", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A good teacher should be resourceful and cooperative. Resourceful: a teacher should have a good, deep understanding of his subject and be familiar with the latest information on it.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-043", "first": false, "kind": "near", "of": "AOT-0714"}}, {"id": "AOT-0749", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "751", "exam": "05/09/2023 S-III", "q": "Students usually appreciate a teacher who:", "o": ["Frightens his students", "Behaves in a friendly way with all students", "Both of the above", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Students usually appreciate a teacher when he behaves in a friendly way with all students. A teacher who teaches his students can make students feel more comfortable and can establish a friendly relationship with them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0750", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "752", "exam": "13/09/2023 S-I", "q": "Which of the following is NOT a quality of teachers?", "o": ["Sympathy", "Communication", "Creativity", "Jealousy"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Jealousy is not a quality of a good teacher. A good teacher is dedicated and devoted, has good communication skills, is impartial towards all children, cares for students' interests, and is a good speaker and listener.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0751", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "753", "exam": "13/09/2023 S-I", "q": "Which of the following personal qualities of a teacher affects teaching?", "o": ["Sensitivity", "Management ability", "Social skills", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Among the personal qualities of a teacher, sensitivity affects teaching. Teaching is a social activity that provides the facility of learning, a process of development that helps shape students' behaviour. Sensitivity is the teacher's personal quality that influences the teaching process.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-047", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0752", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "754", "exam": "08/09/2023 S-I", "q": "The criteria of teacher effectiveness are:", "o": ["Competence", "Production", "Process", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Competence, product and process are the criteria of teacher effectiveness. Teacher effectiveness can be defined as the teacher's ability to produce a collective change in student behaviour, and the teacher's ability to produce understanding, habits, desirable expression, values, decision-making and personal adjustment in students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0753", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "755", "exam": "08/09/2023 S-II", "q": "The primary responsibility of coordination of teachers is with:", "o": ["Children", "Headmaster", "The teacher himself", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The primary responsibility of the coordination of teachers lies with the teacher himself. In the educational setting the teacher is the key person for any change; the teacher's patience and firmness greatly affect the success of a student in the class, which is why the primary responsibility of coordination lies with the teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0754", "ch": 8, "page": 104, "ansPage": 104, "srcNo": "756", "exam": "08/09/2023 S-I", "q": "The features of teacher-centred methods are:", "o": ["Formality", "Supremacy of the teacher", "Neglect of new techniques", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Formality, supremacy of the teacher, neglect of new techniques, etc. are features of teacher-centred methods. Features: (1) the teacher is the source of knowledge; (2) the teacher knows everything a student needs to know; (3) the teacher can deliver knowledge and skills to children.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0755", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "757", "exam": "09/09/2023 S-I; 10/09/2023 S-I; 13/09/2023 S-I", "q": "Which of the following is NOT a quality of a teacher?", "o": ["Patience", "Humble", "Tolerance", "Superstition"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher illuminates us with the light of his knowledge and guides us. A teacher should be patient, humble, tolerant, discriminating (wise), of good character, and simple and gentle; superstition is not a quality of a teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0756", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "758", "exam": "09/09/2023 S-I", "q": "What is necessary for a good teacher?", "o": ["Commitment to teaching", "Loyalty to his organisation", "Both A and B", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "An ideal teacher should have the following qualities: effective speaker; commitment to teaching; self-confidence; ability to motivate; a good adviser; love and sympathy for students; knowledge of guidance and leadership; full knowledge of the subject; use of teaching methods; use of teaching-learning material; and knowledge of psychology.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0757", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "759", "exam": "10/09/2023 S-I", "q": "Which of the following personal qualities of a teacher affects teaching?", "o": ["Sensitivity", "Management ability", "Social skills", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Sensitivity is a personal quality of a teacher which influences the teaching process. Teaching is a social activity and provides the facility of learning; it is a developmental process that helps in shaping students' behaviour. Teaching should refer to those activities which are designed and performed to bring change in the behaviour of the student. Same question as Q753.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-047", "first": false, "kind": "exact", "of": "AOT-0751"}}, {"id": "AOT-0758", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "760", "exam": "10/09/2023 S-I; 13/09/2023 S-I", "q": "The role of the teacher in higher education is:", "o": ["To promote self-study in students", "To provide information to students", "To help students solve their problems", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teachers play a significant role in society in higher education because they prepare the young generation to face the future with courage and knowledge. In higher education the teacher's important role is promoting self-study in students; the teacher's role is more as a facilitator who creates an environment where students can realise their own capabilities and build knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0759", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "761", "exam": "13/09/2023 S-I", "q": "The teacher is glorified by the phrase 'friend, philosopher and guide' because:", "o": ["He acquaints students with the higher values of humanity", "He is a great patriot", "Both A and B", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher is glorified by the phrase 'friend, philosopher and guide' because he acquaints students with the values of humanity. A teacher's role is not just to transfer curriculum to students' minds; the teacher also has to play other roles according to the situation, such as guide, facilitator, leader and friend. Same question as Q242.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0760", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "762", "exam": "13/09/2023 S-I", "q": "The nature of teacher effectiveness is:", "o": ["Scientific", "Artistic", "Both A and B", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The effectiveness of a teacher is of a scientific nature. The scientific outlook of a teacher means an approach which promotes scientific thinking among the learners so that they can skilfully experiment with information and develop scientific ideas. Same question as Q241.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-017", "first": false, "kind": "exact", "of": "AOT-0241"}}, {"id": "AOT-0761", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "763", "exam": "13/09/2023 S-I", "q": "Which of the following personal qualities of a teacher affects teaching?", "o": ["Sensitivity", "Management ability", "Social skills", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Sensitivity is a personal quality of a teacher which affects the teaching process. Teaching is a social activity that helps in shaping the behaviour of students. Same question as Q753.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-047", "first": false, "kind": "exact", "of": "AOT-0751"}}, {"id": "AOT-0762", "ch": 8, "page": 105, "ansPage": 105, "srcNo": "764", "exam": "13/09/2023 S-I", "q": "The role of a teacher in higher education is:", "o": ["To promote self-learning in students", "To provide information to students", "To help students solve their problems", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The role of a teacher in higher education is to promote self-learning in students. The teacher is a coordinator because the teacher's role is to create an environment of learning where students can realise their own ability and build knowledge themselves.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0763", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "765", "exam": "15/09/2023 S-I", "q": "An effective teacher is the one:", "o": ["Who controls the class", "Who can provide information in a limited period", "Who inspires students to learn", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An effective teacher is one who provides students with a rich experience of knowledge, skills and values. The most prominent feature of an effective teacher is that he inspires students to learn; an effective teacher motivates students to learn and imparts to them cognitive, skill-based and value-based teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0764", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "766", "exam": "15/09/2023 S-I", "q": "A person can enjoy teaching as a profession when he:", "o": ["Is more capable than colleagues", "Gets respect from students", "Is very close to higher officials", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A person can enjoy teaching as a profession only when he receives respect from students. An important aspect of the teaching profession is the respect given by students; when a teacher gets respect from students, he feels successful and feels that he is influencing the lives of students, which motivates and delights him.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0765", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "767", "exam": "15/09/2023 S-I", "q": "At what level should a higher teacher teach at the minimum?", "o": ["Comprehension level", "Reflective level", "Memory level", "Evaluation level"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The comprehension level is the level at which a student is able to understand new information. If a student is not able to understand new information, he will not be able to remember it nor evaluate it; therefore the comprehension level is the most important level of teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0766", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "768", "exam": "09/09/2020 S-III", "q": "A good teacher is one who:", "o": ["Gives useful information", "Explains concepts and principles nicely", "Gives printed notes to students", "Inspires students to learn"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A good teacher is one who motivates students to learn. The qualities of a good teacher: is proficient in the subject; considers each person unique and recognises individual differences; carefully prepares plans for his teaching beforehand but is not too rigid with the plan; and promotes self-learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0767", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "769", "exam": "09/09/2020 S-III", "q": "Why should a teacher ask questions as needed during teaching? What is this need?", "o": ["To know whether students are listening or not", "To know how and how much the student's pre-knowledge is", "To know whether the thing being studied is understood by him or not", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher should ask questions during teaching as required: to know whether students are listening attentively; to know what the student's prior knowledge is and how much; and to know whether the thing being studied is understood by him or not. So all of the above are correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0768", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "770", "exam": "09/09/2020 S-III", "q": "To cater to individual differences in his classroom, a teacher should:", "o": ["Have uniform and standard ways of teaching and assessment", "Segregate and label children based on their marks", "Engage in a dialogue with students and value their perspectives", "Impose strict rules upon his students"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Individual difference means the biological, mental, cultural and emotional differences found in each person. To reduce individual differences in class, a teacher should engage in dialogue with students; teachers should know the individual personality of students. Besides, adjustment in curriculum, grouping of students and adjustment of teaching methods are effective means for teachers to deal with individual differences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0769", "ch": 8, "page": 106, "ansPage": 106, "srcNo": "771", "exam": "09/09/2020 S-III", "q": "Teachers, in order to help learners construct knowledge, need to focus on:", "o": ["Making sure the learner memorises everything", "Scores obtained by the learner", "Involving the learner for active participation", "Mastering learning of concepts by the learner"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teachers should focus on the following tasks to help learners construct knowledge: involve the learner in active participation in the building of ideas and knowledge; encourage students to ask each other questions (a thoughtful, open question increases students' curiosity); and, as friend and cooperator of children, play the role of a guide.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0770", "ch": 8, "page": 107, "ansPage": 107, "srcNo": "772", "exam": "09/09/2020 S-III", "q": "For effective teaching, the teacher must be a subject-matter expert that includes:", "o": ["Command over the subject", "The ability to convey knowledge", "The ability to apply ideas from one discipline to another", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Effective teaching occurs when a teacher succeeds in involving the learner actively by giving different kinds of learning experiences. An effective teacher must be a subject-matter expert with: command over the subject; the work of teaching through examples; deep communication skills; the ability to convey knowledge; being a good listener of all the problems and thoughts of the student; and the ability to apply ideas from one discipline to another.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0771", "ch": 8, "page": 107, "ansPage": 107, "srcNo": "773", "exam": "09/09/2020 S-III", "q": "To encourage children to put in effort in their studies, teachers need to:", "o": ["Scold the children", "Control the children", "Compare the child with others", "Motivate the child"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "To motivate children to put effort into their studies, teachers need to motivate the child. Teachers often need to help motivate students in their common daily tasks or especially when they are doing new things, such as learning to walk, eating vegetables or taking an examination.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0772", "ch": 8, "page": 107, "ansPage": 107, "srcNo": "774", "exam": "09/09/2020 S-I", "q": "The most challenging task for a teacher is:", "o": ["Keeping students sitting in the classroom", "To give home work", "To make the teaching-learning process interesting", "To prepare a question paper"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Because of changes in the teaching-learning process, the role of the teacher has become more challenging with increasing expectations. Important challenges for teachers: making the teaching-learning process enjoyable; disciplining students; mismatch between teaching theory and practical teaching; and getting homework done.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0773", "ch": 8, "page": 107, "ansPage": 107, "srcNo": "775", "exam": "10/09/2020 S-II", "q": "Which of the following is an independent variable in the teaching-learning process?", "o": ["Teacher", "Student", "Institution", "Parents"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The 'teacher' is the independent variable in the teaching-learning process. The teaching structure involves four variables that work in the process of teaching and create the situation or conditions of learning. The teacher is called an independent variable who can manage it as he wishes; by manipulating this variable we can change the dependent variable (student). The teacher works as planner, organiser, leader and controller.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0774", "ch": 8, "page": 107, "ansPage": 107, "srcNo": "776", "exam": "10/09/2020 S-II", "q": "The most desirable skill of a teacher is to:", "o": ["Make the students understand what the teacher says", "Cover the prescribed course", "Keep students relaxed while teaching", "Keep higher authorities informed about the class activities"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The most desirable skill of a teacher is to make the students understand what he says. It is possible only when the teacher himself has good knowledge of the subject; a teacher who has good knowledge will reach students with confidence and understand their unique concepts in a unique way.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0775", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "777", "exam": "10/09/2020 S-I", "q": "If inter-personal relationships among children are to be restored, the teacher must:", "o": ["Leave them free to play", "Keep their economic status in mind", "Give ample opportunity to debate", "Study their socio-emotional development and motivate them towards inter-personal relations"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If inter-personal relationships among children are to be re-established, the teacher must study their socio-emotional development and motivate them towards inter-personal relations. Inter-personal relationships are relationships between two or more people which may be temporary or stable.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0776", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "778", "exam": "11/09/2020 S-I", "q": "The in-service teacher training can be made more effective by:", "o": ["Using a training package which is well prepared in advance", "Making it a residential programme", "Using a co-operative approach", "Practising training follow-up procedures"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In-service teacher training can be made more effective by adopting training follow-up activities. In-service training is designed for the effectiveness of a teacher; it works as a refresher and is a way of updating teachers' skills and knowledge to improve learning, which makes performance better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0777", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "779", "exam": "11/09/2020 S-I", "q": "The most important quality of an effective teacher is:", "o": ["Deep knowledge about the subject taught", "A strict disciplinarian", "Good rapport with the students", "A good motivator"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The most important quality of an effective teacher is being a good motivator. By praising students for their hard work, students are motivated and feel they are on the right track. A teacher should motivate students through continuous positive feedback.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0778", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "780", "exam": "14/09/2020 S-I", "q": "Teachers, while analysing the learning problem of a student, often find that:", "o": ["There is a lack of motivation", "There is a shortage of intelligence", "The parents' attitude is lax", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "While analysing the learning problem of a student, a teacher often finds that there is a lack of motivation. Teachers should view their teaching from a different perspective and make efforts to motivate the students for their learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0779", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "781", "exam": "14/09/2020 S-I", "q": "______ is the apex institution involved in the planned and coordinated development of the teacher education system in the country.", "o": ["UGC", "NCTE", "NCERT", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The NCTE (National Council for Teacher Education) is the apex institution involved in the planned and coordinated development of the teacher education system in the country. It is an advisory body of the Government of India established by an Act of Parliament in May 1993.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-033", "first": false, "kind": "near", "of": "AOT-0458"}}, {"id": "AOT-0780", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "782", "exam": "14/09/2020 S-I", "q": "The most important responsibility of a teacher is:", "o": ["To prepare the lesson plan and teach accordingly", "To organise as many activities as possible", "To maintain strict discipline", "To provide students with opportunities to learn according to their varied learning styles"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The most important responsibility of a teacher is to provide students with learning opportunities according to their various learning styles. A teacher's duty is to help students develop intellectually, socially, physically, emotionally and morally, so that their all-round development takes place.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0781", "ch": 8, "page": 108, "ansPage": 108, "srcNo": "783", "exam": "15/09/2020 S-II", "q": "A teacher is successful only if he:", "o": ["Knows his subject thoroughly", "Produces cent percent result", "Is approachable to students", "Publishes papers in journals of repute"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A successful teacher is one who knows his subject well and has complete knowledge of it. A successful teacher inspires students by his knowledge in every path of life. Good or successful teachers also have communication skills, sympathy and a friendly relationship with their students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0782", "ch": 8, "page": 109, "ansPage": 109, "srcNo": "784", "exam": "15/09/2020 S-II", "q": "Which statement is true for a cooperative class?", "o": ["Pupils compete among themselves", "Pupils are allowed to present their ideas and discuss freely with one another", "A large amount of teacher guidance is required", "Pupils work independently"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The teacher should always lay emphasis on cooperative or group learning. In cooperative learning, students get the opportunity to present their ideas and discuss freely with one another, from which some new development of knowledge takes place; each student has his own way of thinking and learning, so students can learn from each other.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0783", "ch": 8, "page": 109, "ansPage": 109, "srcNo": "785", "exam": "15/09/2020 S-II", "q": "While teaching students, a teacher should concentrate on:", "o": ["Class size", "Teaching method and direction", "The classification of children", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher should pay attention to the size of the class, teaching method and direction, and the classification of children, and begin the teaching process on that basis so that both teacher and student find ease in learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0784", "ch": 8, "page": 109, "ansPage": 109, "srcNo": "786", "exam": "15/09/2020 S-II", "q": "What a teacher should do to take care of genius students in his/her class:", "o": ["Keep teaching slow", "Should not take special care of those students", "Teach very fast", "Provide enrichment programmes"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Gifted students are by nature very curious, so they sometimes feel bored in the class because they learn things faster than their peers. To teach gifted students and make learning interesting for them, it is a trainer's responsibility to use high-level and original curriculum material selected by them voluntarily, and a motivating instructional method, i.e. to provide enrichment programmes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0785", "ch": 8, "page": 109, "ansPage": 109, "srcNo": "787", "exam": "15/09/2020 S-III", "q": "Which one of the following is the most crucial task of a teacher?", "o": ["Communication to learners", "Transmitting knowledge", "Promoting quality learning", "Managing the class"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The most important job of a teacher is to help students learn: to promote quality learning. This can be done not just by transmitting knowledge, but by motivating students to learn and giving them opportunities to learn. Quality learning occurs when students are actively trained and can understand and apply their knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0786", "ch": 8, "page": 109, "ansPage": 109, "srcNo": "788", "exam": "15/09/2020 S-III", "q": "In order to develop a good rapport with students, a teacher should:", "o": ["Be friendly with them", "Pay individual attention", "Love all students equally", "Communicate effectively"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher should behave in a friendly way with them: friendship in a teacher-student relationship is different. A teacher should be friendly with students but should also respect his role as a teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0787", "ch": 8, "page": 110, "ansPage": 110, "srcNo": "789", "exam": "15/09/2020 S-III", "q": "Why must the teacher be concerned about children's activities outside the school?", "o": ["The children are often interested in out-of-school activities", "The children are likely to learn bad habits", "Somebody other than parents should watch out-of-school activities", "The children also learn through out-of-school experiences"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Children learn through experiences outside school. In out-of-school activities children learn many things, e.g. social skills, creative skills and problem-solving skills; these are important for the overall development of children. Therefore teachers should keep an eye on children's out-of-school activities so that they can help in their development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0788", "ch": 8, "page": 110, "ansPage": 110, "srcNo": "790", "exam": "15/09/2020 S-I", "q": "The essential role of the teacher in a classroom: 1. Give information; 2. Motivate the students to learn; 3. Develop learning competencies; 4. Prepare them for writing answers.", "o": ["1 and 2", "3 and 4", "1 and 3", "2 and 3"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher leads students and guides them through different activities for better learning experiences. The important role of the teacher in class is: to motivate students (2) and to develop learning competencies in students (3).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0789", "ch": 8, "page": 110, "ansPage": 110, "srcNo": "791", "exam": "15/09/2020 S-I", "q": "Teachers' classroom behaviour should be effective because:", "o": ["Students will be more attentive", "It will set an example", "Students will appreciate", "Environment would be conducive to learning"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The behaviour of teachers in the classroom should be effective because the environment would be conducive to learning. A teacher's good behaviour creates a friendly, tension-free atmosphere in the class, which ultimately influences the students' learning positively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0790", "ch": 8, "page": 110, "ansPage": 110, "srcNo": "792", "exam": "15/09/2020 S-I", "q": "Teaching would be more effective if the teacher:", "o": ["Is master of the subject", "Makes his intent purposeful", "Declares his objectives in the beginning", "Uses various instructional materials"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching can be effective if the teacher uses various types of educational material. A teacher helping students gain proficiency would be one who believes that every student can learn all lessons, and that with adequate time and proper instruction the students will gain mastery.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0791", "ch": 8, "page": 110, "ansPage": 110, "srcNo": "793", "exam": "15/09/2020 S-I", "q": "Which one of the following is appropriate in respect of the teacher-student relationship?", "o": ["Very informal and intimate", "Limited to the classroom only", "Cordial and respectful", "Indifferent"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "To achieve educational objectives, there should be a healthy and cordial relationship between teacher and student. Every teacher should have love and affection towards students, and the teacher is responsible for maintaining a respectful and cordial relationship with students centred on educational goals and educational needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0792", "ch": 8, "page": 110, "ansPage": 110, "srcNo": "794", "exam": "15/09/2020 S-I", "q": "The most important quality of a good teacher is:", "o": ["Sound knowledge of subject matter", "Good communication skills", "Concern for students' welfare", "Effective leadership qualities"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "According to the standards of today, a teacher is required to understand the subject matter in depth and teach it in a flexible way, so that students can create useful cognitive maps, link one idea with another and remove misunderstandings. Hence a teacher should have sound knowledge of the subject. Same question as Q727 (key d there).", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-044", "first": false, "kind": "near", "of": "AOT-0726"}}, {"id": "AOT-0793", "ch": 8, "page": 111, "ansPage": 111, "srcNo": "795", "exam": "15/09/2020 S-I", "q": "A teacher's major contribution towards the maximum self-realisation of the student is affected through:", "o": ["Constant fulfilment of the student's needs", "Strict control of classroom activities", "Sensitivity to students' needs, goals and purposes", "Strict reinforcement of academic standards"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "By a teacher's sensitivity towards students' needs, goals and purposes, the maximum self-realisation of students is possible. A teacher should help students develop problem-solving skills so that they can solve problems of their lives, and help them think creatively, remain independent, become sharp and become innovators.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0794", "ch": 8, "page": 111, "ansPage": 111, "srcNo": "796", "exam": "15/09/2020 S-I", "q": "Professionally a teacher should possess the following traits:", "o": ["Mastery over content", "Knowledge of teaching skills", "A and B both", "Lack of responsibility"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "From a professional point of view, a teacher should have knowledge of the subject, mastery over subject matter, sense of responsibility, the ability to explain, knowledge of learning skills, patience, hard work, discipline, dedication, ability to motivate and lead, impartiality, and interest in reading, writing and teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0795", "ch": 8, "page": 111, "ansPage": 111, "srcNo": "797", "exam": "15/09/2020 S-I", "q": "The following are the roles of a teacher in the pre-teaching phase:", "o": ["Analysing the content", "Deciding on the portion of the content to be selected for instruction", "Studying different learning experiences that are suitable for achieving the set objectives", "Above all"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The roles of the teacher in the pre-teaching phase: analysis of the subject matter; deciding which part of the subject matter will be chosen for teaching; and studying the various learning experiences suitable for the attainment of fixed objectives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0796", "ch": 8, "page": 111, "ansPage": 111, "srcNo": "798", "exam": "15/09/2020 S-I", "q": "Which of the following is a personal quality of a teacher?", "o": ["Attention", "Empathy", "Concern and commitment", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A good teacher has not only great teaching skills but also unique qualities that make him a great teacher. The personal qualities of a teacher: (1) affection (2) empathy (3) creativity (4) communication skill (5) patience (6) concern and commitment (7) adaptability (8) motivation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0797", "ch": 8, "page": 111, "ansPage": 111, "srcNo": "799", "exam": "15/09/2020 S-I", "q": "The teacher has been glorified by the phrase 'friend, philosopher and guide' because:", "o": ["He has to play all vital roles in the context of society", "He transmits the high value of humanity to students", "He is the great reformer of the society", "He is a great patriot"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The role of education is not only to place the curriculum in students' brains, but also to play a suitable role according to the situation; a teacher plays many roles, such as guide, philosopher, leader, friend and often facilitator. So the teacher is glorified with the phrase 'friend, philosopher and guide' because he has to play all the important roles related to society.", "tip": "", "status": "disputed", "note": "Same stem as Q242/Q761 but with different options and key (a) here. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-018", "first": false, "kind": "near", "of": "AOT-0242", "keyConflict": true}}, {"id": "AOT-0798", "ch": 8, "page": 111, "ansPage": 111, "srcNo": "800", "exam": "15/09/2020 S-I", "q": "The most important cause of failure for a teacher lies in the area of:", "o": ["Interpersonal relationship", "Lack of command over the knowledge of the subject", "Verbal ability", "Strict handling of the students"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Effective teachers emphasise healthy social and interpersonal development. Teachers who are strict about the subject matter and lack a performance-based and test-oriented approach cannot pave the way for stud
