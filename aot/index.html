, "The social-order maintaining orientation", "The universal ethical principle orientation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to Kohlberg's theory of moral reasoning, the universal ethical principle orientation is the highest level of moral development. Under these principles, right action is valid for all humanity regardless of law and social agreement; the right action is defined by self-chosen ethical principles.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0110", "ch": 1, "page": 19, "ansPage": 19, "srcNo": "110", "exam": "15/09/2020 S-III", "q": "As per Howard Gardner's theory of multiple intelligence, how would the intelligence of a person with the following characteristic be categorised?\n'Ability to detect and respond appropriately to the moods, temperament, motivations and intentions of others.'", "o": ["Naturalistic", "Intrapersonal", "Interpersonal", "Therapeutic"], "key": {"printed": [1], "verified": [2], "official": null}, "e": "The printed explanation attributes this ability to the person-related ('antar-vaiyaktik') intelligence: the ability to detect others' moods, temperament, motivations and intentions, understood as skill in forming good relations and being socially active.", "tip": "", "status": "disputed", "note": "English option (b) 'Intrapersonal' is printed with the Hindi word that means interpersonal. By Gardner, sensing others' moods is INTERPERSONAL intelligence (c). Printed answer (b) retained as key; verified answer (c)."}, {"id": "AOT-0111", "ch": 1, "page": 19, "ansPage": 19, "srcNo": "111", "exam": "15/09/2020 S-I", "q": "Some students in a class exhibit great curiosity for learning. It may be because they are:", "o": ["Gifted", "From rich families", "Showing artificial behaviour", "Wanting to create indiscipline in the class"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Students showing great curiosity may be gifted. Features of gifted students: they can create and operate abstract ideas; they are free in their decisions because they can follow complex directions easily and handle more than one idea at a time.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0112", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "112", "exam": "15/09/2020 S-I", "q": "Education is a powerful instrument of:", "o": ["Social transformation", "Personal transformation", "Cultural transformation", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Education is the most powerful instrument of social, personal and cultural transformation because it gives individuals and society the ability to change: knowledge, skills and values that enable proper decisions, problem-solving and contribution to community development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0113", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "113", "exam": "15/09/2020 S-I", "q": "Which one is a characteristic of the teaching profession?", "o": ["Essentially involves an intellectual operation", "Draws material from science", "Tends towards self-organisation", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching is a profession and a way of teaching students important lessons such as respect, sharing, moral values and cultures. Characteristics: it essentially involves an intellectual operation, draws material from science, and tends towards self-organisation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0114", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "114", "exam": "16/09/2020 S-I", "q": "'............' plays a significant role in the development of personality.", "o": ["Heredity", "Environment", "Heredity and environment", "Examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Heredity and environment both play important roles in a person's development: they determine an individual's personal development. For example, how a person develops depends on environment, but how far they can develop depends on heredity.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0115", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "115", "exam": "16/09/2020 S-I", "q": "Which of the following is not a feature of the adolescence period?", "o": ["Faster physical development", "Clear and stable self-concept", "Increased interest in the opposite sex", "High emotional tendencies"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Except (b), all the others are features of adolescence: faster physical development, increased interest in the opposite sex and more emotional sensitivity. Adolescence is a period of identity search, so a clear and stable self-concept is not a feature.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0116", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "116", "exam": "16/09/2020 S-I", "q": "Which of the following is most essential for the success of Indian democracy?", "o": ["Educated people", "Secularism", "National and emotional integration", "Eradication of poverty"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Through education, awareness is created among people; people become conscious of their duties, choose capable representatives for themselves and ensure maximum participation in governance. So education and educated people are most important for the success of democracy.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0117", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "117", "exam": "16/09/2020 S-I", "q": "'Education is the natural, harmonious and progressive development of man's innate powers.' This statement belongs to:", "o": ["Pestalozzi", "Kant", "Vivekananda", "Tagore"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The statement was given by Pestalozzi, a great supporter of 'education as natural development'. In his view education is the innate right of man.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0118", "ch": 1, "page": 20, "ansPage": 20, "srcNo": "118", "exam": "16/09/2020 S-I", "q": "Which of the following is not related to an educational programme?", "o": ["Eradication of literacy [sic; Hindi: eradication of illiteracy]", "Marketing of education", "Continuous education", "Universalisation of education"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Eradication of illiteracy, continuing education and universalisation of education are all educational programmes, whereas marketing of education is not related to an educational programme, so option (b) differs.", "tip": "", "status": "note", "note": "English option (a) says 'literacy' while the Hindi says 'illiteracy'; answer unaffected."}, {"id": "AOT-0119", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "119", "exam": "16/09/2020 S-I", "q": "The main aim of idealist education is:", "o": ["Self-realisation", "Physical development", "Creating insight", "To be practical"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main aim of idealist education is self-realisation, a spiritual view. It stresses mental or spiritual elements of experience and rejects the concept of physical existence.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0120", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "120", "exam": "16/09/2020 S-I", "q": "'My Experiments with Truth' was written by:", "o": ["Aurobindo", "Mahatma Gandhi", "Tagore", "Vivekananda"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The book 'My Experiments with Truth' was written by Mahatma Gandhi. It is based on 'Satya ke Prayog', Gandhiji's autobiography.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0121", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "121", "exam": "16/09/2020 S-I", "q": "Which of the following values is considered essential in a democratic pattern of education?", "o": ["Quality of living", "Human dignity", "Emotional integration", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Democratic education is a type of formal education organised democratically so that students can manage their own learning and take part in school administration. Quality of living, human dignity and emotional integration are all considered essential values.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0122", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "122", "exam": "16/09/2020 S-I", "q": "Whose slogan is 'Back to Nature'?", "o": ["Idealist", "Naturalist", "Pragmatist", "Realist"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "'Back to Nature' is the slogan of naturalism. Naturalism separates nature from God and considers nature the original element (doer and cause) of the universe.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0123", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "123", "exam": "16/09/2020 S-I", "q": "What is meant by 'Society'?", "o": ["Network of social relationships", "Group of people", "Common people", "Nation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Society' means a well-organised network of social relationships, formed by communities of more than one person. It is a combination of formal and informal relationships in which people who play roles together are organised.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0124", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "124", "exam": "16/09/2020 S-I", "q": "The word 'Education' is derived from which language?", "o": ["Latin", "Greek", "Spanish", "Japanese"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The word 'education' originates from the Latin word 'educatum'. It is formed from two words: 'E' meaning 'out' and 'Duco' meaning 'to lead' - so education means to lead out the inner (innate) powers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0125", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "125", "exam": "16/09/2020 S-I", "q": "'Children construct their own understanding through interaction with their own environment.' Who said this?", "o": ["Skinner", "Guilford", "Piaget", "Burt"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The Swiss psychologist Jean Piaget said that children develop understanding by interacting with their surroundings and construct their understanding through interaction with their environment. Hence Piaget's cognitive theory is also called the developmental theory.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0126", "ch": 1, "page": 21, "ansPage": 21, "srcNo": "126", "exam": "18/09/2020 S-II", "q": "A teacher never gives answers to questions herself. She encourages her students to suggest answers, have group discussion and adopt collaborative learning. On what principle is this approach based?", "o": ["Setting a good example and being a role-model", "Readiness to learn", "Active participation", "Proper organisation of instructional material"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Active participation occurs when a child interacts and takes part in conversation and dialogue with others. A teacher who never gives the answer herself but encourages students to answer, discuss in groups and adopt collaborative learning is following the active-participation principle.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0127", "ch": 1, "page": 22, "ansPage": 22, "srcNo": "127", "exam": "18/09/2020 S-II", "q": "Which of the following skills is associated with emotional intelligence?", "o": ["Memorising", "Motor processing", "Envisaging", "Empathising"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Emotion is a mental state linked with fear, anger, love, etc., while emotional intelligence is a person's ability to recognise, control and manage their own and others' emotions. Of the options, the empathy skill is related to emotional intelligence.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0128", "ch": 1, "page": 22, "ansPage": 22, "srcNo": "128", "exam": "26/02/2020 S-II", "q": "Effective learning depends most upon:", "o": ["The teacher", "Teaching method", "Interest of students and their involvement", "Use of teaching aids"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Effective learning depends most on students' interest and their involvement in it. Involving students in the learning process ensures learning and helps by retaining information and concepts for a long time, improving understanding of skills, and fostering curiosity and interest.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0129", "ch": 1, "page": 22, "ansPage": 22, "srcNo": "129", "exam": "26/02/2020 S-I", "q": "The principle of true teaching, 'Nothing can be taught', was given by:", "o": ["Swami Dayanand", "Rousseau", "Rabindranath Tagore", "Sri Aurobindo"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The principle of true teaching was given by Sri Aurobindo Ghosh, who remarked that 'nothing can be taught'. According to him, education should be given so that every person can connect it to real life. The teacher does not give knowledge but shows the way to obtain it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0130", "ch": 1, "page": 22, "ansPage": 22, "srcNo": "130", "exam": "26/02/2020 S-I", "q": "Creative thinking is:", "o": ["Horizontal", "Longitudinal", "Cross-sectional", "Tangential"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Thinking is the basis of all cognitive activities and is unique to humans; creative thinking involves looking at and analysing information from the environment, aiming at novelty rather than the obvious truth. Creative (lateral) thinking is horizontal: it means 'thinking outside the box'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0131", "ch": 1, "page": 22, "ansPage": 22, "srcNo": "131", "exam": "26/02/2020 S-I", "q": "Which one of the following is a key behaviour in effective teaching?", "o": ["Using students' ideas and contributions", "Questioning", "Structuring", "Instructional variety"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Effective teaching is a process in which the teacher delivers the objective of the lesson on one side while students learn creatively with joy on the other. Using students' ideas and contributions is a key behaviour; it motivates and influences students and modifies their behaviour.", "tip": "", "status": "disputed", "note": "Same question is printed again as Q295 with printed answer (d) 'Instructional variety'. Conflicting printed keys; each retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-011", "first": true, "kind": "near", "of": null, "keyConflict": true}}, {"id": "AOT-0132", "ch": 1, "page": 22, "ansPage": 22, "srcNo": "132", "exam": "28/01/2020 S-II", "q": "Which school of philosophy in education will plead affinity with Darwin's theory of evolution?", "o": ["Pragmatism", "Idealism", "Naturalism", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The naturalist school of educational philosophy shows affinity with Darwin's theory of evolution, which was propounded by the British naturalist Charles Darwin.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0133", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "133", "exam": "28/01/2020 S-II", "q": "Educational psychology as a subject implies:", "o": ["Education knowledge", "Knowledge of education applied to psychology", "Integration of knowledge of psychology to education", "None of these"], "key": {"printed": [1], "verified": [2], "official": null}, "e": "The printed explanation says educational psychology as a subject means the application of knowledge to psychology; it not only applies psychological principles in education but also helps solve educational problems. Skinner: 'Educational psychology deals with the entire behaviour related to education.'", "tip": "", "status": "disputed", "note": "Printed answer (b) reads reversed. Educational psychology applies psychology to education, i.e. option (c). Printed answer (b) retained as key; verified answer (c)."}, {"id": "AOT-0134", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "134", "exam": "28/01/2020 S-II", "q": "Who said that education follows social change?", "o": ["Ottaway", "John Dewey", "Johnson", "Durkheim"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Ottaway said that education follows social change. According to him, education is a process to prepare people to play a special social role as members of groups suited to a complex social structure; educational change follows other social changes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0135", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "135", "exam": "28/01/2020 S-II", "q": "The first committee to be constituted after independence by the Government of India in respect of women's education was:", "o": ["Radhakrishnan Commission", "Mudaliar Commission", "Kothari Commission", "Durgabai Deshmukh Committee"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "After independence the first committee set up by the Government of India for women's education was the 'Durgabai Deshmukh' committee, also known as the National Committee on Women's Education; it was constituted in 1958-59.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0136", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "136", "exam": "28/01/2020 S-II", "q": "What is the meaning of 'Universalisation of elementary education'?", "o": ["Education for all children from backward classes", "Education to all girl children", "Free and compulsory education to all children", "Free and compulsory education to the children of 6-14 years of age"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Universalisation of elementary education means free and compulsory education for children aged 6-14 years: making education available to all children, so that once a child enrols in primary school, he or she must stay there until the education is complete.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0137", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "137", "exam": "28/01/2020 S-II", "q": "Which of the following modern Indian educationists was very much a naturalist?", "o": ["J. Krishnamurti", "Sri Aurobindo", "Rabindranath Tagore", "Swami Vivekananda"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Rabindranath Tagore was a modern Indian naturalist educationist. He was strongly against the traditional system of education confined to classrooms or the walls of home; he believed nature is the best curriculum and teacher for children, and he had faith in the complete freedom of children.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0138", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "138", "exam": "28/01/2020 S-II", "q": "The book 'Pedagogy of the Oppressed' is authored by:", "o": ["Paulo Freire", "J. Halak", "J. Delors", "N. Bennett"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Paulo Freire is the author of 'Pedagogy of the Oppressed'. He is considered the originator of the tradition of critical pedagogy; his book arose from the desire to empower the oppressed through education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0139", "ch": 1, "page": 23, "ansPage": 23, "srcNo": "139", "exam": "28/01/2020 S-I", "q": "Which of the following Articles of the Constitution of India lays down that education of children aged 6-14 years is a Fundamental Right?", "o": ["Article 45", "Article 42", "Article 21(A)", "Article 51(B)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Article 21A (inserted by the 86th Constitutional Amendment, 2002) makes free and compulsory education for children aged 6-14 years a Fundamental Right. Printed explanation (top of p24): under Article 21(A) children aged 6-14 get free and compulsory education; the Right to Education Act 2009 was passed to implement it. Article 45 directs the State to provide free and compulsory education to children up to 6-14 years (DPSP); Article 42 directs the State to prohibit child labour (as printed); Article 51A(k) (printed as 51(B)) urges citizens to provide opportunities for education.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-012", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0140", "ch": 1, "page": 24, "ansPage": 24, "srcNo": "140", "exam": "28/01/2020 S-II", "q": "Ivan Illich is popular for:", "o": ["De-schooling Society", "Ex-post-facto research", "Field experiment", "Distance education"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Ivan Illich was an Austrian Roman Catholic priest, philosopher, theologian and social critic, famous for his educational philosophy. His 1971 book 'Deschooling Society' criticises the institutional approach of modern society's education, which limits learning to narrow circumstances inside a small time frame.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0141", "ch": 1, "page": 24, "ansPage": 24, "srcNo": "141", "exam": "28/01/2020 S-II", "q": "In the context of social development, which of the following stages is characterised by 'intense self-awareness'?", "o": ["Childhood", "Infancy", "Adolescence", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Social development is the process through which a person builds relationships with those around; intense self-awareness (expressing one's feelings, thoughts and values) is a feature of adolescence: the person has deep knowledge about oneself and sees oneself from others' point of view.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0142", "ch": 2, "page": 24, "ansPage": 24, "srcNo": "142", "exam": "09/06/2024 S-I", "q": "A project or assignment that allows students to demonstrate their understanding in an original way is an example of:", "o": ["Taking care (attending)", "Understanding", "Analysing", "Applying"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A project or assignment that lets students show their understanding in an original way is an excellent example of application. It applies the learnt knowledge and skills to new or real-world situations, showing their creativity and problem-solving ability.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0143", "ch": 2, "page": 24, "ansPage": 24, "srcNo": "143", "exam": "09/06/2024 S-I", "q": "Intellectual skills are reflected in the:", "o": ["Cognitive domain", "Affective domain", "Psychomotor domain", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Intellectual skills belong mainly to the cognitive domain, which includes mental processes such as knowledge, understanding, application, analysis, synthesis and evaluation; the capacity for learning and problem-solving comes under this domain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0144", "ch": 2, "page": 24, "ansPage": 24, "srcNo": "144", "exam": "09/06/2024 S-I", "q": "Which of the following is a feature of the conceptual approach?", "o": ["In this approach, things are learnt in great detail about their principles, techniques, applications, etc.", "Various skills are used to learn new things.", "It improves the child's ability to learn.", "It includes all the cognitive, affective and psychomotor domains."], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A feature of the conceptual approach is that things are learnt in detail regarding their principles, techniques and applications. It stresses deep understanding rather than memorising facts, involving application in different contexts and understanding the reasoning behind them, developing effective problem-solving ability.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0145", "ch": 2, "page": 24, "ansPage": 24, "srcNo": "145", "exam": "18/05/2024 S-I", "q": "The affective domain was classified by:", "o": ["Benjamin S. Bloom", "Simpson", "Krathwohl", "Both Benjamin S. Bloom and Krathwohl"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The affective domain was classified by both Benjamin S. Bloom and Krathwohl. It focuses on learning objectives related to attitudes, values and appreciation. After Bloom's classification, Krathwohl and colleagues developed a detailed classification for the affective domain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0146", "ch": 2, "page": 24, "ansPage": 24, "srcNo": "146", "exam": "18/05/2024 S-I", "q": "The psychomotor domain was divided by Simpson into:", "o": ["Four subgroups", "Five subgroups", "Six subgroups", "Seven subgroups"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The psychomotor domain was classified by Simpson, who divided it into seven subgroups relating to the development of physical skills and action capabilities. This classification works as a complement to Bloom's cognitive and Krathwohl's affective domains.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0147", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "147", "exam": "24/05/2024 S-I", "q": "Determining or knowing the value of an object is:", "o": ["Analysis", "Application", "Knowledge", "Evaluation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The process of determining the value of an object is called evaluation: analysing quality, usefulness, effectiveness and importance, and drawing a conclusion. It plays an important role in decision-making.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0148", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "148", "exam": "24/05/2024 S-I", "q": "Attitudes, values and interests are reflected in the:", "o": ["Cognitive domain", "Affective domain", "Psychomotor domain", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Attitude, value and interest show a person's priorities and inner beliefs; they are part of the affective domain, which is separate from the cognitive (knowledge) or psychomotor (skill) domain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0149", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "149", "exam": "22/05/2024 S-I", "q": "Which of the following is the sequence of the different levels of teaching?", "o": ["Memory level, understanding level, reflective level", "Understanding level, memory level, reflective level", "Reflective level, understanding level, memory level", "Memory level, reflective level, understanding level"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The levels of teaching were determined by educationists such as H. C. Morrison and B. S. Bloom. Teaching develops in the order: (1) memory level - students remember facts; (2) understanding level - they understand information; (3) reflective level - they use deep analysis and critical thinking.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-013", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0150", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "150", "exam": "22/05/2024 S-I", "q": "Teaching is based on whose skill/expertise?", "o": ["Knowledge of concepts", "Teaching skills", "Decision-making skills", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching is a complete process requiring coordination of various skills. An effective teacher needs deep conceptual understanding of the subject, the ability to use teaching techniques suitable to students' level, and classroom management and decision-making; these three form the basis of teacher efficiency.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0151", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "151", "exam": "22/05/2024 S-I", "q": "Teaching will be effective if the teacher:", "o": ["Has a lot of experience in teaching the subject", "Starts from what students already know", "Uses many teaching facilities", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching is a skill resting on three main pillars: first, the teacher's grip and experience of the subject; second, connecting with students' prior knowledge (as in Vygotsky's ZPD); third, using multi-resource teaching methods. So all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0152", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "152", "exam": "22/05/2024 S-I", "q": "Which domain is related to physical and motor skills?", "o": ["Cognitive domain", "Affective domain", "Psychomotor domain", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Physical and motor skills are related to the psychomotor domain, which involves physical movement, coordination and skill-based behaviour. It differs from the cognitive (knowledge) and affective (emotional) domains.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0153", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "153", "exam": "22/05/2024 S-I", "q": "The affective domain focuses on adopting a value system as part of a lifestyle by:", "o": ["Responding", "Valuing", "Organising", "Characterisation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the affective domain, 'characterisation' is the highest level, where a person fully internalises values and they become a permanent part of lifestyle and personality. The levels are: 1. Receiving, 2. Responding, 3. Valuing, 4. Organising, 5. Characterisation.", "tip": "Affective domain order: Receiving - Responding - Valuing - Organising - Characterisation.", "status": "ok", "note": ""}, {"id": "AOT-0154", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "154", "exam": "23/05/2024 S-II", "q": "Effective teaching includes:", "o": ["The teacher is active but students may or may not be active", "The teacher may be active or passive but students are active", "The teacher is active and students are active", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Effective teaching needs the participation of both teacher and students. The teaching process succeeds when the teacher actively helps students learn and the students themselves are actively involved in the learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0155", "ch": 2, "page": 25, "ansPage": 25, "srcNo": "155", "exam": "23/05/2024 S-II", "q": "An example of the cognitive domain is:", "o": ["Describe a subject", "Develop an X-ray film", "Type a letter", "Take charge of the equipment"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Describe a subject' is an example of the cognitive domain because it involves mental processes such as knowledge, understanding and expression. The other options relate to the psychomotor or affective domain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0156", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "156", "exam": "23/05/2024 S-II", "q": "Knowing/retaining and recalling is related to:", "o": ["Comprehension", "Application", "Knowledge", "Evaluation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Knowing/retaining and recalling relates to knowledge, the basic level of the learning process, which includes remembering facts and information. Comprehension, application and evaluation are higher-order skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0157", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "157", "exam": "21/05/2024 S-I", "q": "The method of teaching at the memory level is:", "o": ["Subject-centred", "Teacher-centred", "Learner-centred", "Problem-solving-centred"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "At the memory level, teaching is mainly subject-centred, with emphasis on remembering facts, figures and information. The teacher presents the content in a simple and sequential manner so that students can remember it and answer in exams.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0158", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "158", "exam": "21/05/2024 S-I", "q": "Before giving particular facts and examples, children should first be presented with:", "o": ["Abstract rules and principles", "General rules and principles", "Complex rules and principles", "Difficult rules and principles"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Children should first be introduced to general rules and principles before understanding a subject in depth. This strengthens their basic understanding, and the specific facts and examples given later are easily understood, making teaching more effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0159", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "159", "exam": "21/05/2024 S-I", "q": "The correct order of the subgroups of the affective domain is:", "o": ["Participating, responding, valuing, characterising, organising", "Participating, responding, characterising, valuing, organising", "Participating, valuing, responding, organising, characterising", "Participating, responding, valuing, organising, characterising"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The correct order of the affective domain's subgroups is: participating (receiving), responding, valuing, organising, characterising. The learning levels of the affective domain are divided into five sub-groups; this sequence shows personality development from interest to internalising values and applying them in life.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0160", "ch": 2, "page": 26, "ansPage": 27, "srcNo": "160", "exam": "21/05/2024 S-I", "q": "The psychomotor domain was classified by Simpson in:", "o": ["1962", "1972", "1982", "1992"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Richard Simpson classified the psychomotor domain in 1972. It focuses on developing students' physical and muscular abilities in education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0161", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "161", "exam": "25/05/2024 S-I", "q": "The characteristics of moral (ethical) teaching include:", "o": ["Devaluation of courage and interpersonal skills", "Devaluation for ethical deliberation", "Appreciation for indifference", "Appreciation for ethical deliberation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The aim of moral education is to develop moral values, reasoning and decision-making ability in students. An important feature is that it encourages students to reflect openly on ethical issues, understand different perspectives and develop their own ethical thinking; hence appreciation for ethical deliberation is a key feature.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0162", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "162", "exam": "25/05/2024 S-I", "q": "If you want to improve children's ability to observe, which of the following would you recommend?", "o": ["Creating interest in the subject", "Developing a framework for experiences", "Sharpening the senses", "Training of mental abilities"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "To improve observation, develop a framework linking experiences to real experience (observation, experiments, field trips), which gives students the chance to see actively, analyse and conclude. Other options may help, but 'a framework for experiences' is the most direct and broad way to promote observation skill.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0163", "ch": 2, "page": 26, "ansPage": 26, "srcNo": "163", "exam": "25/05/2024 S-I", "q": "To achieve learning objectives, all of the following are required EXCEPT one:", "o": ["Selection of appropriate teaching techniques", "Selection of appropriate strategies", "Use of appropriate audio-visual material", "None of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For attaining the learning objectives: choosing suitable teaching techniques makes learning effective; choosing suitable strategies (problem-solving, cooperative learning, etc.) helps achieve objectives; using suitable audio-visual material makes learning interesting and understandable. All three are necessary, so 'none of the above' is the exception.", "tip": "", "status": "note", "note": "Question wording ('except one') with answer 'none of the above' as printed; all three listed items are required."}, {"id": "AOT-0164", "ch": 2, "page": 26, "ansPage": 27, "srcNo": "164", "exam": "19/05/2024 S-I", "q": "Students' needs and interests are important for the ______.", "o": ["Sociological basis", "Psychological basis", "Economic basis", "Historical basis"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The psychological basis in education emphasises understanding mental abilities, interests, needs and developmental stages. If a teacher teaches according to students' interests and needs, teaching becomes effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0165", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "165", "exam": "19/05/2024 S-I", "q": "The psychomotor ('manogatyatmak') domain is related to:", "o": ["Feeling", "Practical skill", "Intellectual ability", "None of these"], "key": {"printed": [0], "verified": [1], "official": null}, "e": "The printed explanation: this domain of learning is concerned with emotional reactions, emotional development and psychological value systems; examples are showing empathy, respect and motivating.", "tip": "", "status": "disputed", "note": "Printed explanation describes the AFFECTIVE domain. By standard theory the psychomotor domain relates to practical (physical) skill, option (b). Printed answer (a) retained as key; verified answer (b)."}, {"id": "AOT-0166", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "166", "exam": "19/05/2024 S-I", "q": "Match List-I (Erikson's stages of psychosocial development) with List-II (Relevant depiction).\nList-I: A. Basic trust vs basic mistrust; B. Industry vs inferiority; C. Intimacy vs isolation; D. Generativity (creativity) vs stagnation\nList-II: I. Nurturance/advice; II. Love relationship; III. School; IV. Nourishment", "o": ["A-I, B-II, C-III, D-IV", "A-II, B-I, C-IV, D-III", "A-IV, B-III, C-II, D-I", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Correct matching: Basic trust vs mistrust - Nourishment (feeding/nurture); Industry vs inferiority - School; Intimacy vs isolation - Love relationship; Generativity vs stagnation - Nurturance/advice (parenting, guidance).", "tip": "Erikson: Trust-feeding, Industry-school, Intimacy-love, Generativity-caring/advice.", "status": "ok", "note": ""}, {"id": "AOT-0167", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "167", "exam": "19/05/2024 S-I", "q": "While using instructional material, what should the teacher mainly consider?", "o": ["The material should be newly and skilfully made.", "It should be in accordance with the objectives of the lesson.", "The material should encourage interest and keep students interested.", "It should be updated and relevant for the Filipino setting."], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main purpose of instructional material is to fulfil the objectives of teaching. If the material is not in line with the lesson's objectives, its effect will be limited; so the teacher should first ensure the material matches the teaching goals, and only then will it prove effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0168", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "168", "exam": "19/05/2024 S-I", "q": "Which one of the following is NOT a quality of a good assignment?", "o": ["The assignment should be commensurate with the subject taught to the student.", "Creativity should develop in the assignment and the student should be able to learn individually by doing the work.", "The assignment should be complex and difficult for students.", "The objectives of the assignment should be clear and definite."], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A good assignment is in accordance with the subject taught, has clear and definite objectives, and promotes creativity. Making an assignment very complex and difficult demotivates students and hinders the learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0169", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "169", "exam": "19/05/2024 S-I", "q": "The term 'hitch-hiking' is related to which technique?", "o": ["Peer teaching", "Debate", "Seminar", "Brainstorming"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Hitch-hiking means building on others' ideas to generate new ideas. It is a part of the brainstorming technique, where one participant helps another get a new idea; this promotes creativity and cooperative thinking.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0170", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "170", "exam": "19/05/2024 S-I", "q": "Authoritarian-level teaching is:", "o": ["Child-centred", "Experience-based", "Principal-centred", "Teacher-centred"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Authoritarian-level teaching is a traditional didactic style in which the teacher has complete control. The teaching process is teacher-centred, with students merely following instructions; it lacks creativity, participation and experience-based learning, so the child remains restricted.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0171", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "171", "exam": "09/06/2024 S-II", "q": "What is the main purpose of punishing students?", "o": ["Demonstrate authority", "Save others from doing the same", "Reform the offender", "Take revenge for what was done wrong"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In an educational context, the main purpose of punishment is to reform students and guide them towards better behaviour. Demonstrating authority, protecting others and taking revenge may be secondary reasons, but the primary goal is to reform the offender.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0172", "ch": 2, "page": 27, "ansPage": 27, "srcNo": "172", "exam": "09/06/2024 S-II", "q": "The purpose of asking the question 'If there is no electricity for a month, how will our life be affected?' is:", "o": ["To sensitise students to the judicious use of electricity", "To assess students on sources of electricity", "To promote students' imaginative and thinking skills", "To evaluate students on their general awareness"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher asking such a question tries to gauge or measure students' thinking and imagination. In classification (taxonomy), this form of evaluation occurs at the application level.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0173", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "173", "exam": "09/06/2024 S-II", "q": "The most appropriate meaning of learning is:", "o": ["Acquisition of knowledge", "Personal adjustment", "Inclusion of knowledge", "Modification of behaviour"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is a process in which behaviour is modified or changed through experience or training. Learning thus produces a relatively permanent change in capability, occurring as a result of reinforced practice.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-008", "first": false, "kind": "near", "of": "AOT-0073"}}, {"id": "AOT-0174", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "174", "exam": "09/06/2024 S-II", "q": "In teaching, experienced members guide an immature person ______.", "o": ["By spending time", "By ability (competence)", "By quality of life", "By adjustment of life"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In teaching, an experienced person guides an immature person on the basis of ability and knowledge. The option 'by adjustment of life' relates to adjusting to life, which can be one aspect of guidance but is not the main basis.", "tip": "", "status": "disputed", "note": "Same question as Q8 whose printed answer is (d) 'for adjustment of life'. Conflicting printed keys; each retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-001", "first": false, "kind": "near", "of": "AOT-0008", "keyConflict": true}}, {"id": "AOT-0175", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "175", "exam": "27/05/2024 S-I", "q": "Which of the following pairs is wrongly matched?", "o": ["Piaget - Moral development", "Maslow - Hierarchy of needs", "Thorndike - Theory X and Y", "Skinner - Programmed learning"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Piaget - moral development (Piaget also worked on moral development alongside cognitive development); Maslow - hierarchy of needs; Theory X and Y was given by Douglas McGregor (management), whereas Thorndike is known for the laws of learning (trial and error, law of effect, exercise, readiness) - so the pair is wrong; Skinner - programmed learning (Skinner developed it from operant conditioning).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0176", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "176", "exam": "27/05/2024 S-I", "q": "Which one of the following is an aim of teaching?", "o": ["To get as much fame as possible", "To promote the welfare of students to the maximum possible extent", "To teach the maximum possible number of students", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A teacher's primary and most important aim is to ensure the all-round welfare of students; it includes not only academic performance but also their social, emotional and moral development. The other options focus only on the numerical aspect or the teacher's personal gain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0177", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "177", "exam": "27/05/2024 S-I", "q": "In the 19th century, teaching was a ______ process.", "o": ["Tripolar", "Bipolar", "Unipolar", "Reliable"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the 19th century teaching was regarded mainly as a 'bipolar' process, with two main poles or components: teacher and student. The teacher was the sole provider of knowledge and the student a receiver; the role of curriculum or social environment was ignored, whereas modern education is considered tripolar.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0178", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "178", "exam": "27/05/2024 S-I", "q": "Democratic teaching means:", "o": ["Whatever the teacher teaches according to his wish, the student has to accept it", "An interactive process involving classroom talk between teacher and student", "A process requiring memory and understanding levels and working for highly reflective activity", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Democratic teaching is a process in which both teacher and student are active participants, with interactive and cooperative dialogue between them. The teacher is not merely a giver of knowledge but a guide who encourages students to think, ask questions and take part in dialogue; this increases students' thinking, creativity and critical ability.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0179", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "179", "exam": "27/05/2024 S-I", "q": "Teaching at the understanding level is based on:", "o": ["Gestalt theory", "Cognitive field theory", "M.R. theory", "Field theory"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Cognitive field theory promotes teaching based on understanding. This theory holds that students do not just memorise but learn better by understanding, analysing and linking with prior knowledge, which makes the teaching process more meaningful and lasting.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0180", "ch": 2, "page": 28, "ansPage": 28, "srcNo": "180", "exam": "27/05/2024 S-I", "q": "The correct sequence of the subgroups of the cognitive domain is:", "o": ["Knowledge, comprehension, application, synthesis, analysis, evaluation", "Knowledge, comprehension, application, evaluation, analysis, synthesis", "Knowledge, comprehension, evaluation, application, analysis, synthesis", "Knowledge, comprehension, application, analysis, synthesis, evaluation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The cognitive domain has six sequential levels that organise learning objectives, based on Bloom's classification, moving from simple to complex: first 'knowledge' (recalling information), then 'comprehension' (understanding), 'application' (using knowledge in new situations), 'analysis' (breaking information down), 'synthesis' (creating new ideas) and finally 'evaluation' (making judgements). This order is important for effective teaching and learning.", "tip": "Original Bloom order: Knowledge-Comprehension-Application-Analysis-Synthesis-Evaluation.", "status": "ok", "note": ""}, {"id": "AOT-0181", "ch": 2, "page": 29, "ansPage": 29, "srcNo": "181", "exam": "26/05/2024 S-II", "q": "In a constructivist classroom, children's cognitive engagement can be facilitated by:\n(i) Children's talk\n(ii) Emotions of a teacher\n(iii) Positive interpersonal relationships among children\n(iv) Externally imposed discipline", "o": ["(iii)", "(iv)", "(i), (ii), (iii)", "(i), (ii), (iii), (iv)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "To increase children's cognitive engagement, children's talk, the teacher's emotions and positive interpersonal relations among children matter: when children share their views openly and the teacher gives empathy and support, a positive and cooperative atmosphere forms. Externally imposed discipline hinders creative thinking, while natural dialogue and understanding encourage children's thinking.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-014", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0182", "ch": 2, "page": 29, "ansPage": 29, "srcNo": "182", "exam": "26/05/2024 S-II", "q": "Through our present examination system, which domain of objectives is mostly NOT being evaluated?", "o": ["Affective", "Cognitive", "Psychomotor", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The present examination system mainly assesses the cognitive domain, i.e. students' knowledge and understanding. The affective domain (students' attitudes, values and feelings) is generally not assessed; psychomotor skills are assessed in science or vocational courses but not widely. So the affective domain is the main aspect not evaluated.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0183", "ch": 2, "page": 29, "ansPage": 29, "srcNo": "183", "exam": "26/05/2024 S-II", "q": "The intervention needed in the classroom for creative and talented children depends on:", "o": ["The teacher's use of customised and stimulating instructional methods", "Giving them extra time", "Being affectionate towards them", "Giving them the responsibility of teaching other children"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher's intervention is needed to recognise the ability of each student, so the teacher should take active interest in meeting the needs of every type of personality; customised and stimulating instructional methods are therefore used.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0184", "ch": 2, "page": 29, "ansPage": 29, "srcNo": "184", "exam": "26/05/2024 S-II", "q": "The criticism most often made of school administration is that:", "o": ["They like to be praised", "They are very lazy", "They fail to provide leadership", "They do not know the teachers"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The most frequent criticism of school administration is that it fails to provide leadership. An effective school administrator should be able to provide leadership that motivates and directs all school members; lack of leadership makes it difficult to achieve the school's goals.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0185", "ch": 2, "page": 29, "ansPage": 29, "srcNo": "185", "exam": "26/05/2024 S-II", "q": "Introducing a problem which students have not yet been able to solve is an example of:", "o": ["Exploring", "Engaging", "Explaining", "Elaborating"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Introducing a problem that students have not yet solved is an example of exploring (investigation). Exploration is a process in which students face new problems and challenges and get the chance to find solutions using their knowledge and skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0186", "ch": 2, "page": 29, "ansPage": 29, "srcNo": "186", "exam": "26/05/2024 S-II", "q": "By whom was the classification of the cognitive domain presented?", "o": ["Benjamin S. Bloom", "Skinner", "Krathwohl", "Simpson"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The classification of the cognitive domain was presented by Benjamin S. Bloom (Bloom's taxonomy). Bloom divided learning objectives into three main domains: cognitive (knowledge, understanding, application, analysis, synthesis, evaluation), affective (receiving, responding, valuing, organising, characterisation) and psychomotor (development of physical skills and activities).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0187", "ch": 2, "page": 29, "ansPage": 30, "srcNo": "187", "exam": "26/05/2024 S-II", "q": "Both teaching and learning have the same aim, which is:", "o": ["To make the learner more intelligent", "To make the learner full of knowledge", "To bring change in the learner's behaviour", "To convey information to the learner"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The ultimate aim of both teaching and learning is positive change in the learner's behaviour; giving information or filling with knowledge is only a means. Real learning occurs when the learner applies what has been learnt in thinking, skills and actions - reflected in outlook, problem-solving and interaction with the world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0188", "ch": 2, "page": 30, "ansPage": 30, "srcNo": "188", "exam": "26/05/2024 S-II", "q": "While implementing child-centred education, which aspect of learning should be considered?", "o": ["The area of learning", "Teaching strategies that accommodate intellectual and emotional needs", "The student's social needs", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In child-centred education attention must be paid to various aspects of learning: the learning area, teaching strategies that understand children's intellectual and emotional needs, and their social needs. This adapts teaching to children's interests, abilities and social environment, ensuring all-round development and more confident participation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0189", "ch": 2, "page": 30, "ansPage": 30, "srcNo": "189", "exam": "19/06/2024", "q": "Which learning theory provides support for the active participation of the learner in the learning process in an interactional setting with intrinsic motivation as the basis?", "o": ["S-R Theory of Watson", "Reinforcement Theory of Skinner", "Constructivist Theory of Vygotsky", "Insight Theory of Kohler"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Vygotsky's constructivist theory: in the learning process it provides, as a basis for the learner's active participation, an interactional setting with intrinsic motivation. Knowledge is co-constructed and learnt from one another; Vygotsky accepted internal development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0190", "ch": 2, "page": 30, "ansPage": 30, "srcNo": "190", "exam": "19/06/2024", "q": "Sociological foundations are concerned with:", "o": ["History", "Economy", "Society", "Idea"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Sociology studies society, social structure, social relations and human behaviour. It studies various social groups, organisations and societies and how they relate. It is linked with many subjects such as anthropology, economics, philosophy, political science and psychology.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0191", "ch": 2, "page": 30, "ansPage": 30, "srcNo": "191", "exam": "19/06/2024", "q": "The objective of education is to:", "o": ["Create persons who are useful for the society", "Create learned citizens", "Create sensible citizens", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Education is a process concerned with effective transfer of knowledge and skills; it limits or increases the ways by which learners absorb concepts and ideas. Other objectives: create persons useful for society, create learned citizens, create sensible citizens, and develop self-confidence in students.", "tip": "", "status": "note", "note": "The book adds a note that the (official) answer was taken as option (b), which the book considers wrong, and gives (d). Printed answer (d) retained; official key (b) recorded here for review."}, {"id": "AOT-0192", "ch": 2, "page": 30, "ansPage": 30, "srcNo": "192", "exam": "19/06/2024", "q": "The intervention needed for creative and talented children in the classroom rests on:", "o": ["Use of customised and stimulating instructional methods by the teacher", "Giving extra time to them", "Being affectionate towards them", "Giving them the responsibility of teaching other children"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Creative and talented children show high performance in many fields such as arts, creative work, leadership quality and power of observation. The intervention needed for them in the classroom rests on the teacher's use of customised and stimulating instructional methods.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0193", "ch": 2, "page": 30, "ansPage": 30, "srcNo": "193", "exam": "19/06/2024", "q": "Which of the following is a characteristic of the conceptual approach?", "o": ["In this approach, things are learnt in a very detailed form regarding their principles, mechanism, application, etc.", "Different skills are used in order to learn new things", "It leads to better learning in a child", "It involves all cognitive, affective and psychomotor domains"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The conceptual approach stresses understanding basic ideas and concepts rather than memorising separate facts. It helps students develop a deep understanding of a subject, focusing on big ideas and generalisations; things are learnt in detail regarding principles, techniques and applications.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0194", "ch": 2, "page": 31, "ansPage": 31, "srcNo": "194", "exam": "19/06/2024", "q": "What questions would you ask Nelson Mandela in an interview? What level of Bloom's Taxonomy is this question?", "o": ["Application", "Evaluation", "Analysis", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "This question motivates students to prepare questions for an interview, applying their knowledge about Nelson Mandela in a practical way. Application means using learnt information in new situations; preparing relevant questions to show understanding is an exercise of it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0195", "ch": 2, "page": 31, "ansPage": 31, "srcNo": "195", "exam": "19/06/2024", "q": "Which of the following levels of teaching requires more active participation and more imaginative and creative thinking?", "o": ["Reflective level", "Memory level", "Understanding level", "All levels"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The reflective level of teaching needs more active participation, imagination and creative thinking. This level is problem-centred: the learner participates actively in learning, uses imagination and solves problems creatively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0196", "ch": 2, "page": 31, "ansPage": 31, "srcNo": "196", "exam": "29/05/2024 S-I", "q": "Cognitive engagement of children within a constructivist classroom can be facilitated by:\n(i) Children's talk\n(ii) Emotions of a teacher\n(iii) Positive interpersonal relationships among children\n(iv) Externally imposed discipline", "o": ["(iii)", "(iv)", "(i), (ii), (iii)", "(i), (ii), (iv)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Cognitive engagement is facilitated by children's talk, the teacher's emotions and positive interpersonal relationships among children, which promote cognitive engagement, while externally imposed discipline reduces it.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-014", "first": false, "kind": "near", "of": "AOT-0181"}}, {"id": "AOT-0197", "ch": 2, "page": 31, "ansPage": 31, "srcNo": "197", "exam": "29/05/2024 S-I", "q": "In which year was the term 'Information Seeking' coined by T. D. Wilson?", "o": ["1991", "1981", "1960", "1970"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The term 'information seeking' was coined by T. D. Wilson in 1981. Wilson proposed a theory of information behaviour that includes all aspects of human information behaviour, whether active or passive. Information-seeking behaviour is the act of actively searching for information to answer a specific question.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0198", "ch": 2, "page": 31, "ansPage": 31, "srcNo": "198", "exam": "29/05/2024 S-I", "q": "The American approach emphasises:", "o": ["Teacher", "Content presentation", "Learning objectives", "Methods"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The American approach emphasises 'learning objectives'. In the American education system, learning objectives are kept at the centre of curriculum and teaching plans, ensuring what students are expected to learn and how teachers determine whether students reach those objectives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0199", "ch": 2, "page": 31, "ansPage": 32, "srcNo": "199", "exam": "29/05/2024 S-I", "q": "'Defend the actions of the main character.' What level of Bloom's Taxonomy is this?", "o": ["Evaluation", "Comprehension", "Analysis", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For this question students must evaluate the character's actions, take decisions and argue to justify them. This is higher-order thinking, matching the evaluation level in Bloom's classification.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0200", "ch": 2, "page": 32, "ansPage": 32, "srcNo": "200", "exam": "29/05/2024 S-I", "q": "A teacher never gives answers to questions herself. She encourages her students to suggest answers, have group discussions and adopt collaborative learning. This approach is based on the principle of:", "o": ["Proper organisation of instructional material", "Setting a good example and being a role-model", "Setting a good example and being a role-model [printed in English; Hindi text reads 'readiness to learn']", "Active participation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "This approach is based on active participation and cooperative learning: the teacher acts as a guide who encourages students to take part actively in their learning by exploring, discussing and cooperating. So the correct answer is active participation.", "tip": "", "status": "note", "note": "Option (c): English text duplicates option (b) while the Hindi text says 'readiness to learn'. Answer unaffected. Same question as Q126."}, {"id": "AOT-0201", "ch": 2, "page": 32, "ansPage": 32, "srcNo": "201", "exam": "16/06/2024 S-III", "q": "How many types of lesson plan are there on the basis of taxonomies?", "o": ["3", "4", "2", "5"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Lesson plans on the basis of taxonomy (Bloom's classification) are mainly of 3 types (as printed: Bloom, Flink and Solo), based on the cognitive (knowledge, understanding), affective (values-attitudes) and psychomotor (physical skills) domains. Each type focuses on specific learning objectives and outcomes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0202", "ch": 2, "page": 32, "ansPage": 32, "srcNo": "202", "exam": "16/06/2024 S-III", "q": "If students construct a model to show how something works, they are:", "o": ["Evaluating", "Applying", "Synthesising", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If students create a model to show that something works, they apply their knowledge and understanding in a practical way. Application is the demonstration of learned knowledge in real life, and shows the application level of Bloom's taxonomy.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0203", "ch": 2, "page": 32, "ansPage": 32, "srcNo": "203", "exam": "16/06/2024 S-III", "q": "An objective related to the affective domain is:", "o": ["Student can paint a picture", "Student can draw a graph", "Student values honesty", "Student can write a letter"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An objective related to the affective domain is 'student values honesty'. It is related to students' values, attitudes and feelings and helps develop them socially and morally. The affective domain has levels such as receiving, responding, valuing, organising and characterisation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0204", "ch": 2, "page": 32, "ansPage": 32, "srcNo": "204", "exam": "16/06/2024 S-III", "q": "Consider the following statements:\nI. This method is like the process of deduction wherein you cut down a bigger concept into smaller ones.\nII. The knowledge achieved by this method is permanent.\nThe above given statements are referred to which method of teaching?", "o": ["Synthesis", "Analysis", "Deductive", "Inductive"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The process of breaking a big concept into small parts is called analysis. The method systematically divides a complex concept to make it easy to understand; it helps students understand each component in depth and then join them to form a clear picture of the whole concept.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-015", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0205", "ch": 2, "page": 32, "ansPage": 32, "srcNo": "205", "exam": "18/05/2024 S-III", "q": "The stage in problem solving that includes the preparation of a suitable hypothesis for investigation is:", "o": ["Survey", "Planning for action", "Problem description", "Discussion"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In problem solving, 'formulating the hypothesis' is the most important step, which falls under 'plan of action'. It is a teacher's/learner's estimate of a possible solution of the problem, on which the strategy of investigation is built (e.g. 'if plants get more sunlight they will grow faster'; to test this we plan an experiment). The other options relate to different stages.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0206", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "206", "exam": "18/05/2024 S-III", "q": "At the knowledge level, students will:", "o": ["Argue the point", "Recall information", "Categorise topics", "Calculate distance"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In Bloom's taxonomy, knowledge is the most basic cognitive skill, involving recall of facts, terms or basic concepts. At this level students identify information rather than analyse or apply it; the other options relate to higher-order thinking.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0207", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "207", "exam": "18/05/2024 S-III", "q": "The educational objective of the pre-active phase of teaching is:", "o": ["Action and reaction", "Reinforcement and feedback", "Selection of the most appropriate techniques of evaluation", "To define educational aims"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main objective of the pre-active phase of teaching is to define educational aims. In it the teacher decides the curriculum, teaching methods and evaluation strategies. This phase relates to lesson planning, while feedback, reinforcement and evaluation come after the teaching steps.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0208", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "208", "exam": "14/06/2024 S-III", "q": "The psychomotor domain deals with:", "o": ["Feelings", "Practical skills", "Intellectual abilities", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The psychomotor domain is the dimension of human learning concerned with physical activities, coordination and the development of motor skills. It is linked with acquiring skills through direct practice and with gaining proficiency in practical skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0209", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "209", "exam": "14/06/2024 S-III", "q": "The activity portion of the lesson plan according to Bloom's Taxonomy is ______.", "o": ["Creating", "Analysing", "Applying", "Evaluating"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Bloom's taxonomy, the activity portion of the lesson plan is 'applying'; it shows that the lesson plan's activity part gives students the opportunity to use what they have learnt.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0210", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "210", "exam": "14/06/2024 S-III", "q": "'Design challenges' is an example of:", "o": ["Explore", "Engage", "Elaborate", "Evaluate"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to the taxonomy, design challenges are an example of 'elaborate', which refers to developing ideas and knowing them in depth.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0211", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "211", "exam": "14/06/2024 S-III", "q": "If a student gives a visual presentation on an updated version or angle connected to a topic, he or she is:", "o": ["Comprehending", "Applying", "Synthesising", "Analysing"], "key": {"printed": [3], "verified": [2], "official": null}, "e": "The printed explanation says that when a student gives a visual presentation on an updated version or angle linked to a topic, the student is synthesising: synthesis means combining different ideas or elements to make a new understanding or perspective, and shows the ability to create something new and unique.", "tip": "", "status": "disputed", "note": "Printed answer letter (d) Analysing contradicts the printed explanation, which says 'synthesis' (option c). Printed (d) retained as key; verified answer (c)."}, {"id": "AOT-0212", "ch": 2, "page": 33, "ansPage": 33, "srcNo": "212", "exam": "14/06/2024 S-III", "q": "The lowest level of learning in the affective domain is:", "o": ["Responding", "Valuing", "Attending", "Organisation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The affective domain, part of Bloom's taxonomy, relates to feelings, attitudes and values; its levels are arranged in a hierarchy from lowest to highest. Attending (receiving) means being aware of and willing to attend to a specific event or activity - the first step of affective development - followed by responding, valuing, organising and finally characterisation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0213", "ch": 2, "page": 33, "ansPage": 34, "srcNo": "213", "exam": "19/05/2024 S-III", "q": "Educational objectives are arranged from simple to complex. Why is this?", "o": ["Each level is built on, and assumes acquisition of, skills from the previous level", "Objectives are broad and value-laden statements that lead to the philosophy of education", "Be idealistic and ambitious with a grandiose scheme for using taxonomy at all levels", "These are guidelines to be taught and learned, where teachers and students evaluate learning"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Educational objectives are arranged from simple to complex because each level is built on the acquisition of skills from the previous level. This sequential development ensures that students find it easy to understand newer and more complex concepts based on the knowledge learnt earlier.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0214", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "214", "exam": "19/05/2024 S-III; 14/09/2020 S-I", "q": "Which domain of Bloom's taxonomy is related to objectives such as receiving, responding, valuing, etc.?", "o": ["Affective domain", "Psychomotor domain", "Cognitive domain", "Process domain"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In Bloom's classification, the affective domain relates to feelings, values and interests. It includes aspects such as students' motivation, empathy and social skills. This domain centres on a person's emotional development and inner values, producing desirable change in behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0215", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "215", "exam": "19/05/2024 S-III; 15/09/2023 S-I; 14/09/2020 S-I", "q": "The highest level of learning in the cognitive domain is:", "o": ["Evaluation", "Synthesis", "Analysis", "Application"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the original Bloom classification the highest level of learning in the cognitive domain is evaluation: judging, critiquing and justifying information. It goes beyond merely knowing facts and shows the ability to make decisions and judge value.", "tip": "", "status": "note", "note": "Printed explanation attributes this to Bloom's 'revised version'; in the revised taxonomy (2001) 'Creating' is the top level. Answer (a) is correct for the original 1956 taxonomy."}, {"id": "AOT-0216", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "216", "exam": "05/09/2023 S-III", "q": "Teaching is a reciprocal (interactive) activity:", "o": ["Between teacher and guardian", "Between teacher and student", "Between student and subject matter", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teaching is a mutual activity in which teacher and student exchange knowledge, skills, behaviour and attitudes. The student gets knowledge and skills in this process, with dialogue and cooperation between both parties.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0217", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "217", "exam": "05/09/2023 S-II", "q": "Which teaching emphasises the overall development of the learner?", "o": ["Subject-centred teaching", "Learner-centred teaching", "Activity-centred teaching", "Integrated teaching"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Learner-centred teaching emphasises overall development: it is centred on the individual and all-round development of the student and includes assessing the student's performance in both academic and non-academic areas.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0218", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "218", "exam": "05/09/2023 S-II", "q": "In the new version of Bloom's taxonomy, 'synthesis' was replaced by:", "o": ["Blending", "Creating", "Coherent", "Mixing"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the new (revised) version of Bloom's taxonomy, synthesis was replaced by creating (construction). The concept of creating is considered broader and more expansive; it concerns not just putting knowledge together but also making new designs.", "tip": "Revised Bloom: Remember-Understand-Apply-Analyse-Evaluate-Create.", "status": "ok", "note": ""}, {"id": "AOT-0219", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "219", "exam": "05/09/2023 S-III", "q": "Teaching is:", "o": ["Attending to the needs of the learner", "Handing the result over to the learner", "Preparing a living library", "Convincing the learner without evidence"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teaching is learner-centred, and teachers impart education according to the interests and needs of students. Teaching means to educate, give knowledge; it is a tri-polar process involving teacher, student and curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0220", "ch": 2, "page": 34, "ansPage": 34, "srcNo": "220", "exam": "05/09/2023 S-III", "q": "The dependent variable of teaching is:", "o": ["Learner", "Teacher", "Principal", "Guardian"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The dependent variable of teaching is the learner. Teaching is a tri-polar process in which teacher and learner reach their form through the curriculum, and the teacher's success depends on the learner's ability to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0221", "ch": 2, "page": 34, "ansPage": 35, "srcNo": "221", "exam": "05/09/2023 S-I", "q": "Teachers become popular among students when they:", "o": ["Give good grades", "Take classes with extra tuition fees", "Help students solve their problems", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teachers are popular among students when they help them solve their problems. A teacher's rich knowledge and cordial personality are the basis of harmonious relations; teachers are friends, philosophers and guides to students, and a friendly environment can easily be created by a teacher in any context.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0222", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "222", "exam": "05/09/2023 S-I", "q": "The most challenging aspect of teaching is:", "o": ["Preparing question papers", "Making teaching interesting", "Evaluating students", "Maintaining discipline"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The most important aspect of teaching is making it enjoyable and interesting. It is a challenging task for a teacher to make the teaching-learning process more enjoyable and accessible by organising various teaching activities and using new teaching aids.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0223", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "223", "exam": "05/09/2023 S-I", "q": "The effectiveness of teaching is assessed on the basis of:", "o": ["Curriculum coverage", "Students' interest", "Use of teaching aids", "Learning outcomes"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning outcomes are the most appropriate criterion for measuring teaching effectiveness. Evaluation is a continuous process necessary to help teachers and learners improve teaching and learning. Teaching effectiveness means the teacher carrying out teaching activities in an effective way.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0224", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "224", "exam": "05/09/2023 S-I", "q": "The teacher's attitude towards objectives is:", "o": ["To know the specific objectives of the subject", "To implement the plan on time", "To decide the activities", "All of the above"], "key": {"printed": [3], "verified":
