    $('#startBtn').disabled = pool.length === 0;
  }

  async function onStart() {
    const { S, pool, n, minutes } = plan();
    if (!pool.length) return;
    if (store.session && !(await confirmDialog({ title: 'Replace the test in progress?', body: 'Starting a new test will discard the unfinished one.', ok: 'Start new test', danger: true }))) return;
    const qids = L.pickQuestions(pool, { count: n, random: S.random });
    beginSession({ mode: S.mode, keyMode: S.keyMode, minutes, marksC: S.marksC, marksN: S.marksN, qids });
  }
  function beginSession(o) {
    const now = Date.now();
    store.session = {
      id: 'T' + now.toString(36), startedAt: now, mode: o.mode, keyMode: o.keyMode,
      durationSec: o.mode === 'mock' ? o.minutes * 60 : null, endAt: o.mode === 'mock' ? now + o.minutes * 60000 : null,
      marks: { c: o.marksC, n: o.marksN }, qids: o.qids, idx: 0, resp: {}, vis: {}, mark: {}, revealed: {}, done: false,
    };
    save(); renderTest({ focusQ: true });
  }
  function resumeTest() {
    const s = store.session;
    if (s.endAt && Date.now() >= s.endAt) { submitTest('timeout'); return; }
    renderTest({ focusQ: true });
  }
  async function discardSession() {
    if (await confirmDialog({ title: 'Discard this test?', body: 'Your answers in the unfinished test will be lost.', ok: 'Discard', danger: true })) { store.session = null; save(); renderDashboard(); }
  }
  async function resetAll() {
    if (!(await confirmDialog({ title: 'Reset all progress?', body: 'This clears your attempts, results and settings stored in this browser. The question bank is not affected. Export first if you want a backup.', ok: 'Reset progress', danger: true }))) return;
    store = freshStore(); save(); renderDashboard(); say('Progress reset.');
  }
  function exportProgress() {
    download('aot_progress_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app: 'aot-cbt', version: 1, exportedAt: new Date().toISOString(), store }), 'application/json');
  }
  function importProgress(ev) {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let obj;
      try { obj = JSON.parse(r.result); } catch (e) { obj = null; }
      if (!obj || obj.app !== 'aot-cbt' || !obj.store) { await confirmDialog({ title: 'Could not import', body: 'This file is not an exported progress file from this app.', hideCancel: true }); return; }
      if (await confirmDialog({ title: 'Replace current progress?', body: 'Importing replaces the progress stored in this browser with the contents of the file.', ok: 'Import', danger: true })) {
        store = normalizeStore(obj.store); save(); renderDashboard(); say('Progress imported.');
      }
    };
    r.readAsText(f);
  }

  /* ================= TEST ================= */
  const sess = () => store.session;
  const curQ = () => byId.get(sess().qids[sess().idx]);

  function renderTest(opts) {
    opts = opts || {};
    const s = sess();
    show('test');
    const root = $('#view-test');
    const q = curQ();
    s.vis[q.id] = true;
    document.title = `Q${s.idx + 1}/${s.qids.length} – Art of Teaching Mock`;
    const practice = s.mode === 'practice';
    const revealed = practice && s.revealed[q.id];
    const keys = L.keysFor(q, s.keyMode);
    const chosen = s.resp[q.id];
    const sections = [...new Set(s.qids.map((id) => byId.get(id).ch))];

    // top bar
    const right = $('#topbar-right');
    right.append(practice ? h('span', { class: 'pill' }, 'Practice mode – no timer') : h('span', { class: 'timer', id: 'timer', role: 'timer', 'aria-label': 'Time remaining' }, '--:--'),
      h('button', { class: 'btn small', onclick: () => submitTest('manual') }, 'Submit Test'));

    const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Chapters in this test' }, sections.map((c) => {
      const cnt = s.qids.filter((id) => byId.get(id).ch === c).length;
      return h('button', { class: 'tab', role: 'tab', 'aria-selected': String(c === q.ch), title: chapterById.get(c).name, onclick: () => go(s.qids.findIndex((id) => byId.get(id).ch === c)) }, `Ch ${c} (${cnt})`);
    }));

    const optList = h('ul', { class: 'opts', role: 'radiogroup', 'aria-labelledby': 'qtext' }, q.o.map((o, i) => {
      const isSel = chosen === i;
      const cls = 'opt' + (isSel ? ' sel' : '') + (revealed ? ' locked' + (keys.includes(i) ? ' right' : isSel ? ' wrong' : '') : '');
      const tag = revealed ? (keys.includes(i) ? '✓ Correct' : isSel ? '✗ Your answer' : '') : '';
      return h('li', null, h('label', { class: cls },
        h('input', { type: 'radio', name: 'opt', id: 'opt-' + i, value: i, checked: isSel, disabled: revealed, onchange: () => choose(i) }),
        h('span', { class: 'ol' }, L.LETTERS[i] + '.'), h('span', null, o), tag ? h('span', { class: 'tag' }, tag) : null));
    }));

    const marked = !!s.mark[q.id];
    const last = s.idx === s.qids.length - 1;
    const actions = h('div', { class: 'actions' },
      h('button', { class: 'btn', disabled: s.idx === 0, onclick: () => go(s.idx - 1) }, 'Previous'),
      h('button', { class: 'btn review grow', onclick: markNext }, marked ? 'Unmark & Next' : 'Mark for Review & Next'),
      h('button', { class: 'btn', disabled: chosen === undefined, onclick: clearResp }, 'Clear Response'),
      h('button', { class: 'btn success grow', onclick: saveNext }, last ? 'Save' : 'Save & Next'));

    const card = h('div', { class: 'card' },
      h('div', { class: 'qhead' },
        h('span', { class: 'qnum' }, `Question ${s.idx + 1} of ${s.qids.length}`),
        h('span', { class: 'qmeta' }, `Ch ${q.ch} · ${q.id} · PDF p.${q.page} · source Q${q.srcNo}`)),
      h('div', { class: 'qtext', id: 'qtext', tabindex: '-1' }, q.q),
      optList,
      revealed ? feedbackBlock(q, keys, chosen) : null,
      actions);

    root.replaceChildren(tabs, h('div', { class: 'test-layout' }, card, paletteBlock(s, q)));
    if (!practice) startTimer();
    if (opts.focusQ) $('#qtext').focus({ preventScroll: false });
    else if (opts.focusOpt != null && !revealed) { const el = $('#opt-' + opts.focusOpt); if (el) el.focus(); }
    else if (revealed && opts.focusFeedback) { const f = $('#feedback'); if (f) f.focus(); }
  }

  function keyText(q, idxs) { return idxs.map((i) => `(${L.LETTERS[i]}) ${q.o[i]}`).join(' or '); }
  function feedbackBlock(q, keys, chosen) {
    const ok = keys.includes(chosen);
    const differs = JSON.stringify(q.key.printed) !== JSON.stringify(q.key.verified) || q.key.official != null;
    return h('div', { class: 'feedback ' + (ok ? 'good' : 'badf'), id: 'feedback', tabindex: '-1', role: 'status' },
      h('h3', null, ok ? 'Correct' : 'Incorrect – correct answer: ' + keyText(q, keys)),
      differs ? h('p', { class: 'hint' },
        `Book's printed key: ${q.key.printed.length ? keyText(q, q.key.printed) : 'none printed'}. Verified answer: ${keyText(q, q.key.verified)}.`
        + (q.key.official != null ? ` Answer the exam body accepted (per the book): ${keyText(q, [q.key.official])}.` : '')) : null,
      h('p', null, h('strong', null, 'Explanation: '), q.e),
      q.tip ? h('p', null, h('strong', null, 'Tip: '), q.tip) : null,
      q.note ? h('div', { class: 'flagnote' }, h('strong', null, 'Review note: '), q.note) : null);
  }

  function paletteBlock(s, cur) {
    const c = L.countStatuses(s);
    const legend = h('div', { class: 'legend' },
      ...[['nv', 'Not Visited'], ['na', 'Not Answered'], ['a', 'Answered'], ['m', 'Marked for Review'], ['am', 'Answered & Marked']].map(([k, t]) =>
        h('div', null, h('span', { class: 'sw pq ' + k }, c[k]), h('span', null, t))));
    const order = [...new Set(s.qids.map((id) => byId.get(id).ch))];
    const groups = order.map((ch) => {
      const idxs = s.qids.map((id, i) => i).filter((i) => byId.get(s.qids[i]).ch === ch);
      const grid = h('div', { class: 'pgrid', role: 'group', 'aria-label': 'Chapter ' + ch + ' questions' }, idxs.map((i) => {
        const st = L.statusOf(s, s.qids[i]);
        return h('button', { class: 'pq ' + st + (i === s.idx ? ' cur' : ''), 'aria-label': `Question ${i + 1}, ${STATUS_LABEL[st]}`, 'aria-current': i === s.idx ? 'true' : null, onclick: () => go(i) }, String(i + 1));
      }));
      return h('div', { class: 'pgroup' }, h('div', { class: 'pal-title' }, `Ch ${ch}: ${chapterById.get(ch).name}`), grid);
    });
    const pal = h('aside', { class: 'pal' + (paletteOpen ? ' open' : ''), 'aria-label': 'Question palette' },
      h('button', { class: 'btn pal-toggle', 'aria-expanded': String(paletteOpen), onclick: (e) => { paletteOpen = !paletteOpen; pal.classList.toggle('open', paletteOpen); e.currentTarget.setAttribute('aria-expanded', String(paletteOpen)); } },
        `Question palette – ${c.a + c.am} of ${s.qids.length} answered`),
      h('div', { class: 'pal-body' }, legend,
        ...groups,
        h('div', { class: 'btn-row', style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: () => submitTest('manual') }, 'Submit Test'))));
    return pal;
  }
  let paletteOpen = false;

  function go(i) { const s = sess(); if (i < 0 || i >= s.qids.length) return; s.idx = i; save(); renderTest({ focusQ: true }); }
  function choose(i) {
    const s = sess(), q = curQ();
    s.resp[q.id] = i;
    if (s.mode === 'practice') s.revealed[q.id] = true;
    save(); renderTest({ focusOpt: i, focusFeedback: true });
  }
  function clearResp() {
    const s = sess(), q = curQ();
    delete s.resp[q.id]; delete s.revealed[q.id];
    save(); renderTest({ focusQ: true }); say('Response cleared.');
  }
  function saveNext() {
    const s = sess();
    if (s.idx < s.qids.length - 1) go(s.idx + 1);
    else say('This is the last question. Use Submit Test when you are done.');
  }
  function markNext() {
    const s = sess(), q = curQ();
    if (s.mark[q.id]) delete s.mark[q.id]; else s.mark[q.id] = true;
    save();
    if (s.idx < s.qids.length - 1) go(s.idx + 1); else renderTest({ focusQ: true });
  }

  let lastSaid = null;
  function startTimer() {
    stopTimer();
    const s = sess();
    if (!s || s.endAt == null) return;
    const t = $('#timer');
    const tick = () => {
      const rem = Math.ceil((s.endAt - Date.now()) / 1000);
      if (t) { t.textContent = L.fmtTime(rem); t.className = 'timer' + (rem <= 60 ? ' crit' : rem <= 300 ? ' warn' : ''); }
      if (rem <= 0) { stopTimer(); submitTest('timeout'); return; }
      if (rem % 300 === 0 && rem !== lastSaid) { lastSaid = rem; say(`${rem / 60} minutes remaining.`); }
    };
    tick();
    timerId = setInterval(tick, 500);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && timerId && sess() && sess().endAt && Date.now() >= sess().endAt) submitTest('timeout'); });

  async function submitTest(reason) {
    const s = sess();
    if (!s || submitting) return;
    if (reason === 'timeout') { const d = $('#dlg'); if (d.open) d.close('cancel'); }
    else {
      const c = L.countStatuses(s);
      const left = s.endAt ? Math.max(0, Math.round((s.endAt - Date.now()) / 1000)) : null;
      const ok = await confirmDialog({
        title: 'Submit test?',
        body: [h('div', { class: 'sumgrid' },
          h('span', null, 'Total questions'), h('b', null, s.qids.length),
          h('span', null, 'Answered'), h('b', null, c.a + c.am),
          h('span', null, 'Not answered'), h('b', null, c.na + c.nv + c.m),
          h('span', null, 'Marked for review'), h('b', null, c.m + c.am),
          left != null ? h('span', null, 'Time left') : null, left != null ? h('b', null, L.fmtTime(left)) : null),
          h('p', { class: 'hint', style: 'margin-top:8px' }, 'You cannot change answers after submitting.')],
        ok: 'Submit test', danger: true,
      });
      if (!ok || !sess() || sess().id !== s.id) return;
    }
    submitting = true;
    try {
      stopTimer();
      s.done = true; s.submittedAt = Date.now(); s.reason = reason;
      const copy = JSON.parse(JSON.stringify(s));
      store.history.unshift(copy);
      store.history.length = Math.min(store.history.length, HISTORY_MAX);
      const ev = L.evaluate(copy, byId, copy.keyMode);
      for (const r of ev.rows) if (r.attempted) { const p = store.attempted[r.q.id]; store.attempted[r.q.id] = { n: (p ? p.n : 0) + 1, c: r.correct ? 1 : 0 }; }
      store.session = null;
      save();
      showResult(copy.id, reason === 'timeout' ? 'Time is up – your test was submitted automatically.' : '');
    } finally { submitting = false; }
  }

  /* ================= RESULT ================= */
  let resultView = { id: null, filter: 'all', keyMode: null };
  function showResult(id, notice) {
    const x = store.history.find((e) => e.id === id);
    if (!x) { renderDashboard(); return; }
    if (resultView.id !== id) resultView = { id, filter: 'all', keyMode: x.keyMode };
    renderResult(notice);
  }
  function renderResult(notice) {
    show('result');
    const x = store.history.find((e) => e.id === resultView.id);
    const ev = L.evaluate(x, byId, resultView.keyMode);
    const root = $('#view-result');
    document.title = 'Results – Art of Teaching Mock';
    const spent = Math.max(0, Math.round((x.submittedAt - x.startedAt) / 1000));
    const timeTaken = x.durationSec ? Math.min(spent, x.durationSec) : spent;
    const { weak, untouched } = L.weakChapters(ev.perChapter);
    const incorrectRows = ev.rows.filter((r) => r.attempted && !r.correct);
    const disputedInTest = ev.rows.filter((r) => JSON.stringify(r.q.key.printed) !== JSON.stringify(r.q.key.verified)).length;

    const filters = [
      ['all', 'All', ev.rows.length], ['incorrect', 'Incorrect', incorrectRows.length],
      ['unattempted', 'Unattempted', ev.unattempted], ['marked', 'Marked for review', ev.rows.filter((r) => r.marked).length], ['correct', 'Correct', ev.correct]];
    const shown = ev.rows.filter((r) => ({ all: true, incorrect: r.attempted && !r.correct, unattempted: !r.attempted, marked: r.marked, correct: r.correct })[resultView.filter]);

    root.replaceChildren(...[
      h('h1', null, 'Your results'),
      notice ? h('div', { class: 'notice warn', role: 'status' }, notice) : null,
      h('p', { class: 'hint' }, `${x.mode === 'mock' ? 'Full mock test' : 'Practice test'} · submitted ${new Date(x.submittedAt).toLocaleString()}`),
      h('div', { class: 'score-hero' },
        stat2(`${ev.score} / ${ev.maxScore}`, 'Score', 'big'),
        stat2(pct(ev.accuracy), 'Accuracy (of attempted)', 'big'),
        stat2(ev.total, 'Total questions'), stat2(ev.attempted, 'Attempted'), stat2(ev.unattempted, 'Unattempted'),
        stat2(ev.correct, 'Correct', 'good-t'), stat2(ev.incorrect, 'Incorrect', 'bad-t'), stat2(L.fmtTime(timeTaken), 'Time taken')),
      h('div', { class: 'card', style: 'margin-bottom:12px' },
        h('div', { class: 'inline' },
          h('div', { class: 'field', style: 'margin:0' }, h('label', { for: 'rkey' }, 'Answer key used for scoring'),
            h('select', { id: 'rkey', onchange: (e) => { resultView.keyMode = e.target.value; renderResult(); } },
              h('option', { value: 'printed', selected: resultView.keyMode === 'printed' }, "Book's printed key"),
              h('option', { value: 'verified', selected: resultView.keyMode === 'verified' }, 'Verified key'))),
          h('span', { class: 'hint' }, `Marks: +${x.marks.c} per correct, −${x.marks.n} per wrong. ${disputedInTest} question${disputedInTest === 1 ? '' : 's'} in this test have a printed key that differs from the verified answer; switch the key to see the effect.`))),
      h('div', { class: 'card', style: 'margin-bottom:12px' },
        h('h2', null, 'Chapter-wise performance'),
        h('div', { class: 'table-wrap' }, h('table', null,
          h('thead', null, h('tr', null, h('th', null, 'Chapter'), h('th', { class: 'num' }, 'Qs'), h('th', { class: 'num' }, 'Attempted'), h('th', { class: 'num' }, 'Correct'), h('th', { class: 'num' }, 'Wrong'), h('th', { class: 'num' }, 'Skipped'), h('th', { class: 'num' }, 'Marks'), h('th', null, 'Accuracy'))),
          h('tbody', null, Object.values(ev.perChapter).sort((a, b) => a.ch - b.ch).map((c) => h('tr', null,
            h('td', null, `Ch ${c.ch}. ${chapterById.get(c.ch).name}`), h('td', { class: 'num' }, c.total), h('td', { class: 'num' }, c.attempted), h('td', { class: 'num' }, c.correct), h('td', { class: 'num' }, c.incorrect), h('td', { class: 'num' }, c.unattempted), h('td', { class: 'num' }, c.marks),
            h('td', null, c.accuracy == null ? h('span', { class: 'hint' }, 'not attempted') : h('div', { class: 'inline', style: 'gap:8px' }, h('div', { class: 'bar' + (c.accuracy < L.WEAK_ACCURACY ? ' weak' : ''), style: 'width:90px' }, h('i', { style: `width:${c.accuracy}%` })), pct(c.accuracy)))))))),
        h('h3', { style: 'margin-top:14px' }, 'Recommended chapters for revision'),
        weak.length || untouched.length
          ? h('ul', null,
            weak.map((c) => h('li', null, h('strong', null, `Ch ${c.ch}. ${chapterById.get(c.ch).name}`), ` – accuracy ${pct(c.accuracy)} (below ${L.WEAK_ACCURACY}%)`)),
            untouched.map((c) => h('li', null, `Ch ${c.ch}. ${chapterById.get(c.ch).name}`, h('span', { class: 'hint' }, ' – no question attempted'))))
          : h('p', null, `No weak chapters: every attempted chapter is at or above ${L.WEAK_ACCURACY}% accuracy.`),
        h('div', { class: 'btn-row', style: 'margin-top:10px' },
          h('button', { class: 'btn primary', disabled: !incorrectRows.length, onclick: () => reattempt(incorrectRows.map((r) => r.q.id), x) }, `Reattempt incorrect questions (${incorrectRows.length})`),
          h('button', { class: 'btn', onclick: () => chapterPractice(weak.length ? weak : Object.values(ev.perChapter)) }, 'Chapter-wise practice'),
          h('button', { class: 'btn', onclick: renderDashboard }, 'Back to dashboard'))),
      h('h2', null, 'Question review'),
      h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter questions' }, filters.map(([k, t, n]) =>
        h('button', { class: 'chip', 'aria-pressed': String(resultView.filter === k), onclick: () => { resultView.filter = k; renderResult(); } }, `${t} (${n})`))),
      shown.length ? shown.map((r) => reviewCard(r)) : h('p', { class: 'hint' }, 'No questions in this filter.')].flat(Infinity).filter(Boolean));
  }
  const stat2 = (v, label, cls) => h('div', { class: 'stat' }, h('b', { class: cls || '' }, String(v)), h('span', null, label));

  function reviewCard(r) {
    const q = r.q;
    const st = !r.attempted ? ['Unattempted', 'un'] : r.correct ? ['Correct', 'ok'] : ['Incorrect', 'bad'];
    const differs = JSON.stringify(q.key.printed) !== JSON.stringify(q.key.verified) || q.key.official != null;
    return h('article', { class: 'card rcard' },
      h('div', { class: 'qhead' },
        h('span', null, h('span', { class: 'qnum' }, `Q${r.n}`), ' ', h('span', { class: 'badge ' + st[1] }, st[0]), r.marked ? h('span', { class: 'badge mk' }, 'Marked') : null, q.status === 'disputed' || q.status === 'missing' ? h('span', { class: 'badge wn' }, 'Key under review') : null),
        h('span', { class: 'qmeta' }, `Ch ${q.ch} · ${q.id} · PDF p.${q.page} · source Q${q.srcNo}`)),
      h('div', { class: 'qtext' }, q.q),
      h('ul', { class: 'opts' }, q.o.map((o, i) => {
        const right = r.keys.includes(i), mine = r.chosen === i;
        return h('li', null, h('div', { class: 'opt locked' + (right ? ' right' : mine ? ' wrong' : '') },
          h('span', { class: 'ol' }, L.LETTERS[i] + '.'), h('span', null, o),
          h('span', { class: 'tag' }, [right ? '✓ Correct' : '', mine ? (right ? '(your answer)' : '✗ Your answer') : ''].filter(Boolean).join(' '))));
      })),
      h('p', { style: 'margin-top:8px' }, h('strong', null, 'Your answer: '), r.attempted ? `(${L.LETTERS[r.chosen]}) ${q.o[r.chosen]}` : 'not attempted', ' · ', h('strong', null, 'Correct answer: '), keyText(q, r.keys)),
      differs ? h('p', { class: 'hint' }, `Book's printed key: ${q.key.printed.length ? keyText(q, q.key.printed) : 'none printed'}. Verified answer: ${keyText(q, q.key.verified)}.` + (q.key.official != null ? ` Answer the exam body accepted (per the book): ${keyText(q, [q.key.official])}.` : '')) : null,
      h('p', null, h('strong', null, 'Explanation: '), q.e),
      q.tip ? h('p', null, h('strong', null, 'Tip: '), q.tip) : null,
      q.note ? h('div', { class: 'flagnote' }, h('strong', null, 'Review note: '), q.note) : null);
  }

  function reattempt(ids, from) {
    if (store.session) { confirmDialog({ title: 'Finish or discard your current test first', body: 'You have an unfinished test. Resume or discard it from the dashboard before starting another.', hideCancel: true }); return; }
    beginSession({ mode: 'practice', keyMode: resultView.keyMode || from.keyMode, minutes: 1, marksC: from.marks.c, marksN: from.marks.n, qids: ids });
  }
  function chapterPractice(list) {
    store.settings.chapters = list.map((c) => c.ch).sort((a, b) => a - b);
    store.settings.mode = 'practice'; store.settings.custom = false;
    save(); renderDashboard();
    say('Weak chapters selected. Choose options and press Start test.');
  }

  /* ================= BOOT ================= */
  function decorate() {
    const t = document.querySelector('.brand-title'); if (t) t.textContent = BRAND.name;
    const m = document.querySelector('.brand-mark'); if (m) m.textContent = BRAND.mark;
    const f = document.getElementById('foot');
    if (f) f.replaceChildren(
      h('span', null, 'Source: ' + BANK.meta.source + '. Last updated ' + BANK.meta.generated + '.'),
      h('span', null, 'Answer keys are those printed in the book. Questions marked "key under review" show a separate verified answer. English text is not human-reviewed.'),
      h('a', { href: REPORT_URL, target: '_blank', rel: 'noopener' }, 'Report an error in a question'),
      h('a', { href: '../' }, 'All subjects'));
    try {
      const l = document.createElement('link'); l.rel = 'icon';
      l.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0e4a5b"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">' + BRAND.mark + '</text></svg>');
      document.head.appendChild(l);
    } catch (e) { /* icon is optional */ }
  }
  function boot() {
    decorate();
    if (bankErrors.length) {
      showBanner('The question bank failed validation, so the test is disabled. First problems: ' + bankErrors.slice(0, 8).join(' | '), true);
      $('#view-dashboard').hidden = false;
      $('#view-dashboard').replaceChildren(h('h1', null, 'Question bank error'), h('p', null, `${bankErrors.length} problem(s) found. Rebuild the data file and reload.`));
      return;
    }
    if (!storageOK) showBanner('Browser storage is unavailable here, so progress will not be saved between visits. Use Export progress to keep your results.');
    renderDashboard();
  }
  window.AOTApp = { renderDashboard, store: () => store }; // for debugging/tests
  boot();
})();
</script></body></html>
