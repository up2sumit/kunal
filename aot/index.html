ke in Manipur. It was started with the help of the fishermen's union and the People's Resource Development Association (PRDA), a government organisation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1033", "ch": 10, "page": 142, "ansPage": 142, "srcNo": "1034", "exam": "15/09/2020 S-III", "q": "In orienting a newly admitted student in the school, the teacher should:", "o": ["Place the emphasis upon school rules", "Avoid talking about school expectations", "Utilise the services of classmates to familiarise him/her with the school", "Employ a fixed content week-wise and month-wise"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "When orienting a newly admitted student in school, the teacher should use the services of the child's classmates; this helps the child quickly adjust to the school environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1034", "ch": 10, "page": 142, "ansPage": 142, "srcNo": "1035", "exam": "15/09/2020 S-III", "q": "What should be the primary objective of introducing sports in school?", "o": ["Developing a spirit of competition", "Supplementary cognitive development of the learner", "Providing opportunities for psychomotor development", "Developing physical strength"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The primary objective of introducing sports in school is to develop physical capacity. Physical activities are promoted through sports so that physical capacity develops; by joining sports the heart, lungs, muscles and joints of students develop.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1035", "ch": 10, "page": 142, "ansPage": 142, "srcNo": "1036", "exam": "15/09/2020 S-III", "q": "Which of the following would be the best way to develop value-cooperation?", "o": ["Organising a camp for one month", "Organising lectures on the topic", "Organising cultural programmes", "Presenting a model"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Organising cultural programmes can help in developing the value of cooperation. Participants get an opportunity to know about the values of different cultures, and are sufficient for practising or evaluating those values.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1036", "ch": 10, "page": 142, "ansPage": 142, "srcNo": "1037", "exam": "15/09/2020 S-III", "q": "Curriculum in schools means:", "o": ["All the educational experiences under the school's jurisdiction", "All the subjects offered by the school", "All the learning experiences provided in the class to all learners", "All the academic works undertaken in school and communities"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The curriculum in school means all the educational experiences within the limits of the school, including co-curricular activities and all learning experiences given in the class. In educational science the concept of 'curriculum' is much broader: it is not just a group of subjects or books, but all the educational experiences provided by the school, including formal education, informal education and the hidden curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1037", "ch": 10, "page": 142, "ansPage": 142, "srcNo": "1038", "exam": "15/09/2020 S-I", "q": "The quality of education in school can be measured through:", "o": ["Students' achievement", "Availability of teacher and head teacher", "Infrastructural facilities available", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The quality of education in school can be measured by: students' achievement (where students are developing completely); availability of teachers and head teacher (these are the driving forces of effective teaching and learning); and availability of physical facilities (which make children's learning easy).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1038", "ch": 10, "page": 142, "ansPage": 142, "srcNo": "1039", "exam": "15/09/2020 S-I", "q": "How does the syllabus help in teaching?", "o": ["The teaching job becomes interesting", "Teacher can prepare his subject in advance", "Teacher knows his responsibility", "Simplifies teaching work"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main objective of the syllabus is to achieve the objectives of education. It gives teachers a clear understanding of their duties and responsibilities, which makes their teaching more effective. In curriculum-based teaching, the teacher prepares the subject in advance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1039", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1040", "exam": "15/09/2020 S-I", "q": "School curriculum can best be defined as:", "o": ["Sum total of knowledge to be provided to learners", "The sum total of organised pupil experiences under the patronage of the school", "The complete list of the courses of study", "All the materials used to further pupils' activities in school"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The complete list of courses is the best definition of a school curriculum. A school curriculum is a whole set of experiences organised in a school; it includes a study material and other activities which help in the selection of activities so that the teacher can enable students to attain their aims and objectives.", "tip": "", "status": "note", "note": "Printed key (c) 'complete list of the courses of study'; the options (b) 'sum total of organised pupil experiences' is the more standard definition. Printed key retained."}, {"id": "AOT-1040", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1041", "exam": "15/09/2020 S-I", "q": "Following are the co-curricular activities:", "o": ["Debates and discussion", "Music", "Co-operative bank", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Co-curricular activities are those activities which are in addition to the regular school curriculum but contribute significantly to the overall development of students. They include cultural programmes, library, science laboratory, class activities, debates and discussions, music and co-operative banks.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1041", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1042", "exam": "15/09/2020 S-I", "q": "Co-curricular activities in school are for:", "o": ["Mental development", "Physical development", "Spiritual development", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Co-curricular activities (CCA) ensure the harmonious development of the personality of children. Co-curricular activities are an extension of formal education experience and play an important role in complementing educational activities; they help improve children's artistic skills. They are for mental, physical and spiritual development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1042", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1043", "exam": "15/09/2020 S-I", "q": "Which one of the following is a literary activity?", "o": ["Story writing", "Mass drill", "Dramatics", "Social survey"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Essay, poem, story writing, debate, discussion, quiz, seminar and book-review related to the literacy of a person come under literary activities, which are part of co-curricular activities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1043", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1044", "exam": "15/09/2020 S-I", "q": "The following are the roles of a teacher in organising co-curricular activities in school:", "o": ["Planner", "Leader / guide", "Innovator", "A, B and C"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The teacher plays multiple roles in the organisation and execution of co-curricular activities. A teacher can be a planner, leader, innovator, controller, guide, instructor, organiser, manager, recorder, adviser, motivator, communicator or coordinator.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1044", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1045", "exam": "16/09/2020 S-I", "q": "The District Primary Education Programme was started in:", "o": ["1990", "1994", "1998", "1996"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The District Primary Education Programme (DPEP) was started in 1994. Its main objective was to provide education to children at the district level; the programme was merged with the Sarva Shiksha Abhiyan in 2009.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1045", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1046", "exam": "16/09/2020 S-I", "q": "The principles of curriculum development are:", "o": ["Related to life", "Utility", "Variety and elasticity", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "All the options are related to curriculum development. The main aim of the principle of curriculum development is the all-round development of the child and to make the future life of the child useful.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1046", "ch": 10, "page": 143, "ansPage": 143, "srcNo": "1047", "exam": "10/09/2020 S-II", "q": "It is necessary to teach value education, because:", "o": ["This will increase their intellectual development", "Parents will be pleased", "They will increase faith and awareness towards virtues", "That is also an education"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Value education develops the moral values within us and also develops our personality as we learn. It is necessary to teach value education to students because it increases their faith in and awareness of virtues.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1047", "ch": 10, "page": 144, "ansPage": 144, "srcNo": "1048", "exam": "18/09/2020 S-II", "q": "According to NCF-2005, the role of a teacher has to be:", "o": ["Authoritative", "Dictatorial", "Permissive", "Facilitative"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to NCF-2005, a teacher is not a source of knowledge but a facilitator who diagnoses the problems that come in the child's educational life. According to NCF-2005, the role of a teacher should be that of a facilitator or helper.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1048", "ch": 10, "page": 144, "ansPage": 144, "srcNo": "1049", "exam": "18/09/2020 S-II", "q": "The curriculum of educational institutes should be based on which of the following?", "o": ["Theory", "Practice", "Theory and practice", "Theory, practice and research"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The curriculum of educational institutions should be based on theory, practice and research. These three aspects are essential for effective and comprehensive education. Theory helps students understand the basic concepts, rules and principles of a subject; practice gives the opportunity to apply principles in real-world situations; research promotes the ability of inquiry, critical thinking and generating new knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1049", "ch": 10, "page": 144, "ansPage": 144, "srcNo": "1050", "exam": "28/01/2020 S-II", "q": "Which of the following lays the foundation for the curriculum?", "o": ["Socio-economic priorities and government", "Psychological and religious bases of education", "Philosophy, Sociology and Psychology", "Study materials and social needs"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Philosophy, sociology and psychology provide the foundation for the curriculum. The curriculum is a list of planned teaching experiences given to students in the direction of the school; philosophy, sociology and psychology provide the foundation stone for it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1050", "ch": 11, "page": 144, "ansPage": 144, "srcNo": "1051", "exam": "09/06/2024 S-I", "q": "The factors necessary to make learning attractive are:", "o": ["Reward", "Punishment", "Both reward and punishment", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Both reward and punishment are necessary factors for making learning attractive. Reward motivates students positively and increases their interest in learning, encouraging them to make an effort and understand new subjects. Punishment helps maintain discipline and correct mistakes, but it should be used thoughtfully and with restraint.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1051", "ch": 11, "page": 144, "ansPage": 144, "srcNo": "1052", "exam": "18/05/2024 S-I", "q": "Why is environmental awareness necessary at all stages of education?", "o": ["It is important for human existence", "The environment differs from one region to another", "Humans must control and change the environment", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Environmental awareness is necessary at all stages of education because it is very important for human existence. Environmental awareness helps students understand how natural resources are limited, the need to conserve them, and how the impact of humans on the environment can be reduced.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1052", "ch": 11, "page": 144, "ansPage": 144, "srcNo": "1053", "exam": "23/05/2024 S-II", "q": "Two statements are given below:\nStatement I: Implicit memory refers to the international (sic; intentional) or conscious recall of information.\nStatement II: Explicit memory refers to memories that people are not consciously aware of but that can affect their later performance and behaviour.\nIn light of the above statements, choose the most appropriate answer.", "o": ["Both Statement I and Statement II are correct", "Both Statement I and Statement II are incorrect", "Statement I is correct but Statement II is incorrect", "Statement I is incorrect but Statement II is correct"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Both statements are wrong. Implicit memory relates to unconscious or automatic memories, such as skills or habits (e.g. riding a bicycle); it is not conscious recall. Explicit memory is the feature of clear memory: it can be consciously recalled (facts or events), unlike what the statement says.", "tip": "", "status": "note", "note": "Statement I as printed in English says 'international'; read as 'intentional' per the Hindi."}, {"id": "AOT-1053", "ch": 11, "page": 144, "ansPage": 144, "srcNo": "1054", "exam": "23/05/2024 S-II", "q": "Which factor plays an important role in creating an effective teaching environment?", "o": ["Teacher's qualification", "Availability of teaching facilities", "Emphasis on the use of a foreign language", "Admission of students of the elite class"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher's qualification plays a central role in creating an effective teaching environment, because a qualified and competent teacher can not only make the subject content understandable but also adapt the teaching methods and provide a positive and motivating environment. A qualified teacher can present information in a clear and attractive way and use different teaching strategies.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1054", "ch": 11, "page": 145, "ansPage": 145, "srcNo": "1055", "exam": "21/05/2024 S-I", "q": "You are a teacher who believes that students are naturally curious and that the best way to motivate learning is the process of 'self-discovery'. Such students are most likely to be encouraged for learning by ______.", "o": ["Competition", "External motivation", "Copying", "Internal motivation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A teacher who believes that students are naturally curious and want to learn would inspire students towards self-discovery and inquiry-based learning, which is based on internal motivation. This kind of motivation helps students learn on their own and understand the subject deeply.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1055", "ch": 11, "page": 145, "ansPage": 145, "srcNo": "1056", "exam": "25/05/2024 S-I", "q": "The mental health of a child is influenced by:", "o": ["Parents' aspiration", "Teacher's behaviour", "Peer behaviour", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A child's mental health is a complex concept influenced by many factors. Parents' aspirations or unrealistic expectations can put pressure on the child; the teacher's behaviour greatly influences the child's self-confidence and emotional state; peer behaviour and acceptance or non-acceptance have a profound influence on the child's social, emotional development and mental health.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1056", "ch": 11, "page": 145, "ansPage": 145, "srcNo": "1057", "exam": "25/05/2024 S-I", "q": "The best way to motivate students to work hard is:", "o": ["The teacher should work hard himself, seeing which the student will get immediate inspiration", "Hard-working students should be rewarded", "A lecture should be given about the importance of hard work", "Examples of success from hard work should be presented"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The most effective way to motivate students to work hard is for the teacher and motivator to themselves present an example of hard work (modelling). This influences students directly, as they are inspired by the people around them; when teachers work hard and are honest in their efforts, students are naturally inspired.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1057", "ch": 11, "page": 145, "ansPage": 145, "srcNo": "1058", "exam": "19/05/2024 S-I", "q": "A child who performs well in the class must get:", "o": ["Praise", "Reward", "Recognition", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For encouraging children who perform well in class, praise, reward and recognition are all important. Praise increases self-esteem, reward gives motivation, and recognition makes the child feel that his efforts are being appreciated. Together these increase confidence and the desire to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1058", "ch": 11, "page": 145, "ansPage": 145, "srcNo": "1059", "exam": "19/05/2024 S-I", "q": "The principle of readiness demands from students, along with the teacher:", "o": ["Readiness to learn", "Good communication skills", "A lot of effort", "Proper prior preparation from his side for audio-visual aid material"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The principle of readiness states that learning is more effective when students are mentally and physically ready to learn. This principle needs both teacher and students to have readiness to learn; without readiness, the learning process may be impeded.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1059", "ch": 11, "page": 145, "ansPage": 145, "srcNo": "1060", "exam": "09/06/2024 S-II", "q": "What is the main advantage of essay-type questions?", "o": ["Students' learning difficulties can be diagnosed", "Essays are for marking", "Students can guess the answer", "They can measure complex learning outcomes that cannot be measured by other types of questions"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Essay-type questions are an open-ended form of evaluation, for which students need to prepare answers in their own words. The main advantage of essay-type questions is that they can measure complex learning outcomes which cannot be measured with other types of questions. Same as Q941.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-058", "first": false, "kind": "near", "of": "AOT-0939"}}, {"id": "AOT-1060", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1061", "exam": "09/06/2024 S-II", "q": "Apart from ______, the following reasons play an important role in the development of young children through play.", "o": ["They gain proficiency over their bodies", "It stimulates their senses", "It is a pleasant way to spend time", "They acquire new skills and learn when to use them"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "All researchers agree that children learn and develop through play. Their senses are activated, which increases their sensitivity and coordination with the environment. Play is not just a pleasant way to spend time; it teaches how to explore, learn, make friends and use imagination.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1061", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1062", "exam": "09/06/2024 S-II", "q": "Who developed the guidelines on information literacy for lifelong learning?", "o": ["Russa", "ASRL", "Skonul", "IFLA"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The guidelines on information literacy for lifelong learning were developed by the International Federation of Library Associations and Institutions (IFLA) through its Information Literacy Section (Infolit), designed to provide a practical framework for professionals who want to start or are interested in information-literacy programmes. IFLA was founded in 1927 in Scotland; Elisabeth Collison was its first president; the IFLA journal is published four times a year.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1062", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1063", "exam": "09/06/2024 S-II", "q": "In the absence of ______, the teacher cannot get any useful response from the student.", "o": ["Good body", "Wealth", "Motivation", "Examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In the absence of motivation, the teacher cannot get any useful response from the student. The teacher needs the student's motivation so that they can actively take part in learning and give useful responses.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1063", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1064", "exam": "09/06/2024 S-II", "q": "The number of students in small cooperative learning groups is:", "o": ["3-4", "5-6", "8-10", "10-15"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In small cooperative learning groups the number of students is generally 3-4. This size promotes active participation and diversity of skills within the group. In the Process Oriented Guided Inquiry Learning (POGIL) method also, a group generally has 3 to 4 students working as a team.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1064", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1065", "exam": "27/05/2024 S-I", "q": "Which of the following is NOT a result of learning?", "o": ["Physical structure", "Knowledge", "Skill", "Maturity"], "key": {"printed": [], "verified": [3], "official": 3}, "e": "Maturity is a developmental process which is mainly influenced by biological and hereditary factors, not by learning, although learning happens along with it; maturity itself is not the result of learning but a natural developmental process. Physical structure is also determined by biological factors and learning has no direct effect on it.", "tip": "", "status": "missing", "note": "The printed key reads '(*)' with a note: 'According to the Commission, the correct answer is (d)'. The book's own explanation also discusses physical structure (a). Recorded as (d) per the Commission note."}, {"id": "AOT-1065", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1066", "exam": "27/05/2024 S-I", "q": "What is necessary for divergent thinking?", "o": ["Classification", "Flow (fluency) of ideas", "Mathematical reasoning", "A device"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Divergent thinking is the process in which many possible solutions or ideas are generated for any problem or idea. For this, fluency of ideas is necessary, so that a person can think about different aspects of the same problem and explore many possibilities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1066", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1067", "exam": "27/05/2024 S-I", "q": "Activity-based learning is:", "o": ["Teacher-centred", "Student-centred", "Subject-centred", "Class-centred"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Activity-based learning is student-centred: students learn by participating in activities, doing experiments and exploring. In this approach the teacher plays the role of a facilitator, not the only source of knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1067", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1068", "exam": "27/05/2024 S-I", "q": "Which of the following statements is NOT considered an indication of motivated learning?", "o": ["Students ask many questions", "Silence prevailed in the class even when asked to share experience", "A sense of belonging develops among learners", "Students can separate new learning from old learning"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In motivated learning students are active and curious. The silence in class even on being asked to share experience is not an indication of motivated learning, because it shows that students are inactive and not taking part in the learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1068", "ch": 11, "page": 146, "ansPage": 146, "srcNo": "1069", "exam": "26/05/2024 S-II", "q": "The relation of different concepts at the same level is:", "o": ["Horizontal organisation", "Vertical organisation", "Centralised", "Decentralised"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Horizontal organisation occurs when different concepts or departments at the same level are related. It means that they work at the same hierarchical level and often cooperate with one another or exchange information.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1069", "ch": 11, "page": 147, "ansPage": 147, "srcNo": "1070", "exam": "19/06/2024", "q": "The knowledge of counselling skills is essential for teachers:", "o": ["To promote student learning and well-being", "To prepare a weekly lesson plan", "To collect data", "To guide the student in possessing technical competence"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Knowledge of counselling skills is essential for teachers to promote students' learning and welfare. Using counselling skills, a teacher can help students struggle with difficult subjects, deal with stress and anxiety, and build positive relationships.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1070", "ch": 11, "page": 147, "ansPage": 147, "srcNo": "1071", "exam": "29/05/2024 S-I", "q": "The majority of the students in a class misbehave. What does it tell you?", "o": ["Presence of distractions in the class", "Lack of a code of conduct", "Too many rules", "General indiscipline amongst students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If the majority of students in a class misbehave, it shows general indiscipline among students. Misbehaviour refers to a sequence of improper behaviours which can disturb the status of teaching in the class; there are various ways to deal with misbehaviour in class, including verbal and non-verbal signals.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1071", "ch": 11, "page": 147, "ansPage": 147, "srcNo": "1072", "exam": "29/05/2024 S-I", "q": "The concept of Intelligence Quotient or IQ was developed by:", "o": ["Galton", "Binet", "Stern", "Terman"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In 1912, the German psychologist William Stern developed the concept of Intelligence Quotient (IQ). IQ refers to dividing mental age by chronological age and multiplying by 100: IQ = (MA / CA) x 100.", "tip": "", "status": "note", "note": "Binet-Simon introduced mental age; Terman revised the scale and popularised the IQ. Printed key (c) Stern retained."}, {"id": "AOT-1072", "ch": 11, "page": 147, "ansPage": 147, "srcNo": "1073", "exam": "29/05/2024 S-I", "q": "Learner-centred learning leads to ______.", "o": ["Holistic development", "Enhanced activity", "Loss of interest", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learner-centred learning leads to holistic development. Its main aim is the complete development of the learner: it involves not only the accumulation of knowledge but also the development of the learner's skills, knowledge, outlook and values. The learner is given freedom to learn according to his interests and abilities. Same as Q36.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-005", "first": false, "kind": "exact", "of": "AOT-0036"}}, {"id": "AOT-1073", "ch": 11, "page": 147, "ansPage": 147, "srcNo": "1074", "exam": "14/06/2024 S-III", "q": "Which factors influence the quality of learning?", "o": ["Physical", "Social", "Cultural", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Among the factors influencing the quality of learning are physical, social and cultural aspects, which together affect an individual's learning experience and ability and determine the quality of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1074", "ch": 11, "page": 147, "ansPage": 147, "srcNo": "1075", "exam": "14/06/2024 S-III", "q": "The single most important factor in the beginning of the teaching career is:", "o": ["Meritorious academic record", "Communication skills", "One's personality and ability to relate to class and students", "Organising ability"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The most important factor at the beginning of a teaching career is a person's personality and the ability to relate to the class and students. In a teaching career a good academic record alone is not enough; an effective teacher needs to establish a strong relationship with students and understand their needs. An attractive and sympathetic personality helps teachers connect with students and motivate them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1075", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1076", "exam": "05/09/2023 S-III", "q": "Which of the following formal agencies of education is powerful in the life of a human?", "o": ["School", "Family", "Society", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Formal agencies of education are institutions where the process of education is organised and planned, including school, college and institutes. The school is the powerful formal agency in the life of a person because it systematically conducts the process of education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1076", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1077", "exam": "05/09/2023 S-III", "q": "The most necessary factor for most children is:", "o": ["Teacher's teaching", "Classroom environment", "Children's readiness (alertness)", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The most necessary factor for the majority of children is the children's readiness (tatparta). If children are not ready to learn, they will not be able to learn. Readiness includes their knowledge, skill, interest and outlook.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1077", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1078", "exam": "05/09/2023 S-I", "q": "'Learning by doing' is:", "o": ["Experimental knowledge", "Observational knowledge", "Questioning-based knowledge", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Learning by doing' is a process in which people feel their own experiences, especially those experiences which they gain by being actively engaged in making things and exploring the world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1078", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1079", "exam": "05/09/2023 S-I", "q": "When students are given the opportunity to discuss a subject in a group, the learning curve:", "o": ["Remains as before", "Decreases", "Increases", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "When students get an opportunity to discuss a problem in groups, their learning curve improves, because discussion is a method of teaching which promotes meaningful learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1079", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1080", "exam": "05/09/2023 S-I", "q": "This includes the experience of learning content and the activity of learning:", "o": ["Syllabus", "Curriculum", "Assignment", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The curriculum includes the experiences of learning and the activities of learning. The word curriculum means a course to be run: following a rule of reading (learnable) or teachable subject matter and activities; the aim of a curriculum is to develop all human abilities - intellectual, aesthetic, social, physical, emotional and moral - in an integrated manner.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1080", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1081", "exam": "05/09/2023 S-I", "q": "A diagnostic test is used:", "o": ["To identify the difficulties of students", "To measure the knowledge of students", "To evaluate the teaching-learning process", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Diagnostic testing means identifying difficulties. After identifying difficulties, remedial teaching is done to remove them. The function of diagnostic testing is to reduce the number of failed students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1081", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1082", "exam": "05/09/2023 S-I", "q": "Why should a student not be given severe punishment?", "o": ["It develops a negative attitude in students towards their studies, teachers and institutions", "He can fight with the teacher", "Parents may complain against the teacher", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "As a result of severe punishment, students develop a negative attitude towards their studies, teachers and the institution. Harsh punishment results in a lack of concentration in the class, difficulty in reading and writing, difficulty in solving mathematical problems, and running away from school.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1082", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1083", "exam": "05/09/2023 S-I", "q": "The disability of reading is called:", "o": ["Dyslexia", "Dyscalculia", "Dysgraphia", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Dyslexia is a common learning disability related to difficulty in reading, because it confuses the learner about the shape and sound of the letters of the alphabet. It causes inability to read, interpret and understand letters and words. Dysgraphia affects the ability to write; dyscalculia affects the ability to do mathematical calculations.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1083", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1084", "exam": "13/09/2023 S-I", "q": "A characteristic of Indian society is:", "o": ["Orthodox", "Unscientific", "Open", "Stratified"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A characteristic of Indian society is that it is stratified. Indian society is a diverse and complex society in which people of various castes, religions and cultures live. An important feature is its stratified structure, in which different groups and castes are placed at different levels; the caste system and social hierarchy are some important aspects of stratified structure.", "tip": "", "status": "note", "note": "Same question as Q61.", "dup": {"group": "DUP-007", "first": false, "kind": "exact", "of": "AOT-0061"}}, {"id": "AOT-1084", "ch": 11, "page": 148, "ansPage": 148, "srcNo": "1085", "exam": "13/09/2023 S-I", "q": "Which of the following is NOT a cause of forgetting?", "o": ["Mental conflict", "Desire to remember", "Faulty methods of remembering", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Forgetting is failure to retrieve information from long-term memory. Sometimes we think we have forgotten something, but in the real sense it is not forgotten because it was never encoded and stored in the first place. Causes of forgetting: mental conflict, desire to forget, faulty methods of remembering, interference, repressed memories, etc.", "tip": "", "status": "note", "note": "Printed option (b) reads 'desire to remember' but the printed explanation lists 'desire to forget' as a cause; key (d) as printed."}, {"id": "AOT-1085", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1086", "exam": "13/09/2023 S-I", "q": "Which of these factors does NOT affect the learning process?", "o": ["Intelligence", "Interest", "Readiness", "Goal setting"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is the acquisition of new behaviour or experience, which strengthens or weakens old behaviour and results in progressive change in behaviour. The main factors influencing learning: the learner's motivation, maturity, teaching strategies, intelligence, interest, readiness, and the learner's physical and emotional health. Goal setting does not affect the learning process.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-061", "first": true, "kind": "near", "of": null}}, {"id": "AOT-1086", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1087", "exam": "13/09/2023 S-I", "q": "The student is secondary in:", "o": ["Authoritarian teaching", "Democratic teaching", "Open teaching", "Progressive teaching"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In authoritarian teaching the student is secondary. Authoritarian (teacher-centred or subject-centred) teaching is a traditional method in which the teacher has full control over students and teaching. The teacher is more active and learners passive listeners; no emphasis is laid on the learner's abilities, interests and personality.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1087", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1088", "exam": "08/09/2023 S-II", "q": "Which of the following factors does NOT affect teaching-learning?", "o": ["Maturity", "Readiness", "Level of aspiration", "Geographical limit"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Geographical limits do not affect teaching-learning, while maturity, readiness and aspiration affect it. Personal factors affecting learning include physical health, age, maturity, emotional state, interest, motivation, attitude, readiness, intention and aspiration.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1088", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1089", "exam": "08/09/2023 S-I", "q": "A mnemonic (smaran) is:", "o": ["Theoretical learning material", "Visual learning", "Memory-aid learning material", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A mnemonic is a teaching aid, i.e. a supportive teaching material: tools and techniques which are used to effectively communicate knowledge between different teaching situations. It is used to make learning more interesting and enjoyable in various ways.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1089", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1090", "exam": "08/09/2023 S-I", "q": "Why is teacher training necessary?", "o": ["To enhance teaching skills", "To understand the school organisation", "Both (a) and (b)", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teacher training is necessary to improve teaching skills. A teacher trainee expresses himself; regular training keeps teachers' existing knowledge updated on educational trends. Training also helps teachers understand the ways of school management and school organisation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1090", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1091", "exam": "08/09/2023 S-I", "q": "Training can be used for:", "o": ["Development of skills", "Development of healthy habits", "Creation of artificial behaviour", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Training can be used for the development of skills. Training is related to teaching or developing any skill and knowledge relating to specific useful competence. Under training, there are specific features for improving a person's ability, capacity, productivity and performance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1091", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1092", "exam": "09/09/2023 S-II", "q": "The plateau of learning is:", "o": ["Lack in learning", "Obstacle in learning", "No improvement in learning", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A plateau in learning is a condition in which improvement in learning stops. In this state the learning curve starts running parallel instead of rising, and no progress is visible for a long time. This stagnation point is called the plateau of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1092", "ch": 11, "page": 149, "ansPage": 149, "srcNo": "1093", "exam": "09/09/2023 S-I", "q": "An achievement test is:", "o": ["A standardised test", "A psychological test", "A teacher-made test", "An intelligence test"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An achievement test is a teacher-made test. Teacher-made tests are those which are constructed by the teachers mostly within their classroom; it is prepared to assess the learning process of students and, if there are difficulties in a particular subject/concept, to identify it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1093", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1094", "exam": "09/09/2023 S-I", "q": "A unit test is:", "o": ["Formative evaluation", "Summative evaluation", "External evaluation", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A unit test is a formative (constructive) evaluation. Formative evaluation, often called 'assessment for learning', provides feedback so that students can learn better and make effective progress.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1094", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1095", "exam": "09/09/2023 S-I", "q": "A rating scale is a:", "o": ["Qualitative technique", "Writing technique", "Quantitative technique", "Oral technique"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A rating scale is a qualitative technique which determines the quantity, intensity and frequency of the qualities present in a person. In the rating scale the evaluator determines the quantity, intensity or frequency of the qualities of different persons on the basis of his discretion.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1095", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1096", "exam": "09/09/2023 S-II", "q": "The reinforcement skill is used:", "o": ["For motivating students", "To make learning interesting", "Both (a) and (b)", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The reinforcement skill is used to help students review their learning, correct their errors and enhance their knowledge. This increases students' self-confidence and maintains their interest; they become more active and independent learners.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1096", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1097", "exam": "10/09/2023 S-I", "q": "The effective way of learning at present is:", "o": ["Self-learning", "Face-to-face learning", "Blended-system learning", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Among the effective ways of learning, blended learning is one in which all the activities by which students engage in high-quality learning experience are included. At present blended learning is the effective way: it combines online and face-to-face learning, making the process of learning more flexible and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1097", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1098", "exam": "10/09/2023 S-I", "q": "The best way of learning is:", "o": ["Seeing", "Writing", "Doing", "Reading"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The best way of learning is by doing. This method encourages students to analyse and learn from their own behaviour. Learning by doing emphasises learning through activity, which encourages students to include more knowledge in memory through self-activity.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1098", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1099", "exam": "13/09/2023 S-I", "q": "'Hands-on learning' means:", "o": ["Learning by questioning", "Learning by doing", "Learning by observing", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Hands-on learning means 'learning by doing'. When we actually 'do' an activity we learn more. The American philosopher John Dewey was the first to popularise learning by doing; for Dewey, the most effective way to achieve this is to make a practical curriculum relevant to students' lives and experiences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1099", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1100", "exam": "13/09/2023 S-I", "q": "Learning is a natural activity of:", "o": ["Living beings", "Boys only", "Girls only", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning is a natural activity for all living beings. Learning or acquisition is a very comprehensive and important term. Learning is by nature an inborn process; acquiring skills, values and knowledge from different types of information is called learning, not just a collection of knowledge but a process.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-004", "first": false, "kind": "near", "of": "AOT-0014"}}, {"id": "AOT-1100", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1101", "exam": "13/09/2023 S-I", "q": "Physical growth and development follow the principles of ______ and ______.", "o": ["Differentiation (simple to complex); integration (complex to simple)", "Integration (simple to complex); differentiation (complex to simple)", "Cephalocaudal (descending); proximodistal (inner to outer)", "Proximodistal (descending); cephalocaudal (inner to outer)"], "key": {"printed": [1], "verified": [2], "official": null}, "e": "As printed: physical growth and development follow the principle of integration (simple to complex) and differentiation (complex to simple), which means that for the better and coordinated functioning of organs, structure grows. Principles include integration, differentiation, continuity, individual differences and interrelationship.", "tip": "", "status": "disputed", "note": "Printed key (b) as given; the option text is difficult to reconcile with standard theory, where physical growth follows the cephalocaudal (head-to-foot) and proximodistal (centre-to-periphery) principles (option c). Printed key retained; verified answer (c) for the standard principles."}, {"id": "AOT-1101", "ch": 11, "page": 150, "ansPage": 150, "srcNo": "1102", "exam": "13/09/2023 S-I", "q": "Which of these factors does NOT affect the process of learning?", "o": ["Intelligence", "Interest", "Readiness", "Goal setting"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is the acquisition of new behaviour or experience, which strengthens or weakens old behaviour; the result is progressive change in behaviour. The main factors influencing learning are the learner's motivation, maturity, teaching strategies, intelligence, interest, readiness, and physical and emotional health. Goal setting does not affect the learning process. Same as Q1086.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-061", "first": false, "kind": "near", "of": "AOT-1085"}}, {"id": "AOT-1102", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1103", "exam": "13/09/2023 S-I", "q": "Which one is NOT a principle of cooperative learning?", "o": ["Positive dictation (shrutlekh)", "Face-to-face interaction", "Group accountability", "Individual accountability"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Positive dictation' is not a principle of cooperative learning. Cooperative learning means a learning process in which students learn following a cooperative system within their group; students exchange their information and experiences and try to acquire subject knowledge and skills by mutual cooperation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1103", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1104", "exam": "13/09/2023 S-I", "q": "For writing specific objections, the use of the ______ action makes it:", "o": ["Middle class", "Action-oriented", "Specific", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "When we use action in writing specific objections, it affects writing in three ways: it makes it middle-class (expressing one's point clearly and effectively), action-oriented (writing becomes oriented towards action) and specific (more specific for a particular person or situation).", "tip": "", "status": "note", "note": "Question wording is garbled in the source (likely 'To write specific objectives, the use of ___ verb makes it ...'); printed key (d) retained."}, {"id": "AOT-1104", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1105", "exam": "15/09/2023 S-I", "q": "Good students are those who:", "o": ["Always want to learn", "Always bring good results", "Always have self-confidence", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Good students are those who always want to learn. They take interest in their subjects and are eager to absorb new knowledge; they are not afraid of difficulties, work hard to solve problems, and are always looking for new opportunities to extend their knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1105", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1106", "exam": "18/09/2023 S-I", "q": "Which is the most widely applicable test item?", "o": ["Matching", "MCQ", "Completion", "Short answer"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The most widely applicable test item is the MCQ (multiple-choice question). It is considered the most useful type of objective test, apart from being widely applicable; it can be used for assessing the most important outcomes: understanding, judgement and problem-solving. Multiple-choice questions play a role in the assessment of ability of scientific and medical graduates.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1106", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1107", "exam": "18/09/2023 S-I", "q": "Who was the founder of modern intelligence tests?", "o": ["Terman", "Stern", "Guilford", "Alfred Binet"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Alfred Binet was the founder of modern intelligence tests. The first modern intelligence test was developed by Alfred Binet in 1904; he was one of the most influential psychologists in history. He prepared the classical scale to separate children with disabilities and mental retardation; his test was based on the idea that a child's intelligence develops with age.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1107", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1108", "exam": "18/09/2023 S-I", "q": "Teacher-centred education is:", "o": ["Democratic", "Authoritarian", "Constructive", "Critical judgement"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teacher-centred education is authoritarian. In teacher-centred education, a method in which the teacher has complete control, the teacher imparts knowledge and students are expected to receive and repeat it. Students' role is more passive, and they get less opportunity to take decisions or express opinions. By contrast, democratic, constructive and critical-judgement approaches focus on giving students a more active role.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1108", "ch": 11, "page": 151, "ansPage": 151, "srcNo": "1109", "exam": "09/09/2020 S-III", "q": "Which one of the following ways is not suitable to help hyperactive children learn?", "o": ["Offering alternative ways of learning", "Including physical activity in their daily schedule", "Reprimanding them often for being restless", "Breaking up a task into small, manageable segments"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "To help hypersensitive/hyperactive children learn, the teacher should be sensitive and accept their ideas and feelings, not reprimand them often for being restless. Apart from this, effective ways: teach to break tasks into small segments; provide a suitable environment for expressing ideas and feelings; offer alternative ways of learning; and include physical activity in daily routine. Same as Q588.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1109", "ch": 11, "page": 152, "ansPage": 152, "srcNo": "1110", "exam": "09/09/2020 S-III", "q": "In any talented child:", "o": ["Alertness is of low order", "Concentration occurs", "Vocabulary is not exhaustive", "General knowledge is weak"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A talented child shows consistent outstanding performance in academic fields. He has an additional two to three per cent better intellectual capacity within the limits of the population and has concentration. A child whose mental age is much higher than the average of his age group is called gifted or talented.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1110", "ch": 11, "page": 152, "ansPage": 152, "srcNo": "1111", "exam": "10/09/2020 S-II", "q": "The problem child is generally one who has:", "o": ["An unsolved problem", "A poor heredity", "A poor home environment", "Over-protective parent(s)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A problem child is to some extent a rebellious child who creates problems for himself and others. A problem or problematic child usually has a mental problem which is unresolved inside; hence a good approach is needed to deal with it, and counselling should be given to help such children develop and find the right path.", "tip": "", "status": "disputed", "note": "Printed key (c) as given; option (a) is closer to the printed explanation ('unresolved problem inside'). Retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-062", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "AOT-1111", "ch": 11, "page": 152, "ansPage": 152, "srcNo": "1112", "exam": "10/09/2020 S-I", "q": "'Cooking is not man's job.' This statement:", "o": ["Is true", "Reflects social discrimination", "Demonstrates gender bias", "Is largely true"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The statement 'cooking is not man's job' demonstrates gender bias. Gender-bias terms are the positive and negative beliefs which we hold about men and women. Gender prejudice in education is a widespread issue that can have long-term negative effects on students' lives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1112", "ch": 11, "page": 152, "ansPage": 152, "srcNo": "1113", "exam": "10/09/2020 S-I", "q": "Which of the following is NOT one of the intrinsic factors affecting child development?", "o": ["Wisdom / intelligence", "Hereditary factor", "Physical environment", "Physical factor"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The physical environment is not an intrinsic factor affecting child development. Child development depends on factors such as nutrition, health, intelligence, heredity, exercise, environment, socio-economic status and emotions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1113", "ch": 11, "page": 152, "ansPage": 152, "srcNo": "1114", "exam": "10/09/2020 S-I", "q": "Which of the following does NOT affect the social development of a child?", "o": ["Knowledge", "Logic (reasoning)", "Language skills", "None of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Many factors influence a child's social development, including knowledge, reasoning power and language skills; all these play important roles in social development. Knowledge gives the child an understanding of the surrounding world; reasoning helps solve social problems and make decisions; language skills help the child communicate effectively with others.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1114", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1115", "exam": "10/09/2020 S-I", "q": "The development of human behaviour depends on:", "o": ["The family", "The environment", "The family and environment", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The development of human behaviour depends on the family and environment. Human behaviour refers to the collection of physical activities and observable emotional states of a person in various conditions, and it refers to the tendency of change in outlook, behaviour and values in society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1115", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1116", "exam": "10/09/2020 S-II", "q": "In a democratic country like India, school should concentrate on:", "o": ["Development of traits to face the hurdles of daily life", "Development of traits of a good citizenship", "Preparation for academic excellence", "Inculcation of values cherished by the country"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "To make education more meaningful, relevant and useful, democratic values and principles should be applied in its whole process. No democracy can succeed without education, because the citizens of a civilised society need schools to pay attention to the development of various values nurtured by the country.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1116", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1117", "exam": "11/09/2020 S-I", "q": "Determining the aim of education is the responsibility of:", "o": ["Parents", "Teachers", "Students", "Society"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The responsibility of determining the aims of education rests with society. The objectives of education are in accordance with the objectives of social life. Hence it is the duty of every parent, teacher, society and state to organise the education of every child keeping in mind the development of his special personality, so that he can develop according to his wishes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1117", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1118", "exam": "11/09/2020 S-I", "q": "The primary cause of individual variations is:", "o": ["The genetic code received by the individuals from birth parents", "The inborn characteristics", "The environmental influences", "The complex interplay between heredity and environment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Individual differences are variations that make each person different from another on the basis of psychological characteristics. The primary cause of individual differences is the complex interplay between heredity and environment. How a person develops depends on the environment, but how far he can develop depends on heredity.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1118", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1119", "exam": "11/09/2020 S-I", "q": "Emotions and cognition are ______ each other.", "o": ["Completely separate from", "Independent of", "Inter-woven with", "Not related to"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Emotion and cognition are intertwined. Emotion is a mental state linked with fear, anger, love, etc.; cognition is the process of acquiring knowledge through experience and the senses. The relationship between cognition and emotion has stimulated important ideas within the intellectual tradition; in a child, the integrated development of physical, cognitive, emotional and social aspects occurs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1119", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1120", "exam": "14/09/2020 S-I", "q": "Learning disability can arise from all of the following EXCEPT:", "o": ["Teacher's teaching style", "Alcohol consumption by the mother before birth", "Mental retardation", "Brain fever in childhood"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning disability can arise due to all other reasons except the teacher's style of teaching. A learning disability is a group of disorders that refers to significant difficulties in listening, speaking, reading, writing, reasoning or mathematical ability, which can be seen in the acquisition and use of those abilities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1120", "ch": 11, "page": 153, "ansPage": 153, "srcNo": "1121", "exam": "14/09/2020 S-I", "q": "If a student has problems with numbers and calculation, he may have a disability called:", "o": ["Dysgraphia", "Dyscalculia", "Dyslexia", "All of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "If a student has problems with numbers and calculation, he may have a disability called dyscalculia. 'Dyscalculia' is a type of mathematics-related learning disability.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1121", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1122", "exam": "15/09/2020 S-II", "q": "What type of test is most effective when trying to test memorisation?", "o": ["True/false", "Multiple choices", "Fill in the blanks", "Both (b) and (c)"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A test is most effective for memory power through multiple-choice and fill-in-the-blank items. Memory power means the mental power that retains events and heard things which come to the mind, and when needed, brings that event or idea back clearly to the mind by emphasis.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1122", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1123", "exam": "15/09/2020 S-II", "q": "UNCRPD is related with:", "o": ["Women only", "Elementary education", "Special-needs children", "Minorities only"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "UNCRPD stands for the United Nations Convention on the Rights of Persons with Disabilities. It is an international human-rights treaty of the United Nations for the rights of persons with special needs; its headquarters is in New York (as printed).", "tip": "", "status": "note", "note": "The Convention is an international treaty, not a body with headquarters; printed statement about 'headquarters' is loose. Answer unaffected."}, {"id": "AOT-1123", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1124", "exam": "15/09/2020 S-II", "q": "Which of the following is NOT a characteristic of a slow learner?", "o": ["Limited vocabulary", "Short span of attention", "Abstract thinking", "Limited range of interests"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Slow learners have difficulty in learning, so instead of abstract thinking they prefer concrete thinking, i.e. they prefer the surface or only solid thinking about an object.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1124", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1125", "exam": "15/09/2020 S-II", "q": "With smaller classes, teachers are much more able to:", "o": ["Identify learning problems", "Provide individual attention", "Adapt instruction to individual differences among students", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "With fewer students in the class, a teacher can identify students' learning problems, give individual attention and adapt instruction to individual differences. Teachers should apply these to make teaching more effective in a class with fewer students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1125", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1126", "exam": "15/09/2020 S-II", "q": "The best approach to motivate students is by:", "o": ["Giving them suitable prizes", "Providing them proper guidance", "Giving examples all the time", "Delivering speech in class"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If students perform better in an examination or any other field, they should be rewarded publicly and immediately, which raises their level of confidence and they try to do better. Praise builds confidence, competence, interest and self-esteem in students; by giving them suitable rewards, they should be given a signal of how well they have performed.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1126", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1127", "exam": "15/09/2020 S-II", "q": "Which quality is most important for students?", "o": ["Good behaviour", "Independent thinking", "Obedience", "Hard work"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Independent thinking is the most important for students. Independent thinking means the ability to reason on the basis of realities and to take decisions using one's personal capacity.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1127", "ch": 11, "page": 154, "ansPage": 154, "srcNo": "1128", "exam": "15/09/2020 S-II", "q": "Motivation, in the process of learning:", "o": ["Sharpens the memory of learners", "Differentiates new learning from old learning", "Makes learners think unidirectionally", "Creates interest for learning among young learners"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Motivation is a mental or inner process which helps a person fulfil the purpose of his goals. Motivation creates interest in learning among young learners; it works as an energy which helps maintain attention in a person's efforts and work.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1128", "ch": 11, "page": 155, "ansPage": 155, "srcNo": "1129", "exam": "15/09/2020 S-III", "q": "A child with problems is generally one who:", "o": ["Has no brother or sister at home", "Is maladjusted", "Has a poor environment", "Has low intelligence"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A maladjusted child generally suffers from problems such as: staying socially isolated, undesirable behaviour, backwardness in school performance and mental-health problems. The reasons may include: improper home environment, absence or neglect of parents, emotional or physical exploitation, and bad behaviour. So the other options are wrong.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1129", "ch": 11, "page": 155, "ansPage": 155, "srcNo": "1130", "exam": "15/09/2020 S-III", "q": "Which of the following is a correctly matching pair of learners and their primary characteristics?", "o": ["Hearing-impaired learners: cannot comprehend visual information", "'Dyslexic' learners: deficient in fluent reading and writing", "Creative learners: hyperactive; slow in completing work", "Attention-deficit learners: high motivation; can sustain attention for long periods of time"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Dyslexia is a learning disability in which a person has difficulty reading and writing, especially in recognising words and fluent reading. Hearing-impaired learners have difficulty in hearing, not in understanding visual information; creative learners do not generally show slowness in completing work; attention-deficit learners have difficulty in maintaining attention, not high motivation.", "tip": "", "status": "note", "note": "Option (b) in the English line is a misprint of option (c) ('Hyperactive; slow in completing work'); the Hindi text (deficiency in fluent reading and writing) is used here. Answer unaffected."}, {"id": "AOT-1130", "ch": 11, "page": 155, "ansPage": 155, "srcNo": "1131", "exam": "15/09/2020 S-III", "q": "What instructional adaptations should a teacher make while working with students who are 'visually challenged'?", "o": ["Speak clearly and use a lot of touch-and-feel materials", "Use a variety of visual presentations", "Orient herself so that the students can watch her closely", "Focus on a variety of written tasks, especially worksheets"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "While working with students who are visually challenged, the teacher should speak clearly and use a larger amount of touch-and-feel material. It depends on the students' needs, interests and nature of the subject; using more material that can be spoken and felt would be a good adaptation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1131", "ch": 11, "page": 155, "ansPage": 155, "srcNo": "1132", "exam": "15/09/2020 S-III", "q": "To understand individual differences in development, it is important:", "o": ["To look at the inherited characteristics that give each person a special start in life", "To look at the environmental factors that affect individuals", "To consider maturation of the body and the brain", "To consider both inherited characteristics as well as environmental factors and their interplay"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For understanding individual differences in development it is important to consider inherited characteristics as well as environmental factors and their interaction. Inherited characteristics give each person a special start in life, but the environment also plays an important role in a person's development. A child's intelligence is influenced by his hereditary factors and by the education and experience he receives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1132", "ch": 11, "page": 155, "ansPage": 155, "srcNo": "1133", "exam": "16/09/2020 S-I", "q": "Who will be expected to deal with someone who criticises you correctly?", "o": ["As a friend", "As a fool", "As a criticiser", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Those people who criticise you correctly should be treated as a friend. A true critic motivates you by pointing out your shortcomings so that you remove them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1133", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1134", "exam": "16/09/2020 S-I", "q": "Which of the following is NOT required for developing creativity in the classroom?", "o": ["Playing games", "Experiment", "Story writing", "Lecture"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A lecture is not required in the classroom for activities. Activity-based teaching is a part of a practical teaching method in which learning is encouraged by learning practically instead of books; in this method learning through activity is promoted instead of memorising content.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1134", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1135", "exam": "16/09/2020 S-I", "q": "Education for children with special needs should be provided:", "o": ["In a special school", "By special teachers in a special school", "Along with other normal children", "By the teaching methods developed for special children in a special school"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Education for children with special needs should be given along with all other normal children; their education should be given in an inclusive class, because diversity is valued in inclusive classes and all children learn and grow. If special schools, special classes or special teachers are used, a feeling of inferiority may develop in them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1135", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1136", "exam": "16/09/2020 S-I", "q": "Which is NOT a characteristic of good mental health?", "o": ["Balanced, integrative and harmonious development", "Acceptance of reality", "Boasting", "Regular life"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Except option (c), all the other options are characteristics of mental health. Boasting is not a characteristic of mental health.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1136", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1137", "exam": "16/09/2020 S-I", "q": "'Mental hygiene' means:", "o": ["Investigation of the laws of mental health", "Taking measures for mental-health preservation", "Prevention of mental disorders", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "C. W. Beers is credited with starting the science of mental hygiene. Mental hygiene means not only the absence of mentally ill persons but also active functioning of psychological thinking, feelings and behaviour. All the statements are correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1137", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1138", "exam": "16/09/2020 S-I", "q": "The fundamental unit of human society is known as:", "o": ["Individual", "Family", "Social group", "Tribal group"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The family is the fundamental and basic unit of human society, because society is made up of families joining together; it ensures the continuity of generations.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1138", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1139", "exam": "16/09/2020 S-I", "q": "Which one is a constraint on social change in India?", "o": ["Ethnicity", "Caste", "Class", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Ethnicity, caste and class are all constraints on social change in India. Besides these, conservative principles and rules, lack of faith in the group, hatred towards other religions, distortion of historical facts and communal violence also hinder social development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1139", "ch": 11, "page": 156, "ansPage": 156, "srcNo": "1140", "exam": "16/09/2020 S-I", "q": "The most significant agent to effect change in society is:", "o": ["Television", "Religion", "Language", "Education"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The term 'social change' was first used in 1965 at the annual conference of Cornell University (as printed). Education is the most influential agent affecting change in society. 'Education is the most powerful and important agent which can be used to change the world' is a statement of Nelson Mandela.", "tip": "", "status": "note", "note": "The printed date/origin of the term 'social change' is as given in the source and was not independently verified."}, {"id": "AOT-1140", "ch": 11, "page": 157, "ansPage": 157, "srcNo": "1141", "exam": "16/09/2020 S-I", "q": "The causes of individual differences are:", "o": ["Heredity", "Social and economic status", "Emotional and individual", "Environment and heredity"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Individual differences arise from heredity and environment. Individual difference means that each individual differs from another in biological, mental, cultural and emotional aspects.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1141", "ch": 11, "page": 157, "ansPage": 157, "srcNo": "1142", "exam": "26/02/2020 S-I", "q": "Children with disabilities must get education because:", "o": ["They are vulnerable", "They have special needs for education", "They are poor", "It is a basic constitutional right"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Education is essential for children with disabilities because it is their fundamental constitutional right. They experience difficulty in reading, writing, hearing and doing mathematical calculations. The 86th Amendment Act 2002 inserted Article 21(A) (right to education) in the Constitution of India, which gives all children (including those with disabilities) the right to free and compulsory education until they reach the age of 14 years.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1142", "ch": 11, "page": 157, "ansPage": 157, "srcNo": "1143", "exam": "26/02/2020 S-I", "q": "The problem child is generally one who has:", "o": ["An unsolved problem", "A poor home environment", "A poor heredity", "Over-protective parent(s)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A problem child is generally one who has an unsolved problem. Children have to face many problems in their daily routine, related to the classroom environment and learning atmosphere. The problem students are those who have some behavioural problem or do not follow rules, and teachers have to deal with many such problems.", "tip": "", "status": "disputed", "note": "Same question as Q1111, whose printed key is (c) 'poor home environment' (options in a different order). Conflicting printed keys; each retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-062", "first": false, "kind": "exact", "of": "AOT-1110", "keyConflict": true}}, {"id": "AOT-1143", "ch": 11, "page": 157, "ansPage": 157, "srcNo": "1144", "exam": "28/01/2020 S-II", "q": "Which of the following is considered as society's main resource for social experimentation?", "o": ["School", "Family", "Mass media", "All of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The school is considered the main resource for social experimentation, because the school is considered the centre of socialisation. The school helps students receive values, norms and traditions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1144", "ch": 12, "page": 157, "ansPage": 157, "srcNo": "1145", "exam": "09/06/2024 S-I", "q": "Teachers should carefully plan and imagine the use of teaching aids:", "o": ["For producing effective citizens", "After its actual presentation", "Before its actual presentation", "To gather information about students"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The teacher should carefully plan and imagine the use of teaching aids before the actual presentation. This ensures that the material is suitable, helps in effective learning and fulfils the objectives of teaching, so that students benefit the maximum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1145", "ch": 12, "page": 157, "ansPage": 157, "srcNo": "1146", "exam": "09/06/2024 S-I", "q": "Audio teaching aids facilitate:", "o": ["Teacher-student relationship", "Teaching technique", "Act of seeing", "Act of hearing"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Audio teaching aids mainly facilitate the act of hearing. They help students learn by listening, such as audio recordings, radio broadcasts or podcasts, which are helpful in understanding the subject matter.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1146", "ch": 1
