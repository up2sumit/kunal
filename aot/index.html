 steps in interactive activities", "Availability of smart classes"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The shortage of highly qualified teachers is a factor not directly related to teaching facilities and learning environment. The availability of textbooks, interactive activities and smart classes affect learning, whereas teacher qualification relates to staffing and administrative issues.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0579", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "579", "exam": "18/05/2024 S-I", "q": "The zone of proximal development refers to:", "o": ["The stage at which maximum development is possible", "The developmental stage when the child takes full responsibility for learning", "A context in which a child can do some task almost by himself with the right level of support", "The point of learning when support can be taken back"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The zone of proximal development (Vygotsky) refers to the context in which a child, with the right level of support, can do a task almost by himself. In developmental psychology it shows the area in which a child can do some task by himself or with the help or guidance of a more capable person.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0580", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "580", "exam": "18/05/2024 S-I", "q": "The Free and Compulsory Education Act 2009 ensures free education rights of children:", "o": ["From 6 years to 18 years", "From 3 years to 18 years", "From 6 years to 14 years", "From 6 years to 22 years"], "key": {"printed": [0], "verified": [2], "official": null}, "e": "The printed explanation: the Right of Children to Free and Compulsory Education Act, 2009 ensures the right to free education of all children from 6 to 14 years. Note: under the Rights of Persons with Disabilities Act, 2016, the Act was amended and the age of free and compulsory education for persons with disabilities was increased from 6 to 18 years.", "tip": "", "status": "disputed", "note": "Printed key letter (a) '6-18 years' contradicts the printed explanation (6-14 years for RTE 2009, option c); 6-18 applies only to children with disabilities via the RPWD Act 2016. Printed key retained; verified answer (c)."}, {"id": "AOT-0581", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "581", "exam": "24/05/2024 S-I", "q": "Which educational psychologist believed that 'all children have the ability to learn'?", "o": ["Friedrich Froebel", "John Dewey", "Johann Friedrich Herbart", "Maria Montessori"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Friedrich Froebel, a famous German educational psychologist, believed that 'all children have the ability to learn'. He propounded the theory that every child has a natural tendency to learn and that the environment helps them develop their complete potential.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0582", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "582", "exam": "24/05/2024 S-I", "q": "'______ teaching is very useful for intelligent students and slow learners.'", "o": ["Peer teaching", "Microteaching", "Team teaching", "Individual teaching"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Individual teaching is a teaching method which gives teaching to students according to their individual needs and learning level. It means the teaching is not the same for all students, but is adapted to the needs of every student.", "tip": "", "status": "note", "note": "Question number is misprinted as '852' in the source; treated as Q582."}, {"id": "AOT-0583", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "583", "exam": "24/05/2024 S-I", "q": "Which of the following is NOT a type of administration?", "o": ["Instructional administration", "Authoritarian administration", "Democratic administration", "Laissez-faire administration"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Instructional administration' is not a recognised style of administration; the other three are established styles of administration. The main types of administration are: 1. authoritarian (autocratic), 2. democratic (participative), 3. laissez-faire (free-rein).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0584", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "584", "exam": "22/05/2024 S-II", "q": "'Teaching and learning are twin ______ involved in the total educational process.'", "o": ["Process", "Objective", "Activities", "Participation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "'Teaching and learning are twin activities involved in the total educational process.' Teaching (by the teacher) and learning (by the student) are two active, interrelated activities of the whole learning process; they are not participants or objectives of the process but its main activities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0585", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "585", "exam": "22/05/2024 S-I", "q": "Which one of the following is NOT a characteristic of authoritarian administration?", "o": ["Indiscipline", "Suppression of subordinates", "Strict discipline", "Sharing"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In authoritarian administration, all rights lie with the top management. It includes features like suppression of indiscipline, suppression of subordinates and strict discipline, whereas sharing is not a part of it, since decision-making is not participative.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0586", "ch": 6, "page": 81, "ansPage": 81, "srcNo": "586", "exam": "22/05/2024 S-I", "q": "Leadership ability is for:", "o": ["Influencing", "Motivating", "Achieving organisational goals", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Leadership ability includes influencing, motivating and helping achieve the goals of an organisation. A good leader inspires others, gives the team the right direction and ensures collective success.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0587", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "587", "exam": "22/05/2024 S-I", "q": "Which of the following is NOT a limitation of pre-operational thought?", "o": ["Tendency to focus attention (centration)", "Development of symbolic thought", "Egocentrism", "Irreversibility"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main limitations of children's thought process in the pre-operational stage (2-7 years) are: (1) centration, (2) egocentrism (inability to see others' point of view), (3) irreversibility. The development of symbolic thought is not a limitation but an important positive achievement of this stage, in which children learn to use symbols imaginatively (e.g. making a stick a horse).", "tip": "", "status": "note", "note": "Option (d) is printed in Hindi as 'anukramaniyata'; read as irreversibility per the printed explanation."}, {"id": "AOT-0588", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "588", "exam": "22/05/2024 S-I", "q": "Which of the following is NOT a suitable method to help hypersensitive children learn?", "o": ["Breaking a task into small, manageable chunks", "Offering alternative ways of learning", "Including physical activity in their daily programme", "Often scolding them when they are restless"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Scolding hypersensitive children often when they are restless is the most unsuitable method, because it reduces their self-confidence. Breaking the lesson into small steps, offering alternatives and including physical activity are much more effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0589", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "589", "exam": "23/05/2024 S-II", "q": "What is the greatest benefit of interaction between teacher and students?", "o": ["It encourages students to ask questions", "It provides the facility of effective learning", "It results in better group relations", "It satisfies the teacher"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main benefit of interaction between teacher and student is that it provides the facility of effective learning. This deepens students' understanding and doubts are cleared immediately.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0590", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "590", "exam": "23/05/2024 S-II", "q": "'If a teacher is giving examples to explain, then he/she should ensure that ______.'", "o": ["It includes female and male students", "Students from different cultures and backgrounds", "It includes both female and male students and students from different cultures and backgrounds", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The teacher should include all students equally while giving examples. Examples should take into account the experiences of students of different cultures, languages and social backgrounds, so that every student can understand and learn by relating to them.", "tip": "", "status": "note", "note": "Option (c) appears at least as comprehensive as (b); printed key (b) retained."}, {"id": "AOT-0591", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "591", "exam": "23/05/2024 S-II", "q": "What does CO in POSDCORB stand for?", "o": ["Corporation", "Collection", "Coordination", "Correlation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In POSDCORB, 'CO' stands for Coordination. POSDCORB is an acronym for management functions proposed by Luther Gulick: P - Planning, O - Organising, S - Staffing, D - Directing, CO - Coordinating, R - Reporting, B - Budgeting.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0592", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "592", "exam": "21/05/2024 S-I", "q": "'Society determines the roles of men and women.' This statement shows that:", "o": ["Gender is an inherent attribute", "Gender is a hereditary talent", "Gender is an intuitive attribute", "Gender is a social construct"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The statement shows that gender is a social construct: gender-related roles and expectations are not given by nature but are created by society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0593", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "593", "exam": "25/05/2024 S-I", "q": "In EVS teaching, a teacher teaches about the leaves of trees. The best way is:", "o": ["Explaining orally about the leaves", "Explaining the leaves and their functions with the help of a model", "Without giving a lecture on the leaves", "Taking students to the garden"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In EVS, the most effective way of learning is observing real-life experiences. Taking students to the garden gives children the opportunity to directly see, touch and feel different kinds of leaves and interact with them. This links them to the real world and makes learning concrete and memorable; this is called 'experiential learning'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0594", "ch": 6, "page": 82, "ansPage": 82, "srcNo": "594", "exam": "25/05/2024 S-I", "q": "Which kind of classroom environment is more conducive to a child's learning?", "o": ["Passive classroom environment", "Teacher-adapted (teacher-adjusted) classroom environment", "Physical environment of the classroom", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A teacher-adapted classroom environment is more conducive to a child's learning, in which teachers encourage children by using various types of teaching technologies such as audio-visual material, drama and art; combining all these features creates an active and supportive classroom environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0595", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "595", "exam": "25/05/2024 S-I", "q": "Discipline, which plays an important role in the learning environment, helps:", "o": ["Children to regulate and monitor their learning", "To keep silent", "In giving instructions to teachers", "Children to memorise their lessons"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the learning environment, discipline does not merely mean following rules or staying silent. A deeper meaning is to help students develop self-regulation and self-monitoring skills; when children are disciplined they learn to take responsibility for their own learning and evaluate their progress, which makes them independent learners.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0596", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "596", "exam": "25/05/2024 S-I", "q": "A student-centred classroom is for:", "o": ["Addressing individual differences", "Reducing teacher-oriented lectures", "Recalling previous knowledge", "Engaging the entire class"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main objective of a student-centred classroom is to address students' individual needs, abilities and learning styles. It gives importance to each student's unique identity and gives them the opportunity to learn in their own way, at their own pace.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0597", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "597", "exam": "09/06/2024 S-II", "q": "Which of the following helps a teacher promote a positive environment in the class?", "o": ["Maintaining strict discipline in the class", "Implementing play-and-learn methods", "Giving each student the opportunity to learn at his own pace", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "All the options help create a positive environment: maintaining discipline helps ensure order in the class (though strictness alone is not enough, as it may create fear); play-and-learn methods make learning interesting and joyful; and allowing each student to learn at his own pace gives confidence and an inclusive environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0598", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "598", "exam": "09/06/2024 S-II", "q": "In EVS, a good home assignment should mainly focus on:", "o": ["Repeating and reinforcing", "Achieving mastery in learning", "Giving a challenge and enthusiasm for extension", "Better use of time"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In EVS, a good home assignment should mainly focus on 'giving a challenge and enthusiasm for extension'. The purpose of EVS is to inspire children to know more about the world around them and to learn new things; this encourages them to satisfy their curiosity and expand their knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0599", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "599", "exam": "27/05/2024 S-I", "q": "The team teaching originated in 'Jan American Education' (as printed) in the year ______.", "o": ["1954", "1958", "1957", "1966"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The concept of team teaching originated in American education in 1954. In this method, many teachers teach a group of students together so that they can share their specialisation and make the teaching-learning process more effective; its aim was to provide a better educational experience for students.", "tip": "", "status": "note", "note": "Source text reads 'Jan American Shiksha' (probably a garbled reference to American education); answer unaffected."}, {"id": "AOT-0600", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "600", "exam": "27/05/2024 S-I", "q": "Students who often ask questions in class:", "o": ["Should be advised to meet the teacher outside the class", "Should be encouraged to take part in debate", "Should be encouraged to find the answer by themselves", "Should be encouraged to ask questions on a regular basis"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The curiosity of students who often ask questions in class is a positive sign towards gaining knowledge. Such students should be encouraged to take part in debate; this teaches them to present their thoughts logically and understand the subject in depth, other students become active too, and a dialogue environment is created in the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0601", "ch": 6, "page": 83, "ansPage": 83, "srcNo": "601", "exam": "27/05/2024 S-I", "q": "Aanchal often asks inquisitive and imaginative questions in her fifth-grade EVS class. By doing so she wants to improve her ______.", "o": ["Observation skills", "Emotional skills", "Thinking skills", "Speaking skills"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "By asking inquisitive and imaginative questions in her fifth-grade EVS class, Aanchal tries to improve her thinking skills. She thinks deeply and tries to see questions from different perspectives; by asking imaginative questions she also gets the chance to learn new things and think differently, which helps develop her creative thinking.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0602", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "602", "exam": "26/05/2024 S-II", "q": "When you are asked to include a mentally disturbed child in your class, you will:", "o": ["Refuse to do so", "Request the principal to put the child in a section made for such children", "Ignore such a child in the class", "Learn ways of teaching such students and accept the child"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "As a teacher, it is your responsibility to adapt your teaching methods so that the diverse needs of all students, including children with special needs, can be met. Accepting the child and promoting inclusive education is an important aspect of education; it will benefit not only that child but also develop empathy and understanding in the whole class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0603", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "603", "exam": "26/05/2024 S-II", "q": "What do we see in a traditional teacher-directed class?", "o": ["Children's expression is not heard", "Passive education is being given", "Children speak only to answer the teacher's questions", "More than one option is correct"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In traditional teacher-directed classes certain features are seen: (1) children's expression is not heard - the teacher is at the centre, so children get few opportunities to express their thoughts; (2) passive education - students are often passive listeners, receiving only information; (3) limited dialogue - children generally speak only to answer the teacher's questions. Hence more than one option is correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0604", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "604", "exam": "19/06/2024", "q": "The children in a class can be considered to be motivated if:", "o": ["They come to school neatly dressed in uniform", "They maintain discipline in the class", "All are regular in attendance", "They ask questions seeking clarification from the teacher"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Children in a class are considered motivated when they participate actively in learning and ask questions to remove their doubts. They show interest in studies, seek clarification from teachers and have a desire to increase their knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0605", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "605", "exam": "19/06/2024", "q": "______ exhibits a basic level of order, but the teacher still struggles to maintain it.", "o": ["Adequate classroom environment", "Orderly restrictive learning environment", "Orderly enabling learning environment", "Dysfunctional classroom environment"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "There are four categories of classroom environment: lax, adequate, orderly (restrictive) and orderly (enabling/flexible). An adequate classroom environment exhibits a basic level of order enough for meaningful learning, but the teacher still struggles to maintain it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0606", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "606", "exam": "19/06/2024", "q": "The literal meaning of supervision is:", "o": ["Superior knowledge and power", "Superior knowledge and service", "Superior efforts and services", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The literal meaning of supervision is superior knowledge and power. Supervision is a constructive and dynamic process that provides guidance to teachers and students so that they can improve themselves and the teaching-learning situation, and so that the desired goals of education can be attained.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-032", "first": false, "kind": "near", "of": "AOT-0453"}}, {"id": "AOT-0607", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "607", "exam": "19/06/2024", "q": "Project-based activities are an example of:", "o": ["Explore", "Engage", "Explain", "Elaborate"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Project-based activities give students an opportunity to work on a subject in detail, where students actively work on a specific problem or project so as to gain knowledge and skills. This teaching method gives children practical experience and helps them develop a deeper understanding of what they have learnt; 'elaborate' is an example of it.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-031", "first": false, "kind": "near", "of": "AOT-0446", "keyConflict": true}}, {"id": "AOT-0608", "ch": 6, "page": 84, "ansPage": 84, "srcNo": "608", "exam": "19/06/2024", "q": "While teaching the topic on 'Our Friend-Birds' to class III students, Nalini followed the following methodologies: I. Showing a documentary film on birds. II. Using a chart having pictures of different birds and explaining briefly. III. Taking the students to the nearby park and asking them to observe the birds carefully. Nalini is using different approaches of learning in order to:", "o": ["Follow her lesson plan", "Meet different requirements of learners having multiple intelligence", "Impress other teachers and parents", "Promote reasoning skills in the students"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "EVS (Environmental Studies) teachers focus on developing knowledge and understanding of their environment and its relations; on developing skills of observation and measurement; on curiosity and awareness. These activities meet the different needs of learners having multiple intelligence. Same question as Q353.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-024", "first": false, "kind": "exact", "of": "AOT-0353"}}, {"id": "AOT-0609", "ch": 6, "page": 85, "ansPage": 85, "srcNo": "609", "exam": "29/05/2024 S-I", "q": "Team teaching is described as:", "o": ["A new idea in the field of medical", "A new idea in the field of education", "A new idea in the field of engineering", "A new idea in the field of commerce"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The correct description of team teaching is a new idea in the field of education, an innovation in education in which more than one teacher teaches a class together. Team teaching means that two or more teachers plan to teach a class together, in which they teach jointly.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0610", "ch": 6, "page": 85, "ansPage": 85, "srcNo": "610", "exam": "29/05/2024 S-I", "q": "The basic objective of an educational excursion in EVS is:", "o": ["To develop the energy of children", "First-hand experience to the students", "To promote socialisation", "To promote team spirit"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The basic objective of an educational excursion in EVS is to give students first-hand experience, so that they can connect what they are learning in class with the real world. Through such excursions students get a deeper understanding of the environment, their imagination is enhanced and they remember information better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0611", "ch": 6, "page": 85, "ansPage": 85, "srcNo": "611", "exam": "29/05/2024 S-I", "q": "Which one among the following is the strongest argument in favour of adopting a theme-based approach in EVS?", "o": ["It helps in giving a structure to lesson plans and makes teaching more effective", "It helps in making teaching more interesting and activity-based", "It helps in covering a wide range of concepts, issues and skills", "It helps in softening subject boundaries and accessing knowledge holistically"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The strongest argument for adopting a theme-based approach in EVS is that it gives a structure to lesson plans and makes teaching more effective. It also helps make teaching more interesting and activity-based.", "tip": "", "status": "note", "note": "Options (b) and (d) are also commonly cited merits of the theme-based approach; printed key (a) retained."}, {"id": "AOT-0612", "ch": 6, "page": 85, "ansPage": 85, "srcNo": "612", "exam": "16/06/2024 S-III", "q": "How would you make your students independent?", "o": ["Give responsibility to everyone", "Giving orders and expecting obedience", "Ignoring their petty fights", "Solving their problems for them"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Giving responsibility to students is the most effective way to make them independent. When students are given responsibility for tasks and decisions, they are motivated to think themselves, solve problems and become self-reliant, which increases their confidence and ability to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0613", "ch": 6, "page": 86, "ansPage": 86, "srcNo": "613", "exam": "16/06/2024 S-III", "q": "What would you do if you notice that students tend to doze off in your class?", "o": ["Give a command seeking attention", "Provide them a chance to be physically active", "Reprimand them", "Stop teaching for a while"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "If students are dozing off in the class, give an attention-seeking command or activity, which will bring their focus back and they will be able to join in studies again. Scolding or stopping teaching would not be effective, since it would not solve the problem.", "tip": "", "status": "note", "note": "Printed key (a); option (b) 'provide a chance to be physically active' is arguably the more constructive response. Key retained as printed."}, {"id": "AOT-0614", "ch": 6, "page": 86, "ansPage": 86, "srcNo": "614", "exam": "16/06/2024 S-III", "q": "A child-friendly classroom should have:", "o": ["Materials should be of suitable sizes because children could reach", "There should be sufficient inexpensive materials because children tend to waste", "Furniture and materials should be of larger sizes because children grow very fast", "There should be sufficient expensive materials because children should be exposed to expensive materials"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A child-friendly classroom should have material of a size within children's reach and suitable for them, so children can use things independently, choose their activities and become more involved in the learning process. This also increases children's self-confidence.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0615", "ch": 6, "page": 86, "ansPage": 86, "srcNo": "615", "exam": "16/06/2024 S-III", "q": "The basic purpose of supervision is to help:", "o": ["Teachers in improving methods", "Teachers in understanding pupils", "Children learn more effectively", "Teachers in dealing with pupils"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The basic objective of supervision is to help teachers improve their teaching methods and understand students better; its aim is to help children learn meaningfully and effectively, so that their entire educational experience improves.", "tip": "", "status": "note", "note": "Q575 and Q606 treat the basic objective as helping the teacher improve teaching methods (option a in that question). Printed key here (c); both readings are supported by the printed explanation."}, {"id": "AOT-0616", "ch": 6, "page": 86, "ansPage": 86, "srcNo": "616", "exam": "16/06/2024 S-III", "q": "Children coming from a socio-economically disadvantaged background need a classroom environment which:", "o": ["Teaches them good behaviour", "Values and uses their cultural and linguistic knowledge", "Discourages the use of their language so that they learn the mainstream language", "Categorises children based on their abilities"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Children from socio-economically disadvantaged backgrounds need a classroom environment that values and uses their cultural and linguistic knowledge. It is helpful in their learning and makes them feel included.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0617", "ch": 6, "page": 86, "ansPage": 86, "srcNo": "617", "exam": "18/05/2024 S-III", "q": "______ is the major cause of the difference in the classroom behaviour of boys and girls.", "o": ["Developmental differences", "Educational levels", "Job aspirations", "Societal expectations"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main reason for the difference in classroom behaviour of boys and girls is societal expectations. Society decides different roles for children on the basis of their gender - for example, boys are considered more confident and girls modest. These notions influence children's behaviour, co-operation and way of learning, producing differences in the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0618", "ch": 6, "page": 86, "ansPage": 86, "srcNo": "618", "exam": "18/05/2024 S-III", "q": "A sense of responsibility is not cared for in:", "o": ["Instructional administration", "Authoritarian administration", "Democratic administration", "Laissez-faire administration"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to the principles of educational administration, in laissez-faire administration the administrator interferes minimally. The employees get complete autonomy, with the result that the feeling of responsibility becomes weak. In other styles (authoritarian, democratic) responsibility is clearly fixed. Same question as Q477.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-037", "first": false, "kind": "exact", "of": "AOT-0477"}}, {"id": "AOT-0619", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "619", "exam": "18/05/2024 S-III", "q": "The school is an institution of socialisation of children where:", "o": ["Schoolchildren occupy the central position", "School routines occupy the central position", "School activities occupy the central position", "Schoolteachers occupy the central position"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The school is an important institution of socialisation where children are taught social norms, values and conduct. According to Dr. Ramnath Sharma's book 'Educational Sociology', 'the school is the institution of socialisation where the main place belongs to the children, because all the activities of education are centred on the all-round development of students'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0620", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "620", "exam": "18/05/2024 S-III", "q": "'Spare the rod and spoil the child' gives the message that:", "o": ["Children should be beaten with rods", "Corporal punishment is not acceptable", "Undesirable behaviour must be punished", "Punishment in the class should be banned"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "This popular saying supports the principle of discipline. The original message states that punishment is necessary as a result of undesirable behaviour; but in the current educational viewpoint, instead of physical punishment, positive ways of behaviour modification are emphasised, and instead of punitive action the child is corrected through logical consequences.", "tip": "", "status": "note", "note": "Printed key (d) 'punishment in the class should be banned' is difficult to derive from the saying itself; the printed explanation supports (b)-type reasoning. Printed key retained, flagged for review."}, {"id": "AOT-0621", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "621", "exam": "14/06/2024 S-III", "q": "After a lecture, the teacher allows time for:", "o": ["Question", "Assignment", "Fun", "Task"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "After a lecture, the teacher gives time for questions. It helps students clear their doubts and develop a better understanding of the subject matter; it is an important teaching method that promotes active participation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0622", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "622", "exam": "19/05/2024 S-III", "q": "Repetition of concepts of the same level in two consecutive classes lacks the quality of:", "o": ["Horizontal organisation", "Vertical organisation", "Relevancy", "Flexibility"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When concepts of the same level are repeated in two consecutive classes, vertical organisation is lacking. Vertical organisation means the concepts are developed in sequence from class to class in depth and complexity, not just repeated.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0623", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "623", "exam": "19/05/2024 S-III", "q": "Which of the following is more important for keeping the good mental health of students?", "o": ["Provision for curricular activities", "Freedom of expression", "Variety of interest", "Teacher's role and school environment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "To keep students' mental health good, the teacher's role and school environment are essential. School and teachers play an important role in education, providing an environment suitable for students to learn; teachers impart not only knowledge but also values, ethics and discipline, and help in all-round development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0624", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "624", "exam": "05/09/2023 S-III", "q": "In the progressive classroom ecosystem, children are seen as:", "o": ["Passive imitators", "Active imitators", "Active investigators", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In the progressive classroom ecosystem, children are encouraged to form their own ideas and principles. They are allowed to be active investigators and ask questions, in which children engage in the natural way of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0625", "ch": 6, "page": 87, "ansPage": 87, "srcNo": "625", "exam": "05/09/2023 S-I", "q": "Which components are NOT included in the classroom process?", "o": ["Outcome of expected learning", "Assessment of students' learning", "Assessment of the teacher's performance", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Assessment of the teacher's performance is not included in classroom processes. Assessment helps make necessary improvements in curriculum, teaching methods and teaching aids; the teacher learns about weaknesses and organises teaching better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0626", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "626", "exam": "05/09/2023 S-I; 10/09/2023 S-I", "q": "After class teaching is completed:", "o": ["The blackboard should be cleaned by a student", "The teacher should clean the blackboard", "The blackboard should be left as it is", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "After the class is over, the teacher should step out of the class while cleaning the blackboard, because if the blackboard is not cleaned and another teacher comes in the next class, students will not be able to focus on the class as they themselves get distracted. These are class-management activities that a teacher must follow when teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0627", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "627", "exam": "13/09/2023 S-I", "q": "What is most influential on students' learning in the classroom?", "o": ["Classroom discipline", "Psychological environment of the classroom", "Social environment of the classroom", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The greatest influence on students' learning in class is when a psychological environment is made possible in the class. The learning of children will be most effective when cognitive, emotional and psychomotor development takes place.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-041", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0628", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "628", "exam": "10/09/2023 S-I; 13/09/2023 S-I", "q": "The basic principles of inclusive education are:", "o": ["Every category of children is included", "Inclusion emphasises diversity", "Both A and B", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Inclusive education means including children from all sections of society in the mainstream and giving them equal opportunities. Its basic principles: children of every category are included; each student has inherent capacity and talent; inclusion emphasises diversity; and it is beneficial for the learning opportunities of both teachers and students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0629", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "629", "exam": "08/09/2023 S-I", "q": "Spread of values, norms and beliefs in the classroom environment is:", "o": ["Main curriculum", "Hidden curriculum", "Content curriculum", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The spread of values, norms and beliefs in the classroom environment comes under the hidden curriculum. The hidden curriculum refers to the unwritten, unofficial and often unintended lessons, values and perspectives that students learn at school. It is not part of the formal curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0630", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "630", "exam": "08/09/2023 S-I", "q": "What type of classroom environment is more conducive to a child's learning?", "o": ["Passive classroom environment", "Classroom environment adapted to the teacher", "Physical environment of the classroom", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For a child's learning, a cooperative and collaborative classroom physical environment is more conducive. In this type of environment students actively engage in learning and get chances to learn from one another; an environment in which students only listen to the teacher and take notes is less conducive.", "tip": "", "status": "note", "note": "Printed key (c) conflicts with Q594 (key b: teacher-adapted environment is more conducive). Both retained as printed."}, {"id": "AOT-0631", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "631", "exam": "08/09/2023 S-II", "q": "Authoritarian teaching is:", "o": ["Child-centred", "Teacher-centred", "Experience-centred", "None"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Authoritarian teaching is teacher-centred. The teacher has complete control over the teaching process and students' behaviour in this method; no emphasis is laid on the learning abilities, capacities, interests and personality of the student. Authoritarian styles of teaching include lecture method, demonstration, team teaching, tutoring, etc.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0632", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "632", "exam": "09/09/2023 S-II", "q": "The role in promoting the physical environment of the classroom belongs to:", "o": ["Teachers", "Students", "Principal", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The physical environment of the classroom means how the classroom is organised, including visual and audio resources and furniture. Students play an important role in promoting the physical environment of the class. The physical environment may be related to both student achievement and student behaviour; a positive classroom helps create a safe, respectful and welcoming atmosphere.", "tip": "", "status": "note", "note": "Printed key (b) 'students'; teachers would normally be the primary agents. Key retained as printed."}, {"id": "AOT-0633", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "633", "exam": "09/09/2023 S-II", "q": "The ecosystem of the classroom should be based on:", "o": ["Natural element", "Artificial element", "Technical element", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "An ecosystem is a natural system in which living and non-living components interact with each other. The classroom ecosystem should also be a natural system with a balance among students, teachers and the classroom environment that motivates students to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0634", "ch": 6, "page": 88, "ansPage": 88, "srcNo": "634", "exam": "10/09/2023 S-I", "q": "What is most influential on students' learning in the classroom?", "o": ["Classroom discipline", "Psychological environment of the classroom", "Social environment of the classroom", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The greatest influence on students' learning in class is when the psychological environment of the classroom is possible. Learning is a broad process that refers to change in behaviour, knowledge and skills as a result of practice and experience.", "tip": "", "status": "note", "note": "Repeat of Q627 (same answer).", "dup": {"group": "DUP-041", "first": false, "kind": "exact", "of": "AOT-0627"}}, {"id": "AOT-0635", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "635", "exam": "10/09/2023 S-I", "q": "A good method for promoting cooperation in a mixed class of boys and girls is:", "o": ["Group work", "Lecture", "Demonstration", "Mixed method"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Group work is the best method for promoting cooperation between boys and girls. It gives students of all abilities the opportunity to progress according to their capacity. A mixed approach improves both quality and quantity and allows students to study at their own pace.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-027", "first": false, "kind": "exact", "of": "AOT-0375"}}, {"id": "AOT-0636", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "636", "exam": "13/09/2023 S-I", "q": "Drama or role play is suitable for teaching ______.", "o": ["Science", "Mathematics", "History", "Geography"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Drama or role play is suitable for teaching history, because drama is like a mirror in which a person's image can be evaluated; students can understand human behaviour and the depth of the feelings of themselves and others.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-025", "first": false, "kind": "exact", "of": "AOT-0373"}}, {"id": "AOT-0637", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "637", "exam": "13/09/2023 S-I", "q": "Student-centred lessons advance:", "o": ["Overall development", "Excess activity", "Loss of interest", "Non-interactive"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Student-centred lessons promote overall development, in which students are made responsible to build their understanding with the teacher's guidance. The student-centred approach supports: flexible curriculum, varied learning time, different ways of teaching, various learning experiences/tasks/activities, and different ways of assessing student progress.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0638", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "638", "exam": "15/09/2023 S-I", "q": "In an inclusive classroom a teacher should:", "o": ["Ignore the cultural differences of students", "Promote students related to one culture", "Respect and give importance to all cultures", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In an inclusive classroom, a teacher should respect and value all cultures. The teacher should not ignore students' cultural differences but understand and accept them, and instead of promoting students of one culture, should encourage and respect all equally.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0639", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "639", "exam": "15/09/2023 S-I", "q": "Establishing a class is an example of:", "o": ["Class management", "Discipline", "Rules", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Setting up a class is an important part of class management. Class management means creating an environment in the class that enables students to learn; to manage the class, teachers need to maintain discipline, encourage cooperation among students and motivate students to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0640", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "640", "exam": "09/09/2020 S-III", "q": "The system of classroom teaching depends on:", "o": ["The educational qualification of the headmaster", "The professional proficiency of the teacher", "The cooperation of other teachers", "The decoration of the school"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The system of classroom teaching depends on the professional proficiency of the teacher. Classroom teaching is a process that allows the teacher to control the education and direction of their classes; a teacher leads students and guides them in different activities for a better learning experience.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0641", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "641", "exam": "09/09/2020 S-III", "q": "The best system of classroom teaching is one in which:", "o": ["Question and answer is not required", "The teacher asks questions to the students", "Students should solve doubts with their teacher", "Both teachers and students should ask questions of each other"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The best system of classroom teaching is one in which students resolve their doubts with the teacher. Classroom teaching is a process that allows teachers to control their class's education and direction. The main aim of teaching-learning is to prepare a conducive class environment so that students learn and grow better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0642", "ch": 6, "page": 89, "ansPage": 89, "srcNo": "642", "exam": "09/09/2020 S-III", "q": "Young learners should be encouraged to interact with peers in the classroom so that:", "o": ["The syllabus can be covered quickly", "They learn social skills in the course of study", "The teacher can control the classroom better", "They can learn answers to questions from each other"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Young learners should be encouraged to participate with their peers in class so that they learn social skills during the course. Peer relations play an important and constructive role in the development of the child; social interaction is a mechanism through which the child understands his behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0643", "ch": 6, "page": 90, "ansPage": 90, "srcNo": "643", "exam": "09/09/2020 S-III", "q": "Communicating ideas in the classroom depends:", "o": ["On classroom interaction", "On the lecture skills of the teacher", "On subject difficulty", "On the merit of students"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Communication of ideas in the classroom depends on the difficulty of the subject. To make teaching effective in the class, communication between teacher and students is essential; communication between teacher and student is of two types: verbal and non-verbal.", "tip": "", "status": "note", "note": "Printed key (c); options (a)/(b) are generally considered stronger determinants. Retained as printed."}, {"id": "AOT-0644", "ch": 6, "page": 90, "ansPage": 90, "srcNo": "644", "exam": "09/09/2020 S-I", "q": "An environment is conducive for children's learning where:", "o": ["Family discipline is strict", "Freedom to play and sing", "His language, pre-experience and feeling are respected", "The priority is of the textbook"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "An environment is suitable for children's learning where there is freedom to play and sing, providing a series of social, athletic, educational and artistic programmes. Children should be kept in an independent and favourable environment according to their interest, with proper discipline and education, so that they can solve problems actively.", "tip": "", "status": "note", "note": "Option (c) is also a standard marker of a child-friendly environment; printed key (b) retained."}, {"id": "AOT-0645", "ch": 6, "page": 90, "ansPage": 90, "srcNo": "645", "exam": "14/09/2020 S-I", "q": "The work in which children themselves feel joy and gain experience while doing it is called:", "o": ["Consumer type work", "Constructive (creative) type work", "Problem type work", "Drill and practice work"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The task that children do themselves and enjoy, and from which they gain experience, is called drill and practice. A drill and practice programme gives students an opportunity to work on problems or examples at one time and then get feedback on their performance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0646", "ch": 6, "page": 90, "ansPage": 90, "srcNo": "646", "exam": "10/09/2020 S-II", "q": "Inclusive education is about:", "o": ["Making provisions for education for all children", "Welcoming and celebrating diversity", "Improving the quality of education for all", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Inclusive education is education in which children with physical, mental and other disabilities and non-disabled children study together in the same school. Inclusive education talks about the equal right of all citizens; it relates to making provisions for education for all children, welcoming and celebrating diversity, and bringing quality to education for all.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0647", "ch": 6, "page": 90, "ansPage": 90, "srcNo": "647", "exam": "10/09/2020 S-I", "q": "Difficult sentences and negative expressions make communication:", "o": ["Effective", "Ineffective", "Normal", "Difficult"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Difficult sentences and negative expressions make communication ineffective. Communication is the exchange of ideas; if difficult or negative sentences are used, the communication of the language or idea becomes ineffective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0648", "ch": 6, "page": 90, "ansPage": 90, "srcNo": "648", "exam": "10/09/2020 S-I", "q": "Which statement is untrue in the context of silent reading?", "o": ["Reading without utterance in the mind is called silent reading", "This is the final stage of learning reading skill", "Whispering reading is silent reading", "Silent reading is considered superior in public places"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Silent reading is a type of reading in which written material is read with understanding without speaking aloud: reading in the mind without utterance is silent reading; it is the final stage of learning reading skill; and silent reading is considered superior in public places. Whispering while reading is not silent reading, so statement (c) is untrue.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0649", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "649", "exam": "10/09/2020 S-I", "q": "Which method of communication is best for controlling noise in the classroom?", "o": ["Shout out loud", "Poke fear", "Continuing teaching amidst the din", "Keep calm and look at students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The best method of communication to control noise in the classroom is to remain calm and look at the students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0650", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "650", "exam": "10/09/2020 S-I", "q": "When the words of another language are used in the sentence of one language, it is called:", "o": ["Code mixing", "Word mixing", "Displacement", "Duality"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "When words of another language are used in a sentence of one language, it is called code mixing. The use of the code of another language in one language is code mixing; this is accepted as a mixture of two or more languages between sentences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0651", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "651", "exam": "10/09/2020 S-I", "q": "The process of socialisation of the child begins:", "o": ["At birth", "From childhood", "From adolescence", "From maturity"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The process of socialisation of a child begins from the first few days after birth. The first factor is the family: as a family member the child establishes interactive relations with other family members and imitates their behaviour. Socialisation is the process through which a human being assimilates culture.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0652", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "652", "exam": "10/09/2020 S-I", "q": "The potential behaviour of a despised (rejected) child in the classroom will be:", "o": ["Disinterested", "Enthusiastic", "Full of anger", "Negative"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The likely behaviour of a despised child in the classroom will be disinterest. A teacher has to deal with many problems of such students: a good teacher is one who does not let students fear the teacher but lets them wait for the class and ask questions without hesitation. Each child is unique and has individual differences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0653", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "653", "exam": "11/09/2020 S-I", "q": "If you find a student wearing some odd dress in your class, you will:", "o": ["Ask the student not to attend the class", "Make a joke on him/her", "Counsel him not to wear such clothes in a class", "Not pay any attention"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If a student wears bad clothes in class, he should be counselled not to wear such clothes in the class; then advise him on the class dress code. Take the student aside and talk to him.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0654", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "654", "exam": "11/09/2020 S-I", "q": "If a child writes with his/her left hand and is comfortable doing things with it, she/he should be:", "o": ["Discouraged", "Made to write with the left hand", "Allowed his preference", "Sent to seek medical help"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "If a child writes with the left hand and is comfortable working with it, the child's preference should be allowed; that is, the teacher should allow the student to use the hand of his choice. The hand used in writing does not affect the quality of students' learning in any way.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0655", "ch": 6, "page": 91, "ansPage": 91, "srcNo": "655", "exam": "11/09/2020 S-I", "q": "The schools, through their programmes, help students to:", "o": ["Assimilate culture", "Protest culture", "Ignore other culture", "Make them cultured"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The school helps students to become cultured through its programmes. The role of culture is very important in the development of students: it facilitates them to assimilate a different culture, and as a means of culture, education carries culture from one generation to the next and contributes to its permanence.", "tip": "", "status": "note", "note": "Option (a) 'assimilate culture' is also plausible; printed key (d) retained."}, {"id": "AOT-0656", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "656", "exam": "11/09/2020 S-I", "q": "Navodaya schools have been established to:", "o": ["Increase the number of schools in rural areas", "Provide good education in rural areas", "Complete 'Sarva Shiksha Abhiyan'", "Check wastage of education in rural areas"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Navodaya Vidyalayas were established to provide good education in rural areas. According to the National Policy on Education 1986, the Government of India began Jawahar Navodaya Vidyalayas, mainly to provide quality modern education to talented children from rural areas, regardless of their family's socio-economic condition.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0657", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "657", "exam": "11/09/2020 S-I", "q": "Which of the following is an effective strategy to reduce children's gender stereotyping and gender-role conformity?", "o": ["Discussion about gender bias", "Emphasising gender-specific roles", "Gender-segregated play groups", "Gender-segregated seating arrangement"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Discussion about gender bias is an effective strategy to reduce gender stereotyping and gender-role conformity in children. When a teacher behaves in class keeping gender in mind, this is called gender bias, so a good teacher should not show gender bias in class. Gender prejudice points towards expectations based on stereotypes of boys and girls.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0658", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "658", "exam": "11/09/2020 S-I", "q": "During classroom discussion, a teacher often pays more attention to boys than girls. This is an example of:", "o": ["Gender bias", "Gender identity", "Gender relevance", "Gender constancy"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "During discussion in the class, a teacher usually pays more attention to boys than girls; this is an example of gender bias. When a teacher behaves in class keeping gender in mind, it is called gender bias.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0659", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "659", "exam": "14/09/2020 S-I", "q": "While delivering a lecture, if there is some noise in the class, the teacher should:", "o": ["Pause for a while and then proceed", "Leave the class", "Punish the students creating noise", "Not worry about whatever is going on in the class"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "When some disturbance occurs in the class during a lecture, the teacher should stop for a moment and then proceed. If the disturbance continues, they should maintain peace by involving the students in some activity or discussion and make them aware of the benefits of focusing on the class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0660", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "660", "exam": "14/09/2020 S-I", "q": "Classroom discipline can be maintained in an effective way by:", "o": ["Handling the causes of indiscipline strictly", "Providing programmes to students according to their interest", "Giving corporal punishment", "Involving students on the blackboard"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Classroom discipline can be effectively maintained by providing programmes to students according to their interest. It should result in a gradual development in the class of habits of discipline, self-control and cooperation. Means of maintaining classroom discipline: give punishment where needed; make things interesting in class; develop the habit of working in an organised manner.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0661", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "661", "exam": "15/09/2020 S-III", "q": "The most important cause of teacher failure in discipline in class is the teacher's lack of:", "o": ["Competence in teaching methods", "Knowledge of his/her subject", "A constructive programme of meaningful things to be learned", "Knowledge of educational psychology"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The biggest reason for a teacher's failure to maintain discipline in class is the lack of knowledge of the subject. Competence in teaching methods and a structured programme of meaningful things for learning are also important, but without knowledge of educational psychology, discipline cannot be effective.", "tip": "", "status": "note", "note": "Printed explanation closes with 'option (b) is correct' while naming educational psychology in the preceding line; key (b) retained."}, {"id": "AOT-0662", "ch": 6, "page": 92, "ansPage": 92, "srcNo": "662", "exam": "15/09/2020 S-III", "q": "Several research studies show that teachers have more overall interaction with boys than girls. What is the correct explanation for this?", "o": ["Boys have much more academic capabilities than girls", "Boys need more attention than girls", "This is an example of gender bias in teaching", "Boys are easier to manage than girls in the classroom"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "More interaction by teachers with boys than with girls is an example of gender bias in teaching. This bias can occur for many reasons, such as teachers' own gender prejudice, social expectations and the classroom environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0663", "ch": 6, "page": 93, "ansPage": 93, "srcNo": "663", "exam": "15/09/2020 S-III", "q": "Why should there be discipline in the class?", "o": ["Children should realise the benefits of an organised and orderly world", "Children should accept the authority of the teacher", "Children should feel that it is mandatory", "It will help them in case they choose to become a teacher"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "There should be discipline in the class so that children can realise the benefits of an organised and orderly world. Discipline keeps peace and order in the class, so children can concentrate on studies and learn better; it also develops self-discipline, time management and leadership qualities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0664", "ch": 6, "page": 93, "ansPage": 93, "srcNo": "664", "exam": "15/09/2020 S-III", "q": "Physical punishment in school has been banned because:", "o": ["It may create trauma among students", "Students do not like it", "Parents reject it", "It has a negative impact on learning"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Physical punishment is banned in schools because the tension a child gets from it adversely affects the brain's development and learning. Besides, physical discipline can soon escalate into misuse and abuse, and the effects of childhood corporal punishment may persist into adulthood.", "tip": "", "status": "note", "note": "Option (a) is also a recognised ground; printed key (d) retained."}, {"id": "AOT-0665", "ch": 6, "page": 93, "ansPage": 93, "srcNo": "665", "exam": "15/09/2020 S-I", "q": "The main objective of classroom teaching is:", "o": ["To develop an inquiring mind", "To develop personality of students", "To give information", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The classroom is a place where different activities take place, where interaction occurs, and where standards and guidelines are formed to promote social situations. The main objective of classroom teaching is to facilitate learning and to develop the mind to ask questions.", "tip": "", "status": "disputed", "note": "Q577 gives 'development of personality' as the main objective; printed keys conflict. Each retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-040", "first": false, "kind": "near", "of": "AOT-0577", "keyConflict": true}}, {"id": "AOT-0666", "ch": 6, "page": 93, "ansPage": 93, "srcNo": "666", "exam": "15/09/2020 S-I", "q": "Quality of leadership can be developed in students by:", "o": ["Inspiring them", "Asking them to punish other students", "Preaching them", "Entrusting them with responsibility"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The quality of leadership in students can be developed by entrusting them with responsibility. A student leader is a person who is in a position to influence others, guide and bring them together to achieve a goal.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0667", "ch": 6, "page": 93, "ansPage": 93, "srcNo": "667", "exam": "15/09/2020 S-I", "q": "The objective of organising work experience in school is:", "o": ["Preparing youth for future vocations", "Establishing relationship between school and workplace", "Providing free time to teachers after engaging students", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main objectives of organising work experience in students: preparing youth for future work; establishing a relationship between workplace and school; and giving teachers some free time after teaching in class.", "tip": "", "status": "note", "note": "Option (c) 'providing free time to teachers' is an unusual objective; printed key (d) retained as given."}, {"id": "AOT-0668", "ch": 6, "page": 93, "ansPage": 93, "srcNo": "668", "exam": "16/09/2020 S-I", "q": "A teacher labels the head of a committee as 'Chairperson' instead of 'Chairman'. It indicates that the teacher:", "o": ["Has a good command of language", "Is using gender-free language", "Has gender bias", "Did not follow acceptable words"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A teacher addressing the head of the committee as 'chairperson' instead of 'chairman' shows that the teacher has used gender-free (gender-neutral) language. Such language is used to present an ideal language to promote gender equality when addressing any gender.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0669", "ch": 6, "page": 94, "ansPage": 94, "srcNo": "669", "exam": "16/09/2020 S-I", "q": "The most important factor in the effective teaching process is:", "o": ["Discipline of the teacher", "Mastery of the content by the teacher", "Teacher-student dialogue", "Timely completion of the syllabus"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teacher-student dialogue is the most important factor in the effective teaching process. Through teacher-student dialogue, friendly relations are established between teacher and students, and this makes the students curious to learn from the teacher.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-019", "first": false, "kind": "near", "of": "AOT-0287"}}, {"id": "AOT-0670", "ch": 6, "page": 94, "ansPage": 94, "srcNo": "670", "exam": "16/09/2020 S-I", "q": "How will you practise democracy in the classroom?", "o": ["Providing equality of opportunity to pupils", "Giving freedom for pupils in educational choices", "Providing special programmes for the disadvantaged groups", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "You can practise democracy in the class by giving students equal opportunity, giving them freedom in educational choices, and providing special programmes for disadvantaged groups. So all of the above options are correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0671", "ch": 6, "page": 94, "ansPage": 94, "srcNo": "671", "exam": "18/09/2020 S-II", "q": "Corporal punishment in schools has been prohibited by the:", "o": ["Child Labour Prohibition Act", "National Policy on Education", "National Curriculum Framework", "RTE Act, 2009"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Corporal punishment has been prohibited by the RTE Act, 2009. The Right to Education Act 2009 puts a ban on physical punishment and mental harassment and recognises it as a punishable offence.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0672", "ch": 6, "page": 94, "ansPage": 94, "srcNo": "672", "exam": "18/09/2020 S-II", "q": "Giving punishment, verbal or nonverbal, to children results in:", "o": ["Motivating them to work", "Protecting the child's image", "Improving their scores", "Damaging their self-concept"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Punishment is not very effective in ending undesirable behaviour: punishing damages their self-concept. Examples of punishment include harsh punishment, scolding or threatening, and keeping children in custody after class hours.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0673", "ch": 6, "page": 94, "ansPage": 94, "srcNo": "673", "exam": "28/01/2020 S-II", "q": "Which of the following Articles of the Constitution of India lays down that the education of children aged 6-14 years is a Fundamental Right?", "o": ["Article 45", "Article 42", "Article 21(A)", "Article 51(B)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Under Article 21(A) of the Indian Constitution, the education of children aged 6-14 years is a Fundamental Right. This is the Right to Education Act, 2009 (RTE), whose objective is to provide free and compulsory education.", "tip": "", "status": "note", "note": "Same question as Q139 (key c).", "dup": {"group": "DUP-012", "first": false, "kind": "near", "of": "AOT-0139"}}, {"id": "AOT-0674", "ch": 6, "page": 94, "ansPage": 94, "srcNo": "674", "exam": "28/01/2020 S-I", "q": "Which of the following functions is not related to school as an agency of education?", "o": ["Preserving knowledge, values, customs, etc.", "Giving definite solutions to religious problems", "Suggesting ways and means to social development", "Socialising children for performing their future role"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main function of the school is to give education, which includes preservation of knowledge, values and customs, guidance for social development and socialisation for future roles. Giving definite solutions for religious problems is done by religious institutions, so it is not related to the school as an agency of education. Same question as Q304.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-021", "first": false, "kind": "near", "of": "AOT-0304"}}, {"id": "AOT-0675", "ch": 6, "page": 95, "ansPage": 95, "srcNo": "675", "exam": "28/01/2020 S-I", "q": "A child who uses a wheelchair:", "o": ["Should not be in the regular school", "Should be given education in a regular school in a lower class", "Should study only in a special school", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "A child who uses a wheelchair should study in the regular school. All children have the right to receive equal education whatever their physical or mental ability; children using wheelchairs in a regular school can enjoy equal opportunities with other children and become full and productive members of society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0676", "ch": 6, "page": 95, "ansPage": 95, "srcNo": "676", "exam": "28/01/2020 S-I", "q": "A school headmaster has the responsibility to:", "o": ["Help the school in its development", "Observe the classroom teaching and suggest improvements if required", "Develop the teaching-learning material", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The headmaster's responsibilities are to help in the development of the school, to observe classroom teaching and suggest improvements if required, and to get teaching-learning material developed. So all of these are the responsibilities of the principal.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0677", "ch": 7, "page": 95, "ansPage": 95, "srcNo": "677", "exam": "24/05/2024 S-I", "q": "The physical condition of books should be properly maintained. This is known as:", "o": ["Collation", "Conservation", "Shelf arrangement", "Organisation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The process of keeping the physical condition of books in good order and protecting them for a long time is called conservation. It provides long-term protection and includes measures to protect books from dust, moisture, insects and other damage.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-042", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0678", "ch": 7, "page": 95, "ansPage": 95, "srcNo": "678", "exam": "24/05/2024 S-I", "q": "The research technique that results in the formation of the subject matter by process is called:", "o": ["Loose combination", "Fragmentation", "Distillation", "Cluster (swarm)"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In the research technique, the process of refining the subject matter is called distillation. Distillation works like extraction: it filters impure data and facts and brings out the pure essence of research. The other options are wrong in this context.", "tip": "", "status": "note", "note": "Option wording translated from Hindi (dheela sanyojan, vikhandan, aasavan, jhund); question stem is loosely worded in the source."}, {"id": "AOT-0679", "ch": 7, "page": 95, "ansPage": 95, "srcNo": "679", "exam": "24/05/2024 S-I", "q": "On comparing lecture and demonstration lessons, which of the following is NOT true?", "o": ["Slow students benefit from the lecture compared to fast students", "Demonstration lessons involve more activities for students", "The lecture method is more flowing and useful for a large group", "It is difficult to find out students' learning in a lecture session"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the lecture method the teacher speaks and students listen, so a slow learner gets less benefit; such students need a practical and participatory teaching approach (such as a demonstration). The other options correctly compare lecture and demonstration lessons.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0680", "ch": 7, "page": 95, "ansPage": 95, "srcNo": "680", "exam": "24/05/2024 S-I", "q": "Students who do not need visual resources will be at the ______.", "o": ["General level", "Lower level", "Higher level", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Students who do not need visual resources are generally at a higher level, because they can understand abstract concepts without any visual aid.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0681", "ch": 7, "page": 95, "ansPage": 95, "srcNo": "681", "exam": "23/05/2024 S-II", "q": "Which of the following classrooms promotes rich learning?", "o": ["A classroom in which various types of material displayed are beyond the reach of children so that the material lasts long", "A classroom with open activity corners and various types of children's literature kept on open shelves which can be accessed at any time of the day", "A classroom with well-organised material in a cupboard where games are brought out once a week for a fixed time", "A classroom of structured and planned learning conducted by textbook material"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A classroom with open activity corners and various types of children's literature on open shelves, which can be accessed at any time of the day, promotes rich learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0682", "ch": 7, "page": 95, "ansPage": 95, "srcNo": "682", "exam": "23/05/2024 S-II", "q": "Which of the following is NOT considered a library of national importance?", "o": ["Saraswati Mahal Library", "Delhi Public Library", "Khuda Bakhsh Oriental Library", "Rampur Raza Library"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The libraries of national importance include: 1. Saraswati Mahal Library (Thanjavur, Tamil Nadu); 2. Khuda Bakhsh Oriental Library (Patna, Bihar); 3. Rampur Raza Library (Rampur, Uttar Pradesh). The Delhi Public Library is an important library but is not considered a library of national importance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0683", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "683", "exam": "21/05/2024 S-I", "q": "The meaning of freedom in education is:", "o": ["The feeling of opposing the rules of the school", "The student doing anything by his own will", "Recognising the freedom of independent development of oneself so that others also develop in the same way", "The teacher is free to teach as he thinks"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Freedom in education does not mean only allowing students to act according to their wishes, but also that education creates an atmosphere where students can develop their own thoughts and abilities and respect others' right to develop.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0684", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "684", "exam": "21/05/2024 S-I", "q": "Which of the following is an indirect method of user study?", "o": ["Questionnaire", "Analysis of library records", "Activity research", "Diary"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "An indirect method of user study is one in which the user is not asked directly for information but already available resources or records are analysed. Among the options, analysis of library records is an indirect method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0685", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "685", "exam": "19/05/2024 S-I", "q": "'Library Administration' was published by Ranganathan in:", "o": ["1925", "1933", "1931", "1935"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The book 'Library Administration' by S. R. Ranganathan, regarded as the father of library science in India, was published in 1935. It presents principles related to efficient management, organisation and operation of libraries and is considered a milestone in the development of library science.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0686", "ch": 7, "page": 96, "ansPage": 96, "srcNo": "686", "exam": "09/06/2024 S-II", "q": "The history of administration is as old as:", "o": ["5000 BC", "4000 BC", "800 BC", "1000 BC"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The history of administration is as old as 5000 BC. Early civilisatio
