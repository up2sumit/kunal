e various teaching-learning strategies according to different learning needs", "Are trained to teach children with special individual differences", "Are trained to make children uniform learners"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "For children with individual differences, teachers should be flexible and adaptable, focused on inclusive education. Trained teachers adopt various teaching strategies and respect each child's unique learning style; instead of classifying children and making them uniform, they fulfil their individual needs and help them reach their full potential.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0343", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "343", "exam": "27/05/2024 S-I", "q": "Which of the following is/are principles of teaching?\n(i) Psychological to logical\n(ii) Analysis to synthesis\n(iii) Concrete to abstract\n(iv) Following nature", "o": ["(i), (ii) and (iii)", "(i), (ii) and (iv)", "(i), (iii) and (iv)", "All"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching is a complex process which must follow principles to be effective: psychological to logical, analysis to synthesis, concrete to abstract, and following nature. These keep in mind the student's understanding and learning capacity and are the basic principles that make learning easier.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0344", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "344", "exam": "26/05/2024 S-II", "q": "Who developed the inductive approach in science teaching?", "o": ["Aristotle", "Bruner", "Gagne", "Francis Bacon"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The inductive approach was developed by Aristotle (as printed). In the inductive method specific experiences and examples are used to formulate general rules; a theory or problem is first explained by examples and then moves towards the theory through examples, experience and experiment. Steps: presentation of examples, analysis, generalisation, testing and verification.", "tip": "", "status": "note", "note": "Many sources credit Francis Bacon (d) with the modern inductive method; printed answer (a) Aristotle retained as key, flagged for review."}, {"id": "AOT-0345", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "345", "exam": "26/05/2024 S-II", "q": "The advantage of team teaching is:", "o": ["It deepens students' analytical abilities", "It improves student-teacher relations", "It is a technique for creating instructional situations", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Team teaching is a method in which many teachers jointly plan and teach. It enhances students' analytical abilities, improves their relationships, and makes the teaching situation interesting. The method gives students the benefit of different teachers' specialisation, leading to deeper learning and understanding.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0346", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "346", "exam": "26/05/2024 S-II", "q": "The principle of 'particular to general' is used by:", "o": ["Analytic method", "Heuristic method", "Synthetic method", "Inductive method"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the inductive method we first study specific examples or observations and from their specialities derive a general principle or rule; rules are derived from direct experiences, examples and experiments and appropriate decisions are made on the basis of known facts.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0347", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "347", "exam": "26/05/2024 S-II", "q": "When the learner is self-directed, it is called:", "o": ["Pedagogical approach", "Andragogical approach", "Distance education approach", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When the learner controls his own learning process, it is called the andragogical (adult-learning) approach. It focuses on the special needs of adults, where the learner is motivated by past experiences, internal motivation and practical problems; the teacher facilitates and helps the learner learn at his own pace and in his own way. It differs from the pedagogical approach, which focuses on children's learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0348", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "348", "exam": "19/06/2024", "q": "Which of the following methods can be used quite frequently in the classroom?", "o": ["Case study", "Observation", "Experimental", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The observation method can be used frequently in the classroom. Observation is a general and practical way, often used in the classroom to attract students, understand their behaviour, and assess their understanding of the material.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-023", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0349", "ch": 3, "page": 52, "ansPage": 52, "srcNo": "349", "exam": "19/06/2024", "q": "An educational device where the teacher and students attempt in a conscious, planned and purposeful effort to arrive at an explanation is known as:", "o": ["Lecture method", "Story-telling method", "Demonstration method", "Problem-solving method"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "An educational method where teacher and students make a conscious, planned and purposeful effort to reach an explanation is called the problem-solving method: a process for solving any problem, which includes identifying the problem, finding its causes, finding solutions and implementing them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0350", "ch": 3, "page": 52, "ansPage": 52, "srcNo": "350", "exam": "16/06/2024 S-III", "q": "Which of them is not related to observation?", "o": ["Controlled", "Participant", "Non-participant", "Group"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Controlled' is not related to observation. Observation methods include participant, non-participant and group observation, in which the researcher directly studies a phenomenon or behaviour in real conditions. 'Controlled' method is a technique of experimental research conducted in controlled conditions such as a laboratory, so it is not related to observation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0351", "ch": 3, "page": 52, "ansPage": 52, "srcNo": "351", "exam": "16/06/2024 S-III", "q": "The Top-Down method is:", "o": ["Deductive", "Descriptive", "Heuristic", "Investigation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The top-down method is called the 'deductive' method. In this method, the teacher begins with a principle or rule and then explains it by applying it to specific examples or problems. It is a structured approach that helps students understand complex concepts in steps.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0352", "ch": 3, "page": 52, "ansPage": 52, "srcNo": "352", "exam": "18/05/2024 S-III", "q": "For a teacher teaching a class with large strength, which of the techniques is best?", "o": ["Debate, discussions, practicals", "Group work with a lecture", "Lecture and class notes", "Self-study and asking questions"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "For teaching a large class, 'lecture and class notes' is considered the best technique because the teacher can impart knowledge to many students at a time in an organised manner. It saves time, helps maintain discipline, and students understand the subject easily and prepare for exams better; it is a traditional and useful method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0353", "ch": 3, "page": 52, "ansPage": 52, "srcNo": "353", "exam": "18/05/2024 S-III", "q": "While teaching the topic on 'Our Friend-Birds' to Class III students, Nalini followed the following methodologies: I. Showing a documentary film on birds; II. Using a chart having pictures of different birds and explaining briefly; III. Taking the students to the nearby park and asking them to observe the birds carefully. Nalini is using different approaches of learning in order to:", "o": ["Follow her lesson plan", "Meet different requirements of learners having multiple intelligence", "Impress other teachers and parents", "Promote reasoning skills in the students"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Nalini taught on the basis of Howard Gardner's theory of multiple intelligences, adopting three methods: visual-audio (documentary), verbal-logical (chart analysis) and natural/experiential (park visit). This multi-dimensional approach fulfils the needs of learners with different types of intelligence (visual, linguistic, naturalistic).", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-024", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0354", "ch": 3, "page": 52, "ansPage": 52, "srcNo": "354", "exam": "18/05/2024 S-III", "q": "Consider the following statements:\nI. This method is like the process of deduction wherein you cut down a bigger concept into smaller ones.\nII. The knowledge achieved by this method is permanent.\nThe above statements are referred to which method of teaching?", "o": ["Synthesis", "Analysis", "Deductive", "Inductive"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The statements refer to the analysis method: a bigger concept is broken into smaller parts and understood, which helps students learn in a logical manner, and the knowledge so gained becomes permanent. Same question as Q204.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-015", "first": false, "kind": "near", "of": "AOT-0204"}}, {"id": "AOT-0355", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "355", "exam": "14/06/2024 S-III", "q": "The element that makes a class interesting is:", "o": ["Personality of the teacher", "Lesson plan", "Study material", "Teaching method"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The element that makes a class interesting is the teaching method. An effective teaching method engages students actively, forces them to think and makes learning interesting.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0356", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "356", "exam": "14/06/2024 S-III", "q": "A symposium is a type of:", "o": ["Discovery method", "Discussion method", "Lecture method", "Demonstration method"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A discussion method (a symposium) is a process in which different experts or participants present their views on a topic and discuss them with each other. It is effective for exchanging ideas, argument and deeper understanding.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-022", "first": false, "kind": "exact", "of": "AOT-0322", "keyConflict": true}}, {"id": "AOT-0357", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "357", "exam": "14/06/2024 S-III", "q": "The excursion method is important because:", "o": ["It helps in developing a cooperative attitude and various other skills", "It helps in the development of creative faculties of the students", "It provides a direct source of knowledge and acquaints the student with first-hand information", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The excursion method helps develop a cooperative attitude and various skills; through excursions students learn to cooperate with one another and understand different ideas. It helps develop their creative faculties, and it gives direct, first-hand knowledge from real places.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0358", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "358", "exam": "14/06/2024 S-III", "q": "Who said 'Play is a natural instinct'?", "o": ["Caldwell Cook", "Piaget", "Thorndike", "Maria Montessori"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Caldwell Cook said 'play is a natural instinct'. He believed that the tendency to play is innate in children, helps their entire development and develops creativity; through play children learn and develop skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0359", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "359", "exam": "19/05/2024 S-III", "q": "By which of the following is the discovery method of teaching exemplified?", "o": ["Rote learning", "Audio-video lesson", "Independent study project", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The teacher's discovery method of teaching is exemplified by an independent study project, in which students learn by investigating and discovering on their own, developing critical thinking and problem-solving skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0360", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "360", "exam": "19/05/2024 S-III", "q": "Teaching at the memory level is based on:", "o": ["S-R theory", "Field theory", "Gestalt theory", "Cognitive field theory"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teaching at the memory level is mainly based on the S-R (stimulus-response) theory, which stresses establishing a relationship between a stimulus and a response. At this level students are made to memorise facts, information and rules so that they can respond correctly when stimulated; it is the most basic level of teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0361", "ch": 3, "page": 53, "ansPage": 53, "srcNo": "361", "exam": "05/09/2023 S-III", "q": "Better learning by listening is the approach of:", "o": ["Discussion method", "Lecture method", "Demonstration method", "Seminar method"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The lecture method is the one in which the teacher gives information orally and the students learn by listening. It is a traditional method in which the teacher is central and students receive the knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0362", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "362", "exam": "05/09/2023 S-III", "q": "The approach of the deductive method is:", "o": ["From teacher to learner", "From learner to teacher", "From general to specific", "From specific to general"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In the deductive method the teacher first establishes general principles and then uses specific examples to establish them. So the approach of the deductive method is from general to specific.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0363", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "363", "exam": "05/09/2023 S-III", "q": "The inductive method provides the learner with:", "o": ["Relevant material", "Instruction", "Lecture", "Demonstration"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The inductive method is a teaching method in which a general level is built up through specific levels and examples. In it relevant material is provided to the learner so that he can understand new knowledge on the basis of previous knowledge and education.", "tip": "", "status": "note", "note": "The printed explanation reads 'defective material' (likely a typo for relevant/suitable material); answer (a) unaffected."}, {"id": "AOT-0364", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "364", "exam": "05/09/2023 S-I", "q": "'Show and tell' is related to:", "o": ["Lecture method", "Demonstration method", "Discussion method", "Problem-solving method"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the demonstration method the teaching-learning process is conducted in an organised way. Demonstration usually takes place when students cannot link principles to real scenarios or cannot understand the application of principles; it is a teacher-centred method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0365", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "365", "exam": "05/09/2023 S-I", "q": "The deductive method of teaching is a:", "o": ["Traditional approach", "Experimental approach", "Play-based approach", "Mixed approach"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Deductive teaching is a traditional approach in which information about goals, language and rules is given at the beginning of the class and continued with examples. This approach is usually used in classes where the main aim is to teach grammar structure.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0366", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "366", "exam": "05/09/2023 S-I", "q": "The heuristic method is the contribution of ______.", "o": ["Spencer", "Armstrong", "Herbart", "Dewey"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The heuristic method is the contribution of Armstrong. The heuristic method of teaching is a self-discovery approach propounded by H. E. Armstrong; it makes the process of solving problems and making decisions quick and efficient and helps in acquiring knowledge through self-study, self-learning, research and investigation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0367", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "367", "exam": "13/09/2023 S-I", "q": "The inductive method is:", "o": ["Teacher-centred", "Curriculum-centred", "Learner-centred", "School-centred"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The inductive method is a psychological method in which general rules are formed through specific experiences and examples. By it students become more active and, with the help of simple concepts, add new knowledge, which is why it is called a student-centred method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0368", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "368", "exam": "13/09/2023 S-I", "q": "A defect of the inductive method is that it:", "o": ["Takes more time", "Gives an immediate solution", "Creates disorder", "Makes the teacher ineffective"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Defects of the inductive method: it is a very slow method, i.e. takes more time; sometimes it leads students to wrong conclusions; it is not useful for all students; and in mathematics it cannot always be used in class.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0369", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "369", "exam": "13/09/2023 S-I", "q": "An advantage of the deductive method is:", "o": ["It can be used in all subjects", "It is suitable for the higher level", "It teaches all at one time", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Advantages of the deductive method: it is simpler; it can be used in all subjects; it is suitable for higher-level education; it allows prediction; it does not require collecting data; and it teaches all students at the same time.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0370", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "370", "exam": "08/09/2023 S-II", "q": "The inductive method is:", "o": ["Lecture", "Practice", "From specific to general", "From general to specific"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The inductive method is a scientific method which promotes inductive thinking among students. It moves from specific to general, from known to unknown, simple to complex, and concrete to abstract through examples.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0371", "ch": 3, "page": 54, "ansPage": 54, "srcNo": "371", "exam": "08/09/2023 S-II", "q": "The Socratic method is:", "o": ["Lecture demonstration", "Research", "Question-answer", "Lecture"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The Socratic method, also called the Socratic technique, is a form of cooperative dialogue between individuals that encourages critical thinking and brings out underlying assumptions by asking and answering questions; it is also called the question-answer (dialectic) method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0372", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "372", "exam": "08/09/2023 S-II", "q": "Which one is NOT correct for the project method?", "o": ["Teacher-centred", "Performed in real life", "Occurs in a social environment", "Purposeful activity"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The project method motivates students to participate actively in the teaching process. It centres on the student, not the teacher, so option (a) is not correct; options (b), (c) and (d) conform to the project method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0373", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "373", "exam": "08/09/2023 S-II", "q": "Drama or role play is suitable for teaching:", "o": ["Science", "Mathematics", "History", "Geography"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Drama or role play is a unique teaching method that helps students gain depth in the subject. History is an ideal subject for drama because it gives students the chance to bring historical events and characters to life.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-025", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0374", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "374", "exam": "08/09/2023 S-II", "q": "The most useful method in a class with a large number of students is:", "o": ["Debate and discussion", "Group work", "Lecture", "Self-study"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The lecture method is a traditional method that allows the teacher to give information to a large number of students at once, though it may limit active participation; it is the most useful method in a large class.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-026", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0375", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "375", "exam": "08/09/2023 S-II", "q": "A good method for promoting cooperation in a mixed class of boys and girls is:", "o": ["Group work", "Lecture", "Demonstration", "Mixed method"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "For promoting cooperation in a mixed class, group work is a good method. It encourages students to work together, so they learn to cooperate with one another, understand the importance of teamwork, and develop communication, problem-solving and dialogue skills.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-027", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0376", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "376", "exam": "08/09/2023 S-II", "q": "Which one is NOT a focal point of the tri-polar process of teaching?", "o": ["Teaching method", "Teacher", "Learner", "Subject matter"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teaching method is not a focal point of the tri-polar teaching process. The three main components are teacher, learner and subject matter; the teaching method is a medium through which the teacher takes the subject matter to the learner.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0377", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "377", "exam": "08/09/2023 S-I", "q": "Which of the following methods can be used quite frequently in the classroom?", "o": ["Case study", "Observation", "Experimental", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Observation is a method that can be used frequently in the classroom and is an important part of it. Observation ensures that the teacher knows whether students are getting satisfactory learning experience, and weaknesses can be identified and removed through training.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-023", "first": false, "kind": "near", "of": "AOT-0348"}}, {"id": "AOT-0378", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "378", "exam": "08/09/2023 S-I", "q": "Method training gives training in:", "o": ["Creative thinking", "Reasoning", "Critical judgement", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Method training teaches creative thinking, reasoning and critical judgement. Creative thinking is a method of generating new and useful ideas; reasoning and critical judgement ensure that creative ideas are well founded and supported by solid logic.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0379", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "379", "exam": "08/09/2023 S-I", "q": "An effective teaching method is:", "o": ["Demonstration and lecture", "Traditional lecture method", "Interactive lecture", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The interactive lecture is an effective teaching method. It describes ways of teaching in which students are actively involved in their own learning and personal development; the teacher presents the subject in a way that encourages students to interact, discuss and understand concepts, facts, principles or relationships.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0380", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "380", "exam": "08/09/2023 S-I", "q": "Which one is NOT a teaching technique?", "o": ["Practice", "Kindergarten", "Illustration", "Dramatisation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Kindergarten is not a teaching technique. Kindergarten is a system for early childhood education (literally 'children's garden'), propounded by the German educationist Friedrich Froebel, who portrayed children as plants and teachers as 'gardeners'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0381", "ch": 3, "page": 55, "ansPage": 55, "srcNo": "381", "exam": "09/09/2023 S-I", "q": "'Learning by doing' was propounded by:", "o": ["Montessori", "Dewey", "Rousseau", "Froebel"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The proponent of 'learning by doing' was Dewey. Education is a process in which children should learn about the world around them; he described education as an integral part of life that helps individual development and the improvement of society.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0382", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "382", "exam": "09/09/2023 S-I", "q": "A drawback of the deductive method is:", "o": ["It is unsuitable for improving logical ability", "It promotes rote learning", "It has a tendency of forgetting", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Drawbacks of the deductive method: it is unsuitable for improving logical ability, since it depends only on already-known facts; it promotes rote learning, as it encourages students to memorise facts and not understand them; and it creates a tendency to forget, as it does not encourage students to remember.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0383", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "383", "exam": "10/09/2023 S-I", "q": "The teaching method that involves the learner in a real problem is:", "o": ["Workload", "Project-based", "Seminar", "Dictation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The teaching method that involves the learner in a real problem is project-based. A teaching method is the way of presenting subject matter, and techniques make that presentation effective, e.g. question-answer method, illustration method, lecture method, practice method.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-028", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "AOT-0384", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "384", "exam": "10/09/2023 S-I", "q": "Which one is a teaching technique?", "o": ["Kindergarten", "Montessori", "Illustrated (pictorial)", "Readiness"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In teaching, the way the teacher presents the subject to students is called the teaching method, and the means used to make the presentation of subject matter interesting, effective and purposeful are called teaching techniques, e.g. question-answer, illustration, drill, discussion, experimental. The option 'illustrated' is a teaching technique; kindergarten is a method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0385", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "385", "exam": "13/09/2023 S-I", "q": "Which of the following is the best method of teaching?", "o": ["Lecture method", "Discussion method", "Demonstration method", "Question-answer method"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The demonstration method is the best method of teaching. It is an experience-based method designed to illustrate an activity, process or event step by step, and it includes enabling learning through doing/demonstrating and observing, helping convey an idea with visual aids such as flip charts, posters and PowerPoint.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0386", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "386", "exam": "13/09/2023 S-I", "q": "Armstrong's contribution to teaching is:", "o": ["Project method", "Heuristic method", "Group method", "Mixed method"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Various types of teaching approaches are prevalent for creative and productive learning, and the heuristic method is one of them: a self-discovery approach to teaching, propounded by H. E. Armstrong.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0387", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "387", "exam": "13/09/2023 S-I", "q": "'Play is a natural instinct' was said by:", "o": ["Caldwell Cook", "Piaget", "Thorndike", "Montessori"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Play is a natural instinct' was said by Caldwell Cook. Play promotes physical and motor development; the importance of play in physical and motor development is self-evident; active play helps children learn professional control.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-029", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0388", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "388", "exam": "13/09/2023 S-I", "q": "The aim of play is:", "o": ["Physical development", "Moral development", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The main aim of play is physical and moral development of children. Play is an important part of our life: besides keeping us healthy it promotes mental and social development, teaches the importance of morality and restraint, and is a unique means of improving our physical and mental condition.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0389", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "389", "exam": "13/09/2023 S-I", "q": "The most important contribution to self-activity and play was made by:", "o": ["Pestalozzi", "Froebel", "Montessori", "Dewey"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The most important contribution to self-activity and play was made by Friedrich Froebel, who believed that 'play is the highest expression of human development because only through it does the child freely express what is in his soul'. According to Froebel, children develop their understanding of the world through direct experience in play.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0390", "ch": 3, "page": 56, "ansPage": 56, "srcNo": "390", "exam": "13/09/2023 S-I", "q": "The excursion method develops:", "o": ["Cooperative tendency", "Creative ability", "Direct knowledge", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The excursion method develops a cooperative tendency, creative ability and direct knowledge. Educational excursions play an important role in helping students learn things interestingly; it is a visit outside regular classes with aims that cannot be fully achieved through other means.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-030", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "AOT-0391", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "391", "exam": "13/09/2023 S-I", "q": "'The learning ability is open in all children' was said by:", "o": ["John Dewey", "Friedrich Herbart", "Froebel", "Montessori"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "'The learning ability is open in all children' was said by Friedrich Froebel, a German teacher who invented the 'Kindergarten method': 'Children are like small flowers; they are diverse and need to be taken care of; when seen in the garden each one is beautiful and glorious'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0392", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "392", "exam": "13/09/2023 S-I", "q": "To ensure the participation of students, we use:", "o": ["Demonstration", "Lecture", "Discussion", "Illustration"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "To ensure students' participation, the discussion method should be used. A discussion takes place when there is disagreement on a situation or subject; it involves exchange of questions and ideas among students/peers, and has been found to be better than lectures for acquiring knowledge and shaping attitudes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0393", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "393", "exam": "14/09/2023 S-I", "q": "At what age can children engage in word play and like riddles involving word play?", "o": ["Seven years", "Twelve years", "One year", "Three years"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "At the age of 7, children can take part in word games and like riddles and puzzles involving word play.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0394", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "394", "exam": "14/09/2023 S-I", "q": "The most useful method in a class with a large number of students is:", "o": ["Debate and discussion", "Group work", "Lecture", "Self-study"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The lecture method is the most useful in a class with a large number of students. In it the teacher explains concepts, facts, principles or relationships to help students understand; the teacher can also give students the chance to take notes, which helps recall.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-026", "first": false, "kind": "exact", "of": "AOT-0374"}}, {"id": "AOT-0395", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "395", "exam": "15/09/2023 S-I", "q": "A feature of the modern method of teaching is:", "o": ["Action-centred", "Interaction", "Peer cooperation", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Modern teaching methods combine all these features and give a comprehensive learning experience: action-centred teaching stresses learning by doing; in interaction, teacher and students converse and exchange ideas; with peer cooperation, students work and learn together.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0396", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "396", "exam": "15/09/2023 S-I", "q": "The inductive method encourages:", "o": ["Learner participation", "Interest", "Learning by doing", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The inductive method moves from the particular to the general and encourages 'discovery' according to the child's needs and interests. Hence it promotes the concept of learner participation, interest and learning by doing.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0397", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "397", "exam": "15/09/2023 S-I", "q": "A weakness of the role-play method is:", "o": ["Lack of concentration", "Dull method", "Slow pace of the learning process", "Waste of time"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "One weakness of the role-play method is lack of concentration. Students are required to act out a character or role; this activity is often held in classes to promote different types of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0398", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "398", "exam": "18/09/2023 S-II", "q": "The learner-centred method is:", "o": ["Inductive method", "Deductive method", "Lecture method", "Instruction method"], "key": {"printed": [0], "verified": [0], "official": 3}, "e": "The inductive method is a psychological method in which general rules are formed from specific experiences and examples; students become active and gain new knowledge through simple concepts, which is why it is called a learner-centred method.", "tip": "", "status": "disputed", "note": "The book notes that the Commission (exam body) accepted option (d) 'Instruction method' as the official answer, although the book states instruction is a teacher-centred method. Printed key (a) retained; official key (d) recorded."}, {"id": "AOT-0399", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "399", "exam": "18/09/2023 S-II", "q": "Traditional teaching is:", "o": ["Deductive", "Mixed", "Play-based", "Experimental"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "As printed: activities and games are used to help children understand a subject better; the idea behind kindergarten is to teach children through play, and there are many ways to integrate play-based learning activities with traditional teaching methods.", "tip": "", "status": "note", "note": "Printed key (c) conflicts with Q365 ('deductive method is a traditional approach' - key a) and the printed explanation does not support it; retained as printed, flagged for review."}, {"id": "AOT-0400", "ch": 3, "page": 57, "ansPage": 57, "srcNo": "400", "exam": "18/09/2023 S-II", "q": "The least attractive teaching method is:", "o": ["Lecture", "Workload", "Project", "Seminar"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "As printed, the seminar method is the least attractive: seminar is a type of discussion that stimulates students' thinking process for analysis and integration, and helps them present their ideas and facts clearly and in a flowing manner.", "tip": "", "status": "note", "note": "Rationale for 'least attractive' is not given in the source; printed key retained."}, {"id": "AOT-0401", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "401", "exam": "18/09/2023 S-I", "q": "The teaching method that involves the learner in a real problem is:", "o": ["Workload", "Project-based", "Seminar", "Dictation"], "key": {"printed": [3], "verified": [1], "official": null}, "e": "As printed: dictation is a teaching method that involves the learner in real problems; it is 'writing what is heard', also called 'imla', and develops the skill of writing from listening; it is a means of developing writing skills, but listening skills can also be developed with its help.", "tip": "", "status": "disputed", "note": "Same question as Q383 whose printed key is (b) Project-based, which is the standard answer. Printed key here (d) retained; verified answer (b).", "dup": {"group": "DUP-028", "first": false, "kind": "exact", "of": "AOT-0383", "keyConflict": true}}, {"id": "AOT-0402", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "402", "exam": "18/09/2023 S-I", "q": "Learners remain passive in:", "o": ["Project method", "Discovery method", "Lecture method", "Research method"], "key": {"printed": [2], "verified": [2], "official": 3}, "e": "In the lecture method learners remain passive. It is one of the most used methods; it is teacher-centred, the teacher lectures on different topics, is an active participant and the student a passive listener, and generally does not interact with the teacher during the lecture.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (d) as its answer; printed key (c) retained, official key (d) recorded."}, {"id": "AOT-0403", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "403", "exam": "18/09/2023 S-I", "q": "A symposium is a type of:", "o": ["Discovery method", "Discussion method", "Lecture method", "Demonstration method"], "key": {"printed": [3], "verified": [1], "official": null}, "e": "As printed: the symposium is a type of demonstration method; its aim is to understand different aspects of a topic and it is a test of exchanging ideas and style of presentation.", "tip": "", "status": "disputed", "note": "Printed key (d) conflicts with the same question at Q322/Q356 (key b, discussion method), which is the standard answer. Printed key retained; verified answer (b).", "dup": {"group": "DUP-022", "first": false, "kind": "exact", "of": "AOT-0322", "keyConflict": true}}, {"id": "AOT-0404", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "404", "exam": "18/09/2023 S-I", "q": "The meaning of 'heuristic' is:", "o": ["To investigate/find out", "To show", "To do", "To take action"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Heuristic' means to investigate or to find out. The investigation method is also called the heuristic method; in it stress is laid on children discovering the truth for themselves by investigating, with the teacher telling them as little as possible.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0405", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "405", "exam": "18/09/2023 S-I", "q": "'Play is a natural instinct' was said by:", "o": ["Caldwell Cook", "Piaget", "Thorndike", "Montessori"], "key": {"printed": [0], "verified": [0], "official": 3}, "e": "Through play, important skills and life skills can be discovered and practised. Henry Caldwell Cook, a British educationist, is known as the founder of 'The Play Way' method; according to him, 'play is a natural instinct' and the child's brain works nowhere but in play.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (d) 'Montessori'; printed key (a) retained (matches Q358 and Q387); official key (d) recorded.", "dup": {"group": "DUP-029", "first": false, "kind": "exact", "of": "AOT-0387"}}, {"id": "AOT-0406", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "406", "exam": "18/09/2023 S-I", "q": "The excursion method develops:", "o": ["Cooperative tendency", "Creative ability", "Direct knowledge", "All of the above"], "key": {"printed": [2], "verified": [3], "official": null}, "e": "As printed: direct knowledge is gained by the excursion method - knowledge gained without the help of sense organs and mind is direct (as printed); the excursion method is of special importance in environmental studies, since in the classroom a child only gets bookish knowledge.", "tip": "", "status": "disputed", "note": "Printed key (c) conflicts with the same question at Q390 (key d, 'all of the above'). Printed key retained; verified answer (d).", "dup": {"group": "DUP-030", "first": false, "kind": "exact", "of": "AOT-0390", "keyConflict": true}}, {"id": "AOT-0407", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "407", "exam": "09/09/2020 S-III", "q": "Which of the following is more interactive and student-centric?", "o": ["Seminar", "Workshop", "Lecture", "Group discussion"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Group discussion is more interactive and student-centred. The collective process of thinking deeply on a subject, problem or topic is called group discussion; through it many complex and difficult topics can be analysed and understood in depth.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0408", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "408", "exam": "09/09/2020 S-III", "q": "The most direct experience of a topic from the following is that of:", "o": ["Motion picture", "Visual symbol", "Demonstration", "Field trip"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to Dr. Santosh Mittal, a visit made by students outside the school, to achieve educational objectives and to make them directly acquainted with real environmental situations, is called an 'educational excursion' or field tour; it is organised for the purpose of seeing others at work, knowing the meaning of the process, etc.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0409", "ch": 3, "page": 58, "ansPage": 58, "srcNo": "409", "exam": "09/09/2020 S-III", "q": "The 'Socratic method' of teaching is known as:", "o": ["Lecture-cum-demonstration method", "Discussion method", "Inquiry method", "Question-and-answer method"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The Socratic method was given by the Greek philosopher Socrates. It considers individual enquiry and logical debate a form of dialogue; he called it the 'refutation by reasoning' method (from the Greek meaning 'for testing/examination'). Hence the Socratic method of teaching is known as the question-and-answer method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0410", "ch": 3, "page": 59, "ansPage": 59, "srcNo": "410", "exam": "09/09/2020 S-III", "q": "Which is the second step in the 'problem-solving' method?", "o": ["Testing the hypothesis", "Recognition and definition of the problem", "Conclusion", "Hypothesis formulation"], "key": {"printed": [3], "verified": [1], "official": null}, "e": "The printed explanation lists the steps of the problem-solving method: 1. selection of the problem; 2. defining the problem; 3. analysis of the problem; 4. collection of data related to the problem; 5. formulation of hypotheses; 6. testing of hypotheses; 7. drawing a conclusion.", "tip": "", "status": "disputed", "note": "Printed key (d) contradicts the printed list of steps, in which the second step is defining the problem (b). Printed key retained; verified answer (b)."}, {"id": "AOT-0411", "ch": 3, "page": 59, "ansPage": 59, "srcNo": "411", "exam": "09/09/2020 S-III", "q": "Which of the following is the first step in the scientific method of 'Problem-Solving'?", "o": ["Problem awareness", "Collection of relevant information", "Formation of hypothesis", "Verification of hypothesis"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Problem awareness is the first step of the scientific method of problem solving. In the scientific method of solving a problem, the first step is to identify the problem and define it; the steps are describing the problem, forming a hypothesis, testing/experimenting, and drawing conclusions on the basis of results and reports.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0412", "ch": 3, "page": 59, "ansPage": 59, "srcNo": "412", "exam": "09/09/2020 S-III", "q": "Which from the following is termed as the student-centred learning method?", "o": ["Cooperative learning", "Inquiry-based learning", "Both (a) and (b)", "Direct instruction"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Student-centred education is about the construction of knowledge by the active participation of students. In this method the teacher acts as a facilitator who provides students with the right environment and material to learn at their own pace. Cooperative learning and inquiry-based learning are both examples because they promote active engagement, critical thinking and social-emotional learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0413", "ch": 3, "page": 59, "ansPage": 59, "srcNo": "413", "exam": "09/09/2020 S-III", "q": "'Pedagogy' is mainly concerned with:", "o": ["Aims", "Evaluation", "Content", "Teaching method"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Pedagogy is the study of teaching methods, including the methods of achieving the aims and objectives of education. The term 'teaching method' is used in a very broad sense: on one side it includes many systems of study, and on the other many processes of teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0414", "ch": 3, "page": 59, "ansPage": 59, "srcNo": "414", "exam": "09/09/2020 S-I", "q": "Shaping yourself according to the environment is:", "o": ["Adaptation", "Adjustment", "Assimilation", "Imitation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Shaping oneself according to the environment is called adaptation. Children have a better capacity to establish harmony with the environment and learn better through the process of adaptation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0415", "ch": 3, "page": 59, "ansPage": 59, "srcNo": "415", "exam": "10/09/2020 S-II", "q": "Which of the following methods should be used by each teacher?", "o": ["Analytical - Synthetic", "Synthetic - Analytical", "Only Analytical", "Only Synthetic"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The analytical-synthetic method should be used by each teacher. The analytic method is accepted as the way of discovery, developing reasoning and logical thinking by breaking something into its constituent elements; the synthetic method is the opposite - combining elements to solve a problem. In the synthetic method, facts are already known and applied in a new situation so that known facts help students find the unknown.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0416", "ch": 3, "page": 60, "ansPage": 60, "srcNo": "416", "exam": "10/09/2020 S-II", "q": "The heuristic approach is based on:", "o": ["Rote memorisation", "Home work", "Spirit of inquiry", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The heuristic (inferential) method is an approach whose basis is generally being motivated by the spirit of inquiry. It motivates students to learn through investigation and research and helps them solve their problems themselves, which makes it a problem-solving method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0417", "ch": 3, "page": 60, "ansPage": 60, "srcNo": "417", "exam": "10/09/2020 S-II", "q": "A teacher performs practically and explains. Which method does he use?", "o": ["Lecture method", "Discovery method", "Demonstration method", "Problem-solving method"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher uses the demonstration method when performing practically and explaining. The demonstration method is a teaching strategy that shows students how to do a task or complete a process; when students see the teacher or trainer performing the work they are also given the opportunity to practise it. Features: practical learning, active participation, visual learning, feedback, application in the real world, repetition.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0418", "ch": 3, "page": 60, "ansPage": 60, "srcNo": "418", "exam": "10/09/2020 S-II", "q": "In which of the following subjects can role-playing be mainly useful for teaching?", "o": ["History", "Science", "Mathematics", "Language"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Role play can be most useful in teaching History. Reconstructing a historical situation and acting/imitating it makes it more interesting for students and helps them understand the finer actions of historical events better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0419", "ch": 3, "page": 60, "ansPage": 60, "srcNo": "419", "exam": "10/09/2020 S-II", "q": "Practice is made in:", "o": ["Inductive method", "Deductive method", "Drill method", "Discussion method"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The drill method is useful for practice. It provides students an opportunity to work on problems or examples for a time and then gets feedback on their performance; it is used for learning new subject matter or reviewing it, often in the form of a question or a game, repeating facts or information again and again.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0420", "ch": 3, "page": 60, "ansPage": 60, "srcNo": "420", "exam": "11/09/2020 S-I", "q": "A field trip is arranged for:", "o": ["Making an excursion", "Seeing other people doing things", "Noting the meaning of action", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to Dr. Santosh Mittal, an educational excursion is a visit outside the school that directly acquaints students with real environmental situations; a field trip is arranged to take an excursion, to see others at work and to know the meaning of the process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0421", "ch": 3, "page": 60, "ansPage": 60, "srcNo": "421", "exam": "11/09/2020 S-I", "q": "Students are passive in:", "o": ["Project method", "Discovery method", "Lecture method", "Inquiry method"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Students are passive in the lecture method, in which the teacher tries to help students understand facts, principles or concepts. In it the teacher is an active participant, while the student is a passive listener; it is convenient for teachers, but it can develop a tendency of rote learning among students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0422", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "422", "exam": "11/09/2020 S-I", "q": "With reference to the 'naive theories' that children construct about various phenomena, what should a teacher do?", "o": ["Should be ignored by the teacher.", "Should be punished by the teacher.", "Should be 'replaced' by correct ones through repetitive memorisation.", "Should be challenged by presenting counter-evidence and examples."], "key": {"printed": [3], "verified": [3], "official": null}, "e": "With reference to the naive theories that children construct about phenomena, the teacher should challenge these theories by presenting counter-evidence and examples. Practical demonstration and counter-evidence help remove the misconceptions that develop in the child's mind.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0423", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "423", "exam": "14/09/2020 S-I", "q": "The difference between teaching methods and teaching strategies is of:", "o": ["Content", "Objectives", "Format", "By-laws (rules)"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teaching methods and strategies differ in objectives. In presenting subject matter, teaching methods and techniques are used to make it effective; in addition, the teaching method follows a complete approach, while a strategy (teaching tactic/policy) uses micro-level approaches.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0424", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "424", "exam": "14/09/2020 S-I", "q": "The imitative teaching technique is considered:", "o": ["Skill", "Dramatic technique", "Play method", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The imitative teaching technique is considered a dramatic technique. It is a very useful method in teacher education and training, by which the trainee teacher develops the capacity to develop his own teaching skills, making the teacher an effective teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0425", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "425", "exam": "14/09/2020 S-I", "q": "Play therapy is used in the education of children:", "o": ["So that the educational process becomes pleasant", "So that education becomes more action-centred", "To highlight the importance of play activities in education", "To understand the inner motivations and complexities of the child"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Through play therapy, attempts are made to understand children's feelings and help them recover from deficiencies or pain; the child also learns good habits, such as new friends, respecting elders and learning to speak. Play therapy balances symbolic play with language expression.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0426", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "426", "exam": "14/09/2020 S-I", "q": "Activity-based learning emphasises:", "o": ["Discipline", "Completing the activity in a fixed time", "Active participation of all students", "Taking an examination after the activity is over"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Activity-based learning emphasises the active participation of students. It teaches through hands-on experience to develop an understanding of our surrounding environment; it is a form of student-centred approach in which the child's problem-solving ability and independent thinking are developed.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0427", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "427", "exam": "15/09/2020 S-III", "q": "Which of the following methods of study is most likely to result in efficient use of time?", "o": ["Taking time to react to what is being studied", "Arranging the details into some structural framework", "Comprehending the meaning before attempting to memorise", "Mastering completely each concept before proceeding to the next"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Mastering each concept completely before going to the next results in efficient use of time. If we take much time to master each concept completely, we may be unable to study the other concepts, which will waste our time and may leave us unable to perform well in the examination.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0428", "ch": 3, "page": 61, "ansPage": 61, "srcNo": "428", "exam": "15/09/2020 S-III", "q": "It can safely be assumed that a student understands a principle when he/she can:", "o": ["Give more examples of it", "Use it in solving problems to which it applies", "Recognise it again when she/he encounters it again", "Recall the principle as and when asked"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A student can be said to have understood a principle when he/she can use it in solving problems where it applies. Giving examples, recognising it again and recalling are all signs of understanding, but alone they do not ensure the student has fully understood the principle.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-009", "first": false, "kind": "near", "of": "AOT-0084"}}, {"id": "AOT-0429", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "429", "exam": "15/09/2020 S-I", "q": "By which method do students learn to the maximum extent and quickly?", "o": ["By listening", "By reading", "By observing", "By doing themselves"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "'Experiential/practical education', although specific, is carefully planned and includes self-reflection to integrate learning; it makes the learner responsible for his own learning. Learning by doing is the process by which students feel their experiences and are actively involved in the discovery of things and the creation of the world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0430", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "430", "exam": "15/09/2020 S-I", "q": "Which of the following statements is NOT correct?", "o": ["Lecture method can develop knowledge", "Lecture method can develop reasoning", "Lecture method is one-way process", "During the lecture method students are passive"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The lecture method is a method of teaching in which the teacher tries to help students understand facts, principles or relationships. Knowledge can be developed from it, it is a one-way process and students remain passive; but the statement that reasoning power is developed through the lecture method is not correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0431", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "431", "exam": "16/09/2020 S-I", "q": "Id, ego and super-ego are related to the theory of:", "o": ["Freud", "Piaget", "Kohlberg", "Erikson"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The theory of id, ego and super-ego is given by Freud, who is called the father of psychoanalysis. According to it, the three systems id, ego and super-ego work together in human personality, and a well-organised personality enables a person to interact with the external environment.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0432", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "432", "exam": "18/09/2020 S-II", "q": "The hypothesis underlying 'Team teaching' is:", "o": ["Teacher feels bored while working alone", "Teachers are not competent to teach alone", "The best teachers of the school can be shared by more students", "The single teacher cannot control the class"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The underlying hypothesis of 'team teaching' is that the best teachers of the school can be shared by more students. The teacher actively shares his specialisation and skills with all students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0433", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "433", "exam": "18/09/2020 S-II", "q": "The teaching method in which the teacher moves from 'specific to general' is:", "o": ["Inductive method", "Deductive method", "Drill method", "Discussion method"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teaching method in which the teacher moves from specific to general is called the inductive method: general rules or principles are made from observation and analysis of specific facts and events. The inductive method is often considered a tiresome method of teaching because the learning process in it is very long; it was given by Aristotle.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0434", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "434", "exam": "18/09/2020 S-II", "q": "What is the method of verifying a rule by first telling the students a general rule and then giving examples of that rule?", "o": ["Deductive method", "Inductive method", "Logical method", "Analytic-synthetic method"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the deductive method the students are first told the rule well and then given examples; it is quite convenient for students to understand, and children learn very well by this method. Teachers use this method the most when teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0435", "ch": 3, "page": 62, "ansPage": 62, "srcNo": "435", "exam": "18/09/2020 S-II", "q": "The teacher studies pupils' group behaviour mainly by which of the following methods?", "o": ["Interview", "Experimentation", "Case study", "Observation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The teacher mainly studies group behaviour of students by observation. Observation is an experience-based study method through which both group and specific behaviour can be studied.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0436", "ch": 3, "page": 63, "ansPage": 63, "srcNo": "436", "exam": "18/09/2020 S-II; 26/02/2020 S-I", "q": "Which psychologist used the 'Trial and Error' method?", "o": ["Skinner", "Thorndike", "Thurston", "Watson"], "key": {"printed": [1], "verified": [1], "official": 0}, "e": "The theory of trial and error was propounded by Edward Thorndike. He worked on the theory of learning, for which he is known for connectionism, and held that learning is the result of the connection between stimulus and response.", "tip": "", "status": "disputed", "note": "The book notes that the Commission accepted option (a) Skinner as its answer, which the book says is not correct; Skinner's operant conditioning gives importance to response/reinforcement in place of stimulus. Printed key (b) retained; official key (a) recorded."}, {"id": "AOT-0437", "ch": 3, "page": 63, "ansPage": 63, "srcNo": "437", "exam": "26/02/2020 S-I", "q": "'Synectics' is the method used for catering to which category of children?", "o": ["Backward children", "Retarded children", "Creative children", "Gifted children"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "'Synectics' is the method used for managing 'creative children'. It is derived from the Greek word 'synecoses', meaning 'joining together different elements', and the technique was established by William J. J. Gordon. It is a notable technique for groups solving problems and taking initiative, a short method for finding solutions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0438", "ch": 3, "page": 63, "ansPage": 63, "srcNo": "438", "exam": "26/02/2020 S-I", "q": "The theory of observational learning was given by:", "o": ["Pavlov", "Kurt Lewin", "Bandura", "Kohler"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The theory of observational learning was given by Albert Bandura. It states that people learn by observing, imitating and modelling the behaviour of others; human behaviour is largely acquired and learning theories are sufficient for the development and maintenance of behaviour. Bandura's social observational learning theory is explained under three headings: reciprocal determinism, self-system and principles of observational learning.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-010", "first": false, "kind": "exact", "of": "AOT-0103"}}, {"id": "AOT-0439", "ch": 3, "page": 63, "ansPage": 63, "srcNo": "439", "exam": "26/02/2020 S-I", "q": "Psychologically speaking, modern teaching methodology places emphasis on treating the students as:", "o": ["Clean slate", "Information processor", "Active listener", "Obedient learner"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Modern teaching methodology refers to the use of multiple tools, ideas and strategies to facilitate effective learning outcomes; it is a child-centred system of teaching that ensures active participation of learners. Psychologically, it emphasises considering students as information processors, and also sees them as creators of meaning and knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0440", "ch": 3, "page": 63, "ansPage": 63, "srcNo": "440", "exam": "26/02/2020 S-I", "q": "Which of the following is a learner-centred method?", "o": ["Lecture method", "Project method", "Group discussion method", "Demonstration method"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The group discussion method is a learner-centred method. The group discussion method has many advantages as it encourages a student to come with ideas, take part in a group, express an opinion and discuss with peers to solve a problem.", "tip": "", "status": "note", "note": "The project method (b) is also learner-centred; printed key (c) retained as given."}, {"id": "AOT-0441", "ch": 4, "page": 63, "ansPage": 63, "srcNo": "441", "exam": "09/06/2024 S-I", "q": "Who developed the Episodic model of information-seeking behaviour?", "o": ["Nicholas J. Belkin", "Alfred Chapman", "David Ellis", "T. D. Wilson"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The episodic model of information-seeking behaviour was developed by Nicholas J. Belkin. It explains how individuals obtain information and understand ways of acquiring and using it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0442", "ch": 4, "page": 63, "ansPage": 63, "srcNo": "442", "exam": "09/06/2024 S-I", "q": "Which component of the lesson plan is based on Bloom's classification?", "o": ["Creating", "Understanding", "Analysing", "Applying"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In Bloom's taxonomy, applying is an important component that centres on students' ability to use learnt knowledge in new or different situations. While making a lesson plan, it must be ensured that the objectives are not limited to acquiring knowledge but promote its practical use.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0443", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "443", "exam": "18/05/2024 S-I", "q": "Which type of lesson plan, with intensive investigation, has moderate complexity?", "o": ["Daily lesson plan", "Weekly lesson plan", "Sequential lesson plans", "Monthly lesson plan"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A weekly lesson plan is suitable for intensive investigation and moderate complexity. In it, a week's teaching activities are planned in detail, giving students enough opportunity to understand a subject in depth and work on it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0444", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "444", "exam": "18/05/2024 S-III", "q": "According to Bloom's taxonomy, the activity part of the lesson plan is ______.", "o": ["Creating", "Analysing", "Applying", "Evaluating"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Bloom's classification, the activity part of the lesson plan is applying: students use the knowledge they have learnt to draw new conclusions in new or different situations, which shows the practical use of knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0445", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "445", "exam": "24/05/2024 S-I", "q": "The most important component of a lesson plan is:", "o": ["Theory", "Objective", "Both theory and objective", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The objective is fundamental in a lesson plan because it gives direction to both teacher and students. Without a clear objective the teaching process remains disorganised and the results of learning are affected; hence the backbone of a lesson plan is its objective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0446", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "446", "exam": "24/05/2024 S-I", "q": "Project-based activities are an example of:", "o": ["Exploring", "Engaging", "Explaining", "Elaborating"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In Project-Based Learning (PBL), students explore a problem or topic, collect data, experiment and find solutions. This process is mainly focused on exploration.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-031", "first": true, "kind": "near", "of": null, "keyConflict": true}}, {"id": "AOT-0447", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "447", "exam": "22/05/2024 S-I", "q": "The teacher should plan teaching tasks accordingly:", "o": ["Abilities and interests of students", "Performance of students", "Reaction of students", "Work given by other teachers"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "While making a teaching plan, the teacher should give priority to students' abilities, learning pace and interests. This makes the curriculum according to students and teaching effective and interesting; the students' performance, feedback or suggestions of other teachers may help, but the main basis should be students' needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0448", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "448", "exam": "22/05/2024 S-I", "q": "Asking a thought-provoking question to start a discussion in the class is an example of:", "o": ["Exploring", "Elaborating", "Explaining", "Engaging"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Asking a thought-provoking question arouses students' curiosity and gets them ready for new ideas or solutions. In the 5E model this is the 'Engage' stage - an active method of teaching that encourages students to think deeply and investigate.", "tip": "", "status": "note", "note": "Printed key letter (d) = 'Engaging', which matches the 5E model, but the printed explanation text names 'investigation (exploring)'. Key retained as (d); explanation inconsistency flagged."}, {"id": "AOT-0449", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "449", "exam": "23/05/2024 S-II", "q": "Which of the following is a characteristic of project-based learning?", "o": ["It is non-psychological", "It is theoretical", "It does not give students freedom to work", "It includes physical and mental activity for students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Project-based learning is an active learning process in which students get opportunities to work on real-life problems. It encourages students to analyse physically and mentally, including group work, research and creative problem-solving that help children learn independently; it stresses practical application of knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0450", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "450", "exam": "23/05/2024 S-II", "q": "Which of the following is NOT true about a lesson plan?", "o": ["It develops self-confidence", "It helps present the subject matter systematically", "It is developed by the students", "It saves from disorganised teaching"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A lesson plan is made by the teacher, not by students. Its objective is to organise the subject matter systematically, increase the teacher's confidence and avoid disorganised teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0451", "ch": 4, "page": 64, "ansPage": 64, "srcNo": "451", "exam": "23/05/2024 S-II", "q": "Doing a simple demonstration or experiment is an example of:", "o": ["Engaging", "Elaborating", "Explaining", "Exploring"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The main objective of using a simple demonstration is to clarify (explain) a concept, principle or fact. It helps students understand it practically.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0452", "ch": 4, "page": 64, "ansPage": 65, "srcNo": "452", "exam": "21/05/2024 S-I", "q": "Which of the following statements is NOT true about planning of teaching?", "o": ["The teacher should have knowledge of the subject matter", "Teachers become aggressive in the class", "Plan ways to provide meaningful feedback to students regularly", "Decide on copies of textbooks, articles, etc., to order, which will be needed"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teachers becoming aggressive in class is not part of planning teaching. An effective teaching plan requires the teacher to have knowledge of the subject matter, plan ways to give meaningful feedback and arrange the necessary material such as textbooks and copies of articles.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0453", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "453", "exam": "21/05/2024 S-I", "q": "The literal meaning of 'supervision' is:", "o": ["Superior knowledge and power", "Better knowledge and service", "Better efforts and services", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In child development and teaching, the literal meaning of 'supervision' can also be taken as 'superior knowledge and power (authority)', because during the supervision process the teacher or supervisor has the knowledge and power to guide students' development in the right direction.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-032", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0454", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "454", "exam": "21/05/2024 S-I", "q": "How many types of lesson plan are there on the basis of time limit?", "o": ["2", "3", "4", "5"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "On the basis of time limit there are 3 types of lesson plan: 1. daily lesson plan - plan for one day; 2. weekly lesson plan - plan for one week; 3. monthly lesson plan - plan for one month. The duration of these plans helps in planning teaching activities and preparing units.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0455", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "455", "exam": "21/05/2024 S-I", "q": "Which type of lesson plan is simple and accurate?", "o": ["Daily lesson plan", "Weekly lesson plan", "Sequential lesson plans", "Monthly lesson plan"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A daily lesson plan is simple and accurate, because the lesson for one day is planned in detail so that teaching activities and objectives can be clearly determined. It helps the teacher manage planning and time for each day; the teacher can focus on one subject or lesson in a day.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0456", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "456", "exam": "25/05/2024 S-I", "q": "The process of choosing one of the various options is called:", "o": ["Planning", "Organising", "Decision making", "Coordination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "When there are many options and you choose one of them, this process is called decision making. 'Planning' involves setting goals for the future and taking steps to achieve them; 'organising' means arranging resources; 'coordination' means establishing harmony among different elements.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0457", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "457", "exam": "25/05/2024 S-I", "q": "Which of the following options is correct for a lesson plan?", "o": ["Absence of clear learning objectives", "Putting too many topics in the same class", "Include formative assessment", "Neglect flexibility"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An effective lesson plan has clear learning objectives and flexibility so that changes can be made according to students' needs. Formative assessment (continuous evaluation) helps evaluate students' progress during the process of learning and give feedback, which improves the teaching-learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0458", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "458", "exam": "19/05/2024 S-I", "q": "______ is the apex institution involved in the planned and coordinated development of the teacher education system in the country.", "o": ["UGC", "NCERT", "NCTE", "XSEED"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The NCTE (National Council for Teacher Education) is the apex body of India responsible for making teachers planned, organised and quality-oriented. Its aim is to humanise the training system of teachers and give a regulatory framework to teacher-education institutions.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-033", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0459", "ch": 4, "page": 65, "ansPage": 65, "srcNo": "459", "exam": "19/05/2024 S-I", "q": "The full form of the CALLA model is:", "o": ["Cognitive Acquisition Language Learning Approach", "Competency Academic Language Learning Approach", "Cognitive Academic Language Learning Approach", "Cognitive Assessment Language Instruction Approach"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "CALLA is the Cognitive Academic Language Learning Approach, developed by Jim Chamot and Michael O'Malley. It is based on the cognitive acquisition theory and identifies two types of learning for English language learners: basic interpersonal communication and cognitive academic language proficiency (learning approach).", "tip": "", "st
