/* Flat, light, exam-software look. One theme on purpose: it reads the same on a phone in sunlight and on a laptop. */
:root {

* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-top: 3px solid var(--brand); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.brand { min-width: 0; }

.banner.error { background: var(--bad-bg); border-color: var(--bad); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.grid { display: grid; gap: 16px; }

.stat { flex: 1 1 140px; padding: 12px 16px; border-left: 1px solid var(--line-soft); min-width: 0; }
.stat:first-child { border-left: 0; }

.stat span { color: var(--muted); font-size: .8rem; }
.two-col { grid-template-columns: 1fr; }
@media (min-width: 980px) { .two-col { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 4px; padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 500; }

.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary, .btn.success { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover:not(:disabled), .btn.success:hover:not(:disabled) { background: #0a3a48; color: #fff; }

.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.chk { display: flex; align-items: flex-start; gap: 10px; }

fieldset { border: 0; border-top: 1px solid var(--line); margin: 0 0 18px; padding: 14px 0 0; min-width: 0; }
legend { font-weight: 600; padding: 0 12px 0 0; color: var(--brand); font-size: .95rem; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-weight: 500; font-size: .88rem; }
.field input[type=number], .field select, .field input[type=text] { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 8px 10px; min-height: 42px; width: 100%; max-width: 280px; }
.hint { color: var(--muted); font-size: .84rem; }
.inline { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.radio-line { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
details.instr summary { cursor: pointer; font-weight: 600; padding: 4px 0; color: var(--brand); }
details.instr ul { margin: 8px 0 0 1.1rem; padding: 0; }
details.instr li { margin-bottom: 6px; }
.notice { background: var(--info-bg); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; }
.notice.warn { background: var(--warn-bg); border-left-color: var(--warn); }

.test-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.tabs { display: flex; gap: 0; overflow-x: auto; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: none; padding: 9px 14px; min-height: 42px; cursor: pointer; font-size: .88rem; color: var(--muted); }
.tab[aria-selected=true] { border-bottom-color: var(--brand); color: var(--brand); font-weight: 600; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line-soft); padding-bottom: 10px; margin-bottom: 14px; }
.qnum { font-weight: 600; font-size: 1.02rem; }
.qmeta { color: var(--muted); font-size: .78rem; }
.qtext { font: 1.12rem/1.6 var(--read); white-space: pre-line; margin-bottom: 16px; overflow-wrap: anywhere; }
.opts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 4px; padding: 11px 14px; min-height: 48px; cursor: pointer; background: var(--panel); overflow-wrap: anywhere; font-family: var(--read); font-size: 1.04rem; line-height: 1.5; }
.opt:hover { border-color: var(--brand); }

.opt.locked { cursor: default; }
.opt .tag { margin-left: auto; font-family: var(--ui); font-size: .72rem; font-weight: 600; white-space: nowrap; padding-left: 8px; color: var(--muted); }
.opt.right .tag { color: var(--ok); } .opt.wrong .tag { color: var(--bad); }
.feedback { margin-top: 16px; border-radius: 4px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--muted); background: var(--panel-2); font-family: var(--read); }
.feedback.good { border-left-color: var(--ok); background: var(--ok-bg); }
.feedback.badf { border-left-color: var(--bad); background: var(--bad-bg); }
.feedback h3 { font-family: var(--ui); margin-bottom: 6px; }
.feedback .hint { font-family: var(--ui); }
.flagnote { margin-top: 8px; font-family: var(--ui); font-size: .85rem; border-left: 4px solid var(--warn); padding: 6px 10px; background: var(--warn-bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.actions .grow { flex: 1 1 150px; }

.pal { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow: auto; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size: .78rem; margin-bottom: 12px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.pq { position: relative; min-height: 40px; border: 1px solid transparent; border-radius: 4px; font-weight: 600; font-size: .9rem; cursor: pointer; background: var(--nv); color: var(--nv-text); font-variant-numeric: tabular-nums; }
.pq.na { background: var(--bad); color: #fff; }
.pq.a { background: var(--ok); color: #fff; }
.pq.m, .pq.am { background: var(--review); color: #fff; border-radius: 50%; }
.pq.am::after { content: "✓"; position: absolute; right: -3px; bottom: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 10px; line-height: 15px; }
.pq.cur { outline: 2px solid var(--text); outline-offset: 2px; }
.sw { width: 26px; height: 26px; min-height: 0; display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; flex-shrink: 0; cursor: default; }
.pal-toggle { display: none; }
.pgroup { margin-bottom: 14px; }
.pal-title { font-weight: 600; font-size: .88rem; margin-bottom: 8px; }

.score-hero { display: flex; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 16px; }

.big { font-size: 1.9rem !important; color: var(--brand); }
.good-t { color: var(--ok); } .bad-t { color: var(--bad); }

.rcard { margin-bottom: 12px; }

.badge.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); } .badge.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.badge.un { color: var(--muted); } .badge.mk { color: var(--review); border-color: var(--review); } .badge.wn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }

@media (max-width: 520px) { .brand-mark { display: none; } .backlink { font-size: .95rem; } }

"Principle", "Teacher", "Parents"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the teaching-learning process the student is the dependent variable: the student's learning depends on the methods, content and environment decided by the teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0002", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "2", "exam": "09/06/2024 S-I", "q": "Which of the following is a 'Law of Learning'?", "o": ["Law of motivation", "Law of individual differences", "Law of exercise (practice)", "None"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The Law of Exercise is one of Thorndike's laws of learning: repeated practice of an act strengthens learning. Motivation and individual differences are principles of learning, not Thorndike's laws.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0003", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "3", "exam": "21/05/2024 S-I; 09/06/2024 S-I", "q": "Which teaching theory helps the learning process through an interactive setting with internal motivation, as a basis for the learner's active participation?", "o": ["Watson's S-R theory", "Skinner's reinforcement theory", "Vygotsky's constructivist theory", "Kohler's insight theory"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Vygotsky's constructivist (socio-cultural) theory supports active participation through internal motivation and interaction. It promotes learning through social interaction and a cooperative environment, with internal motivation and context playing an important role.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0004", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "4", "exam": "09/06/2024 S-I", "q": "'Principle' means:", "o": ["Rules that are to be strictly followed", "For students and guardians", "For supervisors and administrators", "Our servant, not the master"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A principle is a rule or guideline that has to be followed strictly. Principles are basic truths that guide a system, behaviour or belief; they are the foundation of a subject and ensure orderly functioning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0005", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "5", "exam": "09/06/2024 S-I", "q": "Which of the following emphasises S-R (stimulus-response) conditioning for learning?", "o": ["Pavlov", "Watson", "Thorndike", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "S-R (stimulus-response) conditioning belongs to the behaviourist approach: Pavlov's classical conditioning, Watson's behaviourism and Thorndike's trial-and-error all stress the link between stimulus and response, so that learning continues.", "tip": "S-R theories = Pavlov, Watson, Thorndike (and Skinner for S-R-reinforcement).", "status": "ok", "note": ""}, {"id": "AOT-0006", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "6", "exam": "09/06/2024 S-I", "q": "The ability to develop a lifestyle on the basis of a preferred value system is:", "o": ["Responding", "Valuing", "Organizing", "Characterization"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Developing a lifestyle based on a preferred value system is called characterization (the highest level of the affective domain), where a person's behaviour is shaped by an internalised system of values and beliefs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0007", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "7", "exam": "18/05/2024 S-I", "q": "Which is NOT a characteristic of learning?", "o": ["Learning is modification of behaviour", "Learning is always positive", "Learning is a continuous process", "Learning is a process that helps solve problems and promotes development"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Learning is not always positive because it can be both positive and negative; we learn from negative experiences too (e.g. a student who fails an exam learns where improvement is needed). The other options are genuine characteristics.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0008", "ch": 1, "page": 5, "ansPage": 5, "srcNo": "8", "exam": "18/05/2024 S-I", "q": "In teaching, experienced members guide an immature person ______.", "o": ["To pass time", "For eligibility", "For quality of life", "For adjustment of life"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Education is not only imparting knowledge but also a process of socialising the person. An experienced person guides an immature person to understand life's challenges, solve problems and adopt social behaviour, helping better adjustment in life.", "tip": "", "status": "disputed", "note": "Same question is printed again as Q174 with a different option set and printed answer (b) 'by ability'. Conflicting printed keys; each retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-001", "first": true, "kind": "near", "of": null, "keyConflict": true}}, {"id": "AOT-0009", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "9", "exam": "18/05/2024 S-I", "q": "According to the psychoanalytic theory, deviant behaviour is caused by:", "o": ["The active unconscious mind in the person", "The person's repressed desires", "Both 'the active unconscious mind' and the person's repressed desires", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Sigmund Freud's psychoanalytic theory, deviant behaviour arises from repressed desires. When desires are not controlled, mental imbalance results and behaviour may become abnormal.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0010", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "10", "exam": "24/05/2024 S-I", "q": "Which of the following is also called the lowest level of teaching?", "o": ["Memory level", "Understanding level", "Reflective level", "Introspective level"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The memory level is the lowest level of teaching because it emphasises only memorising facts, information and concepts. Without deep understanding or analysis, it is limited to recalling.", "tip": "Levels of teaching: Memory (Herbart) < Understanding (Morrison) < Reflective (Hunt).", "status": "ok", "note": "", "dup": {"group": "DUP-002", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0011", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "11", "exam": "24/05/2024 S-I", "q": "'Rational knowledge' means:", "o": ["Observation and experience", "Action and demonstration", "A somewhat abstract and logical approach", "Achievement and attainment"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Rational knowledge rests on reason and discrimination. It is abstract (analytical) knowledge that goes beyond mere experience or observation and is based on logical thinking.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0012", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "12", "exam": "24/05/2024 S-I", "q": "The most expected immediate outcome of teaching is:", "o": ["Change in students' behaviour in the desired direction", "Development of the students' entire personality", "Building the students' character", "Selection for a suitable job"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The immediate aim of teaching is positive change in students' behaviour, which can take the form of knowledge, understanding, skill or attitude. Whole-personality development, character building and job selection are long-term outcomes; the immediate result is seen as behavioural change.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-003", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0013", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "13", "exam": "22/05/2024 S-I", "q": "The areas/sources of information for the psychological basis (of education) are:", "o": ["The learning process", "Teaching method", "Students' characteristics", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main sources of information for the psychological basis are the learning process (children's learning ability, teaching skills), teaching methods (psychological ways of teaching) and students' characteristics (child development and personality). All three play an important role in understanding the psychological aspect of education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0014", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "14", "exam": "22/05/2024 S-I", "q": "Learning is a natural activity of:", "o": ["The learner", "The teacher", "A person", "A living being"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is not limited to humans; it is a basic ability of all living beings. From animals to humans, all learn naturally in order to adapt to their environment and survive. It is a universal biological process that helps sustain life.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-004", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0015", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "15", "exam": "23/05/2024 S-II", "q": "Which model is the basic model in classroom teaching?", "o": ["Model of learning", "Instructional model", "Both the model of learning and the instructional model", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Classroom teaching has both a learning model and an instructional model as its basis. The learning model centres on students' experience and knowledge construction, while the instructional model centres on the teacher giving information and teaching skills. Both are needed in teaching for balance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0016", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "16", "exam": "23/05/2024 S-II", "q": "Match List-I (Level of Teaching) with List-II (Main Proponent).\nList-I: A. Memory level; B. Understanding level; C. Reflective level\nList-II: I. Herbart; II. Morrison; III. Hunt", "o": ["A-I, B-II, C-III", "A-I, B-III, C-II", "A-II, B-III, C-I", "A-II, B-I, C-III"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Correct matching: Memory level - Herbart (stress on facts and information); Understanding level - Morrison (stress on deep understanding of concepts); Reflective level - Hunt (stress on critical thinking and problem-solving).", "tip": "Memory-Herbart, Understanding-Morrison, Reflective-Hunt (M-H, U-M, R-H).", "status": "ok", "note": ""}, {"id": "AOT-0017", "ch": 1, "page": 6, "ansPage": 6, "srcNo": "17", "exam": "21/05/2024 S-I", "q": "With what is the development of a learner associated?", "o": ["Affective development", "Cognitive development", "Psychomotor development", "Sensory-muscular (sensory-motor) development"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A learner's development is mainly associated with cognitive development, which includes growth in the ability to think, understand, solve problems and acquire knowledge. It covers mental processes such as thinking, comprehension, learning and problem-solving.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0018", "ch": 1, "page": 6, "ansPage": 7, "srcNo": "18", "exam": "21/05/2024 S-I", "q": "Which information is important for motivating students to study?", "o": ["Learning style", "Personality", "Socio-cultural background", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Knowing students' learning style, personality and socio-cultural background helps teachers plan effective teaching strategies and provide a supportive environment. Considering all these factors can raise students' motivation to study.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0019", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "19", "exam": "21/05/2024 S-I", "q": "Experiential knowledge is the knowledge that a student gets from:", "o": ["Reading", "Imagination", "The teacher's lecture", "His own observation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Experiential knowledge is gained directly through the learner's own observation, experience and experiments. It is lasting and effective because the learner is actively involved; knowledge gained from one's own observation is more lively and practical than a teacher's lecture or a textbook.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0020", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "20", "exam": "25/05/2024 S-I", "q": "In what ways can you change the plot of a story? This question is at the ______ level.", "o": ["Synthesis", "Comprehension", "Knowledge", "Application"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Changing a story's plot is a creative process of combining existing elements (characters, settings, events) in new ways. In Bloom's classification it corresponds to the level of 'synthesis', where different ideas and elements are put together to form something new and unique; it goes beyond understanding or applying.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0021", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "21", "exam": "19/06/2024", "q": "The pre-active phase of teaching includes:", "o": ["Feedback and reinforcement", "Sizing up the class", "Presentation of stimuli", "Decision about the strategies of teaching"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "According to Philip W. Jackson, teaching has three phases: pre-active, interactive and post-active. The pre-active phase includes assessing entry-level competency, defining learning objectives, deciding strategies, examining the subject matter and supporting ideas, and defining the different ways of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0022", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "22", "exam": "29/05/2024 S-I", "q": "The reason for the prevalence of dogmas and immoral customs in society is:", "o": ["Poverty", "Caste system and difference in class", "Lack of awareness and illiteracy", "Religious fundamentalism"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Orthodoxy and immoral customs prevail because of lack of awareness and lack of education. People accept orthodox ideas and are more sensitive to them; without correct information about modernity and change they continue old and immoral customs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0023", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "23", "exam": "29/05/2024 S-I", "q": "Which of the following is not considered an approach in the teaching-learning process?", "o": ["Conceptual", "Integrated", "Autocratic", "Process"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Approaches used in teaching-learning include the conceptual, process, integrated and activity approaches. The autocratic approach is not related to them (it is a leadership/discipline style).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0024", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "24", "exam": "29/05/2024 S-I", "q": "What are the key concepts of problem-based learning?", "o": ["Class activities are constructed around a problem", "Students have to take the initiative to enquire and learn", "Students are empowered to take a responsible role in their learning", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Key concepts of problem-based learning: (a) class activities are built around a problem, (b) students must take the initiative to inquire and learn, (c) students are empowered to take a responsible role in their learning. Hence all are correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0025", "ch": 1, "page": 7, "ansPage": 7, "srcNo": "25", "exam": "29/05/2024 S-I", "q": "Which one is accountable in cooperative learning?", "o": ["Individual", "Group", "Both individual and group", "None of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In cooperative learning, both the individual and the group are accountable: each member is responsible for their own learning and for contributing to the group, so all members participate actively and contribute to the group's goals.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0026", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "26", "exam": "16/06/2024 S-III", "q": "Teaching and learning are the twin ______ involved in the total educative process.", "o": ["Process", "Purpose", "Activities", "Patterns"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teaching and learning are twin activities involved in the educative process. They are interlinked and are possible only through activities and practice; without activities nothing can be taught or learnt.", "tip": "", "status": "note", "note": "Source bilingual: English option (d) 'Patterns' is printed as Hindi 'bhagidari' (participation); printed answer (c) unaffected."}, {"id": "AOT-0027", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "27", "exam": "16/06/2024 S-II", "q": "Which of the following is also called the lowest level of teaching?", "o": ["Memory level", "Understanding level", "Reflective level", "Introspective level"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The memory level is called the lowest level of teaching. The student only remembers information without understanding its depth, so knowledge is not developed on a base of understanding. It is the first step of learning.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-002", "first": false, "kind": "exact", "of": "AOT-0010"}}, {"id": "AOT-0028", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "28", "exam": "16/06/2024 S-III", "q": "Modern educationists suggest that the process of teaching must be:", "o": ["Dull", "Clumsy (difficult to control)", "Creative and entertaining", "Unimaginative"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Modern educationists suggest that teaching should be creative and entertaining, which ensures students' active participation and makes learning motivating. Creativity and entertainment arouse curiosity so that students grasp knowledge effectively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0029", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "29", "exam": "08/09/2023 S-I; 13/09/2023 S-I; 18/05/2024 S-II", "q": "The teaching-learning process is a journey from:", "o": ["Concrete to abstract", "Known to unknown", "Simple to complex", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching-learning is a systematic journey from concrete to abstract, known to unknown and simple to complex. This approach helps students understand easily and reach difficult concepts; hence option (d) is the desired answer.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0030", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "30", "exam": "18/05/2024 S-III", "q": "Basic education should be:", "o": ["Student-oriented", "Activity-oriented", "Project-oriented", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "For effective basic education, student-centred, activity-based and project-based approaches are all important. Student-oriented education attends to individual needs, activity-based gives practical experience, and project-based develops problem-solving skills; combined they give complete education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0031", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "31", "exam": "18/05/2024 S-III", "q": "Each learning outcome should begin with:", "o": ["A learning verb", "An action verb", "An outcome verb", "Any verb"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A learning outcome states what a student will be able to do, so it should begin with an action verb (e.g. 'is able to' state, write, identify). This eases evaluation and makes the objective clear.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0032", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "32", "exam": "14/06/2024 S-III", "q": "Which among the following is a 'Law of Learning'?", "o": ["Law of motivation", "The law of individual difference", "Law of exercise", "None"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The Law of Exercise is among the main laws of learning: the more an act or behaviour is practised, the stronger it becomes and the more effective learning is.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0033", "ch": 1, "page": 8, "ansPage": 8, "srcNo": "33", "exam": "14/06/2024 S-III", "q": "How can a teacher enhance effective learning in her elementary classroom?", "o": ["By connecting the context to the lives of the students", "By drill and practice", "By encouraging competition", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "An elementary teacher can teach effectively when she connects the subject matter to the students' lives. Children then understand easily and learning becomes meaningful for them, making it interesting and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0034", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "34", "exam": "14/06/2024 S-III", "q": "The most expected immediate outcome of teaching is:", "o": ["Changes in the behaviour of students in a desirable direction", "Development of the total personality of the students", "Building the character of the students", "Getting selected for a suitable job"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The most direct outcome of teaching is a desirable change in behaviour. Teaching helps students acquire knowledge, skills and attitudes so that their behaviour changes positively, and this should be visible soon after teaching as evidence of learning or of a new capability. Personality development, character building and job selection are long-term results.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-003", "first": false, "kind": "near", "of": "AOT-0012"}}, {"id": "AOT-0035", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "35", "exam": "14/06/2024 S-III", "q": "Teaching theories give:", "o": ["Knowledge of assumptions and principles to teachers by studying the effects of independent variables on the dependent one", "Knowledge about different levels of teaching and the models of teaching concurrent to it", "Knowledge about how to investigate teaching problems and how to solve them", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching theories provide a framework for understanding the teaching process and teaching effectively. They give teachers knowledge of assumptions and principles (by studying independent variables' effects on dependent ones), of the levels and models of teaching, and of how to investigate and solve teaching problems.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0036", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "36", "exam": "19/05/2024 S-II", "q": "Learner-centred learning leads to ______.", "o": ["Holistic development", "Enhanced activity", "Loss of interest", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learner-centred education leads towards holistic development because it centres on students' needs, interests and abilities and involves them actively in learning. It is not limited to academic knowledge; it helps physical, mental, emotional and social development, ensuring all-round growth.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-005", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0037", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "37", "exam": "19/05/2024 S-II", "q": "On which of the following does the success of a teaching process depend?", "o": ["How well the teacher understands the physical needs of the students", "How well the teacher understands the pedagogical needs of the students", "How well the teacher teaches the students", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The success of teaching depends on how well the teacher understands students' educational (pedagogical) needs. When the teacher understands them, the teacher can teach effectively and help students learn better.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0038", "ch": 1, "page": 9, "ansPage": 9, "srcNo": "38", "exam": "19/05/2024 S-III", "q": "Gestalt psychologists proved that:", "o": ["The child perceives an object as a whole and then its parts", "The child gains knowledge about the 'parts' first and then about the 'whole'", "Part learning is more meaningful because the material to be learnt makes sense", "Part learning should be followed by the whole approach"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Gestalt psychologists showed that a child first sees any object or situation as a whole and only afterwards attends to its separate parts. Their principle is 'the whole is greater than the sum of its parts': the human mind tends to understand things as meaningful, organised units, not as pieces.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0039", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "39", "exam": "18/09/2020 S-II; 19/05/2024 S-III; 15/09/2020 S-II", "q": "Which of the following is not a prescribed level of teaching?", "o": ["Memory", "Understanding", "Reflective", "Differentiation"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The three main levels of teaching are the memory level, the understanding level and the reflective level; they show the increasing complexity of the learning process. Differentiation is not a prescribed level of teaching, though it can be a teaching strategy or concept.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0040", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "40", "exam": "05/09/2023 S-II", "q": "Kinesthetic learning is:", "o": ["Logical learning", "Physical learning", "Auditory learning", "Musical learning"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Kinesthetic learning relates to physical learning: learning takes place through physical activities and sensations. It is a learning style in which people learn best through physical activity and involvement.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0041", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "41", "exam": "05/09/2023 S-I", "q": "The independent variable in education is:", "o": ["Teacher", "Student", "Content", "Teaching method"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher is the independent variable because the teacher plans and controls the teaching process and tries to bring continuous change in students' behaviour; students follow the teacher's instructions, as teaching stays under the teacher's control. The student is the dependent variable, while curriculum, teaching material, aids and methods are intervening variables.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0042", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "42", "exam": "13/09/2023 S-I", "q": "Autonomous (self-directed) learning comes from:", "o": ["One's own effort (self-effort)", "The teacher's effort", "The family's effort", "The society's effort"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Autonomous learning is learning through one's own effort: the learner sets personal goals and controls the learning process. Learner autonomy describes the learner's capacity to control their own learning journey.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0043", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "43", "exam": "08/09/2023 S-I", "q": "Which is a psychological factor affecting learning?", "o": ["Teacher's salary", "Nature of the subject", "Caste of the students", "Interest of the students"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Students' interest is a psychological factor influencing learning. Factors affecting learning are environmental (the combination of all external factors) and personal (mostly feelings, interest, motivation); interest belongs to the personal/psychological group.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0044", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "44", "exam": "08/09/2023 S-I", "q": "What is classical conditioning?", "o": ["Associative learning", "Self-learning", "Assisted learning", "Cooperative learning"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Classical conditioning is associative learning: a kind of learning in which two stimuli are paired so that a neutral stimulus produces a response. It is also called Pavlovian (respondent) conditioning, discovered by Ivan Pavlov.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0045", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "45", "exam": "09/09/2023 S-I", "q": "Which of the following is NOT a step of the teaching-learning process?", "o": ["Learning to do something new", "Functional stages", "Flow", "Acquisition"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The printed explanation lists the steps of the teaching-learning process: goal/objective, anticipatory (advance) set to focus attention, input, modelling, guided practice, check for understanding, independent practice and closure. 'Acquisition' is not among them.", "tip": "", "status": "note", "note": "Source options are unclear (none exactly matches the listed steps); printed answer (d) retained, flagged for review."}, {"id": "AOT-0046", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "46", "exam": "09/09/2023 S-I", "q": "Which element is not included in the process of concept formation?", "o": ["Experience", "Generalisation", "Analysis", "Concrete"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Concept formation is the process of discovering what is 'common' to a large number of objects and linking it to a symbol so it can be applied to similar objects. Its elements are observation/experience, generalisation, analysis/classification and abstraction. 'Concrete' is not an element.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0047", "ch": 1, "page": 10, "ansPage": 10, "srcNo": "47", "exam": "09/09/2023 S-I", "q": "The brainstorming (mental-excitation) model for teaching is used for the improvement of which of the following?", "o": ["Understanding", "Application", "Creativity", "Problem solving"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The brainstorming model is used to improve creativity. The brainstorming method was developed by Osborn; it is the oldest and most famous technique to stimulate creative thinking and is also very useful for solving complex and important problems.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0048", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "48", "exam": "09/09/2023 S-I", "q": "Herbart's learning has a step of:", "o": ["Differentiation", "Classification", "Association", "Direction"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The five-step lesson-plan system was started by the German psychologist J. F. Herbart: preparation, presentation, association (comparison), generalisation and application. So 'association' is a Herbartian step.", "tip": "Herbartian steps: Preparation, Presentation, Association, Generalisation, Application.", "status": "ok", "note": ""}, {"id": "AOT-0049", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "49", "exam": "09/09/2023 S-I", "q": "Who said that the assignment method is an important step in the teaching-learning process?", "o": ["Douglas", "Dewey", "Piaget", "Morrison"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The printed explanation: the assignment method is a practical experiment used by teachers to give students project work or activities; it is credited as an important step in teaching-learning to Harlan Upham Douglas (1888-1979), an American educational philosopher and reformer.", "tip": "", "status": "note", "note": "Attribution not independently verified (assignment method is more commonly linked to Morrison/Parkhurst); printed answer (a) retained, flagged for review."}, {"id": "AOT-0050", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "50", "exam": "09/09/2023 S-I", "q": "What is the importance of aims and objectives in a school?", "o": ["For identifying the subject matter", "For identifying the functions of the teacher", "For identifying the functions of the principal", "None"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Subject matter is selected and organised on the basis of aims and objectives. It is presented so that students get knowledge according to their interests, educational level, learning style and future needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0051", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "51", "exam": "09/09/2023 S-I", "q": "Bloom's system (taxonomy) is a:", "o": ["Classification system", "Demarcation system", "Delegation system", "Centralised system"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Bloom's taxonomy is a classification system: the objectives of the cognitive domain are classified into six categories - knowledge, comprehension, application, analysis, synthesis and evaluation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0052", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "52", "exam": "09/09/2023 S-I", "q": "The pillars of teaching are:", "o": ["Curriculum", "Instruction", "Assessment", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The printed explanation, citing Rayburn, says teaching has three pillars (teacher, learner, curriculum), and that 'teaching pillar' means the basic element comprising curriculum, instruction and assessment - hence all of the above.", "tip": "", "status": "note", "note": "Printed explanation mixes two sets of 'pillars'; answer (d) follows the option set. Retained."}, {"id": "AOT-0053", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "53", "exam": "09/09/2023 S-I", "q": "The outcome of teaching is:", "o": ["Behaviour change", "Self-respect", "Self-confidence", "Self-value"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The outcome of teaching is behaviour change: through teaching, a person's knowledge, skills and attitudes change, and the change is reflected in the person's behaviour.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0054", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "54", "exam": "10/09/2023 S-II", "q": "The natural activity of a living organism is:", "o": ["Learning", "Teaching", "Learning and teaching", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning is the natural activity of a living organism. It is a broad, continuous, lifelong process: humans begin learning after birth and keep learning something throughout life.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0055", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "55", "exam": "10/09/2023 S-I", "q": "'To educate (to give education)' means:", "o": ["To direct/instruct", "To build", "To make", "To prepare"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Education means giving direction, aimed at all-round development of the child's inborn powers. Education is a continuous process of development from infancy to maturity, a systematic process through which a child gains adult knowledge, experience, skill and good attitude.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0056", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "56", "exam": "13/09/2023 S-I; 14/09/2023 S-I", "q": "Which of the following does not play any role in learning?", "o": ["Traditional classroom", "Teachers' experience", "Learning experience", "Caste-based experience"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The traditional classroom, teachers' experience and learning experience all play important roles in teaching-learning. Learning does not happen all at once but develops with the help of experiences; caste-based experience plays no role in teaching-learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0057", "ch": 1, "page": 11, "ansPage": 11, "srcNo": "57", "exam": "13/09/2023 S-I; 14/09/2023 S-I", "q": "In the teaching-learning process, the teacher plays an important role as a:", "o": ["Facilitator", "Adviser (counsellor)", "Participant", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In teaching-learning, the teacher plays an important role as a facilitator. Considering children active learners, the teacher's task is not just to give knowledge but to help the learner reorganise existing and new learning so that knowledge is easily retrieved.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-006", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0058", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "58", "exam": "13/09/2023 S-I", "q": "Which of the following does not contribute during learning?", "o": ["Non-contextualisation (treating content as unrelated to its context)", "Organisation", "Classification", "Conceptualisation (ideation)"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Non-contextualisation treats learning as separate from its context or relevance, so it does not help in creating meaning and therefore does not contribute to learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0059", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "59", "exam": "13/09/2023 S-I", "q": "Which of the following is a gross motor skill?", "o": ["Cutting a large rectangle on a paper along the outline", "Knitting", "Swimming", "Cutting a circle on a paper along the outline"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Swimming is a gross motor skill. Gross motor skills involve large muscle groups for activities like walking, balancing, running and swimming; cutting, knitting and tracing are fine motor skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0060", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "60", "exam": "13/09/2023 S-I", "q": "Learning is a continuous process:", "o": ["From adolescence to death", "From childhood to old age", "From youth to adulthood", "From the cradle to the grave"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is a process of changing and developing behaviour through acquiring new abilities and extending existing ones. It continues from the cradle to the grave and depends on individual and environmental factors; it often occurs in a cyclical manner.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0061", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "61", "exam": "13/09/2023 S-I", "q": "A characteristic of Indian society is:", "o": ["Orthodox", "Unscientific", "Open", "Stratified"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Indian society is generally regarded as stratified because of its historical social structure. The stratified caste system has long influenced the social structure; stratification, based on social, economic and often hereditary factors, creates different layers or strata in society.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-007", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0062", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "62", "exam": "14/09/2023 S-I", "q": "According to Jean Piaget, one of the main characteristics of pre-operational thought is ______, which refers to the tendency to focus on one aspect of a situation and neglect others.", "o": ["Transduction (Hindi: 'pargaman')", "Causality", "Centration", "Decentration"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "One main feature of Piaget's pre-operational stage is 'centration': the child focuses on one aspect of a situation and ignores others, so the child can attend to only one feature at a time and cannot shift the direction of thought.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0063", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "63", "exam": "13/09/2023 S-I", "q": "In early childhood, growth is ______ and thinking is ______, while in middle childhood, growth is ______ and thinking is ______.", "o": ["Slow, logical, stable, egocentric", "Slow, somewhat egocentric, stable, logical", "Stable, somewhat egocentric, slow, logical", "Stable, logical, slow, egoistic"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In early childhood growth slows and the child becomes somewhat self-centred because children are still learning their place in the world and find it difficult to take others' perspectives. In middle childhood growth is steady and thinking becomes more logical as experience and knowledge grow and abstract thinking begins.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0064", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "64", "exam": "13/09/2023 S-I; 09/09/2020 S-II", "q": "Which of the following is NOT a focal point of the tri-polar process of teaching?", "o": ["Teaching methods", "Teacher", "Student", "Content"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The tri-polar (three-dimensional) process of teaching was propounded by John Dewey; it involves the teacher, the student and the content. Teaching methods are not a pole of it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0065", "ch": 1, "page": 12, "ansPage": 12, "srcNo": "65", "exam": "14/09/2023 S-I", "q": "Activity-based learning is:", "o": ["By dictation", "By practice", "By doing", "By memorisation"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In activity-based learning the student actively constructs and reconstructs knowledge from personal experience; it is known as 'learning by doing'. It gives the child opportunity to gain knowledge and experience, and through it the child participates with interest in learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0066", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "66", "exam": "14/09/2023 S-I", "q": "In the learning process, the learner is:", "o": ["An independent variable", "A dependent variable", "An inter-dependent variable", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the learning process the learner is the dependent variable. Variables are of many kinds (independent, dependent, intervening); factors affecting the learner such as teaching style or parents' participation are independent, and the curriculum is an intervening variable.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0067", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "67", "exam": "14/09/2023 S-I", "q": "Philosophy is used in education for:", "o": ["Selection of subject matter", "Selection of method", "Selection of objectives", "The evaluation process"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Philosophy is foundational knowledge that helps understand education as a whole and determines the selection of aims (objectives), methods and their uses; it examines the nature of education and its purposes and problems.", "tip": "", "status": "note", "note": "Printed explanation also mentions methods; printed answer (c) retained."}, {"id": "AOT-0068", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "68", "exam": "15/09/2023 S-I", "q": "Interaction analysis is a process of:", "o": ["Coding (recording) process", "Coding-interpretation (decoding) process", "Both A and B", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Interaction analysis is a method for analysing and improving the teaching-learning process. In the coding process, verbal and non-verbal behaviours between teacher and student are observed; in the interpretation (decoding) process, the teaching-learning is analysed and evaluated. So it includes both.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0069", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "69", "exam": "15/09/2023 S-I", "q": "Learning is a natural activity of:", "o": ["The learner", "The teacher", "A person", "A living being"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is a continuous, lifelong process in which a person learns from experience and changes behaviour. Hence learning is a natural activity found in living beings.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-004", "first": false, "kind": "near", "of": "AOT-0014"}}, {"id": "AOT-0070", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "70", "exam": "15/09/2023 S-I", "q": "An interactive component of the learning process is:", "o": ["Higher-order thinking", "Attention", "Memory", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning involves higher-order thinking, attention and memory. It shows a permanent or temporary change in behaviour through experience and training; all three components together complete the process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0071", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "71", "exam": "18/09/2023 S-I", "q": "Which of the following social skills is not developed by a cooperative activity plan?", "o": ["Listening", "Competition", "Cooperation", "Motivation (encouragement)"], "key": {"printed": [3], "verified": [1], "official": null}, "e": "Printed explanation: social skills and character development occur in every person's life; a cooperative plan develops listening, emotional intelligence, cooperation, problem-solving, competition, etc. and does not develop 'encouragement'.", "tip": "", "status": "disputed", "note": "Disputed: cooperative learning de-emphasises competition, so (b) is arguably the better answer. Printed answer (d) retained as key."}, {"id": "AOT-0072", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "72", "exam": "09/09/2020 S-III", "q": "The most essential characteristic of cooperative learning is:", "o": ["Effective learning", "Positive interdependence", "Cooperation", "Division of labour"], "key": {"printed": [2], "verified": [1], "official": null}, "e": "Printed explanation: cooperative learning is learning in which children form groups of mixed ability and work towards one aim, helping one another; cooperation is its most essential feature and promotes interaction that develops understanding of content.", "tip": "", "status": "disputed", "note": "Standard theory (Johnson & Johnson) names 'positive interdependence' as the essential element. Printed answer (c) retained as key."}, {"id": "AOT-0073", "ch": 1, "page": 13, "ansPage": 13, "srcNo": "73", "exam": "29/05/2024 S-I; 09/09/2020 S-III; 10/09/2020 S-II", "q": "The most appropriate meaning of 'Learning' is:", "o": ["Inculcation of knowledge", "Modification of behaviour", "Personal adjustment", "Acquisition of skills"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The apt meaning of learning is modification of behaviour, because learning changes a person's behaviour. It is a broad process in which behaviour, knowledge and skills change as a result of practice and experience.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-008", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0074", "ch": 1, "page": 13, "ansPage": 14, "srcNo": "74", "exam": "09/09/2020 S-II", "q": "The teaching-learning process is fundamentally completed in:", "o": ["Class-room", "School", "Society", "Home"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning helps adaptation to the surrounding environment. Fundamentally, the teaching-learning process is completed in the classroom, and every child is naturally motivated to learn.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0075", "ch": 1, "page": 14, "ansPage": 14, "srcNo": "75", "exam": "09/09/2020 S-III", "q": "'Learning by doing is useful, because ....'", "o": ["Children understand better by doing", "It is more interesting", "Children like self-activity", "This helps to keep children busy"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Learning by doing' is useful because children understand better by doing. It is the process through which people use their prior knowledge, skills, capacities and experiences to learn new experiences and skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0076", "ch": 1, "page": 14, "ansPage": 14, "srcNo": "76", "exam": "09/09/2020 S-III", "q": "The speed of learning depends on:", "o": ["Learner's interest", "Curiosity of the learner about the subject", "Learner's motivation", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The speed of learning differs among students and is affected by various personal and environmental factors. It depends on the learner's interest, curiosity about the subject and motivation; hence all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0077", "ch": 1, "page": 14, "ansPage": 14, "srcNo": "77", "exam": "09/09/2020 S-I", "q": "In Vygotsky's theory, which aspect of development gets neglected?", "o": ["Social", "Biological", "Linguistic", "Cultural"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The socio-cultural theory was propounded by the Soviet psychologist Lev Vygotsky. According to it, social interaction plays an important role in developing a learner's cognitive ability. Vygotsky held that social, cultural and linguistic processes are important in development, while the biological process is largely neglected.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0078", "ch": 1, "page": 14, "ansPage": 14, "srcNo": "78", "exam": "09/09/2020 S-II", "q": "Which option is false in the context of 'learning'?", "o": ["Learning is the change in behaviour.", "The change in behaviour occurs as a function of practice or experience.", "There is a relatively permanent change in behaviour in learning.", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning is a lifelong, universal process that continuously increases our knowledge. Definitions: Skinner - 'Learning is a process of progressive behaviour adaptation'; Woodworth - 'the process of acquiring new knowledge and new responses'; Crow & Crow - 'the acquisition of habits, knowledge and attitudes'. All three statements are true, so none is false.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0079", "ch": 1, "page": 14, "ansPage": 14, "srcNo": "79", "exam": "10/09/2020 S-II", "q": "'Individual differences' in the learning process are given the least importance in:", "o": ["Naturalism", "Realism", "Idealism", "Pragmatism"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In Idealism, individual differences get the least importance. Idealism holds that physical things are imaginary and exist only as constructs of the mind; its aim is to feel truth, beauty and goodness, and it believes that there is no difference among individuals in society - they are all one.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0080", "ch": 1, "page": 14, "ansPage": 14, "srcNo": "80", "exam": "10/09/2020 S-II", "q": "Effective learning is indicated by:", "o": ["Ability to recall and reproduce", "Ability to give arguments", "Ability to solve related problems", "Ability to score high in the examination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Effective learning is shown by the ability to solve related problems. Effective teachers positively influence their students and use their expertise to improve learning; the results are often measurable. As a popular saying goes, a school is only as good as its teachers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0081", "ch": 1, "page": 15, "ansPage": 15, "srcNo": "81", "exam": "10/09/2020 S-I", "q": "According to the 'Mahayana':", "o": ["Gautam Buddha is a great man, not God.", "It is difficult for most humans to find the 'Nirvana Marg' alone.", "Everyone has to find the 'Nirvana Marg' alone.", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "According to Mahayana, it is difficult for most humans to find the path to nirvana alone. Mahayana is one of the two major branches of Buddhism; it promotes non-dual principles such as the Madhyamaka doctrine of emptiness, Vijnanavada and Buddha-nature.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0082", "ch": 1, "page": 15, "ansPage": 15, "srcNo": "82", "exam": "10/09/2020 S-I", "q": "'Epistemology' means:", "o": ["Study of human nature", "Study of the nature of values", "Study of the nature of knowledge", "Study of child development"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Epistemology means the study of the nature of knowledge. It is the philosophical study of the nature, origin and limits of human knowledge, one of the main branches of philosophy, asking what knowledge is and how humans can acquire knowledge of reality.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0083", "ch": 1, "page": 15, "ansPage": 15, "srcNo": "83", "exam": "11/09/2020 S-I", "q": "'Every learner is unique' means that:", "o": ["No two learners are alike in their abilities, interests and talents.", "Learners do not have any common qualities, nor do they share common goals.", "A common curriculum for all learners is not possible.", "It is impossible to develop the potentials of learners in a heterogeneous class."], "key": {"printed": [0], "verified": [0], "official": null}, "e": "'Every learner is unique' means no two learners are alike in ability, interest and talent. Each child has individual learning needs and styles, so no single method can be applied to all.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0084", "ch": 1, "page": 15, "ansPage": 15, "srcNo": "84", "exam": "11/09/2020 S-I", "q": "It can safely be assumed that a student understands a principle when he/she can:", "o": ["Give more examples of it.", "Use it in solving problems to which it applies.", "Recognise it again when he/she encounters it again.", "Recall the principles as and when asked."], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A student can safely be said to understand a principle when he/she can use it in solving problems where it applies; its application reveals the student's knowledge.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-009", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0085", "ch": 1, "page": 15, "ansPage": 15, "srcNo": "85", "exam": "11/09/2020 S-I", "q": "Which one of the following statements is true about 'Learning'?", "o": ["Errors made by children indicate that no learning has taken place.", "Learning is effective in an environment that is emotionally positive and satisfying for learners.", "Learning is not affected by emotional factors at any stage of learning.", "Learning is fundamentally a mental activity."], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Learning is a continuous process, largely the result of interaction between persons and their environment. It is effective in an environment that is emotionally positive and satisfying for learners. Teaching is made in accordance with the learner's needs, interests and emotions so that the cognitive and other aspects of children are influenced.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0086", "ch": 1, "page": 15, "ansPage": 15, "srcNo": "86", "exam": "11/09/2020 S-I", "q": "The idea of 'Basic Education' was propounded by:", "o": ["Dr. Zakir Hussain", "Dr. Rajendra Prasad", "Mahatma Gandhi", "Rabindra Nath Tagore"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The idea of Basic Education ('Nai Talim') was propounded by Mahatma Gandhi, who started basic education in his ashram in 1946 (as printed). It holds that knowledge and work are not separate. Basic education is the foundation on which the structure of higher education can be built.", "tip": "", "status": "note", "note": "Printed explanation says 1946; Gandhi's Wardha scheme dates from 1937 - date not verified; answer unaffected."}, {"id": "AOT-0087", "ch": 1, "page": 16, "ansPage": 16, "srcNo": "87", "exam": "11/09/2020 S-I", "q": "Individual attention is important in the teaching-learning process because:", "o": ["Learners always learn better in a group.", "Teacher training programmes prescribe it.", "It offers better opportunities to teachers to discipline each learner.", "Children develop at different rates and learn differently."], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Individual attention is important because children develop at different rates and learn in different ways. It helps the teacher detect weaknesses in the learning process and abilities; instead of treating all children by one method, different methods should be applied according to individual differences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0088", "ch": 1, "page": 16, "ansPage": 16, "srcNo": "88", "exam": "11/09/2020 S-I", "q": "Which of the following behaviours characterise the 'concrete operational stage' as proposed by Jean Piaget?", "o": ["Hypothetico-deductive reasoning; propositional thought", "Conservation; class inclusion", "Deferred imitation; object permanence", "Make-believe play; irreversibility of thought"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Conservation and class inclusion characterise Piaget's concrete operational stage, which lasts roughly from 7 to 11 years. At this stage children can classify objects into groups and subgroups and develop the ability to conserve number, area and volume.", "tip": "Concrete operational (7-11): conservation, classification, reversibility.", "status": "ok", "note": ""}, {"id": "AOT-0089", "ch": 1, "page": 16, "ansPage": 16, "srcNo": "89", "exam": "11/09/2020 S-I", "q": "Which of the following is NOT a principle of development?", "o": ["Development is lifelong.", "Development is modifiable.", "Development is influenced by both heredity and environment.", "Development is universal and cultural contexts do not influence it."], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Principles of development: it is lifelong; modifiable; influenced by both heredity and environment; not the same in all stages; different for different persons; sequential and predictable; moves from general to specific. So (d) is not a principle.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0090", "ch": 1, "page": 16, "ansPage": 16, "srcNo": "90", "exam": "11/09/2020 S-I", "q": "Which of the following theorists, while viewing children as active seekers of knowledge, emphasised the influence of social and cultural contexts on their thinking?", "o": ["John B. Watson", "Lev Vygotsky", "Jean Piaget", "Lawrence Kohlberg"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Lev Vygotsky viewed children as active seekers of knowledge and stressed the influence of social and cultural contexts on thinking. He held that children's cognitive development is promoted through social interaction with others, especially more capable ones.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0091", "ch": 1, "page": 16, "ansPage": 16, "srcNo": "91", "exam": "11/09/2020 S-I", "q": "Which of the following statements about learning is correct from a constructivist perspective?", "o": ["Learning is the process of reproduction and recall.", "Learning is the process of rote memorisation.", "Learning is conditioning of behaviours by repetitive association.", "Learning is the process of construction of knowledge by active engagement."], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Constructivist teaching is based on the belief that learning is always built on what a student already knows. According to constructivism, learning is the construction of knowledge through active engagement. Students should work in groups or alone, form their own knowledge by experience, and teachers should create knowledge by asking questions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0092", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "92", "exam": "11/09/2020 S-I", "q": "In the constructivist framework, learning is primarily:", "o": ["Based on rote memorisation", "Centred around reinforcement", "Acquired through conditioning", "Focused on the process of meaning making"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the constructivist framework learning is primarily focused on meaning making. Students must connect existing meaning and understanding with new knowledge and reflect on their own experience. Each student builds an understanding of the world, forming personal 'rules' and 'mental models' to make sense of experiences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0093", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "93", "exam": "14/09/2020 S-I", "q": "In which situation is the emotional adjustment of students effective?", "o": ["Personality formation", "Classroom teaching", "Discipline", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Emotional adjustment is essential for development because it helps students' emotional development: self-confidence, empathy, meaningful and lasting friendships. It affects the child's attitude towards surroundings, and is effective in personality formation, classroom teaching and discipline - hence all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0094", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "94", "exam": "14/09/2020 S-I", "q": "In which stage do children develop the same-gender (sex-homogeneous) concept / preference ('ling ka sam-pratyay')?", "o": ["Infancy", "Childhood", "Adolescence", "Adulthood"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In childhood children develop a same-sex orientation: they try to make friends with their own sex group. This stage (about 6-12 years) is very important for overall development, and the child's personality and character develop rapidly.", "tip": "", "status": "note", "note": "Hindi term 'ling ka sam-pratyay' is unusual; rendered as same-gender concept/preference. Answer unaffected."}, {"id": "AOT-0095", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "95", "exam": "14/09/2020 S-I", "q": "Which of the following can we call a result (outcome) of learning?", "o": ["Intelligence", "Maturity", "Skill", "Memory"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Skill can be called a result of learning: learning is not inborn but is acquired through use of hereditary resources, practice and effort. Through learning the child is able to use hereditary resources.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0096", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "96", "exam": "15/09/2020 S-II", "q": "Attitudes, concepts, skills and knowledge are products of:", "o": ["Learning", "Research", "Heredity", "Explanation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Attitude, concept, skill and knowledge are results of learning, because learning begins on that basis; what kind of learning will be acquired depends on these, and information about them comes from the process itself.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0097", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "97", "exam": "15/09/2020 S-II", "q": "The 'insight theory of learning' is promoted by:", "o": ["'Gestalt' theorists", "Pavlov", "Jean Piaget", "Vygotsky"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The insight theory of learning was given by Gestalt theorists. It stresses that learning and problem-solving involve organising stimuli, and it emphasises students' ability to see the underlying structure of an idea or problem and to understand it before acting.", "tip": "Insight learning = Kohler (Gestalt school), experiments on chimpanzee Sultan.", "status": "ok", "note": ""}, {"id": "AOT-0098", "ch": 1, "page": 17, "ansPage": 17, "srcNo": "98", "exam": "15/09/2020 S-II", "q": "The best place for a child's cognitive development is:", "o": ["Playground", "Auditorium", "Home", "School and class environment"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Cognitive development means the development of ability to understand, learn, reason, think and solve problems. Children's cognitive development takes place in the school and class environment, while emotional development is related to home and the school and class environment gives children opportunity to learn, affecting cognitive development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0099", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "99", "exam": "15/09/2020 S-II", "q": "Whom among the following is described as the 'father of psychoanalysis'?", "o": ["Erikson", "Piaget", "Bruner", "Freud"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Sigmund Freud is called the founder of psychoanalysis. Psychoanalysis has three uses: (1) it provides a method of examining the mind; (2) it provides a systematic set of theories about human behaviour; (3) it suggests methods for treating emotional disorders.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0100", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "100", "exam": "15/09/2020 S-II", "q": "'Learning is the modification of behaviour through experience and training.' This statement is given by:", "o": ["Gates and others", "Morgan and Gilliland", "Skinner", "Cronbach"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The statement 'Learning is the modification of behaviour through experience and training' is given by Gates and others.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0101", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "101", "exam": "15/09/2020 S-II", "q": "The main proponent of the cognitive theory of teaching is:", "o": ["N. L. Gage", "Shiv Kumar Mitra", "B. F. Skinner", "McDonald"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "N. L. Gage is the proponent of the cognitive theory of teaching. According to him, a single theory of teaching cannot fulfil the objectives of teaching; his ideas were influenced by the school of cognitive psychology.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0102", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "102", "exam": "15/09/2020 S-II", "q": "'Development is a never-ending process.' This idea is associated with:", "o": ["Principle of interrelation", "Principle of continuity", "Principle of integration", "Principle of interaction"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Development works on the principle of continuity: it starts from the womb and ends at death. It is a lifelong process that never ends; the rate and amount of change differ from one stage to another.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0103", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "103", "exam": "15/09/2020 S-II", "q": "The theory of observational learning was given by:", "o": ["Kohler", "Pavlov", "Kurt Lewin", "Bandura"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Albert Bandura, an American psychologist, proposed the 'observational learning' (social learning) theory. He stated that (1) cognitive and problem-solving skills can be learnt by observing and imitating others, and (2) new behaviours and experiences are acquired by observing others.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-010", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0104", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "104", "exam": "15/09/2020 S-II", "q": "The exponent of social constructivism was:", "o": ["Chomsky", "Vygotsky", "Piaget", "Dewey"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Social constructivism was developed by the Soviet psychologist Lev Vygotsky, who is called its father. Vygotsky argued that social contexts and culture in which people find themselves influence the construction of knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0105", "ch": 1, "page": 18, "ansPage": 18, "srcNo": "105", "exam": "15/09/2020 S-III", "q": "To the teacher of the next grade, 'transfer of learning' means:", "o": ["Adjustment", "Maturity", "Retention", "Readiness"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Transfer of learning means knowledge acquired in one subject or situation is useful in other subjects or situations; previously learnt knowledge affects learning new knowledge. For the next-grade teacher it means readiness: being prepared mentally and physically to act willingly and with enthusiasm.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0106", "ch": 1, "page": 18, "ansPage": 19, "srcNo": "106", "exam": "15/09/2020 S-III", "q": "According to Lev Vygotsky, basic mental capacities are transformed into higher cognitive processes primarily through:", "o": ["Rewards and punishment", "Social interaction", "Stimulus-response association", "Adaptation and organisation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "According to Vygotsky, social interaction is mainly transformed into higher cognitive processes. He explained it with the concept of the zone of proximal development: the range of tasks a child can accomplish only with the help of a more skilled adult or peer.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0107", "ch": 1, "page": 19, "ansPage": 19, "srcNo": "107", "exam": "15/09/2020 S-III", "q": "In the constructivist frame, the child is viewed as:", "o": ["A 'miniature adult' who is less than an adult in all aspects such as size, cognition and emotions", "A 'tabula rasa' or 'blank slate' whose life is shaped entirely by experience", "A 'passive being' who can be shaped and moulded into any form through conditioning", "A 'problem solver' and a 'scientific investigator'"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Constructivism is an educational philosophy in which children build knowledge from experience. Children change and expand their schemas while interacting with the environment; they solve problems according to their interest and test their ideas in a scientific way - a problem solver and scientific investigator.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0108", "ch": 1, "page": 19, "ansPage": 19, "srcNo": "108", "exam": "15/09/2020 S-III", "q": "One of the major accomplishments of the concrete operational stage is:", "o": ["Animistic thinking", "Ability to conserve", "Hypothetico-deductive reasoning", "Secondary circular reactions"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The concrete operational stage is part of cognitive development: the process by which a person acquires the ability to think, learn, reason and understand the world around them. Hence the ability to conserve (retain/preserve quantity) is a major accomplishment of this stage; it begins in childhood and continues through life.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0109", "ch": 1, "page": 19, "ansPage": 19, "srcNo": "109", "exam": "15/09/2020 S-III", "q": "Read the following description and identify the stage of moral reasoning of Kohlberg.\nDescription: Right action is defined by self-chosen ethical principles of conscience that are valid for all humanity, regardless of law and social agreement.", "o": ["The instrumental purpose orientation", "The social-contrast (sic; social-contract) orientation"
