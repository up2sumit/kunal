[3], "official": null}, "e": "A teacher's attitude towards objectives includes knowing the subject's specific objectives, implementing the plan on time and fixing activities; so all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0225", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "225", "exam": "05/09/2023 S-I", "q": "Bloom's Taxonomy was originally published in:", "o": ["1954", "1956", "1958", "1960"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Bloom's taxonomy relates to the classification of educational objectives of 'learning'. Bloom's taxonomy was made in 1956; the objectives were divided into three aspects: cognitive, affective and psychomotor (action-based).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0226", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "226", "exam": "13/09/2023 S-I", "q": "Which part of speech is used in writing instructional objectives?", "o": ["Noun", "Adjective", "Verb", "Adverb"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Instruction is found in the systematic arrangement of professional teaching in a school. In writing instructional objectives, a 'verb' (action word) is used. Its components include planning, execution/implementation, management and supervision, and a feedback system.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0227", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "227", "exam": "13/09/2023 S-I", "q": "One criticism of the cognitive hierarchy of Bloom's classification is that:", "o": ["The lowest level is unnecessary", "A comprehensive hierarchy of verbs", "It is not the backbone of educational philosophy", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Bloom's taxonomy of cognitive objectives is a hierarchical organisation. One criticism of the cognitive hierarchy is that the lowest level is unnecessary; the lowest level of cognitive attainment is knowledge.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0228", "ch": 2, "page": 35, "ansPage": 35, "srcNo": "228", "exam": "08/09/2023 S-II", "q": "An example of a psychomotor activity is:", "o": ["Laboratory", "Story-telling", "Demonstrating", "Calculating the result of two experiments"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The printed explanation gives 'laboratory' as the example of a psychomotor activity (practical activity).", "tip": "", "status": "note", "note": "Question wording is unclear and the printed explanation ('related to mental activities') is inaccurate; answer (a) retained as printed, flagged for review."}, {"id": "AOT-0229", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "229", "exam": "08/09/2023 S-II", "q": "The aim of teaching is:", "o": ["To provide information", "To involve students in activity", "To instil knowledge", "To bring desirable change in behaviour"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The aim of teaching is to bring desirable change in behaviour: through teaching, not only is knowledge transmitted to students but positive change is brought in their behaviour and thinking, while the other three options lead towards the desired change.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0230", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "230", "exam": "08/09/2023 S-II", "q": "Team teaching is the joint work of:", "o": ["Two or more teachers", "Two or more students", "Teacher and student", "None"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The joint work of two or more teachers comes under team teaching. Team teaching is a modern technique of teaching method in which two or more teachers jointly make a plan regarding the study of a class, regularly implement it and then evaluate it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0231", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "231", "exam": "08/09/2023 S-I", "q": "To make an objective challenging, change the:", "o": ["Verb", "Adverb", "Noun", "Adjective"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "To make an objective challenging, the verb should be changed. An objective is a predetermined goal which directs an action or motivates behaviour; the verb needs changing because actions (verbs) are what change from one level to another.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0232", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "232", "exam": "09/09/2023 S-I", "q": "Which objectives are attained through instruction?", "o": ["Cognitive (knowledge-based)", "Creative", "Affective", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Instruction is a process through which the teacher provides knowledge, skills and attitudes to students; its aim is to help students achieve learning goals. Cognitive objectives include understanding of facts, concepts, principles and processes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0233", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "233", "exam": "10/09/2023 S-I", "q": "The miniature (small) culture in a school is the:", "o": ["Family", "Home", "Classroom", "Curriculum"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An ideal school presents a miniature form of society in which its cultural features are purely reflected. One of the school's main functions is to preserve the society's cultural traditions and customs and transfer them to coming generations. So the classroom is a miniature culture in school.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0234", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "234", "exam": "10/09/2023 S-I", "q": "A teacher determines the objectives of teaching by:", "o": ["Writing general objectives", "Writing specific objectives", "Writing introductory (preamble) objectives", "Writing an objective statement"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A teacher has many objectives but the basic aim of teaching is to develop students' abilities. The teacher determines the objectives of teaching by writing specific objectives; the teacher builds the objectives on this basis.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0235", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "235", "exam": "10/09/2023 S-I", "q": "Interpersonal objectives relate to:", "o": ["Mutual relationship with others", "Feeling and attitude", "Dynamic (kinetic) action", "Knowledge"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "An interpersonal relationship is a relationship between two or more people which may be temporary or stable. Interpersonal relationships are built in the context of social, cultural and other influences.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0236", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "236", "exam": "13/09/2023 S-I", "q": "Another name for purpose, aim, destination is:", "o": ["Action plan", "Objective", "Policy", "Rule"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Another name for purpose/aim/destination is objective. An objective is a pre-determined goal that directs an action or motivates behaviour; if the goal is fixed and clear, the person keeps working with enthusiasm until it is attained. In education, objectives include character formation, development of personality, performance of duties, national and social welfare, and preservation and dissemination of culture.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0237", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "237", "exam": "13/09/2023 S-I", "q": "In teaching, the teacher is the:", "o": ["Independent variable", "Dependent variable", "Inter-dependent variable", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the teaching process, the teacher works as an independent variable; he performs different kinds of activities to give learning experiences to students. The learner is generally called the dependent variable because the learner has to function actively according to planning and presentation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0238", "ch": 2, "page": 36, "ansPage": 36, "srcNo": "238", "exam": "13/09/2023 S-I", "q": "The process of establishing a sequence for a task is:", "o": ["Objective", "Process", "Strategy", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The process used in establishing the order of a task is called an objective. An objective is a predetermined goal which directs an action or motivates behaviour; as one nears the goal, one attains one's aim in the order of one's work plan.", "tip": "", "status": "note", "note": "Question/explanation wording is loosely worded in the source; printed answer (a) retained."}, {"id": "AOT-0239", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "239", "exam": "13/09/2023 S-I", "q": "If a child fails to answer in class, the teacher should:", "o": ["Advise him to study well", "Punish", "Scold", "Understand the reason for his failure"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "If a child fails in class, the teacher should find the reason for the failure rather than blame the student. After finding the cause the teacher should help make it easy, guide, and provide an environment to facilitate learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0240", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "240", "exam": "14/09/2023 S-I", "q": "Into how many parts did Maslow divide human needs?", "o": ["Three categories", "Five categories", "Four categories", "Six categories"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Maslow divided human needs into five parts: 1. Physiological needs; 2. Safety needs; 3. Belongingness and love needs; 4. Esteem needs; 5. Self-actualisation needs.", "tip": "Maslow: Physiological - Safety - Love/Belonging - Esteem - Self-actualisation.", "status": "ok", "note": "", "dup": {"group": "DUP-016", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0241", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "241", "exam": "14/09/2023 S-I", "q": "The nature of teacher effectiveness is:", "o": ["Scientific", "Artistic", "Both a and b", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teacher effectiveness can be defined in terms of the skills, understanding, work habits, desirable attitude, values, decision-making and personal adjustment with students that form the basis of effective teaching. The nature of teacher effectiveness is scientific.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-017", "first": true, "kind": "exact", "of": null}}, {"id": "AOT-0242", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "242", "exam": "14/09/2023 S-I", "q": "The teacher has been glorified by the phrase 'friend, philosopher and guide' because:", "o": ["He acquaints students with the higher values of humanity", "He is a great patriot", "Both a and b", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The teacher is glorified by the phrase friend, philosopher and guide because he acquaints students with the higher values of humanity. The teacher plays many roles - guide, philosopher, leader, friend and often a facilitator - so students can approach the teacher without any hesitation if they face a problem.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-018", "first": true, "kind": "near", "of": null, "keyConflict": true}}, {"id": "AOT-0243", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "243", "exam": "14/09/2023 S-I", "q": "Carol Gilligan's criticism of Kohlberg's theory of moral development is:", "o": ["For using the case study as a research method", "From a social-cognitive perspective", "From a feminist perspective", "For not giving enough importance to genetic factors"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Carol Gilligan criticised Kohlberg's theory of moral development from a feminist perspective. She was one of Kohlberg's research assistants and held that his theory was naturally biased against women; according to her, Kohlberg's study was mainly based on a male sample.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0244", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "244", "exam": "14/09/2023 S-I", "q": "In infancy, ______ institutions of socialisation are primarily important, whereas in early childhood ______ institutions of socialisation also become important.", "o": ["Secondary; Tertiary", "Tertiary; Secondary", "Primary; Secondary", "Secondary; Primary"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In infancy, the primary institutions of socialisation are mainly important, whereas in early childhood the secondary/intermediate institutions of socialisation also become important.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0245", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "245", "exam": "14/09/2023 S-I", "q": "What is needed for good teaching?", "o": ["Treatment (remedial)", "Diagnosis", "Compensation", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Good and effective teaching involves the behaviour of the teacher, knowledge of the subject, belief in the students' abilities and dedication to improvement; remedial treatment, diagnosis and compensation are all required. Effective teaching features: human-relations skills, subject-matter ability, expertise in teaching methods and communication skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0246", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "246", "exam": "14/09/2023 S-I", "q": "The basic source of educational objectives is:", "o": ["Human experience", "Psychology", "Philosophy", "Sociology"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The basic source of educational objectives is human experience. While determining educational objectives, the nature of subject-matter, the nature of teacher and the level of education must also be considered; each subject has its specific nature. The aim of education motivates us to learn through experience.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0247", "ch": 2, "page": 37, "ansPage": 37, "srcNo": "247", "exam": "14/09/2023 S-I", "q": "Objectives:", "o": ["May include abstract understanding", "Are difficult to measure", "May include appreciation", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "An objective is a pre-determined goal which directs an action or motivates behaviour. Objectives may include abstract understanding, are difficult to measure, and may include appreciation. So all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0248", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "248", "exam": "15/09/2023 S-I", "q": "The socialisation of children starts from the:", "o": ["Society", "Family", "Mother", "School"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The socialisation of children starts first and most importantly from the family. The family is the source of a child's life and socialisation; in the family the child gets the chance to learn about the society's culture, values, morality and behaviour, and family members such as parents, grandparents and siblings play important roles.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0249", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "249", "exam": "15/09/2023 S-I", "q": "The process that makes a child socially adapted is:", "o": ["Consummation", "Enculturation", "Socialisation", "All of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Socialisation is the process by which an individual learns the norms, values and practices of his society. It is a continuous process lasting throughout life from birth; through socialisation children learn social roles, social norms and social contact.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0250", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "250", "exam": "15/09/2023 S-I", "q": "Instruction is provided:", "o": ["Inside the classroom", "At a place of worship", "Everywhere", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Instruction is provided inside the classroom. Instruction means to give detailed knowledge of any subject in the classroom setting; it is the traditional concept of teaching, in which a person with less knowledge gets information from one with more.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0251", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "251", "exam": "15/09/2023 S-I", "q": "Instructional objectives are:", "o": ["Specific", "Measurable", "Action-centred", "All of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "It is important to write instructional objectives so that students' progress can be measured effectively and teaching can be made suitable. Specific: what the student has to learn; measurable: how progress can be measured; action-centred: what the student will do. All three are features.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0252", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "252", "exam": "15/09/2023 S-I", "q": "Bloom's taxonomy began at:", "o": ["Harvard University", "Stanford University", "University of Chicago", "Yale University"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Bloom's taxonomy, also called Bloom's Taxonomy of Educational Objectives, began at the University of Chicago. It was created by the great educational psychologist Dr. Benjamin Bloom and published in 1956.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0253", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "253", "exam": "09/09/2020 S-III", "q": "You want your students not to forget the folic [sic; topic] that you taught. What will you do for it?", "o": ["Will give home work", "Will repeat the old information", "Will use the knowledge acquired under new circumstances", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "You want your students not to forget the topics you have taught. For this you will: give students homework, repeat the old information, make them use knowledge acquired in new circumstances, and show students the importance of the work they are doing. So all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0254", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "254", "exam": "09/09/2020 S-III", "q": "Which of the following is an example of a learning style?", "o": ["Visual", "Accrual", "Factual", "Tactual"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The 4 main learning styles are: (1) visual, (2) auditory, (3) reading/writing, (4) kinesthetic. A learning style is the preferred way in which different students learn and indicates the preferred approach for problem-solving and learning.", "tip": "", "status": "note", "note": "Option (d) 'Tactual/tactile' is close to kinesthetic but is not one of the four listed styles; answer (a) as printed."}, {"id": "AOT-0255", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "255", "exam": "09/09/2020 S-III", "q": "Who has promoted the 'Insight theory of learning'?", "o": ["Jean Piaget", "Vygotsky", "Gestalt theorists", "Pavlov"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The insight theory of learning was promoted by Gestalt theorists. The printed explanation says the theory of insight was propounded in 1911 by Max Wertheimer; according to it, once insight occurs in the learner, he correctly responds and learns - in problem solving a new idea comes to the person, called insight.", "tip": "", "status": "note", "note": "Insight learning is usually credited to Wolfgang Kohler (Gestalt school); the printed attribution/date to Wertheimer is inexact. Answer (c) unaffected."}, {"id": "AOT-0256", "ch": 2, "page": 38, "ansPage": 38, "srcNo": "256", "exam": "09/09/2020 S-III", "q": "______ has an important role in the personality building of a child.", "o": ["Mother tongue", "Foreign language", "Academic language", "Standard language"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The mother tongue makes an important contribution to a child's personal development because it is the first language children learn after birth. The mother tongue is a child's social, cultural, behavioural and linguistic identity; because of this importance, stress is laid on accepting children's use of the mother tongue even in the classroom.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0257", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "257", "exam": "16/09/2020 S-I", "q": "Why is a school considered a 'miniature society'?", "o": ["School inmates come from society", "School children are of a lower age group", "School children develop into adult members of society", "Schools are established by the society"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The school acquaints a person with life in a beautiful way. School children develop into adult members of society who criticise the evils and bad practices of society and take a pledge to remove them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0258", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "258", "exam": "09/09/2020 S-I", "q": "Which one of the following is NOT an active agency of socialisation?", "o": ["Family", "School", "Railway station", "Religious institution"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Family, school and religious institutions are active agencies of socialisation, where a person becomes social through interaction with others and shares their ideas and soul; this is less likely at a railway station.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0259", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "259", "exam": "09/09/2020 S-I", "q": "When did the 'Operation Blackboard' programme begin?", "o": ["1986", "1987", "1992", "1996"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Operation Blackboard was launched in 1986 as part of Rajiv Gandhi's National Policy on Education (NPE). Its main objective was to improve human and physical resources available in primary schools in India.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0260", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "260", "exam": "09/09/2020 S-I; 10/09/2020 S-II", "q": "National Education Day is celebrated in whose memory?", "o": ["Zakir Hussain", "Dr. Radhakrishnan", "Swami Vivekananda", "Maulana Abul Kalam Azad"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "National Education Day is celebrated every year on 11 November in memory of Maulana Abul Kalam Azad, India's first Education Minister and a Bharat Ratna awardee; it began in 2008. Its main aim is to spread awareness about the importance of education across the world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0261", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "261", "exam": "09/09/2020 S-II", "q": "Which option is FALSE in reference to Bloom's taxonomy?", "o": ["It deals with the classification of 'learning objectives' within education.", "It was published in 1966 AD.", "It contributes to children's mental development.", "It was named after Benjamin Bloom, the education psychologist."], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Benjamin Bloom was an American psychologist who published his book 'Taxonomy of Educational Objectives' in 1956, so the statement 'published in 1966' is false. Bloom's classification is also known as 'objectives of education'; present-day education is based on it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0262", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "262", "exam": "09/09/2020 S-I", "q": "Cognitive objectives are related to:", "o": ["Skill", "Heart", "Brain", "Hands"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The cognitive domain focuses on recalling knowledge and on objectives related to the development of mental abilities. According to Bloom, 'the cognitive domain includes objectives related to the recall of knowledge, the development of understanding and mental abilities'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0263", "ch": 2, "page": 39, "ansPage": 39, "srcNo": "263", "exam": "10/09/2020 S-II", "q": "The attitude of the teacher that affects teaching pertains to:", "o": ["Affective domain", "Cognitive domain", "Conative domain", "Psychomotor domain"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A teacher's attitude, which affects teaching, is related to the affective domain. The affective domain is linked to a person's heart and emotional aspects - sympathy and feelings. It describes learning objectives that stress a feeling tone, an emotion or a degree of acceptance or rejection; it is one of Bloom's three domains and includes feelings and attitudes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0264", "ch": 2, "page": 40, "ansPage": 40, "srcNo": "264", "exam": "10/09/2020 S-II", "q": "'Education is the manifestation of perfection already in man' was stated by:", "o": ["Mahatma Gandhi", "R. N. Tagore", "Swami Vivekananda", "Sri Aurobindo"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "'Education is the manifestation of perfection already in man' was said by Swami Vivekananda. He believed that education is the expression of the perfection already existing in man; as religion describes divinity already in man, he defined education as the expression of perfection already existing.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0265", "ch": 2, "page": 40, "ansPage": 40, "srcNo": "265", "exam": "10/09/2020 S-II", "q": "LEAP stands for:", "o": ["Language Enhancement Academic Programme", "Leadership for Academicians Programme", "Learning and Educating Programme", "Leadership Education and Assessment Programme"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "LEAP stands for 'Leadership for Academicians Programme'. Its purpose is to meet the long-standing need to prepare future governance roles in educational institutions, such as senior positions like Dean and Head of Department.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0266", "ch": 2, "page": 40, "ansPage": 40, "srcNo": "266", "exam": "10/09/2020 S-II", "q": "Which of the following is the correct sequence of the different levels of teaching?", "o": ["Memory level - Understanding level - Reflective level", "Understanding level - Memory level - Reflective level", "Reflective level - Understanding level - Memory level", "Memory level - Reflective level - Understanding level"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teaching is considered one of the most rewarding professions. There are three levels of teaching: 1. Memory level - thoughtless teaching; 2. Understanding level - thoughtful teaching; 3. Reflective level - higher-order thoughtful level. At the memory level stress is on memory, not learning; at the understanding level teaching techniques are used so students connect with concepts; at the reflective level the teacher promotes thinking, logic and imagination so students solve problems through both memory and understanding levels.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-013", "first": false, "kind": "near", "of": "AOT-0149"}}, {"id": "AOT-0267", "ch": 2, "page": 40, "ansPage": 40, "srcNo": "267", "exam": "10/09/2020 S-II", "q": "The Atal Tinkering Lab under the Atal Innovation Mission has been introduced as a culture of innovation at the level of:", "o": ["Schools", "Colleges", "University", "Deemed university"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The Atal Tinkering Lab was introduced at the school level to promote a culture of innovation. The Atal Innovation Mission (AIM), established by NITI Aayog in 2016, is the Government of India's flagship initiative to promote a culture of innovation and entrepreneurship. An ATL is a state-of-the-art space in a school that aims to foster curiosity and innovation in young minds from Class 6 to 12, through tools such as Internet of Things and 3D printers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0268", "ch": 2, "page": 40, "ansPage": 40, "srcNo": "268", "exam": "10/09/2020 S-II", "q": "The book titled 'Pedagogy of Hope' was written by:", "o": ["Karl Marx", "Ivan Illich", "Paulo Freire", "John Dewey"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "'Pedagogy of Hope' was written by Paulo Freire. This 1992 book revisits his earlier work 'Pedagogy of the Oppressed' and expands his ideas. He argues that hope alone is not enough for liberation, but struggle without hope is impossible.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0269", "ch": 2, "page": 41, "ansPage": 41, "srcNo": "269", "exam": "10/09/2020 S-II", "q": "Who has emphasised the idea of 'Education through Productive Work'?", "o": ["Swami Vivekananda", "Rabindranath Tagore", "Mahatma Gandhi", "Maria Montessori"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Mahatma Gandhi emphasised 'education through productive work'. The Wardha Scheme of basic education is the dynamic aspect of Gandhi's educational philosophy; he stressed making productive crafts the medium of education for developing children's brain, body and soul, so that they can meet their future needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0270", "ch": 2, "page": 41, "ansPage": 41, "srcNo": "270", "exam": "10/09/2020 S-II", "q": "Samagra Shiksha Abhiyan 2018 is related with:", "o": ["School Education", "Higher Education", "Inclusive Education", "Vocational Education"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Samagra Shiksha Abhiyan (2018) is mainly related to school education: an overarching programme for the school education sector extending from pre-school to Class 12, with a broad goal of improving school effectiveness measured by equal opportunities and equal learning outcomes. It subsumed three schemes - Sarva Shiksha Abhiyan (SSA), Rashtriya Madhyamik Shiksha Abhiyan (RMSA) and Teacher Education (TE).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0271", "ch": 2, "page": 41, "ansPage": 41, "srcNo": "271", "exam": "10/09/2020 S-II", "q": "The lowest level of learning in the cognitive domain is:", "o": ["Knowledge", "Synthesis", "Analysis", "Comprehension"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Benjamin Bloom's taxonomy is a hierarchical arrangement of cognitive objectives; it classifies learning objectives into cognitive, affective and psychomotor domains. The cognitive domain comprises six categories that develop intellectual skill; the lowest level of cognitive attainment is 'knowledge'.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0272", "ch": 2, "page": 41, "ansPage": 41, "srcNo": "272", "exam": "10/09/2020 S-II", "q": "Which State has the highest gross enrolment ratio in India?", "o": ["Kerala", "Andhra Pradesh", "Uttar Pradesh", "Tamil Nadu"], "key": {"printed": [], "verified": [3], "official": null}, "e": "The printed explanation: GER (gross enrolment ratio) is a statistical measure used in the education sector; the Government of India releases the All India Survey on Higher Education (AISHE) report which gives GER. According to AISHE 2019-20, Sikkim (53.9) has the highest GER; Tamil Nadu holds first place with a GER of 49 while Bihar has the lowest GER of 13.6.", "tip": "", "status": "missing", "note": "Printed answer is '(*)' - no option letter was given. Among the listed options, the data in the printed explanation make Tamil Nadu (d) the highest; verified answer (d) is used as the key."}, {"id": "AOT-0273", "ch": 2, "page": 41, "ansPage": 41, "srcNo": "273", "exam": "10/09/2020 S-I", "q": "Which philosophy developed the monitorial system in classrooms?", "o": ["Buddhism", "Jainism", "Vedic philosophy", "None of these"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The printed explanation: the Islamic education system introduced the monitoring system in classrooms, where a higher-knowledge student was appointed to supervise the learning of other students in the teacher's absence. So option (d) is correct.", "tip": "", "status": "note", "note": "The monitorial system is generally credited to Bell and Lancaster; printed attribution to Islam is as per the source. Answer (d) 'None of these' is consistent with the listed options."}, {"id": "AOT-0274", "ch": 2, "page": 41, "ansPage": 41, "srcNo": "274", "exam": "10/09/2020 S-I", "q": "Classroom teaching should be ______.", "o": ["Child-centred", "Textbook-centred", "Teacher-centred", "Homework-centred"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Classroom teaching should be child-centred. Child-centred education keeps learners at the centre and gives priority to the child's experiences and needs; it firmly believes that when children are given freedom to do less than their pace, they develop the ability to assimilate concepts skilfully.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0275", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "275", "exam": "10/09/2020 S-II", "q": "Social development theory is of:", "o": ["William James", "Maria Montessori", "Vygotsky", "John Dewey"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Vygotsky's social development theory tries to explain how a child's development occurs: as abilities increase, children develop a sense of what they can and cannot do, which shapes the construction of behaviour and habits; children make their own behaviour by watching their peers.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0276", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "276", "exam": "10/09/2020 S-I", "q": "Which among the following thinkers accepted education as a process of human creation (man-making)?", "o": ["Mahatma Gandhi", "Tagore", "Aurobindo", "Vivekananda"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Vivekananda accepted education as a process of man-making. According to Swami Vivekananda, education is the manifestation of the perfection already in man; it helps release the power that the person already has - physical, intellectual and moral - received from the supreme power.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0277", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "277", "exam": "10/09/2020 S-I", "q": "What is the number of regional offices of the National Council for Teacher Education (NCTE)?", "o": ["4", "5", "6", "8"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The NCTE is an all-India statutory body with 4 regional committees: Northern Regional Committee, Eastern Regional Committee, Southern Regional Committee and Western Regional Committee, with various regional offices (Jaipur, Bhubaneswar, Bangalore, Bhopal) and head office in New Delhi. Its work covers all teacher education programmes - pre-school, diploma (D.El.Ed.), B.Ed., M.Ed., etc.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0278", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "278", "exam": "11/09/2020 S-I", "q": "'Demonstration effect' means:", "o": ["Effect of advertisement", "Imitating effect of consumption", "Effect of entertainment", "Effect of an experiment"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The demonstration effect means the effect of imitation of consumption: people's behaviour is influenced by observing the actions of others. For example, parents may do something to create a demonstration effect on their own parents' care, by which their children later look after them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0279", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "279", "exam": "11/09/2020 S-II", "q": "Child-centred pedagogy promotes:", "o": ["Exclusive reliance on textbooks", "Giving primacy to children's experiences", "Rote memorisation", "Labelling and categorisation of students based on ability"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Child-centred pedagogy refers to education that converts learning into the child's own experience: enabling children to express their ideas freely, giving priority to their voice and active participation, giving primacy to children's experiences, and planning the learning process after understanding children's psychology and interests.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0280", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "280", "exam": "14/09/2020 S-II", "q": "Which of the following reflects specialisation in the field of teaching?", "o": ["Knowledge of concepts", "Teaching skills", "Decision-making skills", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Specialisation in the field of teaching is reflected by knowledge of concepts, teaching skills and decision-making skills; hence all of the above.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0281", "ch": 2, "page": 42, "ansPage": 42, "srcNo": "281", "exam": "14/09/2020 S-II", "q": "'Operation Blackboard' was the result of:", "o": ["Kothari Commission", "National Curriculum Framework 2005", "National Education Policy 1986", "National Curriculum Framework 2000"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Operation Blackboard was the result of the National Education Policy 1986. In 1986 Rajiv Gandhi announced a new education policy, the NPE, to prepare India for the 21st century. NPE 1986 was made by the Government of India as a national system of education to provide quality education to all.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0282", "ch": 2, "page": 42, "ansPage": 43, "srcNo": "282", "exam": "14/09/2020 S-I", "q": "Which word is most appropriate for taking in new information?", "o": ["Assimilation", "Accommodation", "Cognition", "Reception"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Connecting prior knowledge with new knowledge is called assimilation. Assimilation is the most suitable way to take in new information: through it we take new information or experience and incorporate it into our existing ideas. It is somewhat subjective, since we modify experience or information to fit our pre-existing beliefs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0283", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "283", "exam": "14/09/2020 S-I", "q": "Intellectual skills are reflected by which domain of knowledge?", "o": ["Cognitive", "Affective", "Conative (active)", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the first category of the cognitive domain, 'knowledge', intellectual skills indicate how to follow procedures to complete things. Within the intellectual-skills category, learning has five different levels: discrimination, concrete concept, defined concept, rule and problem solving; so intellectual skills are reflected by the cognitive domain.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0284", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "284", "exam": "14/09/2020 S-I", "q": "We build integrated knowledge in our mind about objects, situations or events along with our existing beliefs. Which of the following terms reflects this?", "o": ["Schema", "Memory", "Cognition", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Piaget used 'schema' for 'a group of organised information stored in long-term memory'. A schema is a small packet of knowledge used to organise and store information; we build integrated knowledge about objects, situations or events in the mind along with our beliefs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0285", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "285", "exam": "14/09/2020 S-I", "q": "The classification of the cognitive domain was presented by:", "o": ["Bloom", "Skinner", "Krathwohl", "Simpson"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The classification of the cognitive domain was presented by Bloom. The cognitive domain includes development of knowledge and intellectual skills: recall or recognition of specific facts, procedural patterns and concepts that develop intellectual abilities. Bloom's original taxonomy has six levels: (1) knowledge (2) comprehension (3) application (4) analysis (5) synthesis (6) evaluation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0286", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "286", "exam": "14/09/2020 S-I", "q": "What is meant by socialisation in the context of education?", "o": ["Adaptation and adjustment in the social environment", "Always following social norms", "Making one's own social norms", "Respecting elders in society"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In the context of education, socialisation means adaptation and adjustment in the social environment. It is a general process by which children acquire the social and cultural values, beliefs and expectations expected of them from parents, teachers and others, and learn to change accordingly.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0287", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "287", "exam": "14/09/2020 S-I", "q": "The most important factor in an effective teaching process is:", "o": ["Adherence to time shown by teachers and students", "Teacher's command over the subject", "Teacher-student dialogue", "Completion of courses on time"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The most important factor in the effective teaching process is teacher-student dialogue. Other factors that determine effective teaching include attachment to the subject matter, showing a desire to present the subject matter, willingness to accept one's own mistakes, and being impartial and transparent.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-019", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0288", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "288", "exam": "15/09/2020 S-II", "q": "The purpose of education should be:", "o": ["Developing business skills in students", "Developing social awareness in students", "Preparing students for examination", "Preparing students for practical life"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The purpose of education should be to prepare students for practical life. All-round development of a person is possible through education; acquiring knowledge, earning a livelihood and building good character are also aims of education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0289", "ch": 2, "page": 43, "ansPage": 43, "srcNo": "289", "exam": "15/09/2020 S-II", "q": "Prior to teaching, the teacher:", "o": ["Identifies the objectives", "Prepares the teaching lesson plan", "Knows the interest of students", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Before teaching, the teacher wants to identify objectives, prepare the lesson plan and know students' interests. A teacher helps students to better understand subjects, which is possible only when activities are planned. Teaching does not begin with classroom teaching but with preparing for it: before entering the class, the teacher prepares a lesson plan, identifies the aims and plans teaching according to students' interests and needs.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0290", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "290", "exam": "15/09/2020 S-II", "q": "The outcomes of action research are utilised for:", "o": ["Policy planning", "Programme evaluation", "Improving the whole system", "Improving one's own practices"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "'Action research' means research conducted by the persons directly concerned with the problems being studied, not by outside researchers and specialists. Its main aim is to improve educational practice and bring improvement in working methods; its outcomes are used for improving one's own practices.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0291", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "291", "exam": "15/09/2020 S-III", "q": "Desirable attitudes can be developed most effectively through:", "o": ["Meaningful participation in worthwhile activities influencing attitudes", "Experience with the object of attitude", "Identification with proper heroes", "Emphasis upon social and moral concepts"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Desirable attitudes can be developed most effectively through meaningful participation in worthwhile activities that promote attitude. When a person takes part in an activity promoting a desirable attitude, he learns about it, experiences it and feels attached; positive feelings towards it develop and he is more likely to adopt it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0292", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "292", "exam": "15/09/2020 S-I", "q": "Good teaching is helped by its being imparted in:", "o": ["English", "Hindi", "Mother tongue", "All of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The mother tongue helps good teaching. The new National Education Policy mentions the teaching-learning process in the mother tongue, starting with it at the primary stage of education; for a child's personal growth, the mother tongue provides a natural environment for learning at the primary level.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0293", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "293", "exam": "15/09/2020 S-I", "q": "Who is the first teacher of a child?", "o": ["Environment", "Teacher", "Parents", "His own consciousness"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Parents are the child's first teachers because after birth a child first comes into contact with parents. Young children depend on their parents and family, which is the family that acts as the first teacher; in fact, the mother is considered the first teacher.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0294", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "294", "exam": "16/09/2020 S-I", "q": "Educational guidance is required:", "o": ["In selection of curriculum", "In maintaining achievement test levels", "To check indiscipline", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the process of educational guidance, a child's education is arranged keeping in mind his abilities, interests and aptitudes, so the curriculum does not feel like a burden. Children study with interest, which solves the problem of discipline to some extent. Thus all of the above options show the need for educational guidance.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0295", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "295", "exam": "18/09/2020 S-II", "q": "Which one of the following is a key behaviour in effective teaching?", "o": ["Using student ideas and contribution", "Structuring", "Questioning", "Instructional variety"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Instructional variety is a key behaviour in effective teaching. When students are exposed to various instructional strategies, it broadens the scope of their learning, giving them many ways to absorb new information and learn.", "tip": "", "status": "disputed", "note": "Same question is printed as Q131 with printed answer (a) 'Using students' ideas and contributions'. Conflicting printed keys; each retained as printed. Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-011", "first": false, "kind": "near", "of": "AOT-0131", "keyConflict": true}}, {"id": "AOT-0296", "ch": 2, "page": 44, "ansPage": 44, "srcNo": "296", "exam": "18/09/2020 S-II", "q": "Attitude, values and interests are reflected by which learning domain?", "o": ["Cognitive", "Affective", "Psychomotor", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The affective domain relates to students' attitudes, interests, values and appreciation. Teachers can increase effectiveness by considering this domain in planning curricula, lecturing and giving activities, and in assessing students' learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0297", "ch": 2, "page": 45, "ansPage": 45, "srcNo": "297", "exam": "18/09/2020 S-II", "q": "At the highest level of the hierarchy is:", "o": ["Understanding", "Application", "Evaluation", "Analysis"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Bloom identified six levels within the cognitive domain, from simple recall or recognition of facts at the lowest level through increasingly complex and abstract mental levels to the highest order, classified as evaluation.", "tip": "", "status": "note", "note": "Valid for the original (1956) taxonomy; in the revised (2001) taxonomy 'Creating' is the top level.", "dup": {"group": "DUP-020", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0298", "ch": 2, "page": 45, "ansPage": 45, "srcNo": "298", "exam": "26/02/2020 S-II", "q": "In the Constitution of India, the Right to Free and Compulsory Elementary Education is included in the section on:", "o": ["Human Rights", "Fundamental Rights of citizens", "Directive Principles of State Policy", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The Indian Constitution describes Fundamental Rights in Part III, Articles 12 to 35. Article 21A in Part III relates to the right to education, stating that the State shall provide free and compulsory education to all children of the age of 6 to 14 years.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0299", "ch": 2, "page": 45, "ansPage": 45, "srcNo": "299", "exam": "26/02/2020 S-I", "q": "Learning depends on which of the following?", "o": ["Intelligence", "Parental attitude", "Peer attitude", "None of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning mostly refers to modification of behaviour, as it modifies a person's behaviour and personality. Intelligence is the ability to gain and apply knowledge, solve problems, learn from experience and deal with new situations; the sense organs and intelligence contribute to the learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0300", "ch": 2, "page": 45, "ansPage": 45, "srcNo": "300", "exam": "26/02/2020 S-I", "q": "The traditional knowledge should be used through which of the following media?", "o": ["Modern technology", "Improvement in national circumstances", "Synergy between government and local interventions", "Its dissemination"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Traditional knowledge is the awareness, experience, knowledge and application within a field or community, transferred from generation to generation. It should be used through coordination between government and local interventions; when these agencies work in partnership, the impact can be considerably increased.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0301", "ch": 2, "page": 45, "ansPage": 45, "srcNo": "301", "exam": "26/02/2020 S-I", "q": "The interaction between a teacher and student creates a zone of proximal ______.", "o": ["Confusion", "Difference", "Distortion", "Development"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The interaction between teacher and students creates the 'zone of proximal development', a concept from Vygotsky's socio-cultural theory. It is an important concept in understanding development in the field of educational psychology and is especially relevant to teachers who design activities to support learning, promoting cognitive development.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0302", "ch": 2, "page": 45, "ansPage": 45, "srcNo": "302", "exam": "26/02/2020 S-I", "q": "Effective teaching, by and large, is a function of:", "o": ["Teacher's scholarship", "Teacher's honesty", "Teacher's ability to make students learn", "Teacher's favourable attitude towards teaching"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Effective teaching is mainly a function of the teacher's positive attitude towards teaching: a teacher's favourable attitude to teaching is the overall measure of effective teaching, because the process of effective teaching and learning depends on the teacher's perspective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0303", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "303", "exam": "26/02/2020 S-I", "q": "The development of feelings of appreciation and attitude comes under the domain of:", "o": ["Cognitive development", "Affective development", "Psycho-motor development", "All of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The development of appreciation and attitude comes under the 'affective development' domain. Bloom's taxonomy of learning domains covers three types: cognitive, affective and psychomotor. The affective dimension covers how we deal with things emotionally, such as feelings, values, appreciation, enthusiasm, motivation and attitudes.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0304", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "304", "exam": "28/01/2020 S-II", "q": "Which of the following functions is not related to the school as an agency of education?", "o": ["Preserving knowledge, values, customs, etc.", "Giving definite solutions to religious problems", "Suggesting ways and means for social development", "Socialising children for performing their future role"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Giving definite solutions to religious problems is not related to school as an agency of education. Under Article 28 no religious education can be given in any educational institution wholly maintained out of State funds (India), whereas preservation of knowledge, values and customs, guidance for social development and socialisation for future roles are related to school as a means of education.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-021", "first": true, "kind": "near", "of": null}}, {"id": "AOT-0305", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "305", "exam": "28/01/2020 S-II", "q": "Psychoanalysis was done by:", "o": ["Alfred Adler", "Carl Jung", "Einstein", "Sigmund Freud"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Psychoanalysis was done by Sigmund Freud. The psychoanalytic approach focuses on how the unconscious mind is controlled in ways that are conscious to the psychologist; Freud held that people can be cured by bringing unconscious and conscious thought into insight.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0306", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "306", "exam": "28/01/2020 S-II", "q": "______ advocated the Human Relations approach in education.", "o": ["Elton Mayo", "Henri Fayol", "Taylor", "Davis"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Elton Mayo advocated human relations in education. He is widely known as the father of the human relations theory, who understood the role of motivation in production and highlighted the importance of communication between workers and management.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0307", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "307", "exam": "28/01/2020 S-II", "q": "The mid-day meal programme is initiated with the main view to:", "o": ["Increase enrolment", "Involve community participation", "Engage teachers", "Solve unemployment"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main objective of the mid-day meal scheme is to increase enrolment of children. It was started on 15 August 1995 as a centrally sponsored scheme in 2408 blocks of the country; by 1997-98 it was started in all blocks.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0308", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "308", "exam": "28/01/2020 S-I", "q": "The ultimate goal of education in Jainism is:", "o": ["Charity", "Pity and renunciation", "Liberation", "Non-violence"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Jainism the ultimate goal of education is liberation (moksha), regarded as the supreme goal. It means freedom from the cycle of birth and death; the aim of Jain education is to lead the person to this goal.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0309", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "309", "exam": "28/01/2020 S-I", "q": "The first Open University in India was established in the year:", "o": ["1966", "1985", "1986", "1982"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The first Open University in India was established in 1982 as Dr. B. R. Ambedkar Open University (BRAOU) in Hyderabad, Andhra Pradesh; it was named after Dr. B. R. Ambedkar.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0310", "ch": 2, "page": 46, "ansPage": 46, "srcNo": "310", "exam": "28/01/2020 S-I", "q": "Continuous and Comprehensive Evaluation in school education was started by:", "o": ["IGNOU", "CBSE", "MHRD, Government of India", "NCERT"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "As printed: NCERT implemented the continuous and comprehensive evaluation process in school education; NCERT issued a guideline in 2009 giving directions for the CCE process, and CBSE implemented the continuous and comprehensive evaluation process in Class 9.", "tip": "", "status": "note", "note": "CCE is commonly credited to CBSE (introduced 2009-10); printed answer (d) NCERT retained as key, flagged for review."}, {"id": "AOT-0311", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "311", "exam": "28/01/2020 S-I", "q": "The RTE Act was implemented in India with effect from:", "o": ["1 April 2010", "1 April 2019", "1 April 2009", "1 April 2008"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The Right to Education Act was implemented in India on 1 April 2010. The Right of Children to Free and Compulsory Education Act, 2009 (RTE) is a federal law of India that gives the legal framework for free and compulsory education for children aged 6 to 14 years under Article 21(A) of the Constitution.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0312", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "312", "exam": "28/01/2020 S-I", "q": "The policy recommended by the Kothari Commission relating to language is:", "o": ["Standard language formula", "Two-language formula", "Three-language formula", "Re-interpretation of national language and official language"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The Kothari Commission (1964-66) recommended the three-language formula in relation to language: a mother tongue or regional language; the official language of the Centre or associate official language; and a modern Indian or foreign language. It was accepted in the National Education Policy 1968.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0313", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "313", "exam": "28/01/2020 S-I", "q": "Which of the following philosophies claimed that 'Vasna' and 'Trishna' lie at the root of human suffering?", "o": ["Vedanta", "Jainism", "Buddhism", "Samkhya"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "According to Buddhism, desire (vasna) and craving (trishna) are the root cause of human suffering as they give birth to sorrow. Buddhism prescribed a path for removing sorrow, the Eightfold Path, which includes giving up desire and craving and attaining nirvana.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0314", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "314", "exam": "28/01/2020 S-I", "q": "Who among the following is an existentialist thinker?", "o": ["Kilpatrick", "Rousseau", "Sartre", "Froebel"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Sartre was a famous existentialist philosopher. He expressed his thought as 'existence comes before essence', meaning man first exists, then defines his own meaning and value.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0315", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "315", "exam": "28/01/2020 S-I", "q": "Psychology's major contribution to education lies in:", "o": ["Catering to the needs of the knowledge society", "Preserving social customs", "Identifying successful methods for teaching", "Providing a scientific foundation for the art of teaching"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The main contribution of psychology to education is providing a scientific base for the art of teaching. Psychology gives knowledge about students' mental development, the process of learning and learning style, which helps teachers teach more effectively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0316", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "316", "exam": "28/01/2020 S-I", "q": "Under the constructivist approach to language learning, learners are encouraged to:", "o": ["Discover the rules of grammar from examples", "Avoid errors completely", "Learn the grammar rules by rote", "Write creatively"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "From the viewpoint of constructivist language learning, teachers encourage learners to engage actively with the language by interacting with real examples and contexts. This helps them understand natural usage and grammar rules.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0317", "ch": 2, "page": 47, "ansPage": 47, "srcNo": "317", "exam": "28/01/2020 S-I", "q": "Which statement is NOT correct in the context of language teaching?", "o": ["A print-rich environment helps in acquiring language", "In language teaching, there is more emphasis on correctness of spelling", "There is a difference between language acquisition and language learning", "Teaching of other subjects is helpful in language learning"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The statement that language teaching puts more emphasis on correctness of spelling alone is not correct. Besides spelling, emphasis is placed on other aspects such as grammar, sentence formation, vocabulary and language skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0318", "ch": 2, "page": 48, "ansPage": 48, "srcNo": "318", "exam": "28/01/2020 S-I", "q": "Which is the least important factor in teaching?", "o": ["Giving homework to children", "Punishing the students", "Teaching as a facilitator", "Lecturing in an impressive way"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The least important factor in teaching is punishing students. The aim of teaching is to motivate students to learn, not to scare them; punishment can discourage learning because it scares students and may drive them away from the learning process.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0319", "ch": 3, "page": 48, "ansPage": 48, "srcNo": "319", "exam": "09/06/2024 S-I", "q": "In which method do students move from the known to the unknown?", "o": ["Inductive method", "Analytic method", "Synthetic method", "Deductive method"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The method that takes students from the known to the unknown is called the inductive method. It begins with specific examples, facts or observations and then arrives at general rules, principles or conclusions; it promotes active exploration.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0320", "ch": 3, "page": 48, "ansPage": 48, "srcNo": "320", "exam": "18/05/2024 S-I", "q": "Consider the following:\nI. Generalisation\nII. Observation\nIII. Verification\nIV. Example\nArrange the above steps in order according to the inductive method.", "o": ["I, II, IV, III", "IV, II, I, III", "II, III, IV, I", "III, IV, II, I"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "According to the inductive method, the order of steps is: 1. Example (IV), 2. Observation (II), 3. Generalisation (I), 4. Verification (III). The inductive method is a process in which a general principle or rule is reached from specific cases or examples.", "tip": "Inductive steps: Examples - Observation - Generalisation - Verification.", "status": "ok", "note": ""}, {"id": "AOT-0321", "ch": 3, "page": 48, "ansPage": 48, "srcNo": "321", "exam": "18/05/2024 S-I", "q": "Except one, the following are methods of teaching EVS:", "o": ["Cooperative learning", "Guided inquiry", "Explaining through lecture", "Problem solving"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Explaining through lecture is not considered a suitable method for teaching EVS because EVS is an active, experience-based subject. In it, methods like cooperative learning, guided inquiry and problem solving are used to ensure students' participation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0322", "ch": 3, "page": 48, "ansPage": 48, "srcNo": "322", "exam": "18/05/2024 S-I", "q": "A symposium is a type of:", "o": ["Discovery method", "Discussion method", "Lecture method", "Demonstration method"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A symposium is a teaching method in which experts present their views on a particular topic and learn from the audience. It is based on deliberation and debate, so it is considered a type of discussion method.", "tip": "", "status": "disputed", "note": "Repeated elsewhere in the PDF with a different printed answer.", "dup": {"group": "DUP-022", "first": true, "kind": "exact", "of": null, "keyConflict": true}}, {"id": "AOT-0323", "ch": 3, "page": 48, "ansPage": 48, "srcNo": "323", "exam": "24/05/2024 S-I", "q": "To make children aware of different types of fuels, a teacher can:", "o": ["Show some samples of fuels in the class", "Discuss with children, through a short film, the different types of fuel that can be used for cooking", "Show pictures of fuels on a chart", "Ask children to make a list of different fuels"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "To make children aware of different fuels, the teacher should show a short film and discuss it. This method helps children understand the types of fuel and their importance in an interesting way. Visual learning from the film and the discussion deepen understanding, making knowledge more lasting.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0324", "ch": 3, "page": 48, "ansPage": 48, "srcNo": "324", "exam": "24/05/2024 S-I", "q": "Which of the following is a sign of motivated teaching?", "o": ["Maximum attendance of students in class", "Students asking questions", "Dullness in the class", "Completion of homework"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When students ask questions actively, it shows that they are taking interest in the lesson, are curious and trying to understand. This is a sign of the teacher's effective teaching and the students' inner motivation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0325", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "325", "exam": "24/05/2024 S-I", "q": "Which teaching method should be used to create interest in the subject of Environmental Studies in lower classes?", "o": ["Inductive", "Entertainment and play-related (recreational and play method)", "Rote learning", "Deductive"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The most suitable teaching method for creating interest in EVS in lower classes is the entertainment and play-based method. Children learn best through play; recreational activities (such as nature walks, caring for plants, environment-related games) give them joyful knowledge and develop curiosity and interest naturally.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0326", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "326", "exam": "24/05/2024 S-I", "q": "The teaching process associated with clarifying or explaining a major idea to students is called:", "o": ["Demonstration method", "Lecture method", "Story-telling method", "Problem-solving method"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "When a teacher presents information in a logical and organised manner to clarify a major idea, principle or concept, it is called the lecture method. It is a teacher-centred technique that emphasises explaining facts, principles or rules.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0327", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "327", "exam": "22/05/2024 S-I", "q": "Which of the following is a shortcoming of the role-play method?", "o": ["Unless it is well planned, well organised and supervised, concentration may decline.", "It is a dull method.", "It reduces the learning process.", "It is not a time-consuming method."], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main shortcoming of role play is that if it is not planned, organised and properly monitored, students may be distracted. The other options are wrong: role play is neither dull, nor does it reduce learning, nor is it a short-time method.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0328", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "328", "exam": "22/05/2024 S-I", "q": "Armstrong was the proponent of:", "o": ["Problem-solving method", "Project method", "Discussion method", "Heuristic method"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Armstrong was the proponent of the heuristic method, in which students themselves learn through discovery, investigation and experiment. H. E. Armstrong made this method popular in science teaching; it encourages students to think independently and find solutions to problems.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0329", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "329", "exam": "23/05/2024 S-II", "q": "By which method do students move from the unknown to the known?", "o": ["Analysis", "Induction", "Synthesis", "Deduction"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the inductive method students move from the unknown to the known: it starts with specific examples and arrives at general rules or principles. (Printed answer (b); the printed question wording is 'unknown to known'.)", "tip": "", "status": "note", "note": "Wording differs from Q319 ('known to unknown') but same answer (inductive); retained as printed."}, {"id": "AOT-0330", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "330", "exam": "23/05/2024 S-II", "q": "After studying about rich flora and fauna in India, primary class students were taken by the school to Ranthambore National Park. This will help the students in:", "o": ["Developing respect for nature", "Relating the knowledge learnt in class to real-life situations", "Developing skills", "Having fun and enjoying an outdoor trip with friends"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Taking students to Ranthambore National Park will mainly help them relate class knowledge to real-life situations: they can see the species they have read about in real life and observe them, connecting the information learnt in class with real-life experiences and deepening understanding.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0331", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "331", "exam": "23/05/2024 S-II", "q": "Activity includes:", "o": ["Physical activity", "Social activity", "Mental activity", "Physical, social and mental activity"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Activity is a comprehensive concept that can include three types of actions: physical (playing, walking, exercise), social (working in a group, interaction, conversation) and mental (thinking, planning, problem solving).", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0332", "ch": 3, "page": 49, "ansPage": 49, "srcNo": "332", "exam": "21/05/2024 S-I", "q": "The problem-solving method is:", "o": ["A teacher-controlled direction", "A technique used in technical schools and training colleges", "It trains the mind of students by facing real problems and giving them the opportunity and freedom to solve them", "Used for teaching lower classes"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The problem-solving method gives students the opportunity and freedom to face real problems and solve them, training their minds. It acquaints students with real life through problems and gives them the chance to find solutions independently, developing their thinking and problem-solving abilities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0333", "ch": 3, "page": 49, "ansPage": 50, "srcNo": "333", "exam": "21/05/2024 S-I", "q": "Which of the following is NOT a merit of the problem-solving method in environmental education?", "o": ["Goal-oriented method", "Creative method", "Selectivity method", "Rehearsal must"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Rehearsal is not a merit of the problem-solving method. Rehearsal generally relates to practice or repetition and is not suitable in this context. Environmental education's problem-solving method has qualities such as goal-orientation, creativity and selectivity; it encourages students to think actively, identify problems and choose alternatives for solutions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0334", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "334", "exam": "21/05/2024 S-I", "q": "What is NOT the purpose of drama/role play?", "o": ["Entertainment and joy", "Development of social skills", "Development of conversation skills", "Rehearsal must"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The purpose of drama/role play is not to make rehearsal compulsory. Its main aims are entertainment and development of social skills and conversation skills. Although rehearsal (practice) may be an important process, it is not part of the purpose but part of the preparation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0335", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "335", "exam": "25/05/2024 S-I", "q": "Which of the following options best describes progressive education?", "o": ["Learning by doing, project method, learning with cooperation", "Thematic units, regular unit tests, ranking", "Individual admission, forming ability groups, labelling of students", "Project method, forming ability groups, ranking"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning by doing, project method and learning with cooperation best describe progressive education. Progressive education is a child-centred approach that stresses learning through experience, problem-solving and critical thinking.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0336", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "336", "exam": "25/05/2024 S-I", "q": "The one with the largest scope (circle) is:", "o": ["Teaching aid", "Teaching technique", "Teaching strategy", "Teaching method"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teaching strategy has a very large scope. It is a broad plan or approach that includes the choice and coordination of various methods, techniques and tools to achieve teaching objectives; it is a comprehensive plan to achieve larger objectives.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0337", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "337", "exam": "25/05/2024 S-I", "q": "Educationists who emphasise learning by doing are said to follow the principle of:", "o": ["Activity", "Motivation", "Interest", "Planning"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The principle of activity holds that children learn best when they take part in activities themselves. It is based on 'learning by doing', popularised by the educationist John Dewey, which makes learning practical, interesting and effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0338", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "338", "exam": "19/05/2024 S-II; 09/06/2024 S-II", "q": "Various experiments are used in teaching because:", "o": ["Teaching becomes easy", "Students pay attention in class", "Teaching becomes interesting", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Teaching is a practice carried out by a teacher whose purpose is to transmit skill to a learner. Experiments are used in teaching because teaching becomes easy, students pay attention in class, and teaching stops being boring.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0339", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "339", "exam": "09/06/2024 S-II", "q": "In the lecture method:", "o": ["The teacher is receptive", "The teacher makes elaborate arrangements for demonstration or experiments", "Students are more active and the teacher is passive", "The teacher is more active and students are passive"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the lecture method the teacher is more active and mainly a source of information; the teacher presents and explains the subject matter before students, while students are passive listeners. The teacher controls the flow of information, and students do not engage in discussion or question-asking directly.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0340", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "340", "exam": "09/06/2024 S-II", "q": "Consider the following statements:\n(i) A good method should give children scope for creative expression.\n(ii) A good method should arouse wide interests in the minds of students.\n(iii) A good method should emphasise verbal expression and rote retention instead of learning.\nWhich of the above are characteristics of teaching methods?", "o": ["Only (i)", "(i) and (ii) both", "Only (iii)", "All"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Statements (i) and (ii) are characteristics of teaching methods. A good method should give children enough space and opportunity to express their feelings, ideas and experiences through art, music, writing or other creative media, which helps creativity, imagination and personality development; it should arouse wide interests. Statement (iii) is wrong.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0341", "ch": 3, "page": 50, "ansPage": 50, "srcNo": "341", "exam": "09/06/2024 S-II", "q": "Identify which is NOT a characteristic of learners that helps make the teaching system effective.", "o": ["Learner's prior experience", "Learner's eating habits and hobbies", "Learner's ability to learn", "Learner's stage of development"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The learner's eating habits and hobbies are a characteristic that does not help make the teaching system effective, whereas the learner's prior experience, ability to learn and stage of development help make it effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-0342", "ch": 3, "page": 51, "ansPage": 51, "srcNo": "342", "exam": "27/05/2024 S-I", "q": "For teaching children with individual differences, there should be schools where teachers:", "o": ["Can teach in various sections of classes classified on the basis of individual differences", "Are trained to us
