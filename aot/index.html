2, "page": 157, "ansPage": 157, "srcNo": "1147", "exam": "18/05/2024 S-I", "q": "The use of audio-visual material in EVS helps in getting the desired learning experiences. The main hurdle in using them for EVS learning is:", "o": ["Lack of training facilities for teachers", "The cost of audio-visual materials", "Power failure", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The use of audio-visual material in EVS is effective in helping teaching, but many obstacles come in its use: lack of training facilities for teachers, high cost of visual and audio-visual materials, and power failure are the major ones. Together they hinder its effective use.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1147", "ch": 12, "page": 157, "ansPage": 157, "srcNo": "1148", "exam": "18/05/2024 S-I", "q": "Audio-visual material helps in achieving ______.", "o": ["Success", "Publicity", "Objectives of education", "Money"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Audio-visual material helps in achieving the objectives of teaching. It helps students achieve success, because it makes concepts clearer and more attractive.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1148", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1149", "exam": "18/05/2024 S-I", "q": "Which of the following is NOT a technique of teaching?", "o": ["Drilling technique", "Painting", "Dramatisation", "Balwadi"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Balwadi is not a teaching technique; it is an educational institution that especially provides preliminary education to small children. The drilling technique strengthens skill or knowledge by repeated practice; painting and dramatisation are teaching techniques representing different types of education and teaching methods.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-063", "first": true, "kind": "near", "of": null}}, {"id": "AOT-1149", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1150", "exam": "24/05/2024 S-I", "q": "The effectiveness of an audio-visual presentation may fail if the material is handled wrongly. Therefore:", "o": ["The aid should be interesting and motivating, besides having specific value", "They should be true and accurate", "Proper care should be taken to do such events", "They should be according to the age level of students"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The presentation of audio-visual material is effective only when it is presented in the right way. If the material is presented in the wrong way, its effect may fail; so proper care and planning are required to show such events so that the objective is achieved.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1150", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1151", "exam": "24/05/2024 S-I", "q": "Using teaching aids in the classroom:", "o": ["Distracts students", "Troubles teacher and students", "Makes learning more interesting", "Cannot improve the performance of students"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The use of teaching aids in the classroom makes learning interesting and effective, with items such as pictures, videos, models and the subject-related material. When the material is interesting and varied, students pay more attention and their curiosity increases.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1151", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1152", "exam": "22/05/2024 S-I", "q": "Educational radio is:", "o": ["A device", "An audio-visual device", "Print media", "Non-print media"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Educational radio is non-print media, because it is broadcast in audio form which is only audible, not readable. Print media (books/newspapers) are readable media through which teaching material is understood by reading.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1152", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1153", "exam": "22/05/2024 S-I", "q": "Audio-visual material provides reinforcement to:", "o": ["Learners", "Teachers", "Parents", "School"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Audio-visual material (such as video, animation) provides reinforcement to learners, because it simplifies concepts which are complex through the visual-audio medium. Students understand better by seeing and hearing it again and again, which strengthens their understanding.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1153", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1154", "exam": "23/05/2024 S-II", "q": "The principle of action demands from teachers to guide their students in the process of:", "o": ["Adjustment", "Responding appropriately in audio-visual related experience situations", "Facing challenges in higher classes", "Getting employment in the future"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The principle of action states that a teacher should give students useful experiences and situations for guidance in the learning process. Responding properly through audio-visual material is necessary, so that students can participate actively and make the learning process effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1154", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1155", "exam": "23/05/2024 S-II", "q": "To get better results with audio-visual teaching aid material, a teacher should keep in mind:", "o": ["The principle of proper presentation", "The principle of action", "The principle of evaluation", "Guiding principles for the selection of these aids"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "While using audio-visual teaching aids, the teacher should keep in mind the principle of proper presentation. This principle ensures that the material is presented in a clear, interesting and suitable way according to the understanding of students, so that teaching is effective and fruitful.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1155", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1156", "exam": "21/05/2024 S-I", "q": "A chalk board is a type of teaching aid:", "o": ["Audio-visual", "Visual", "Projected", "Audio"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A chalkboard is a visual teaching aid, because the teacher presents information through pictures, writing or diagrams on it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1156", "ch": 12, "page": 158, "ansPage": 158, "srcNo": "1157", "exam": "21/05/2024 S-I", "q": "As an EVS teacher, if you decide to teach the topic of soil, which type of teaching aid will be the most helpful in teaching the subject?", "o": ["Samples of different soils", "Video on different types of soil", "A visit to a farmhouse", "A chart filled with pictures of various soils"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "As an EVS teacher, samples of different soils will prove to be the most helpful teaching aid for teaching the topic of soil, because students get the opportunity to experience the types of soil (sandy, clayey, loamy) directly by touching, seeing and smelling. This helps them understand the concept more deeply.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1157", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1158", "exam": "25/05/2024 S-I", "q": "A teacher asks every child to use some waste material from their homes and make something useful out of it. The teacher's educational intention is NOT:", "o": ["To organise an exhibition of the best objects made from waste", "To select the best student of the class", "To develop creativity in children", "To make children understand the concept of recycling, reuse and reduction"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The main educational purpose of this activity is to develop creativity, environmental awareness and an understanding of reusing materials, not to select the best student of the class. It may promote competition, but such activities focus more on creativity and learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1158", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1159", "exam": "25/05/2024 S-I", "q": "What kind of classroom can a teacher suggest using a video, where students learn at home using ICT?", "o": ["Left out", "Separated", "Formal", "Flipped classroom"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the flipped classroom model, teaching material is made available beforehand using resources like teaching videos, which students can watch at home at their convenience. In the classroom, time is devoted to discussions, projects, problem-solving and individual activities. The teacher can give more individual attention and guidance and students can take an active part in learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1159", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1160", "exam": "25/05/2024 S-I", "q": "Nalini wants to introduce 'Animals - Our Friends' to Class III students. Which teaching strategy would be best to present the subject in a more interesting way?", "o": ["Asking the students to see the pictures of animals given in the textbook", "Using a chart showing pictures of different animals", "Drawing pictures of different animals on the blackboard", "Showing a video film on animals and their usefulness"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Showing a video film on animals and their usefulness is the best strategy for presenting 'Animals - Our Friends' interestingly and effectively to Class III students. A video helps children see animals in their natural habitat, understand their activities and know about their usefulness through real examples; it gives both visual and audio aid, which makes learning more attractive and memorable.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1160", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1161", "exam": "25/05/2024 S-I", "q": "Which one is NOT true about projects?", "o": ["It is a purposeful activity", "It promotes a social environment", "It occurs in real life", "It is teacher-centred"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Projects are basically student-centred activities, not teacher-centred. Students get the opportunity to plan, research and work themselves, while the teacher plays the role of a facilitator or guide.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1161", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1162", "exam": "19/05/2024 S-I", "q": "Which of these is an example of audio material?", "o": ["Linguaphone", "Map", "Episcope", "Flash cards"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The linguaphone is an example of audio material, helping language learning through audio. It is useful for learning through listening.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1162", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1163", "exam": "19/05/2024 S-I", "q": "In a child-friendly classroom:", "o": ["The material should be of a suitable size so that children can reach it", "There should be sufficient cheap material, since children tend to destroy things", "Furniture and materials should be large because they grow very fast", "The material should be fairly expensive so that children are exposed to expensive material"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In a child-friendly classroom, the material should be according to the height and reach of the child so that they can learn independently. The environment should be safe and comfortable so that children participate actively. The teacher's behaviour should be cooperative, encouraging and sensitive so that children can learn freely.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1163", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1164", "exam": "19/05/2024 S-I", "q": "Which of the following is an example of the permissive style of strategy?", "o": ["Lecture", "Tutorial", "Group discussion", "All of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The permissive style is the opposite of authoritarian teachers: both student participation and control over the class are low in authoritarian styles. Group discussion is an example of the permissive style, as the teacher encourages open discussion among students in the class, where students can express their ideas and facts and argue with one another.", "tip": "", "status": "note", "note": "Printed explanation says 'permissive style' but describes it as the opposite of authoritarian ('anumodak shaili'); retained as printed."}, {"id": "AOT-1164", "ch": 12, "page": 159, "ansPage": 159, "srcNo": "1165", "exam": "09/06/2024 S-II", "q": "Which of these aids is the simplest to use and not expensive?", "o": ["Transparencies", "Television", "Cassette", "Compact disc"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A transparency is the simplest teaching aid and is not costly. Transparencies are transparent plastic sheets which can be passed through a copier or printer; one can write on them with a pen or marker, draw pictures or paste a printout. They can be shown on a large screen by placing them on an overhead projector.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1165", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1166", "exam": "27/05/2024 S-I", "q": "Audio-visual material is related to:", "o": ["Hearing and vision", "Feeling", "Pain", "Taste"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Audio-visual material is that which joins the elements of audio (hearing) and visual (seeing). It uses both the eyes and ears. It helps make learning more effective and interesting.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1166", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1167", "exam": "27/05/2024 S-I", "q": "Teaching aid material is classified under these categories:", "o": ["Radio, TV and camera", "Audio, visual and audio-visual", "Four boards and bulletin boards", "Maps and charts"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teaching aid material is classified mainly into three broad categories on the basis of the sense experience they provide: audio material, visual material and audio-visual material (such as television, films, videos). These show the broadest and most scientific classification of teaching aids.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1167", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1168", "exam": "27/05/2024 S-I", "q": "In a child-friendly classroom it should be that:", "o": ["The materials should be of a suitable size so that children can reach them", "There should be sufficient cheap material, since children tend to destroy things", "Furniture and materials should be large because they grow very fast", "There should be sufficient expensive material so that children are exposed to expensive material"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "In a child-friendly classroom the materials should be of a size within the reach and suitable for the child, which encourages their exploration and self-reliance, making the learning process more effective. Same as Q1163.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1168", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1169", "exam": "27/05/2024 S-I", "q": "Students themselves ______ search/discover information.", "o": ["Lecture method", "Inquiry (discovery) method", "Both", "None of these"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "In the inquiry (discovery) method students themselves discover information actively, creatively and logically. This is a characteristic of the inquiry method. To acquire knowledge, they use various sources such as books, articles and the internet, and analyse data, interpret it and draw conclusions.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1169", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1170", "exam": "27/05/2024 S-I", "q": "The willingness to participate in a particular event is:", "o": ["Receiving", "Responding", "Valuing", "Organising"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The desire to take part in an event is 'attending/receiving', the lowest level of the affective domain: the willingness to be present and receive a particular event or stimulus.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1170", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1171", "exam": "26/05/2024 S-II", "q": "Audio-visual aid material is useful in teaching:\n(i) It helps in learning and understanding on a permanent basis.\n(ii) Students remain more active and learn the lesson easily.\n(iii) The lesson becomes interesting.\n(iv) It reduces the level of students' understanding.\nWhich of the above statements is/are correct?", "o": ["(i) and (iv)", "(ii) and (v)", "(i), (ii) and (iii)", "All of these"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Audio-visual are those instruments which are used in education and communication, containing both sound and visual elements: video, films, slide shows, audio recordings or multimedia presentations. They help students learn and understand permanently; students become active participants and the lesson becomes attractive and interesting. Statement (iv) is wrong.", "tip": "", "status": "note", "note": "Option (b) as printed refers to '(v)', a statement that does not exist; answer unaffected."}, {"id": "AOT-1171", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1172", "exam": "26/05/2024 S-II", "q": "Audio-visual material should be used:", "o": ["When the teacher is absent", "When the object is not available", "During examinations", "During evaluation"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Audio-visual material should be used when the object is not available or when it is not possible to bring real objects into the classroom. Audio-visual material can help students understand complex concepts and make them interesting and attractive.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1172", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1173", "exam": "19/06/2024", "q": "Which of the following is an example of an audio aid?", "o": ["Linguaphone", "Maps", "Episcope", "Flash cards"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The linguaphone is an example of an audio aid (audio teaching aid). It is an instrument for learning language that uses audio recordings to improve pronunciation and listening skills. It was introduced in 1901 by the Polish translator and language teacher Jacques Roston.", "tip": "", "status": "note", "note": "Same question as Q1162."}, {"id": "AOT-1173", "ch": 12, "page": 160, "ansPage": 160, "srcNo": "1174", "exam": "19/06/2024", "q": "Teachers should carefully plan and visualise the use of aid material:", "o": ["To produce effective citizens", "After its actual presentation", "Before its actual presentation", "To collect information of the pupils"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teachers should carefully plan and visualise the use of teaching aid material before its actual presentation. They should be fully familiar with its use and operation, and handle the aid material with enough care so that it is not damaged. Same as Q1145.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1174", "ch": 12, "page": 161, "ansPage": 161, "srcNo": "1175", "exam": "19/06/2024", "q": "Which of the following is NOT a technique of teaching?", "o": ["Drilling technique", "Illustration", "Dramatisation", "Kindergarten"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "'Kindergarten' is not a technique of teaching but refers to a specific educational institution or stage of early childhood education for children. Drilling, illustration and dramatisation are the techniques of teaching. Same as Q1149.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-063", "first": false, "kind": "near", "of": "AOT-1148"}}, {"id": "AOT-1175", "ch": 12, "page": 161, "ansPage": 161, "srcNo": "1176", "exam": "19/06/2024", "q": "The advantage of group discussion is:", "o": ["It highlights the multi-dimensionality of the issue under discussion", "Its availability of equipment under discussion method", "Less equipment and fewer materials are needed by an instructor", "The knowledge gained in this method is directly through the efforts of the child"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Group discussion has these benefits: better communication skills, better analytical thinking, promotes teamwork, increases confidence. It also develops active listening, problem-solving skills and awareness. Under it the multi-dimensionality of the issue is highlighted.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1176", "ch": 12, "page": 161, "ansPage": 161, "srcNo": "1177", "exam": "19/06/2024", "q": "Team teaching leads to the integration of the ______.", "o": ["Curriculum", "Practice", "Flexibility", "Resources"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The credit for the concept of team teaching goes to William Alexander, who is known as the 'father of the American middle school'; he presented it in 1963 at a conference held at Cornell University. Team teaching leads to the integration of the curriculum, in which teachers of different subjects help teach one integrated curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1177", "ch": 12, "page": 161, "ansPage": 161, "srcNo": "1178", "exam": "29/05/2024 S-I", "q": "Examples of audio-visual aids are:", "o": ["TV", "Museum", "Radio", "TV and Museum"], "key": {"printed": [0], "verified": [3], "official": null}, "e": "Audio-visual aids are those instruments and material which present information using both visual and audio elements, e.g. TV, radio, museum, projector, overhead projector.", "tip": "", "status": "disputed", "note": "The printed explanation includes both TV and museum as examples; the option covering both is (d) 'TV and Museum'. Printed key (a) retained; verified answer (d) (arguably; radio is audio only)."}, {"id": "AOT-1178", "ch": 12, "page": 161, "ansPage": 161, "srcNo": "1179", "exam": "29/05/2024 S-I", "q": "While using audio-visual aids in teaching EVS, it should be kept in mind that:", "o": ["It should be topic-specific", "It should be practical", "It should relate principles and topic to daily life", "It should be topic-specific and it should be practical"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "While using audio-visual aids in teaching EVS, it should be kept in mind that it relates to the principles of daily life and to the subject. In teaching EVS, audio-visual aids make the topic clear, help attract students and help them understand.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1179", "ch": 12, "page": 161, "ansPage": 161, "srcNo": "1180", "exam": "29/05/2024 S-I", "q": "Learning in the mother tongue helps a student to ______ what is being taught.", "o": ["Interpret", "Create", "Reproduce", "Easily comprehend"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Learning in the mother tongue helps a student easily comprehend what is being taught. A child's education begins at home in the mother tongue; when a child comes to school and has to learn in a foreign language, the process slows, and continuing to learn in the mother tongue makes learning and understanding easier.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1180", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1181", "exam": "29/05/2024 S-I", "q": "The outline of the contents is:", "o": ["Syllabus", "Programme", "Course", "All of these"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The outline of the contents is the syllabus; it is also included in the outline of the curriculum. A syllabus is a document which describes the outline of subject matter and activities of a specific course or subject, e.g. of a college course or school curriculum.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1181", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1182", "exam": "16/06/2024 S-III", "q": "A chalk board is a kind of teaching aid:", "o": ["Audio-visual", "Visual", "Projected", "Audio"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "A chalk board is a type of teaching aid that comes under the visual category, since it provides the facility to write and draw, so that students can understand information better by seeing it. Same as Q1156.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1182", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1183", "exam": "16/06/2024 S-III", "q": "A teacher took up plants as the theme to teach class IV students. She provided the following learning opportunities: I. Collection of leaves in groups. II. Discussions about shapes, sizes and other features of leaves. III. Making a herbarium. For such activities, what should the teacher NOT encourage the most?", "o": ["Children's initiative to memorise as many names of leaves as possible", "Children's detailing of the work", "Children's continuous engagement with the activity", "Children's interaction with each other, observation and cooperation"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A teacher introducing students to leaves through the three activities of collecting, discussing and making a herbarium should not encourage students to memorise as many names of leaves as possible, since this emphasis on rote learning is not in line with the objectives of the activities, which promote learning through discussion and cooperation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1183", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1184", "exam": "16/06/2024 S-III", "q": "The teacher should select the teaching material in such a way that:", "o": ["He can achieve a high level of mental development", "He can produce citizens capable of living in a democratic society", "He can easily attain the fundamental principles of education", "He can help the learner in his later adjustment with life"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "A teacher should choose the teaching material according to the basic principles of education, so that students can learn easily. It should be ensured that the student understands the basic concepts and rules of the subject clearly, which provides a strong foundation for their further learning and knowledge-building.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1184", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1185", "exam": "18/05/2024 S-III", "q": "Audio-visual aids:", "o": ["Should be small", "Should be large", "Should be heavy", "Should neither be large nor too small"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The size of audio-visual material (audio-visual content) should be balanced. If it is too large it can create difficulty in downloading and streaming; if it is too small the quality may be affected. Hence it should be neither too large nor too small.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1185", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1186", "exam": "18/05/2024 S-III", "q": "An object or device used by a teacher to enhance or enliven classroom instruction is known as:", "o": ["Audio aid", "Visual aid", "Teaching aid", "Activity aid"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The things used by the teacher to enhance or enliven classroom instruction are known as teaching aids (instruments). They are used by the teacher to make lessons understandable, interesting and effective. They may be in audio, visual, activity or other forms, and increase students' understanding and interest.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1186", "ch": 12, "page": 162, "ansPage": 162, "srcNo": "1187", "exam": "18/05/2024 S-III", "q": "Devices can make a lecture more understandable and meaningful. What is the most important thing a teacher should consider in the selection and utilisation of instructional materials?", "o": ["Objectives of the lesson", "Availability of instructional materials", "Attractiveness of instructional materials", "Degree of interest on the part of the students"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The most important thing while selecting teaching material is the objectives of the lesson. The main purpose of the material is to help students reach the course objectives. Even if the material is attractive or available, if it does not match the lesson objectives it will not be effective.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1187", "ch": 12, "page": 163, "ansPage": 163, "srcNo": "1188", "exam": "14/06/2024 S-III", "q": "Why is 'learning by doing' important?", "o": ["It develops interest among children", "Maintains discipline", "Keeps children busy", "Promotes meaningful learning"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Learning by doing is important because it creates curiosity and interest in learning among children. When a child learns by acting himself, he takes deep interest in the subject and can remember information for a longer time.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1188", "ch": 12, "page": 163, "ansPage": 163, "srcNo": "1189", "exam": "14/06/2024 S-III", "q": "Audio-visual aids should help in achieving:", "o": ["Success", "Fame", "The teaching objectives", "Wealth"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The use of audio-visual material is mainly done to help in achieving the objectives of teaching. This material helps students understand concepts better, make learning more attractive and effectively fulfil the objectives of teaching.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1189", "ch": 12, "page": 163, "ansPage": 163, "srcNo": "1190", "exam": "14/06/2024 S-III", "q": "According to the principle of selection, a teacher should take care of:", "o": ["The opinion of his colleagues", "Appropriate and wide selection of audio-visual material", "The assessment of the pupils", "The selection of learners"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "According to the principle of selection, a teacher should ensure that he makes a suitable and wide selection of audio-visual material for teaching, with the use of various types of audio-visual material carefully selected. This improves students' learning experience.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1190", "ch": 12, "page": 163, "ansPage": 163, "srcNo": "1191", "exam": "19/05/2024 S-III", "q": "A teacher uses audio-visual aids and physical activities in her teaching because they:", "o": ["Utilise the maximum number of senses to enhance learning", "Provide relief to the teacher", "Facilitate effective assessment", "Provide a diversion to learners"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A teacher uses audio-visual aids and physical activities in her teaching because they use the maximum number of senses in the learning process. When students see, hear, do and learn, they understand and remember the information better. This method makes learning more effective, attractive and lasting.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1191", "ch": 12, "page": 163, "ansPage": 163, "srcNo": "1192", "exam": "19/05/2024 S-III", "q": "A teaching aid is anything used by a teacher to help teach a lesson or make it more ______.", "o": ["For students", "For teachers", "For parents", "For principals"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teaching aid material is mainly used for students. Teachers use it to make the lesson simple, understandable and interesting so that students can learn in a better way; the material helps students understand concepts more effectively, which makes the learning experience attractive and lasting.", "tip": "", "status": "note", "note": "Stem is incomplete in the source (reads 'to help teach a lesson or make it more ___')."}, {"id": "AOT-1192", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1193", "exam": "05/09/2023 S-III", "q": "The main principle of student-centred education is:", "o": ["Learning by doing", "Learning by imitating", "Learning by writing", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main principle of student-centred education is learning by doing. Learning by doing is the process in which people feel their own experiences, especially those experiences which they get by being actively engaged in making things and discovering the world.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1193", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1194", "exam": "08/09/2023 S-I", "q": "The benefit of hands-on learning is:", "o": ["To learn new skills", "To encourage interaction with nature", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "The benefit of hands-on learning is that it encourages learning new skills and interaction with nature. In hands-on learning, children learn by doing something themselves and gaining experience; this is particularly important in the early years.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1194", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1195", "exam": "05/09/2023 S-I", "q": "The linguaphone is an example of:", "o": ["Visual aid", "Audio aid", "Audio-visual aid", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The linguaphone is an audio instrument. 'Audio instrument' means supportive teaching material in which only the ears are used to make learning easy. Examples: oral question-answer, radio, tape recorder, language laboratory, audio conferencing, gramophone.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1195", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1196", "exam": "05/09/2023 S-I", "q": "Moral values can be developed more effectively among students when teachers:", "o": ["Talk repeatedly about values", "Practise them themselves", "Narrate stories of great people", "Talk about gods and goddesses"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Moral values can be developed more effectively among students when the teacher practises them himself. Moral values provide general direction by which one can justify between right and wrong.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1196", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1197", "exam": "13/09/2023 S-I", "q": "Dienes blocks are used for:", "o": ["Addition", "Subtraction", "Both of the above", "None of the above"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "Teaching aid material is an important component of the teaching-learning process which helps the teacher make a particular lesson/unit interesting. Dienes blocks are used in mathematics teaching, also known as multi-base arithmetic blocks (MAB), and are mainly used for learning basic mathematical concepts such as addition, subtraction, number, counting and place value.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1197", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1198", "exam": "09/09/2023 S-I", "q": "The radio is a type of teaching material:", "o": ["Visual", "Audio", "Audio-visual", "None of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "The radio is a type of audio teaching material. The radio is a good medium for teaching language and literature. Audio means supportive material in which only the ears are used, such as oral question-answer, radio, gramophone, etc. The radio is a cheap and easily available device for both formal and informal education.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1198", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1199", "exam": "09/09/2023 S-I", "q": "Which one is NOT related to the co-curricular area?", "o": ["Moral development", "Physical development", "Mental development", "Interest development"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Co-curricular activities make teaching interesting and comprehensible. Without co-curricular activities in a school, studies become dull; for the all-round development of students it is necessary that co-curricular activities be emphasised. Moral development, physical development, mental development and social development relate to the co-curricular field.", "tip": "", "status": "note", "note": "Option (d) 'interest development' is the exception per the printed key."}, {"id": "AOT-1199", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1200", "exam": "10/09/2023 S-I", "q": "A three-dimensional teaching material is:", "o": ["Blackboard", "Model", "Chart", "All of the above"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Three-dimensional supportive material is used very effectively as teaching aid material. A model is an effective teaching material: it is a concrete representation of any subject, and its size is adjusted to see it easily and conveniently.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1200", "ch": 12, "page": 164, "ansPage": 164, "srcNo": "1201", "exam": "10/09/2023 S-I", "q": "The basic principles of counselling are:", "o": ["Autonomy", "Justice", "Fidelity", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Counselling is based on individual differences. It tries to make every person self-directed and takes much interest in the individual problems of the available. The basic principles of counselling include autonomy, beneficence, justice and fidelity.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1201", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1202", "exam": "13/09/2023 S-I", "q": "Dimensional (three-dimensional) teaching material is:", "o": ["Model", "Chart", "Object", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Dimensional teaching material is very effective as teaching aid material. All types of audio-visual dimensional teaching material are closest to living experiences. Model, chart and object are all dimensional teaching material. Teaching aid material helps facilitate learning in various ways; teachers use various teaching aids to listen attentively and with interest.", "tip": "", "status": "note", "note": "Same family as Q1200; printed keys differ (b vs d) because the option sets differ."}, {"id": "AOT-1202", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1203", "exam": "13/09/2023 S-I", "q": "Into how many parts did Maslow divide human needs?", "o": ["Three categories", "Five categories", "Four categories", "Six categories"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Maslow's hierarchy of needs is a theory of human motivation which tells that behaviour is driven by needs which are progressively complex. It is generally shown as a pyramid; the most basic needs form the base and complex needs are at the top. The five levels: physiological needs, safety and security, love and belonging, esteem, and self-actualisation.", "tip": "Maslow: Physiological - Safety - Love/Belonging - Esteem - Self-actualisation.", "status": "ok", "note": "", "dup": {"group": "DUP-016", "first": false, "kind": "exact", "of": "AOT-0240"}}, {"id": "AOT-1203", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1204", "exam": "13/09/2023 S-I", "q": "Circles, spheres and other toys were given as gifts in education by:", "o": ["Rousseau", "Pestalozzi", "Froebel", "Montessori"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "In Froebel's education, circles, spheres and other toys were gifts. The kindergarten method was propounded by Froebel. From Froebel's point of view, the main aim of education is to make children aware of their divine nature and the unity of the world; according to him, play is the natural way through which children discover the world and understand it.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1204", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1205", "exam": "13/09/2023 S-I", "q": "An activity suitable for developing cooperation and team spirit is:", "o": ["Art", "Debate", "Quiz", "Project work"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Project work is the most suitable activity for developing cooperation and team spirit. Project work is generally developed in those groups where students can learn many things, such as working together, problem-solving, decision-making and testing activities. Hence such feelings are developed by project work.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1205", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1206", "exam": "13/09/2023 S-I", "q": "The audio-visual aid facility is:", "o": ["Multi-sensory", "Visual only", "Audio only", "None of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Audio-visual material is 'those devices which we can see with the eyes and can hear sounds related to them with the ears; those processes in which both the visual and hearing senses take active part' - it provides a multi-sensory facility. It includes all the devices which make students interested in the lesson, so that they can understand it easily and attain the objectives of learning.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1206", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1207", "exam": "13/09/2023 S-I", "q": "A portfolio is a tool:", "o": ["A collection of the student's work over a period of time", "A collection of the student's marks over a period of time", "A collection of the student's grades over a period of time", "All of the above"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A portfolio is a tool that collects the work of students over a period of time. It is a systematic and organised collection of evidence used by the teacher and the student to monitor the development of the student's knowledge, skills and attitudes in a specific subject area. Same as Q893.", "tip": "", "status": "ok", "note": "", "dup": {"group": "DUP-054", "first": false, "kind": "near", "of": "AOT-0891"}}, {"id": "AOT-1207", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1208", "exam": "13/09/2023 S-I", "q": "The use of teaching aid material is justified on the basis of:", "o": ["Adapting to the learning outcomes of students", "Attracting the attention of students in the classroom", "Reducing problems of indiscipline in the classroom", "Effective participation of students in learning tasks"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The use of teaching aid material is justified on the basis of the effective participation of students in learning tasks. The main aim of teaching aid material is to adapt to the learning outcomes of students. Teaching aids are tools which are used by teachers to help students understand concepts easily and efficiently.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1208", "ch": 12, "page": 165, "ansPage": 165, "srcNo": "1209", "exam": "14/09/2023 S-I", "q": "The goal of teaching is:", "o": ["To provide information", "To engage students in action", "To create integrated knowledge", "To bring desired change in behaviour"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "The goals of teaching include: shaping the behaviour of the learner in the desired direction; recognising and developing latent talent in the learner and enhancing their natural desire to learn; enabling learners to live in harmony with their environment; and helping those who learn to identify and apply strategies of learning. Hence option (d) is correct.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1209", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1210", "exam": "15/09/2023 S-I", "q": "Why should real objects be shown as teaching aid material?", "o": ["It encourages interest", "To increase curiosity", "It increases participation", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "Showing real objects, such as when a teacher is teaching about plants, lets him show students the actual plants. It helps students understand the various types of plants and their parts. Students become more interested and curious; when they work with real plants, they learn more and take care of plants. It increases students' interest, curiosity and participation.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1210", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1211", "exam": "18/09/2023 S-I", "q": "Knowledge related to facts is:", "o": ["Conceptual knowledge", "Metacognitive knowledge", "Procedural knowledge", "Factual knowledge"], "key": {"printed": [2], "verified": [3], "official": null}, "e": "As printed: knowledge related to fact is procedural knowledge. Procedural knowledge is the knowledge gained through some implicit experience; one advantage of procedural knowledge is that it can include more senses, such as practical experience, practice in solving problems and understanding limits of a specific solution.", "tip": "", "status": "disputed", "note": "Printed key (c) 'procedural' does not fit the stem: knowledge related to facts is FACTUAL knowledge (d). Printed key retained; verified answer (d)."}, {"id": "AOT-1211", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1212", "exam": "09/09/2020 S-III", "q": "One essential feature of a good teaching aid material is:", "o": ["Low cost", "Popular", "Involving participation of maximum senses", "Easy to handle"], "key": {"printed": [2], "verified": [2], "official": null}, "e": "An essential feature of good teaching aid material is the participation of the maximum number of senses. It helps make the teaching-learning programme effective. It helps students understand and retain concepts in a better way and for a long time, and helps teachers present lessons effectively.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1212", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1213", "exam": "09/09/2020 S-I", "q": "Teaching learning material:", "o": ["It makes the teaching process interesting and easy", "An easy way to keep children busy when there is no teacher in the classroom", "Its role in the language classroom is not important", "Expensive and durable teaching learning materials are considered superior"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Teaching-learning materials (TLM) are those materials which teachers use to make their lessons effective and to keep students actively involved. These include charts, models, video clips, etc. Importance of TLM: it keeps students active and disciplined; difficult subjects can be understood easily through it; it helps in shaping the thinking of students.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1213", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1214", "exam": "15/09/2020 S-III", "q": "Which one would be the most effective medium in facilitating learning?", "o": ["A sound and visual film", "A visual film with the teacher's explanation", "A sound tape with the teacher's notes", "All the above are equally effective"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "A sound and visual film (audio-visual) is the most effective way of facilitating learning. Audio-visual material is an instrument that helps teachers present concepts to increase students' interest and make them more attractive and motivating.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1214", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1215", "exam": "10/09/2020 S-II", "q": "Which of the following is related to teaching skill?", "o": ["Blackboard writing", "Solving questions", "Asking questions", "All of the above"], "key": {"printed": [3], "verified": [3], "official": null}, "e": "In the words of B. K. Passi and Lalita, 'teaching skills are those teaching-related activities and behaviours which are performed with the aim of facilitating learning of students'. Effective teachers must have skills and capabilities that distinguish them from non-professionals. Blackboard writing, solving questions and asking questions are all related to teaching skills.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1215", "ch": 12, "page": 166, "ansPage": 166, "srcNo": "1216", "exam": "10/09/2020 S-II", "q": "Why do teachers use teaching aids?", "o": ["To make teaching fun-filled", "To teach within the understanding level of students (to increase students' receptivity)", "For students' attention", "To make students disciplined"], "key": {"printed": [1], "verified": [1], "official": null}, "e": "Teaching aid material helps students learn in different ways. The teacher uses teaching aids for his students to increase their receptivity. In traditional teaching aid materials the blackboard, posters, globe and textbooks are included; with the development of technology, teaching aid material has also improved a lot and is classified into audio aids, visual aids and mechanical teaching aids.", "tip": "", "status": "note", "note": "The English line of option (b) reads 'teach within the understanding level of students' while the Hindi reads 'to increase students' receptivity'; the printed explanation follows the Hindi."}, {"id": "AOT-1216", "ch": 12, "page": 167, "ansPage": 167, "srcNo": "1217", "exam": "15/09/2020 S-III", "q": "Which o ructional materials?", "o": ["The teacher", "Principal/headmaster", "Committee of experts", "Head of department"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "Educational material should be selected by the teacher. Good educational material can increase the quality of education and improve students' results. They provide resources and ideas to the teachers for effective guidance of learning activities.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1222", "ch": 12, "page": 168, "ansPage": 168, "srcNo": "1223", "exam": "15/09/2020 S-I", "q": "The main purpose of a parent-teacher association is to:", "o": ["Involve parents for improvement of school functioning", "Share understanding of the problem faced by teachers", "Keep students in control", "For construction of a building"], "key": {"printed": [0], "verified": [0], "official": null}, "e": "The main purpose of the Parent-Teacher Association (PTA) is to involve parents in improving the functioning of the school. The PTA works as a link between parents and teachers and facilitates communication and cooperation between them.", "tip": "", "status": "ok", "note": ""}, {"id": "AOT-1223", "ch": 12, "page": 168, "ansPage": 168, "srcNo": "1224", "exam": "15/09/2020 S-I", "q": "Teaching-learning materials (TLM) are useful because they:", "o": ["Help teachers work", "Help students to be attentive", "Activate all senses", "Make learning more meaningful"], "key": {"printed": [2, 3], "verified": [2, 3], "official": null}, "e": "The materials which the teacher uses to understand the lesson well are called teaching materials or 'teaching-learning aid material'. They are useful because they activate all senses and make teaching purposeful.", "tip": "", "status": "note", "note": "Printed key is '(c/d)': the book accepts both (c) and (d). Both are recorded (alt = d)."}, {"id": "AOT-1224", "ch": 12, "page": 168, "ansPage": 168, "srcNo": "1225", "exam": "16/09/2020 S-I", "q": "A good educational programme i <script>/* Pure logic for the CBT mock test: no DOM access, so it can be unit-tested in Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AOTLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const LETTERS = 'ABCDEFGH';
  const WEAK_ACCURACY = 60; // percent: below this a chapter is flagged for revision

  function validateBank(bank) {
    const errors = [];
    if (!bank || !Array.isArray(bank.questions) || !Array.isArray(bank.chapters)) {
      return ['Question bank is missing or malformed.'];
    }
    const ids = new Set();
    const chapterIds = new Set(bank.chapters.map((c) => c.id));
    const counts = {};
    for (const q of bank.questions) {
      if (!q.id || ids.has(q.id)) errors.push('Duplicate or missing id: ' + q.id);
      ids.add(q.id);
      if (!chapterIds.has(q.ch)) errors.push(q.id + ': unknown chapter ' + q.ch);
      counts[q.ch] = (counts[q.ch] || 0) + 1;
      if (!q.q || !String(q.q).trim()) errors.push(q.id + ': empty question');
      if (!Array.isArray(q.o) || q.o.length < 2 || q.o.some((o) => !String(o).trim())) errors.push(q.id + ': invalid options');
      if (!q.e || !String(q.e).trim()) errors.push(q.id + ': missing explanation');
      const key = q.key || {};
      for (const mode of ['printed', 'verified']) {
        const arr = key[mode];
        if (!Array.isArray(arr)) errors.push(q.id + ': key.' + mode + ' missing');
        else if (arr.some((i) => !Number.isInteger(i) || i < 0 || i >= (q.o || []).length)) errors.push(q.id + ': key.' + mode + ' out of range');
      }
      if (!key.verified || !key.verified.length) errors.push(q.id + ': no usable answer key');
    }
    for (const c of bank.chapters) {
      if ((counts[c.id] || 0) !== c.count) errors.push('Chapter ' + c.id + ' count mismatch: header ' + c.count + ' vs actual ' + (counts[c.id] || 0));
    }
    if (bank.meta && bank.meta.total !== bank.questions.length) errors.push('meta.total does not match question count');
    return errors;
  }

  /** Accepted option indices for scoring under a key mode ('printed' | 'verified'). */
  function keysFor(q, mode) {
    const k = q.key[mode === 'verified' ? 'verified' : 'printed'];
    return k && k.length ? k : q.key.verified;
  }

  function shuffle(arr, rng) {
    const a = arr.slice();
    const rand = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** Questions of the chosen chapters in bank order; optionally keep only the first copy of each repeated question. */
  function buildPool(bank, chapterIds, skipRepeats) {
    const want = new Set(chapterIds);
    const seen = new Set();
    const out = [];
    for (const q of bank.questions) {
      if (!want.has(q.ch)) continue;
      if (skipRepeats && q.dup) {
        if (seen.has(q.dup.group)) continue;
        seen.add(q.dup.group);
      }
      out.push(q);
    }
    return out;
  }

  /** Choose ids for a test. The master bank is never modified. */
  function pickQuestions(pool, opts) {
    const n = Math.max(1, Math.min(pool.length, opts.count || pool.length));
    const src = opts.random ? shuffle(pool, opts.rng) : pool;
    return src.slice(0, n).map((q) => q.id);
  }

  /** nv: not visited, na: visited but not answered, a: answered, m: marked, am: answered and marked. */
  function statusOf(sess, id) {
    const answered = sess.resp[id] !== undefined;
    const marked = !!sess.mark[id];
    if (answered && marked) return 'am';
    if (marked) return 'm';
    if (answered) return 'a';
    return sess.vis[id] ? 'na' : 'nv';
  }

  function countStatuses(sess) {
    const c = { nv: 0, na: 0, a: 0, m: 0, am: 0 };
    for (const id of sess.qids) c[statusOf(sess, id)]++;
    return c;
  }

  function evaluate(sess, byId, keyMode) {
    const rows = sess.qids.map((id, i) => {
      const q = byId.get(id);
      const r = sess.resp[id];
      const attempted = r !== undefined;
      const keys = keysFor(q, keyMode);
      return { n: i + 1, q, chosen: r, attempted, correct: attempted && keys.includes(r), keys, marked: !!sess.mark[id] };
    });
    const total = rows.length;
    const attempted = rows.filter((r) => r.attempted).length;
    const correct = rows.filter((r) => r.correct).length;
    const incorrect = attempted - correct;
    const mc = sess.marks.c, mn = sess.marks.n;
    const score = Math.round((correct * mc - incorrect * mn) * 100) / 100;
    const perChapter = {};
    for (const r of rows) {
      const c = (perChapter[r.q.ch] = perChapter[r.q.ch] || { ch: r.q.ch, total: 0, attempted: 0, correct: 0, incorrect: 0, unattempted: 0, marks: 0 });
      c.total++;
      if (!r.attempted) c.unattempted++;
      else if (r.correct) { c.attempted++; c.correct++; c.marks += mc; }
      else { c.attempted++; c.incorrect++; c.marks -= mn; }
    }
    for (const c of Object.values(perChapter)) {
      c.marks = Math.round(c.marks * 100) / 100;
      c.accuracy = c.attempted ? Math.round((c.correct / c.attempted) * 1000) / 10 : null;
    }
    return {
      rows, total, attempted, unattempted: total - attempted, correct, incorrect,
      accuracy: attempted ? Math.round((correct / attempted) * 1000) / 10 : 0,
      score, maxScore: Math.round(total * mc * 100) / 100, perChapter,
    };
  }

  /** Chapters to revise: attempted with accuracy below the threshold, weakest first. Unattempted chapters are listed separately. */
  function weakChapters(perChapter) {
    const list = Object.values(perChapter);
    return {
      weak: list.filter((c) => c.attempted > 0 && c.accuracy < WEAK_ACCURACY).sort((a, b) => a.accuracy - b.accuracy),
      untouched: list.filter((c) => c.attempted === 0),
    };
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const p = (x) => String(x).padStart(2, '0');
    return (h ? p(h) + ':' : '') + p(m) + ':' + p(s);
  }

  function readableBank(bank) {
    const out = [bank.meta.title, 'Source: ' + bank.meta.source, 'Total questions: ' + bank.questions.length, ''];
    for (const c of bank.chapters) {
      out.push('=== Chapter ' + c.id + ': ' + c.name + ' (' + c.count + ' questions) ===', '');
      for (const q of bank.questions.filter((x) => x.ch === c.id)) {
        out.push(q.id + '  [PDF p.' + q.page + ', source Q' + q.srcNo + ']', q.q);
        q.o.forEach((o, i) => out.push('  (' + LETTERS[i] + ') ' + o));
        const fmt = (a) => a.map((i) => '(' + LETTERS[i] + ')').join(', ');
        out.push('Printed answer: ' + (q.key.printed.length ? fmt(q.key.printed) : 'none printed'));
        if (JSON.stringify(q.key.printed) !== JSON.stringify(q.key.verified)) out.push('Verified answer: ' + fmt(q.key.verified));
        out.push('Explanation: ' + q.e);
        if (q.tip) out.push('Tip: ' + q.tip);
        if (q.note) out.push('Review note: ' + q.note);
        out.push('');
      }
    }
    return out.join('\n');
  }

  return { LETTERS, WEAK_ACCURACY, validateBank, keysFor, shuffle, buildPool, pickQuestions, statusOf, countStatuses, evaluate, weakChapters, fmtTime, readableBank };
});
</script>

  const STATUS_LABEL = { nv: 'Not Visited', na: 'Not Answered', a: 'Answered', m: 'Marked for Review', am: 'Answered & Marked for Review' };
  const $ = (s, r) => (r || document).querySelector(s);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, v);
      }
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      if (c.nodeType) e.append(c);
      else if (typeof c === 'string' && c.indexOf('^') !== -1) e.append(...rich(c));
      else e.append(document.createTextNode(String(c)));
    }
    return e;
  }
  /* "x^2" and "3^(4n+2)" become real superscripts */
  const EXP = /\^(\([^()]*\)|[+\-−]?[A-Za-z0-9]+(?:\.[0-9]+)?)/g;
  function rich(text) {
    const out = []; let last = 0, m;
    EXP.lastIndex = 0;
    while ((m = EXP.exec(text))) {
      if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
      const sup = document.createElement('sup');
      sup.textContent = m[1][0] === '(' ? m[1].slice(1, -1) : m[1];
      out.push(sup);
      last = EXP.lastIndex;
    }
    if (last < text.length) out.push(document.createTextNode(text.slice(last)));
    return out;
  }
  const say = (m) => { $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = m; }, 30); };
  const pct = (x) => (x == null ? '–' : x.toFixed(1).replace(/\.0$/, '') + '%');

  /* ---------- bank validation ---------- */
  const bankErrors = L.validateBank(BANK);
  const byId = new Map((BANK && BANK.questions ? BANK.questions : []).map((q) => [q.id, q]));
  const chapterById = new Map((BANK && BANK.chapters ? BANK.chapters : []).map((c) => [c.id, c]));

  /* ---------- storage ---------- */
  let storageOK = true;
  const DEFAULT_SETTINGS = { mode: 'practice', keyMode: 'printed', marksC: 1, marksN: 0, random: false, skipRepeats: false, custom: false, customN: 50, minutes: null, chapters: [] };
  function freshStore() { return { v: 1, settings: Object.assign({}, DEFAULT_SETTINGS, { chapters: BANK.chapters.map((c) => c.id) }), history: [], attempted: {}, session: null }; }
  function validSession(s) {
    return s && Array.isArray(s.qids) && s.qids.length && s.qids.every((id) => byId.has(id)) && s.resp && s.vis && s.mark && s.revealed && s.marks && Number.isInteger(s.idx) && s.idx >= 0 && s.idx < s.qids.length;
  }
  function normalizeStore(o) {
    const base = freshStore();
    if (!o || typeof o !== 'object') return base;
    const s = Object.assign({}, base.settings, o.settings || {});
    s.chapters = (Array.isArray(s.chapters) ? s.chapters : []).filter((c) => chapterById.has(c));
    base.settings = s;
    base.history = (Array.isArray(o.history) ? o.history : []).filter(validSession).slice(0, HISTORY_MAX);
    const att = {};
    for (const [id, v] of Object.entries(o.attempted || {})) if (byId.has(id) && v && typeof v === 'object') att[id] = { n: +v.n || 1, c: v.c ? 1 : 0 };
    base.attempted = att;
    base.session = validSession(o.session) && !o.session.done ? o.session : null;
    return base;
  }
  function loadStore() {

  }
  let store = bankErrors.length ? null : loadStore();
  function save() {

  }
  function showBanner(msg, error) { const b = $('#banner'); b.textContent = msg; b.className = 'banner' + (error ? ' error' : ''); b.hidden = !msg; }

  /* ---------- dialog / download ---------- */
  function confirmDialog(o) {

      const d = $('#dlg');
      $('#dlg-title').textContent = o.title;

      const ok = $('#dlg-ok'), ca = $('#dlg-cancel');
      ok.textContent = o.ok || 'OK'; ok.className = 'btn ' + (o.danger ? 'danger' : 'primary');
      ca.textContent = o.cancel || 'Cancel'; ca.hidden = !!o.hideCancel;
      let done = false;
      const fin = (v) => { if (done) return; done = true; d.onclose = null; d.oncancel = null; $('#dlg-form').onsubmit = null; if (d.open) d.close(); resolve(v); };
      ca.onclick = () => fin(false);
      $('#dlg-form').onsubmit = (e) => { e.preventDefault(); fin(true); };
      d.oncancel = () => fin(false);
      d.onclose = () => fin(false);
      d.showModal();
      ok.focus();
    });
  }
  function download(name, text, type) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });

    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  /* ---------- view switching ---------- */
  let timerId = null, submitting = false;
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  let popping = false;
  function setBack(view) {
    const b = $('#back'); if (!b) return;

    b.textContent = view === 'test' ? '‹ Exit test' : '‹ Dashboard';
    b.setAttribute('href', '#');
    b.onclick = async (e) => {
      e.preventDefault();

      renderDashboard();

  }
  function show(view) {
    for (const v of ['dashboard', 'test', 'result']) $('#view-' + v).hidden = v !== view;
    if (view !== 'test') stopTimer();

  /* ================= DASHBOARD ================= */
  function chapterProgress() {
    const out = {};
    for (const c of BANK.chapters) out[c.id] = { att: 0, ok: 0 };
    for (const [id, v] of Object.entries(store.attempted)) { const q = byId.get(id); out[q.ch].att++; out[q.ch].ok += v.c; }
    return out;
  }
  function currentPool() {
    const S = store.settings;
    return L.buildPool(BANK, S.chapters, S.skipRepeats);
  }

  function renderDashboard() {

      root.append(h('div', { class: 'notice' },
        h('strong', null, 'You have a test in progress. '),
        `${s.mode === 'mock' ? 'Full mock' : 'Practice'} test, ${answered} of ${s.qids.length} answered. `,
        s.endAt ? 'The timer keeps running while you are away. ' : '',
        h('div', { class: 'btn-row', style: 'margin-top:8px' },
          h('button', { class: 'btn primary', onclick: resumeTest }, 'Resume test'),
          h('button', { class: 'btn', onclick: discardSession }, 'Discard it'))));
    }
    if (!storageOK) root.append(h('div', { class: 'notice warn' }, 'Progress cannot be saved in this browser session (private window or blocked storage). Use Export progress to keep your results.'));

    root.append(h('div', { class: 'grid stats' },
      stat(BANK.questions.length, 'Total questions'),
      stat(BANK.chapters.length, 'Chapters'),

      stat(BANK.questions.length - attemptedN, 'Not yet attempted')));

    // builder
    const chapRows = BANK.chapters.map((c) => {
      const p = prog[c.id];
      return h('tr', null,
        h('td', null, h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'ch-' + c.id, checked: S.chapters.includes(c.id), onchange: onChapterToggle }),
          h('span', null, h('strong', null, 'Ch ' + c.id + '. '), c.name))),
        h('td', { class: 'num' }, c.count),
        h('td', { class: 'num' }, p.att ? `${p.att}` : '0'),
        h('td', { class: 'num' }, p.att ? pct((p.ok / p.att) * 100) : '–'));
    });
    const builder = h('div', { class: 'card', id: 'builder' },
      h('h2', null, 'Build your test'),
      h('fieldset', null, h('legend', null, '1. Chapters'),
        h('div', { class: 'btn-row', style: 'margin-bottom:8px' },
          h('button', { class: 'btn small', type: 'button', onclick: () => setChapters(BANK.chapters.map((c) => c.id)) }, 'Select all chapters'),
          h('button', { class: 'btn small', type: 'button', onclick: () => setChapters([]) }, 'Clear')),
        h('div', { class: 'table-wrap' }, h('table', null,
          h('thead', null, h('tr', null, h('th', null, 'Chapter'), h('th', { class: 'num' }, 'Questions'), h('th', { class: 'num' }, 'Attempted'), h('th', { class: 'num' }, 'Last-attempt accuracy'))),
          h('tbody', null, chapRows)))),

      h('fieldset', null, h('legend', null, '3. Length and order'),
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'custom', checked: S.custom, onchange: onField }), h('span', null, 'Custom length (use only some of the selected questions)')),
        h('div', { class: 'field', style: 'margin-top:8px' }, h('label', { for: 'customN' }, 'Number of questions'), h('input', { type: 'number', id: 'customN', min: 1, step: 1, value: S.customN, oninput: onField })),
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'random', checked: S.random, onchange: onField }), h('span', null, 'Randomise question order (off = bank order; options are never shuffled)')),
        h('label', { class: 'chk', style: 'margin-top:6px' }, h('input', { type: 'checkbox', id: 'skipRepeats', checked: S.skipRepeats, onchange: onField }), h('span', null, 'Skip repeated copies of the same question (keeps the first copy in your selection)')),
        h('p', { class: 'hint', id: 'lenHint', style: 'margin-top:6px' })),

          h('div', { class: 'field' }, h('label', { for: 'marksC' }, 'Marks per correct answer'), h('input', { type: 'number', id: 'marksC', min: 0, step: 0.25, value: S.marksC, oninput: onField })),
          h('div', { class: 'field' }, h('label', { for: 'marksN' }, 'Negative marks per wrong answer'), h('input', { type: 'number', id: 'marksN', min: 0, step: 0.25, value: S.marksN, oninput: onField }))),

          h('button', { class: 'btn small danger', onclick: resetAll }, 'Reset my progress')),

  }

  function presetsCard() {
    const bestWeak = (() => {
      const p = chapterProgress();
      const list = BANK.chapters.filter((c) => p[c.id].att >= 3).map((c) => ({ c, acc: p[c.id].ok / p[c.id].att })).sort((a, b) => a.acc - b.acc);
      return list.length && list[0].acc < 0.7 ? list[0].c : null;
    })();
    const tile = (title, sub, onclick, primary) => h('button', { class: 'tile' + (primary ? ' primary' : ''), type: 'button', onclick }, h('strong', null, title), h('span', null, sub));
    return h('div', { class: 'card presets' },
      h('h2', null, 'Start now'),
      h('div', { class: 'tiles' },
        tile('Quick practice', '20 random questions, instant answers, no timer', () => startPreset('quick'), true),
        tile('Full mock test', 'Up to 100 questions, timed, answers after submit', () => startPreset('mock')),
        bestWeak ? tile('Fix my weak chapter', 'Ch ' + bestWeak.id + ': ' + bestWeak.name, () => startPreset('weak', bestWeak.id)) : tile('Practice by chapter', 'Pick chapters below', () => { const b = document.getElementById('builder'); if (b) b.scrollIntoView({ behavior: 'smooth' }); })),
      h('p', { class: 'hint' }, 'Want to choose chapters, length or marking? Use "Build your test" below.'));
  }
  async function startPreset(kind, chapterId) {
    const S = store.settings;
    const all = chapterId ? [chapterId] : BANK.chapters.map((c) => c.id);
    const pool = L.buildPool(BANK, all, true);
    if (!pool.length) return;
    if (store.session && !(await confirmDialog({ title: 'Replace the test in progress?', body: 'Starting a new test will discard the unfinished one.', ok: 'Start new test', danger: true }))) return;
    const n = Math.min(kind === 'mock' ? 100 : 20, pool.length);
    beginSession({ mode: kind === 'mock' ? 'mock' : 'practice', keyMode: S.keyMode, minutes: n, marksC: S.marksC, marksN: S.marksN, qids: L.pickQuestions(pool, { count: n, random: true }) });
  }

      }))));
  }

  function setChapters(ids) { store.settings.chapters = ids; save(); for (const c of BANK.chapters) { const b = $('#ch-' + c.id); if (b) b.checked = ids.includes(c.id); } refreshSummary(); }
  function onChapterToggle() { store.settings.chapters = BANK.chapters.filter((c) => $('#ch-' + c.id).checked).map((c) => c.id); save(); refreshSummary(); }
  function num(id, dflt, min) { const v = parseFloat($('#' + id).value); return Number.isFinite(v) && v >= min ? v : dflt; }
  function onField() {
    const S = store.settings;
    S.mode = (document.querySelector('input[name=mode]:checked') || {}).value || 'practice';
    S.custom = $('#custom').checked; S.random = $('#random').checked; S.skipRepeats = $('#skipRepeats').checked; S.keyMode = $('#keyMode').value;
    S.customN = Math.max(1, Math.floor(num('customN', S.customN, 1)));

    save(); refreshSummary();
  }
  function plan() {
    const S = store.settings, pool = currentPool();
    const n = S.custom ? Math.min(S.customN, pool.length) : pool.length;
    const minutes = S.minutes || Math.max(1, n);
    return { S, pool, n, minutes };
  }
  function refreshSummary() {
    const { S, pool, n, minutes } = plan();
    $('#customN').disabled = !S.custom;
    $('#minutes').disabled = S.mode !== 'mock';
    $('#minutes').placeholder = String(Math.max(1, n));
    if (document.activeElement !== $('#minutes')) $('#minutes').value = S.minutes || '';
    const lens = S.custom && pool.length > 0
      ? (S.random ? `${n} questions will be sampled at random from ${pool.length} available.` : `The first ${n} of ${pool.length} available questions (in bank order) will be used. Turn on randomise to sample across them.`)
